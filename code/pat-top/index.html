<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PAT TOP 题库题面、解题思路与 C++ 参考答案工作台">
  <title>PAT (Top Level) Practice</title>
  <link rel="shortcut icon" href="/img/favicon.ico">
  <script>
    try {
      var savedPatTheme = localStorage.getItem('ruiqy.daily.doki-theme.v1')
      var patThemes = ['emilia-light', 'beatrice', 'echidna', 'inori-light', 'nao-light']
      if (patThemes.indexOf(savedPatTheme) !== -1) document.documentElement.setAttribute('data-pat-theme', savedPatTheme)
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="/css/doki-global-theme@1.0.0.css?v=1.3.5">
  <style>
:root {
  --pat-bg: #f4f6f8;
  --pat-panel: #ffffff;
  --pat-line: #e2e7eb;
  --pat-text: #202a32;
  --pat-muted: #74808a;
  --pat-blue: #3578d4;
  --pat-blue-soft: #edf4ff;
  --pat-green: #288566;
  --pat-amber: #b87520;
  --pat-amber-soft: #fff7e9;
  --pat-editor: #17212b;
  --pat-editor-line: #263544;
  --pat-editor-text: #dce7ef;
}

:root[data-pat-theme="emilia-light"] {
  color-scheme: light;
  --pat-bg: #f7effd;
  --pat-panel: rgba(255, 251, 255, .91);
  --pat-line: #e6d8ef;
  --pat-text: #493f50;
  --pat-muted: #897a91;
  --pat-blue: #7d61ad;
  --pat-blue-soft: #eee6fa;
  --pat-green: #248b73;
  --pat-amber: #b77b34;
  --pat-amber-soft: #fff0df;
  --pat-wallpaper: url('/daily/doki/backgrounds/emilia_light.png');
}

:root[data-pat-theme="beatrice"] {
  color-scheme: light;
  --pat-bg: #fff0f7;
  --pat-panel: rgba(255, 250, 253, .91);
  --pat-line: #efd5e2;
  --pat-text: #553f4b;
  --pat-muted: #957886;
  --pat-blue: #c95d94;
  --pat-blue-soft: #fde6f1;
  --pat-green: #288d78;
  --pat-amber: #c67827;
  --pat-amber-soft: #fff0dc;
  --pat-wallpaper: url('/daily/doki/backgrounds/beatrice.png');
}

:root[data-pat-theme="echidna"] {
  color-scheme: dark;
  --pat-bg: #141216;
  --pat-panel: rgba(25, 23, 28, .92);
  --pat-line: #34363a;
  --pat-text: #f5f2f5;
  --pat-muted: #b7afb8;
  --pat-blue: #75aaab;
  --pat-blue-soft: #28383b;
  --pat-green: #75aaab;
  --pat-amber: #d5be79;
  --pat-amber-soft: #4d432b;
  --pat-editor: #101014;
  --pat-editor-line: #34363a;
  --pat-editor-text: #f5f2f5;
  --pat-wallpaper: url('/daily/doki/backgrounds/echidna_dark.png');
}

:root[data-pat-theme="inori-light"] {
  color-scheme: light;
  --pat-bg: #fff1e8;
  --pat-panel: rgba(255, 249, 245, .92);
  --pat-line: #e8b58f;
  --pat-text: #523a31;
  --pat-muted: #947266;
  --pat-blue: #c86442;
  --pat-blue-soft: #f8dfd1;
  --pat-green: #3b8c78;
  --pat-amber: #d58130;
  --pat-amber-soft: #ffead7;
  --pat-editor: #2b211d;
  --pat-editor-line: #62493d;
  --pat-editor-text: #fff8f3;
  --pat-wallpaper: url('/daily/doki/backgrounds/inori_light.png');
}

:root[data-pat-theme="nao-light"] {
  color-scheme: light;
  --pat-bg: #f2eee7;
  --pat-panel: rgba(255, 253, 249, .91);
  --pat-line: #dce0d6;
  --pat-text: #414a45;
  --pat-muted: #7e8a83;
  --pat-blue: #467fc9;
  --pat-blue-soft: #e6eef9;
  --pat-green: #158f7d;
  --pat-amber: #b77c33;
  --pat-amber-soft: #f9ecd9;
  --pat-wallpaper: url('/daily/doki/backgrounds/nao_light.png');
}

* { box-sizing: border-box; }
html { min-width: 320px; }
body {
  min-height: 100vh;
  margin: 0;
  overflow: hidden;
  color: var(--pat-text);
  background: var(--pat-bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.7;
}

body[data-pat-theme] {
  background-color: var(--pat-bg);
  background-image: var(--pat-wallpaper);
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
}

body[data-pat-theme] :is(
  .pat-topbar,
  .pat-list-panel,
  .pat-problem-panel,
  .pat-problem-toolbar,
  .pat-answer-panel,
  .pat-answer-toolbar,
  .pat-theme-menu
) {
  border-color: var(--pat-line);
  background: var(--pat-panel);
  color: var(--pat-text);
}

body[data-pat-theme] :is(
  .pat-count,
  .pat-number-button.is-ready,
  .pat-icon-btn.is-complete
) {
  border-color: var(--pat-line);
  background: var(--pat-blue-soft);
}

body[data-pat-theme] :is(
  .pat-number-button,
  .pat-icon-btn,
  .pat-text-btn,
  .pat-language-label,
  .pat-sample,
  .pat-test-cell
) {
  border-color: var(--pat-line);
  background-color: var(--pat-panel);
  color: var(--pat-text);
}

body[data-pat-theme] .pat-number-button:disabled {
  background: color-mix(in srgb, var(--pat-panel) 62%, var(--pat-muted) 38%);
  color: var(--pat-muted);
  opacity: .46;
}

body[data-pat-theme] .pat-key-points {
  border-left-color: var(--pat-amber);
  background: var(--pat-amber-soft);
  color: var(--pat-text);
}

body[data-pat-theme] .pat-key-points strong { color: var(--pat-amber); }

button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid rgba(53, 120, 212, .18);
  outline-offset: 2px;
}

.pat-shell {
  display: grid;
  height: 100vh;
  min-height: 100vh;
  grid-template-rows: 62px minmax(0, 1fr);
}

.pat-topbar {
  position: relative;
  z-index: 120;
  display: grid;
  grid-template-columns: minmax(280px, 1fr) auto minmax(280px, 1fr);
  align-items: center;
  gap: 20px;
  padding: 0 18px;
  border-bottom: 1px solid var(--pat-line);
  background: rgba(255, 255, 255, .96);
}

.pat-back {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  gap: 9px;
  color: var(--pat-text);
  font-size: 15px;
  font-weight: 750;
  text-decoration: none;
}

.pat-back-icon {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 50%;
  background: var(--pat-bg);
  color: var(--pat-blue);
  font-size: 22px;
  line-height: 1;
}

.pat-top-title { text-align: center; }
.pat-top-title strong { display: block; font-size: 15px; }
.pat-top-title span { color: var(--pat-muted); font-size: 11px; }
.pat-top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.pat-top-actions a {
  display: inline-flex;
  height: 34px;
  align-items: center;
  padding: 0 13px;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  color: var(--pat-blue);
  font-size: 12px;
  font-weight: 720;
  text-decoration: none;
}

.pat-theme-picker { position: relative; }
.pat-theme-toggle {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  background: var(--pat-panel);
  color: var(--pat-blue);
  cursor: pointer;
}
.pat-theme-toggle.is-open { background: var(--pat-blue-soft); }
.pat-theme-menu {
  position: absolute;
  z-index: 140;
  top: auto;
  right: 0;
  bottom: calc(100% - 42px);
  display: grid;
  width: 232px;
  gap: 4px;
  padding: 8px;
  border: 1px solid var(--pat-line);
  border-radius: 7px;
  box-shadow: 0 14px 34px rgba(20, 28, 36, .16);
}
.pat-theme-menu[hidden] { display: none; }
.pat-theme-option {
  display: grid;
  min-height: 42px;
  grid-template-columns: 22px minmax(0, 1fr) 18px;
  align-items: center;
  gap: 9px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: var(--pat-text);
  text-align: left;
  cursor: pointer;
}
.pat-theme-option:hover { background: var(--pat-blue-soft); }
.pat-theme-option.is-active { border-color: var(--pat-blue); background: var(--pat-blue-soft); }
.pat-theme-option > span:nth-child(2) { display: grid; min-width: 0; }
.pat-theme-option strong { font-size: 11px; }
.pat-theme-option small { color: var(--pat-muted); font-size: 9px; }
.pat-theme-option > span:last-child { color: var(--pat-blue); opacity: 0; }
.pat-theme-option.is-active > span:last-child { opacity: 1; }
.pat-theme-swatch {
  width: 19px;
  height: 19px;
  border: 2px solid rgba(255, 255, 255, .78);
  border-radius: 50%;
  box-shadow: 0 0 0 1px var(--pat-line);
}
.pat-theme-swatch.emilia-light { background: #a97ec9; }
.pat-theme-swatch.beatrice { background: #e282b2; }
.pat-theme-swatch.echidna { background: #75aaab; }
.pat-theme-swatch.inori-light { background: #c86442; }
.pat-theme-swatch.nao-light { background: #6c9ad4; }

.pat-doki-tools {
  position: fixed;
  z-index: 80;
  right: 14px;
  bottom: 10px;
  width: clamp(150px, 13vw, 238px);
  height: min(30vh, 270px);
  pointer-events: none;
}
.pat-doki-tools .pat-theme-picker {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 2;
  pointer-events: auto;
}
.pat-doki-tools .pat-theme-toggle {
  border-radius: 50%;
  background: var(--pat-panel);
  box-shadow: 0 8px 22px rgba(24, 18, 30, .14);
}
.pat-doki-tools .pat-theme-menu { pointer-events: auto; }
.pat-doki-sticker {
  position: absolute;
  right: 0;
  bottom: 0;
  display: block;
  width: auto;
  max-width: calc(100% - 24px);
  max-height: calc(100% - 24px);
  object-fit: contain;
  cursor: grab;
  filter: drop-shadow(0 10px 18px rgba(24, 18, 30, .20));
  touch-action: none;
  user-select: none;
  -webkit-user-drag: none;
}
.pat-doki-tools.is-dragging .pat-doki-sticker { cursor: grabbing; }
body[data-pat-theme="inori-light"] .pat-doki-tools { width: clamp(180px, 17vw, 300px); }

.pat-workspace {
  display: grid;
  min-height: 0;
  grid-template-columns: 246px minmax(420px, 1fr) minmax(460px, .92fr);
  background: var(--pat-panel);
}

.pat-list-panel,
.pat-problem-panel,
.pat-answer-panel { min-width: 0; min-height: 0; }

.pat-list-panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--pat-line);
  background: #fbfcfd;
}

.pat-panel-heading {
  min-height: 58px;
  padding: 13px 16px 11px;
  border-bottom: 1px solid var(--pat-line);
}

.pat-panel-heading strong { display: block; font-size: 14px; }
.pat-panel-heading span { color: var(--pat-muted); font-size: 11px; }

.pat-count {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 14px 12px 10px;
  padding: 12px 13px;
  border: 1px solid #dce8f7;
  border-radius: 6px;
  background: var(--pat-blue-soft);
}

.pat-count strong { color: var(--pat-blue); font-size: 19px; line-height: 1; }
.pat-count span { color: var(--pat-muted); font-size: 11px; }

.pat-problem-list {
  display: grid;
  flex: 1;
  min-height: 0;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  align-content: start;
  gap: 7px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px 8px 14px 12px;
  scrollbar-color: color-mix(in srgb, var(--pat-blue) 64%, transparent) color-mix(in srgb, var(--pat-line) 56%, transparent);
  scrollbar-gutter: stable;
  scrollbar-width: auto;
}

.pat-problem-list::-webkit-scrollbar { width: 11px; }
.pat-problem-list::-webkit-scrollbar-track {
  border-left: 1px solid color-mix(in srgb, var(--pat-line) 72%, transparent);
  background: color-mix(in srgb, var(--pat-panel) 74%, var(--pat-bg) 26%);
}
.pat-problem-list::-webkit-scrollbar-thumb {
  min-height: 54px;
  border: 3px solid transparent;
  border-radius: 999px;
  background: color-mix(in srgb, var(--pat-blue) 66%, transparent);
  background-clip: padding-box;
}
.pat-problem-list::-webkit-scrollbar-thumb:hover {
  background: var(--pat-blue);
  background-clip: padding-box;
}

.pat-number-button {
  position: relative;
  display: inline-grid;
  width: 100%;
  aspect-ratio: 1;
  place-items: center;
  padding: 0;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  background: #fff;
  color: var(--pat-muted);
  font-size: 10px;
  font-weight: 760;
  cursor: pointer;
}

.pat-number-button:hover:not(:disabled) {
  border-color: #9dbce8;
  color: var(--pat-blue);
  transform: translateY(-1px);
}

.pat-number-button.is-ready {
  border-color: #b8d1f2;
  color: var(--pat-blue);
  background: #f8fbff;
}

.pat-number-button.is-active {
  border-color: var(--pat-blue);
  background: var(--pat-blue-soft);
  color: var(--pat-blue);
  box-shadow: inset 0 0 0 1px var(--pat-blue);
}

.pat-number-button.is-complete {
  border-color: #ffabab;
  background: #fff0f0;
  color: #ef3636;
  font-size: 16px;
  box-shadow: none;
}

.pat-number-button.is-complete.is-active {
  border-color: #ef3636;
  box-shadow: inset 0 0 0 1px #ef3636;
}

body[data-pat-theme] .pat-number-button.is-complete,
body[data-pat-theme] .pat-icon-btn.is-complete {
  border-color: #ffabab;
  background: #fff0f0;
  color: #ef3636;
}

.pat-number-button:disabled {
  border-color: transparent;
  background: rgba(231, 235, 238, .56);
  color: #aeb7bd;
  cursor: not-allowed;
}

.pat-number-legend {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 13px 6px;
  color: var(--pat-muted);
  font-size: 10px;
}
.pat-number-legend span { display: inline-flex; align-items: center; gap: 5px; }
.pat-number-legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--pat-blue); }
.pat-number-legend span:last-child i { background: #ef4b4b; }
.pat-list-note {
  margin: 0;
  padding: 11px 14px;
  border-top: 1px solid var(--pat-line);
  color: var(--pat-muted);
  font-size: 11px;
}

.pat-problem-panel {
  overflow-y: auto;
  border-right: 1px solid var(--pat-line);
  background: #fff;
}

.pat-problem-toolbar {
  position: sticky;
  z-index: 3;
  top: 0;
  display: grid;
  min-height: 58px;
  grid-template-columns: 90px minmax(0, 1fr) 110px;
  align-items: center;
  gap: 10px;
  padding: 8px 18px;
  border-bottom: 1px solid var(--pat-line);
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(8px);
}

.pat-problem-toolbar > span { color: var(--pat-blue); font-size: 12px; font-weight: 760; }
.pat-problem-toolbar h1 {
  overflow: hidden;
  margin: 0;
  font-size: 16px;
  letter-spacing: 0;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pat-pager { display: flex; justify-content: flex-end; gap: 5px; }
.pat-icon-btn {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  background: #fff;
  color: var(--pat-blue);
  cursor: pointer;
}
.pat-icon-btn:disabled { color: #b8c0c6; cursor: not-allowed; }
.pat-icon-btn.is-complete {
  border-color: #ffabab;
  background: #fff0f0;
  color: #ef3636;
}

.pat-statement { padding: 28px clamp(24px, 4vw, 54px) 80px; }
.pat-statement-title { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.pat-statement-title h2 { margin: 0; font-size: 23px; letter-spacing: 0; }
.pat-score {
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--pat-bg);
  color: var(--pat-muted);
  font-size: 11px;
  font-weight: 750;
}
.pat-meta { display: flex; gap: 14px; margin-bottom: 24px; color: var(--pat-muted); font-size: 12px; }
.pat-statement h3 { margin: 28px 0 9px; font-size: 16px; letter-spacing: 0; }
.pat-statement p { margin: 0 0 10px; }
.pat-sample {
  overflow: hidden;
  border: 1px solid var(--pat-line);
  border-radius: 6px;
  background: #fafbfc;
}
.pat-sample + .pat-sample { margin-top: 12px; }
.pat-sample header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 34px;
  padding: 0 12px;
  border-bottom: 1px solid var(--pat-line);
  color: var(--pat-muted);
  font-size: 11px;
  font-weight: 720;
}
.pat-sample pre { margin: 0; padding: 14px; color: #33414b; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
.pat-sample-explanation {
  margin: 10px 0 0;
  padding: 12px 14px;
  border-left: 3px solid var(--pat-accent);
  border-radius: 4px;
  background: var(--pat-accent-soft);
  color: var(--pat-muted);
  white-space: pre-line;
}

.pat-answer-panel {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background: #f8fafb;
}

.pat-answer-toolbar {
  position: sticky;
  z-index: 3;
  top: 0;
  display: flex;
  min-height: 58px;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--pat-line);
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(8px);
}
.pat-answer-toolbar strong { font-size: 13px; }
.pat-language-label {
  display: inline-flex;
  height: 34px;
  min-width: 72px;
  align-items: center;
  justify-content: center;
  padding: 0 14px;
  border: 1px solid #b7d0f2;
  border-radius: 5px;
  background: var(--pat-panel);
  color: var(--pat-text);
  font-size: 12px;
  font-weight: 760;
}

.pat-answer-content { padding: 15px; }
.pat-thinking {
  padding: 2px 2px 15px;
  border-bottom: 1px solid var(--pat-line);
}
.pat-thinking h2, .pat-editor-section h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
.pat-thinking ol {
  display: grid;
  margin: 10px 0 0;
  padding: 0;
  counter-reset: pat-idea;
  gap: 7px;
  list-style: none;
}
.pat-idea-item {
  position: relative;
  min-height: 42px;
  padding: 9px 12px 9px 42px;
  border-left: 3px solid var(--idea-color);
  border-radius: 0 5px 5px 0;
  background: color-mix(in srgb, var(--pat-panel) 84%, var(--idea-color) 16%);
  color: var(--pat-text);
}
.pat-idea-item::before {
  position: absolute;
  top: 10px;
  left: 11px;
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  border-radius: 50%;
  background: var(--idea-color);
  color: #fff;
  content: counter(pat-idea);
  counter-increment: pat-idea;
  font-size: 10px;
  font-weight: 800;
  line-height: 1;
}
.pat-idea-item.is-main { --idea-color: #db4b78; }
.pat-idea-item.is-core { --idea-color: #3478d4; }
.pat-idea-item.is-explain { --idea-color: #24a363; }
.pat-key-points {
  margin-top: 12px;
  padding: 11px 12px;
  border-left: 3px solid #eda33e;
  border-radius: 0 5px 5px 0;
  background: var(--pat-amber-soft);
  color: #79501b;
  font-size: 12px;
}
.pat-key-points strong { display: block; margin-bottom: 3px; color: var(--pat-amber); }
.pat-key-points ul { margin: 0; padding-left: 18px; }

.pat-editor-section { padding-top: 15px; }
.pat-editor-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.pat-editor-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.pat-text-btn {
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  background: #fff;
  color: var(--pat-blue);
  font-size: 11px;
  font-weight: 720;
  cursor: pointer;
}
.pat-text-btn:hover { border-color: #b7d0f2; background: var(--pat-blue-soft); }
.pat-text-btn.is-copied { color: var(--pat-green); }

.pat-editor {
  display: grid;
  min-height: 390px;
  grid-template-columns: 46px minmax(0, 1fr);
  overflow: hidden;
  border: 1px solid #22313f;
  border-radius: 6px;
  background: var(--pat-editor);
}
.pat-line-numbers {
  overflow: hidden;
  margin: 0;
  padding: 14px 9px;
  border-right: 1px solid var(--pat-editor-line);
  color: #6f8190;
  background: #141d25;
  font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  text-align: right;
  user-select: none;
}
.pat-code-input {
  width: 100%;
  min-height: 390px;
  resize: vertical;
  padding: 14px 15px;
  border: 0;
  outline: 0;
  background: var(--pat-editor);
  color: var(--pat-editor-text);
  caret-color: #fff;
  font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  tab-size: 2;
  white-space: pre;
}
.pat-save-state { margin: 7px 1px 0; color: var(--pat-muted); font-size: 10px; }
.pat-test-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  overflow: hidden;
  margin-top: 13px;
  border: 1px solid var(--pat-line);
  border-radius: 6px;
  background: var(--pat-line);
}
.pat-test-cell { min-width: 0; padding: 10px 11px; background: #fff; }
.pat-test-cell strong { display: block; color: var(--pat-muted); font-size: 10px; }
.pat-test-cell code { display: block; overflow-x: auto; margin-top: 4px; color: var(--pat-text); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }

@media (max-width: 1280px) {
  .pat-workspace { grid-template-columns: 214px minmax(390px, 1fr) minmax(410px, .9fr); }
  .pat-statement { padding-inline: 26px; }
}

@media (max-width: 1020px) {
  body { overflow: auto; }
  .pat-shell { display: block; height: auto; }
  .pat-topbar { position: sticky; z-index: 120; top: 0; grid-template-columns: 1fr auto; }
  .pat-top-title { display: none; }
  .pat-workspace { grid-template-columns: 210px minmax(0, 1fr); }
  .pat-list-panel { min-height: calc(100vh - 62px); }
  .pat-problem-panel { min-height: calc(100vh - 62px); border-right: 0; }
  .pat-answer-panel { grid-column: 1 / -1; border-top: 1px solid var(--pat-line); }
  .pat-answer-toolbar { position: static; }
}

@media (max-width: 680px) {
  .pat-topbar { padding-inline: 10px; }
  .pat-back span:last-child { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pat-top-actions > a { display: none; }
  .pat-doki-tools { width: 118px; height: 148px; }
  body[data-pat-theme="inori-light"] .pat-doki-tools { width: 150px; height: 170px; }
  .pat-workspace { display: block; }
  .pat-list-panel { min-height: 0; border-right: 0; }
  .pat-problem-list { grid-template-columns: repeat(6, minmax(0, 1fr)); max-height: 260px; padding: 8px 12px; }
  .pat-number-button { aspect-ratio: 1.5; }
  .pat-list-note { display: none; }
  .pat-count { margin-top: 10px; }
  .pat-problem-panel { min-height: 0; }
  .pat-problem-toolbar { grid-template-columns: 54px minmax(0, 1fr) 76px; padding-inline: 10px; }
  .pat-problem-toolbar h1 { font-size: 14px; }
  .pat-statement { padding: 22px 16px 50px; }
  .pat-statement-title { align-items: flex-start; }
  .pat-statement-title h2 { font-size: 20px; }
  .pat-answer-content { padding: 12px; }
  .pat-editor { min-height: 350px; }
  .pat-code-input { min-height: 350px; }
  .pat-doki-sticker { opacity: .9; }
}

  <script>
(function () {
  var library = {"problems":[{"description":["It is vitally important to have all the cities connected by highways in a war.  If a city is conquered by the enemy, all the highways from/toward that city will be closed.  To keep the rest of the cities connected, we must repair some highways with the minimum cost.  On the other hand, if losing a city will cost us too much to rebuild the connection, we must pay more attention to that city.","Given the map of cities which have all the destroyed and remaining highways marked, you are supposed to point out the city to which we must pay the most attention."],"id":"1001","input":"Each input file contains one test case. Each case starts with a line containing 2 numbers N (≤500), and M, which are the total number of cities, and the number of highways, respectively.  Then M lines follow, each describes a highway by 4 integers: City1 City2 Cost Status where City1 and City2 are the numbers of the cities the highway connects (the cities are numbered from 1 to N), Cost is the effort taken to repair that highway if necessary, and Status is either 0, meaning that highway is destroyed, or 1, meaning that highway is in use.\n\nNote: It is guaranteed that the whole country was connected before the war.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805156657348608","output":"For each test case, just print in a line the city we must protest the most, that is, it will take us the maximum effort to rebuild the connection if that city is conquered by the enemy.\n\nIn case there is more than one city to be printed, output them in increasing order of the city numbers, separated by one space, but no extra space at the end of the line.  In case there is no need to repair any highway at all, simply output 0.","samples":[{"input":"4 5\n1 2 1 1\n1 3 1 1\n2 3 1 0\n2 4 1 1\n3 4 1 0","output":"1 2","explanation":"","label":""},{"input":"4 5\n1 2 1 1\n1 3 1 1\n2 3 1 0\n2 4 1 1\n3 4 2 1","output":"0","explanation":"","label":""}],"score":35,"title":"Battle Over Cities - Hard Version","category":"最小生成树","idea":["枚举每一座被攻占的城市，临时忽略所有与它相连的道路。","仍在使用的道路视为修复费用 0，已损坏道路保留原费用；对剩余城市做 Kruskal。","若剩余图不连通，将代价视为无穷；最后输出代价最大的全部城市。"],"keyPoints":["正常道路也必须参与并查集合并，只是它们不增加费用。","删除城市后只需要 N-2 条边；N=2 时剩余单城天然连通。","若所有城市的修复代价都为 0，题目要求输出 0。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct DSU {\n  vector\u003cint> p, sz;\n  explicit DSU(int n) : p(n + 1), sz(n + 1, 1) { iota(p.begin(), p.end(), 0); }\n  int find(int x) { return p[x] == x ? x : p[x] = find(p[x]); }\n  bool unite(int a, int b) {\n    a = find(a); b = find(b);\n    if (a == b) return false;\n    if (sz[a] \u003c sz[b]) swap(a, b);\n    p[b] = a; sz[a] += sz[b];\n    return true;\n  }\n};\n\nstruct Edge { int u, v, cost, status; };\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  int n, m;\n  cin >> n >> m;\n  vector\u003cEdge> edges(m);\n  for (auto &e : edges) cin >> e.u >> e.v >> e.cost >> e.status;\n  sort(edges.begin(), edges.end(), [](const Edge &a, const Edge &b) {\n    int wa = a.status ? 0 : a.cost;\n    int wb = b.status ? 0 : b.cost;\n    return wa != wb ? wa \u003c wb : a.status > b.status;\n  });\n\n  const long long INF = (1LL \u003c\u003c 60);\n  vector\u003clong long> need(n + 1);\n  long long worst = 0;\n  for (int banned = 1; banned \u003c= n; ++banned) {\n    DSU dsu(n);\n    int used = 0;\n    long long cost = 0;\n    for (const auto &e : edges) {\n      if (e.u == banned || e.v == banned) continue;\n      if (dsu.unite(e.u, e.v)) {\n        ++used;\n        if (!e.status) cost += e.cost;\n      }\n    }\n    need[banned] = (used == max(0, n - 2)) ? cost : INF;\n    worst = max(worst, need[banned]);\n  }\n\n  if (worst == 0) {\n    cout \u003c\u003c 0 \u003c\u003c '\\n';\n    return 0;\n  }\n  bool first = true;\n  for (int city = 1; city \u003c= n; ++city) {\n    if (need[city] != worst) continue;\n    if (!first) cout \u003c\u003c ' ';\n    cout \u003c\u003c city;\n    first = false;\n  }\n  cout \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"4 5\n1 2 1 1\n1 3 1 1\n2 3 1 0\n2 4 1 1\n3 4 1 0","sampleOutput":"1 2"},{"description":["As the manager of your company, you have to carefully consider, for each project, the time taken to finish it, the deadline, and the profit you can gain, in order to decide if your group should take this project. For example, given 3 projects as the following:","Project[1] takes 3 days, it must be finished in 3 days in order to gain 6 units of profit.\nProject[2] takes 2 days, it must be finished in 2 days in order to gain 3 units of profit.\nProject[3] takes 1 day only, it must be finished in 3 days in order to gain 4 units of profit.","You may take Project[1] to gain 6 units of profit. But if you take Project[2] first, then you will have 1 day left to complete Project[3] just in time, and hence gain 7 units of profit in total. Notice that once you decide to work on a project, you have to do it from beginning to the end without any interruption."],"id":"1002","input":"Each input file contains one test case. For each case, the first line gives a positive integer N (≤50), and then followed by N lines of projects, each contains three numbers P, L, and D where P is the profit, L the lasting days of the project, and D the deadline. It is guaranteed that L is never more than D, and all the numbers are non-negative integers.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805156145643520","output":"For each test case, output in a line the maximum profit you can gain.","samples":[{"input":"4\n7 1 3\n10 2 3\n6 1 2\n5 1 1","output":"18","explanation":"","label":""}],"score":35,"title":"Business","category":"动态规划","idea":["按截止日期从小到大排序项目，使当前项目成为已安排项目中的最后一个。","dp[t] 表示恰好占用 t 天能够取得的最大利润，初值仅 dp[0]=0。","倒序枚举时间；只有 t+L 不超过该项目截止日期时才转移。"],"keyPoints":["项目不可拆分，时间维必须倒序更新，避免同一项目重复选择。","排序后只校验当前项目的截止日期即可保证之前项目也按时完成。","利润总和使用 long long，未达状态用 -1 标记。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Project { long long profit; int length, deadline; };\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  int n;\n  cin >> n;\n  vector\u003cProject> projects(n);\n  int totalDays = 0;\n  for (auto &x : projects) {\n    cin >> x.profit >> x.length >> x.deadline;\n    totalDays += x.length;\n  }\n  sort(projects.begin(), projects.end(), [](const Project &a, const Project &b) {\n    return a.deadline != b.deadline ? a.deadline \u003c b.deadline : a.length \u003c b.length;\n  });\n\n  vector\u003clong long> dp(totalDays + 1, -1);\n  dp[0] = 0;\n  int reached = 0;\n  for (const auto &job : projects) {\n    for (int t = min(reached, job.deadline - job.length); t >= 0; --t) {\n      if (dp[t] \u003c 0) continue;\n      dp[t + job.length] = max(dp[t + job.length], dp[t] + job.profit);\n    }\n    reached = min(totalDays, reached + job.length);\n  }\n  cout \u003c\u003c *max_element(dp.begin(), dp.end()) \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"4\n7 1 3\n10 2 3\n6 1 2\n5 1 1","sampleOutput":"18"},{"description":["After finishing her tour around the Earth, CYLL is now planning a universal travel sites development project.  After a careful investigation, she has a list of capacities of all the satellite transportation stations in hand.  To estimate a budget, she must know the minimum capacity that a planet station must have to guarantee that every space vessel can dock and download its passengers on arrival."],"id":"1003","input":"Each input file contains one test case. For each case, the first line contains the names of the source and the destination planets, and a positive integer N (≤500).  Then N lines follow, each in the format: source[i] destination[i] capacity[i] where source[i] and destination[i] are the names of the satellites and the two involved planets, and capacity[i] > 0 is the maximum number of passengers that can be transported at one pass from source[i] to destination[i].  Each name is a string of 3 uppercase characters chosen from {A-Z}, e.g., ZJU.\n\nNote that the satellite transportation stations have no accommodation facilities for the passengers.  Therefore none of the passengers can stay.  Such a station will not allow arrivals of space vessels that contain more than its own capacity.  It is guaranteed that the list contains neither the routes to the source planet nor that from the destination planet.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805155688464384","output":"For each test case, just print in one line the minimum capacity that a planet station must have to guarantee that every space vessel can dock and download its passengers on arrival.","samples":[{"input":"EAR MAR 11\nEAR AAA 300\nEAR BBB 400\nAAA BBB 100\nAAA CCC 400\nAAA MAR 300\nBBB DDD 400\nAAA DDD 400\nDDD AAA 100\nCCC MAR 400\nDDD CCC 200\nDDD MAR 300","output":"700","explanation":"","label":""}],"score":35,"title":"Universal Travel Sites","category":"最大流","idea":["把行星与卫星站名称映射为连续编号，每条运输路线作为一条有向容量边。","题目要求源点到终点所有运输路线的最小总保障能力，等价于网络最大流。","使用 Dinic：BFS 建分层图，DFS 在分层图中反复发送阻塞流。"],"keyPoints":["路线是有向边，反向边仅用于残量网络，初始容量为 0。","同名站点必须映射到同一个编号，平行边可以直接保留。","容量总和可能超过 int，流量与容量使用 long long。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Dinic {\n  struct Edge { int to, rev; long long cap; };\n  vector\u003cvector\u003cEdge>> g;\n  vector\u003cint> level, it;\n  explicit Dinic(int n) : g(n), level(n), it(n) {}\n  void addEdge(int u, int v, long long c) {\n    Edge a{v, (int)g[v].size(), c};\n    Edge b{u, (int)g[u].size(), 0};\n    g[u].push_back(a); g[v].push_back(b);\n  }\n  bool bfs(int s, int t) {\n    fill(level.begin(), level.end(), -1);\n    queue\u003cint> q; q.push(s); level[s] = 0;\n    while (!q.empty()) {\n      int u = q.front(); q.pop();\n      for (const auto &e : g[u]) if (e.cap > 0 && level[e.to] \u003c 0) {\n        level[e.to] = level[u] + 1;\n        q.push(e.to);\n      }\n    }\n    return level[t] >= 0;\n  }\n  long long dfs(int u, int t, long long f) {\n    if (u == t) return f;\n    for (int &i = it[u]; i \u003c (int)g[u].size(); ++i) {\n      Edge &e = g[u][i];\n      if (e.cap \u003c= 0 || level[e.to] != level[u] + 1) continue;\n      long long got = dfs(e.to, t, min(f, e.cap));\n      if (!got) continue;\n      e.cap -= got; g[e.to][e.rev].cap += got;\n      return got;\n    }\n    return 0;\n  }\n  long long maxFlow(int s, int t) {\n    long long answer = 0, pushed;\n    while (bfs(s, t)) {\n      fill(it.begin(), it.end(), 0);\n      while ((pushed = dfs(s, t, (1LL \u003c\u003c 60))) > 0) answer += pushed;\n    }\n    return answer;\n  }\n};\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  string source, target;\n  int m;\n  cin >> source >> target >> m;\n  struct Raw { string a, b; long long c; };\n  vector\u003cRaw> roads(m);\n  unordered_map\u003cstring, int> id;\n  auto getId = [&](const string &name) {\n    auto result = id.emplace(name, (int)id.size());\n    return result.first->second;\n  };\n  int s = getId(source), t = getId(target);\n  for (auto &road : roads) {\n    cin >> road.a >> road.b >> road.c;\n    getId(road.a); getId(road.b);\n  }\n  Dinic dinic((int)id.size());\n  for (const auto &road : roads) dinic.addEdge(id[road.a], id[road.b], road.c);\n  cout \u003c\u003c dinic.maxFlow(s, t) \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"EAR MAR 11\nEAR AAA 300\nEAR BBB 400\nAAA BBB 100\nAAA CCC 400\nAAA MAR 300\nBBB DDD 400\nAAA DDD 400\nDDD AAA 100\nCCC MAR 400\nDDD CCC 200\nDDD MAR 300","sampleOutput":"700"},{"description":["Eva would like to make a string of beads with her favorite colors so she went to a small shop to buy some beads. There were many colorful strings of beads. However the owner of the shop would only sell the strings in whole pieces. Hence in some cases Eva might have to buy several strings to get all the beads she needs. With a hundred strings in the shop, Eva needs your help to tell her whether or not she can get all the beads she needs with the least number of extra beads she has to pay for.","For the sake of simplicity, let's use the characters in the ranges [0-9], [a-z], and [A-Z] to represent the colors. In sample 1, buying the 2nd and the last two strings is the best way since there are only 3 extra beads. In sample 2, buying all the three strings won't help - 'a';\n  return 36 + c - 'A';\n}\n\nstruct Item { array\u003cint, 62> count{}; int length = 0, useful = 0; };\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  string wanted;\n  int n;\n  cin >> wanted >> n;\n  array\u003cint, 62> need{}, all{};\n  for (char c : wanted) ++need[indexOf(c)];\n  vector\u003cItem> items;\n  for (int i = 0; i \u003c n; ++i) {\n    string s; cin >> s;\n    Item item; item.length = (int)s.size();\n    for (char c : s) { ++item.count[indexOf(c)]; ++all[indexOf(c)]; }\n    for (int c = 0; c \u003c 62; ++c) item.useful += min(need[c], item.count[c]);\n    if (item.useful) items.push_back(item);\n  }\n  int missing = 0;\n  for (int c = 0; c \u003c 62; ++c) missing += max(0, need[c] - all[c]);\n  if (missing) {\n    cout \u003c\u003c \"No \" \u003c\u003c missing \u003c\u003c '\\n';\n    return 0;\n  }\n  sort(items.begin(), items.end(), [](const Item &a, const Item &b) {\n    long long left = 1LL * a.useful * b.length;\n    long long right = 1LL * b.useful * a.length;\n    return left != right ? left > right : a.length \u003c b.length;\n  });\n\n  int m = (int)items.size();\n  vector\u003carray\u003cint, 62>> suffix(m + 1);\n  suffix[m].fill(0);\n  for (int i = m - 1; i >= 0; --i) {\n    suffix[i] = suffix[i + 1];\n    for (int c = 0; c \u003c 62; ++c) suffix[i][c] += items[i].count[c];\n  }\n  int best = numeric_limits\u003cint>::max();\n  array\u003cint, 62> have{};\n  function\u003cvoid(int, int)> dfs = [&](int pos, int length) {\n    if (length >= best) return;\n    bool done = true;\n    for (int c = 0; c \u003c 62; ++c) {\n      if (have[c] \u003c need[c]) done = false;\n      if (have[c] + suffix[pos][c] \u003c need[c]) return;\n    }\n    if (done) { best = length; return; }\n    if (pos == m) return;\n\n    for (int c = 0; c \u003c 62; ++c) have[c] += items[pos].count[c];\n    dfs(pos + 1, length + items[pos].length);\n    for (int c = 0; c \u003c 62; ++c) have[c] -= items[pos].count[c];\n    dfs(pos + 1, length);\n  };\n  dfs(0, 0);\n  cout \u003c\u003c \"Yes \" \u003c\u003c best - (int)wanted.size() \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"RYg5\n8\ngY5Ybf\n8R5\n12346789\ngRg8h\n5Y37\npRgYgbR52\n8Y\n8g","sampleOutput":"Yes 3"},{"description":["Programmers often have a preference among program constructs. For example, some may prefer if(0==a), while others may prefer if(!a). Analyzing such patterns can help to narrow down a programmer's identity, which is useful for detecting plagiarism.","Now given some text sampled from someone's program, can you find the person's most commonly used pattern of a specific length?"],"id":"1005","input":"Each input file contains one test case. For each case, there is one line consisting of the pattern length N (1≤N≤1048576), followed by one line no less than N and no more than 1048576 characters in length, terminated by a carriage return \\n. The entire input is case sensitive.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805154748940288","output":"For each test case, print in one line the length-N substring that occurs most frequently in the input, followed by a space and the number of times it has occurred in the input. If there are multiple such substrings, print the lexicographically smallest one.\n\nWhitespace characters in the input should be printed as they are. Also note that there may be multiple occurrences of the same substring overlapping each other.","samples":[{"input":"4\n//A can can can a can.","output":"can 4","explanation":"","label":""},{"input":"3\nint a=~~~~~~~~~~~~~~~~~~~~~0;","output":"~~~ 19","explanation":"","label":""}],"score":35,"title":"Programming Pattern","category":"后缀数组","idea":["给原串追加全局最小哨兵，使用倍增与计数排序构造后缀数组。","用 Kasai 算法在线性时间求相邻后缀的 LCP。","在后缀数组中合并 LCP 不小于 N 的连续合法后缀；最早出现的最大组天然字典序最小。"],"keyPoints":["原串长度可达 2^20，不能为每个位置复制一个长度 N 的 substring。","剩余长度小于 N 的后缀不能成为答案，也会中断当前分组。","只在最终输出时构造一次 substring，内存维持 O(|S|)。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nvector\u003cint> suffixArray(const string &text) {\n  string s = text;\n  s.push_back(char(0));\n  int n = (int)s.size();\n  vector\u003cint> p(n), c(n), pn(n), cn(n);\n  vector\u003cint> cnt(max(256, n), 0);\n  for (unsigned char ch : s) ++cnt[ch];\n  for (int i = 1; i \u003c 256; ++i) cnt[i] += cnt[i - 1];\n  for (int i = n - 1; i >= 0; --i) p[--cnt[(unsigned char)s[i]]] = i;\n  c[p[0]] = 0;\n  int classes = 1;\n  for (int i = 1; i \u003c n; ++i) {\n    if (s[p[i]] != s[p[i - 1]]) ++classes;\n    c[p[i]] = classes - 1;\n  }\n  for (int len = 1; len \u003c n; len \u003c\u003c= 1) {\n    for (int i = 0; i \u003c n; ++i) {\n      pn[i] = p[i] - len;\n      if (pn[i] \u003c 0) pn[i] += n;\n    }\n    fill(cnt.begin(), cnt.begin() + classes, 0);\n    for (int x : pn) ++cnt[c[x]];\n    for (int i = 1; i \u003c classes; ++i) cnt[i] += cnt[i - 1];\n    for (int i = n - 1; i >= 0; --i) p[--cnt[c[pn[i]]]] = pn[i];\n    cn[p[0]] = 0;\n    int nextClasses = 1;\n    for (int i = 1; i \u003c n; ++i) {\n      pair\u003cint,int> now{c[p[i]], c[(p[i] + len) % n]};\n      pair\u003cint,int> before{c[p[i - 1]], c[(p[i - 1] + len) % n]};\n      if (now != before) ++nextClasses;\n      cn[p[i]] = nextClasses - 1;\n    }\n    c.swap(cn); classes = nextClasses;\n  }\n  p.erase(p.begin());\n  return p;\n}\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  int patternLength;\n  string s;\n  cin >> patternLength;\n  cin.ignore(numeric_limits\u003cstreamsize>::max(), '\\n');\n  getline(cin, s);\n  vector\u003cint> sa = suffixArray(s);\n  int n = (int)s.size();\n  vector\u003cint> rank(n), lcp(n);\n  for (int i = 0; i \u003c n; ++i) rank[sa[i]] = i;\n  for (int i = 0, common = 0; i \u003c n; ++i) {\n    int r = rank[i];\n    if (r == 0) continue;\n    int j = sa[r - 1];\n    while (i + common \u003c n && j + common \u003c n && s[i + common] == s[j + common]) ++common;\n    lcp[r] = common;\n    if (common) --common;\n  }\n\n  int bestCount = 0, bestPos = 0;\n  for (int i = 0; i \u003c n; ) {\n    if (sa[i] + patternLength > n) { ++i; continue; }\n    int j = i;\n    while (j + 1 \u003c n && sa[j + 1] + patternLength \u003c= n && lcp[j + 1] >= patternLength) ++j;\n    int count = j - i + 1;\n    if (count > bestCount) { bestCount = count; bestPos = sa[i]; }\n    i = j + 1;\n  }\n  cout \u003c\u003c s.substr(bestPos, patternLength) \u003c\u003c ' ' \u003c\u003c bestCount \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"4\n//A can can can a can.","sampleOutput":"can 4"},{"description":["Given the partial results of a binary tree's traversals in in-order, pre-order, and post-order. You are supposed to output the complete results and the level order traversal sequence of the corresponding tree."],"id":"1006","input":"Each input file contains one test case. For each case, a positive integer N (≤100) is given in the first line. Then three lines follow, containing the incomplete in-order, pre-order and post-order traversal sequences, respectively. It is assumed that the tree nodes are numbered from 1 to N and no number is given out of the range. A - represents a missing number.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805154321121280","output":"For each case, print in four lines the complete in-order, pre-order and post-order traversal sequences, together with the level order traversal sequence of the corresponding tree. The numbers must be separated by a space, and there must be no extra space at the beginning or the end of each line. If it is impossible to reconstruct the unique tree from the given information, simply print Impossible.","samples":[{"input":"9\n3 - 2 1 7 9 - 4 6\n9 - 5 3 2 1 - 6 4\n3 1 - - 7 - 6 8 -","output":"3 5 2 1 7 9 8 4 6\n9 7 5 3 2 1 8 6 4\n3 1 2 5 7 4 6 8 9\n9 7 8 5 6 3 2 4 1","explanation":"","label":""},{"input":"3\n- - -\n- 1 -\n1 - -","output":"Impossible","explanation":"","label":""}],"score":35,"title":"Tree Traversals - Hard Version","category":"约束搜索","idea":["一个子树的根同时位于先序首位、后序末位，并在中序中把左右子树切开。","递归枚举仍未确定的根编号和中序位置，把三种序列中的同一根同步赋值。","每层携带已使用编号与当前序列状态，并最多保留两份完整解用于判定唯一性。"],"keyPoints":["题目不仅要求找到一棵树，还要求确认解唯一；发现第二份解即可停止。","已给出的先序根与后序根若冲突，应立即剪枝。","完成三种遍历后再由先序和中序重建树，层序遍历会更简单。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct State {\n  vector\u003cint> in, pre, post;\n  vector\u003cchar> used;\n};\n\nvector\u003cState> build(int il, int ir, int pl, int pr, int ql, int qr, const State &start) {\n  if (il > ir) return {start};\n  vector\u003cState> answer;\n  int known = -1;\n  if (start.pre[pl] != -1) known = start.pre[pl];\n  if (start.post[qr] != -1) {\n    if (known != -1 && known != start.post[qr]) return {};\n    known = start.post[qr];\n  }\n  vector\u003cint> roots;\n  if (known != -1) roots.push_back(known);\n  else for (int value = 1; value \u003c (int)start.used.size(); ++value) if (!start.used[value]) roots.push_back(value);\n\n  for (int root : roots) {\n    if (start.used[root]) continue;\n    for (int mid = il; mid \u003c= ir; ++mid) {\n      if (start.in[mid] != -1 && start.in[mid] != root) continue;\n      int leftSize = mid - il;\n      State current = start;\n      if ((current.pre[pl] != -1 && current.pre[pl] != root) ||\n          (current.post[qr] != -1 && current.post[qr] != root)) continue;\n      current.in[mid] = current.pre[pl] = current.post[qr] = root;\n      current.used[root] = 1;\n\n      auto leftStates = build(il, mid - 1, pl + 1, pl + leftSize,\n                              ql, ql + leftSize - 1, current);\n      for (const State &left : leftStates) {\n        auto rightStates = build(mid + 1, ir, pl + leftSize + 1, pr,\n                                 ql + leftSize, qr - 1, left);\n        for (auto &right : rightStates) {\n          answer.push_back(move(right));\n          if (answer.size() >= 2) return answer;\n        }\n      }\n    }\n  }\n  return answer;\n}\n\nstruct Node { int value; Node *left = nullptr, *right = nullptr; };\nNode* rebuild(const vector\u003cint> &in, const vector\u003cint> &pre, int il, int ir, int &cursor) {\n  if (il > ir) return nullptr;\n  int rootValue = pre[cursor++], mid = il;\n  while (mid \u003c= ir && in[mid] != rootValue) ++mid;\n  Node *root = new Node{rootValue};\n  root->left = rebuild(in, pre, il, mid - 1, cursor);\n  root->right = rebuild(in, pre, mid + 1, ir, cursor);\n  return root;\n}\n\nvoid print(const vector\u003cint> &values) {\n  for (int i = 0; i \u003c (int)values.size(); ++i) cout \u003c\u003c (i ? \" \" : \"\") \u003c\u003c values[i];\n  cout \u003c\u003c '\\n';\n}\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  int n; cin >> n;\n  State initial;\n  initial.in.resize(n); initial.pre.resize(n); initial.post.resize(n);\n  initial.used.assign(n + 1, 0);\n  auto read = [&](vector\u003cint> &sequence) {\n    for (int i = 0; i \u003c n; ++i) {\n      string token;\n      cin >> token;\n      sequence[i] = token == \"-\" ? -1 : stoi(token);\n    }\n  };\n  read(initial.in); read(initial.pre); read(initial.post);\n\n  auto solutions = build(0, n - 1, 0, n - 1, 0, n - 1, initial);\n  if (solutions.size() != 1) {\n    cout \u003c\u003c \"Impossible\\n\";\n    return 0;\n  }\n  const State &result = solutions[0];\n  print(result.in); print(result.pre); print(result.post);\n  int cursor = 0;\n  Node *root = rebuild(result.in, result.pre, 0, n - 1, cursor);\n  vector\u003cint> level;\n  queue\u003cNode*> q; q.push(root);\n  while (!q.empty()) {\n    Node *node = q.front(); q.pop();\n    level.push_back(node->value);\n    if (node->left) q.push(node->left);\n    if (node->right) q.push(node->right);\n  }\n  print(level);\n  return 0;\n}\n","sampleInput":"9\n3 - 2 1 7 9 - 4 6\n9 - 5 3 2 1 - 6 4\n3 1 - - 7 - 6 8 -","sampleOutput":"3 5 2 1 7 9 8 4 6\n9 7 5 3 2 1 8 6 4\n3 1 2 5 7 4 6 8 9\n9 7 8 5 6 3 2 4 1"},{"description":["There is a kind of binary tree named red-black tree in the data structure. It has the following 5 properties:","(1) Every node is either red or black.\n(2) The root is black.\n(3) All the leaves are NULL nodes and are colored black.\n(4) Each red node must have 2 black descends (may be NULL).\n(5) All simple paths from any node x to a descendant leaf have the same number of black nodes.","We call a non-NULL node an internal node. From property (5) we can define the black-height of a red-black tree as the number of nodes on the simple path from the root (excluding the root itself) to any NULL leaf (including the NULL leaf). And we can derive that a red-black tree with black height H has at least 2\nH\n−1 internal nodes.","Here comes the question: given a positive N, how many distinct red-black trees are there that consist of exactly N internal nodes?"],"id":"1007","input":"Each input file contains one test case which gives a positive integer N (≤500).","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805153880719360","output":"For each case, print in a line the number of distinct red-black tees with N internal nodes. Since the answer may be very large, output the remainder of it divided by 1000000007 please.","samples":[{"input":"5","output":"8","explanation":"","label":""}],"score":35,"title":"Red-black Tree","category":"树形动态规划","idea":["按内部节点数、根颜色和黑高建立 DP；空树作为黑色 NIL 叶子，黑高为 1。","黑根允许任意颜色子树，但左右黑高必须相同；红根的两个孩子必须为黑根。","枚举左右子树节点数合并，最后累加所有黑根状态。"],"keyPoints":["红黑树根必须为黑色，空孩子也参与黑高计算。","红根本身不增加黑高，黑根会使子树黑高加 1。","三层循环中的每次乘加都要及时取模。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nconst long long MOD = 1000000007LL;\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  int n; cin >> n;\n  int maxH = 20;\n  vector\u003cvector\u003clong long>> black(n + 1, vector\u003clong long>(maxH + 1));\n  vector\u003cvector\u003clong long>> red(n + 1, vector\u003clong long>(maxH + 1));\n  black[0][1] = 1;  // NIL 叶子。\n\n  for (int nodes = 1; nodes \u003c= n; ++nodes) {\n    for (int left = 0; left \u003c nodes; ++left) {\n      int right = nodes - 1 - left;\n      for (int h = 1; h \u003c maxH; ++h) {\n        long long leftAny = (black[left][h] + red[left][h]) % MOD;\n        long long rightAny = (black[right][h] + red[right][h]) % MOD;\n        black[nodes][h + 1] = (black[nodes][h + 1] + leftAny * rightAny) % MOD;\n        red[nodes][h] = (red[nodes][h] + black[left][h] * black[right][h]) % MOD;\n      }\n    }\n  }\n  long long answer = 0;\n  for (int h = 1; h \u003c= maxH; ++h) answer = (answer + black[n][h]) % MOD;\n  cout \u003c\u003c answer \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"5","sampleOutput":"8"},{"description":["Given a map of airline routes, you are supposed to check if a round trip can be planned between any pair of cities."],"id":"1008","input":"Each input file contains one test case. For each case, the first line gives two positive integers N (2≤N≤10\n4\n) and M (≤6N), which are the total number of cities (hence the cities are numbered from 1 to N) and the number of airline routes, respectively. Then M lines follow, each gives the information of a route in the format of the source city index first, and then the destination city index, separated by a space. It is guaranteed that the source is never the same as the destination.\n\nAfter the map information, another positive integer K is given, which is the number of queries. Then K lines of queries follow, each contains a pair of distinct cities' indices.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805153478066176","output":"For each query, output in a line Yes if a round trip is possible, or No if not.","samples":[{"input":"12 19\n3 4\n1 3\n12 11\n5 9\n6 2\n3 2\n10 7\n9 1\n7 12\n2 4\n9 5\n2 6\n12 4\n11 10\n4 8\n8 12\n11 8\n12 7\n1 5\n20\n11 4\n12 7\n3 6\n2 3\n5 3\n3 9\n4 3\n8 3\n8 10\n10 11\n7 8\n7 1\n9 5\n1 9\n2 6","output":"Yes\nYes\nNo\nNo\nNo\nNo\nNo\nNo\nYes\nYes\nYes\nNo\nYes\nYes\nYes\nNo\nNo\nNo\nNo\nNo","explanation":"","label":""}],"score":35,"title":"Airline Routes","category":"强连通分量","idea":["一次性用 Tarjan 算法求出有向图的全部强连通分量编号。","同一强连通分量中的任意两点互相可达，恰好能够完成往返。","每次查询只比较两个城市的分量编号，时间复杂度 O(1)。"],"keyPoints":["单向可达不等于能往返，不能只从一个端点做 DFS。","Tarjan 更新 low 值时，返祖边使用 dfn[v]，树边使用 low[v]。","总复杂度 O(N+M+K)，适合大量查询。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  int n, m; cin >> n >> m;\n  vector\u003cvector\u003cint>> graph(n + 1);\n  while (m--) { int u, v; cin >> u >> v; graph[u].push_back(v); }\n  vector\u003cint> dfn(n + 1), low(n + 1), component(n + 1), stack;\n  vector\u003cchar> inside(n + 1);\n  int timer = 0, componentCount = 0;\n  function\u003cvoid(int)> tarjan = [&](int u) {\n    dfn[u] = low[u] = ++timer;\n    stack.push_back(u); inside[u] = 1;\n    for (int v : graph[u]) {\n      if (!dfn[v]) { tarjan(v); low[u] = min(low[u], low[v]); }\n      else if (inside[v]) low[u] = min(low[u], dfn[v]);\n    }\n    if (low[u] != dfn[u]) return;\n    ++componentCount;\n    while (true) {\n      int v = stack.back(); stack.pop_back(); inside[v] = 0;\n      component[v] = componentCount;\n      if (v == u) break;\n    }\n  };\n  for (int i = 1; i \u003c= n; ++i) if (!dfn[i]) tarjan(i);\n\n  int queries; cin >> queries;\n  while (queries--) {\n    int a, b; cin >> a >> b;\n    cout \u003c\u003c (component[a] == component[b] ? \"Yes\" : \"No\") \u003c\u003c '\\n';\n  }\n  return 0;\n}\n","sampleInput":"12 19\n3 4\n1 3\n12 11\n5 9\n6 2\n3 2\n10 7\n9 1\n7 12\n2 4\n9 5\n2 6\n12 4\n11 10\n4 8\n8 12\n11 8\n12 7\n1 5\n20\n11 4\n12 7\n3 6\n2 3\n5 3\n3 9\n4 3\n8 3\n8 10\n10 11\n7 8\n7 1\n9 5\n1 9\n2 6","sampleOutput":"Yes\nYes\nNo\nNo\nNo\nNo\nNo\nNo\nYes\nYes\nYes\nNo\nYes\nYes\nYes\nNo\nNo\nNo\nNo\nNo"},{"description":["Given a list of N integers A\n1\n\t​",", A\n2\n\t​",", A\n3\n\t​",",...A\nN\n\t​",", there's a famous problem to count the number of inversions in it. An inversion is defined as a piar of indices i\u003cj such that A\ni\n\t​",">A\nj\n\t​",".","Now we have a new challenging problem. You are supposed to count the number of triple inversions in it. As you may guess, a triple inversion is defined as a triple of indices i\u003cj\u003ck such that A\ni\n\t​",">A\nj\n\t​",">A\nk\n\t​",". For example, in the list { 5, 1, 4, 3, 2 } there are 4 triple inversions, namely (5,4,3), (5,4,2), (5,3,2) and (4,3,2). To simplify the problem, the list A is given as a permutation of integers from 1 to N."],"id":"1009","input":"Each input file contains one test case. For each case, the first line gives a positive integer N in [3,10\n5\n]. The second line contains a permutation of integers from 1 to N and each of the integer is separated by a single space.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805153092190208","output":"For each case, print in a line the number of triple inversions in the list.","samples":[{"input":"22\n1 2 3 4 5 16 6 7 8 9 10 19 11 12 14 15 17 18 21 22 20 13","output":"8","explanation":"","label":""}],"score":35,"title":"Triple Inversions","category":"树状数组","idea":["对每个中间位置 j，分别统计左侧比 a[j] 大的数量和右侧比 a[j] 小的数量。","从左、从右各扫描一次，使用树状数组维护已经出现的值。","以 j 为中点的三元逆序对数量是两者乘积，累加得到答案。"],"keyPoints":["排列值域正好是 1..N，可直接作为树状数组下标。","答案最多为组合数 C(N,3)，必须使用 long long。","左大与右小必须针对同一个中间位置相乘。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Fenwick {\n  vector\u003cint> tree;\n  explicit Fenwick(int n) : tree(n + 1) {}\n  void add(int x) { for (; x \u003c (int)tree.size(); x += x & -x) ++tree[x]; }\n  int sum(int x) const { int r = 0; for (; x; x -= x & -x) r += tree[x]; return r; }\n};\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  int n; cin >> n;\n  vector\u003cint> a(n), leftGreater(n), rightLess(n);\n  for (int &x : a) cin >> x;\n  Fenwick left(n);\n  for (int i = 0; i \u003c n; ++i) {\n    leftGreater[i] = i - left.sum(a[i]);\n    left.add(a[i]);\n  }\n  Fenwick right(n);\n  for (int i = n - 1; i >= 0; --i) {\n    rightLess[i] = right.sum(a[i] - 1);\n    right.add(a[i]);\n  }\n  long long answer = 0;\n  for (int i = 0; i \u003c n; ++i) answer += 1LL * leftGreater[i] * rightLess[i];\n  cout \u003c\u003c answer \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"22\n1 2 3 4 5 16 6 7 8 9 10 19 11 12 14 15 17 18 21 22 20 13","sampleOutput":"8"},{"description":["According to Wikipedia: \"In mathematics and in particular in combinatorics, the Lehmer code is a particular way to encode each possible permutation of a sequence of n numbers.\" To be more specific, for a given permutation of items {A\n1\n\t​",", A\n2\n\t​",", ⋯, A\nn\n\t​","}, Lehmer code is a sequence of numbers {L\n1\n\t​",", L\n2\n\t​",", ⋯, L\nn\n\t​","} such that L\ni\n\t​"," is the total number of items from A\ni\n\t​"," to A\nn\n\t​"," which are less than A\ni\n\t​",". For example, given { 24, 35, 12, 1, 56, 23 }, the second Lehmer code L\n2\n\t​"," is 3 since from 35 to 23 there are three items, { 12, 1, 23 }, less than the second item, 35."],"id":"1010","input":"Each input file contains one test case. For each case, the first line gives a positive integer N (≤10\n5\n). Then N distinct numbers are given in the next line.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805152735674368","output":"For each test case, output in a line the corresponding Lehmer code. The numbers must be separated by exactly one space, and there must be no extra space at the beginning or the end of the line.","samples":[{"input":"6\n24 35 12 1 56 23","output":"3 3 1 0 1 0","explanation":"","label":""}],"score":35,"title":"Lehmer Code","category":"离散化与树状数组","idea":["Lehmer code 的第 i 项是 a[i] 右侧严格小于它的元素个数。","先对所有不同数排序离散化，把任意数值映射为 1..N 的秩。","从右向左扫描，树状数组查询当前秩之前的数量，再加入当前元素。"],"keyPoints":["输入数值不保证是 1..N，必须先离散化。","题目保证数字互异，因此查询严格小于可直接使用 rank-1。","输出项之间一个空格，行首行尾不能有多余空格。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Fenwick {\n  vector\u003cint> tree;\n  explicit Fenwick(int n) : tree(n + 1) {}\n  void add(int x) { for (; x \u003c (int)tree.size(); x += x & -x) ++tree[x]; }\n  int sum(int x) const { int r = 0; for (; x; x -= x & -x) r += tree[x]; return r; }\n};\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n\n  int n; cin >> n;\n  vector\u003clong long> a(n), sorted;\n  for (auto &x : a) cin >> x;\n  sorted = a;\n  sort(sorted.begin(), sorted.end());\n  vector\u003cint> code(n);\n  Fenwick bit(n);\n  for (int i = n - 1; i >= 0; --i) {\n    int rank = int(lower_bound(sorted.begin(), sorted.end(), a[i]) - sorted.begin()) + 1;\n    code[i] = bit.sum(rank - 1);\n    bit.add(rank);\n  }\n  for (int i = 0; i \u003c n; ++i) cout \u003c\u003c (i ? \" \" : \"\") \u003c\u003c code[i];\n  cout \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"6\n24 35 12 1 56 23","sampleOutput":"3 3 1 0 1 0"},{"description":["When a rectangle is cut by a straight line, we can easily obtain two polygons as the result. But the reversed problem is harder: given two polygons, your task is to check whether or not they could be obtained by cutting a rectangle.","To give you more trouble, the input polygons are possibly moved, rotated (90 degrees, 180 degrees, or 270 degrees counter-clockwise), or even flipped (mirrored).","It is assumed that the original rectangle's edges are parallel to the axis."],"id":"1011","input":"Each input file contains one test case. For each case, the first line gives a positive integer N (≤20), and then N pairs of polygons are given. Each polygon is described in the format:\n\nk x\n1\n\t​\n\n y\n1\n\t​\n\n ⋯ x\nk\n\t​\n\n y\nk\n\t​\n\nwhere k (2\u003ck≤10) is the number of vertices on the polygon, and (x\ni\n\t​\n\n, y\ni\n\t​\n\n) (0≤x\ni\n\t​\n\n,y\ni\n\t​\n\n≤10\n8\n) are the coordinates of the vertices, given in either clockwise or counter-clockwise order.\n\nNote: there is no redundant vertex. That is, it is guaranteed that all the vertices are distinct for each polygon, and that no three consecutive vertices are on the same line.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805152379158528","output":"For each pair of polygons, print in a line either YES or NO as the answer.","samples":[{"input":"8\n3 0 0 1 0 1 1\n3 0 0 1 1 0 1\n3 0 0 1 0 1 1\n3 0 0 1 1 0 2\n4 0 4 1 4 1 0 0 0\n4 4 0 4 1 0 1 0 0\n3 0 0 1 1 0 1\n4 2 3 1 4 1 7 2 7\n5 10 10 10 12 12 12 14 11 14 10\n3 28 35 29 35 29 37\n3 7 9 8 11 8 9\n5 87 26 92 26 92 23 90 22 87 22\n5 0 0 2 0 1 1 1 2 0 2\n4 0 0 1 1 2 1 2 0\n4 0 0 0 1 1 1 2 0\n4 0 0 0 1 1 1 2 0","output":"YES\nNO\nYES\nYES\nYES\nYES\nNO\nYES","explanation":"","label":""}],"score":35,"title":"Cut Rectangles","category":"计算几何","idea":["第一块多边形保持不动，对第二块枚举 4 次旋转与镜像，共 8 种刚性变换。","再枚举两块多边形的顶点对齐平移；候选拼合体的包围盒就是原矩形。","检查总面积等于矩形面积、两块内部不重叠且全部顶点位于矩形中。"],"keyPoints":["只允许 90 度整数旋转、翻转和平移，坐标可始终保持整数。","面积使用二倍有向面积与 long long，避免浮点误差。","两块可以共享切割边，但不能有正面积交叠。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Point { long long x, y; };\nlong long cross(Point a, Point b, Point c) {\n  return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);\n}\nlong long area2(const vector\u003cPoint> &p) {\n  long long s = 0;\n  for (int i = 0; i \u003c (int)p.size(); ++i) {\n    Point a = p[i], b = p[(i + 1) % p.size()];\n    s += a.x * b.y - a.y * b.x;\n  }\n  return llabs(s);\n}\nint sign(long long x) { return (x > 0) - (x \u003c 0); }\nbool properIntersect(Point a, Point b, Point c, Point d) {\n  return sign(cross(a, b, c)) * sign(cross(a, b, d)) \u003c 0 &&\n         sign(cross(c, d, a)) * sign(cross(c, d, b)) \u003c 0;\n}\nbool insideStrict(const vector\u003cPoint> &p, Point q) {\n  int orientation = 0;\n  for (int i = 0; i \u003c (int)p.size(); ++i) {\n    long long value = cross(p[i], p[(i + 1) % p.size()], q);\n    if (!value) return false;\n    int current = sign(value);\n    if (!orientation) orientation = current;\n    else if (orientation != current) return false;\n  }\n  return true;\n}\nbool isConvex(const vector\u003cPoint> &p) {\n  int orientation = 0;\n  for (int i = 0; i \u003c (int)p.size(); ++i) {\n    int current = sign(cross(p[i], p[(i + 1) % p.size()], p[(i + 2) % p.size()]));\n    if (!current) continue;\n    if (!orientation) orientation = current;\n    else if (orientation != current) return false;\n  }\n  return true;\n}\nPoint transform(Point p, int kind) {\n  if (kind >= 4) p.x = -p.x;\n  for (int turn = 0; turn \u003c kind % 4; ++turn) p = Point{-p.y, p.x};\n  return p;\n}\nbool overlapPositive(const vector\u003cPoint> &a, const vector\u003cPoint> &b) {\n  for (int i = 0; i \u003c (int)a.size(); ++i)\n    for (int j = 0; j \u003c (int)b.size(); ++j)\n      if (properIntersect(a[i], a[(i + 1) % a.size()], b[j], b[(j + 1) % b.size()])) return true;\n  return insideStrict(a, b[0]) || insideStrict(b, a[0]);\n}\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n  int cases; cin >> cases;\n  while (cases--) {\n    vector\u003cPoint> a, original;\n    int k; cin >> k; a.resize(k);\n    for (auto &p : a) cin >> p.x >> p.y;\n    cin >> k; original.resize(k);\n    for (auto &p : original) cin >> p.x >> p.y;\n    bool ok = false;\n    if (!isConvex(a) || !isConvex(original)) { cout \u003c\u003c \"NO\\n\"; continue; }\n    for (int kind = 0; kind \u003c 8 && !ok; ++kind) {\n      vector\u003cPoint> base = original;\n      for (auto &p : base) p = transform(p, kind);\n      for (Point pa : a) for (Point pb : base) {\n        vector\u003cPoint> b = base;\n        for (auto &p : b) { p.x += pa.x - pb.x; p.y += pa.y - pb.y; }\n        long long minX = a[0].x, maxX = a[0].x, minY = a[0].y, maxY = a[0].y;\n        for (Point p : a) { minX=min(minX,p.x); maxX=max(maxX,p.x); minY=min(minY,p.y); maxY=max(maxY,p.y); }\n        for (Point p : b) { minX=min(minX,p.x); maxX=max(maxX,p.x); minY=min(minY,p.y); maxY=max(maxY,p.y); }\n        if (area2(a) + area2(b) != 2 * (maxX - minX) * (maxY - minY)) continue;\n        bool inBox = true;\n        for (Point p : a) inBox &= minX \u003c= p.x && p.x \u003c= maxX && minY \u003c= p.y && p.y \u003c= maxY;\n        for (Point p : b) inBox &= minX \u003c= p.x && p.x \u003c= maxX && minY \u003c= p.y && p.y \u003c= maxY;\n        if (inBox && !overlapPositive(a, b)) { ok = true; break; }\n      }\n    }\n    cout \u003c\u003c (ok ? \"YES\" : \"NO\") \u003c\u003c '\\n';\n  }\n  return 0;\n}\n","sampleInput":"8\n3 0 0 1 0 1 1\n3 0 0 1 1 0 1\n3 0 0 1 0 1 1\n3 0 0 1 1 0 2\n4 0 4 1 4 1 0 0 0\n4 4 0 4 1 0 1 0 0\n3 0 0 1 1 0 1\n4 2 3 1 4 1 7 2 7\n5 10 10 10 12 12 12 14 11 14 10\n3 28 35 29 35 29 37\n3 7 9 8 11 8 9\n5 87 26 92 26 92 23 90 22 87 22\n5 0 0 2 0 1 1 1 2 0 2\n4 0 0 1 1 2 1 2 0\n4 0 0 0 1 1 1 2 0\n4 0 0 0 1 1 1 2 0","sampleOutput":"YES\nNO\nYES\nYES\nYES\nYES\nNO\nYES"},{"description":["Have you ever played the game \"Greedy Snake\"? In the game, we control the movements of the snake to eat the fruits scattered in the game field, while the snake's body gets longer whenever it eats a fruit. The goal of the game is to make the snake eat as many fruits as possible, before its head has no where to go. It would be a real challenge to let you program this game, right now.","But hey! Relax! This time you are only asked to program a simplified version of the game. In this simple version, the fruits are all over the place except at some extra obstacle cells. The snake's body will extend all the way along the path while it eats the fruits. You may take any fruit cell as the starting position of the snake. Then you have four directions to choose from: UP, DOWN, LEFT or RIGHT. Once you pick up a direction for the snake, it must keep going until it hits an obstacle or its own body. This procedure repeats until the head of the snake has no where to go -- that is, every adjacent cell of its head is either an obstacle or its own body. Your task is to minimize the number of fruits left.","For example, let's define the game field to be a 6 by 6 maze, surrounded by obstacle cells #, with one extra obstacle @. S is the starting position of the snake. All the fruits are represented by dots.","######\n#..S@#\n#....#\n#....#\n#....#\n######","Then if you decide to move DOWN, RIGHT, and UP, the results are shown below.","######\n#..*@#\n#..*.#\n#..*.#\n#..S.#\n######","######\n#..*@#\n#..*.#\n#..*.#\n#..*S#\n######","######\n#..*@#\n#..*S#\n#..**#\n#..**#\n######","Now the snake is stucked, the game is over, and there are 8 fruits left. However, by carefully changing your moves or choosing another starting position, you can actually control the snake to eat up all the fruits. Try it out!","Task 1: minimize the number of fruits left, and count the number of starting positions that can lead to the optimal solution.","Task 2: To make things more interesting, you may replace one fruit cell by an obstacle, to obtain a better result, and count the number of ways to add an obstacle that leads to the better result. In case there is no way to improve the result by adding one obstacle, you should point out this situation."],"id":"1012","input":"Each input file contains one test case. For each case, the first line contains two integers N (4≤N≤15), the size of the game field, and K (0≤K≤2), the number of extra obstacles. Then K lines follow, each gives the coordinates of an obstacle in the format \"x\ni\n\t​\n\n y\ni\n\t​\n\n\" where 2≤x\ni\n\t​\n\n,y\ni\n\t​\n\n≤N−1.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805152010059776","output":"For each case, print the results in two lines. In the first line print the minimal number of fruits left, and the number of different optimal starting positions. Then in the second line, either print −1 if there is no way to improve the result, or two integers: the better result and the number of optimal ways to add an obstacle.","samples":[{"input":"6 1\n2 5","output":"0 4\n-1","explanation":"","label":""},{"input":"6 2\n2 2\n3 3","output":"2 1\n0 2","explanation":"","label":""}],"score":35,"title":"Greedy Snake","category":"状态搜索","idea":["把边界、额外障碍和蛇身统一看成不可进入格；一次选择方向后持续移动到下一格被挡。","对每个起点 DFS 四个方向，用蛇身位图与蛇头位置记忆化，求该起点最多能吃掉的水果数。","先统计原棋盘最优值；再枚举增加一个障碍的空格，重新计算并汇总真正改善结果的方案。"],"keyPoints":["一种起点只计一次，即使它有多条走法达到最优。","方向选择后不能中途转弯，必须一直滑到被阻挡的位置。","新增障碍会减少水果总数，比较的是最终剩余水果数。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint n;\nvector\u003cchar> blocked;\nunordered_map\u003cstring, int> memo;\nconst int dx[4] = {-1, 1, 0, 0};\nconst int dy[4] = {0, 0, -1, 1};\n\nstring keyOf(const vector\u003cuint64_t> &body, int head) {\n  string key(reinterpret_cast\u003cconst char*>(body.data()), body.size() * sizeof(uint64_t));\n  key.append(reinterpret_cast\u003cconst char*>(&head), sizeof(head));\n  return key;\n}\nbool occupied(const vector\u003cuint64_t> &body, int cell) {\n  return (body[cell / 64] >> (cell % 64)) & 1ULL;\n}\nvoid occupy(vector\u003cuint64_t> &body, int cell) { body[cell / 64] |= 1ULL \u003c\u003c (cell % 64); }\n\nint searchSnake(vector\u003cuint64_t> body, int head) {\n  string key = keyOf(body, head);\n  auto found = memo.find(key);\n  if (found != memo.end()) return found->second;\n  int best = 0, x = head / n, y = head % n;\n  for (int direction = 0; direction \u003c 4; ++direction) {\n    int nx = x, ny = y, moved = 0, nextHead = head;\n    vector\u003cuint64_t> nextBody = body;\n    while (true) {\n      int tx = nx + dx[direction], ty = ny + dy[direction];\n      if (tx \u003c 0 || tx >= n || ty \u003c 0 || ty >= n) break;\n      int cell = tx * n + ty;\n      if (blocked[cell] || occupied(nextBody, cell)) break;\n      nx = tx; ny = ty; nextHead = cell;\n      occupy(nextBody, cell); ++moved;\n    }\n    if (moved) best = max(best, moved + searchSnake(move(nextBody), nextHead));\n  }\n  return memo.emplace(move(key), best).first->second;\n}\n\npair\u003cint,int> evaluate() {\n  int fruits = 0, bestEaten = -1, starts = 0;\n  memo.clear();\n  for (int cell = 0; cell \u003c n * n; ++cell) if (!blocked[cell]) ++fruits;\n  for (int start = 0; start \u003c n * n; ++start) {\n    if (blocked[start]) continue;\n    vector\u003cuint64_t> body((n * n + 63) / 64);\n    occupy(body, start);\n    int eaten = 1 + searchSnake(body, start);\n    if (eaten > bestEaten) { bestEaten = eaten; starts = 1; }\n    else if (eaten == bestEaten) ++starts;\n  }\n  return {fruits - bestEaten, starts};\n}\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n  int k; cin >> n >> k;\n  blocked.assign(n * n, 0);\n  for (int x = 0; x \u003c n; ++x) blocked[x*n] = blocked[x*n+n-1] = 1;\n  for (int y = 0; y \u003c n; ++y) blocked[y] = blocked[(n-1)*n+y] = 1;\n  while (k--) { int x, y; cin >> x >> y; blocked[(x-1)*n + y-1] = 1; }\n  auto original = evaluate();\n  cout \u003c\u003c original.first \u003c\u003c ' ' \u003c\u003c original.second \u003c\u003c '\\n';\n  int better = original.first, ways = 0;\n  vector\u003cchar> base = blocked;\n  for (int cell = 0; cell \u003c n*n; ++cell) {\n    if (base[cell]) continue;\n    blocked = base; blocked[cell] = 1;\n    int left = evaluate().first;\n    if (left \u003c better) { better = left; ways = 1; }\n    else if (left == better && left \u003c original.first) ++ways;\n  }\n  if (better \u003c original.first) cout \u003c\u003c better \u003c\u003c ' ' \u003c\u003c ways \u003c\u003c '\\n';\n  else cout \u003c\u003c -1 \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"6 1\n2 5","sampleOutput":"0 4\n-1"},{"description":["Image segmentation is usually formulated as a graph partition problem, where each segment corresponds to a connected component. Moreover, each pixel is the vertex of the graph. Each edge has a weight, which is a non-negative dissimilarity between neighboring pixels. So, the goal of image segmentation is to decompose the image graph into several disconnected components, where the elements in a component are similar and the elements in the different components are dissimilar.","The components are defined as follows:","A component is made of a set of connected vertices;\nAny two components have no shared vertices;\nThe dissimilarity D(C1,C2) of any two components C1 and C2 is larger than the confidence H of any of C1 and C2.\nThe dissimilarity D(C1,C2) is defined to be the minimum edge weight of all the edges connecting C1 and C2, or infinity if no such edge exists;\nThe confidence of a component C, H(C), is defined to be the maximum edge weight of the minimum spanning tree of C, plus a function f(C)=c/∣C∣ where c is a positive constant and ∣C∣ is the size of the component C;\nA set of vertices must not be treated as a component if they can be partitioned into two or more components.","Your job is to write a program to list all the components."],"id":"1013","input":"Each input file contains one test case.  For each case, the first line contains three integers: N\nv\n\t​\n\n (0\u003cN\nv\n\t​\n\n≤1000), the total number of vertices (and hence the vertices are numbered from 0 to N\nv\n\t​\n\n−1); N\ne\n\t​\n\n, the total number of edges; and c, the constant in the function f(C).  Then N\ne\n\t​\n\n lines follow, each gives an adge in the format:\n\nV1 V2 Weight\n\nNote: it is guaranteed that each pixel has no more than 8 neighboring pixels.  The constant and all the weights are positive and are no more than 1000.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805151670321152","output":"For each case, list each component in a line.  The vertices in a component must be printed in increasing order, separated by one space with no extra space at the beginning or the end of the line.  The components must be listed in increasing order of their first vertex.","samples":[{"input":"10 21 100\n0 1 10\n0 3 60\n0 4 90\n1 2 90\n1 3 50\n1 4 200\n1 5 86\n2 4 95\n2 5 5\n3 4 95\n3 6 15\n3 7 101\n4 5 500\n4 6 100\n4 7 101\n4 8 101\n5 7 300\n5 8 50\n6 7 90\n7 8 84\n7 9 34","output":"0 1 3 6\n2 5 8\n4\n7 9","explanation":"","label":""},{"input":"7 7 100\n0 1 10\n1 2 61\n2 3 50\n3 4 200\n4 5 82\n5 0 200\n3 6 90","output":"0 1\n2 3 6\n4 5","explanation":"","label":""}],"score":35,"title":"Image Segmentation","category":"并查集","idea":["按边权从小到大处理，维护每个分量的大小与其最小生成树中的最大边权。","边权不超过两个分量置信度的较小值时合并。","处理完后按根收集顶点，分量内及分量间都按编号升序输出。"],"keyPoints":["H(C)=Int(C)+c/|C|，其中 Int(C) 是当前分量 MST 的最大边权。","判断阈值要使用浮点除法，不能先做整数除法。","边排序后合并，新分量的 Int 就是当前边权。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct DSU {\n  vector\u003cint> p, size, internal;\n  explicit DSU(int n) : p(n), size(n,1), internal(n,0) { iota(p.begin(),p.end(),0); }\n  int find(int x) { return p[x]==x ? x : p[x]=find(p[x]); }\n  void merge(int a,int b,int w) {\n    a=find(a); b=find(b); if(a==b) return;\n    if(size[a]\u003csize[b]) swap(a,b);\n    p[b]=a; size[a]+=size[b]; internal[a]=w;\n  }\n};\nstruct Edge { int u,v,w; };\n\nint main(){\n  ios::sync_with_stdio(false); cin.tie(nullptr);\n  int nv,ne,c; cin>>nv>>ne>>c;\n  vector\u003cEdge> edges(ne);\n  for(auto &e:edges) cin>>e.u>>e.v>>e.w;\n  sort(edges.begin(),edges.end(),[](const Edge&a,const Edge&b){return a.w\u003cb.w;});\n  DSU dsu(nv);\n  for(const auto&e:edges){\n    int a=dsu.find(e.u), b=dsu.find(e.v);\n    if(a==b) continue;\n    double threshold=min
