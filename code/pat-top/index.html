(dsu.internal[a]+double(c)/dsu.size[a],\n                         dsu.internal[b]+double(c)/dsu.size[b]);\n    if(e.w\u003c=threshold) dsu.merge(a,b,e.w);\n  }\n  map\u003cint,vector\u003cint>> groups;\n  for(int i=0;i\u003cnv;++i) groups[dsu.find(i)].push_back(i);\n  vector\u003cvector\u003cint>> answer;\n  for(auto &entry:groups) answer.push_back(move(entry.second));\n  sort(answer.begin(),answer.end(),[](const auto&a,const auto&b){return a[0]\u003cb[0];});\n  for(const auto&group:answer){\n    for(int i=0;i\u003c(int)group.size();++i) cout\u003c\u003c(i?\" \":\"\")\u003c\u003cgroup[i];\n    cout\u003c\u003c'\\n';\n  }\n  return 0;\n}\n","sampleInput":"10 21 100\n0 1 10\n0 3 60\n0 4 90\n1 2 90\n1 3 50\n1 4 200\n1 5 86\n2 4 95\n2 5 5\n3 4 95\n3 6 15\n3 7 101\n4 5 500\n4 6 100\n4 7 101\n4 8 101\n5 7 300\n5 8 50\n6 7 90\n7 8 84\n7 9 34","sampleOutput":"0 1 3 6\n2 5 8\n4\n7 9"},{"description":["A circle of friends is a network of friend relationships. If A is a friend of B, then B is considered a friend of A no matter B admits or not, and they are said to belong to the same circle. Here we assume that friendship is transitive, that is, if A is a friend of B, and B is a friend of C, then A is a friend of C and the three of them all belong to the same circle.","On the other hand, A is not so close to C as B is. We define the distance D(X, Y) between two friends X and Y as the minimum number of friends between them. For example, D(A, B) = 0, and D(C, A) = 1. The diameter of a friends circle is the maximum distance between any pair of friends in the circle.","Now given some people's relationships, you are supposed to find the number of friends circles and the circle with the largest diameter."],"id":"1014","input":"Each input file contains one test case. For each case, the first line gives an integer N (2≤N≤1000), which is the total number of people involved, and hence they are numbered from 1 to N. Then N lines follow, each in the format:\n\nk p\n1\n\t​\n\n ... p\nk\n\t​\n\nwhere k (0≤k\u003cmin(10,N)) is the number of friends and p\n1\n\t​\n\n to p\nk\n\t​\n\n (if k>0) are the friends' indices. The i-th line corresponds to the i-th person. All the numbers in a line are separated by spaces. It is guaranteed that no one is given as a friend of oneself.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805151343165440","output":"For each case, print in a line the number of friends circles, and the largest diameter, separated by exactly one space.","samples":[{"input":"17\n2 15 12\n1 17\n2 16 9\n1 8\n4 10 13 15 14\n0\n2 11 14\n1 4\n2 2 3\n2 13 11\n2 15 7\n2 1 14\n2 5 15\n0\n0\n1 3\n1 2","output":"4 3","explanation":"","label":""}],"score":35,"title":"Circles of Friends","category":"图的连通性","idea":["把单向填写的好友关系按无向边加入邻接表，先找出所有连通分量。","对每个分量中的每个顶点做 BFS，得到该分量任意两点的最短边数最大值。","题目距离是“中间有几位朋友”，因此边数距离要减 1。"],"keyPoints":["A 写了 B 即视为双方好友，必须建无向边。","相邻好友的题目距离为 0，不是 1。","N≤1000 且每人给出的好友少于 10，全源 BFS 可以通过。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false); cin.tie(nullptr);\n  int n; cin>>n;\n  vector\u003cvector\u003cint>> g(n);\n  for(int i=0;i\u003cn;++i){\n    int k; cin>>k;\n    while(k--){int v;cin>>v;--v;g[i].push_back(v);g[v].push_back(i);}\n  }\n  vector\u003cchar> seen(n); int circles=0, largest=0;\n  for(int start=0;start\u003cn;++start){\n    if(seen[start]) continue;\n    ++circles; vector\u003cint> component; queue\u003cint> q; q.push(start); seen[start]=1;\n    while(!q.empty()){\n      int u=q.front();q.pop();component.push_back(u);\n      for(int v:g[u]) if(!seen[v]){seen[v]=1;q.push(v);}\n    }\n    for(int source:component){\n      vector\u003cint> dist(n,-1); dist[source]=0; q.push(source);\n      while(!q.empty()){\n        int u=q.front();q.pop();\n        largest=max(largest,max(0,dist[u]-1));\n        for(int v:g[u]) if(dist[v]\u003c0){dist[v]=dist[u]+1;q.push(v);}\n      }\n    }\n  }\n  cout\u003c\u003ccircles\u003c\u003c' '\u003c\u003clargest\u003c\u003c'\\n';\n  return 0;\n}\n","sampleInput":"17\n2 15 12\n1 17\n2 16 9\n1 8\n4 10 13 15 14\n0\n2 11 14\n1 4\n2 2 3\n2 13 11\n2 15 7\n2 1 14\n2 5 15\n0\n0\n1 3\n1 2","sampleOutput":"4 3"},{"description":["Here is a simple intersting letter-moving game. The game starts with 2 strings S and T consist of lower case English letters. S and T contain the same letters but the orders might be different. In other words S can be obtained by shuffling letters in String T. At each step, you can move one arbitrary letter in S either to the beginning or to the end of it. How many steps at least to change S into T?"],"id":"1015","input":"Each input file contains one test case. For each case, the first line contains the string S, and the second line contains the string T. They consist of only the lower case English letters and S can be obtained by shuffling T's letters. The length of S is no larger than 1000.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805151045369856","output":"For each case, print in a line the least number of steps to change S into T in the game.","samples":[{"input":"iononmrogdg\ngoodmorning","output":"8","explanation":"","label":""}],"score":35,"title":"Letter-moving Game","category":"子序列","idea":["未被移动的字母在 S 中保持相对顺序，在最终 T 中必须是一段连续区间。","枚举 T 的区间起点，用双指针寻找从该起点开始、能够作为 S 子序列的最长连续段。","最大保留长度为 keep，其他 n-keep 个字母分别移到首部或尾部即可。"],"keyPoints":["寻找的是 T 的连续子串，同时它是 S 的子序列，不是普通最长公共子序列。","字符串长度只有 1000，O(n²) 双指针足够。","S 与 T 字符多重集合相同，答案一定可构造。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false); cin.tie(nullptr);\n  string s,t; cin>>s>>t;\n  int best=0,n=(int)s.size();\n  for(int begin=0;begin\u003cn;++begin){\n    int next=begin;\n    for(char c:s) if(next\u003cn && c==t[next]) ++next;\n    best=max(best,next-begin);\n  }\n  cout\u003c\u003cn-best\u003c\u003c'\\n';\n  return 0;\n}\n","sampleInput":"iononmrogdg\ngoodmorning","sampleOutput":"8"},{"description":["Given any weighted undirected graph, there exists at least one minimum spanning tree (MST) if the graph is connected. Sometimes the MST may not be unique though. Here you are supposed to calculate the minimum total weight of the MST, and also tell if it is unique or not."],"id":"1016","input":"Each input file contains one test case. Each case starts with a line containing 2 numbers N (≤ 500), and M, which are the total number of vertices, and the number of edges, respectively. Then M lines follow, each describes an edge by 3 integers:\n\nV1 V2 Weight\n\nwhere V1 and V2 are the two ends of the edge (the vertices are numbered from 1 to N), and Weight is the positive weight on that edge. It is guaranteed that the total weight of the graph will not exceed 2\n30\n.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805150751768576","output":"For each test case, first print in a line the total weight of the minimum spanning tree if there exists one, or else print No MST instead. Then if the MST exists, print in the next line Yes if the tree is unique, or No otherwise. There there is no MST, print the number of connected components instead.","samples":[{"input":"5 7\n1 2 6\n5 1 1\n2 3 4\n3 4 3\n4 1 7\n2 4 2\n4 5 5","output":"11\nYes","explanation":"","label":""},{"input":"4 5\n1 2 1\n2 3 1\n3 4 2\n4 1 2\n3 1 3","output":"4\nNo","explanation":"","label":""},{"input":"5 5\n1 2 1\n2 3 1\n3 4 2\n4 1 2\n3 1 3","output":"No MST\n2","explanation":"","label":""}],"score":35,"title":"Uniqueness of MST","category":"最小生成树","idea":["按边权分组执行 Kruskal，主并查集表示更小权边已经连通的收缩点。","在真正合并某个同权组之前，用临时并查集检查该组候选边是否在收缩图中形成环。","形成环说明存在同权替换，MST 不唯一；之后仍正常合并并累计权值。"],"keyPoints":["唯一性必须在同权边整体合并之前判断，否则顺序会掩盖替换关系。","若最终边数不足 N-1，输出 No MST 和连通分量数。","总权值使用 long long。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct DSU{\n  vector\u003cint> p,sz; explicit DSU(int n):p(n+1),sz(n+1,1){iota(p.begin(),p.end(),0);}\n  int find(int x){return p[x]==x?x:p[x]=find(p[x]);}\n  bool unite(int a,int b){a=find(a);b=find(b);if(a==b)return false;if(sz[a]\u003csz[b])swap(a,b);p[b]=a;sz[a]+=sz[b];return true;}\n};\nstruct Edge{int u,v,w;};\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  int n,m;cin>>n>>m;vector\u003cEdge> e(m);for(auto&x:e)cin>>x.u>>x.v>>x.w;\n  sort(e.begin(),e.end(),[](const Edge&a,const Edge&b){return a.w\u003cb.w;});\n  DSU mainDsu(n);long long total=0;int used=0;bool unique=true;\n  for(int left=0;left\u003cm;){\n    int right=left;while(right\u003cm&&e[right].w==e[left].w)++right;\n    unordered_map\u003cint,int> localId;vector\u003cpair\u003cint,int>> candidate;\n    for(int i=left;i\u003cright;++i){\n      int a=mainDsu.find(e[i].u),b=mainDsu.find(e[i].v);if(a==b)continue;\n      if(!localId.count(a))localId[a]=localId.size()+1;\n      if(!localId.count(b))localId[b]=localId.size()+1;\n      candidate.push_back({localId[a],localId[b]});\n    }\n    DSU local((int)localId.size());\n    for(auto [a,b]:candidate) if(!local.unite(a,b)) unique=false;\n    for(int i=left;i\u003cright;++i) if(mainDsu.unite(e[i].u,e[i].v)){total+=e[i].w;++used;}\n    left=right;\n  }\n  if(used!=n-1){\n    set\u003cint> roots;for(int i=1;i\u003c=n;++i)roots.insert(mainDsu.find(i));\n    cout\u003c\u003c\"No MST\\n\"\u003c\u003croots.size()\u003c\u003c'\\n';\n  }else cout\u003c\u003ctotal\u003c\u003c'\\n'\u003c\u003c(unique?\"Yes\":\"No\")\u003c\u003c'\\n';\n  return 0;\n}\n","sampleInput":"5 7\n1 2 6\n5 1 1\n2 3 4\n3 4 3\n4 1 7\n2 4 2\n4 5 5","sampleOutput":"11\nYes"},{"description":["In many research areas, one important target of analyzing data is to find the best \"peak shape\" out of a huge amount of raw data full of noises. A \"peak shape\" of length L is an ordered sequence of L numbers { D\n1\n\t​",", ⋯, D\nL\n\t​"," } satisfying that there exists an index i (1\u003ci\u003cL) such that D\n1\n\t​","\u003c⋯\u003cD\ni−1\n\t​","\u003cD\ni\n\t​",">D\ni+1\n\t​",">⋯>D\nL\n\t​",".","Now given N input numbers ordered by their indices, you may remove some of them to keep the rest of the numbers in a peak shape. The best peak shape is the longest sub-sequence that forms a peak shape. If there is a tie, then the most symmetric (meaning that the difference of the lengths of the increasing and the decreasing sub-sequences is minimized) one will be chosen."],"id":"1017","input":"Each input file contains one test case. For each case, the first line gives an integer N (3≤N≤10\n4\n). Then N integers are given in the next line, separated by spaces. All the integers are in [−10000,10000].","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805150479138816","output":"For each case, print in a line the length of the best peak shape, the index (starts from 1) and the value of the peak number. If the solution does not exist, simply print \"No peak shape\" in a line. The judge's input guarantees the uniqueness of the output.","samples":[{"input":"20\n1 3 0 8 5 -2 29 20 20 4 10 4 7 25 18 6 17 16 2 -1","output":"10 14 25","explanation":"","label":""},{"input":"5\n-1 3 8 10 20","output":"No peak shape","explanation":"","label":""}],"score":35,"title":"The Best Peak Shape","category":"最长上升子序列","idea":["离散化数值，用树状数组维护区间最大值，求每个位置结尾的严格上升长度。","从右向左以相同方式求从每个位置开始的严格下降长度。","枚举峰顶，先最大化两臂总长度，再最小化两臂长度差。"],"keyPoints":["严格递增/递减只能查询当前值排名之前的区间。","峰顶两侧都必须至少有一个元素，即两个长度都要大于 1。","总长度是 inc+dec-1，因为峰顶被计算了两次。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct FenwickMax{\n  vector\u003cint> t;explicit FenwickMax(int n):t(n+1){}\n  void update(int x,int v){for(;x\u003c(int)t.size();x+=x&-x)t[x]=max(t[x],v);}\n  int query(int x){int r=0;for(;x;x-=x&-x)r=max(r,t[x]);return r;}\n};\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  int n;cin>>n;vector\u003cint>a(n),values;for(int&x:a)cin>>x;values=a;\n  sort(values.begin(),values.end());values.erase(unique(values.begin(),values.end()),values.end());\n  vector\u003cint>inc(n),dec(n);FenwickMax left(values.size()),right(values.size());\n  for(int i=0;i\u003cn;++i){int r=lower_bound(values.begin(),values.end(),a[i])-values.begin()+1;inc[i]=left.query(r-1)+1;left.update(r,inc[i]);}\n  for(int i=n-1;i>=0;--i){int r=lower_bound(values.begin(),values.end(),a[i])-values.begin()+1;dec[i]=right.query(r-1)+1;right.update(r,dec[i]);}\n  int best=0,balance=n,peak=-1;\n  for(int i=0;i\u003cn;++i)if(inc[i]>1&&dec[i]>1){\n    int length=inc[i]+dec[i]-1,diff=abs(inc[i]-dec[i]);\n    if(length>best||(length==best&&diff\u003cbalance)){best=length;balance=diff;peak=i;}\n  }\n  if(peak\u003c0)cout\u003c\u003c\"No peak shape\\n\";\n  else cout\u003c\u003cbest\u003c\u003c' '\u003c\u003cpeak+1\u003c\u003c' '\u003c\u003ca[peak]\u003c\u003c'\\n';\n  return 0;\n}\n","sampleInput":"20\n1 3 0 8 5 -2 29 20 20 4 10 4 7 25 18 6 17 16 2 -1","sampleOutput":"10 14 25"},{"description":["Given a positive integer N, let us define a subnumber of N as a consecutive number of digits NOT starting with 0. For example if N=1021, it has 7 subnumbers, namely, 1, 10, 102, 1021, 2, 21 and 1 (again). Here is your task: please calculate the sum of all the subnumbers of N. For 1021, the sum is 1+10+102+1021+2+21+1 = 1158. Since the result may be very large, output the answer modulo 1000000007 (10\n9\n+7) please."],"id":"1018","input":"Each input file contains one test case, which gives the integer N (0\u003cN\u003c10\n100000\n) in a line.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805150219091968","output":"Print in a line the sum of all N's subnumbers (modulo 1000000007).","samples":[{"input":"1234567890123456789","output":"332876913","explanation":"","label":""}],"score":35,"title":"Subnumbers","category":"动态递推","idea":["扫描到当前数字时，所有此前合法子数都可在末尾追加当前数字。","若当前位非 0，它还可以作为一个新的起点；维护合法起点数量 starts。","ending 表示所有以当前位置结尾的子数之和，将它逐位累加到总答案。"],"keyPoints":["以 0 开头的子串不合法，但已有合法子串后面可以追加 0。","递推式为 ending=ending*10+digit*starts。","字符串可长达 100000，所有运算都要在线取模。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  const long long MOD=1000000007LL;string s;cin>>s;\n  long long starts=0,ending=0,answer=0;\n  for(char ch:s){\n    int digit=ch-'0';if(digit)++starts;\n    ending=(ending*10+digit*starts)%MOD;\n    answer=(answer+ending)%MOD;\n  }\n  cout\u003c\u003canswer\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"1234567890123456789","sampleOutput":"332876913"},{"description":["There are some animals in a zoo which can be described as a grid with N rows and M columns. Your task is to place some obstacles so that no pairs of animals can reach each other.","Two animals can reach each other if and only if their cells are 4-connected. For example, in Figure 1, the central blue cell can be reached by the four red cells, and cannot be reached by the other four white cells.","Figure 1","What is more, you must put obstacles in exactly K cells, which are 4-connected and form exactly H holes. Here a hole is defined as a 4-connected part with finitely many open cells while the zoo is placed in an infinite open grid. For example, there are 2 holes (the green and the yellow areas) in Figure 2.","Figure 2","For the following grid with two animals:","Figure 3","If K = 8 and H = 1, one way to separate them is the following:","Figure 4","Figure 5 is illegal because it contains no hole.","Figure 5","Figure 6 is also illegal because the obstacles are not 4-connected.","Figure 6","Given some animals, you are supposed to count the number of different solutions."],"id":"1019","input":"Each input file contains one test case. For each case, the first line gives four integers: N, M, K, H (2 ≤ N, M ≤ 6; 1 ≤ K ≤ 12; 0 ≤ H ≤ 2). All the numbers are separated by spaces.\n\nThen N lines follow, each contains M characters, which are either . or O, representing an open cell or an animal, respectively. There will be at least 2 animals.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805149963239424","output":"For each case, print a single line containing a single integer: the number of solutions.","samples":[{"input":"3 5 8 1\n...O.\n.O...\n.....","output":"8","explanation":"","label":""}],"score":35,"title":"Separate the Animals","category":"连通子集枚举","idea":["用 64 位掩码表示障碍集合，从所有单格集合开始，每轮只添加与集合四连通的格子。","使用哈希集合去重，扩展到恰好 K 格后逐个验证。","验证动物是否两两隔离；再在外扩一圈的网格上洪泛，统计未连通到外界的开放分量数。"],"keyPoints":["障碍只能放在原来的空格，且 K 个障碍必须整体四连通。","“洞”是不能连到无限外界的开放分量，外扩一圈可准确表达外界。","N×M≤36，一个 uint64_t 足以保存整个棋盘。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  int n,m,k,wantedH;cin>>n>>m>>k>>wantedH;vector\u003cstring> grid(n);for(auto&s:grid)cin>>s;\n  int cells=n*m;vector\u003cuint64_t> neighbor(cells);uint64_t available=0;\n  const int dx[4]={-1,1,0,0},dy[4]={0,0,-1,1};\n  for(int x=0;x\u003cn;++x)for(int y=0;y\u003cm;++y){\n    int id=x*m+y;if(grid[x][y]=='.')available|=1ULL\u003c\u003cid;\n    for(int d=0;d\u003c4;++d){int nx=x+dx[d],ny=y+dy[d];if(nx>=0&&nx\u003cn&&ny>=0&&ny\u003cm)neighbor[id]|=1ULL\u003c\u003c(nx*m+ny);}\n  }\n  unordered_set\u003cuint64_t> current;\n  for(int i=0;i\u003ccells;++i)if((available>>i)&1ULL)current.insert(1ULL\u003c\u003ci);\n  for(int size=1;size\u003ck;++size){\n    unordered_set\u003cuint64_t> next;\n    for(uint64_t mask:current){\n      uint64_t border=0,temp=mask;\n      while(temp){int bit=__builtin_ctzll(temp);temp&=temp-1;border|=neighbor[bit];}\n      border&=available&~mask;\n      while(border){int bit=__builtin_ctzll(border);border&=border-1;next.insert(mask|(1ULL\u003c\u003cbit));}\n    }\n    current.swap(next);\n  }\n  long long answer=0;\n  for(uint64_t obstacles:current){\n    vector\u003cchar> seen(cells);bool separated=true;\n    for(int start=0;start\u003ccells&&separated;++start){\n      if(seen[start]||((obstacles>>start)&1ULL))continue;\n      queue\u003cint>q;q.push(start);seen[start]=1;int animals=0;\n      while(!q.empty()){\n        int u=q.front();q.pop();int x=u/m,y=u%m;if(grid[x][y]=='O')++animals;\n        uint64_t go=neighbor[u]&~obstacles;\n        while(go){int v=__builtin_ctzll(go);go&=go-1;if(!seen[v]){seen[v]=1;q.push(v);}}\n      }\n      if(animals>1)separated=false;\n    }\n    if(!separated)continue;\n    int rows=n+2,cols=m+2;vector\u003cchar> openSeen(rows*cols);queue\u003cint>q;q.push(0);openSeen[0]=1;\n    auto isWall=[&](int x,int y){return x>0&&x\u003c=n&&y>0&&y\u003c=m&&((obstacles>>((x-1)*m+y-1))&1ULL);};\n    auto flood=[&](int start){queue\u003cint>fq;fq.push(start);openSeen[start]=1;while(!fq.empty()){int u=fq.front();fq.pop();int x=u/cols,y=u%cols;for(int d=0;d\u003c4;++d){int nx=x+dx[d],ny=y+dy[d];if(nx\u003c0||nx>=rows||ny\u003c0||ny>=cols)continue;int v=nx*cols+ny;if(!openSeen[v]&&!isWall(nx,ny)){openSeen[v]=1;fq.push(v);}}}};\n    flood(0);int holes=0;\n    for(int x=0;x\u003crows;++x)for(int y=0;y\u003ccols;++y){int id=x*cols+y;if(!openSeen[id]&&!isWall(x,y)){++holes;flood(id);}}\n    if(holes==wantedH)++answer;\n  }\n  cout\u003c\u003canswer\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"3 5 8 1\n...O.\n.O...\n.....","sampleOutput":"8"},{"description":["Given a string which contains only lower case English letters, how many different strings you can get after deleting AT MOST TWO characters in it?"],"id":"1020","input":"Each input file contains one test case, which gives the string whose length is in [3,10\n6\n].","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805149732552704","output":"Print in a line the number of different strings you can get after deleting at most 2 characters.","samples":[{"input":"ababcc","output":"15","explanation":"","label":""}],"score":35,"title":"Delete At Most Two Characters","category":"近对角递推","idea":["结果长度只可能是 n、n-1、n-2，因此只维护删除 0、1、2 个字符的三条 DP 对角线。","删除一个字符所得不同串数就是字符段（run）的数量。","删除两个字符时，把“删当前字符”和“保留当前字符”的集合相加，再根据当前字符上次出现位置扣掉交集。"],"keyPoints":["字符串长达 10^6，不能建立普通的 O(n²) 子序列 DP。","上次相同字符若在 i-1，交集为前缀 i-2 删除一个字符的方案数；若在 i-2，交集为 1。","答案数量级为 O(n²)，unsigned long long 足够。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  string s;cin>>s;int n=s.size();\n  vector\u003cunsigned long long> one(n+1),two(n+1);\n  array\u003cint,26> last;last.fill(-1000000000);\n  for(int i=1;i\u003c=n;++i){\n    int c=s[i-1]-'a';\n    one[i]=one[i-1]+1-(i>=2&&s[i-1]==s[i-2]);\n    unsigned long long overlap=0;\n    if(last[c]==i-1)overlap=one[i-2];\n    else if(last[c]==i-2)overlap=1;\n    two[i]=two[i-1]+one[i-1]-overlap;\n    last[c]=i;\n  }\n  cout\u003c\u003c1+one[n]+two[n]\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"ababcc","sampleOutput":"15"},{"description":["There are a lot of tips telling us that some fruits must not be eaten with some other fruits, or we might get ourselves in serious trouble. For example, bananas can not be eaten with cantaloupe (哈密瓜), otherwise it will lead to kidney deficiency (肾虚).","Now you are given a long list of such tips, and a big basket of fruits. You are supposed to pick up those fruits so that it is safe to eat any of them."],"id":"1021","input":"Each input file contains one test case. For each case, the first line gives two positive integers: N, the number of tips, and M, the number of fruits in the basket. both numbers are no more than 100.\n\nThen two blocks follow. The first block contains N pairs of fruits which must not be eaten together, each pair occupies a line and there is no duplicated tips; and the second one contains M fruits together with their prices, again each pair in a line. To make it simple, each fruit is represented by a 3-digit ID number. A price is a positive integer which is no more than 1000. All the numbers in a line are separated by spaces.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805149506060288","output":"For each case, first print in a line the maximum number of safe fruits. Then in the next line list all the safe fruits, in increasing order of their ID's. The ID's must be separated by exactly one space, and there must be no extra space at the end of the line. Finally in the third line print the total price of the above fruits. Since there may be many different solutions, you are supposed to output the one with a maximum number of safe fruits. In case there is a tie, output the one with the lowest total price. It is guaranteed that such a solution is unique.","samples":[{"input":"16 20\n001 002\n003 004\n004 005\n005 006\n006 007\n007 008\n008 003\n009 010\n009 011\n009 012\n009 013\n010 014\n011 015\n012 016\n012 017\n013 018\n020 99\n019 99\n018 4\n017 2\n016 3\n015 6\n014 5\n013 1\n012 1\n011 1\n010 1\n009 10\n008 1\n007 2\n006 5\n005 3\n004 4\n003 6\n002 1","output":"12\n002 004 006 008 009 014 015 016 017 018 019 020\n239","explanation":"","label":""}],"score":35,"title":"Safe Fruit","category":"分支限界","idea":["把篮中水果作为顶点，不能同吃的提示作为冲突边；安全集合就是最大独立集。","等价地寻找最小顶点覆盖：每条冲突边至少删除一个端点。","选择一条尚未覆盖的边，分别删除它的两个端点；用贪心匹配给出仍需删除数量的下界。"],"keyPoints":["第一目标是保留数量最多；数量相同才选择保留总价最低。","在最小删除数量相同的情况下，最大化被删除水果总价等价于最小化保留总价。","提示中不在篮子的水果无需建点，对安全性没有影响。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Edge { int u, v; };\nvector\u003cEdge> edges;\nvector\u003cint> price;\nvector\u003cchar> removed, bestRemoved;\nint bestCount;\nlong long bestRemovedPrice;\n\nint matchingLowerBound() {\n  vector\u003cchar> used(removed.size());\n  int count = 0;\n  for (const auto &e : edges) {\n    if (removed[e.u] || removed[e.v] || used[e.u] || used[e.v]) continue;\n    used[e.u] = used[e.v] = 1;\n    ++count;\n  }\n  return count;\n}\n\nvoid dfs(int count, long long removedPrice) {\n  if (count > bestCount) return;\n  int uncovered = -1;\n  for (int i = 0; i \u003c (int)edges.size(); ++i) {\n    if (!removed[edges[i].u] && !removed[edges[i].v]) { uncovered = i; break; }\n  }\n  if (uncovered \u003c 0) {\n    if (count \u003c bestCount || (count == bestCount && removedPrice > bestRemovedPrice)) {\n      bestCount = count;\n      bestRemovedPrice = removedPrice;\n      bestRemoved = removed;\n    }\n    return;\n  }\n  if (count + matchingLowerBound() > bestCount) return;\n  int a = edges[uncovered].u, b = edges[uncovered].v;\n  if (price[a] \u003c price[b]) swap(a, b);  // 同样数量时先尝试删掉更贵的水果。\n  removed[a] = 1; dfs(count + 1, removedPrice + price[a]); removed[a] = 0;\n  removed[b] = 1; dfs(count + 1, removedPrice + price[b]); removed[b] = 0;\n}\n\nint main() {\n  ios::sync_with_stdio(false); cin.tie(nullptr);\n  int n, m; cin >> n >> m;\n  vector\u003cpair\u003cstring,string>> tips(n);\n  for (auto &tip : tips) cin >> tip.first >> tip.second;\n  vector\u003cstring> id(m); price.resize(m); unordered_map\u003cstring,int> index;\n  long long allPrice = 0;\n  for (int i = 0; i \u003c m; ++i) { cin >> id[i] >> price[i]; index[id[i]] = i; allPrice += price[i]; }\n  for (const auto &tip : tips) if (index.count(tip.first) && index.count(tip.second))\n    edges.push_back({index[tip.first], index[tip.second]});\n  removed.assign(m, 0); bestRemoved.assign(m, 0); bestCount = m + 1; bestRemovedPrice = -1;\n  dfs(0, 0);\n  vector\u003cpair\u003cstring,int>> kept;\n  long long keptPrice = allPrice;\n  for (int i = 0; i \u003c m; ++i) {\n    if (bestRemoved[i]) keptPrice -= price[i];\n    else kept.push_back({id[i], i});\n  }\n  sort(kept.begin(), kept.end());\n  cout \u003c\u003c kept.size() \u003c\u003c '\\n';\n  for (int i = 0; i \u003c (int)kept.size(); ++i) cout \u003c\u003c (i ? \" \" : \"\") \u003c\u003c kept[i].first;\n  cout \u003c\u003c '\\n' \u003c\u003c keptPrice \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"16 20\n001 002\n003 004\n004 005\n005 006\n006 007\n007 008\n008 003\n009 010\n009 011\n009 012\n009 013\n010 014\n011 015\n012 016\n012 017\n013 018\n020 99\n019 99\n018 4\n017 2\n016 3\n015 6\n014 5\n013 1\n012 1\n011 1\n010 1\n009 10\n008 1\n007 2\n006 5\n005 3\n004 4\n003 6\n002 1","sampleOutput":"12\n002 004 006 008 009 014 015 016 017 018 019 020\n239"},{"description":["Werewolf（狼人杀） is a game in which the players are partitioned into two parties: the werewolves and the human beings. Suppose that in a game,","player #1 said: \"Player #2 is a werewolf.\";\nplayer #2 said: \"Player #3 is a human.\";\nplayer #3 said: \"Player #4 is a werewolf.\";\nplayer #4 said: \"Player #5 is a human.\"; and\nplayer #5 said: \"Player #4 is a human.\".","Given that there were 2 werewolves among them, at least one but not all the werewolves were lying, and there were exactly 2 liars. Can you point out the werewolves?","Now you are asked to solve a harder vertion of this problem: given that there were N players, with M werewolves among them, at least one but not all the werewolves were lying, and there were exactly L liars. You are supposed to point out the werewolves."],"id":"1022","input":"Each input file contains one test case. For each case, the first line gives three positive integer N (5 ≤ N ≤ 100), M and L (2 ≤ M，L \u003c N). Then N lines follow and the i-th line gives the statement of the i-th player (1 ≤ i ≤ N), which is represented by the index of the player with a positive sign for a human and a negative sign for a werewolf.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805149279567872","output":"If a solution exists, print in a line in descending order the indices of the M werewolves. The numbers must be separated by exactly one space with no extra spaces at the beginning or the end of the line. If there are more than one solution, you must output the largest solution sequence -- that is, for two sequences A = { a[1], ..., a[M] } and B = { b[1], ..., b[M] }, if there exists 0 ≤ k \u003c M such that a[i] = b[i] (i ≤ k) and a[k+1]>b[k+1], then A is said to be larger than B. In case there is no solution, simply print No Solution.","samples":[{"input":"5 2 2\n-2\n+3\n-4\n+5\n+4","output":"4 1","explanation":"","label":""},{"input":"6 2 3\n-2\n+3\n-4\n+5\n+4\n-3","output":"6 4","explanation":"","label":""},{"input":"6 2 5\n-2\n+3\n-4\n+5\n+4\n+6","output":"No Solution","explanation":"","label":""}],"score":35,"title":"Werewolf","category":"约束搜索","idea":["从编号 N 到 1 依次决定玩家是狼人还是人类，并优先尝试狼人。","某玩家身份确定后，所有指向他的陈述真伪随之确定。","每层重新计算狼人、说谎者和“狼人中的说谎者”的可达上下界，无法满足 M、L 与范围条件时剪枝。"],"keyPoints":["题目要求至少一名但并非全部狼人说谎，即狼说谎者数在 [1,M-1]。","从大编号向小编号并优先选狼，找到的第一组解就是字典序最大的降序序列。","陈述的正负表示“人/狼”，说话者本人身份不影响陈述真假。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint n, wolfTarget, liarTarget;\nvector\u003cint> statement, species;\n\nbool feasible() {\n  int wolves = 0, unknownSpecies = 0, knownLiars = 0, unknownLies = 0;\n  int certainWolfLiars = 0, possibleWolfLiars = 0;\n  for (int x : species) { if (x == 1) ++wolves; else if (x == -1) ++unknownSpecies; }\n  if (wolves > wolfTarget || wolves + unknownSpecies \u003c wolfTarget) return false;\n  for (int i = 1; i \u003c= n; ++i) {\n    int target = abs(statement[i]);\n    int liar = -1;\n    if (species[target] != -1) {\n      bool saysWolf = statement[i] \u003c 0;\n      bool targetWolf = species[target] == 1;\n      liar = saysWolf != targetWolf;\n      if (liar) ++knownLiars;\n    } else ++unknownLies;\n    if (species[i] == 1 && liar == 1) ++certainWolfLiars;\n    if (species[i] != 0 && liar != 0) ++possibleWolfLiars;\n  }\n  if (knownLiars > liarTarget || knownLiars + unknownLies \u003c liarTarget) return false;\n  if (certainWolfLiars > wolfTarget - 1 || possibleWolfLiars \u003c 1) return false;\n  return true;\n}\n\nbool search(int player, int wolves) {\n  if (!feasible()) return false;\n  if (player == 0) {\n    if (wolves != wolfTarget) return false;\n    int liars = 0, wolfLiars = 0;\n    for (int i = 1; i \u003c= n; ++i) {\n      bool saysWolf = statement[i] \u003c 0;\n      bool liar = saysWolf != (species[abs(statement[i])] == 1);\n      liars += liar;\n      wolfLiars += liar && species[i] == 1;\n    }\n    return liars == liarTarget && wolfLiars >= 1 && wolfLiars \u003c wolfTarget;\n  }\n  if (wolves \u003c wolfTarget) {\n    species[player] = 1;\n    if (search(player - 1, wolves + 1)) return true;\n  }\n  species[player] = 0;\n  if (search(player - 1, wolves)) return true;\n  species[player] = -1;\n  return false;\n}\n\nint main() {\n  ios::sync_with_stdio(false); cin.tie(nullptr);\n  cin >> n >> wolfTarget >> liarTarget;\n  statement.resize(n + 1); species.assign(n + 1, -1);\n  for (int i = 1; i \u003c= n; ++i) cin >> statement[i];\n  if (!search(n, 0)) { cout \u003c\u003c \"No Solution\\n\"; return 0; }\n  bool first = true;\n  for (int i = n; i >= 1; --i) if (species[i] == 1) {\n    cout \u003c\u003c (first ? \"\" : \" \") \u003c\u003c i; first = false;\n  }\n  cout \u003c\u003c '\\n';\n  return 0;\n}\n","sampleInput":"5 2 2\n-2\n+3\n-4\n+5\n+4","sampleOutput":"4 1"},{"description":["An n-gon is a polygon with n sides. For example, a triangle is a 3-gon. Now you are asked to find the best n-gon in a given convex N-gon. The vertices of the n-gon are selected from vertices of the N-gon. The n-gon you are supposed to find must have the largest area among all possible n-gons, which means that it approximates the N-gon the best. The figure below shows the best 6-gon (the shaded part) in a 10-gon."],"id":"1023","input":"Each input file contains one test case. For each case, the first line gives two positive integers N ( 6≤N≤300 ) which is the total number of vertices of the convex N-gon, and n ( 6≤n≤min(10,N) ) which is the total number of vertices of the approximating convex n-gon. Then N lines follow, the i-th line gives the 2-D coordinates (x, y) of the i-th vertex ( i=0,⋯,N−1 ). The x and y coordinates in a line are real numbers with their absolute values no more than 1000, and they are separated by a space.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=994805149061464064","output":"Print in a line all the vertex indices of the best n-gon in descending order. All the numbers are separated by a space and there must be no extra space at the beginning or the end of the line. It is guaranteed that the solution is unique.","samples":[{"input":"10 6\n133.0 1.0\n544.0 71.0\n558.0 206.0\n536.0 338.0\n463.0 436.0\n330.0 503.0\n188.0 499.0\n305.0 2.0\n55.0 410.0\n2.0 140.0","output":"9 8 5 3 1 0","explanation":"","label":""}],"score":35,"title":"The Best Polygon","category":"凸多边形动态规划","idea":["先绕几何中心按极角排序顶点，同时保留它们原来的输入编号。","固定所选多边形的最小环序顶点 s，DP[k][j] 表示选择 k 个点且末点为 j 的最大叉积和。","转移时追加边 i→j，选满 n 个点后补上 j→s 的闭合边；记录前驱还原答案。"],"keyPoints":["题目输出的是原输入编号，不是极角排序后的下标。","面积比较使用 long double 与较小 epsilon，题目保证最终答案唯一。","输出前把选中的原编号按降序排序。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Point { long double x, y; int id; };\nlong double cross(const Point &a, const Point &b) { return a.x*b.y-a.y*b.x; }\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  int N,K;cin>>N>>K;vector\u003cPoint>p(N);long double cx=0,cy=0;\n  for(int i=0;i\u003cN;++i){cin>>p[i].x>>p[i].y;p[i].id=i;cx+=p[i].x;cy+=p[i].y;}\n  cx/=N;cy/=N;\n  sort(p.begin(),p.end(),[&](const Point&a,const Point&b){return atan2(a.y-cy,a.x-cx)\u003catan2(b.y-cy,b.x-cx);});\n  const long double NEG=-1e100L,EPS=1e-12L;long double best=NEG;vector\u003cint>bestPath;\n  for(int start=0;start\u003c=N-K;++start){\n    vector\u003cvector\u003clong double>>dp(K+1,vector\u003clong double>(N,NEG));\n    vector\u003cvector\u003cint>>parent(K+1,vector\u003cint>(N,-1));dp[1][start]=0;\n    for(int used=2;used\u003c=K;++used){\n      for(int last=start+used-1;last\u003cN-(K-used);++last){\n        for(int before=start+used-2;before\u003clast;++before){\n          if(dp[used-1][before]\u003c=NEG/2)continue;\n          long double value=dp[used-1][before]+cross(p[before],p[last]);\n          if(value>dp[used][last]+EPS){dp[used][last]=value;parent[used][last]=before;}\n        }\n      }\n    }\n    for(int last=start+K-1;last\u003cN;++last){\n      long double area=dp[K][last]+cross(p[last],p[start]);\n      if(area\u003c=best+EPS)continue;\n      best=area;vector\u003cint>path;int current=last;\n      for(int used=K;used>=1;--used){path.push_back(p[current].id);current=parent[used][current];}\n      bestPath=move(path);\n    }\n  }\n  sort(bestPath.rbegin(),bestPath.rend());\n  for(int i=0;i\u003c(int)bestPath.size();++i)cout\u003c\u003c(i?\" \":\"\")\u003c\u003cbestPath[i];\n  cout\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"10 6\n133.0 1.0\n544.0 71.0\n558.0 206.0\n536.0 338.0\n463.0 436.0\n330.0 503.0\n188.0 499.0\n305.0 2.0\n55.0 410.0\n2.0 140.0","sampleOutput":"9 8 5 3 1 0"},{"description":["There are currently 168 internationally recognized unique national currencies in this world.  But let us assume that we have business with other species in the  entire universe...  To change one currency to another, we need currency exchange centers, and they charge fees for it.  Now given a list of informations of these centers, you are supposed to find a collection of the centers so that we can make change between any two currencies (directly or indirectly) through them.  Since such a kind of collection may not be unique, you must find the one with the minimum total fees; and if there are still more than one solution, find the one with the minimum number of centers -- it is guaranteed that such a solution is unique."],"id":"1024","input":"Each input file contains one test case. For each case, the first line gives two positive integers N and M (both no more than 10\n4\n), being the total numbers of currencies and the size of the list of currency exchange center informations, respectively. Then M lines follow, each describes a piece of information in the following format:\n\nC1 C2 Center Fee\n\nwhere C1 and C2 are the indices (from 0 to N−1) of the two currencies; Center is a string of 3 capital English letters representing the name of a center; and Fee is a positive integer no more than 10\n4\n.  It is guaranteed that at most one exchange center is given for each pair of different currencies.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1038430372098768896","output":"Print in the first line the total number of currency exchange centered being collected, and the total amount of fees they charge, separated by a space.  Then in the following lines, print the centers which must be collected in the same format as the input.  The centers must be output in alphabetical order of their names, and if there is a tie, in ascending order of their fees.  It is guaranteed that such a solution exists and is unique.","samples":[{"input":"6 9\n4 3 CBC 32\n1 5 HSB 43\n1 0 HSB 32\n0 2 CTB 28\n4 2 CBC 19\n2 3 CBC 28\n0 4 ABC 28\n1 2 ABC 32\n3 1 CTB 19","output":"3 137\n4 2 CBC 19\n2 3 CBC 28\n3 1 CTB 19\n0 2 CTB 28\n1 5 HSB 43","explanation":"","label":""}],"score":35,"title":"Currency Exchange Centers","category":"带标签最小生成树","idea":["先按费用执行 Kruskal；不同费用之间的选择是固定的，歧义只会出现在同费候选边组内。","同费组中先加入已经使用过的中心，再对新中心按其当前可产生的有效合并数从大到小选择。","记录被选边、总费用与中心集合，最后按中心名和费用排序输出。"],"keyPoints":["第一目标始终是总费用最小，中心数量只用于同费用 MST 的二级选择。","同一中心可以贡献多条边，中心数按不同的三字母名称统计。","该实现把同权组动态收缩后再复用中心，避免简单按中心名字排序造成无谓新增。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct DSU{vector\u003cint>p,s;explicit DSU(int n):p(n),s(n,1){iota(p.begin(),p.end(),0);}int find(int x){return p[x]==x?x:p[x]=find(p[x]);}bool unite(int a,int b){a=find(a);b=find(b);if(a==b)return false;if(s[a]\u003cs[b])swap(a,b);p[b]=a;s[a]+=s[b];return true;}};\nstruct Edge{int u,v,fee,index;string center;};\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  int n,m;cin>>n>>m;vector\u003cEdge>e(m);for(int i=0;i\u003cm;++i){cin>>e[i].u>>e[i].v>>e[i].center>>e[i].fee;e[i].index=i;}\n  sort(e.begin(),e.end(),[](const Edge&a,const Edge&b){return a.fee!=b.fee?a.fee\u003cb.fee:a.center\u003cb.center;});\n  DSU dsu(n);set\u003cstring>usedCenters;vector\u003cEdge>chosen;long long total=0;\n  for(int left=0;left\u003cm;){\n    int right=left;while(right\u003cm&&e[right].fee==e[left].fee)++right;\n    vector\u003cchar>taken(right-left);\n    while(true){\n      int best=-1,bestOld=-1,bestGain=-1;\n      map\u003cstring,vector\u003cint>>byCenter;\n      for(int i=left;i\u003cright;++i)if(!taken[i-left]&&dsu.find(e[i].u)!=dsu.find(e[i].v))byCenter[e[i].center].push_back(i);\n      for(auto &entry:byCenter){\n        DSU temp=dsu;int gain=0;\n        for(int idx:entry.second)gain+=temp.unite(e[idx].u,e[idx].v);\n        int old=usedCenters.count(entry.first);\n        if(old>bestOld||(old==bestOld&&gain>bestGain)){best=entry.second[0];bestOld=old;bestGain=gain;}\n      }\n      if(best\u003c0)break;\n      string center=e[best].center;usedCenters.insert(center);\n      for(int i=left;i\u003cright;++i)if(!taken[i-left]&&e[i].center==center){\n        taken[i-left]=1;if(dsu.unite(e[i].u,e[i].v)){chosen.push_back(e[i]);total+=e[i].fee;}\n      }\n    }\n    left=right;\n  }\n  sort(chosen.begin(),chosen.end(),[](const Edge&a,const Edge&b){return a.center!=b.center?a.center\u003cb.center:a.fee!=b.fee?a.fee\u003cb.fee:a.index\u003cb.index;});\n  cout\u003c\u003cusedCenters.size()\u003c\u003c' '\u003c\u003ctotal\u003c\u003c'\\n';\n  for(const auto&x:chosen)cout\u003c\u003cx.u\u003c\u003c' '\u003c\u003cx.v\u003c\u003c' '\u003c\u003cx.center\u003c\u003c' '\u003c\u003cx.fee\u003c\u003c'\\n';\n  return 0;\n}\n","sampleInput":"6 9\n4 3 CBC 32\n1 5 HSB 43\n1 0 HSB 32\n0 2 CTB 28\n4 2 CBC 19\n2 3 CBC 28\n0 4 ABC 28\n1 2 ABC 32\n3 1 CTB 19","sampleOutput":"3 137\n4 2 CBC 19\n2 3 CBC 28\n3 1 CTB 19\n0 2 CTB 28\n1 5 HSB 43"},{"description":["Given a string which contains only lower case letters, how many different non-empty strings you can get if you can keep AT MOST 100 characters in the original order? (Note: The string obtained is a \"sub-sequence\" of the original string.)"],"id":"1025","input":"Each input file contains one test case, which is only one line containing the string whose length is no larger than 1000.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1038430487337271296","output":"Output the number of different non-empty strings if you can only keep at most 100 characters. Since the answer might be super large, you only need to output the answer modulo 1000000007.","samples":[{"input":"aabac","output":"19","explanation":"","label":""}],"score":35,"title":"Keep at Most 100 Characters","category":"不同子序列 DP","idea":["dp[len] 表示当前前缀产生的长度为 len 的不同子序列数。","读到字符 c 时，所有长度 len-1 的序列都可追加 c；减去上一次用 c 结尾时已经生成的那批。","长度从 100 向 1 倒序更新，最后累加 dp[1..100]。"],"keyPoints":["只保留至多 100 个字符，所以 DP 长度维固定为 101。","last[c][len] 保存上次处理 c 前的 dp[len] 快照，用于去重。","减法后要加 MOD 再取模。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);const long long MOD=1000000007LL;\n  string s;cin>>s;array\u003carray\u003clong long,101>,26>last{};array\u003clong long,101>dp{};dp[0]=1;\n  int processed=0;\n  for(char ch:s){\n    int c=ch-'a',limit=min(100,processed+1);\n    for(int len=limit;len>=1;--len){\n      long long previous=dp[len-1];\n      dp[len]=(dp[len]+previous-last[c][len-1]+MOD)%MOD;\n      last[c][len-1]=previous;\n    }\n    ++processed;\n  }\n  long long answer=0;for(int len=1;len\u003c=100;++len)answer=(answer+dp[len])%MOD;\n  cout\u003c\u003canswer\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"aabac","sampleOutput":"19"},{"description":["Eva would like to buy a string of beads with no repeated colors so she went to a small shop of which the owner had a very long string of beads. However the owner would only like to cut one piece at a time for his customer. With as many as ten thousand beads in the string, Eva needs your help to tell her how to obtain the longest piece of string that contains beads with all different colors. And more, each kind of these beads has a different value. If there are more than one way to get the longest piece, Eva would like to take the most valuable one. It is guaranteed that such a solution is unique."],"id":"1026","input":"Each input file contains one test case. Each case first gives in a line a positive integer N (≤ 10,000) which is the length of the original string in the shop. Then N positive numbers (≤ 100) are given in the next line, which are the values of the beads -- here we assume that the types of the beads are numbered from 1 to N, and the i-th number is the value of the i-th type of beads. Finally the last line describes the original string by giving the types of the beads from left to right. All the numbers in a line are separated by spaces.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1071784456138059776","output":"For each test case, print in a line the total value of the piece of string that Eva wants, together with the beginning and the ending indices of the piece (start from 0). All the numbers must be separated by a space and there must be no extra spaces at the beginning or the end of the line.","samples":[{"input":"8\n18 20 2 97 23 12 8 5\n3 3 5 8 1 5 2 1","output":"66 3 6","explanation":"","label":""}],"score":35,"title":"String of Colorful Beads","category":"滑动窗口","idea":["维护无重复颜色窗口 [left,right]、每种颜色上次出现位置和窗口总价值。","新颜色若在窗口内出现过，就移动 left 并逐个扣除被移出珠子的价值。","先比较窗口长度，长度相同再比较总价值，记录唯一最优区间。"],"keyPoints":["价值表按颜色类型编号 1..N，而珠串长度也恰好为 N。","窗口左端移动时必须同步更新价值总和。","输出顺序是总价值、起点、终点，索引从 0 开始。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  int n;cin>>n;vector\u003cint>value(n+1),bead(n);for(int i=1;i\u003c=n;++i)cin>>value[i];for(int&x:bead)cin>>x;\n  vector\u003cint>last(n+1,-1);int left=0,bestL=0,bestR=-1;long long sum=0,bestValue=-1;\n  for(int right=0;right\u003cn;++right){\n    int color=bead[right];\n    if(last[color]>=left){while(left\u003c=last[color])sum-=value[bead[left++]];}\n    last[color]=right;sum+=value[color];\n    int length=right-left+1,bestLength=bestR-bestL+1;\n    if(length>bestLength||(length==bestLength&&sum>bestValue)){bestL=left;bestR=right;bestValue=sum;}\n  }\n  cout\u003c\u003cbestValue\u003c\u003c' '\u003c\u003cbestL\u003c\u003c' '\u003c\u003cbestR\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"8\n18 20 2 97 23 12 8 5\n3 3 5 8 1 5 2 1","sampleOutput":"66 3 6"},{"description":["Larry just studied the algorithm to count number of inversions. He's very interested in it. He's considering another problem: Given a permutation of integers from 1 to n, how many inversions it has if we reverse one of its subarray?","Formally speaking, given an integer array a (indices are from 0 to n−1) which contains a permutation of integers from 1 to n, two elements a[i] and a[j] form an inversion if a[i]>a[j] and i\u003cj.  Your job is to count, for each pair of 0≤i≤j\u003cn, the number of inversions if we reverse the subarray from a[i] to a[j]."],"id":"1027","input":"Each input file contains one test case. Each case consists of a positive integer n (≤1,000) in the first line, and a permutation of integers from 1 to n in the second line.  The numbers in a line are separated by a single space.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1071784623285268480","output":"For each test case, output n(n+1)/2 integers in a single line. The results are for reversing subarray indicating by all possible pairs of indices 0≤i≤j\u003cn in i-major order -- that is, the first n results are for the reverse of subarrary [0..0], [0..1], ...[0..n−1]; the next n−1 results are for the reverse of subarry [1..1], [1..2],..., [1..n−1] and so on.\n\nAll the numbers in a line must be separated by a single space, with no extra space at the beginning or the end of the line.","samples":[{"input":"3\n2 1 3","output":"1 0 2 1 2 1","explanation":"","label":""}],"score":35,"title":"Larry and Inversions","category":"树状数组","idea":["先用树状数组求原排列逆序数。","固定左端 l，逐步把右端 r 向右扩展；新加入 a[r] 与区间中所有旧元素的相对顺序会翻转。","区间树状数组查询比 a[r] 小/大的数量，差值就是当前逆序数变化量。"],"keyPoints":["反转区间外的相对顺序不变，跨区间边界的逆序关系也不变。","输出顺序必须严格按 l 主序、r 次序。","总逆序数和每个答案使用 long long。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Fenwick{vector\u003cint>t;explicit Fenwick(int n):t(n+1){}void add(int x){for(;x\u003c(int)t.size();x+=x&-x)++t[x];}int sum(int x){int r=0;for(;x;x-=x&-x)r+=t[x];return r;}};\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);int n;cin>>n;vector\u003cint>a(n);for(int&x:a)cin>>x;\n  Fenwick all(n);long long original=0;for(int i=n-1;i>=0;--i){original+=all.sum(a[i]-1);all.add(a[i]);}\n  bool first=true;\n  for(int l=0;l\u003cn;++l){\n    Fenwick inside(n);long long current=original;inside.add(a[l]);\n    for(int r=l;r\u003cn;++r){\n      if(r>l){int count=r-l;int less=inside.sum(a[r]-1);int greater=count-inside.sum(a[r]);current+=less-greater;inside.add(a[r]);}\n      cout\u003c\u003c(first?\"\":\" \")\u003c\u003ccurrent;first=false;\n    }\n  }\n  cout\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"3\n2 1 3","sampleOutput":"1 0 2 1 2 1"},{"description":["Indeed there are many different tourist routes from our city to Rome. Your job is to count the number of different routes from our city to Rome, and to check if ALL the routes lead to Rome -- that is, whether or not all the routes from our city to Rome can cover every road on the routes from our city to anywhere."],"id":"1028","input":"Each input file contains one test case. For each case, the first line contains 2 positive integers N (2≤N≤20), the number of cities, and K, the total number of roads between pairs of cities; followed by the name of the starting city. Then K lines follow, each describes a road between two cities in the format City1 City2. Here the name of a city is a string of 3 capital English letters, and the destination is always ROM which represents Rome.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1478636318296752128","output":"For each test case, first print in a line Yes if all the routes from the starting city lead to     ROM, or No if not.  Then print in the next line the number of different routes from the starting city to ROM.  Here a route is defined to be a simple path, that is, no city along the route will be visited more than once.  It is guaranteed that this number is no more than 10\n6\n.  By the way, it is assumed that ROM is our only destination -- that is, once we reach ROM, we will stop traveling and stay there.","samples":[{"input":"7 8 HZH\nPKN HZH\nGDN ROM\nROM HKG\nPRS PKN\nPRS BLN\nHKG PRS\nROM BLN\nHZH GDN","output":"Yes\n3","explanation":"","label":""},{"input":"10 11 HZH\nPKN HZH\nGDN ROM\nROM HKG\nPRS PKN\nPRS BLN\nHKG PRS\nROM BLN\nHZH GDN\nGDN MAC\nMAC WWW\nMAC VVV","output":"No\n3","explanation":"","label":""}],"score":35,"title":"Do All Roads Lead to Rome","category":"简单路径搜索","idea":["把城市名映射为编号、道路保留独立边号；从起点 DFS 枚举不重复城市的简单路径。","每次到达 ROM 就增加路线数，并把当前路径上的全部边标记为“可被赴罗马路线覆盖”。","再从起点找出可达道路；若每条可达道路都被至少一条赴罗马路径覆盖，则回答 Yes。"],"keyPoints":["到达 ROM 后必须停止，不能穿过 ROM 继续走。","同一条道路在不同路径中可重复标记，但每条简单路径只计一次。","N≤20 且保证赴 ROM 路线数不超过 10^6，回溯枚举可行。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct Adj{int to,id;};\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);\n  int n,k;string startName;cin>>n>>k>>startName;unordered_map\u003cstring,int>id;\n  auto get=[&](const string&s){auto r=id.emplace(s,id.size());return r.first->second;};\n  int start=get(startName),rome=get(\"ROM\");vector\u003cpair\u003cstring,string>>raw(k);\n  for(auto&road:raw){cin>>road.first>>road.second;get(road.first);get(road.second);}\n  vector\u003cvector\u003cAdj>>g(id.size());\n  for(int i=0;i\u003ck;++i){int a=id[raw[i].first],b=id[raw[i].second];g[a].push_back({b,i});g[b].push_back({a,i});}\n  vector\u003cchar>visited(id.size()),covered(k);vector\u003cint>path;long long routes=0;\n  function\u003cvoid(int)>dfs=[&](int u){\n    if(u==rome){++routes;for(int edge:path)covered[edge]=1;return;}\n    visited[u]=1;\n    for(auto e:g[u])if(!visited[e.to]){path.push_back(e.id);dfs(e.to);path.pop_back();}\n    visited[u]=0;\n  };dfs(start);\n  vector\u003cchar>citySeen(id.size()),reachableEdge(k);queue\u003cint>q;q.push(start);citySeen[start]=1;\n  while(!q.empty()){int u=q.front();q.pop();for(auto e:g[u]){reachableEdge[e.id]=1;if(!citySeen[e.to]){citySeen[e.to]=1;q.push(e.to);}}}\n  bool all=true;for(int i=0;i\u003ck;++i)if(reachableEdge[i]&&!covered[i])all=false;\n  cout\u003c\u003c(all?\"Yes\":\"No\")\u003c\u003c'\\n'\u003c\u003croutes\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"7 8 HZH\nPKN HZH\nGDN ROM\nROM HKG\nPRS PKN\nPRS BLN\nHKG PRS\nROM BLN\nHZH GDN","sampleOutput":"Yes\n3"},{"description":["Given an integer array of length n, cut the array into m (≤n) subarrays by exactly (m−1) cuts.  Array cutting score is defined to be the product of all the sums of the subarray elements.  Your job is to calculate the product of the scores of all the possible ways of array-cutting."],"id":"1029","input":"Each input file contains one test case. For each case, the first line contains two positive integers n and m (1≤m≤n≤10\n3\n).  The second line contains n positive integers no larger than 10\n9\n separated by a single space..","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1478636403210989568","output":"Output the product of the scores of all the possible ways of array-cutting in a single line. Since the answer might be too large, output the result modulo 1000000007 (10\n9\n+7).","samples":[{"input":"5 2\n5 1 2 3 4","output":"6652800","explanation":"","label":""}],"score":35,"title":"Array Cutting Score","category":"组合计数","idea":["把所有切法得分的乘积改写为：每个连续子段和，乘以它作为一个完整分块出现的次数次幂。","子段两侧在数组内部时，对应切口必须被选择；其余 m-1 个切口从子段外部位置组合选取。","组合数作为指数，非零底数的指数可按 MOD-1 取模；用 Pascal 递推避免对合数 MOD-1 求逆。"],"keyPoints":["子段内部不能有切口，只有它的两端可能是必选切口。","MOD-1 不是质数，不能使用阶乘逆元计算组合数。","当子段和模 MOD 为 0 且组合可行时，整体答案立即为 0。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nconst long long MOD=1000000007LL,PHI=MOD-1;\nlong long power(long long a,long long e){long long r=1;for(;e;e>>=1,a=a*a%MOD)if(e&1)r=r*a%MOD;return r;}\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);int n,m;cin>>n>>m;vector\u003clong long>a(n),prefix(n+1);for(int i=0;i\u003cn;++i){cin>>a[i];prefix[i+1]=(prefix[i]+a[i])%MOD;}\n  vector\u003cvector\u003cint>>choose(n+1,vector\u003cint>(n+1));choose[0][0]=1;\n  for(int i=1;i\u003c=n;++i){choose[i][0]=choose[i][i]=1;for(int j=1;j\u003ci;++j)choose[i][j]=(choose[i-1][j-1]+choose[i-1][j])%PHI;}\n  long long answer=1;\n  for(int l=0;l\u003cn;++l)for(int r=l;r\u003cn;++r){\n    int required=(l>0)+(r\u003cn-1);int need=m-1-required;\n    int available=(l>0?l-1:0)+(r\u003cn-1?n-r-2:0);\n    if(need\u003c0||need>available)continue;\n    long long sum=(prefix[r+1]-prefix[l]+MOD)%MOD;\n    if(sum==0){cout\u003c\u003c0\u003c\u003c'\\n';return 0;}\n    answer=answer*power(sum,choose[available][need])%MOD;\n  }\n  cout\u003c\u003canswer\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"5 2\n5 1 2 3 4","sampleOutput":"6652800"},{"description":["Given an integer m, we consider a sequence (with at least 2 elements) as beautiful if it contains 2 neighbors with difference no larger than m. Given an integer sequence with n elements, your job is to calculate the number of beautiful subsequences in it."],"id":"1030","input":"Each input file contains one test case.  For each case, the first line contains 2 positive integers n and m (2≤n≤10\n5\n, 1≤m≤10\n3\n). Then n positive integers follow in the next line, each no larger than 10\n5\n, indicating the sequence.  All the numbers in a line are separated by a space.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1478636499909017600","output":"Output the number of beautiful subsequences of the original sequence. Since the answer might be too large, output the result modulo 1000000007 (10\n9\n+7).","samples":[{"input":"4 2\n5 3 8 6","output":"8","explanation":"","label":""}],"score":35,"title":"Beautiful Subsequence","category":"计数动态规划","idea":["先计算长度至少 2 的全部子序列数，再减去“不美丽”子序列数。","不美丽序列要求每一对相邻所选元素差值都大于 m；dp[i] 表示以 a[i] 结尾的这类序列数。","树状数组按数值维护 dp 和，只查询小于 a[i]-m 或大于 a[i]+m 的前驱。"],"keyPoints":["美丽只要求存在一对相邻所选元素差值不超过 m，补集更容易计数。","dp[i] 包含单元素序列，最终扣除不美丽序列时要减去这些单例。","所有加减均在 1e9+7 下归一化。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nconst long long MOD=1000000007LL;\nstruct Fenwick{vector\u003clong long>t;explicit Fenwick(int n):t(n+1){}void add(int x,long long v){for(;x\u003c(int)t.size();x+=x&-x)t[x]=(t[x]+v)%MOD;}long long sum(int x){long long r=0;for(;x;x-=x&-x)r=(r+t[x])%MOD;return r;}};\nlong long power(long long a,int e){long long r=1;for(;e;e>>=1,a=a*a%MOD)if(e&1)r=r*a%MOD;return r;}\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);int n,m;cin>>n>>m;vector\u003cint>a(n);int maximum=0;for(int&x:a){cin>>x;maximum=max(maximum,x);}\n  Fenwick bit(maximum+2);long long badLong=0,totalSeen=0;\n  for(int x:a){\n    long long low=bit.sum(max(0,x-m-1));\n    long long high=(totalSeen-bit.sum(min(maximum+1,x+m))+MOD)%MOD;\n    long long ending=(1+low+high)%MOD;\n    badLong=(badLong+ending-1+MOD)%MOD;\n    bit.add(x,ending);totalSeen=(totalSeen+ending)%MOD;\n  }\n  long long all=(power(2,n)-1-n)%MOD;if(all\u003c0)all+=MOD;\n  cout\u003c\u003c(all-badLong+MOD)%MOD\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"4 2\n5 3 8 6","sampleOutput":"8"},{"description":["Path to Infinity is a never-ending math mini-game in the RPG Secrets of Grindea. In this mini-game, players are faced with a set of n pressure plates marked with digits from 0 to 9, another set of (n−1) pressure plates marked with operators '+' (addition), '-' (subtraction) or '*' (multiplication) and a target number m shown in the flame of the green torch on the right. To proceed through this level, players have to step on the pressure plates in the correct order to form an expression whose value is exactly the same with the target number. All the pressure plates must be used exactly once.","Note that in this mini-game, all the operators have the same priority and expression is calculated from left to right. For example, expression 1+2∗2 will be figured out as 6, not 5.","You are now presented with one level of such mini-game. How many different expressions can you build from the given digits and operators so that the value of the expression is exactly m?","Two expressions are considered different if there exists an integer i such that 1≤i≤n and the i-th operand in the two expressions are different, or if there exists an integer j such that 1≤j\u003cn and the j-th operator in the two expressions are different."],"id":"1031","input":"There is only one test case. The first line of the input contains two integers n and m (2≤n≤10, −10\n9\n≤m≤10\n9\n), indicating the number of digit pressure plates and the target number.\n\nThe second line of the input contains two strings s and t (∣s∣=n, ∣t∣=n−1) separated by a space. String s will only contain digits from 0 to 9, where the i-th digit represents the digit marked on the i-th digit pressure plate. String t will only contain operators '+', '-' and '*', where the i-th operator represents the operator marked on the i-th operator pressure plate.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1478636592323768320","output":"Output two lines. The first line contains an integer indicating the number of different expressions built from the given digits and operators so that its value is exactly m. The second line contains a string without spaces indicating the desired expression with the smallest lexicographic order. Characters in the expressions are compared by their ASCII code.\n\nIf one cannot build any desired expression, print \"Impossible\" on the second line instead.","samples":[{"input":"10 12\n3321001233 +++---***","output":"424007\n0*0*1+2+2+3-1*3-3-3","explanation":"","label":""},{"input":"3 2\n111 **","output":"0\nImpossible","explanation":"","label":""}],"score":35,"title":"Path to Infinity","category":"状态压缩记忆化","idea":["用各数字、各运算符的剩余个数描述状态，重复字符不会被当成不同压力板排列。","表达式按从左到右求值；每次选择一个运算符和下一个数字，递归统计能够到达目标值的后缀数量。","记忆化键由剩余计数与当前值组成；重建时按 ASCII 顺序尝试字符，首个有解分支得到最小表达式。"],"keyPoints":["三个运算符的 ASCII 顺序是 *、+、-，数字则按 0..9。","所有运算符同优先级，必须立即把当前值与新数字计算。","相同字符使用计数而不是位置，可自然去除重复表达式。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nlong long target;\narray\u003cint,10>digits{};array\u003cint,3>operators{};unordered_map\u003cstring,unsigned long long>memo;\nconst array\u003cchar,3>opChar={'*','+','-'};\nstring makeKey(long long value){\n  string key=to_string(value)+\"|\";for(int x:digits)key.push_back(char('0'+x));key.push_back('|');for(int x:operators)key.push_back(char('0'+x));return key;\n}\nlong long apply(long long a,char op,int b){if(op=='*')return a*b;if(op=='+')return a+b;return a-b;}\nunsigned long long solve(long long value,int remaining){\n  if(remaining==0)return value==target;\n  string key=makeKey(value);auto found=memo.find(key);if(found!=memo.end())return found->second;\n  unsigned long long ways=0;\n  for(int o=0;o\u003c3;++o)if(operators[o]){\n    --operators[o];\n    for(int d=0;d\u003c10;++d)if(digits[d]){--digits[d];ways+=solve(apply(value,opChar[o],d),remaining-1);++digits[d];}\n    ++operators[o];\n  }\n  memo[key]=ways;return ways;\n}\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);int n;string s,t;cin>>n>>target>>s>>t;\n  for(char c:s)++digits[c-'0'];for(char c:t){int i=c=='*'?0:c=='+'?1:2;++operators[i];}\n  unsigned long long total=0;string smallest;\n  for(int d=0;d\u003c10;++d)if(digits[d]){--digits[d];total+=solve(d,n-1);++digits[d];}\n  if(total){\n    for(int d=0;d\u003c10&&smallest.empty();++d)if(digits[d]){\n      --digits[d];\n      if(!solve(d,n-1)){++digits[d];continue;}\n      smallest.push_back(char('0'+d));long long value=d;int remaining=n-1;\n      while(remaining){\n        bool chosen=false;\n        for(int o=0;o\u003c3&&!chosen;++o)if(operators[o]){\n          --operators[o];\n          for(int next=0;next\u003c10;++next)if(digits[next]){\n            --digits[next];long long nv=apply(value,opChar[o],next);\n            if(solve(nv,remaining-1)){smallest.push_back(opChar[o]);smallest.push_back(char('0'+next));value=nv;--remaining;chosen=true;break;}\n            ++digits[next];\n          }\n          if(!chosen)++operators[o];\n        }\n      }\n    }\n  }\n  cout\u003c\u003ctotal\u003c\u003c'\\n'\u003c\u003c(smallest.empty()?\"Impossible\":smallest)\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"10 12\n3321001233 +++---***","sampleOutput":"424007\n0*0*1+2+2+3-1*3-3-3"},{"description":["Many computer games are designed to attract players to gain achievements and badges through a series of battles. They must defeat the monster to reach their goal.","Now given N bases in a map, a player is supposed to conquer all the bases and gain the badges one by one through the paths in the map, while each path is guarded by a monster.  Each monster has its own power and carries its own weapon.  The amount of energy taken to defeat a monster is the same as that of the monster's power.  Each weapon also has a power level.  When a monster is defeated, its weapon will be seized by the player.","Your job is to find a way to help the player conquer all the bases with minimum lose of energy.  If such a solution is not unique, you must find the one to seize maximum amount of weapon powers, which is guaranteed to be unique."],"id":"1032","input":"Each input file contains one test case. For each case, the first line gives two positive integers N and M (both no more than 10\n4\n), being the total numbers of bases and monsters, respectively. Then M lines follow, where the i-th line (i=1,⋯,M) describes the i-th monster's information in the following format:\n\nB1 B2 Power Weapon\n\nwhere B1 and B2 are the indices (from 0 to N−1) of the two bases; Power and Weapon are both positive integers no more than 10\n4\n, corresponding to the power levels of the monster and its weapen.  It is guaranteed that at most one path (and hence one monster) is connecting each pair of different bases.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1621700616307433472","output":"Print in the first line the minimum lose of energy in order to conquer all the bases, and the maximum amount of weapon powers one can seize in a solution.  Then in the next line, print all the monsters to be defeated in ascending order of their indices.  All the numbers in a line must be separated by one space, and there must be no extra space at the beginning or the end of the line.","samples":[{"input":"6 9\n4 3 32 3\n1 5 43 5\n1 0 32 3\n0 2 28 8\n4 2 19 1\n2 3 28 10\n0 4 28 2\n1 2 28 3\n3 1 19 1","output":"137 25\n2 4 5 6 9","explanation":"","label":""}],"score":35,"title":"Fighting the Monsters","category":"双关键字最小生成树","idea":["征服全部基地且能逐步到达，选择的怪物边必须构成生成树。","先按怪物 Power 升序保证损失能量最小；Power 相同时按 Weapon 降序。","在每个同 Power 收缩图上，这一顺序会取得最大武器权值生成森林，Kruskal 即可完成双目标优化。"],"keyPoints":["武器是第二优化目标，不能让更高 Power 的边提前进入。","输出的是输入中的怪物编号，从 1 开始并按升序。","能量和与武器和都使用 long long。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nstruct DSU{vector\u003cint>p,s;explicit DSU(int n):p(n),s(n,1){iota(p.begin(),p.end(),0);}int find(int x){return p[x]==x?x:p[x]=find(p[x]);}bool unite(int a,int b){a=find(a);b=find(b);if(a==b)return false;if(s[a]\u003cs[b])swap(a,b);p[b]=a;s[a]+=s[b];return true;}};\nstruct Edge{int u,v,power,weapon,id;};\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);int n,m;cin>>n>>m;vector\u003cEdge>e(m);for(int i=0;i\u003cm;++i){cin>>e[i].u>>e[i].v>>e[i].power>>e[i].weapon;e[i].id=i+1;}\n  sort(e.begin(),e.end(),[](const Edge&a,const Edge&b){return a.power!=b.power?a.power\u003cb.power:a.weapon>b.weapon;});\n  DSU dsu(n);long long energy=0,weapons=0;vector\u003cint>chosen;\n  for(const auto&x:e)if(dsu.unite(x.u,x.v)){energy+=x.power;weapons+=x.weapon;chosen.push_back(x.id);}\n  sort(chosen.begin(),chosen.end());cout\u003c\u003cenergy\u003c\u003c' '\u003c\u003cweapons\u003c\u003c'\\n';for(int i=0;i\u003c(int)chosen.size();++i)cout\u003c\u003c(i?\" \":\"\")\u003c\u003cchosen[i];cout\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"6 9\n4 3 32 3\n1 5 43 5\n1 0 32 3\n0 2 28 8\n4 2 19 1\n2 3 28 10\n0 4 28 2\n1 2 28 3\n3 1 19 1","sampleOutput":"137 25\n2 4 5 6 9"},{"description":["Eva has two strings of beads, one with A red beads and the other with B blue ones.  She would like to make a string of red and blue beads in the following way:","Eva would take beads from the two strings step by step.\nAt the i-th step, she can take away exactly i beads from one of the strings, and chain them into the resulting string.\nEva is supposed to obtain a string of exactly N beads.","How many different results can Eva obtain?","Two results are cosidered to be different if there is at least one step that Eva chooses to take beads from different strings."],"id":"1033","input":"Each input file contains one test case which gives in a line three integers: N (0\u003cN≤2×10\n5\n), A and B (0≤A,B≤10\n5\n).  The definitions are given in the description of the problem.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1621700638587564032","output":"For each test case, print in a line the number of different ways to obtain a string of exactly N beads.  Since the answer might be too large, output the result modulo 1000000007 (that is, 10\n9\n+7).","samples":[{"input":"10 4 7","output":"4","explanation":"","label":""}],"score":35,"title":"Strings of Red and Blue","category":"0/1 背包计数","idea":["若执行了 k 步，珠子总数固定为 1+2+...+k；先判断 N 是否为三角数。","把每一步分给红串或蓝串，设红串承担的步数和为 red，则需 red≤A 且 N-red≤B。","对物品 1..k 做 0/1 背包，统计落在合法红色用量区间内的方案。"],"keyPoints":["每一步只能整体选择一种颜色，不能把 i 颗拆给两种颜色。","若 N 不是三角数，不存在恰好使用完某个整数步数的结果。","红色上界取 min(A,N)，合法下界是 max(0,N-B)。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);const long long MOD=1000000007LL;int N,A,B;cin>>N>>A>>B;\n  int k=0,sum=0;while(sum\u003cN)sum+=++k;if(sum!=N){cout\u003c\u003c0\u003c\u003c'\\n';return 0;}\n  int high=min(A,N),low=max(0,N-B);vector\u003clong long>dp(high+1);dp[0]=1;\n  for(int step=1;step\u003c=k;++step)for(int red=high;red>=step;--red)dp[red]=(dp[red]+dp[red-step])%MOD;\n  long long answer=0;for(int red=low;red\u003c=high;++red)answer=(answer+dp[red])%MOD;cout\u003c\u003canswer\u003c\u003c'\\n';return 0;\n}\n","sampleInput":"10 4 7","sampleOutput":"4"},{"description":["A number game is to start from a given number A, and to reach the destination number B by a sequence of operations.","For the current number X, there are 3 types of operations:","X=X+1\nX=X−1\nX=X×N","Your job is to find the minimum number of steps required to reach B from A."],"id":"1034","input":"Each input file contains several test cases.  The first line gives a positive integer K (≤10) which is the total number of cases.  For each case, three  integers are given: A, B and N, where −10\n5\n≤A,B≤10\n5\n and 1\u003cN\u003c10.  All the numbers in a line are separated by a space.","officialUrl":"https://pintia.cn/problem-sets/994805148990160896/exam/problems/type/7?problemSetProblemId=1697152161245261825","output":"For each test case, print in a line the minimum number of steps required to reach B from A.","samples":[{"input":"3\n3 11 2\n-5 -12 3\n-2 1000 7","output":"3\n2\n13","explanation":"","label":""}],"score":35,"title":"Number Game","category":"最短路搜索","idea":["把每个整数看成状态，三种操作是单位权有向边，使用 BFS 求最短步数。","直接加减得到 |A-B| 步的上界；有价值的乘法不会需要越过 max(|A|,|B|)×N 太远。","在对称有限区间内搜索 x+1、x-1、x×N，首次到达 B 即最优。"],"keyPoints":["负数同样可以乘 N，搜索区间必须同时覆盖正负两侧。","计算 x×N 时先提升为 long long，再判断是否落在边界内。","A==B 时答案为 0。"],"code":"#include \u003calgorithm>\n#include \u003carray>\n#include \u003cbitset>\n#include \u003ccmath>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cfunctional>\n#include \u003ciomanip>\n#include \u003ciostream>\n#include \u003climits>\n#include \u003cmap>\n#include \u003cnumeric>\n#include \u003cqueue>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstack>\n#include \u003cstring>\n#include \u003ctuple>\n#include \u003cunordered_map>\n#include \u003cunordered_set>\n#include \u003cutility>\n#include \u003cvector>\n\nusing namespace std;\n\nint main(){\n  ios::sync_with_stdio(false);cin.tie(nullptr);int cases;cin>>cases;\n  while(cases--){\n    int A,B,N;cin>>A>>B>>N;if(A==B){cout\u003c\u003c0\u003c\u003c'\\n';continue;}\n    int limit=max(100,max(abs(A),abs(B))*N+N+10),offset=limit;\n    vector\u003cint>dist(2*limit+1,-1);queue\u003cint>q;dist[A+offset]=0;q.push(A);\n    while(!q.empty()&&dist[B+offset]\u003c0){\n      int x=q.front();q.pop();array\u003clong long,3>next={x-1LL,x+1LL,1LL*x*N};\n      for(long long y:next)if(y>=-limit&&y\u003c=limit&&dist[(int)y+offset]\u003c0){dist[(int)y+offset]=dist[x+offset]+1;q.push((int)y);}\n    }\n    cout\u003c\u003cdist[B+offset]\u003c\u003c'\\n';\n  }\n  return 0;\n}\n","sampleInput":"3\n3 11 2\n-5 -12 3\n-2 1000 7","sampleOutput":"3\n2\n13"},{"description":["There is a kind of balanced binary search tree named red-black tree in the data structure. It has the following 5 properties:","(1) Every node is either red or black.\n(2) The
