[x];\n   }\n   for(int i = 0; i \u003c num; i++) {\n      dp[i] = 1;\n      for(int j = 0; j \u003c i; j++)\n         if(a[i] >= a[j])\n             dp[i] = max(dp[i], dp[j] + 1);\n      maxn = max(dp[i], maxn);\n\n   }\n   printf(\"%d\", maxn);\n   return 0;\n}"},{"id":"1046","title":"Shortest Distance","score":20,"category":"模拟","description":["The task is really simple: given N exits on a highway which forms a simple cycle, you are supposed to tell the shortest distance between any pair of exits."],"input":"Each input file contains one test case. For each case, the first line contains an integer N (in [3, 105]),followed by N integer distances D1 D2... DN, where Di is the distance between the i-th and the (i+1)-st exits, and DN is between the N-th and the 1st exits. All the numbers in a line are separated by a\n\nspace. The second line gives a positive integer M (\u003c=104), with M lines follow, each contains a pair of exit numbers, provided that the exits are numbered from 1 to N. It is guaranteed that the total round trip distance is no more than 107.","output":"For each test case, print your results in M lines, each contains the shortest distance between the corresponding given pair of exits.","samples":[{"input":"5 1 2 4 14 9\n3\n1 3\n2 5\n4 1","output":"3\n10\n7","explanation":"","label":""}],"sampleInput":"5 1 2 4 14 9\n3\n1 3\n2 5\n4 1","sampleOutput":"3\n10\n7","idea":["简单模拟。所有结点连起来会形成一个环形,dis[i]存储第1个结点到第i个结点的下一个结点的距离,sum保存整个路径一圈的总和值。求得结果就是dis[right – 1] – dis[left – 1]和 sum – dis[right – 1] –dis[left – 1]中较小的那一个~~注意:可能left和right的顺序颠倒了,这时候要把left和right的值交换~"],"keyPoints":["把题目流程拆成清晰状态逐步模拟，每一步只修改相关变量。","重点检查循环起止、下标边界和最后一项的输出格式。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：简单模拟\nusing namespace std;\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   vector\u003cint> dis(n + 1);\n\n   int sum = 0, left, right, cnt;\n   for(int i = 1; i \u003c= n; i++) {\n      int temp;\n      scanf(\"%d\", &temp);\n      sum += temp;\n\n      dis[i] = sum;\n   }\n   scanf(\"%d\", &cnt);\n   for(int i = 0; i \u003c cnt; i++) {\n      scanf(\"%d %d\", &left, &right);\n      if(left > right)\n         swap(left, right);\n      int temp = dis[right - 1] - dis[left - 1];\n      printf(\"%d\\n\", min(temp, sum - temp));\n   }\n\n   return 0;\n}"},{"id":"1047","title":"Student List for Course","score":25,"category":"不定长数组vector,STL的使用","description":["Zhejiang University has 40000 students and provides 2500 courses. Now given the registered course list of each student, you are supposed to output the student name lists of all the courses."],"input":"Each input file contains one test case. For each case, the first line contains 2 numbers: N (\u003c=40000), the total number of students, and K (\u003c=2500), the total number of courses. Then N lines follow, each contains a student’s name (3 capital English letters plus a one-digit number), a positive number C\n\n(\u003c=20) which is the number of courses that this student has registered, and then followed by C course numbers. For the sake of simplicity, the courses are numbered from 1 to K.","output":"For each test case, print the student name lists of all the courses in increasing order of the course numbers. For each course, first print in one line the course number and the number of registered students, separated by a space. Then output the students’ names in alphabetical order. Each name\n\noccupies a line.","samples":[{"input":"10 5\nZOE1 2 4 5\nANN0 3 5 2 1\nBOB5 5 3 4 2 1 5\nJOE4 1 2\nJAY9 4 1 2 5 4\nFRA8 3 4 2 5\nDON2 2 4 5\nAMY7 1 5\nKAT3 3 5 4 2\nLOR6 4 2 4 1 5","output":"1 4\nANN0\nBOB5\nJAY9\nLOR6\n2 7\nANN0\nBOB5\nFRA8\nJAY9\nJOE4\nKAT3\nLOR6\n3 1\nBOB5\n4 7\nBOB5\nDON2\nFRA8\nJAY9\nKAT3\nLOR6\nZOE1\n5 9\nAMY7\nANN0\nBOB5\nDON2\nFRA8\nJAY9\nKAT3\nLOR6\nZOE1","explanation":"","label":""}],"sampleInput":"10 5\nZOE1 2 4 5\nANN0 3 5 2 1\nBOB5 5 3 4 2 1 5\nJOE4 1 2\nJAY9 4 1 2 5 4\nFRA8 3 4 2 5\nDON2 2 4 5\nAMY7 1 5\nKAT3 3 5 4 2\nLOR6 4 2 4 1 5","sampleOutput":"1 4\nANN0\nBOB5\nJAY9\nLOR6\n2 7\nANN0\nBOB5\nFRA8\nJAY9\nJOE4\nKAT3\nLOR6\n3 1\nBOB5\n4 7\nBOB5\nDON2\nFRA8\nJAY9\nKAT3\nLOR6\nZOE1\n5 9\nAMY7\nANN0\nBOB5\nDON2\nFRA8\nJAY9\nKAT3\nLOR6\nZOE1","idea":["给出选课人数和课程数目,然后再给出每个人的选课情况,请针对每门课程输出选课人数以及所有选该课的学生姓名,按照字典序~建立int的二维数组,course[i][j] = k表示第i号课程上的人的一个列表,k是上这个课的学生的姓名所在的字符数组name[i][j]的i下标~~","注意:strcmp返回的不一定是-1,0,1这几个数字,要返回bool变量还需要在后面添加strcmp是大于0还是小于0~~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出选课人数和课程数目,然后再给出每个人的选课情况,请针对每门课程输出选课人数以及所有选该课的学生姓名,按照字典序\n\n#include \u003cvector>\n#include \u003calgorithm>\n#include \u003cstring.h>\nusing namespace std;\nchar name[40010][5];\nvector\u003cint> course[2510];\nbool cmp1(int a, int b) {\n   return strcmp(name[a], name[b]) \u003c 0;\n}\nint main() {\n\n   int n, k;\n   scanf(\"%d %d\", &n, &k);\n   for(int i = 0; i \u003c n; i++) {\n      int cnt, temp;\n      scanf(\"%s %d\", name[i], &cnt);\n      for(int j = 0; j \u003c cnt; j++) {\n         scanf(\"%d\", &temp);\n         course[temp].push_back(i);\n      }\n\n   }\n\n   for(int i = 1; i \u003c= k; i++) {\n      printf(\"%d %d\\n\", i, course[i].size());\n      sort(course[i].begin(), course[i].end(), cmp1);\n      for(int j = 0; j \u003c course[i].size(); j++)\n         printf(\"%s\\n\", name[course[i][j]]);\n\n   }\n   return 0;\n}"},{"id":"1048","title":"Find Coins","score":25,"category":"Hash散列","description":["Eva loves to collect coins from all over the universe, including some other planets like Mars. One day she visited a universal shopping mall which could accept all kinds of coins as payments. However,there was a special requirement of the payment: for each bill, she could only use exactly two coins to","pay the exact amount. Since she has as many as 105 coins with her, she definitely needs your help.You are supposed to tell her, for any given amount of money, whether or not she can find two coins to pay for it."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive numbers: N(\u003c=105, the total number of coins) and M(\u003c=103, the amount of money Eva has to pay). The second line contains N face values of the coins, which are all positive numbers no more than 500. All the\n\nnumbers in a line are separated by a space.","output":"For each test case, print in one line the two face values V1 and V2 (separated by a space) such that V1+ V2 = M and V1 \u003c= V2. If such a solution is not unique, output the one with the smallest V1. If there is no solution, output “No Solution” instead.","samples":[{"input":"8 15\n1 2 8 7 2 4 11 15","output":"4 11","explanation":"","label":"1"},{"input":"7 14\n1 8 7 2 4 11 15","output":"No Solution","explanation":"","label":"2"}],"sampleInput":"8 15\n1 2 8 7 2 4 11 15","sampleOutput":"4 11","idea":["给出n个正整数和一个正整数m,问n个数字中是否存在一对数字a和b(a \u003c= b),使a+b=m成立。如果有多个,输出a最小的那一对。建立数组a保存每个数字出现的次数,然后判断输出"],"keyPoints":["散列表或计数数组的范围必须覆盖题目中的全部可能取值。","每组测试数据开始前要正确初始化计数与访问标记。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出n个正整数和一个正整数m,问n个数字中是否存在一对数字a和b(a \u003c= b),使a+b=m成立\nusing namespace std;\nint a[1001];\nint main() {\n   int n, m, temp;\n   scanf(\"%d %d\", &n, &m);\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &temp);\n      a[temp]++;\n   }\n\n   for(int i = 0; i \u003c 1001; i++) {\n      if(a[i]) {\n         a[i]--;\n         if(m > i && a[m-i]) {\n             printf(\"%d %d\", i, m - i);\n             return 0;\n         }\n         a[i]++;\n      }\n\n   }\n   printf(\"No Solution\");\n   return 0;\n}"},{"id":"1049","title":"Counting Ones","score":30,"category":"数学问题","description":["The task is simple: given any positive integer N, you are supposed to count the total number of 1’s in the decimal form of the integers from 1 to N. For example, given N being 12, there are five 1’s in 1, 10,11, and 12."],"input":"Each input file contains one test case which gives the positive N (\u003c=230).","output":"For each test case, print the number of 1’s in one line.","samples":[{"input":"12","output":"5","explanation":"","label":""}],"sampleInput":"12","sampleOutput":"5","idea":["给出一个数字n,求1~n的所有数字里面出现1的个数分析:这是一道数学问题。从第一位(个位)到最高位,设now为当前位的数字,left为now左边的所有数字构成的数字,right是now右边的所有数字构成的数字。只需要一次次累加对于当前位now来说可能出现1的个数,然后把它们累加即可。a表示当前的个位为1,十位为10,百位为100类推。","对于now,有三种情况:1.now == 0: 那么 ans += left * a; //因为now==0说明now位只有在left从0~left-1的时候会产生1,所以会产生left次,但是又因为右边会重复从0~","999...出现a次2.now == 1: ans += left * a + right + 1;//now = 1的时候就要比上一步多加一个当now为1的时候右边出现0~right个数导致的now为1的次数3.now >= 2: ans += (left + 1) * a;//now大于等于2就左边0~","left的时候会在now位置产生1,所以会产生 left次,但是又因为右边会重复从0~999...出现a次"],"keyPoints":["先推导等价公式再编码，避免直接按定义做不必要的重复计算。","乘法、累加或组合计数可能超出 int，应按范围选择 long long。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出一个数字n,求1\nusing namespace std;\nint main() {\n   int n, left = 0, right = 0, a = 1, now = 1, ans = 0;\n   scanf(\"%d\", &n);\n\n   while(n / a) {\n      left = n / (a * 10), now = n / a % 10, right = n % a;\n      if(now == 0) ans += left * a;\n      else if(now == 1) ans += left * a + right + 1;\n      else ans += (left + 1) * a;\n      a = a * 10;\n   }\n   printf(\"%d\", ans);\n   return 0;\n\n}"},{"id":"1050","title":"String Subtraction","score":20,"category":"Hash散列","description":["Given two strings S1 and S2, S = S1 – S2 is defined to be the remaining string after taking all the characters in S2 from S1. Your task is simply to calculate S1 – S2 for any given strings. However, it might not be that simple to do it fast."],"input":"Each input file contains one test case. Each case consists of two lines which gives S1 and S2,respectively. The string lengths of both strings are no more than 104. It is guaranteed that all the characters are visible ASCII codes and white space, and a new line character signals the end of a\n\nstring.","output":"For each test case, print S1 – S2 in one line.","samples":[{"input":"They are students.\naeiou","output":"Thy r stdnts.","explanation":"","label":""}],"sampleInput":"They are students.\naeiou","sampleOutput":"Thy r stdnts.","idea":["给出两个字符串,在第一个字符串中删除第二个字符串中出现过的所有字符并输出~用flag[256]数组变量标记str2出现过的字符为true,输出str1的时候根据flag[str1[i]]是否为true,如果是true就不输出注意:使用int lens1 = strlen(s1);int lens2 = strlen(s2);的形式,否则直接放在for循环里面会超时~","如果使用gets前面请使用char str[100000]而非char *str~~"],"keyPoints":["散列表或计数数组的范围必须覆盖题目中的全部可能取值。","每组测试数据开始前要正确初始化计数与访问标记。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstring>\n\n// 解题关键：给出两个字符串,在第一个字符串中删除第二个字符串中出现过的所有字符并输出\n\n#include \u003cstring.h>\nusing namespace std;\nchar s1[100000], s2[100000];\nint main() {\n   cin.getline(s1, 100000);\n   cin.getline(s2, 100000);\n   int lens1 = strlen(s1), lens2 = strlen(s2);\n   bool flag[256] = {false};\n   for(int i = 0; i \u003c lens2; i++)\n      flag[s2[i]] = true;\n\n   for(int i = 0; i \u003c lens1; i++) {\n      if(!flag[s1[i]])\n         printf(\"%c\", s1[i]);\n   }\n   return 0;\n}"},{"id":"1051","title":"Pop Sequence","score":25,"category":"栈模拟","description":["Given a stack which can keep M numbers at most. Push N numbers in the order of 1, 2, 3,..., N and pop randomly. You are supposed to tell if a given sequence of numbers is a possible pop sequence of the stack. For example, if M is 5 and N is 7, we can obtain 1, 2, 3, 4, 5, 6, 7 from the stack, but not 3, 2,","1, 7, 5, 6, 4."],"input":"Each input file contains one test case. For each case, the first line contains 3 numbers (all no more than 1000): M (the maximum capacity of the stack), N (the length of push sequence), and K (the number of pop sequences to be checked). Then K lines follow, each contains a pop sequence of N numbers. All\n\nthe numbers in a line are separated by a space.","output":"For each pop sequence, print in one line “YES” if it is indeed a possible pop sequence of the stack, or“NO” if not.","samples":[{"input":"5 7 5\n1 2 3 4 5 6 7\n3 2 1 7 5 6 4\n7 6 5 4 3 2 1\n5 6 4 3 7 2 1\n1 7 6 5 4 3 2","output":"YES\nNO\nNO\nYES\nNO","explanation":"","label":""}],"sampleInput":"5 7 5\n1 2 3 4 5 6 7\n3 2 1 7 5 6 4\n7 6 5 4 3 2 1\n5 6 4 3 7 2 1\n1 7 6 5 4 3 2","sampleOutput":"YES\nNO\nNO\nYES\nNO","idea":["有个容量限制为m的栈,分别把1,2,3,...,n入栈,给出一个系列出栈顺序,问这些出栈顺序是否可能~按照要求进行模拟。先把输入的序列接收进数组v。然后按顺序1~n把数字进栈,每进入一个数字,判断有没有超过最大范围,超过了就break。","如果没超过,设current = 1,从数组的第一个数字开始,看看是否与栈顶元素相等,while相等就一直弹出栈,不相等就继续按顺序把数字压入栈~~最后根据变量flag的bool值输出yes或者no~"],"keyPoints":["把题目流程拆成清晰状态逐步模拟，每一步只修改相关变量。","重点检查循环起止、下标边界和最后一项的输出格式。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstack>\n#include \u003cvector>\n\n// 解题关键：有个容量限制为m的栈,分别把1,2,3,...,n入栈,给出一个系列出栈顺序,问这些出栈顺序是否可能\nusing namespace std;\n\nint main() {\n   int m, n, k;\n   scanf(\"%d %d %d\", &m, &n, &k);\n   for(int i = 0; i \u003c k; i++) {\n      bool flag = false;\n\n      stack\u003cint> s;\n      vector\u003cint> v(n + 1);\n      for(int j = 1; j \u003c= n; j++)\n         scanf(\"%d\", &v[j]);\n      int current = 1;\n\n      for(int j = 1; j \u003c= n; j++) {\n         s.push(j);\n         if(s.size() > m) break;\n         while(!s.empty() && s.top() == v[current]) {\n             s.pop();\n             current++;\n         }\n      }\n      if(current == n + 1) flag = true;\n      if(flag) printf(\"YES\\n\");\n\n      else printf(\"NO\\n\");\n   }\n   return 0;\n}"},{"id":"1052","title":"Linked List Sorting","score":25,"category":"链表","description":["A linked list consists of a series of structures, which are not necessarily adjacent in memory. We assume that each structure contains an integer key and a Next pointer to the next structure. Now given a linked list, you are supposed to sort the structures according to their key values in increasing","order."],"input":"Each input file contains one test case. For each case, the first line contains a positive N (\u003c 10^5) and an address of the head node, where N is the total number of nodes in memory and the address of a node is a 5-digit positive integer. NULL is represented by -1.\n\nThen N lines follow, each describes a node in the format:Address Key Next where Address is the address of the node in memory, Key is an integer in [-105, 105], and Next is the address of the next node. It is guaranteed that all the keys are distinct and there is no cycle in the\n\nlinked list starting from the head node.","output":"For each test case, the output format is the same as that of the input, where N is the total number of nodes in the list and all the nodes must be sorted order.","samples":[{"input":"5 00001\n11111 100 -1\n00001 0 22222\n33333 100000 11111\n12345 -1 33333\n22222 1000 12345","output":"5 12345\n12345 -1 00001\n00001 0 11111\n11111 100 22222\n22222 1000 33333\n33333 100000 -1","explanation":"","label":""}],"sampleInput":"5 00001\n11111 100 -1\n00001 0 22222\n33333 100000 11111\n12345 -1 33333\n22222 1000 12345","sampleOutput":"5 12345\n12345 -1 00001\n00001 0 11111\n11111 100 22222\n22222 1000 33333\n33333 100000 -1","idea":["给出一个链表,将链表排序,然后把链表上的结点按照data值的从小到大顺序输出分析:建立结构体数组,按照从首地址开始的顺序(直到-1)遍历一遍整个链表,将在链表中的结点的flag标记为true,并且统计cnt(有效结点的个数)。","(因为有的结点根本不在链表中)然后将链表进行排序,如果flag == false就把他们移动到后面(即:reuturn a.flag > b.flag),最后只输出前cnt个链表的信息~"],"keyPoints":["先按地址建立结点映射，再沿 next 指针恢复有效链表顺序。","输出地址时通常需要补足 5 位，空地址按题目要求输出。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n\n// 解题关键：给出一个链表,将链表排序,然后把链表上的结点按照data值的从小到大顺序输出分析:建立结构体数组,按照从首地址开始的顺序(直到-1)遍历一遍整个链表,将在链表中的结点的flag标记为true,并且统计cnt(有效结点的个\nusing namespace std;\n\nstruct NODE {\n   int address, key, next;\n   bool flag;\n}node[100000];\nint cmp1(NODE a, NODE b) {\n   return !a.flag || !b.flag ? a.flag > b.flag : a.key \u003c b.key;\n}\nint main() {\n   int n, cnt = 0, s, a, b, c;\n\n   scanf(\"%d%d\", &n, &s);\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d%d%d\", &a, &b, &c);\n      node[a] = {a, b, c, false};\n   }\n   for(int i = s; i != -1; i = node[i].next) {\n      node[i].flag = true;\n      cnt++;\n\n   }\n   if(cnt == 0) {\n      printf(\"0 -1\");\n   } else {\n      sort(node, node + 100000, cmp1);\n\n      printf(\"%d %05d\\n\", cnt, node[0].address);\n      for(int i = 0; i \u003c cnt; i++) {\n         printf(\"%05d %d \", node[i].address, node[i].key);\n         if(i != cnt - 1)\n             printf(\"%05d\\n\", node[i + 1].address);\n         else\n             printf(\"-1\\n\");\n      }\n   }\n   return 0;\n\n}"},{"id":"1053","title":"Path of Equal Weight","score":30,"category":"树的遍历","description":["Given a non-empty tree with root R, and with weight Wi assigned to each tree node Ti. The weight of a path from R to L is defined to be the sum of the weights of all the nodes along the path from R to any leaf node L.Now given any weighted tree, you are supposed to find all the paths with their weights equal to a","given number. For example, let’s consider the tree showed in Figure 1: for each node, the upper number is the node ID which is a two-digit number, and the lower number is the weight of that node.Suppose that the given number is 24, then there exists 4 different paths which have the same given","weight: {10 5 2 7}, {10 4 10}, {10 3 3 6 2} and {10 3 3 6 2}, which correspond to the red edges in Figure 1.Figure 1"],"input":"Each input file contains one test case. Each case starts with a line containing 0 \u003c N \u003c= 100, the number of nodes in a tree, M (\u003c N), the number of non-leaf nodes, and 0 \u003c S \u003c 230, the given weight number.The next line contains N positive numbers where Wi (\u003c1000) corresponds to the tree node Ti. Then M\n\nlines follow, each in the format:ID K ID[1] ID[2]... ID[K]where ID is a two-digit number representing a given non-leaf node, K is the number of its children,followed by a sequence of two-digit ID’s of its children. For the sake of simplicity, let us fix the root ID\n\nto be 00.","output":"For each test case, print all the paths with weight S in non-increasing order. Each path occupies a line with printed weights from the root to the leaf in order. All the numbers must be separated by a space with no extra space at the end of the line.Note: sequence {A1, A2,..., An} is said to be greater than sequence {B1, B2,..., Bm} if there exists 1 \u003c=\n\nk \u003c min{n, m} such that Ai = Bi for i=1,... k, and Ak+1 > Bk+1.","samples":[{"input":"20 9 24\n10 2 4 3 5 10 2 18 9 7 2 2 1 3 12 1 8 6 2 2\n00 4 01 02 03 04\n02 1 05\n04 2 06 07\n03 3 11 12 13\n06 1 09\n07 2 08 10\n16 1 15\n13 3 14 16 17\n17 2 18 19","output":"10 5 2 7\n10 4 10\n10 3 3 6 2\n10 3 3 6 2","explanation":"","label":""}],"sampleInput":"20 9 24\n10 2 4 3 5 10 2 18 9 7 2 2 1 3 12 1 8 6 2 2\n00 4 01 02 03 04\n02 1 05\n04 2 06 07\n03 3 11 12 13\n06 1 09\n07 2 08 10\n16 1 15\n13 3 14 16 17\n17 2 18 19","sampleOutput":"10 5 2 7\n10 4 10\n10 3 3 6 2\n10 3 3 6 2","idea":["给出树的结构和权值,找从根结点到叶子结点的路径上的权值相加之和等于给定目标数的路径,并且从大到小输出路径分析:对于接收孩子结点的数据时,每次完全接收完就对孩子结点按照权值进行排序(序号变,根据权值变),这样保证深度优先遍历的时候直接输出就能输出从大到小的顺序。","记录路径采取这样的方式:首先建立一个path数组,传入一个nodeNum记录对当前路径来说这是第几个结点(这样直接在path[nodeNum]里面存储当前结点的孩子结点的序号,这样可以保证在先判断return的时候,path是从0~numNum-1的值确实是要求的路径结点)。","然后每次要遍历下一个孩子结点的之前,令 path[nodeNum] = 孩子结点的序号,这样就保证了在return的时候当前path里面从0~nodeNum-1的值就是要输出的路径的结点序号,输出这个序号的权值即可,直接在return语句里面输出。注意:当sum==target的时候,记得判断是否孩子结点是空,要不然如果不空说明没有到底部,就直接return而不是输出路径。。。","(这对接下来的孩子结点都是正数才有用,负权无用)。"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003calgorithm>\n\n// 解题关键：给出树的结构和权值,找从根结点到叶子结点的路径上的权值相加之和等于给定目标数的路径,并且从大到小输出路径分析:对于接收孩子结点的数据时,每次完全接收完就对孩子结点按照权值进行排序(序号变,根据权值变),这样保证深度优先遍\nusing namespace std;\nint target;\nstruct NODE {\n   int w;\n   vector\u003cint> child;\n};\n\nvector\u003cNODE> v;\nvector\u003cint> path;\nvoid dfs(int index, int nodeNum, int sum) {\n   if(sum > target) return ;\n   if(sum == target) {\n      if(v[index].child.size() != 0) return;\n      for(int i = 0; i \u003c nodeNum; i++)\n         printf(\"%d%c\", v[path[i]].w, i != nodeNum - 1 ? ' ' : '\\n');\n      return ;\n   }\n\n   for(int i = 0; i \u003c v[index].child.size(); i++) {\n      int node = v[index].child[i];\n      path[nodeNum] = node;\n      dfs(node, nodeNum + 1, sum + v[node].w);\n   }\n\n}\nint cmp1(int a, int b) {\n   return v[a].w > v[b].w;\n\n}\nint main() {\n   int n, m, node, k;\n   scanf(\"%d %d %d\", &n, &m, &target);\n\n   v.resize(n), path.resize(n);\n   for(int i = 0; i \u003c n; i++)\n      scanf(\"%d\", &v[i].w);\n   for(int i = 0; i \u003c m; i++) {\n      scanf(\"%d %d\", &node, &k);\n\n      v[node].child.resize(k);\n      for(int j = 0; j \u003c k; j++)\n         scanf(\"%d\", &v[node].child[j]);\n      sort(v[node].child.begin(), v[node].child.end(), cmp1);\n   }\n   dfs(0, 1, v[0].w);\n   return 0;\n}"},{"id":"1054","title":"The Dominant Color","score":20,"category":"map映射,STL的使用","description":["Behind the scenes in the computer’s memory, color is always talked about as a series of 24 bits of information for each pixel. In an image, the color with the largest proportional area is called the dominant color. A strictly dominant color takes more than half of the total area. Now given an image","of resolution M by N (for example, 800×600), you are supposed to point out the strictly dominant color."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive numbers: M(\u003c=800) and N (\u003c=600) which are the resolutions of the image. Then N lines follow, each contains M digital colors in the range [0, 224). It is guaranteed that the strictly dominant color exists for each\n\ninput image. All the numbers in a line are separated by a space.","output":"For each test case, simply print the dominant color in a line.","samples":[{"input":"5 3\n0 0 255 16777215 24\n24 24 0 0 24\n24 0 24 24 24","output":"24","explanation":"","label":""}],"sampleInput":"5 3\n0 0 255 16777215 24\n24 24 0 0 24\n24 0 24 24 24","sampleOutput":"24","idea":["选取主色调,就是M列N行的矩阵里面出现次数多余一半的那个数字~STL中map的应用~使用arr[i] = j表示i元素在矩阵中出现了j次,在输入的同时比较arr当前的值是否已经超过半数,如果超过,就直接输出该数字并退出程序~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：选取主色调,就是M列N行的矩阵里面出现次数多余一半的那个数字\n\n#include \u003cmap>\nusing namespace std;\nint main() {\n   int m, n;\n   scanf(\"%d %d\", &m, &n);\n   map\u003cint, int> arr;\n   int half = m * n / 2;\n   for(int i = 0; i \u003c n; i++) {\n      for(int j = 0; j \u003c m; j++) {\n         int temp;\n\n         scanf(\"%d\", &temp);\n         arr[temp]++;\n         if(arr[temp] > half) {\n             printf(\"%d\", temp);\n             return 0;\n         }\n      }\n   }\n   return 0;\n\n}"},{"id":"1055","title":"The World’s Richest","score":25,"category":"排序","description":["Forbes magazine publishes every year its list of billionaires based on the annual ranking of the world’s wealthiest people. Now you are supposed to simulate this job, but concentrate only on the people in a certain range of ages. That is, given the net worths of N people, you must find the M","richest people in a given range of their ages."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive integers: N(\u003c=105) – the total number of people, and K (\u003c=103) – the number of queries. Then N lines follow,each contains the name (string of no more than 8 characters without space), age (integer in (0, 200]),\n\nand the net worth (integer in [-106, 106]) of a person. Finally there are K lines of queries, each contains three positive integers: M (\u003c= 100) – the maximum number of outputs, and [Amin, Amax] which are the range of ages. All the numbers in a line are separated by a space.","output":"For each query, first print in a line Case #X: where X is the query number starting from 1. Then output the M richest people with their ages in the range [Amin, Amax]. Each person’s information occupies a line, in the format Name Age Net_Worth The outputs must be in non-increasing order of the net worths. In case there are equal worths, it must\n\nbe in non-decreasing order of the ages. If both worths and ages are the same, then the output must be in non-decreasing alphabetical order of the names. It is guaranteed that there is no two persons share all the same of the three pieces of information. In case no one is found, output “None”.","samples":[{"input":"12 4\nZoe_Bill 35 2333\nBob_Volk 24 5888\nAnny_Cin 95 999999\nWilliams 30 -22\nCindy 76 76000\nAlice 18 88888\nJoe_Mike 32 3222\nMichael 5 300000\nRosemary 40 5888\nDobby 24 5888\nBilly 24 5888\nNobody 5 0\n4 15 45\n4 30 35\n4 5 95\n1 45 50","output":"Case #1:\nAlice 18 88888\nBilly 24 5888\nBob_Volk 24 5888\nDobby 24 5888\nCase #2:\nJoe_Mike 32 3222\nZoe_Bill 35 2333\nWilliams 30 -22\nCase #3:\nAnny_Cin 95 999999\nMichael 5 300000\nAlice 18 88888\nCindy 76 76000\nCase #4:\nNone","explanation":"","label":""}],"sampleInput":"12 4\nZoe_Bill 35 2333\nBob_Volk 24 5888\nAnny_Cin 95 999999\nWilliams 30 -22\nCindy 76 76000\nAlice 18 88888\nJoe_Mike 32 3222\nMichael 5 300000\nRosemary 40 5888\nDobby 24 5888\nBilly 24 5888\nNobody 5 0\n4 15 45\n4 30 35\n4 5 95\n1 45 50","sampleOutput":"Case #1:\nAlice 18 88888\nBilly 24 5888\nBob_Volk 24 5888\nDobby 24 5888\nCase #2:\nJoe_Mike 32 3222\nZoe_Bill 35 2333\nWilliams 30 -22\nCase #3:\nAnny_Cin 95 999999\nMichael 5 300000\nAlice 18 88888\nCindy 76 76000\nCase #4:\nNone","idea":["给出n个人的姓名、年龄和拥有的钱,然后进行k次查询,每次查询输出在年龄区间内的财富值的从大到小的前m个人的信息。如果财富值相同就就先输出年龄小的,如果年龄相同就把名字按照字典序排序输出~不能先排序然后根据每一个条件再新建一个数组、对新数组排序的方法,这样测试点2会超时~因为n和m的悬殊太大了,n有10的5次方,m却只有100个。","所以先把所有的人按照财富值排序,再建立一个数组book标记每个年龄段拥有的人的数量,遍历数组并统计相应年龄的人数,当 当前年龄的人的数量不超过100的时候压入新的数组,多出来的不要压入新数组中(也就是说只取每个年龄的前100名,因为一个年龄段最小的就是一个年龄,即使这样也不会超过100个需要输出),再从这个新的数组里面取符合相应年龄的人的信息~~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003cvector>\n#include \u003ccstring>\n\n// 解题关键：给出n个人的姓名、年龄和拥有的钱,然后进行k次查询,每次查询输出在年龄区间内的财富值的从大到小的前m个人的信息\n\nusing namespace std;\nstruct node {\n   char name[10];\n   int age, money;\n};\nint cmp1(node a, node b) {\n   if(a.money != b.money)\n      return a.money > b.money;\n   else if(a.age != b.age)\n\n      return a.age \u003c b.age;\n   else\n      return (strcmp(a.name, b.name) \u003c 0);\n}\nint main() {\n   int n, k, num, amin, amax;\n   scanf(\"%d %d\", &n, &k);\n\n   vector\u003cnode> vt(n), v;\n   vector\u003cint> book(205, 0);\n   for(int i = 0; i \u003c n; i++)\n      scanf(\"%s %d %d\", vt[i].name, &vt[i].age, &vt[i].money);\n   sort(vt.begin(), vt.end(), cmp1);\n\n   for(int i = 0; i \u003c n; i++) {\n      if(book[vt[i].age] \u003c 100) {\n         v.push_back(vt[i]);\n         book[vt[i].age]++;\n      }\n   }\n   for(int i = 0; i \u003c k; i++) {\n      scanf(\"%d %d %d\", &num, &amin, &amax);\n      vector\u003cnode> t;\n      for(int j = 0; j \u003c v.size(); j++) {\n\n         if(v[j].age >= amin && v[j].age \u003c= amax)\n             t.push_back(v[j]);\n      }\n      if(i != 0) printf(\"\\n\");\n      printf(\"Case #%d:\", i + 1);\n      int flag = 0;\n      for(int j = 0; j \u003c num && j \u003c t.size(); j++) {\n         printf(\"\\n%s %d %d\", t[j].name, t[j].age, t[j].money);\n         flag = 1;\n\n      }\n      if(flag == 0) printf(\"\\nNone\");\n   }\n   return 0;\n}"},{"id":"1056","title":"Mice and Rice","score":25,"category":"queue的用法","description":["Mice and Rice is the name of a programming contest in which each programmer must write a piece of code to control the movements of a mouse in a given map. The goal of each mouse is to eat as much rice as possible in order to become a FatMouse.First the playing order is randomly decided for NP programmers. Then every NG programmers are","grouped in a match. The fattest mouse in a group wins and enters the next turn. All the losers in this turn are ranked the same. Every NG winners are then grouped in the next match until a final winner is determined.For the sake of simplicity, assume that the weight of each mouse is fixed once the programmer","submits his/her code. Given the weights of all the mice and the initial playing order, you are supposed to output the ranks for the programmers."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive integers: NP and NG (\u003c= 1000), the number of programmers and the maximum number of mice in a group,respectively. If there are less than NG mice at the end of the player’s list, then all the mice left will be\n\nput into the last group. The second line contains NP distinct non-negative numbers Wi (i=0,...NP-1)where each Wi is the weight of the i-th mouse respectively. The third line gives the initial playing order which is a permutation of 0,...NP-1 (assume that the programmers are numbered from 0 to NP-\n\n1). All the numbers in a line are separated by a space.","output":"For each test case, print the final ranks in a line. The i-th number is the rank of the i-th programmer,and all the numbers must be separated by a space, with no extra space at the end of the line.","samples":[{"input":"11 3\n25 18 0 46 37 3 19 22 57 56 10\n6 0 8 7 10 5 9 1 4 2 3","output":"5 5 5 2 5 5 5 3 1 3 5","explanation":"","label":""}],"sampleInput":"11 3\n25 18 0 46 37 3 19 22 57 56 10\n6 0 8 7 10 5 9 1 4 2 3","sampleOutput":"5 5 5 2 5 5 5 3 1 3 5","idea":["np为老鼠的数量,ng为每组最多g个老鼠。先给出np个老鼠的重量,再给出老鼠的初始顺序(第i名的老鼠是第j号,j从0开始)。每ng个老鼠分为一组,对于每组老鼠,选出最重的那个,晋级下一轮比赛,然后依次再以np个老鼠一组分类,然后选出重量最大的。。。直到只剩下一只老鼠,排名为1.输出为老鼠的排名,这个排名是按照原输入老鼠的顺序输出的~","设立结构体node表示老鼠,里面包括weight重量,index是按照排名后的顺序的老鼠的下标,index0是排名前老鼠的下标。rank是最终要输出的老鼠的排名。先将所有的老鼠按照排名后的顺序依次放入队列中,对于队列中的每一个老鼠,按照分组后选择最大重量的比赛规则,将每次分组获得第一的老鼠放入队列尾部。","此处有一点,如果当前剩下的老鼠可以分为group组,那么这一组里面没有晋级的老鼠排名就是group+1.此处解释一下:因为对于共有group组的老鼠,每组晋级一个,也就是说最终这一轮能晋级的是group个老鼠,那么没有晋级的所有人就是group+1名,就像有4个人晋级下一轮,那么所有没晋级的这一轮就都是并列第5名。","group的计算方法是:如果当前轮次的人数正好可以被每组ng人的ng整除,那么就有人数/ng个组。如果不能被整除,就有剩下来的一些老鼠分为一组,就是人数/ng + 1组。","(这是求得group的方法)cnt用来控制当前的组内第几个人,如果cnt能够被ng整除了说明已经是下一组了,就cnt = 0;否则cnt不断++,同时将最重的老鼠体重赋值给maxn,最重的老鼠的node赋值给maxnode。最后将结果结构体w排序,按照先前保存的index0的顺序排序,因为题目要求是必须按照题目所给的输入顺序输出的,排序后即可按序输出~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cqueue>\n\n// 解题关键：np为老鼠的数量,ng为每组最多g个老鼠\n\n#include \u003cvector>\n#include \u003calgorithm>\nusing namespace std;\nstruct node {\n   int weight, index, rank, index0;\n\n};\nbool cmp1(node a, node b) {\n   return a.index0 \u003c b.index0;\n}\nint main() {\n   int n, g, num;\n   scanf(\"%d%d\", &n, &g);\n   vector\u003cint> v(n);\n   vector\u003cnode> w(n);\n   for(int i = 0; i \u003c n; i++)\n\n      scanf(\"%d\", &v[i]);\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &num);\n      w[i].weight = v[num];\n      w[i].index = i;\n      w[i].index0 = num;\n   }\n   queue\u003cnode> q;\n   for(int i = 0; i \u003c n; i++)\n\n      q.push(w[i]);\n   while(!q.empty()) {\n      int size = q.size();\n      if(size == 1) {\n         node temp = q.front();\n         w[temp.index].rank = 1;\n         break;\n      }\n      int group = size / g;\n      if(size % g != 0)\n\n         group += 1;\n      node maxnode;\n      int maxn = -1, cnt = 0;\n      for(int i = 0; i \u003c size; i++) {\n         node temp = q.front();\n         w[temp.index].rank = group + 1;\n         q.pop();\n         cnt++;\n         if(temp.weight > maxn) {\n\n             maxn = temp.weight;\n             maxnode = temp;\n         }\n         if(cnt == g || i == size - 1) {\n             cnt = 0;\n             maxn = -1;\n\n             q.push(maxnode);\n         }\n      }\n   }\n   sort(w.begin(), w.end(), cmp1);\n\n   for(int i = 0; i \u003c n; i++) {\n      if(i != 0) printf(\" \");\n      printf(\"%d\", w[i].rank);\n   }\n   return 0;\n}"},{"id":"1057","title":"Stack","score":30,"category":"树状数组","description":["Stack is one of the most fundamental data structures, which is based on the principle of Last In First Out (LIFO). The basic operations include Push (inserting an element onto the top position) and Pop(deleting the top element). Now you are supposed to implement a stack with an extra operation:","PeekMedian — return the median value of all the elements in the stack. With N elements, the median value is defined to be the (N/2)-th smallest element if N is even, or ((N+1)/2)-th if N is odd."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N (\u003c=105). Then N lines follow, each contains a command in one of the following 3 formats:Push key Pop PeekMedian where key is a positive integer no more than 105.","output":"For each Push command, insert key into the stack and output nothing. For each Pop or PeekMedian command, print in a line the corresponding returned value. If the command is invalid, print “Invalid”instead.","samples":[{"input":"17\nPop\nPeekMedian\nPush 3\nPeekMedian\nPush 2\nPeekMedian\nPush 1\nPeekMedian\nPop\nPop\nPush 5\nPush 4\nPeekMedian\nPop\nPop\nPop\nPop","output":"Invalid\nInvalid\n3\n2\n2\n1\n2\n4\n4\n5\n3\nInvalid","explanation":"","label":""}],"sampleInput":"17\nPop\nPeekMedian\nPush 3\nPeekMedian\nPush 2\nPeekMedian\nPush 1\nPeekMedian\nPop\nPop\nPush 5\nPush 4\nPeekMedian\nPop\nPop\nPop\nPop","sampleOutput":"Invalid\nInvalid\n3\n2\n2\n1\n2\n4\n4\n5\n3\nInvalid","idea":["现请你实现一种特殊的堆栈,它多了一种操作叫“查中值”,即返回堆栈中所有元素的中值。对于N个元素,若N是偶数,则中值定义为第N/2个最小元;若N是奇数,则中值定义为第(N+1)/2个最小元。用排序查询的方法会超时~~用树状数组,即求第k = (s.size() + 1) / 2大的数。查询小于等于x的数的个数是否等于k的时候用二分法更快~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstack>\n\n// 解题关键：现请你实现一种特殊的堆栈,它多了一种操作叫“查中值”,即返回堆栈中所有元素的中值\n#define lowbit(i) ((i) & (-i))\nconst int maxn = 100010;\nusing namespace std;\nint c[maxn];\nstack\u003cint> s;\nvoid update(int x, int v) {\n   for(int i = x; i \u003c maxn; i += lowbit(i))\n\n      c[i] += v;\n}\nint getsum(int x) {\n   int sum = 0;\n   for(int i = x; i >= 1; i -= lowbit(i))\n      sum += c[i];\n   return sum;\n}\nvoid PeekMedian() {\n   int left = 1, right = maxn, mid, k = (s.size() + 1) / 2;\n\n   while(left \u003c right) {\n      mid = (left + right) / 2;\n      if(getsum(mid) >= k)\n         right = mid;\n      else\n         left = mid + 1;\n   }\n   printf(\"%d\\n\", left);\n}\n\nint main() {\n   int n, temp;\n   scanf(\"%d\", &n);\n   char str[15];\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%s\", str);\n      if(str[1] == 'u') {\n         scanf(\"%d\", &temp);\n         s.push(temp);\n         update(temp, 1);\n\n      } else if(str[1] == 'o') {\n         if(!s.empty()) {\n             update(s.top(), -1);\n             printf(\"%d\\n\", s.top());\n             s.pop();\n         } else {\n             printf(\"Invalid\\n\");\n         }\n\n      } else {\n         if(!s.empty())\n             PeekMedian();\n         else\n             printf(\"Invalid\\n\");\n\n      }\n   }\n   return 0;\n}"},{"id":"1058","title":"A+B in Hogwarts","score":20,"category":"进制转换","description":["If you are a fan of Harry Potter, you would know the world of magic has its own currency system —as Hagrid explained it to Harry, “Seventeen silver Sickles to a Galleon and twenty-nine Knuts to a Sickle, it’s easy enough.” Your job is to write a program to compute A+B where A and B are given in","the standard form of “Galleon.Sickle.Knut” (Galleon is an integer in [0, 107], Sickle is an integer in [0,17), and Knut is an integer in [0, 29))."],"input":"Each input file contains one test case which occupies a line with A and B in the standard form,separated by one space.","output":"For each test case you should output the sum of A and B in one line, with the same format as the input.","samples":[{"input":"3.2.1 10.16.27","output":"14.1.28","explanation":"","label":""}],"sampleInput":"3.2.1 10.16.27","sampleOutput":"14.1.28","idea":["17个Sickle对换一个Galleon,29个Knut对换一个Sickle。根据Galleon.Sickle.Knut的方式相加A和B分析:像相加算术一样从后往前按位相加,处理好进位~"],"keyPoints":["进制转换时特别处理结果为 0 的情况，并留意高位与低位的输出顺序。","多进制混合运算应逐位处理进位，不要直接套用十进制规则。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：17个Sickle对换一个Galleon,29个Knut对换一个Sickle\n\nusing namespace std;\nint main() {\n   int a1, b1, c1, a2, b2, c2, a, b, c;\n   scanf(\"%d.%d.%d %d.%d.%d\", &a1, &b1, &c1, &a2, &b2, &c2);\n   c = c1 + c2;\n   b = b1 + b2 + c / 29; c = c % 29;\n   a = a1 + a2 + b / 17; b = b % 17;\n   printf(\"%d.%d.%d\\n\", a, b, c);\n   return 0;\n\n}"},{"id":"1059","title":"Prime Factors","score":25,"category":"素数表的建立","description":["Given any positive integer N, you are supposed to find all of its prime factors, and write them in the format N = p1^k1 * p2^k2 *...*pm^km."],"input":"Each input file contains one test case which gives a positive integer N in the range of long int.","output":"Factor N in the format N = p1^k1 * p2^k2 *...*pm^km, where pi’s are prime factors of N in increasing order, and the exponent ki is the number of pi — hence when there is only one pi, ki is 1 and must NOT be printed out.","samples":[{"input":"97532468","output":"97532468=2^2*11*17*101*1291","explanation":"","label":""}],"sampleInput":"97532468","sampleOutput":"97532468=2^2*11*17*101*1291","idea":["给出一个整数,按照从小到大的顺序输出其分解为质因数的乘法算式分析:根号int的最大值不超过50000,先建立个50000以内的素数表,然后从2开始一直判断是否为它的素数,如果是就将a=a/i继续判断i是否为a的素数,判断完成后输出这个素数因子和个数,用state判断是否输入过因子,输入过就要再前面输出“*”"],"keyPoints":["判断素数时要单独处理 0、1，并枚举到平方根即可。","连续区间内多次判素时可根据数据规模选择筛法。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003cvector>\n\n// 解题关键：给出一个整数,按照从小到大的顺序输出其分解为质因数的乘法算式分析:根号int的最大值不超过50000,先建立个50000以内的素数表,然后从2开始一直判断是否为它的素数,如果是就将a=a/i继续判断i是否为a的素数,判断\nusing namespace std;\nvector\u003cint> prime(50000, 1);\nint main() {\n   for(int i = 2; i * i \u003c 50000; i++)\n      for(int j = 2; j * i \u003c 50000; j++)\n         prime[j * i] = 0;\n   long int a;\n\n   scanf(\"%ld\", &a);\n   printf(\"%ld=\", a);\n   if(a == 1) printf(\"1\");\n   bool state = false;\n   for(int i = 2; i \u003c 50000 && a >= 2; i++) {\n\n      int cnt = 0, flag = 0;\n      while(prime[i] == 1 && a % i == 0) {\n         cnt++;\n         a = a / i;\n         flag = 1;\n      }\n      if(flag) {\n         if(state) printf(\"*\");\n         printf(\"%d\", i);\n         state = true;\n\n      }\n      if(cnt >= 2) printf(\"^%d\", cnt);\n   }\n   if (a > 1) printf(\"%s%ld\", state ? \"*\" : \"\", a);\n   return 0;\n}"},{"id":"1060","title":"Are They Equal","score":25,"category":"科学计数法","description":["If a machine can save only 3 significant digits, the float numbers 12300 and 12358.9 are considered equal since they are both saved as 0.123*105 with simple chopping. Now given the number of significant digits on a machine and two float numbers, you are supposed to tell if they are treated","equal in that machine."],"input":"Each input file contains one test case which gives three numbers N, A and B, where N (\u003c100) is the number of significant digits, and A and B are the two float numbers to be compared. Each float number is non-negative, no greater than 10100, and that its total digit number is less than 100.","output":"For each test case, print in a line “YES” if the two numbers are treated equal, and then the number in the standard form “0.d1...dN*10^k” (d1>0 unless the number is 0); or “NO” if they are not treated equal, and then the two numbers in their standard form. All the terms must be separated by a space,\n\nwith no extra space at the end of a line.Note: Simple chopping is assumed without rounding.","samples":[{"input":"3 12300 12358.9","output":"YES 0.123*10^5","explanation":"","label":"1"},{"input":"3 120 128","output":"NO 0.120*10^3 0.128*10^3","explanation":"","label":"2"}],"sampleInput":"3 12300 12358.9","sampleOutput":"YES 0.123*10^5","idea":["给出两个数,问将它们写成保留N位小数的科学计数法后是否相等。如果相等,输出YES,输出他们的科学记数法表示方法。","如果不相等输出NO,分别输出他们的科学计数法分析:1. cnta 和 cntb 通过扫描字符串得到小数点所在的下标(初始化cnta cntb为字符串长度,即下标为strlen(str))2. 考虑到可能前面有多余的零,用 p 和 q 通过扫描字符串使 p q 开始于第一个非0(且非小数点)处的下标3. 如果cnta >= p,说明小数点在第一个开始的非0数的下标的右边,那么科学计数法的指数为cnta – p; 否则应该为cnta – p + 1; 字符串b同理。","4. 如果 p 和 q 等于字符串长度, 说明字符串是 0, 此时直接把 cnta(或者cntb)置为0,因为对于0来说乘以几次方都是相等的,如果不置为0可能会出现两个0比较导致判断为它们不相等5. indexa = 0开始给新的A数组赋值,共赋值n位除去小数点外的正常数字,从p的下标开始。","如果p大于等于strlen,说明字符串遍历完毕后依旧没能满足需要的位数,此时需要在A数组后面补上0直到满足n位数字。indexb同理,产生新的B数组6. 判断A和B是否相等,且cnta和cntb是否相等。如果相等,说明他们用科学计数法表示后是相同 的,输出YES,否则输出NO,同时输出正确的科学计数法注意:– 10的0次方和1次方都要写。– 题目中说,无需四舍五入。","– 数组开大点,虽然只有100位,但是很有可能前面的0很多导致根本不止100位。一开始开的110,几乎没有AC的任何测试点。。后来开了10000就AC了~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003ccstring>\n\n// 解题关键：给出两个数,问将它们写成保留N位小数的科学计数法后是否相等\n\nusing namespace std;\nint main() {\n   int n, p = 0, q = 0;\n   char a[10000], b[10000], A[10000], B[10000];\n   scanf(\"%d%s%s\", &n, a, b);\n   int cnta = strlen(a), cntb = strlen(b);\n   for(int i = 0; i \u003c strlen(a); i++) {\n      if(a[i] == '.') {\n         cnta = i;\n\n         break;\n      }\n   }\n   for(int i = 0; i \u003c strlen(b); i++) {\n      if(b[i] == '.') {\n\n         cntb = i;\n         break;\n      }\n   }\n   int indexa = 0, indexb = 0;\n   while(a[p] == '0' || a[p] == '.') p++;\n   while(b[q] == '0' || b[q] == '.') q++;\n   if(cnta >= p)\n      cnta = cnta - p;\n   else\n\n      cnta = cnta - p + 1;\n   if(cntb >= q)\n      cntb = cntb - q;\n   else\n      cntb = cntb - q + 1;\n   if(p == strlen(a))\n      cnta = 0;\n   if(q == strlen(b))\n      cntb = 0;\n\n   while(indexa \u003c n) {\n      if(a[p] != '.' && p \u003c strlen(a))\n         A[indexa++] = a[p];\n      else if(p >= strlen(a))\n         A[indexa++] = '0';\n      p++;\n   }\n   while(indexb \u003c n) {\n      if(b[q] != '.' && q \u003c strlen(b))\n         B[indexb++] = b[q];\n\n      else if(q >= strlen(b))\n         B[indexb++] = '0';\n      q++;\n   }\n   if(strcmp(A, B) == 0 && cnta == cntb)\n      printf(\"YES 0.%s*10^%d\", A, cnta);\n   else\n      printf(\"NO 0.%s*10^%d 0.%s*10^%d\" , A, cnta, B, cntb);\n   return 0;\n\n}"},{"id":"1061","title":"Dating","score":20,"category":"字符串处理","description":["Sherlock Holmes received a note with some strange strings: “Let’s date! 3485djDkxh4hhGE 2984akDfkkkkggEdsb s&hgsfdk d&Hyscvnm”. It took him only a minute to figure out that those strange strings are actually referring to the coded time “Thursday 14:04” — since the first common","capital English letter (case sensitive) shared by the first two strings is the 4th capital letter ‘D’,representing the 4th day in a week; the second common character is the 5th capital letter ‘E’,representing the 14th hour (hence the hours from 0 to 23 in a day are represented by the numbers","from 0 to 9 and the capital letters from A to N, respectively); and the English letter shared by the last two strings is ‘s’ at the 4th position, representing the 4th minute. Now given two pairs of strings, you are supposed to help Sherlock decode the dating time."],"input":"Each input file contains one test case. Each case gives 4 non-empty strings of no more than 60 characters without white space in 4 lines.","output":"For each test case, print the decoded time in one line, in the format “DAY HH:MM”, where “DAY” is a 3-character abbreviation for the days in a week — that is, “MON” for Monday, “TUE” for Tuesday,“WED” for Wednesday, “THU” for Thursday, “FRI” for Friday, “SAT” for Saturday, and “SUN” for\n\nSunday. It is guaranteed that the result is unique for each case.","samples":[{"input":"3485djDkxh4hhGE\n2984akDfkkkkggEdsb\ns&hgsfdk\nd&Hyscvnm","output":"THU 14:04","explanation":"","label":""}],"sampleInput":"3485djDkxh4hhGE\n2984akDfkkkkggEdsb\ns&hgsfdk\nd&Hyscvnm","sampleOutput":"THU 14:04","idea":["福尔摩斯接到一张奇怪的字条:“我们约会吧!3485djDkxh4hhGE 2984akDfkkkkggEdsb s&hgsfdk d&Hyscvnm”。","大侦探很快就明白了,前面两字符串中第1对相同的大写英文字母(大小写有区分)是第4个字母D,代表星期四;第2对相同的字符是E,那是第5个英文字母,代表一天里的第14个钟头(于是一天的0点到23点由数字0到9、以及大写字母A到N表示);后面两字符串第1对相同的英文字母s出现在第4个位置(从0开始计数)上,代表第4分钟。现给定两对字符串,要求解码得到约会的时间~","按照题目所给的方法找到相等的字符后判断即可,如果输出的时间不足2位数要在前面添0,即用%02d输出~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：福尔摩斯接到一张奇怪的字条:“我们约会吧!3485djDkxh4hhGE 2984akDfkkkkggEdsb s&hgsfdk d&Hyscvnm”\n\n#include \u003ccctype>\nusing namespace std;\nint main() {\n   string a, b, c, d;\n   cin >> a >> b >> c >> d;\n\n   char t[2];\n   int pos, i = 0, j = 0;\n   while(i \u003c a.length() && i \u003c b.length()) {\n      if (a[i] == b[i] && (a[i] >= 'A' && a[i] \u003c= 'G')) {\n         t[0] = a[i];\n         break;\n      }\n      i++;\n   }\n   i = i + 1;\n\n   while (i \u003c a.length() && i \u003c b.length()) {\n      if (a[i] == b[i] && ((a[i] >= 'A' && a[i] \u003c= 'N') || isdigit(a[i])))\n{\n         t[1] = a[i];\n         break;\n      }\n      i++;\n   }\n   while (j \u003c c.length() && j \u003c d.length()) {\n\n      if (c[j] == d[j] && isalpha(c[j])) {\n         pos = j;\n         break;\n      }\n      j++;\n   }\n   string week[7] = {\"MON \", \"TUE \", \"WED \", \"THU \", \"FRI \", \"SAT \", \"SUN \"};\n   int m = isdigit(t[1]) ? t[1] - '0' : t[1] - 'A' + 10;\n   cout \u003c\u003c week[t[0]-'A'];\n\n   printf(\"%02d:%02d\", m, pos);\n   return 0;\n}"},{"id":"1062","title":"Talent and Virtue","score":25,"category":"排序","description":["About 900 years ago, a Chinese philosopher Sima Guang wrote a history book in which he talked about people’s talent and virtue. According to his theory, a man being outstanding in both talent and virtue must be a “sage(圣人)”; being less excellent but with one’s virtue outweighs talent can be","called a “nobleman(君子)”; being good in neither is a “fool man(愚人)”; yet a fool man is better than a “small man(小人)” who prefers talent than virtue.Now given the grades of talent and virtue of a group of people, you are supposed to rank them according to Sima Guang’s theory."],"input":"Each input file contains one test case. Each case first gives 3 positive integers in a line: N (\u003c=105), the total number of people to be ranked; L (>=60), the lower bound of the qualified grades — that is, only the ones whose grades of talent and virtue are both not below this line will be ranked; and H (\u003c100),\n\nthe higher line of qualification — that is, those with both grades not below this line are considered as the “sages”, and will be ranked in non-increasing order according to their total grades. Those with talent grades below H but virtue grades not are cosidered as the “noblemen”, and are also ranked in\n\nnon-increasing order according to their total grades, but they are listed after the “sages”. Those with both grades below H, but with virtue not lower than talent are considered as the “fool men”. They are ranked in the same way but after the “noblemen”. The rest of people whose grades both pass the L\n\nline are ranked after the “fool men”.Then N lines follow, each gives the information of a person in the format:ID_Number Virtue_Grade Talent_Grade where ID_Number is an 8-digit number, and both grades are integers in [0, 100]. All the numbers are separated by a space.","output":"The first line of output must give M (\u003c=N), the total number of people that are actually ranked. Then M lines follow, each gives the information of a person in the same format as the input, according to the ranking rules. If there is a tie of the total grade, they must be ranked with respect to their virtue\n\ngrades in non-increasing order. If there is still a tie, then output in increasing order of their ID’s.","samples":[{"input":"14 60 80\n10000001 64 90\n10000002 90 60\n10000011 85 80\n10000003 85 80\n10000004 80 85\n10000005 82 77\n10000006 83 76\n10000007 90 78\n10000008 75 79\n10000009 59 90\n10000010 88 45\n10000012 80 100\n10000013 90 99\n10000014 66 60","output":"12\n10000013 90 99\n10000012 80 100\n10000003 85 80\n10000011 85 80\n10000004 80 85\n10000007 90 78\n10000006 83 76\n10000005 82 77\n10000002 90 60\n10000014 66 60\n10000008 75 79\n10000001 64 90","explanation":"","label":""}],"sampleInput":"14 60 80\n10000001 64 90\n10000002 90 60\n10000011 85 80\n10000003 85 80\n10000004 80 85\n10000005 82 77\n10000006 83 76\n10000007 90 78\n10000008 75 79\n10000009 59 90\n10000010 88 45\n10000012 80 100\n10000013 90 99\n10000014 66 60","sampleOutput":"12\n10000013 90 99\n10000012 80 100\n10000003 85 80\n10000011 85 80\n10000004 80 85\n10000007 90 78\n10000006 83 76\n10000005 82 77\n10000002 90 60\n10000014 66 60\n10000008 75 79\n10000001 64 90","idea":["输入第1行给出3个正整数,分别为:N为考生总数;L为录取最低分数线,即德分和才分均不低于L的考生才有资格被考虑录取;H为优先录取线——德分和才分均不低于此线的被定义为“才德全尽”,此类考生按德才总分从高到低排序;才分不到但德分到线的一类考生属于“德胜才”,也按总分排序,但排在第一类考生之后;德才分均低于H,但是德分不低于才分的考生属于“才德兼亡”但尚有“德胜才”者,按总分排序,但排在第二类考生之后;其他达到最低线L的考生也按总分排序,但排在第三类考生之后。","输出第1行首先给出达到最低分数线的考生人数M,随后M行,每行按照输入格式输出一 位考生的信息,考生按输入中说明的规则从高到低排序。当某类考生中有多人总分相同时,按其德分降序排列;若德分也并列,则按准考证号的升序输出~用结构体存储~写好cmp函数~结构体数组vector v[4]中v[0]保存第一类考生,v[1]保存第二类考生...以此类推~","写好cmp函数很重要,cmp函数中,排序先按照总分排序,然后按照德分排序,最后按照准考证号排序...最后输出符合条件的结果~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003cvector>\n\n// 解题关键：输入第1行给出3个正整数,分别为:N为考生总数;L为录取最低分数线,即德分和才分均不低于L的考生才有资格被考虑录取;H为优先录取线——德分和才分均不低于此线的被定义为“才德全尽”,此类考生按德才总分从高到低排序;才分不到\n\nusing namespace std;\nstruct node {\n   int num, de, cai;\n\n};\nint cmp(struct node a, struct node b) {\n   if ((a.de + a.cai) != (b.de + b.cai))\n      return (a.de + a.cai) > (b.de + b.cai);\n   else if (a.de != b.de)\n\n      return a.de > b.de;\n   else\n      return a.num \u003c b.num;\n}\nint main() {\n   int n, low, high;\n   scanf(\"%d %d %d\", &n, &low, &high);\n   vector\u003cnode> v[4];\n   node temp;\n   int total = n;\n\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d %d %d\", &temp.num, &temp.de, &temp.cai);\n      if (temp.de \u003c low || temp.cai \u003c low)\n         total--;\n      else if (temp.de >= high && temp.cai >= high)\n         v[0].push_back(temp);\n      else if (temp.de >= high && temp.cai \u003c high)\n         v[1].push_back(temp);\n      else if (temp.de \u003c high && temp.cai \u003c high && temp.de >= temp.cai)\n\n         v[2].push_back(temp);\n      else\n         v[3].push_back(temp);\n   }\n   printf(\"%d\\n\", total);\n   for (int i = 0; i \u003c 4; i++) {\n      sort(v[i].begin(), v[i].end(), cmp);\n      for (int j = 0; j \u003c v[i].size(); j++)\n         printf(\"%d %d %d\\n\", v[i][j].num, v[i][j].de, v[i][j].cai);\n   }\n\n   return 0;\n}"},{"id":"1063","title":"Set Similarity","score":25,"category":"集合set,STL的使用","description":["Given two sets of integers, the similarity of the sets is defined to be Nc/Nt*100%, where Nc is the number of distinct common numbers shared by the two sets, and Nt is the total number of distinct numbers in the two sets. Your job is to calculate the similarity of any given pair of sets."],"input":"Each input file contains one test case. Each case first gives a positive integer N (\u003c=50) which is the total number of sets. Then N lines follow, each gives a set with a positive M (\u003c=104) and followed by M integers in the range [0, 109]. After the input of sets, a positive integer K (\u003c=2000) is given,\n\nfollowed by K lines of queries. Each query gives a pair of set numbers (the sets are numbered from 1 to N). All the numbers in a line are separated by a space.","output":"For each query, print in one line the similarity of the sets, in the percentage form accurate up to 1 decimal place.","samples":[{"input":"3\n3 99 87 101\n4 87 101 5 87\n7 99 101 18 5 135 18 99\n2\n1 2\n1 3","output":"50.0%\n33.3%","explanation":"","label":""}],"sampleInput":"3\n3 99 87 101\n4 87 101 5 87\n7 99 101 18 5 135 18 99\n2\n1 2\n1 3","sampleOutput":"50.0%\n33.3%","idea":["给定两个整数集合,它们的相似度定义为:Nc/Nt*100%。其中Nc是两个集合都有的不相等整数的个数,Nt是两个集合一共有的不相等整数的个数。你的任务就是计算任意一对给定集合的相似度。","nc是两个集合的公共元素个数,nt是两个集合的所有包含的元素个数(其中元素个数表示各个元素之间互不相同)分析:因为给出的集合里面含有重复的元素,而计算nc和nt不需要考虑两个集合里面是否分别有重复的元素,所以可以直接使用set存储每一个集合,然后把set放进一个数组里面存储。","当需要计算集合a和集合b的相似度nc和nt的时候,遍历集合a中的每一个元素,寻找集合b中是否有该元素,如果有,说明是 两个人公共的集合元素,则nc++,否则nt++(nt的初值为b集合里面本有的元素)"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003cvector>\n#include \u003cset>\n\n// 解题关键：给定两个整数集合,它们的相似度定义为:Nc/Nt*100%\nusing namespace std;\nint main() {\n\n   int n, m, k, temp, a, b;\n   scanf(\"%d\", &n);\n   vector\u003cset\u003cint>> v(n);\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &m);\n      set\u003cint> s;\n      for(int j = 0; j \u003c m; j++) {\n         scanf(\"%d\", &temp);\n\n         s.insert(temp);\n      }\n      v[i] = s;\n   }\n   scanf(\"%d\", &k);\n\n   for(int i = 0; i \u003c k; i++) {\n      scanf(\"%d %d\", &a, &b);\n      int nc = 0, nt = v[b-1].size();\n      for(auto it = v[a-1].begin(); it != v[a-1].end(); it++) {\n         if(v[b-1].find(*it) == v[b-1].end())\n             nt++;\n         else\n             nc++;\n      }\n      double ans = (double)nc / nt * 100;\n\n      printf(\"%.1f%%\\n\", ans);\n   }\n   return 0;\n}"},{"id":"1064","title":"Complete Binary Search Tree","score":30,"category":"二叉查找树BST","description":["A Binary Search Tree (BST) is recursively defined as a binary tree which has the following properties:The left subtree of a node contains only nodes with keys less than the node’s key.The right subtree of a node contains only nodes with keys greater than or equal to the node’s key.","Both the left and right subtrees must also be binary search trees.A Complete Binary Tree (CBT) is a tree that is completely filled, with the possible exception of the bottom level, which is filled from left to right.Now given a sequence of distinct non-negative integer keys, a unique BST can be constructed if it is","required that the tree must also be a CBT. You are supposed to output the level order traversal sequence of this BST."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N(\u003c=1000). Then N distinct non-negative integer keys are given in the next line. All the numbers in a line are separated by a space and are no greater than 2000.","output":"For each test case, print in one line the level order traversal sequence of the corresponding complete binary search tree. All the numbers in a line must be separated by a space, and there must be no extra space at the end of the line.","samples":[{"input":"10\n1 2 3 4 5 6 7 8 9 0","output":"6 3 8 1 5 7 9 0 2 4","explanation":"","label":""}],"sampleInput":"10\n1 2 3 4 5 6 7 8 9 0","sampleOutput":"6 3 8 1 5 7 9 0 2 4","idea":["给一串构成树的序列,已知该树是完全二叉搜索树,求它的层序遍历的序列分析:总得概括来说,已知中序,从根节点开始中序遍历,按中序数组给出的顺序依次将值填入level数组对应的下标中,输出level数组可得层序遍历。","1. 因为二叉搜索树的中序满足:是一组序列的从小到大排列,所以只需将所给序列排序即可得到中序数组in 2. 假设把树按从左到右、从上到下的顺序依次编号,根节点为0,则从根结点root = 0开始中序遍历,root结点的左孩子下标是root*2+1,右孩子下标是root*2+2 3. 因为是中序遍历,所以遍历结果与中序数组in中的值从0开始依次递增的结果相同,即in[t++](t从0开始),将in[t++]赋值给level[root]数组4. 因为树是按从左到右、从上到下的顺序依次编号的,所以level数组从0到n-1的值即所求的层序 遍历的值,输出level数组即可~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n\n// 解题关键：给一串构成树的序列,已知该树是完全二叉搜索树,求它的层序遍历的序列分析:总得概括来说,已知中序,从根节点开始中序遍历,按中序数组给出的顺序依次将值填入level数组对应的下标中,输出level数组可得层序遍历\nusing namespace std;\nint in[1010], level[1010], n, t = 0;\nvoid inOrder(int root) {\n   if (root >= n) return ;\n   inOrder(root * 2 + 1);\n   level[root] = in[t++];\n\n   inOrder(root * 2 + 2);\n}\nint main() {\n   scanf(\"%d\", &n);\n   for (int i = 0; i \u003c n; i++)\n      scanf(\"%d\", &in[i]);\n   sort(in, in + n);\n   inOrder(0);\n   printf(\"%d\", level[0]);\n\n   for (int i = 1; i \u003c n; i++)\n      printf(\" %d\", level[i]);\n   return 0;\n}"},{"id":"1065","title":"A+B and C (64bit)","score":20,"category":"模拟","description":["Given three integers A, B and C in [-263, 263], you are supposed to tell whether A+B > C."],"input":"The first line of the input gives the positive number of test cases, T (\u003c=10). Then T test cases follow,each consists of a single line containing three integers A, B and C, separated by single spaces.","output":"For each test case, output in one line “Case #X: true” if A+B>C, or “Case #X: false” otherwise, where X is the case number (starting from 1).”","samples":[{"input":"3\n1 2 3\n2 3 4\n9223372036854775807 -9223372036854775808 0","output":"Case #1: false\nCase #2: true\nCase #3: false","explanation":"","label":""}],"sampleInput":"3\n1 2 3\n2 3 4\n9223372036854775807 -9223372036854775808 0","sampleOutput":"Case #1: false\nCase #2: true\nCase #3: false","idea":["因为A、B的大小为[-2^63, 2^63],用long long 存储A和B的值,以及他们相加的值sum:如果A > 0, B \u003c 0 或者 A \u003c 0, B > 0,sum是不可能溢出的如果A > 0, B > 0,sum可能会溢出,sum范围理应为(0, 2^64 – 2],溢出得到的结果应该是[-2^63, -2]是个负数,所以sum \u003c 0时候说明溢出了如果A \u003c 0, B \u003c 0,sum可能会溢出,同理,sum溢出后结果是大于0的,所以sum > 0 说明溢出了"],"keyPoints":["把题目流程拆成清晰状态逐步模拟，每一步只修改相关变量。","重点检查循环起止、下标边界和最后一项的输出格式。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：因为A、B的大小为[-2^63, 2^63],用long long 存储A和B的值,以及他们相加的值sum:如果A > 0, B \u003c 0 或者 A \u003c 0, B > 0,sum是不可能溢出的如果A > 0, B > 0,\nusing namespace std;\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   for(int i = 0; i \u003c n; i++) {\n      long long a, b, c;\n      scanf(\"%lld %lld %lld\", &a, &b, &c);\n\n      long long sum = a + b;\n      if(a > 0 && b > 0 && sum \u003c 0) {\n\n         printf(\"Case #%d: true\\n\", i + 1);\n      } else if(a \u003c 0 && b \u003c 0 && sum >= 0){\n         printf(\"Case #%d: false\\n\", i + 1);\n      } else if(sum > c) {\n         printf(\"Case #%d: true\\n\", i + 1);\n\n      } else {\n         printf(\"Case #%d: false\\n\", i + 1);\n      }\n   }\n   return 0;\n}"},{"id":"1066","title":"Root of AVL Tree","score":25,"category":"平衡二叉树(AVL树)","description":["An AVL tree is a self-balancing binary search tree. In an AVL tree, the heights of the two child subtrees of any node differ by at most one; if at any time they differ by more than one, rebalancing is done to restore this property. Figures 1-4 illustrate the rotation rules.","Now given a sequence of insertions, you are supposed to tell the root of the resulting AVL tree."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N (\u003c=20)which is the total number of keys to be inserted. Then N distinct integer keys are given in the next line. All the numbers in a line are separated by a space.","output":"For each test case, print ythe root of the resulting AVL tree in one line.","samples":[{"input":"5\n88 70 61 96 120","output":"70","explanation":"","label":"1"},{"input":"7\n88 70 61 96 120 90 65","output":"88","explanation":"","label":"2"}],"sampleInput":"5\n88 70 61 96 120","sampleOutput":"70","idea":["AVL树是自平衡二叉搜索树。在AVL树中,任何节点的两个子子树的高度最多相差一个;如果在任何时候它们相差多于一个,则重新平衡以恢复此属性。图1-4说明了旋转规则~现在给出一系列插入,要求输出根节点的值~","写出建AVL(平衡二叉搜索树)的代码模版即可,rotateLeft表示左旋,rotateRight表示右旋,rotateLeftRight表示先左旋后右旋,rotateRightLeft表示先右旋后左旋,getHeight表示获取传入结点的子树的高度,insert表示插入建树的过程,如果root为空,直接新建结点插入即可~","如果当前要插入的值小于root->val,则插入root的左子树;如果当前要插入的值大于root->val,则插入root的右子树~如果插入后左右子树高度差大于1,再根据值的大小比较进行旋转调整使树平衡~插入完成后返回root指 针赋值给main函数里的root~最后输出root的val值~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：AVL树是自平衡二叉搜索树\nusing namespace std;\n\nstruct node {\n   int val;\n   struct node *left, *right;\n};\nnode *rotateLeft(node *root) {\n   node *t = root->right;\n   root->right = t->left;\n   t->left = root;\n   return t;\n}\n\nnode *rotateRight(node *root) {\n   node *t = root->left;\n   root->left = t->right;\n   t->right = root;\n   return t;\n}\nnode *rotateLeftRight(node *root) {\n   root->left = rotateLeft(root->left);\n   return rotateRight(root);\n}\n\nnode *rotateRightLeft(node *root) {\n   root->right = rotateRight(root->right);\n   return rotateLeft(root);\n}\n\nint getHeight(node *root) {\n   if(root == NULL) return 0;\n   return max(getHeight(root->left), getHeight(root->right)) + 1;\n}\nnode *insert(node *root, int val) {\n\n   if(root == NULL) {\n      root = new node();\n      root->val = val;\n      root->left = root->right = NULL;\n   } else if(val \u003c root->val) {\n      root->left = insert(root->left, val);\n      if(getHeight(root->left) - getHeight(root->right) == 2)\n         root = val \u003c root->left->val ? rotateRight(root) : rotateLeftRight(root);\n   } else {\n\n      root->right = insert(root->right, val);\n      if(getHeight(root->left) - getHeight(root->right) == -2)\n         root = val > root->right->val ? rotateLeft(root) : rotateRightLeft(root);\n   }\n   return root;\n}\nint main() {\n   int n, val;\n\n   scanf(\"%d\", &n);\n   node *root = NULL;\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &val);\n      root = insert(root, val);\n   }\n   printf(\"%d\", root->val);\n   return 0;\n}"},{"id":"1067","title":"Sort with Swap(0,*)","score":25,"category":"贪心算法","description":["Given any permutation of the numbers {0, 1, 2,..., N-1}, it is easy to sort them in increasing order. But what if Swap(0, *) is the ONLY operation that is allowed to use? For example, to sort {4, 0, 2, 1, 3} we may apply the swap operations in the following way:","Swap(0, 1) => {4, 1, 2, 0, 3}Swap(0, 3) => {4, 1, 2, 3, 0}Swap(0, 4) => {0, 1, 2, 3, 4}Now you are asked to find the minimum number of swaps need to sort the given permutation of the first N nonnegative integers."],"input":"Each input file contains one test case, which gives a positive N (\u003c=105) followed by a permutation sequence of {0, 1,..., N-1}. All the numbers in a line are separated by a space.","output":"For each case, simply print in a line the minimum number of swaps need to sort the given permutation.","samples":[{"input":"10 3 5 7 2 6 4 9 0 8 1","output":"9","explanation":"","label":""}],"sampleInput":"10 3 5 7 2 6 4 9 0 8 1","sampleOutput":"9","idea":["给出一个n个数的序列,数字为0~n-1的乱序,每次用两两交换的方式而且只能用0和另一个数交换,使序列变成有序的,问最少需要多少步骤。1.0号为哨兵, 用哨兵与其他数字交换,使其他数字回到有序的位置(最后有序时所处的位置),则排序完成2.a[t] = i; 表示t数字当前正在占着哪一个位置。","(如果想实时监测每个数字的位置,可以用 b 数组{b[a[i]] = i } 缓存一下数据,输出查看的)3.依次遍历每个位置i,如果当前位置不是与之对应的数字,那么我们让这哨兵来去该数执行操作回到正确位置4.数字如何被哨兵执行操作回到序的位置:如果哨兵此时不在自己有序的位置上,那就,先让哨兵去让他占的那个位置上的真正应该放的数字回到此位置,即交换哨兵和此数字,我们swap(a[0],a[a0]),直到哨兵在交换的过程中回到了自己的有序位 置。","字词再次检查该位置是不是应该放的数字(别的数字回到有序位置的时候即哨兵执行操作的过程中,有可能让此位置该有的数字回到位置)。如果此位置不是当前数字,那哨兵和他交换swap(a[0],a[i]),就是让他先去哨兵的有序位置待一会,等下一轮操作,哨兵会把他交换回来的。如果此位置已经是该数字了,那就什么都不做。5.当到达最后一个位置时候,两种情况 1)。","如果第一个数字和最后一个数字都在自己的有序位置 那ok~2).哨兵和最后一个数字互相占着对方的位置,那最后一个数字就是哨兵,交换一次后,哨兵在交换后的位置等待,就是已经回到自己的有序位置,此时排序也是完成的。此过程包括在4里面了,怕你们不理解,单独说一下~"],"keyPoints":["先明确局部选择为什么不会破坏后续最优解，再按对应关键字排序。","涉及小数收益或比例时使用 double，并避免过早取整。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出一个n个数的序列,数字为0\nusing namespace std;\nint main() {\n\n   int n, t, cnt = 0, a[100010];\n   cin >> n;\n   for(int i = 0; i \u003c n; i++){\n     cin >> t;\n     a[t] = i;\n   }\n\n   for(int i = 1; i \u003c n; i++) {\n      if(i != a[i]) {\n         while(a[0] != 0) {\n             swap(a[0],a[a[0]]);\n             cnt++;\n\n         }\n         if(i != a[i]) {\n             swap(a[0],a[i]);\n             cnt++;\n         }\n      }\n   }\n   cout \u003c\u003c cnt;\n   return 0;\n}"},{"id":"1068","title":"Find More Coins","score":30,"category":"01背包,动态规划","description":["Eva loves to collect coins from all over the universe, including some other planets like Mars. One day she visited a universal shopping mall which could accept all kinds of coins as payments. However,there was a special requirement of the payment: for each bill, she must pay the exact amount. Since","she has as many as 104 coins with her, she definitely needs your help. You are supposed to tell her, for any given amount of money, whether or not she can find some coins to pay for it."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive numbers: N(\u003c=104, the total number of coins) and M(\u003c=102, the amount of money Eva has to pay). The second line contains N face values of the coins, which are all positive numbers. All the numbers in a line are\n\nseparated by a space.","output":"For each test case, print in one line the face values V1 \u003c= V2 \u003c=... \u003c= Vk such that V1 + V2 +... + Vk= M. All the numbers must be separated by a space, and there must be no extra space at the end of the line. If such a solution is not unique, output the smallest sequence. If there is no solution, output “No\n\nSolution” instead.Note: sequence {A[1], A[2],...} is said to be “smaller” than sequence {B[1], B[2],...} if there exists k >=1 such that A[i]=B[i] for all i \u003c k, and A[k] \u003c B[k].","samples":[{"input":"8 9\n5 9 8 7 2 3 4 1","output":"1 3 5","explanation":"","label":"1"},{"input":"4 8\n7 2 4 3","output":"No Solution","explanation":"","label":"2"}],"sampleInput":"8 9\n5 9 8 7 2 3 4 1","sampleOutput":"1 3 5","idea":["用n个硬币买价值为m的东西,输出使用方案,使得正好几个硬币加起来价值为m。","从小到大排列,输出最小的那个排列方案分析:01背包问题,因为要输出从小到大的排列,可以先把硬币面额从大到小排列,然后用bool类型的choice[i][j]数组dp[i][j]是否选取,如果选取了就令choice为true;然后进行01背包问题求解,如果最后求解的结果不是恰好等于所需要的价值的,就输出No Soultion,否则从choice[i][j]判断选取的情况,i从n到1表示从后往前看第i个物品的选取情况,j从m到0表示从容量m到0是否选取(j = j – w[i]),把选取 情况压入arr数组中,最后输出arr数组"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003calgorithm>\n\n// 解题关键：用n个硬币买价值为m的东西,输出使用方案,使得正好几个硬币加起来价值为m\nusing namespace std;\nint dp[10010], w[10010];\n\nbool choice[10010][110];\nint cmp1(int a, int b){return a > b;}\nint main() {\n   int n, m;\n   scanf(\"%d%d\", &n, &m);\n   for(int i = 1; i \u003c= n; i++)\n      scanf(\"%d\", &w[i]);\n   sort(w + 1, w + n + 1, cmp1);\n   for(int i = 1; i \u003c= n; i++) {\n      for(int j = m; j >= w[i]; j--) {\n\n         if(dp[j] \u003c= dp[j-w[i]] + w[i]) {\n             choice[i][j] = true;\n             dp[j] = dp[j-w[i]] + w[i];\n         }\n      }\n   }\n   if(dp[m] != m) printf(\"No Solution\");\n   else {\n      vector\u003cint> arr;\n\n      int v = m, index = n;\n      while(v > 0) {\n         if(choice[index][v] == true) {\n             arr.push_back(w[index]);\n             v -= w[index];\n         }\n         index--;\n\n      }\n      for(int i = 0; i \u003c arr.size(); i++) {\n         if(i != 0) printf(\" \");\n         printf(\"%d\", arr[i]);\n      }\n\n   }\n   return 0;\n}"},{"id":"1069","title":"The Black Hole of Numbers","score":20,"category":"数学问题","description":["For any 4-digit integer except the ones with all the digits being the same, if we sort the digits in non-increasing order first, and then in non-decreasing order, a new number can be obtained by taking the second number from the first one. Repeat in this manner we will soon end up at the number 6174 —","the “black hole” of 4-digit numbers. This number is named Kaprekar Constant.For example, start from 6767, we’ll get:7766 – 6677 = 1089 9810 – 0189 = 9621 9621 – 1269 = 8352 8532 – 2358 = 6174 7641 – 1467 = 6174......Given any 4-digit number, you are supposed to illustrate the way it gets into the black hole."],"input":"Each input file contains one test case which gives a positive integer N in the range (0, 10000).","output":"If all the 4 digits of N are the same, print in one line the equation “N – N = 0000”. Else print each step of calculation in a line until 6174 comes out as the difference. All the numbers must be printed as 4-digit numbers.","samples":[{"input":"6767","output":"7766 – 6677 = 1089\n9810 – 0189 = 9621\n9621 – 1269 = 8352\n8532 – 2358 = 6174","explanation":"","label":"1"},{"input":"2222","output":"2222 – 2222 = 0000","explanation":"","label":"2"}],"sampleInput":"6767","sampleOutput":"7766 – 6677 = 1089\n9810 – 0189 = 9621\n9621 – 1269 = 8352\n8532 – 2358 = 6174","idea":["有一个测试用例注意点,如果当输入N值为6174的时候,依旧要进行下面的步骤,直到差值为6174才可以~所以用do while语句,无论是什么值总是要执行一遍while语句,直到遇到差值是0000或6174~s.insert(0, 4 – s.length(), ‘0’);用来给不足4位的时候前面补0~"],"keyPoints":["先推导等价公式再编码，避免直接按定义做不必要的重复计算。","乘法、累加或组合计数可能超出 int，应按范围选择 long long。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n\n// 解题关键：有一个测试用例注意点,如果当输入N值为6174的时候,依旧要进行下面的步骤,直到差值为6174才可以\nusing namespace std;\nbool cmp(char a, char b) {return a > b;}\nint main() {\n   string s;\n   cin >> s;\n   s.insert(0, 4 - s.length(), '0');\n   do {\n      string a = s, b = s;\n\n      sort(a.begin(), a.end(), cmp);\n      sort(b.begin(), b.end());\n      int result = stoi(a) - stoi(b);\n      s = to_string(result);\n      s.insert(0, 4 - s.length(), '0');\n      cout \u003c\u003c a \u003c\u003c \" - \" \u003c\u003c b \u003c\u003c \" = \" \u003c\u003c s \u003c\u003c endl;\n   } while (s != \"6174\" && s != \"0000\");\n   return 0;\n}"},{"id":"1070","title":"Mooncake","score":25,"category":"贪心算法","description":["Mooncake is a Chinese bakery product traditionally eaten during the Mid-Autumn Festival. Many types of fillings and crusts can be found in traditional mooncakes according to the regions culture.Now given the inventory amounts and the prices of all kinds of the mooncakes, together with the","maximum total demand of the market, you are supposed to tell the maximum profit that can be made.Note: partial inventory storage can be taken. The sample shows the following situation: given three kinds of mooncakes with inventory amounts being 180, 150, and 100 thousand tons, and the prices","being 7.5, 7.2, and 4.5 billion yuans. If the market demand can be at most 200 thousand tons, the best we can do is to sell 150 thousand tons of the second kind of mooncake, and 50 thousand tons of the third kind. Hence the total profit is 7.2 + 4.5/2 = 9.45 (billion yuans)."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive integers N(\u003c=1000), the number of different kinds of mooncakes, and D (\u003c=500 thousand tons), the maximum total demand of the market. Then the second line gives the positive inventory amounts (in thousand\n\ntons), and the third line gives the positive prices (in billion yuans) of N kinds of mooncakes. All the numbers in a line are separated by a space.","output":"For each test case, print the maximum profit (in billion yuans) in one line, accurate up to 2 decimal places.","samples":[{"input":"3 200\n180 150 100\n7.5 7.2 4.5","output":"9.45","explanation":"","label":""}],"sampleInput":"3 200\n180 150 100\n7.5 7.2 4.5","sampleOutput":"9.45","idea":["N表示月饼种类,D表示月饼的市场最大需求量,给出每种月饼的数量和总价,问根据市场最大需求量,这些月饼的最大销售利润为多少~首先根据月饼的总价和数量计算出每一种月饼的单价,然后将月饼数组按照单价从大到小排序,根据需求量need的大小,从单价最大的月饼开始售卖,将销售掉这种月饼的价格累加到result中,最后输出result即可~"],"keyPoints":["先明确局部选择为什么不会破坏后续最优解，再按对应关键字排序。","涉及小数收益或比例时使用 double，并避免过早取整。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003cvector>\n\n// 解题关键：N表示月饼种类,D表示月饼的市场最大需求量,给出每种月饼的数量和总价,问根据市场最大需求量,这些月饼的最大销售利润为多少\n\nusing namespace std;\nstruct mooncake{\n   float num, price, unit;\n};\nint cmp(mooncake a, mooncake b) {\n   return a.unit > b.unit;\n}\nint main() {\n   int n, need;\n\n   cin >> n >> need;\n   vector\u003cmooncake> a(n);\n   for (int i = 0; i \u003c n; i++) scanf(\"%f\", &a[i].num);\n   for (int i = 0; i \u003c n; i++) scanf(\"%f\", &a[i].price);\n\n   for (int i = 0; i \u003c n; i++) a[i].unit = a[i].price / a[i].num;\n   sort(a.begin(), a.end(), cmp);\n   float result = 0.0;\n   for (int i = 0; i \u003c n; i++) {\n      if (a[i].num \u003c= need) {\n\n         result = result + a[i].price;\n      } else {\n         result = result + a[i].unit * need;\n         break;\n      }\n      need = need - a[i].num;\n   }\n   printf(\"%.2f\",result);\n   return 0;\n}"},{"id":"1071","title":"Speech Patterns","score":25,"category":"map映射,STL的使用","description":["People often have a preference among synonyms of the same word. For example, some may prefer“the police”, while others may prefer “the cops”. Analyzing such patterns can help to narrow down a speaker’s identity, which is useful when validating, for example, whether it’s still the same person","behind an online avatar.Now given a paragraph of text sampled from someone’s speech, can you find the person’s most commonly used word?"],"input":"Each input file contains one test case. For each case, there is one line of text no more than 1048576 characters in length, terminated by a carriage return ‘\\n’. The input contains at least one alphanumerical character, i.e., one character from the set [0-9 A-Z a-z].","output":"For each test case, print in one line the most commonly occurring word in the input text, followed by a space and the number of times it has occurred in the input. If there are more than one such words,print the lexicographically smallest one. The word should be printed in all lower case. Here a “word”\n\nis defined as a continuous sequence of alphanumerical characters separated by non-alphanumerical characters or the line beginning/end.Note that words are case insensitive.","samples":[{"input":"Can1: “Can a can can a can? It can!”","output":"can 5","explanation":"","label":""}],"sampleInput":"Can1: “Can a can can a can? It can!”","sampleOutput":"can 5","idea":["统计单词个数~大小写字母+数字的组合才是合法的单词,给出一个字符串,求出现的合法的单词的个数最多的那个单词,以及它出现的次数。如果有并列的,那么输出字典序里面的第一个~~用map很简单的~不过呢~有几个注意点~:1. 大小写不区分,所以统计之前要先s[i] = tolower(s[i]);2. [0-9 A-Z a-z]可以简写为cctype头文件里面的一个函数isalnum~","~3. 必须用getline读入一长串的带空格的字符串~~4. 一定要当t不为空的时候m[t]++,因为t为空也会被统计的!!!~~5. 最重要的是~如果i已经到了最后一位,不管当前位是不是字母数字,都得将当前这个t放到map里面(只要t长度不为0)~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n#include \u003ccctype>\n\n// 解题关键：统计单词个数\nusing namespace std;\nint main() {\n   string s, t;\n\n   getline(cin, s);\n   map\u003cstring, int> m;\n   for(int i = 0; i \u003c s.length(); i++) {\n      if(isalnum(s[i])) {\n         s[i] = tolower(s[i]);\n         t += s[i];\n      }\n      if(!isalnum(s[i]) || i == s.length() - 1){\n         if(t.length() != 0) m[t]++;\n\n         t = \"\";\n      }\n   }\n   int maxn = 0;\n   for(auto it = m.begin(); it != m.end(); it++) {\n      if(it->second > maxn) {\n         t = it->first;\n         maxn = it->second;\n      }\n   }\n\n   cout \u003c\u003c t \u003c\u003c \" \" \u003c\u003c maxn;\n   return 0;\n}"},{"id":"1072","title":"Gas Station","score":30,"category":"Dijkstra算法","description":["A gas station has to be built at such a location that the minimum distance between the station and any of the residential housing is as far away as possible. However it must guarantee that all the houses are in its service range.Now given the map of the city and several candidate locations for the gas station, you are supposed","to give the best recommendation. If there are more than one solution, output the one with the smallest average distance to all the houses. If such a solution is still not unique, output the one with the smallest index number."],"input":"Each input file contains one test case. For each case, the first line contains 4 positive integers: N (\u003c=103), the total number of houses; M (\u003c= 10), the total number of the candidate locations for the gas stations; K (\u003c= 104), the number of roads connecting the houses and the gas stations; and DS, the\n\nmaximum service range of the gas station. It is hence assumed that all the houses are numbered from 1 to N, and all the candidate locations are numbered from G1 to GM.Then K lines follow, each describes a road in the format P1 P2 Dist where P1 and P2 are the two ends of a road which can be either house numbers or gas station\n\nnumbers, and Dist is the integer length of the road.","output":"For each test case, print in the first line the index number of the best location. In the next line, print the minimum and the average distances between the solution and all the houses. The numbers in a line must be separated by a space and be accurate up to 1 decimal place. If the solution does not exist,\n\nsimply output “No Solution”.","samples":[{"input":"4 3 11 5\n1 2 2\n1 4 2\n1 G1 4\n1 G2 3\n2 3 2\n2 G2 1\n3 4 2\n3 G3 2\n4 G1 3\nG2 G1 1\nG3 G2 2","output":"G1\n2.0 3.3","explanation":"","label":"1"},{"input":"2 1 2 10\n1 G1 9\n2 G1 20","output":"No Solution","explanation":"","label":"2"}],"sampleInput":"4 3 11 5\n1 2 2\n1 4 2\n1 G1 4\n1 G2 3\n2 3 2\n2 G2 1\n3 4 2\n3 G3 2\n4 G1 3\nG2 G1 1\nG3 G2 2","sampleOutput":"G1\n2.0 3.3","idea":["从m个加油站里面选取1个站点,让他离居民区的最近的人最远,并且没有超出服务范围ds之内。如果有很多个最远的加油站,输出距离所有居民区距离平均值最小的那个。如果平均值还是一样,就输出按照顺序排列加油站编号最小的那个分析:因为加油站之间也是彼此有路连接的,所以最短路径计算的时候也要把加油站算上。所以我们就是对n+m个点进行Dijkstra计算最短路径。要求计算出1~","m号加油站距离其他站点的最短路径。这时候可以遍历dis数组,如果dis存在一个距离大于服务范围ds的距离,那么我们就舍弃这个加油站。取最最短的路径,这就是距离它最近的加油站mindis。如果mindis > ansdis,就是说找到了一个距离居民最小距 离的加油站是更远的,那就选这个加油站,更新ansid为它的id。","最后输出对于加油站的字符串编号的处理:如果最近居民区最大的值没有变化但是找到了一个更小的平均距离,那就选这个。我们可以根据输入的是G还是数字,如果是数字就令编号为他自己,如果是G开头的,编号设为n+G后面的数字。Update:Github用户littlesevenmo在issue中提出需要添加输入判断,题目中并没有说明两点之间最多只有一条路。","也就是说,有可能两点之间有多条路,因此需要添加判断,只存储距离最短的路。另外,也有可能会出现 G1 G1 9999这样的测试数据,因此,自身与自身之间的距离要初始化为0。完善后的代码如下:"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003cstring>\n\n// 解题关键：从m个加油站里面选取1个站点,让他离居民区的最近的人最远,并且没有超出服务范围ds之内\nusing namespace std;\nconst int inf = 999999999;\nint n, m, k, ds, station;\nint e[1020][1020], dis[1020];\n\nbool visited[1020];\nint main() {\n   fill(e[0], e[0] + 1020 * 1020, inf);\n   for (int i = 0; i \u003c 1020; i++) e[i][i] = 0;\n   fill(dis, dis + 1020, inf);\n\n   scanf(\"%d%d%d%d\", &n, &m, &k, &ds);\n   string s, t;\n   for (int i = 0; i \u003c k; i++) {\n      int tempdis;\n      cin >> s >> t >> tempdis;\n      int a, b;\n      if (s[0] == 'G') {\n         s = s.substr(1);\n         a = n + stoi(s);\n      } else {\n\n         a = stoi(s);\n      }\n      if (t[0] == 'G') {\n         t = t.substr(1);\n         b = n + stoi(t);\n      } else {\n         b = stoi(t);\n      }\n      e[a][b] = e[b][a] = min(tempdis, e[a][b]);\n\n   }\n   int ansid = -1;\n   double ansdis = -1, ansaver = inf;\n   for (int index = n + 1; index \u003c= n + m; index++) {\n      double mindis = inf, aver = 0;\n      fill(dis, dis + 1020, inf);\n      fill(visited, visited + 1020, false);\n      dis[index] = 0;\n      for (int i = 0; i \u003c n + m; i++) {\n         int u = -1, minn = inf;\n\n         for (int j = 1; j \u003c= n + m; j++) {\n             if (visited[j] == false && dis[j] \u003c minn) {\n                u = j;\n                minn = dis[j];\n             }\n         }\n         if (u == -1) break;\n         visited[u] = true;\n         for (int v = 1; v \u003c= n + m; v++) {\n\n             if (visited[v] == false && dis[v] > dis[u] + e[u][v])\n                dis[v] = dis[u] + e[u][v];\n         }\n      }\n      for (int i = 1; i \u003c= n; i++) {\n         if (dis[i] > ds) {\n\n             mindis = -1;\n             break;\n         }\n         if (dis[i] \u003c mindis) mindis = dis[i];\n         aver += 1.0 * dis[i];\n\n      }\n      if (mindis == -1) continue;\n      aver = aver / n;\n      if (mindis > ansdis) {\n         ansid = index;\n         ansdis = mindis;\n         ansaver = aver;\n      } else if (mindis == ansdis && aver \u003c ansaver) {\n         ansid = index;\n         ansaver = aver;\n\n      }\n   }\n   if (ansid == -1)\n      printf(\"No Solution\");\n   else\n      printf(\"G%d\\n%.1f %.1f\", ansid - n, ansdis, ansaver);\n   return 0;\n}"},{"id":"1073","title":"Scientific Notation","score":20,"category":"字符串处理","description":["Scientific notation is the way that scientists easily handle very large numbers or very small numbers.The notation matches the regular expression [+-][1-9]”.”[0-9]+E[+-][0-9]+ which means that the integ
