 a line are separated by a space.","output":"For each test case, print in one line the level order traversal sequence of the corresponding binary tree.All the numbers in a line must be separated by exactly one space, and there must be no extra space at the end of the line.","samples":[{"input":"7\n2 3 1 5 7 6 4\n1 2 3 4 5 6 7","output":"4 1 6 3 5 7 2","explanation":"","label":""}],"sampleInput":"7\n2 3 1 5 7 6 4\n1 2 3 4 5 6 7","sampleOutput":"4 1 6 3 5 7 2","idea":["给定一棵二叉树的后序遍历和中序遍历,请你输出其层序遍历的序列。这里假设键值都是互不相等的正整数。与后序中序转换为前序的代码相仿(无须构造二叉树再进行广度优先搜索~","),只不过加一个变量index,表示当前的根结点在二叉树中所对应的下标(从0开始),所以进行一次输出先序的递归过程中,就可以把根结点下标index及所对应的值存储在map\u003cint, int> level中,map是有序的会根据index从小到大自动排序,这样递归完成后level中的值就是层序遍历的顺序~~","如果你不知道如何将后序和中序转换为先序,请看:https://www.liuchuo.net/archives/2090"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003cvector>\n#include \u003cmap>\n\n// 解题关键：给定一棵二叉树的后序遍历和中序遍历,请你输出其层序遍历的序列\nusing namespace std;\nvector\u003cint> post, in;\nmap\u003cint, int> level;\n\nvoid pre(int root, int start, int end, int index) {\n   if(start > end) return ;\n   int i = start;\n   while(i \u003c end && in[i] != post[root]) i++;\n   level[index] = post[root];\n   pre(root - 1 - end + i, start, i - 1, 2 * index + 1);\n   pre(root - 1, i + 1, end, 2 * index + 2);\n}\nint main() {\n   int n;\n\n   scanf(\"%d\", &n);\n   post.resize(n);\n   in.resize(n);\n   for(int i = 0; i \u003c n; i++) scanf(\"%d\", &post[i]);\n   for(int i = 0; i \u003c n; i++) scanf(\"%d\", &in[i]);\n   pre(n-1, 0, n-1, 0);\n   auto it = level.begin();\n   printf(\"%d\", it->second);\n   while(++it != level.end()) printf(\" %d\", it->second);\n   return 0;\n\n}"},{"id":"1021","title":"Deepest Root","score":25,"category":"图的遍历,DFS,计算连通分量的个数","description":["A graph which is connected and acyclic can be considered a tree. The height of the tree depends on the selected root. Now you are supposed to find the root that results in a highest tree. Such a root is called the deepest root."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N(\u003c=10000) which is the number of nodes, and hence the nodes are numbered from 1 to N. Then N-1 lines follow, each describes an edge by given the two adjacent nodes’ numbers.","output":"For each test case, print each of the deepest roots in a line. If such a root is not unique, print them in increasing order of their numbers. In case that the given graph is not a tree, print “Error: K components” where K is the number of connected components in the graph.","samples":[{"input":"5\n1 2\n1 3\n1 4\n2 5","output":"3\n4\n5","explanation":"","label":"1"},{"input":"5\n1 3\n1 4\n2 5\n3 4","output":"Error: 2 components","explanation":"","label":"2"}],"sampleInput":"5\n1 2\n1 3\n1 4\n2 5","sampleOutput":"3\n4\n5","idea":["给出n个结点(1~n)之间的n条边,问是否能构成一棵树,如果不能构成则输出它有的连通分量个数,如果能构成一棵树,输出能构成最深的树的高度时,树的根结点。如果有多个,按照从小到大输出。首先深度优先搜索判断它有几个连通分量。","如果有多个,那就输出Error: x components,如果只有一个,就两次深度优先搜索,先从一个结点dfs后保留最高高度拥有的结点们,然后从这些结点中的其中任意一个开始dfs得到最高高度的结点们,这两个结点集合的并集就是所求"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cset>\n#include \u003calgorithm>\n\n// 解题关键：给出n个结点(1\nusing namespace std;\n\nint n, maxheight = 0;\nvector\u003cvector\u003cint>> v;\nbool visited[10010];\nset\u003cint> s;\nvector\u003cint> temp;\n\nvoid dfs(int node, int height) {\n   if(height > maxheight) {\n      temp.clear();\n      temp.push_back(node);\n      maxheight = height;\n   } else if(height == maxheight){\n      temp.push_back(node);\n   }\n   visited[node] = true;\n   for(int i = 0; i \u003c v[node].size(); i++) {\n\n      if(visited[v[node][i]] == false)\n         dfs(v[node][i], height + 1);\n   }\n}\nint main() {\n   scanf(\"%d\", &n);\n   v.resize(n + 1);\n   int a, b, cnt = 0, s1 = 0;\n   for(int i = 0; i \u003c n - 1; i++) {\n\n      scanf(\"%d%d\", &a, &b);\n      v[a].push_back(b);\n      v[b].push_back(a);\n   }\n   for(int i = 1; i \u003c= n; i++) {\n      if(visited[i] == false) {\n         dfs(i, 1);\n         if(i == 1) {\n             if (temp.size() != 0) s1 = temp[0];\n             for(int j = 0; j \u003c temp.size(); j++)\n\n                s.insert(temp[j]);\n         }\n         cnt++;\n      }\n   }\n   if(cnt >= 2) {\n      printf(\"Error: %d components\", cnt);\n   } else {\n      temp.clear();\n\n      maxheight = 0;\n      fill(visited, visited + 10010, false);\n      dfs(s1, 1);\n      for(int i = 0; i \u003c temp.size(); i++)\n         s.insert(temp[i]);\n      for(auto it = s.begin(); it != s.end(); it++)\n\n         printf(\"%d\\n\", *it);\n   }\n   return 0;\n}"},{"id":"1022","title":"Digital Library","score":30,"category":"map映射,STL的使用","description":["A Digital Library contains millions of books, stored according to their titles, authors, key words of their abstracts, publishers, and published years. Each book is assigned an unique 7-digit number as its ID. Given any query from a reader, you are supposed to output the resulting books, sorted in","increasing order of their ID’s."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N(\u003c=10000) which is the total number of books. Then N blocks follow, each contains the information of a book in 6 lines:Line #1: the 7-digit ID number;Line #2: the book title — a string of no more than 80 characters;\n\nLine #3: the author — a string of no more than 80 characters;Line #4: the key words — each word is a string of no more than 10 characters without any white space, and the keywords are separated by exactly one space;Line #5: the publisher — a string of no more than 80 characters;\n\nLine #6: the published year — a 4-digit number which is in the range [1000, 3000].It is assumed that each book belongs to one author only, and contains no more than 5 key words;there are no more than 1000 distinct key words in total; and there are no more than 1000 distinct\n\npublishers.After the book information, there is a line containing a positive integer M (\u003c=1000) which is the number of user’s search queries. Then M lines follow, each in one of the formats shown below:1: a book title 2: name of an author 3: a key word 4: name of a publisher\n\n5: a 4-digit number representing the year","output":"For each query, first print the original query in a line, then output the resulting book ID’s in increasing order, each occupying a line. If no book is found, print “Not Found” instead.","samples":[{"input":"3\n1111111\nThe Testing Book\nYue Chen\ntest code debug sort keywords\nZUCS Print\n2011\n3333333\nAnother Testing Book\nYue Chen\ntest code sort keywords\nZUCS Print2\n2012\n2222222\nThe Testing Book\nCYLL\nkeywords debug book\nZUCS Print2\n2011\n6\n1: The Testing Book\n2: Yue Chen\n3: keywords\n4: ZUCS Print\n5: 2011\n3: blablabla","output":"1: The Testing Book\n1111111\n2222222\n2: Yue Chen\n1111111\n3333333\n3: keywords\n1111111\n2222222\n3333333\n4: ZUCS Print\n1111111\n5: 2011\n1111111\n2222222\n3: blablabla\nNot Found","explanation":"","label":""}],"sampleInput":"3\n1111111\nThe Testing Book\nYue Chen\ntest code debug sort keywords\nZUCS Print\n2011\n3333333\nAnother Testing Book\nYue Chen\ntest code sort keywords\nZUCS Print2\n2012\n2222222\nThe Testing Book\nCYLL\nkeywords debug book\nZUCS Print2\n2011\n6\n1: The Testing Book\n2: Yue Chen\n3: keywords\n4: ZUCS Print\n5: 2011\n3: blablabla","sampleOutput":"1: The Testing Book\n1111111\n2222222\n2: Yue Chen\n1111111\n3333333\n3: keywords\n1111111\n2222222\n3333333\n4: ZUCS Print\n1111111\n5: 2011\n1111111\n2222222\n3: blablabla\nNot Found","idea":["模拟数字图书馆的查询功能。","会给出n本书的信息,以及m个需要查询的命令,数字标号对应相应的命令,数字编号后面的字符串是查询的搜索词,要求输出这行命令以及输出满足条件的书的id,如果一个都没有找到,输出Not Found分析:1、对除了id之外的其他信息都建立一个map\u003cstring, set>,把相应的id插入对应搜索词的map的集合里面,形成一个信息对应一个集合,集合里面是复合条件的书的id 2、因为对于输入的关键词(可以重复,算是书本对应的tag标签吧~",")没有给定关键词的个数,可以使用while(cin >> s)并且判断c = getchar(),c是否等于\\n,如果是再退出循环~3、建立query,通过传参的形式可以将不同的map名称统一化,先要判断map.find()和m.end()是否相等,如果不等再去遍历整个map,输出所有满足条件的id,如果相等就说明不存在这个搜索词对应的id,那么就要输出Not Found~","4、传参一定要用引用,否则最后一组数据可能会超时"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n#include \u003cset>\n\n// 解题关键：模拟数字图书馆的查询功能\nusing namespace std;\n\nmap\u003cstring, set\u003cint> > title, author, key, pub, year;\nvoid query(map\u003cstring, set\u003cint> > &m, string &str) {\n   if(m.find(str) != m.end()) {\n      for(auto it = m[str].begin(); it != m[str].end(); it++)\n         printf(\"%07d\\n\", *it);\n\n   } else\n      cout \u003c\u003c \"Not Found\\n\";\n}\nint main() {\n   int n, m, id, num;\n   scanf(\"%d\", &n);\n   string ttitle, tauthor, tkey, tpub, tyear;\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d\\n\", &id);\n      getline(cin, ttitle);\n\n      title[ttitle].insert(id);\n      getline(cin, tauthor);\n      author[tauthor].insert(id);\n      while(cin >> tkey) {\n         key[tkey].insert(id);\n         char c = getchar();\n         if(c == '\\n') break;\n      }\n      getline(cin, tpub);\n\n      pub[tpub].insert(id);\n      getline(cin, tyear);\n      year[tyear].insert(id);\n   }\n   scanf(\"%d\", &m);\n   for(int i = 0; i \u003c m; i++) {\n      scanf(\"%d: \", &num);\n      string temp;\n      getline(cin, temp);\n      cout \u003c\u003c num \u003c\u003c \": \" \u003c\u003c temp \u003c\u003c \"\\n\";\n\n      if(num == 1) query(title, temp);\n      else if(num == 2) query(author, temp);\n      else if(num == 3) query(key, temp);\n      else if(num == 4) query(pub,temp);\n      else if(num ==5) query(year, temp);\n   }\n   return 0;\n}"},{"id":"1023","title":"Have Fun with Numbers","score":20,"category":"大整数运算","description":["Notice that the number 123456789 is a 9-digit number consisting exactly the numbers from 1 to 9,with no duplication. Double it we will obtain 246913578, which happens to be another 9-digit number consisting exactly the numbers from 1 to 9, only in a different permutation. Check to see the result if","we double it again!Now you are suppose to check if there are more numbers with this property. That is, double a given number with k digits, you are to tell if the resulting number consists of only a permutation of the digits in the original number."],"input":"Each input file contains one test case. Each case contains one positive integer with no more than 20 digits.","output":"For each test case, first print in a line “Yes” if doubling the input number gives a number that consists of only a permutation of the digits in the original number, or “No” if not. Then in the next line, print the doubled number.","samples":[{"input":"1234567899","output":"Yes\n2469135798","explanation":"","label":""}],"sampleInput":"1234567899","sampleOutput":"Yes\n2469135798","idea":["给出一个长度不超过20的整数,问这个整数两倍后的数位是否为原数位的一个排列。不管是yes还是no最后都要输出整数乘以2的结果分析:使用char数组存储这个数,没个数的数位乘以2 + 进位,同时设立book来标记数位出现的情况。只有最后book的每个元素都是0的时候才说明这两个数字是相等的一个排列结果~~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003cstring.h>\n\n// 解题关键：给出一个长度不超过20的整数,问这个整数两倍后的数位是否为原数位的一个排列\nusing namespace std;\nint book[10];\n\nint main() {\n   char num[22];\n   scanf(\"%s\", num);\n   int flag = 0, len = strlen(num);\n   for(int i = len - 1; i >= 0; i--) {\n      int temp = num[i] - '0';\n      book[temp]++;\n      temp = temp * 2 + flag;\n      flag = 0;\n\n      if(temp >= 10) {\n         temp = temp - 10;\n         flag = 1;\n      }\n      num[i] = (temp + '0');\n\n      book[temp]--;\n   }\n   int flag1 = 0;\n   for(int i = 0; i \u003c 10; i++) {\n      if(book[i] != 0)\n         flag1 = 1;\n   }\n   printf(\"%s\", (flag == 1 || flag1 == 1) ? \"No\\n\" : \"Yes\\n\");\n   if(flag == 1) printf(\"1\");\n   printf(\"%s\", num);\n\n   return 0;\n}"},{"id":"1024","title":"Palindromic Number","score":25,"category":"大整数相加","description":["A number that will be the same when it is written forwards or backwards is known as a Palindromic Number. For example, 1234321 is a palindromic number. All single digit numbers are palindromic numbers.Non-palindromic numbers can be paired with palindromic ones via a series of operations. First, the","non-palindromic number is reversed and the result is added to the original number. If the result is not a palindromic number, this is repeated until it gives a palindromic number. For example, if we start from 67, we can obtain a palindromic number in 2 steps: 67 + 76 = 143, and 143 + 341 = 484.","Given any positive integer N, you are supposed to find its paired palindromic number and the number of steps taken to find it."],"input":"Each input file contains one test case. Each case consists of two positive numbers N and K, where N(\u003c= 10^10) is the initial numer and K (\u003c= 100) is the maximum number of steps. The numbers are separated by a space.","output":"For each test case, output two numbers, one in each line. The first number is the paired palindromic number of N, and the second number is the number of steps taken to find the palindromic number. If the palindromic number is not found after K steps, just output the number obtained at the Kth step\n\nand K instead.","samples":[{"input":"67 3","output":"484\n2","explanation":"","label":"1"},{"input":"69 3","output":"1353\n3","explanation":"","label":"2"}],"sampleInput":"67 3","sampleOutput":"484\n2","idea":["给定一个数字,和允许翻转后相加的次数cnt,求要多少次才能变成一个回文数字,输出那个回文数字和翻转相加了多少次,如果本身就是回文数字就输出0次,如果超过给定的次数cnt了,就输出那个不是回文的结果,并且输出给定的次数cnt分析:1、会超出long int类型(会有两个点溢出错误),所以用字符串存储,大整数相加2、可以通过对字符串翻转后比较来判断是否为回文串"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给定一个数字,和允许翻转后相加的次数cnt,求要多少次才能变成一个回文数字,输出那个回文数字和翻转相加了多少次,如果本身就是回文数字就输出0次,如果超过给定的次数cnt了,就输出那个不是回文的结果,并且输出给定的次数cn\n\n#include \u003calgorithm>\nusing namespace std;\nstring s;\nvoid add(string t) {\n   int len = s.length(), carry = 0;\n   for(int i = 0; i \u003c len; i++) {\n      s[i] = s[i] + t[i] + carry - '0';\n      carry = 0;\n      if(s[i] > '9') {\n         s[i] = s[i] - 10;\n\n         carry = 1;\n      }\n   }\n   if(carry) s += '1';\n   reverse(s.begin(), s.end());\n}\nint main() {\n   int cnt, i;\n   cin >> s >> cnt;\n\n   for(i = 0; i \u003c= cnt; i++) {\n      string t = s;\n      reverse(t.begin(), t.end());\n      if(s == t || i == cnt) break;\n      add(t);\n   }\n   cout \u003c\u003c s \u003c\u003c endl \u003c\u003c i;\n   return 0;\n}"},{"id":"1025","title":"PAT Ranking","score":25,"category":"排序","description":["Programming Ability Test (PAT) is organized by the College of Computer Science and Technology of Zhejiang University. Each test is supposed to run simultaneously in several places, and the ranklists will be merged immediately after the test. Now it is your job to write a program to correctly merge all","the ranklists and generate the final rank."],"input":"Each input file contains one test case. For each case, the first line contains a positive number N(\u003c=100), the number of test locations. Then N ranklists follow, each starts with a line containing a positive integer K (\u003c=300), the number of testees, and then K lines containing the registration number\n\n(a 13-digit number) and the total score of each testee. All the numbers in a line are separated by a space.","output":"For each test case, first print in one line the total number of testees. Then print the final ranklist in the following format:registration_number final_rank location_number local_rank The locations are numbered from 1 to N. The output must be sorted in nondecreasing order of the\n\nfinal ranks. The testees with the same score must have the same rank, and the output must be sorted in nondecreasing order of their registration numbers.","samples":[{"input":"2\n5\n1234567890001 95\n1234567890005 100\n1234567890003 95\n1234567890002 77\n1234567890004 85\n4\n1234567890013 65\n1234567890011 25\n1234567890014 100\n1234567890012 85","output":"9\n1234567890005 1 1 1\n1234567890014 1 2 1\n1234567890001 3 1 2\n1234567890003 3 1 2\n1234567890004 5 1 4\n1234567890012 5 2 2\n1234567890002 7 1 5\n1234567890013 8 2 3\n1234567890011 9 2 4","explanation":"","label":""}],"sampleInput":"2\n5\n1234567890001 95\n1234567890005 100\n1234567890003 95\n1234567890002 77\n1234567890004 85\n4\n1234567890013 65\n1234567890011 25\n1234567890014 100\n1234567890012 85","sampleOutput":"9\n1234567890005 1 1 1\n1234567890014 1 2 1\n1234567890001 3 1 2\n1234567890003 3 1 2\n1234567890004 5 1 4\n1234567890012 5 2 2\n1234567890002 7 1 5\n1234567890013 8 2 3\n1234567890011 9 2 4","idea":["有n个考场,每个考场有若干数量的学生,给出每个考场中考生的编号和分数,要求算排名,输出所有考生的编号、排名、考场号、考场内排名分析:先按照考场内排名 然后赋值给总数组fin,然后总排名,最后输出。注意相同的分数情况下按照学号的从小到大排列,但是他们的排名应该是一样的数字~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003calgorithm>\n\n// 解题关键：有n个考场,每个考场有若干数量的学生,给出每个考场中考生的编号和分数,要求算排名,输出所有考生的编号、排名、考场号、考场内排名分析:先按照考场内排名 然后赋值给总数组fin,然后总排名,最后输出\n\n#include \u003cvector>\nusing namespace std;\nstruct student {\n   long long int no;\n   int score, finrank, loca, locarank;\n};\nbool cmp1(student a, student b) {\n   return a.score != b.score ? a.score > b.score : a.no \u003c b.no;\n}\n\nint main() {\n   int n, m;\n   scanf(\"%d\", &n);\n   vector\u003cstudent> fin;\n   for(int i = 1; i \u003c= n; i++) {\n      scanf(\"%d\", &m);\n      vector\u003cstudent> v(m);\n      for(int j = 0; j \u003c m; j++) {\n         scanf(\"%lld %d\", &v[j].no, &v[j].score);\n         v[j].loca = i;\n\n      }\n      sort(v.begin(), v.end(), cmp1);\n      v[0].locarank = 1;\n      fin.push_back(v[0]);\n      for(int j = 1; j \u003c m; j++) {\n\n         v[j].locarank = (v[j].score == v[j - 1].score) ? (v[j - 1].locarank) : (j + 1);\n         fin.push_back(v[j]);\n      }\n   }\n\n   sort(fin.begin(), fin.end(), cmp1);\n   fin[0].finrank = 1;\n   for(int j = 1; j \u003c fin.size(); j++)\n      fin[j].finrank = (fin[j].score == fin[j - 1].score) ? (fin[j - 1].finrank) : (j + 1);\n   printf(\"%d\\n\", fin.size());\n   for(int i = 0; i \u003c fin.size(); i++)\n      printf(\"%013lld %d %d %d\\n\", fin[i].no, fin[i].finrank, fin[i].loca, fin[i].locarank);\n   return 0;\n\n}"},{"id":"1026","title":"Table Tennis","score":30,"category":"模拟,排序","description":["A table tennis club has N tables available to the public. The tables are numbered from 1 to N. For any pair of players, if there are some tables open when they arrive, they will be assigned to the available table with the smallest number. If all the tables are occupied, they will have to wait in a queue. It is","assumed that every pair of players can play for at most 2 hours.Your job is to count for everyone in queue their waiting time, and for each table the number of players it has served for the day.One thing that makes this procedure a bit complicated is that the club reserves some tables for their","VIP members. When a VIP table is open, the first VIP pair in the queue will have the priviledge to take it. However, if there is no VIP in the queue, the next pair of players can take it. On the other hand, if when it is the turn of a VIP pair, yet no VIP table is available, they can be assigned as any","ordinary players."],"input":"Each input file contains one test case. For each case, the first line contains an integer N (\u003c=10000) – the total number of pairs of players. Then N lines follow, each contains 2 times and a VIP tag: HH:MM:SS– the arriving time, P – the playing time in minutes of a pair of players, and tag – which is 1 if they\n\nhold a VIP card, or 0 if not. It is guaranteed that the arriving time is between 08:00:00 and 21:00:00 while the club is open. It is assumed that no two customers arrives at the same time. Following the players’ info, there are 2 positive integers: K (\u003c=100) – the number of tables, and M (\u003c K) – the\n\nnumber of VIP tables. The last line contains M table numbers.","output":"For each test case, first print the arriving time, serving time and the waiting time for each pair of players in the format shown by the sample. Then print in a line the number of players served by each table. Notice that the output must be listed in chronological order of the serving time. The waiting\n\ntime must be rounded up to an integer minute(s). If one cannot get a table before the closing time,their information must NOT be printed.","samples":[{"input":"9\n20:52:00 10 0\n08:00:00 20 0\n08:02:00 30 0\n20:51:00 10 0\n08:10:00 5 0\n08:12:00 10 1\n20:50:00 10 0\n08:01:30 15 1\n20:53:00 10 1\n3 1\n2","output":"08:00:00 08:00:00 0\n08:01:30 08:01:30 0\n08:02:00 08:02:00 0\n08:12:00 08:16:30 5\n08:10:00 08:20:00 10\n20:50:00 20:50:00 0\n20:51:00 20:51:00 0\n20:52:00 20:52:00 0\n3 3 2","explanation":"","label":""}],"sampleInput":"9\n20:52:00 10 0\n08:00:00 20 0\n08:02:00 30 0\n20:51:00 10 0\n08:10:00 5 0\n08:12:00 10 1\n20:50:00 10 0\n08:01:30 15 1\n20:53:00 10 1\n3 1\n2","sampleOutput":"08:00:00 08:00:00 0\n08:01:30 08:01:30 0\n08:02:00 08:02:00 0\n08:12:00 08:16:30 5\n08:10:00 08:20:00 10\n20:50:00 20:50:00 0\n20:51:00 20:51:00 0\n20:52:00 20:52:00 0\n3 3 2","idea":["k张桌子,球员到达后总是选择编号最小的桌子。如果训练时间超过2h会被压缩成2h,如果到达时候没有球桌空闲就变成队列等待。k张桌子中m张是vip桌,如果vip桌子有空闲,而且队列里面有vip成员,那么等待队列中的第一个vip球员会到最小的vip球桌训练。如果vip桌子空闲但是没有vip来,那么就分配给普通的人。如果没有vip球桌空闲,那么vip球员就当作普通人处理。","给出每个球员的到达时间、要玩多久、是不是vip(是为1不是为0)。给出球桌数和所有vip球桌的编号,QQ所有在关门前得到训练的球员的到达时间、训练开始时间、等待时长(取整数,四舍五入),营业时间为8点到21点。如果再21点后还没有开始玩的人,就不再玩,不需要输出~","在变量t中将输入时间转化为秒的形式,使用T数组存储某个时刻到达的客户玩耍的时间,使用V数组记录某个时刻到达的客户是否是VIP,在vip数组中存储某张桌子是不是vip专属,Table记录每个桌子上的客户剩余使用时间,队列Wait,vWait记录还在排队的普通、VIP客户,now记录当前要去玩耍的客户的到达时刻,nowt记录当前要去玩耍的桌子,num数组记录每张桌子使用的人数,AnsI数组和AnsO数组分别记录客户的到达时刻和开始玩耍时刻,table与vtalbe分别记录当前可使用的最小的普通、VIP桌子。","思路:将客户到达时间的时分秒统一转换为秒,同时注意每对客户最多让玩2个小时。以秒为单位,遍历从8点到21点的每个时刻,判断当前是否有新到达的普通或VIP客户,将其加入对应的队列中。同时遍历每张桌子,将有人的桌子的客户剩余游玩时刻-1,同时判断空闲的最小编号的普通、VIP桌子编号。","当VIP排队队列有人时,判断是否有空的VIP桌子,有的话直接进行记录;如果没有,判断是否有空缺的普通桌子,并是否存在更早到的普通客户;没有的话,就记录当前VIP客户使用了普通桌子。同理,判断普通客户的桌子使用情况。在输出时,将秒转化为时、分、秒的格式即可~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：k张桌子,球员到达后总是选择编号最小的桌子\n\n#include \u003cqueue>\n#include \u003cmap>\nusing namespace std;\nint n, m, k, H, M, S, t, table, vtable, cnt, now, nowt, T[100000], V[100000], num[10001], AnsI[10001], AnsO[10001], vip[10001];\nmap\u003cint, int> Table;\nqueue\u003cint> Wait, vWait;\nint main() {\n   scanf(\"%d\", &n);\n\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d:%d:%d\", &H, &M, &S);\n      t = H * 3600 + M * 60 + S;\n      scanf(\"%d %d\", &T[t], &V[t]);\n      T[t] = min(T[t], 120) * 60;\n   }\n   scanf(\"%d %d\", &m, &k);\n   for (int i = 0; i \u003c k; i++) {\n      scanf(\"%d\", &t);\n      vip[t] = 1;\n\n   }\n   for (int Time = 28800; Time \u003c 75600; Time++, table = vtable = now = 0) {\n      if (T[Time] && V[Time]) vWait.push(Time);\n      else if (T[Time]) Wait.push(Time);\n      for (int i = 1; i \u003c= m; i++) {\n         if (Table[i] > 0) Table[i]--;\n         if (Table[i] == 0 && vip[i] && vtable == 0) vtable = i;\n         if (Table [i] == 0 && table == 0) table = i;\n      }\n\n      if (!vWait.empty() && (table || vtable)) {\n         now = vWait.front();\n         nowt = vtable;\n\n         if (vtable != 0) vWait.pop();\n         else {\n             nowt = table;\n             if (!Wait.empty() && Wait.front() \u003c vWait.front()) {\n                now = Wait.front();\n\n                Wait.pop();\n             } else vWait.pop();\n         }\n      } else if (!Wait.empty() && (table || vtable)) {\n         if (table != 0) nowt = table;\n         else nowt = vtable;\n         now = Wait.front();\n         Wait.pop();\n      }\n      if (now == 0) continue;\n\n      Table[nowt] = T[now];\n      AnsI[cnt] = now;\n      AnsO[cnt++] = Time;\n      num[nowt]++;\n   }\n   for (int i = 0; i \u003c cnt; i++)\n      printf(\"%02d:%02d:%02d %02d:%02d:%02d %d\\n\", AnsI[i] / 3600, AnsI[i]\n% 3600 / 60, AnsI[i] % 60, AnsO[i] / 3600, AnsO[i] % 3600 / 60, AnsO[i] % 60, (AnsO[i] - AnsI[i] + 30) / 60);\n\n   for (int i = 1; i \u003c= m; i++) {\n      if (i != 1) printf(\" \");\n      printf(\"%d\", num[i]);\n   }\n   return 0;\n}"},{"id":"1027","title":"Colors in Mars","score":20,"category":"进制转换","description":["People in Mars represent the colors in their computers in a similar way as the Earth people. That is, a color is represented by a 6-digit number, where the first 2 digits are for Red, the middle 2 digits for Green, and the last 2 digits for Blue. The only difference is that they use radix 13 (0-9 and A-C) instead","of 16. Now given a color in three decimal numbers (each between 0 and 168), you are supposed to output their Mars RGB values."],"input":"Each input file contains one test case which occupies a line containing the three decimal color values.","output":"For each test case you should output the Mars RGB value in the following format: first output “#,then followed by a 6-digit number where all the English characters must be upper-cased. If a single color is only 1-digit long, you must print a “0” to the left.","samples":[{"input":"15 43 71","output":"#123456","explanation":"","label":""}],"sampleInput":"15 43 71","sampleOutput":"#123456","idea":["给三个十进制的数,把它们转换为十三进制的数输出。要求在前面加上一个”#”号分析:因为0~168的十进制转换为13进制不会超过两位数,所以这个两位数为(num / 13)(num % 13)构成的数字"],"keyPoints":["进制转换时特别处理结果为 0 的情况，并留意高位与低位的输出顺序。","多进制混合运算应逐位处理进位，不要直接套用十进制规则。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：给三个十进制的数,把它们转换为十三进制的数输出\n\nusing namespace std;\nint main() {\n   char c[14] = {\"0123456789ABC\"};\n   printf(\"#\");\n   for(int i = 0; i \u003c 3; i++) {\n      int num;\n      scanf(\"%d\", &num);\n      printf(\"%c%c\", c[num/13], c[num%13]);\n   }\n   return 0;\n\n}"},{"id":"1028","title":"List Sorting","score":25,"category":"排序","description":["Excel can sort records according to any column. Now you are supposed to imitate this function."],"input":"Each input file contains one test case. For each case, the first line contains two integers N (\u003c=100000)and C, where N is the number of records and C is the column that you are supposed to sort the records with. Then N lines follow, each contains a record of a student. A student’s record consists of\n\nhis or her distinct ID (a 6-digit number), name (a string with no more than 8 characters without space), and grade (an integer between 0 and 100, inclusive).","output":"For each test case, output the sorting result in N lines. That is, if C = 1 then the records must be sorted in increasing order according to ID’s; if C = 2 then the records must be sorted in non-decreasing order according to names; and if C = 3 then the records must be sorted in non-decreasing order according to\n\ngrades. If there are several students who have the same name or grade, they must be sorted according to their ID’s in increasing order.","samples":[{"input":"3 1\n000007 James 85\n000010 Amy 90\n000001 Zoe 60","output":"000001 Zoe 60\n000007 James 85\n000010 Amy 90","explanation":"","label":"1"},{"input":"4 2\n000007 James 85\n000010 Amy 90\n000001 Zoe 60\n000002 James 98","output":"000010 Amy 90\n000002 James 98\n000007 James 85\n000001 Zoe 60","explanation":"","label":"2"},{"input":"4 3\n000007 James 85\n000010 Amy 90\n000001 Zoe 60\n000002 James 90","output":"000001 Zoe 60\n000007 James 85\n000002 James 90\n000010 Amy 90","explanation":"","label":"3"}],"sampleInput":"3 1\n000007 James 85\n000010 Amy 90\n000001 Zoe 60","sampleOutput":"000001 Zoe 60\n000007 James 85\n000010 Amy 90","idea":["根据c的值是1还是2还是3,对相应的列排序。第一列升序,第二列不降序,第三列不降序分析:注意,按照名称的不降序排序,因为strcmp比较的是ACSII码,所以A \u003c Z。写cmp函数的时候return strcmp(a.name, b.name) \u003c= 0; return语句返回的是true或者false的值,所以要写 \u003c= 0 这样的形式。","比较ACSII码的大小,strcmp(‘a’, ‘z’)返回负值,因为a\u003cz a – z \u003c 0按照分数的不降序排序,a.score \u003c= b.score"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003cstring.h>\n\n// 解题关键：根据c的值是1还是2还是3,对相应的列排序\nusing namespace std;\nconst int maxn = 100001;\nstruct NODE {\n   int no, score;\n   char name[10];\n\n}node[maxn];\nint c;\nint cmp1(NODE a, NODE b) {\n   if(c == 1) {\n      return a.no \u003c b.no;\n   } else if(c == 2) {\n      if(strcmp(a.name, b.name) == 0) return a.no \u003c b.no;\n      return strcmp(a.name, b.name) \u003c= 0;\n   } else {\n      if(a.score == b.score) return a.no \u003c b.no;\n\n      return a.score \u003c= b.score;\n   }\n}\nint main() {\n   int n;\n   scanf(\"%d%d\", &n, &c);\n   for(int i = 0; i \u003c n; i++)\n      scanf(\"%d %s %d\", &node[i].no, node[i].name, &node[i].score);\n   sort(node, node + n, cmp1);\n\n   for(int i = 0; i \u003c n; i++)\n      printf(\"%06d %s %d\\n\", node[i].no, node[i].name, node[i].score);\n   return 0;\n}"},{"id":"1029","title":"Median","score":25,"category":"two pointers","description":["Given an increasing sequence S of N integers, the median is the number at the middle position. For example, the median of S1={11, 12, 13, 14} is 12, and the median of S2={9, 10, 15, 16, 17} is 15. The median of two sequences is defined to be the median of the nondecreasing sequence which contains","all the elements of both sequences. For example, the median of S1 and S2 is 13.Given two increasing sequences of integers, you are asked to find their median."],"input":"Each input file contains one test case. Each case occupies 2 lines, each gives the information of a sequence. For each sequence, the first positive integer N (\u003c=1000000) is the size of that sequence. Then N integers follow, separated by a space. It is guaranteed that all the integers are in the range of long\n\nint.","output":"For each test case you should output the median of the two given sequences in a line.","samples":[{"input":"4 11 12 13 14\n5 9 10 15 16 17","output":"13","explanation":"","label":""}],"sampleInput":"4 11 12 13 14\n5 9 10 15 16 17","sampleOutput":"13","idea":["给出两个已排序序列,求这两个序列合并后的中间数分析:既然两个数组都是递增的顺序,可以借助归并的思想~与归并排序不同的是,在第一个while里如果找到了中位数,就直接跳出来~如果其中一个数组已经走到头也没有找到中位数,可以用数学公式直接推导出中位数在另一个数组中的位置~PS:感谢@琦子块提供的更优解~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出两个已排序序列,求这两个序列合并后的中间数分析:既然两个数组都是递增的顺序,可以借助归并的思想\nconst int maxn = 200005;\nint n, m, a1[maxn], a2[maxn], cnt = 0, i, j, ans;\nint main() {\n   scanf(\"%d\", &n);\n   for(i = 1; i \u003c= n; i++) scanf(\"%d\", &a1[i]);\n   scanf(\"%d\", &m);\n\n   for(i = 1; i \u003c= m; i++) scanf(\"%d\", &a2[i]);\n   int target = (n + m + 1) / 2;\n   i = 1, j = 1;\n   while(i \u003c= n && j \u003c= m) {\n      ans = a1[i] \u003c= a2[j] ? a1[i++] : a2[j++];\n      if(++cnt == target) break;\n   }\n   if(i \u003c= n && cnt \u003c target)\n      ans = a1[i + target - cnt - 1];\n   else if(j \u003c= m && cnt \u003c target)\n\n      ans = a2[j + target - cnt - 1];\n   printf(\"%d\", ans);\n   return 0;\n}"},{"id":"1030","title":"Travel Plan","score":30,"category":"Dijkstra算法 + DFS,最短路径,边权","description":["A traveler’s map gives the distances between cities along the highways, together with the cost of each highway. Now you are supposed to write a program to help a traveler to decide the shortest path between his/her starting city and the destination. If such a shortest path is not unique, you are","supposed to output the one with the minimum cost, which is guaranteed to be unique."],"input":"Each input file contains one test case. Each case starts with a line containing 4 positive integers N, M,S, and D, where N (\u003c=500) is the number of cities (and hence the cities are numbered from 0 to N-1);M is the number of highways; S and D are the starting and the destination cities, respectively. Then M\n\nlines follow, each provides the information of a highway, in the format:City1 City2 Distance Cost where the numbers are all integers no more than 500, and are separated by a space.","output":"For each test case, print in one line the cities along the shortest path from the starting point to the destination, followed by the total distance and the total cost of the path. The numbers must be separated by a space and there must be no extra space at the end of output.","samples":[{"input":"4 5 0 3\n0 1 1 20\n1 3 2 30\n0 3 4 10\n0 2 2 20\n2 3 1 20","output":"0 2 3 3 40","explanation":"","label":""}],"sampleInput":"4 5 0 3\n0 1 1 20\n1 3 2 30\n0 3 4 10\n0 2 2 20\n2 3 1 20","sampleOutput":"0 2 3 3 40","idea":["求起点到终点的最短路径最短距离和花费,要求首先路径最短,其次花费最少,要输出完整路径分析:Dijksta + DFS。Dijkstra记录路径pre数组,然后用dfs求最短的一条mincost以及它的路径path,最后输出path数组和mincost注意路径path因为是从末端一直压入push_back到path里面的,所以要输出路径的时候倒着输出"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：求起点到终点的最短路径最短距离和花费,要求首先路径最短,其次花费最少,要输出完整路径分析:Dijksta + DFS\n\n#include \u003calgorithm>\n#include \u003cvector>\nusing namespace std;\nint n, m, s, d;\nint e[510][510], dis[510], cost[510][510];\n\nvector\u003cint> pre[510];\nbool visited[510];\nconst int inf = 99999999;\nvector\u003cint> path, temppath;\nint mincost = inf;\nvoid dfs(int v) {\n   temppath.push_back(v);\n   if(v == s) {\n      int tempcost = 0;\n      for(int i = temppath.size() - 1; i > 0; i--) {\n\n         int id = temppath[i], nextid = temppath[i-1];\n         tempcost += cost[id][nextid];\n      }\n      if(tempcost \u003c mincost) {\n         mincost = tempcost;\n         path = temppath;\n      }\n      temppath.pop_back();\n      return ;\n\n   }\n   for(int i = 0; i \u003c pre[v].size(); i++)\n      dfs(pre[v][i]);\n   temppath.pop_back();\n}\nint main() {\n   fill(e[0], e[0] + 510 * 510, inf);\n   fill(dis, dis + 510, inf);\n   scanf(\"%d%d%d%d\", &n, &m, &s, &d);\n   for(int i = 0; i \u003c m; i++) {\n\n      int a, b;\n      scanf(\"%d%d\", &a, &b);\n      scanf(\"%d\", &e[a][b]);\n      e[b][a] = e[a][b];\n      scanf(\"%d\", &cost[a][b]);\n      cost[b][a] = cost[a][b];\n   }\n   pre[s].push_back(s);\n   dis[s] = 0;\n\n   for(int i = 0; i \u003c n; i++) {\n      int u = -1, minn = inf;\n      for(int j = 0; j \u003c n; j++) {\n         if(visited[j] == false && dis[j] \u003c minn) {\n             u = j;\n             minn = dis[j];\n\n         }\n      }\n      if(u == -1) break;\n      visited[u] = true;\n      for(int v = 0; v \u003c n; v++) {\n\n         if(visited[v] == false && e[u][v] != inf) {\n             if(dis[v] > dis[u] + e[u][v]) {\n                dis[v] = dis[u] + e[u][v];\n                pre[v].clear();\n                pre[v].push_back(u);\n             } else if(dis[v] == dis[u] + e[u][v]) {\n                pre[v].push_back(u);\n             }\n         }\n      }\n\n   }\n   dfs(d);\n   for(int i = path.size() - 1; i >= 0; i--)\n      printf(\"%d \", path[i]);\n   printf(\"%d %d\", dis[d], mincost);\n   return 0;\n}"},{"id":"1031","title":"Hello World for U","score":20,"category":"图形打印","description":["Given any string of N (>=5) characters, you are asked to form the characters into the shape of U. For example, “helloworld” can be printed as:h d e l l r lowo That is, the characters must be printed in the original order, starting top-down from the left vertical","line with n1 characters, then left to right along the bottom line with n2 characters, and finally bottom-up along the vertical line with n3 characters. And more, we would like U to be as squared as possible— that is, it must be satisfied that n1 = n3 = max { k| k \u003c= n2 for all 3 \u003c= n2 \u003c= N } with n1 + n2 + n3","– 2 = N."],"input":"Each input file contains one test case. Each case contains one string with no less than 5 and no more than 80 characters in a line. The string contains no white space.","output":"For each test case, print the input string in the shape of U as specified in the description.","samples":[{"input":"helloworld!","output":"h  !\ne  d\nl  l\nlowor","explanation":"","label":""}],"sampleInput":"helloworld!","sampleOutput":"h  !\ne  d\nl  l\nlowor","idea":["用所给字符串按U型输出。n1和n3是左右两条竖线从上到下的字符个数,n2是底部横线从左到右的字符个数。","要求:1. n1 == n3 2. n2 >= n1 3. n1为在满足上述条件的情况下的最大值分析:假设n = 字符串长度 + 2,因为2 * n1 + n2 = n,且要保证n2 >= n1, n1尽可能地大,分类讨论:1. 如果n % 3 == 0,n正好被3整除,直接n1 == n2 == n3;2. 如果n % 3 == 1,因为n2要比n1大,所以把多出来的那1个给n2 3. 如果n % 3 == 2, 就把多出来的那2个给n2所以得到公式:n1 = n / 3,n2 = n / 3 + n % 3把它们存储到二维字符数组中,一开始初始化字符数组为空格,然后按照u型填充进去,最后输出这个 数组u~","~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstring.h>\n\n// 解题关键：用所给字符串按U型输出\nusing namespace std;\nint main() {\n   char c[81], u[30][30];\n   memset(u, ' ', sizeof(u));\n   scanf(\"%s\", c);\n   int n = strlen(c) + 2;\n   int n1 = n / 3, n2 = n / 3 + n % 3, index = 0;\n   for(int i = 0; i \u003c n1; i++) u[i][0] = c[index++];\n\n   for(int i = 1; i \u003c= n2 - 2; i++) u[n1-1][i] = c[index++];\n   for(int i = n1 - 1; i >= 0; i--) u[i][n2-1] = c[index++];\n   for(int i = 0; i \u003c n1; i++) {\n      for(int j = 0; j \u003c n2; j++)\n         printf(\"%c\", u[i][j]);\n      printf(\"\\n\");\n\n   }\n   return 0;\n}"},{"id":"1032","title":"Sharing","score":25,"category":"链表","description":["To store English words, one method is to use linked lists and store a word letter by letter. To save some space, we may let the words share the same sublist if they share the same suffix. For example,“loading” and “being” are stored as showed in Figure 1.Figure 1","You are supposed to find the starting position of the common suffix (e.g. the position of “i” in Figure 1)."],"input":"Each input file contains one test case. For each case, the first line contains two addresses of nodes and a positive N (\u003c= 105), where the two addresses are the addresses of the first nodes of the two words,and N is the total number of nodes. The address of a node is a 5-digit positive integer, and NULL is\n\nrepresented by -1.Then N lines follow, each describes a node in the format:Address Data Next where Address is the position of the node, Data is the letter contained by this node which is an English letter chosen from {a-z, A-Z}, and Next is the position of the next node.","output":"For each case, simply output the 5-digit starting position of the common suffix. If the two words have no common suffix, output “-1” instead.","samples":[{"input":"11111 22222 9\n67890 i 00002\n00010 a 12345\n00003 g -1\n12345 D 67890\n00002 n 00003\n22222 B 23456\n11111 L 00001\n23456 e 67890\n00001 o 00010","output":"67890","explanation":"","label":"1"},{"input":"00001 00002 4\n00001 a 10001\n10001 s -1\n00002 a 10002\n10002 t -1","output":"-1","explanation":"","label":"2"}],"sampleInput":"11111 22222 9\n67890 i 00002\n00010 a 12345\n00003 g -1\n12345 D 67890\n00002 n 00003\n22222 B 23456\n11111 L 00001\n23456 e 67890\n00001 o 00010","sampleOutput":"67890","idea":["求两个链表的首个共同结点的地址。如果没有,就输出-1分析:用结构体数组存储,node[i]表示地址为i的结点,key表示值,next为下一个结点的地址,flag表示第一条链表有没有该结点遍历第一条链表,将访问过的结点的flag都标记为true,当遍历第二条结点的时候,如果遇到了true的结点就输出并结束程序,没有遇到就输出-1"],"keyPoints":["先按地址建立结点映射，再沿 next 指针恢复有效链表顺序。","输出地址时通常需要补足 5 位，空地址按题目要求输出。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：求两个链表的首个共同结点的地址\nusing namespace std;\nstruct NODE {\n   char key;\n\n   int next;\n   bool flag;\n}node[100000];\nint main() {\n   int s1, s2, n, a, b;\n   scanf(\"%d%d%d\", &s1, &s2, &n);\n   char data;\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d %c %d\", &a, &data, &b);\n\n      node[a] = {data, b, false};\n   }\n   for(int i = s1; i != -1; i = node[i].next)\n      node[i].flag = true;\n   for(int i = s2; i != -1; i = node[i].next) {\n\n      if(node[i].flag == true) {\n         printf(\"%05d\", i);\n         return 0;\n      }\n   }\n   printf(\"-1\");\n   return 0;\n}"},{"id":"1033","title":"To Fill or Not to Fill","score":25,"category":"贪心算法","description":["With highways available, driving a car from Hangzhou to any other city is easy. But since the tank capacity of a car is limited, we have to find gas stations on the way from time to time. Different gas station may give different price. You are asked to carefully design the cheapest route to go."],"input":"Each input file contains one test case. For each case, the first line contains 4 positive numbers: Cmax(\u003c= 100), the maximum capacity of the tank; D (\u003c=30000), the distance between Hangzhou and the destination city; Davg (\u003c=20), the average distance per unit gas that the car can run; and N (\u003c= 500),\n\nthe total number of gas stations. Then N lines follow, each contains a pair of non-negative numbers:Pi, the unit gas price, and Di (\u003c=D), the distance between this station and Hangzhou, for i=1,...N. All the numbers in a line are separated by a space.","output":"For each test case, print the cheapest price in a line, accurate up to 2 decimal places. It is assumed that the tank is empty at the beginning. If it is impossible to reach the destination, print “The maximum travel distance = X” where X is the maximum possible distance the car can run, accurate up to 2\n\ndecimal places.","samples":[{"input":"50 1300 12 8\n6.00 1250\n7.00 600\n7.00 150\n7.10 0\n7.20 200\n7.50 400\n7.30 1000\n6.85 300","output":"749.17","explanation":"","label":"1"},{"input":"50 1300 12 2\n7.10 0\n7.00 600","output":"The maximum travel distance = 1200.00","explanation":"","label":"2"}],"sampleInput":"50 1300 12 8\n6.00 1250\n7.00 600\n7.00 150\n7.10 0\n7.20 200\n7.50 400\n7.30 1000\n6.85 300","sampleOutput":"749.17","idea":["汽车从杭州出发可以通过高速公路去任何城市,但是油箱的容量是有限的,路上有很多加油站,每个加油站的价格不同,为汽车设计一个从杭州到终点的最便宜的路线,Cmax表示油箱最大容量,D表示杭州到目的地的距离,Davg表示平均每单位的汽油可以让汽车行驶的距离,N表示汽车的站点数量,每个站点都会给出它的单位油价Pi和汽车站点和杭州的距离Di,求汽车从杭州到终点的最小花费,如果不能够到达,就输出汽车能够行驶的最大距离分析:贪心算法。","0.假设增加一个目的地处的加油站,距离为目的地的距离,价格为0,考虑从0距离开始能否到达最后一个加油站的问题1.因为先开始没有油,所以如果所有的加油站距离都没有等于0的,那么说明车哪也去不了,直接输出并return 2.将加油站按照距离dis从小到大排序3.先去第一个加油站,设置变量nowdis表示当前所在的距离,maxdis是能够到达的最大距离,nowprice是当前的站点的价格,totalPrice是总的价格。","贪心思想:0.寻找比自己距离远的,到能够到达的最大距离之间的加油站,看他们的油价。如果找到了更低价格的油价,就加油到刚好能到达那个加油站的距离的油,然后去那个更低价格的加油站(有更低的我一分都不想多花在别的距离上,只加到刚好满足更低价格的加油站的距离就行,那样以后的路程我就可以以更低的价格行驶啦)1.如果找不到更低的,就找尽可能低的油价的加油站,在当前加油站加满油之后过去。","因为想要让路程上使用的尽可能是低价的油,既然没有比当前更低价格的了,就让油箱加到最大值,这样能保证利益最大化,保证最大的距离使用的是便宜的油。"],"keyPoints":["先明确局部选择为什么不会破坏后续最优解，再按对应关键字排序。","涉及小数收益或比例时使用 double，并避免过早取整。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003cvector>\n\n// 解题关键：汽车从杭州出发可以通过高速公路去任何城市,但是油箱的容量是有限的,路上有很多加油站,每个加油站的价格不同,为汽车设计一个从杭州到终点的最便宜的路线,Cmax表示油箱最大容量,D表示杭州到目的地的距离,Davg表示平均每单\n\nusing namespace std;\nconst int inf = 99999999;\nstruct station {\n   double price, dis;\n};\n\nbool cmp1(station a, station b) {\n   return a.dis \u003c b.dis;\n}\nint main() {\n   double cmax, d, davg;\n   int n;\n   scanf(\"%lf%lf%lf%d\", &cmax, &d, &davg, &n);\n   vector\u003cstation> sta(n + 1);\n   sta[0] = {0.0, d};\n   for(int i = 1; i \u003c= n; i++)\n\n      scanf(\"%lf%lf\", &sta[i].price, &sta[i].dis);\n   sort(sta.begin(), sta.end(), cmp1);\n   double nowdis = 0.0, maxdis = 0.0, nowprice = 0.0, totalPrice = 0.0, leftdis = 0.0;\n   if(sta[0].dis != 0) {\n      printf(\"The maximum travel distance = 0.00\");\n      return 0;\n   } else {\n      nowprice = sta[0].price;\n\n   }\n   while(nowdis \u003c d) {\n      maxdis = nowdis + cmax * davg;\n      double minPriceDis = 0, minPrice = inf;\n      int flag = 0;\n      for(int i = 1; i \u003c= n && sta[i].dis \u003c= maxdis; i++) {\n         if(sta[i].dis \u003c= nowdis) continue;\n         if(sta[i].price \u003c nowprice) {\n             totalPrice += (sta[i].dis - nowdis - leftdis) * nowprice / davg;\n\n             leftdis = 0.0;\n             nowprice = sta[i].price;\n             nowdis = sta[i].dis;\n             flag = 1;\n             break;\n         }\n         if(sta[i].price \u003c minPrice) {\n             minPrice = sta[i].price;\n             minPriceDis = sta[i].dis;\n\n         }\n      }\n      if(flag == 0 && minPrice != inf) {\n         totalPrice += (nowprice * (cmax - leftdis / davg));\n         leftdis = cmax * davg - (minPriceDis - nowdis);\n         nowprice = minPrice;\n\n         nowdis = minPriceDis;\n      }\n      if(flag == 0 && minPrice == inf) {\n         nowdis += cmax * davg;\n         printf(\"The maximum travel distance = %.2f\", nowdis);\n\n         return 0;\n      }\n   }\n   printf(\"%.2f\", totalPrice);\n   return 0;\n}"},{"id":"1034","title":"Head of a Gang","score":30,"category":"图的遍历,DFS","description":["One way that the police finds the head of a gang is to check people’s phone calls. If there is a phone call between A and B, we say that A and B is related. The weight of a relation is defined to be the total time length of all the phone calls made between the two persons. A “Gang” is a cluster of more than 2","persons who are related to each other with total relation weight being greater than a given threshold K. In each gang, the one with maximum total weight is the head. Now given a list of phone calls, you are supposed to find the gangs and the heads."],"input":"Each input file contains one test case. For each case, the first line contains two positive numbers N and K (both less than or equal to 1000), the number of phone calls and the weight threthold,respectively. Then N lines follow, each in the following format:Name1 Name2 Time\n\nwhere Name1 and Name2 are the names of people at the two ends of the call, and Time is the length of the call. A name is a string of three capital letters chosen from A-Z. A time length is a positive integer which is no more than 1000 minutes.","output":"For each test case, first print in a line the total number of gangs. Then for each gang, print in a line the name of the head and the total number of the members. It is guaranteed that the head is unique for each gang. The output must be sorted according to the alphabetical order of the names of the heads.","samples":[{"input":"8 59\nAAA BBB 10\nBBB AAA 20\nAAA CCC 40\nDDD EEE 5\nEEE DDD 70\nFFF GGG 30\nGGG HHH 20\nHHH FFF 10","output":"2\nAAA 3\nGGG 3","explanation":"","label":"1"},{"input":"8 70\nAAA BBB 10\nBBB AAA 20\nAAA CCC 40\nDDD EEE 5\nEEE DDD 70\nFFF GGG 30\nGGG HHH 20\nHHH FFF 10","output":"0","explanation":"","label":"2"}],"sampleInput":"8 59\nAAA BBB 10\nBBB AAA 20\nAAA CCC 40\nDDD EEE 5\nEEE DDD 70\nFFF GGG 30\nGGG HHH 20\nHHH FFF 10","sampleOutput":"2\nAAA 3\nGGG 3","idea":["给出1000条以内的通话记录A B和权值w,和阈值k,如果一个团伙人数超过2人并且通话总权值超过k,令团伙里面的自身权值的最大值为头目,输出所有满足条件的团伙的头目,和他们团伙里面的人数分析:总的来说是一个判断一个图的连通分量的个数,用图的遍历解决,深度优先遍历。","1.因为给的是字母,要用两个map把它们转换成数字,从1开始排列命名所有不同的人的id,存储在两个map里面,一个字符串对应id,一个id对应字符串,方便查找,正好顺便统计了总共的人数idNumber。2.建立两个数组,weight和G,分别存储每条边的权值和每个结点的权值,因为这两个题目中都要求得后判断。","3.用传递引用的方法深度优先dfs,这样传入的参数在dfs后还能保存想要求得的值4.遍历过一条边之后就把这条边的权值设为0(G[u][v] = G[v][u] = 0;)防止出现回路遍历死循环"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出1000条以内的通话记录A B和权值w,和阈值k,如果一个团伙人数超过2人并且通话总权值超过k,令团伙里面的自身权值的最大值为头目,输出所有满足条件的团伙的头目,和他们团伙里面的人数分析:总的来说是一个判断一个图的连\n\n#include \u003cmap>\nusing namespace std;\nmap\u003cstring, int> stringToInt;\nmap\u003cint, string> intToString;\nmap\u003cstring, int> ans;\nint idNumber = 1, k;\nint stoifunc(string s) {\n   if(stringToInt[s] == 0) {\n      stringToInt[s] = idNumber;\n      intToString[idNumber] = s;\n\n      return idNumber++;\n   } else {\n      return stringToInt[s];\n   }\n}\nint G[2010][2010], weight[2010];\nbool vis[2010];\nvoid dfs(int u, int &head, int &numMember, int &totalweight) {\n   vis[u] = true;\n\n   numMember++;\n   if(weight[u] > weight[head])\n      head = u;\n   for(int v = 1; v \u003c idNumber; v++) {\n      if(G[u][v] > 0) {\n         totalweight += G[u][v];\n         G[u][v] = G[v][u] = 0;\n         if(vis[v] == false)\n             dfs(v, head, numMember, totalweight);\n      }\n\n   }\n}\nvoid dfsTrave() {\n   for(int i = 1; i \u003c idNumber; i++) {\n      if(vis[i] == false) {\n         int head = i, numMember = 0, totalweight = 0;\n         dfs(i, head, numMember, totalweight);\n         if(numMember > 2 && totalweight > k)\n             ans[intToString[head]] = numMember;\n\n      }\n   }\n}\nint main() {\n   int n, w;\n   cin >> n >> k;\n   string s1, s2;\n   for(int i = 0; i \u003c n; i++) {\n\n      cin >> s1 >> s2 >> w;\n      int id1 = stoifunc(s1);\n      int id2 = stoifunc(s2);\n      weight[id1] += w;\n      weight[id2] += w;\n\n      G[id1][id2] += w;\n      G[id2][id1] += w;\n   }\n   dfsTrave();\n   cout \u003c\u003c ans.size() \u003c\u003c endl;\n   for(auto it = ans.begin(); it != ans.end(); it++)\n      cout \u003c\u003c it->first \u003c\u003c \" \" \u003c\u003c it->second \u003c\u003c endl;\n   return 0;\n}"},{"id":"1035","title":"Password","score":20,"category":"字符串处理","description":["To prepare for PAT, the judge sometimes has to generate random passwords for the users. The problem is that there are always some confusing passwords since it is hard to distinguish 1 (one) from l (L in lowercase), or 0 (zero) from O (o in uppercase). One solution is to replace 1 (one) by @, 0 (zero)","by %, l by L, and O by o. Now it is your job to write a program to check the accounts generated by the judge, and to help the juge modify the confusing passwords."],"input":"Each input file contains one test case. Each case contains a positive integer N (\u003c= 1000), followed by N lines of accounts. Each account consists of a user name and a password, both are strings of no more than 10 characters with no space.","output":"For each test case, first print the number M of accounts that have been modified, then print in the following M lines the modified accounts info, that is, the user names and the corresponding modified passwords. The accounts must be printed in the same order as they are read in. If no account is\n\nmodified, print in one line “There are N accounts and no account is modified” where N is the total number of accounts. However, if N is one, you must print “There is 1 account and no account is modified” instead.","samples":[{"input":"3\nTeam000002 Rlsp0dfa\nTeam000003 perfectpwd\nTeam000001 R1spOdfa","output":"2\nTeam000002 RLsp%dfa\nTeam000001 R@spodfa","explanation":"","label":"1"},{"input":"1\nteam110 abcdefg332","output":"There is 1 account and no account is modified","explanation":"","label":"2"},{"input":"2\nteam110 abcdefg222\nteam220 abcdefg333","output":"There are 2 accounts and no account is modified","explanation":"","label":"3"}],"sampleInput":"3\nTeam000002 Rlsp0dfa\nTeam000003 perfectpwd\nTeam000001 R1spOdfa","sampleOutput":"2\nTeam000002 RLsp%dfa\nTeam000001 R@spodfa","idea":["给定n个用户的姓名和密码,把密码中的1改为@,0改为%,l改为L,O改为o如果不存在需要修改的密码,则输出There are n accounts and no account is modified。","注意单复数,如果只有一个账户,就输出There is 1 account and no account is modified分析:把需要改变的字符串改变后存储在字符串数组vector里面,根据数组里面元素的个数是否为0输出相应的结果"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给定n个用户的姓名和密码,把密码中的1改为@,0改为%,l改为L,O改为o如果不存在需要修改的密码,则输出There are n accounts and no account is modified\nusing namespace std;\n\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   vector\u003cstring> v;\n   for(int i = 0; i \u003c n; i++) {\n      string name, s;\n      cin >> name >> s;\n      int len = s.length(), flag = 0;\n      for(int j = 0; j \u003c len; j++) {\n         switch(s[j]) {\n\n             case '1' : s[j] = '@'; flag = 1; break;\n             case '0' : s[j] = '%'; flag = 1; break;\n             case 'l' : s[j] = 'L'; flag = 1; break;\n             case 'O' : s[j] = 'o'; flag = 1; break;\n         }\n      }\n\n      if(flag) {\n         string temp = name + \" \" + s;\n         v.push_back(temp);\n      }\n   }\n\n   int cnt = v.size();\n   if(cnt != 0) {\n      printf(\"%d\\n\", cnt);\n      for(int i = 0; i \u003c cnt; i++)\n         cout \u003c\u003c v[i] \u003c\u003c endl;\n   } else if(n == 1) {\n      printf(\"There is 1 account and no account is modified\");\n   } else {\n      printf(\"There are %d accounts and no account is modified\", n);\n   }\n\n   return 0;\n}"},{"id":"1036","title":"Boys vs Girls","score":25,"category":"查找元素","description":["This time you are asked to tell the difference between the lowest grade of all the male students and the highest grade of all the female students."],"input":"Each input file contains one test case. Each case contains a positive integer N, followed by N lines of student information. Each line contains a student’s name, gender, ID and grade, separated by a space,where name and ID are strings of no more than 10 characters with no space, gender is either F\n\n(female) or M (male), and grade is an integer between 0 and 100. It is guaranteed that all the grades are distinct.","output":"For each test case, output in 3 lines. The first line gives the name and ID of the female student with the highest grade, and the second line gives that of the male student with the lowest grade. The third line gives the difference gradeF-gradeM. If one such kind of student is missing, output “Absent” in\n\nthe corresponding line, and output “NA” in the third line instead.","samples":[{"input":"3\nJoe M Math990112 89\nMike M CS991301 100\nMary F EE990830 95","output":"Mary EE990830\nJoe Math990112\n6","explanation":"","label":"1"},{"input":"1\nJean M AA980920 60","output":"Absent\nJean AA980920\nNA","explanation":"","label":"2"}],"sampleInput":"3\nJoe M Math990112 89\nMike M CS991301 100\nMary F EE990830 95","sampleOutput":"Mary EE990830\nJoe Math990112\n6","idea":["给出N个同学的信息,输出女生中的最高分获得者的信息与男生中最低分获得者的信息,并输出他们的分数差。如果不存在女生或者男生,则对应获得者信息处输出Absent,而且差值处输出NA~用string类型的female和male保存要求的学生的信息,femalescore和malescore处保存男生的最低分和女生的最高分~","一开始设femalescore为最低值-1,malescore为最高值101,最后根据分值是否为-1或者101来判断是否有相应的女生或者男生~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出N个同学的信息,输出女生中的最高分获得者的信息与男生中最低分获得者的信息,并输出他们的分数差\nusing namespace std;\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   string female, male;\n   int femalescore = -1, malescore = 101;\n   for(int i = 0; i \u003c n; i++) {\n\n      string name, sex, num;\n      int score;\n      cin >> name >> sex >> num;\n      scanf(\"%d\", &score);\n      if(sex == \"F\") {\n         if(femalescore \u003c score) {\n             femalescore = score;\n             female = name + \" \" + num;\n         }\n      } else if(malescore > score) {\n\n             malescore = score;\n             male = name + \" \" + num;\n         }\n   }\n   if(femalescore != -1)\n      cout \u003c\u003c female \u003c\u003c endl;\n\n   else\n      printf(\"Absent\\n\");\n   if(malescore != 101)\n      cout \u003c\u003c male \u003c\u003c endl;\n   else\n\n      printf(\"Absent\\n\");\n   if(femalescore != -1 && malescore != 101)\n      printf(\"%d\", femalescore - malescore);\n   else\n      printf(\"NA\");\n   return 0;\n}"},{"id":"1037","title":"Magic Coupon","score":25,"category":"贪心算法","description":["The magic shop in Mars is offering some magic coupons. Each coupon has an integer N printed on it,meaning that when you use this coupon with a product, you may get N times the value of that product back! What is more, the shop also offers some bonus product for free. However, if you apply","a coupon with a positive N to this bonus product, you will have to pay the shop N times the value of the bonus product... but hey, magically, they have some coupons with negative N’s!For example, given a set of coupons {1 2 4 -1}, and a set of product values {7 6 -2 -3} (in Mars dollars","M$) where a negative value corresponds to a bonus product. You can apply coupon 3 (with N being 4) to product 1 (with value M$7) to get M$28 back; coupon 2 to product 2 to get M$12 back; and coupon 4 to product 4 to get M$3 back. On the other hand, if you apply coupon 3 to product 4, you","will have to pay M$12 to the shop.Each coupon and each product may be selected at most once. Your task is to get as much money back as possible."],"input":"Each input file contains one test case. For each case, the first line contains the number of coupons NC,followed by a line with NC coupon integers. Then the next line contains the number of products NP,followed by a line with NP product values. Here 1\u003c= NC, NP \u003c= 105, and it is guaranteed that all the\n\nnumbers will not exceed 230.","output":"For each test case, simply print in a line the maximum amount of money you can get back.","samples":[{"input":"4\n1 2 4 -1\n4\n7 6 -2 -3","output":"43","explanation":"","label":""}],"sampleInput":"4\n1 2 4 -1\n4\n7 6 -2 -3","sampleOutput":"43","idea":["给出两个数字序列,从这两个序列中分别选取相同数量的元素进行一对一相乘,问能得到的乘积之和最大为多少~把这两个序列都从小到大排序,将前面都是负数的数相乘求和,然后将后面都是正数的数相乘求和~"],"keyPoints":["先明确局部选择为什么不会破坏后续最优解，再按对应关键字排序。","涉及小数收益或比例时使用 double，并避免过早取整。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003cvector>\n#include \u003calgorithm>\n\n// 解题关键：给出两个数字序列,从这两个序列中分别选取相同数量的元素进行一对一相乘,问能得到的乘积之和最大为多少\nusing namespace std;\nint main() {\n   int m, n, ans = 0, p = 0, q = 0;\n   scanf(\"%d\", &m);\n   vector\u003cint> v1(m);\n   for(int i = 0; i \u003c m; i++)\n\n      scanf(\"%d\", &v1[i]);\n   scanf(\"%d\", &n);\n   vector\u003cint> v2(n);\n   for(int i = 0; i \u003c n; i++)\n      scanf(\"%d\", &v2[i]);\n   sort(v1.begin(), v1.end());\n   sort(v2.begin(), v2.end());\n   while(p \u003c m && q \u003c n && v1[p] \u003c 0 && v2[q] \u003c 0) {\n      ans += v1[p] * v2[q];\n\n      p++; q++;\n   }\n   p = m - 1, q = n - 1;\n   while(p >= 0 && q >= 0 && v1[p] > 0 && v2[q] > 0) {\n      ans += v1[p] * v2[q];\n      p--; q--;\n   }\n   printf(\"%d\", ans);\n   return 0;\n}"},{"id":"1038","title":"Recover the Smallest Number","score":30,"category":"贪心算法","description":["Given a collection of number segments, you are supposed to recover the smallest number from them.For example, given {32, 321, 3214, 0229, 87}, we can recover many numbers such like 32-321-3214-0229-87 or 0229-32-87-321-3214 with respect to different orders of combinations of these segments,","and the smallest number is 0229-321-3214-32-87."],"input":"Each input file contains one test case. Each case gives a positive integer N (\u003c=10000) followed by N number segments. Each segment contains a non-negative integer of no more than 8 digits. All the numbers in a line are separated by a space.","output":"For each test case, print the smallest number in one line. Do not output leading zeros.","samples":[{"input":"5 32 321 3214 0229 87","output":"22932132143287","explanation":"","label":""}],"sampleInput":"5 32 321 3214 0229 87","sampleOutput":"22932132143287","idea":["给一些字符串,求它们拼接起来构成最小数字的方式分析:贪心算法。让我们一起来见证cmp函数的强大之处!!~~不是按照字典序排列就可以的,必须保证两个字符串构成的数字是最小的才行,所以cmp函数写成return a + b \u003c b + a;的形式,保证它排列按照能够组成的最小数字的形式排列。因为字符串可能前面有0,这些要移除掉(用s.erase(s.begin())就可以了~嗯~","string如此神奇~~)。输出拼接后的字符串即可。注意:如果移出了0之后发现s.length() == 0了,说明这个数是0,那么要特别地输出这个0,否则会什么都不输出~"],"keyPoints":["先明确局部选择为什么不会破坏后续最优解，再按对应关键字排序。","涉及小数收益或比例时使用 double，并避免过早取整。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstring>\n#include \u003calgorithm>\n\n// 解题关键：给一些字符串,求它们拼接起来构成最小数字的方式分析:贪心算法\nusing namespace std;\nbool cmp0(string a, string b) {\n\n   return a + b \u003c b + a;\n}\nstring str[10010];\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   for(int i = 0; i \u003c n; i++)\n      cin >> str[i];\n   sort(str, str + n, cmp0);\n\n   string s;\n   for(int i = 0; i \u003c n; i++)\n      s += str[i];\n   while(s.length() != 0 && s[0] == '0')\n      s.erase(s.begin());\n   if(s.length() == 0) cout \u003c\u003c 0;\n   cout \u003c\u003c s;\n   return 0;\n}"},{"id":"1039","title":"Course List for Student","score":25,"category":"不定长数组vector,STL的使用","description":["Zhejiang University has 40000 students and provides 2500 courses. Now given the student name lists of all the courses, you are supposed to output the registered course list for each student who comes for a query."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive integers: N(\u003c=40000), the number of students who look for their course lists, and K (\u003c=2500), the total number of courses. Then the student name lists are given for the courses (numbered from 1 to K) in the following\n\nformat: for each course i, first the course index i and the number of registered students Ni (\u003c= 200) are given in a line. Then in the next line, Ni student names are given. A student name consists of 3 capital English letters plus a one-digit number. Finally the last line contains the N names of students who\n\ncome for a query. All the names and numbers in a line are separated by a space.","output":"For each test case, print your results in N lines. Each line corresponds to one student, in the following format: first print the student’s name, then the total number of registered courses of that student, and finally the indices of the courses in increasing order. The query results must be printed in the same\n\norder as input. All the data in a line must be separated by a space, with no extra space at the end of the line.","samples":[{"input":"11 5\n4 7\nBOB5 DON2 FRA8 JAY9 KAT3 LOR6 ZOE1\n1 4\nANN0 BOB5 JAY9 LOR6\n2 7\nANN0 BOB5 FRA8 JAY9 JOE4 KAT3 LOR6\n3 1\nBOB5\n5 9\nAMY7 ANN0 BOB5 DON2 FRA8 JAY9 KAT3 LOR6 ZOE1\nZOE1 ANN0 BOB5 JOE4 JAY9 FRA8 DON2 AMY7 KAT3 LOR6 NON9","output":"ZOE1 2 4 5\nANN0 3 1 2 5\nBOB5 5 1 2 3 4 5\nJOE4 1 2\nJAY9 4 1 2 4 5\nFRA8 3 2 4 5\nDON2 2 4 5\nAMY7 1 5\nKAT3 3 2 4 5\nLOR6 4 1 2 4 5\nNON9 0","explanation":"","label":""}],"sampleInput":"11 5\n4 7\nBOB5 DON2 FRA8 JAY9 KAT3 LOR6 ZOE1\n1 4\nANN0 BOB5 JAY9 LOR6\n2 7\nANN0 BOB5 FRA8 JAY9 JOE4 KAT3 LOR6\n3 1\nBOB5\n5 9\nAMY7 ANN0 BOB5 DON2 FRA8 JAY9 KAT3 LOR6 ZOE1\nZOE1 ANN0 BOB5 JOE4 JAY9 FRA8 DON2 AMY7 KAT3 LOR6 NON9","sampleOutput":"ZOE1 2 4 5\nANN0 3 1 2 5\nBOB5 5 1 2 3 4 5\nJOE4 1 2\nJAY9 4 1 2 4 5\nFRA8 3 2 4 5\nDON2 2 4 5\nAMY7 1 5\nKAT3 3 2 4 5\nLOR6 4 1 2 4 5\nNON9 0","idea":["有N个学生,K门课,给出选择每门课的学生姓名,最后对于给出的N个学生的姓名的选课情况进行询问,要求按顺序给出每个学生的选课情况~考虑到string、cin、cout会超时,可以使用hash(26*26*26*10+10)将学生姓名变为int型,然后存储在vector里面~~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003cvector>\n\n// 解题关键：有N个学生,K门课,给出选择每门课的学生姓名,最后对于给出的N个学生的姓名的选课情况进行询问,要求按顺序给出每个学生的选课情况\n\n#include \u003calgorithm>\nusing namespace std;\nint getid(char *name) {\n   int id = 0;\n   for(int i = 0; i \u003c 3; i++)\n      id = 26 * id + (name[i] - 'A');\n   id = id * 10 + (name[3] - '0');\n   return id;\n}\n\nconst int maxn = 26 * 26 * 26 * 10 + 10;\nvector\u003cint> v[maxn];\n\nint main() {\n   int n, k, no, num, id = 0;\n   char name[5];\n   scanf(\"%d %d\", &n, &k);\n   for(int i = 0; i \u003c k; i++) {\n      scanf(\"%d %d\", &no, &num);\n      for(int j = 0; j \u003c num; j++) {\n\n         scanf(\"%s\", name);\n         id = getid(name);\n         v[id].push_back(no);\n      }\n   }\n\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%s\", name);\n      id = getid(name);\n      sort(v[id].begin(), v[id].end());\n      printf(\"%s %lu\", name, v[id].size());\n\n      for(int j = 0; j \u003c v[id].size(); j++)\n         printf(\" %d\", v[id][j]);\n      printf(\"\\n\");\n   }\n   return 0;\n}"},{"id":"1040","title":"Longest Symmetric String","score":25,"category":"动态规划","description":["Given a string, you are supposed to output the length of the longest symmetric sub-string. For example, given “Is PAT&TAP symmetric?”, the longest symmetric sub-string is “s PAT&TAP s”, hence you must output 11."],"input":"Each input file contains one test case which gives a non-empty string of length no more than 1000.","output":"For each test case, simply print the maximum length in a line.","samples":[{"input":"Is PAT&TAP symmetric?","output":"11","explanation":"","label":""}],"sampleInput":"Is PAT&TAP symmetric?","sampleOutput":"11","idea":["dp[i][j]表示s[i]到s[j]所表示的字串是否是回文字串。","只有0和1,递推方程为:1 当s[i] == s[j]: dp[i][j] = dp[i+1][j-1]2 当s[i]!= s[j]: dp[i][j] =0 3 边界:dp[i][i] = 1, dp[i][i+1] = (s[i] == s[i+1])? 1: 0因为i、j如果从小到大的顺序来枚举的话,无法保证更新dp[i][j]的时候dp[i+1][j-1]已经被计算过。","因此不妨考虑按照字串的长度和子串的初试位置进行枚举,即第一遍将长度为3的子串的dp的值全部求出,第二遍通过第一遍结果计算出长度为4的子串的dp 的值...这样就可以避免状态无法转移的问题首先初始化dp[i][i] = 1, dp[i][i+1],把长度为1和2的都初始化好,然后从L = 3开始一直到 L \u003c= len 根据动态规划的递归方程来判断"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：dp[i][j]表示s[i]到s[j]所表示的字串是否是回文字串\nusing namespace std;\nint dp[1010][1010];\n\nint main() {\n   string s;\n   getline(cin, s);\n   int len = s.length(), ans = 1;\n   for(int i = 0; i \u003c len; i++) {\n\n      dp[i][i] = 1;\n      if(i \u003c len - 1 && s[i] == s[i+1]) {\n         dp[i][i+1] = 1;\n         ans = 2;\n      }\n   }\n   for(int L = 3; L \u003c= len; L++) {\n      for(int i = 0; i + L - 1 \u003c len; i++) {\n         int j = i + L -1;\n         if(s[i] == s[j] && dp[i+1][j-1] == 1) {\n\n             dp[i][j] = 1;\n             ans = L;\n         }\n      }\n   }\n   printf(\"%d\", ans);\n   return 0;\n}"},{"id":"1041","title":"Be Unique","score":20,"category":"Hash散列","description":["Being unique is so important to people on Mars that even their lottery is designed in a unique way.The rule of winning is simple: one bets on a number chosen from [1, 104]. The first one who bets on a unique number wins. For example, if there are 7 people betting on 5 31 5 88 67 88 17, then the second","one who bets on 31 wins."],"input":"Each input file contains one test case. Each case contains a line which begins with a positive integer N(\u003c=105) and then followed by N bets. The numbers are separated by a space.","output":"For each test case, print the winning number in a line. If there is no winner, print “None” instead.","samples":[{"input":"7 5 31 5 88 67 88 17","output":"31","explanation":"","label":"1"},{"input":"5 888 666 666 888 888","output":"None","explanation":"","label":"2"}],"sampleInput":"7 5 31 5 88 67 88 17","sampleOutput":"31","idea":["给n个数字,按照读入顺序,哪个数字是第一个在所有数字中只出现一次的数字。如果所有数字出现都超过了一次,则输出None分析:建立一个数组,存储每个数字出现的次数,然后遍历一遍输入的顺序看是否有出现次数为1的数字"],"keyPoints":["散列表或计数数组的范围必须覆盖题目中的全部可能取值。","每组测试数据开始前要正确初始化计数与访问标记。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：给n个数字,按照读入顺序,哪个数字是第一个在所有数字中只出现一次的数字\nusing namespace std;\nint a[100001], m[100000];\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &a[i]);\n      m[a[i]]++;\n\n   }\n   for(int i = 0; i \u003c n; i++) {\n      if(m[a[i]] == 1) {\n         printf(\"%d\", a[i]);\n         return 0;\n      }\n   }\n   printf(\"None\");\n   return 0;\n\n}"},{"id":"1042","title":"Shuffling Machine","score":20,"category":"模拟","description":["Shuffling is a procedure used to randomize a deck of playing cards. Because standard shuffling techniques are seen as weak, and in order to avoid “inside jobs” where employees collaborate with gamblers by performing inadequate shuffles, many casinos employ automatic shuffling machines.","Your task is to simulate a shuffling machine.The machine shuffles a deck of 54 cards according to a given random order and repeats for a given number of times. It is assumed that the initial status of a card deck is in the following order:S1, S2,..., S13, H1, H2,..., H13, C1, C2,..., C13, D1, D2,..., D13, J1, J2","where “S” stands for “Spade”, “H” for “Heart”, “C” for “Club”, “D” for “Diamond”, and “J” for“Joker”. A given order is a permutation of distinct integers in [1, 54]. If the number at the i-th position is j, it means to move the card from position i to position j. For example, suppose we only have 5","cards: S3, H5, C1, D13 and J2. Given a shuffling order {4, 2, 5, 3, 1}, the result will be: J2, H5, D13, S3,C1. If we are to repeat the shuffling again, the result will be: C1, H5, S3, J2, D13."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer K (\u003c= 20)which is the number of repeat times. Then the next line contains the given order. All the numbers in a line are separated by a space.","output":"For each test case, print the shuffling results in one line. All the cards are separated by a space, and there must be no extra space at the end of the line.","samples":[{"input":"2\n36 52 37 38 3 39 40 53 54 41 11 12 13 42 43 44 2 4 23 24 25 26 27 6 7 8 48 49 50 51 9 10 14 15 16 5 17 18 19\n1 20 21 22 28 29 30 31 32 33 34 35 45 46 47","output":"S7 C11 C10 C12 S1 H7 H8 H9 D8 D9 S11 S12 S13 D10 D11 D12 S3 S4 S6 S10 H1 H2 C13 D2 D3 D4 H6\nH3 D13 J1 J2 C1 C2 C3 C4 D1 S5 H5 H11 H12 C6 C7 C8 C9 S2 S8 S9 H10 D5 D6 D7 H4 H13 C5","explanation":"","label":""}],"sampleInput":"2\n36 52 37 38 3 39 40 53 54 41 11 12 13 42 43 44 2 4 23 24 25 26 27 6 7 8 48 49 50 51 9 10 14 15 16 5 17 18 19\n1 20 21 22 28 29 30 31 32 33 34 35 45 46 47","sampleOutput":"S7 C11 C10 C12 S1 H7 H8 H9 D8 D9 S11 S12 S13 D10 D11 D12 S3 S4 S6 S10 H1 H2 C13 D2 D3 D4 H6\nH3 D13 J1 J2 C1 C2 C3 C4 D1 S5 H5 H11 H12 C6 C7 C8 C9 S2 S8 S9 H10 D5 D6 D7 H4 H13 C5","idea":["简单模拟。使用start和end数组保存每一次变换的开始顺序和结束顺序(以1~54的编号存储),最后根据编号与扑克牌字母数字的对应关系输出end数组"],"keyPoints":["把题目流程拆成清晰状态逐步模拟，每一步只修改相关变量。","重点检查循环起止、下标边界和最后一项的输出格式。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：简单模拟\nusing namespace std;\nint main() {\n   int cnt;\n\n   scanf(\"%d\", &cnt);\n   int start[55], end[55], scan[55];\n   for(int i = 1; i \u003c 55; i++) {\n      scanf(\"%d\", &scan[i]);\n      end[i] = i;\n   }\n   for(int i = 0; i \u003c cnt; i++) {\n      for(int j = 1; j \u003c 55; j++)\n         start[j] = end[j];\n      for(int k = 1; k \u003c 55; k++)\n\n         end[scan[k]] = start[k];\n   }\n   char c[6] = {\"SHCDJ\"};\n   for(int i = 1; i \u003c 55; i++) {\n      end[i] = end[i] - 1;\n      printf(\"%c%d\", c[end[i]/13], end[i]%13+1);\n      if(i != 54) printf(\" \");\n   }\n   return 0;\n\n}"},{"id":"1043","title":"Is It a Binary Search Tree","score":25,"category":"二叉查找树BST","description":["A Binary Search Tree (BST) is recursively defined as a binary tree which has the following properties:The left subtree of a node contains only nodes with keys less than the node’s key.The right subtree of a node contains only nodes with keys greater than or equal to the node’s key.","Both the left and right subtrees must also be binary search trees.If we swap the left and right subtrees of every node, then the resulting tree is called the Mirror Image of a BST.Now given a sequence of integer keys, you are supposed to tell if it is the preorder traversal sequence","of a BST or the mirror image of a BST."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N(\u003c=1000). Then N integer keys are given in the next line. All the numbers in a line are separated by a space.","output":"For each test case, first print in a line “YES” if the sequence is the preorder traversal sequence of a BST or the mirror image of a BST, or “NO” if not. Then if the answer is “YES”, print in the next line the postorder traversal sequence of that tree. All the numbers in a line must be separated by a space, and\n\nthere must be no extra space at the end of the line.","samples":[{"input":"7\n8 6 5 7 10 8 11","output":"YES\n5 7 6 8 11 10 8","explanation":"","label":"1"},{"input":"7\n8 10 11 8 6 7 5","output":"YES\n11 8 10 7 5 6 8","explanation":"","label":"2"},{"input":"7\n8 6 8 5 10 9 11","output":"NO","explanation":"","label":"3"}],"sampleInput":"7\n8 6 5 7 10 8 11","sampleOutput":"YES\n5 7 6 8 11 10 8","idea":["给定一个整数键值序列,现请你编写程序,判断这是否是对一棵二叉搜索树或其镜像进行前序遍历的结果。","假设它是二叉搜索树,一开始isMirror为false,根据二叉搜索树的性质将已知的前序转换为后序,转换过程中,如果发现最后输出的后序数组长度不为n,那就设isMirror为true,然后清空后序数组,重新再转换一次(根据镜面二叉搜索树的性质),如果依旧转换后数组大小不等于n,就输出NO否则输出YES"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003cvector>\n\n// 解题关键：给定一个整数键值序列,现请你编写程序,判断这是否是对一棵二叉搜索树或其镜像进行前序遍历的结果\nusing namespace std;\nbool isMirror;\nvector\u003cint> pre, post;\nvoid getpost(int root, int tail) {\n\n   if(root > tail) return ;\n   int i = root + 1, j = tail;\n   if(!isMirror) {\n      while(i \u003c= tail && pre[root] > pre[i]) i++;\n      while(j > root && pre[root] \u003c= pre[j]) j--;\n   } else {\n      while(i \u003c= tail && pre[root] \u003c= pre[i]) i++;\n      while(j > root && pre[root] > pre[j]) j--;\n   }\n   if(i - j != 1) return ;\n\n   getpost(root + 1, j);\n   getpost(i, tail);\n   post.push_back(pre[root]);\n}\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   pre.resize(n);\n   for(int i = 0; i \u003c n; i++)\n\n      scanf(\"%d\", &pre[i]);\n   getpost(0, n - 1);\n   if(post.size() != n) {\n      isMirror = true;\n      post.clear();\n      getpost(0, n - 1);\n   }\n   if(post.size() == n) {\n      printf(\"YES\\n%d\", post[0]);\n\n      for(int i = 1; i \u003c n; i++)\n         printf(\" %d\", post[i]);\n   } else {\n      printf(\"NO\");\n   }\n\n   return 0;\n}"},{"id":"1044","title":"Shopping in Mars","score":25,"category":"二分查找","description":["Shopping in Mars is quite a different experience. The Mars people pay by chained diamonds. Each diamond has a value (in Mars dollars M$). When making the payment, the chain can be cut at any position for only once and some of the diamonds are taken off the chain one by one. Once a diamond","is off the chain, it cannot be taken back. For example, if we have a chain of 8 diamonds with values M$3, 2, 1, 5, 4, 6, 8, 7, and we must pay M$15. We may have 3 options:1. Cut the chain between 4 and 6, and take off the diamonds from the position 1 to 5 (with values","3+2+1+5+4=15).2. Cut before 5 or after 6, and take off the diamonds from the position 4 to 6 (with values 5+4+6=15).3. Cut before 8, and take off the diamonds from the position 7 to 8 (with values 8+7=15).Now given the chain of diamond values and the amount that a customer has to pay, you are","supposed to list all the paying options for the customer.If it is impossible to pay the exact amount, you must suggest solutions with minimum lost."],"input":"Each input file contains one test case. For each case, the first line contains 2 numbers: N (\u003c=105), the total number of diamonds on the chain, and M (\u003c=108), the amount that the customer has to pay.Then the next line contains N positive numbers D1... DN (Di\u003c=103 for all i=1,..., N) which are the\n\nvalues of the diamonds. All the numbers in a line are separated by a space.","output":"For each test case, print “i-j” in a line for each pair of i \u003c= j such that Di +... + Dj = M. Note that if there are more than one solution, all the solutions must be printed in increasing order of i.If there is no solution, output “i-j” for pairs of i \u003c= j such that Di +... + Dj > M with (Di +... + Dj – M)\n\nminimized. Again all the solutions must be printed in increasing order of i.It is guaranteed that the total value of diamonds is sufficient to pay the given amount.","samples":[{"input":"16 15\n3 2 1 5 4 6 8 7 16 10 15 11 9 12 14 13","output":"1-5\n4-6\n7-8\n11-11","explanation":"","label":"1"},{"input":"5 13\n2 4 5 7 9","output":"2-4\n4-5","explanation":"","label":"2"}],"sampleInput":"16 15\n3 2 1 5 4 6 8 7 16 10 15 11 9 12 14 13","sampleOutput":"1-5\n4-6\n7-8\n11-11","idea":["题目大意,求一串的数字中连续的一段,使得这个连续的段内数字的和恰好等于所期望的值m。如果不能找到恰好等于,就找让自己付出最少的价格(总和必须大于等于所给值)的那段区间。求所有可能的结果。一开始用的简单模拟,有两个超时了。后来想到因为sum数组是递增的,所以改用二分法查找~Func函数的作用是二分查找,修改tempsum和j的值~","一开始接收输入的时候可以直接保存它的sum函数,即sum[i]表示1~i的所有数字的总和~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：题目大意,求一串的数字中连续的一段,使得这个连续的段内数字的和恰好等于所期望的值m\nusing namespace std;\nvector\u003cint> sum, resultArr;\nint n, m;\nvoid Func(int i, int &j, int &tempsum) {\n   int left = i, right = n;\n   while(left \u003c right) {\n      int mid = (left + right) / 2;\n\n      if(sum[mid] - sum[i-1] >= m)\n         right = mid;\n      else\n         left = mid + 1;\n   }\n   j = right;\n   tempsum = sum[j] - sum[i-1];\n}\nint main() {\n\n   scanf(\"%d%d\", &n, &m);\n   sum.resize(n+1);\n   for(int i = 1; i \u003c= n; i++) {\n      scanf(\"%d\", &sum[i]);\n\n      sum[i] += sum[i-1];\n   }\n   int minans = sum[n];\n   for(int i = 1; i \u003c= n; i++) {\n      int j, tempsum;\n\n      Func(i, j, tempsum);\n      if(tempsum > minans) continue;\n      if(tempsum >= m) {\n         if(tempsum \u003c minans) {\n             resultArr.clear();\n             minans = tempsum;\n         }\n         resultArr.push_back(i);\n         resultArr.push_back(j);\n      }\n\n   }\n   for(int i = 0; i \u003c resultArr.size(); i += 2)\n      printf(\"%d-%d\\n\", resultArr[i], resultArr[i+1]);\n   return 0;\n}"},{"id":"1045","title":"Favorite Color Stripe","score":30,"category":"动态规划,LIS / LCS","description":["Eva is trying to make her own color stripe out of a given one. She would like to keep only her favorite colors in her favorite order by cutting off those unwanted pieces and sewing the remaining parts together to form her favorite color stripe.It is said that a normal human eye can distinguish about less than 200 different colors, so Eva’s","favorite colors are limited. However the original stripe could be very long, and Eva would like to have the remaining favorite stripe with the maximum length. So she needs your help to find her the best result.Note that the solution might not be unique, but you only have to tell her the maximum length. For","example, given a stripe of colors {2 2 4 1 5 5 6 3 1 1 5 6}. If Eva’s favorite colors are given in her favorite order as {2 3 1 5 6}, then she has 4 possible best solutions {2 2 1 1 1 5 6}, {2 2 1 5 5 5 6}, {2 2 1 5 5 6 6}, and {2 2 3 1 1 5 6}."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N (\u003c=200)which is the total number of colors involved (and hence the colors are numbered from 1 to N). Then the next line starts with a positive integer M (\u003c=200) followed by M Eva’s favorite color numbers\n\ngiven in her favorite order. Finally the third line starts with a positive integer L (\u003c=10000) which is the length of the given stripe, followed by L colors on the stripe. All the numbers in a line are separated by a space.","output":"For each test case, simply print in a line the maximum length of Eva’s favorite stripe.","samples":[{"input":"6\n5 2 3 1 5 6\n12 2 2 4 1 5 5 6 3 1 1 5 6","output":"7","explanation":"","label":""}],"sampleInput":"6\n5 2 3 1 5 6\n12 2 2 4 1 5 5 6 3 1 1 5 6","sampleOutput":"7","idea":["给出m中颜色作为喜欢的颜色(同时也给出顺序),然后给出一串长度为L的颜色序列,现在要去掉这个序列中的不喜欢的颜色,然后求剩下序列的一个子序列,使得这个子序列表示的颜色顺序符合自己喜欢的颜色的顺序,不一定要所有喜欢的颜色都出现。因为喜欢的颜色是不重复的,把喜欢的颜色的序列依次存储到数组中,book[i] = j表示i颜色的下标为j。","先在输入的时候剔除不在喜欢的序列中的元素,然后把剩余的保存在数组a中。按照最长不下降子序列的方式做,对于从前到后的每一个i,如果它前面的所有的j,一下子找到了一个j的下标book[j]比book[i]小,此时就更新dp[i]使它 = max(dp[i], dp[j] + 1);并且同时再每一次遍历完成一次j后更新maxn的值为长度的最大值,最后输出maxn~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给出m中颜色作为喜欢的颜色(同时也给出顺序),然后给出一串长度为L的颜色序列,现在要去掉这个序列中的不喜欢的颜色,然后求剩下序列的一个子序列,使得这个子序列表示的颜色顺序符合自己喜欢的颜色的顺序,不一定要所有喜欢的颜色都\nusing namespace std;\nint book[201], a[10001], dp[10001];\n\nint main() {\n   int n, m, x, l, num = 0, maxn = 0;\n   scanf(\"%d %d\", &n, &m);\n   for(int i = 1; i \u003c= m; i++) {\n      scanf(\"%d\", &x);\n      book[x] = i;\n   }\n   scanf(\"%d\", &l);\n   for(int i = 0; i \u003c l; i++) {\n\n      scanf(\"%d\", &x);\n      if(book[x] >= 1)\n         a[num++] = book
