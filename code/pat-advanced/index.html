<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PAT 甲级题库题面、解题思路与 C++ 参考答案工作台">
  <title>PAT (Advanced Level) Practice</title>
  <link rel="shortcut icon" href="/img/favicon.ico">
  <script>
    try {
      var savedPatTheme = localStorage.getItem('ruiqy.daily.doki-theme.v1')
      var patThemes = ['emilia-light', 'beatrice', 'echidna', 'inori-light', 'nao-light']
      if (patThemes.indexOf(savedPatTheme) !== -1) document.documentElement.setAttribute('data-pat-theme', savedPatTheme)
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="/css/doki-global-theme@1.0.0.css?v=1.3.5">
  <style>
:root {
  --pat-bg: #f4f6f8;
  --pat-panel: #ffffff;
  --pat-line: #e2e7eb;
  --pat-text: #202a32;
  --pat-muted: #74808a;
  --pat-blue: #3578d4;
  --pat-blue-soft: #edf4ff;
  --pat-green: #288566;
  --pat-amber: #b87520;
  --pat-amber-soft: #fff7e9;
  --pat-editor: #17212b;
  --pat-editor-line: #263544;
  --pat-editor-text: #dce7ef;
}

:root[data-pat-theme="emilia-light"] {
  color-scheme: light;
  --pat-bg: #f7effd;
  --pat-panel: rgba(255, 251, 255, .91);
  --pat-line: #e6d8ef;
  --pat-text: #493f50;
  --pat-muted: #897a91;
  --pat-blue: #7d61ad;
  --pat-blue-soft: #eee6fa;
  --pat-green: #248b73;
  --pat-amber: #b77b34;
  --pat-amber-soft: #fff0df;
  --pat-wallpaper: url('/daily/doki/backgrounds/emilia_light.png');
}

:root[data-pat-theme="beatrice"] {
  color-scheme: light;
  --pat-bg: #fff0f7;
  --pat-panel: rgba(255, 250, 253, .91);
  --pat-line: #efd5e2;
  --pat-text: #553f4b;
  --pat-muted: #957886;
  --pat-blue: #c95d94;
  --pat-blue-soft: #fde6f1;
  --pat-green: #288d78;
  --pat-amber: #c67827;
  --pat-amber-soft: #fff0dc;
  --pat-wallpaper: url('/daily/doki/backgrounds/beatrice.png');
}

:root[data-pat-theme="echidna"] {
  color-scheme: dark;
  --pat-bg: #141216;
  --pat-panel: rgba(25, 23, 28, .92);
  --pat-line: #34363a;
  --pat-text: #f5f2f5;
  --pat-muted: #b7afb8;
  --pat-blue: #75aaab;
  --pat-blue-soft: #28383b;
  --pat-green: #75aaab;
  --pat-amber: #d5be79;
  --pat-amber-soft: #4d432b;
  --pat-editor: #101014;
  --pat-editor-line: #34363a;
  --pat-editor-text: #f5f2f5;
  --pat-wallpaper: url('/daily/doki/backgrounds/echidna_dark.png');
}

:root[data-pat-theme="inori-light"] {
  color-scheme: light;
  --pat-bg: #fff1e8;
  --pat-panel: rgba(255, 249, 245, .92);
  --pat-line: #e8b58f;
  --pat-text: #523a31;
  --pat-muted: #947266;
  --pat-blue: #c86442;
  --pat-blue-soft: #f8dfd1;
  --pat-green: #3b8c78;
  --pat-amber: #d58130;
  --pat-amber-soft: #ffead7;
  --pat-editor: #2b211d;
  --pat-editor-line: #62493d;
  --pat-editor-text: #fff8f3;
  --pat-wallpaper: url('/daily/doki/backgrounds/inori_light.png');
}

:root[data-pat-theme="nao-light"] {
  color-scheme: light;
  --pat-bg: #f2eee7;
  --pat-panel: rgba(255, 253, 249, .91);
  --pat-line: #dce0d6;
  --pat-text: #414a45;
  --pat-muted: #7e8a83;
  --pat-blue: #467fc9;
  --pat-blue-soft: #e6eef9;
  --pat-green: #158f7d;
  --pat-amber: #b77c33;
  --pat-amber-soft: #f9ecd9;
  --pat-wallpaper: url('/daily/doki/backgrounds/nao_light.png');
}

* { box-sizing: border-box; }
html { min-width: 320px; }
body {
  min-height: 100vh;
  margin: 0;
  overflow: hidden;
  color: var(--pat-text);
  background: var(--pat-bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.7;
}

body[data-pat-theme] {
  background-color: var(--pat-bg);
  background-image: var(--pat-wallpaper);
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
}

body[data-pat-theme] :is(
  .pat-topbar,
  .pat-list-panel,
  .pat-problem-panel,
  .pat-problem-toolbar,
  .pat-answer-panel,
  .pat-answer-toolbar,
  .pat-theme-menu
) {
  border-color: var(--pat-line);
  background: var(--pat-panel);
  color: var(--pat-text);
}

body[data-pat-theme] :is(
  .pat-count,
  .pat-number-button.is-ready,
  .pat-icon-btn.is-complete
) {
  border-color: var(--pat-line);
  background: var(--pat-blue-soft);
}

body[data-pat-theme] :is(
  .pat-number-button,
  .pat-icon-btn,
  .pat-text-btn,
  .pat-language-label,
  .pat-sample,
  .pat-test-cell
) {
  border-color: var(--pat-line);
  background-color: var(--pat-panel);
  color: var(--pat-text);
}

body[data-pat-theme] .pat-number-button:disabled {
  background: color-mix(in srgb, var(--pat-panel) 62%, var(--pat-muted) 38%);
  color: var(--pat-muted);
  opacity: .46;
}

body[data-pat-theme] .pat-key-points {
  border-left-color: var(--pat-amber);
  background: var(--pat-amber-soft);
  color: var(--pat-text);
}

body[data-pat-theme] .pat-key-points strong { color: var(--pat-amber); }

button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid rgba(53, 120, 212, .18);
  outline-offset: 2px;
}

.pat-shell {
  display: grid;
  height: 100vh;
  min-height: 100vh;
  grid-template-rows: 62px minmax(0, 1fr);
}

.pat-topbar {
  position: relative;
  z-index: 120;
  display: grid;
  grid-template-columns: minmax(280px, 1fr) auto minmax(280px, 1fr);
  align-items: center;
  gap: 20px;
  padding: 0 18px;
  border-bottom: 1px solid var(--pat-line);
  background: rgba(255, 255, 255, .96);
}

.pat-back {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  gap: 9px;
  color: var(--pat-text);
  font-size: 15px;
  font-weight: 750;
  text-decoration: none;
}

.pat-back-icon {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 50%;
  background: var(--pat-bg);
  color: var(--pat-blue);
  font-size: 22px;
  line-height: 1;
}

.pat-top-title { text-align: center; }
.pat-top-title strong { display: block; font-size: 15px; }
.pat-top-title span { color: var(--pat-muted); font-size: 11px; }
.pat-top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.pat-top-actions a {
  display: inline-flex;
  height: 34px;
  align-items: center;
  padding: 0 13px;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  color: var(--pat-blue);
  font-size: 12px;
  font-weight: 720;
  text-decoration: none;
}

.pat-theme-picker { position: relative; }
.pat-theme-toggle {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  background: var(--pat-panel);
  color: var(--pat-blue);
  cursor: pointer;
}
.pat-theme-toggle.is-open { background: var(--pat-blue-soft); }
.pat-theme-menu {
  position: absolute;
  z-index: 140;
  top: auto;
  right: 0;
  bottom: calc(100% - 42px);
  display: grid;
  width: 232px;
  gap: 4px;
  padding: 8px;
  border: 1px solid var(--pat-line);
  border-radius: 7px;
  box-shadow: 0 14px 34px rgba(20, 28, 36, .16);
}
.pat-theme-menu[hidden] { display: none; }
.pat-theme-option {
  display: grid;
  min-height: 42px;
  grid-template-columns: 22px minmax(0, 1fr) 18px;
  align-items: center;
  gap: 9px;
  padding: 5px 8px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: var(--pat-text);
  text-align: left;
  cursor: pointer;
}
.pat-theme-option:hover { background: var(--pat-blue-soft); }
.pat-theme-option.is-active { border-color: var(--pat-blue); background: var(--pat-blue-soft); }
.pat-theme-option > span:nth-child(2) { display: grid; min-width: 0; }
.pat-theme-option strong { font-size: 11px; }
.pat-theme-option small { color: var(--pat-muted); font-size: 9px; }
.pat-theme-option > span:last-child { color: var(--pat-blue); opacity: 0; }
.pat-theme-option.is-active > span:last-child { opacity: 1; }
.pat-theme-swatch {
  width: 19px;
  height: 19px;
  border: 2px solid rgba(255, 255, 255, .78);
  border-radius: 50%;
  box-shadow: 0 0 0 1px var(--pat-line);
}
.pat-theme-swatch.emilia-light { background: #a97ec9; }
.pat-theme-swatch.beatrice { background: #e282b2; }
.pat-theme-swatch.echidna { background: #75aaab; }
.pat-theme-swatch.inori-light { background: #c86442; }
.pat-theme-swatch.nao-light { background: #6c9ad4; }

.pat-doki-tools {
  position: fixed;
  z-index: 80;
  right: 14px;
  bottom: 10px;
  width: clamp(150px, 13vw, 238px);
  height: min(30vh, 270px);
  pointer-events: none;
}
.pat-doki-tools .pat-theme-picker {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 2;
  pointer-events: auto;
}
.pat-doki-tools .pat-theme-toggle {
  border-radius: 50%;
  background: var(--pat-panel);
  box-shadow: 0 8px 22px rgba(24, 18, 30, .14);
}
.pat-doki-tools .pat-theme-menu { pointer-events: auto; }
.pat-doki-sticker {
  position: absolute;
  right: 0;
  bottom: 0;
  display: block;
  width: auto;
  max-width: calc(100% - 24px);
  max-height: calc(100% - 24px);
  object-fit: contain;
  cursor: grab;
  filter: drop-shadow(0 10px 18px rgba(24, 18, 30, .20));
  touch-action: none;
  user-select: none;
  -webkit-user-drag: none;
}
.pat-doki-tools.is-dragging .pat-doki-sticker { cursor: grabbing; }
body[data-pat-theme="inori-light"] .pat-doki-tools { width: clamp(180px, 17vw, 300px); }

.pat-workspace {
  display: grid;
  min-height: 0;
  grid-template-columns: 246px minmax(420px, 1fr) minmax(460px, .92fr);
  background: var(--pat-panel);
}

.pat-list-panel,
.pat-problem-panel,
.pat-answer-panel { min-width: 0; min-height: 0; }

.pat-list-panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--pat-line);
  background: #fbfcfd;
}

.pat-panel-heading {
  min-height: 58px;
  padding: 13px 16px 11px;
  border-bottom: 1px solid var(--pat-line);
}

.pat-panel-heading strong { display: block; font-size: 14px; }
.pat-panel-heading span { color: var(--pat-muted); font-size: 11px; }

.pat-count {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 14px 12px 10px;
  padding: 12px 13px;
  border: 1px solid #dce8f7;
  border-radius: 6px;
  background: var(--pat-blue-soft);
}

.pat-count strong { color: var(--pat-blue); font-size: 19px; line-height: 1; }
.pat-count span { color: var(--pat-muted); font-size: 11px; }

.pat-problem-list {
  display: grid;
  flex: 1;
  min-height: 0;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  align-content: start;
  gap: 7px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px 8px 14px 12px;
  scrollbar-color: color-mix(in srgb, var(--pat-blue) 64%, transparent) color-mix(in srgb, var(--pat-line) 56%, transparent);
  scrollbar-gutter: stable;
  scrollbar-width: auto;
}

.pat-problem-list::-webkit-scrollbar { width: 11px; }
.pat-problem-list::-webkit-scrollbar-track {
  border-left: 1px solid color-mix(in srgb, var(--pat-line) 72%, transparent);
  background: color-mix(in srgb, var(--pat-panel) 74%, var(--pat-bg) 26%);
}
.pat-problem-list::-webkit-scrollbar-thumb {
  min-height: 54px;
  border: 3px solid transparent;
  border-radius: 999px;
  background: color-mix(in srgb, var(--pat-blue) 66%, transparent);
  background-clip: padding-box;
}
.pat-problem-list::-webkit-scrollbar-thumb:hover {
  background: var(--pat-blue);
  background-clip: padding-box;
}

.pat-number-button {
  position: relative;
  display: inline-grid;
  width: 100%;
  aspect-ratio: 1;
  place-items: center;
  padding: 0;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  background: #fff;
  color: var(--pat-muted);
  font-size: 10px;
  font-weight: 760;
  cursor: pointer;
}

.pat-number-button:hover:not(:disabled) {
  border-color: #9dbce8;
  color: var(--pat-blue);
  transform: translateY(-1px);
}

.pat-number-button.is-ready {
  border-color: #b8d1f2;
  color: var(--pat-blue);
  background: #f8fbff;
}

.pat-number-button.is-active {
  border-color: var(--pat-blue);
  background: var(--pat-blue-soft);
  color: var(--pat-blue);
  box-shadow: inset 0 0 0 1px var(--pat-blue);
}

.pat-number-button.is-complete {
  border-color: #ffabab;
  background: #fff0f0;
  color: #ef3636;
  font-size: 16px;
  box-shadow: none;
}

.pat-number-button.is-complete.is-active {
  border-color: #ef3636;
  box-shadow: inset 0 0 0 1px #ef3636;
}

body[data-pat-theme] .pat-number-button.is-complete,
body[data-pat-theme] .pat-icon-btn.is-complete {
  border-color: #ffabab;
  background: #fff0f0;
  color: #ef3636;
}

.pat-number-button:disabled {
  border-color: transparent;
  background: rgba(231, 235, 238, .56);
  color: #aeb7bd;
  cursor: not-allowed;
}

.pat-number-legend {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 13px 6px;
  color: var(--pat-muted);
  font-size: 10px;
}
.pat-number-legend span { display: inline-flex; align-items: center; gap: 5px; }
.pat-number-legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--pat-blue); }
.pat-number-legend span:last-child i { background: #ef4b4b; }
.pat-list-note {
  margin: 0;
  padding: 11px 14px;
  border-top: 1px solid var(--pat-line);
  color: var(--pat-muted);
  font-size: 11px;
}

.pat-problem-panel {
  overflow-y: auto;
  border-right: 1px solid var(--pat-line);
  background: #fff;
}

.pat-problem-toolbar {
  position: sticky;
  z-index: 3;
  top: 0;
  display: grid;
  min-height: 58px;
  grid-template-columns: 90px minmax(0, 1fr) 110px;
  align-items: center;
  gap: 10px;
  padding: 8px 18px;
  border-bottom: 1px solid var(--pat-line);
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(8px);
}

.pat-problem-toolbar > span { color: var(--pat-blue); font-size: 12px; font-weight: 760; }
.pat-problem-toolbar h1 {
  overflow: hidden;
  margin: 0;
  font-size: 16px;
  letter-spacing: 0;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pat-pager { display: flex; justify-content: flex-end; gap: 5px; }
.pat-icon-btn {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  background: #fff;
  color: var(--pat-blue);
  cursor: pointer;
}
.pat-icon-btn:disabled { color: #b8c0c6; cursor: not-allowed; }
.pat-icon-btn.is-complete {
  border-color: #ffabab;
  background: #fff0f0;
  color: #ef3636;
}

.pat-statement { padding: 28px clamp(24px, 4vw, 54px) 80px; }
.pat-statement-title { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.pat-statement-title h2 { margin: 0; font-size: 23px; letter-spacing: 0; }
.pat-score {
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--pat-bg);
  color: var(--pat-muted);
  font-size: 11px;
  font-weight: 750;
}
.pat-meta { display: flex; gap: 14px; margin-bottom: 24px; color: var(--pat-muted); font-size: 12px; }
.pat-statement h3 { margin: 28px 0 9px; font-size: 16px; letter-spacing: 0; }
.pat-statement p { margin: 0 0 10px; }
.pat-sample {
  overflow: hidden;
  border: 1px solid var(--pat-line);
  border-radius: 6px;
  background: #fafbfc;
}
.pat-sample + .pat-sample { margin-top: 12px; }
.pat-sample header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 34px;
  padding: 0 12px;
  border-bottom: 1px solid var(--pat-line);
  color: var(--pat-muted);
  font-size: 11px;
  font-weight: 720;
}
.pat-sample pre { margin: 0; padding: 14px; color: #33414b; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
.pat-sample-explanation {
  margin: 10px 0 0;
  padding: 12px 14px;
  border-left: 3px solid var(--pat-accent);
  border-radius: 4px;
  background: var(--pat-accent-soft);
  color: var(--pat-muted);
  white-space: pre-line;
}

.pat-answer-panel {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background: #f8fafb;
}

.pat-answer-toolbar {
  position: sticky;
  z-index: 3;
  top: 0;
  display: flex;
  min-height: 58px;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--pat-line);
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(8px);
}
.pat-answer-toolbar strong { font-size: 13px; }
.pat-language-label {
  display: inline-flex;
  height: 34px;
  min-width: 72px;
  align-items: center;
  justify-content: center;
  padding: 0 14px;
  border: 1px solid #b7d0f2;
  border-radius: 5px;
  background: var(--pat-panel);
  color: var(--pat-text);
  font-size: 12px;
  font-weight: 760;
}

.pat-answer-content { padding: 15px; }
.pat-thinking {
  padding: 2px 2px 15px;
  border-bottom: 1px solid var(--pat-line);
}
.pat-thinking h2, .pat-editor-section h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
.pat-thinking ol {
  display: grid;
  margin: 10px 0 0;
  padding: 0;
  counter-reset: pat-idea;
  gap: 7px;
  list-style: none;
}
.pat-idea-item {
  position: relative;
  min-height: 42px;
  padding: 9px 12px 9px 42px;
  border-left: 3px solid var(--idea-color);
  border-radius: 0 5px 5px 0;
  background: color-mix(in srgb, var(--pat-panel) 84%, var(--idea-color) 16%);
  color: var(--pat-text);
}
.pat-idea-item::before {
  position: absolute;
  top: 10px;
  left: 11px;
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  border-radius: 50%;
  background: var(--idea-color);
  color: #fff;
  content: counter(pat-idea);
  counter-increment: pat-idea;
  font-size: 10px;
  font-weight: 800;
  line-height: 1;
}
.pat-idea-item.is-main { --idea-color: #db4b78; }
.pat-idea-item.is-core { --idea-color: #3478d4; }
.pat-idea-item.is-explain { --idea-color: #24a363; }
.pat-key-points {
  margin-top: 12px;
  padding: 11px 12px;
  border-left: 3px solid #eda33e;
  border-radius: 0 5px 5px 0;
  background: var(--pat-amber-soft);
  color: #79501b;
  font-size: 12px;
}
.pat-key-points strong { display: block; margin-bottom: 3px; color: var(--pat-amber); }
.pat-key-points ul { margin: 0; padding-left: 18px; }

.pat-editor-section { padding-top: 15px; }
.pat-editor-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.pat-editor-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.pat-text-btn {
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid var(--pat-line);
  border-radius: 5px;
  background: #fff;
  color: var(--pat-blue);
  font-size: 11px;
  font-weight: 720;
  cursor: pointer;
}
.pat-text-btn:hover { border-color: #b7d0f2; background: var(--pat-blue-soft); }
.pat-text-btn.is-copied { color: var(--pat-green); }

.pat-editor {
  display: grid;
  min-height: 390px;
  grid-template-columns: 46px minmax(0, 1fr);
  overflow: hidden;
  border: 1px solid #22313f;
  border-radius: 6px;
  background: var(--pat-editor);
}
.pat-line-numbers {
  overflow: hidden;
  margin: 0;
  padding: 14px 9px;
  border-right: 1px solid var(--pat-editor-line);
  color: #6f8190;
  background: #141d25;
  font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  text-align: right;
  user-select: none;
}
.pat-code-input {
  width: 100%;
  min-height: 390px;
  resize: vertical;
  padding: 14px 15px;
  border: 0;
  outline: 0;
  background: var(--pat-editor);
  color: var(--pat-editor-text);
  caret-color: #fff;
  font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  tab-size: 2;
  white-space: pre;
}
.pat-save-state { margin: 7px 1px 0; color: var(--pat-muted); font-size: 10px; }
.pat-test-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  overflow: hidden;
  margin-top: 13px;
  border: 1px solid var(--pat-line);
  border-radius: 6px;
  background: var(--pat-line);
}
.pat-test-cell { min-width: 0; padding: 10px 11px; background: #fff; }
.pat-test-cell strong { display: block; color: var(--pat-muted); font-size: 10px; }
.pat-test-cell code { display: block; overflow-x: auto; margin-top: 4px; color: var(--pat-text); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }

@media (max-width: 1280px) {
  .pat-workspace { grid-template-columns: 214px minmax(390px, 1fr) minmax(410px, .9fr); }
  .pat-statement { padding-inline: 26px; }
}

@media (max-width: 1020px) {
  body { overflow: auto; }
  .pat-shell { display: block; height: auto; }
  .pat-topbar { position: sticky; z-index: 120; top: 0; grid-template-columns: 1fr auto; }
  .pat-top-title { display: none; }
  .pat-workspace { grid-template-columns: 210px minmax(0, 1fr); }
  .pat-list-panel { min-height: calc(100vh - 62px); }
  .pat-problem-panel { min-height: calc(100vh - 62px); border-right: 0; }
  .pat-answer-panel { grid-column: 1 / -1; border-top: 1px solid var(--pat-line); }
  .pat-answer-toolbar { position: static; }
}

@media (max-width: 680px) {
  .pat-topbar { padding-inline: 10px; }
  .pat-back span:last-child { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pat-top-actions > a { display: none; }
  .pat-doki-tools { width: 118px; height: 148px; }
  body[data-pat-theme="inori-light"] .pat-doki-tools { width: 150px; height: 170px; }
  .pat-workspace { display: block; }
  .pat-list-panel { min-height: 0; border-right: 0; }
  .pat-problem-list { grid-template-columns: repeat(6, minmax(0, 1fr)); max-height: 260px; padding: 8px 12px; }
  .pat-number-button { aspect-ratio: 1.5; }
  .pat-list-note { display: none; }
  .pat-count { margin-top: 10px; }
  .pat-problem-panel { min-height: 0; }
  .pat-problem-toolbar { grid-template-columns: 54px minmax(0, 1fr) 76px; padding-inline: 10px; }
  .pat-problem-toolbar h1 { font-size: 14px; }
  .pat-statement { padding: 22px 16px 50px; }
  .pat-statement-title { align-items: flex-start; }
  .pat-statement-title h2 { font-size: 20px; }
  .pat-answer-content { padding: 12px; }
  .pat-editor { min-height: 350px; }
  .pat-code-input { min-height: 350px; }
  .pat-doki-sticker { opacity: .9; }
}
</style>

(function () {
  var library = {"problems":[{"id":"1001","title":"A+B Format","score":20,"category":"字符串处理","description":["Calculate a + b and output the sum in standard format — that is, the digits must be separated into groups of three by commas (unless there are less than four digits)."],"input":"Each input file contains one test case. Each case contains a pair of integers a and b where -1000000 \u003c=a, b \u003c= 1000000. The numbers are separated by a space.","output":"For each test case, you should output the sum of a and b in one line. The sum must be written in the standard format.","samples":[{"input":"-1000000 9","output":"-999,991","explanation":"","label":""}],"sampleInput":"-1000000 9","sampleOutput":"-999,991","idea":["计算A+B的和,然后以每三位加一个”,”的格式输出~把a+b的和转为字符串s~除了第一位是负号的情况,只要当前位的下标i满足(i + 1) % 3 == len %3并且i不是最后一位,就在逐位输出的时候在该位输出后的后面加上一个逗号~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：计算A+B的和,然后以每三位加一个”,”的格式输出\nusing namespace std;\nint main() {\n   int a, b;\n\n   cin >> a >> b;\n   string s = to_string(a + b);\n   int len = s.length();\n   for (int i = 0; i \u003c len; i++) {\n      cout \u003c\u003c s[i];\n      if (s[i] == '-') continue;\n      if ((i + 1) % 3 == len % 3 && i != len - 1) cout \u003c\u003c \",\";\n   }\n   return 0;\n}"},{"id":"1002","title":"A+B for Polynomials","score":25,"category":"模拟","description":["This time, you are supposed to find A+B where A and B are two polynomials."],"input":"Each input file contains one test case. Each case occupies 2 lines, and each line contains the information of a polynomial: K N1 aN1 N2 aN2... NK aNK, where K is the number of nonzero terms in the polynomial, Ni and aNi (i=1, 2,..., K) are the exponents and coefficients, respectively. It is given\n\nthat 1 \u003c= K \u003c= 10,0 \u003c= NK \u003c... \u003c N2 \u003c N1 \u003c=1000.","output":"For each test case you should output the sum of A and B in one line, with the same format as the input. Notice that there must be NO extra space at the end of each line. Please be accurate to 1 decimal place.","samples":[{"input":"2 1 2.4 0 3.2\n2 2 1.5 1 0.5","output":"3 2 1.5 1 2.9 0 3.2","explanation":"","label":""}],"sampleInput":"2 1 2.4 0 3.2\n2 2 1.5 1 0.5","sampleOutput":"3 2 1.5 1 2.9 0 3.2","idea":["计算多项式A+B的和~设立c数组,长度为指数的最大值,c[i] = j表示指数i的系数为j,接收a和b输入的同时将对应指数的系数加入到c中,累计c中所有非零系数的个数,然后从后往前输出所有系数不为0的指数和系数~"],"keyPoints":["把题目流程拆成清晰状态逐步模拟，每一步只修改相关变量。","重点检查循环起止、下标边界和最后一项的输出格式。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：计算多项式A+B的和\nusing namespace std;\nint main() {\n   float c[1001] = {0};\n\n   int m, n, t;\n   float num;\n   scanf(\"%d\", &m);\n   for (int i = 0; i \u003c m; i++) {\n      scanf(\"%d%f\", &t, &num);\n      c[t] += num;\n   }\n   scanf(\"%d\", &n);\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d%f\", &t, &num);\n\n      c[t] += num;\n   }\n   int cnt = 0;\n   for (int i = 0; i \u003c 1001; i++) {\n      if (c[i] != 0) cnt++;\n   }\n   printf(\"%d\", cnt);\n   for (int i = 1000; i >= 0; i--) {\n      if (c[i] != 0.0)\n         printf(\" %d %.1f\", i, c[i]);\n\n   }\n\n   return 0;\n}"},{"id":"1003","title":"Emergency","score":25,"category":"Dijkstra算法","description":["As an emergency rescue team leader of a city, you are given a special map of your country. The map shows several scattered cities connected by some roads. Amount of rescue teams in each city and the length of each road between any pair of cities are marked on the map. When there is an emergency","call to you from some other city, your job is to lead your men to the place as quickly as possible, and at the mean time, call up as many hands on the way as possible."],"input":"Each input file contains one test case. For each test case, the first line contains 4 positive integers: N(\u003c= 500) – the number of cities (and the cities are numbered from 0 to N-1), M – the number of roads,C1 and C2 – the cities that you are currently in and that you must save, respectively. The next line\n\ncontains N integers, where the i-th integer is the number of rescue teams in the i-th city. Then M lines follow, each describes a road with three integers c1, c2 and L, which are the pair of cities connected by a road and the length of that road, respectively. It is guaranteed that there exists at least one path from\n\nC1 to C2.","output":"For each test case, print in one line two numbers: the number of different shortest paths between C1 and C2, and the maximum amount of rescue teams you can possibly gather.All the numbers in a line must be separated by exactly one space, and there is no extra space allowed\n\nat the end of a line.","samples":[{"input":"5 6 0 2\n1 2 1 5 3\n0 1 1\n0 2 2\n0 3 1\n1 2 1\n2 4 1\n3 4 1","output":"2 4","explanation":"","label":""}],"sampleInput":"5 6 0 2\n1 2 1 5 3\n0 1 1\n0 2 2\n0 3 1\n1 2 1\n2 4 1\n3 4 1","sampleOutput":"2 4","idea":["n个城市m条路,每个城市有救援小组,所有的边的边权已知。给定起点和终点,求从起点到终点的最短路径条数以及最短路径上的救援小组数目之和。如果有多条就输出点权(城市救援小组数目)最大的那个~用一遍Dijkstra算法~救援小组个数相当于点权,用Dijkstra求边权最小的最短路径的条数,以及这些最短路径中点权最大的值~","dis[i]表示从出发点到i结点最短路径的路径长度,num[i]表示从出发点到i结点最短路径的条数,w[i]表示从出发点到i点救援队的数目之和~","当判定dis[u] + e[u][v] \u003c dis[v]的时候,不仅仅要更新dis[v],还要更新num[v] = num[u], w[v] = weight[v] + w[u]; 如果dis[u] + e[u][v]== dis[v],还要更新num[v] += num[u],而且判断一下是否权重w[v]更小,如果更小了就更新w[v] = weight[v] + w[u];"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n\n// 解题关键：n个城市m条路,每个城市有救援小组,所有的边的边权已知\nusing namespace std;\nint n, m, c1, c2;\nint e[510][510], weight[510], dis[510], num[510], w[510];\nbool visited[510];\nconst int inf = 99999999;\nint main() {\n   scanf(\"%d%d%d%d\", &n, &m, &c1, &c2);\n   for(int i = 0; i \u003c n; i++)\n\n      scanf(\"%d\", &weight[i]);\n   fill(e[0], e[0] + 510 * 510, inf);\n   fill(dis, dis + 510, inf);\n   int a, b, c;\n   for(int i = 0; i \u003c m; i++) {\n      scanf(\"%d%d%d\", &a, &b, &c);\n      e[a][b] = e[b][a] = c;\n   }\n   dis[c1] = 0;\n\n   w[c1] = weight[c1];\n   num[c1] = 1;\n   for(int i = 0; i \u003c n; i++) {\n      int u = -1, minn = inf;\n      for(int j = 0; j \u003c n; j++) {\n         if(visited[j] == false && dis[j] \u003c minn) {\n             u = j;\n             minn = dis[j];\n         }\n      }\n\n      if(u == -1) break;\n      visited[u] = true;\n      for(int v = 0; v \u003c n; v++) {\n         if(visited[v] == false && e[u][v] != inf) {\n             if(dis[u] + e[u][v] \u003c dis[v]) {\n                dis[v] = dis[u] + e[u][v];\n                num[v] = num[u];\n                w[v] = w[u] + weight[v];\n             } else if(dis[u] + e[u][v] == dis[v]) {\n\n                num[v] = num[v] + num[u];\n                if(w[u] + weight[v] > w[v])\n                   w[v] = w[u] + weight[v];\n             }\n         }\n\n      }\n   }\n   printf(\"%d %d\", num[c2], w[c2]);\n   return 0;\n}"},{"id":"1004","title":"Counting Leaves","score":30,"category":"BFS,DFS,树的层序遍历","description":["A family hierarchy is usually presented by a pedigree tree. Your job is to count those family members who have no child."],"input":"Each input file contains one test case. Each case starts with a line containing 0 \u003c N \u003c 100, the number of nodes in a tree, and M (\u003c N), the number of non-leaf nodes. Then M lines follow, each in the format:ID K ID[1] ID[2]... ID[K]where ID is a two-digit number representing a given non-leaf node, K is the number of its children,\n\nfollowed by a sequence of two-digit ID’s of its children. For the sake of simplicity, let us fix the root ID to be 01.","output":"For each test case, you are supposed to count those family members who have no child for every seniority level starting from the root. The numbers must be printed in a line, separated by a space,and there must be no extra space at the end of each line.The sample case represents a tree with only 2 nodes, where 01 is the root and 02 is its only child.\n\nHence on the root 01 level, there is 0 leaf node; and on the next level, there is 1 leaf node. Then we should output “0 1” in a line.","samples":[{"input":"2 1\n01 1 02","output":"0 1","explanation":"","label":""}],"sampleInput":"2 1\n01 1 02","sampleOutput":"0 1","idea":["给出一棵树,问每一层各有多少个叶子结点~可以用dfs也可以用bfs~如果用dfs,用二维数组保存每一个有孩子结点的结点以及他们的孩子结点,从根结点开始遍历,直到遇到叶子结点,就将当前层数depth的book[depth]++;标记第depth层拥有的叶子结点数,最后输出~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003calgorithm>\n\n// 解题关键：给出一棵树,问每一层各有多少个叶子结点\nusing namespace std;\nvector\u003cint> v[100];\nint book[100], maxdepth = -1;\nvoid dfs(int index, int depth) {\n   if(v[index].size() == 0) {\n\n      book[depth]++;\n      maxdepth = max(maxdepth, depth);\n      return ;\n   }\n   for(int i = 0; i \u003c v[index].size(); i++)\n      dfs(v[index][i], depth + 1);\n}\nint main() {\n   int n, m, k, node, c;\n\n   scanf(\"%d %d\", &n, &m);\n   for(int i = 0; i \u003c m; i++) {\n      scanf(\"%d %d\",&node, &k);\n      for(int j = 0; j \u003c k; j++) {\n         scanf(\"%d\", &c);\n         v[node].push_back(c);\n      }\n   }\n   dfs(1, 0);\n   printf(\"%d\", book[0]);\n\n   for(int i = 1; i \u003c= maxdepth; i++)\n      printf(\" %d\", book[i]);\n   return 0;\n}"},{"id":"1005","title":"Spell It Right","score":20,"category":"字符串处理","description":["Given a non-negative integer N, your task is to compute the sum of all the digits of N, and output every digit of the sum in English."],"input":"Each input file contains one test case. Each case occupies one line which contains an N (\u003c= 10100).","output":"For each test case, output in one line the digits of the sum in English words. There must be one space between two consecutive words, but no extra space at the end of a line.","samples":[{"input":"12345","output":"one five","explanation":"","label":""}],"sampleInput":"12345","sampleOutput":"one five","idea":["给一个非负正数N,计算N的每一位相加的和,然后输出和的每一位的英文读音~1、求出每一位相加的和sum 2、将sum转换为string s 3、将string s的每一位输出对应的英文读音~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给一个非负正数N,计算N的每一位相加的和,然后输出和的每一位的英文读音\n\nusing namespace std;\nint main() {\n   string a;\n   cin >> a;\n   int sum = 0;\n   for (int i = 0; i \u003c a.length(); i++)\n      sum += (a[i] - '0');\n   string s = to_string(sum);\n   string arr[10] = {\"zero\", \"one\", \"two\", \"three\", \"four\", \"five\", \"six\", \"seven\", \"eight\", \"nine\"};\n\n   cout \u003c\u003c arr[s[0] - '0'];\n   for (int i = 1; i \u003c s.length(); i++)\n      cout \u003c\u003c \" \" \u003c\u003c arr[s[i] - '0'];\n   return 0;\n}"},{"id":"1006","title":"Sign In and Sign Out","score":25,"category":"查找元素","description":["At the beginning of every day, the first person who signs in the computer room will unlock the door,and the last one who signs out will lock the door. Given the records of signing in’s and out’s, you are supposed to find the ones who have unlocked and locked the door on that day."],"input":"Each input file contains one test case. Each case contains the records for one day. The case starts with a positive integer M, which is the total number of records, followed by M lines, each in the format:ID_number Sign_in_time Sign_out_time where times are given in the format HH:MM:SS, and ID number is a string with no more than 15\n\ncharacters.","output":"For each test case, output in one line the ID numbers of the persons who have unlocked and locked the door on that day. The two ID numbers must be separated by one space.Note: It is guaranteed that the records are consistent. That is, the sign in time must be earlier than the\n\nsign out time for each person, and there are no two persons sign in or out at the same moment.","samples":[{"input":"3\nCS301111 15:30:28 17:00:10\nSC3021234 08:00:00 11:25:25\nCS301133 21:45:00 21:58:40","output":"SC3021234 CS301133","explanation":"","label":""}],"sampleInput":"3\nCS301111 15:30:28 17:00:10\nSC3021234 08:00:00 11:25:25\nCS301133 21:45:00 21:58:40","sampleOutput":"SC3021234 CS301133","idea":["给出n个人的id、sign in时间、sign out时间,求最早进来的人和最早出去的人的ID~将时间都转换为总秒数,最早和最迟的时间保存在变量minn和maxn中,并同时保存当前最早和最迟的人的ID,最后输出~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出n个人的id、sign in时间、sign out时间,求最早进来的人和最早出去的人的ID\n\n#include \u003cclimits>\nusing namespace std;\nint main() {\n   int n, minn = INT_MAX, maxn = INT_MIN;\n   scanf(\"%d\", &n);\n   string unlocked, locked;\n   for(int i = 0; i \u003c n; i++) {\n      string t;\n      cin >> t;\n      int h1, m1, s1, h2, m2, s2;\n\n      scanf(\"%d:%d:%d %d:%d:%d\", &h1, &m1, &s1, &h2, &m2, &s2);\n      int tempIn = h1 * 3600 + m1 * 60 + s1;\n      int tempOut = h2 * 3600 + m2 * 60 + s2;\n      if (tempIn \u003c minn) {\n         minn = tempIn;\n         unlocked = t;\n      }\n      if (tempOut > maxn) {\n         maxn = tempOut;\n\n         locked = t;\n      }\n   }\n   cout \u003c\u003c unlocked \u003c\u003c \" \" \u003c\u003c locked;\n   return 0;\n}"},{"id":"1007","title":"Maximum Subsequence Sum","score":25,"category":"动态规划,最大连续子序列和","description":["Given a sequence of K integers { N1, N2,..., NK }. A continuous subsequence is defined to be { Ni,Ni+1,..., Nj } where 1 \u003c= i \u003c= j \u003c= K. The Maximum Subsequence is the continuous subsequence which has the largest sum of its elements. For example, given sequence { -2, 11, -4, 13, -5, -2 }, its","maximum subsequence is { 11, -4, 13 } with the largest sum being 20.Now you are supposed to find the largest sum, together with the first and the last numbers of the maximum subsequence."],"input":"Each input file contains one test case. Each case occupies two lines. The first line contains a positive integer K (\u003c= 10000). The second line contains K numbers, separated by a space.","output":"For each test case, output in one line the largest sum, together with the first and the last numbers of the maximum subsequence. The numbers must be separated by one space, but there must be no extra space at the end of a line. In case that the maximum subsequence is not unique, output the one with\n\nthe smallest indices i and j (as shown by the sample case). If all the K numbers are negative, then its maximum sum is defined to be 0, and you are supposed to output the first and the last numbers of the whole sequence.","samples":[{"input":"10\n-10 1 2 3 4 -5 -23 3 7 -21","output":"10 1 4","explanation":"","label":""}],"sampleInput":"10\n-10 1 2 3 4 -5 -23 3 7 -21","sampleOutput":"10 1 4","idea":["求最大连续子序列和,输出最大的和以及这个子序列的开始值和结束值。如果所有数都小于0,那么认为最大的和为0,并且输出首尾元素~sum为要求的最大和,temp为临时最大和,leftindex和rightindex为所求的子序列的下标,tempindex标记left的临时下标~","temp = temp + v[i],当temp比sum大,就更新sum的值、leftindex和rightindex的值;当temp \u003c 0,那么后面不管来什么值,都应该舍弃temp \u003c 0前面的内容,因为负数对于总和只可能拉低总和,不可能增加总和,还不如舍弃~舍弃后,直接令temp = 0,并且同时更新left的临时值tempindex。","因为对于所有的值都为负数的情况要输出0,第一个值,最后一个值,所以在输入的时候用flag判断是不是所有的数字都是小于0的,如果是,要在输入的时候特殊处理~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：求最大连续子序列和,输出最大的和以及这个子序列的开始值和结束值\nusing namespace std;\n\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   vector\u003cint> v(n);\n   int leftindex = 0, rightindex = n - 1, sum = -1, temp = 0, tempindex =\n\n0;\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &v[i]);\n      temp = temp + v[i];\n      if (temp \u003c 0) {\n         temp = 0;\n         tempindex = i + 1;\n      } else if (temp > sum) {\n         sum = temp;\n         leftindex = tempindex;\n\n         rightindex = i;\n      }\n   }\n   if (sum \u003c 0) sum = 0;\n   printf(\"%d %d %d\", sum, v[leftindex], v[rightindex]);\n   return 0;\n}"},{"id":"1008","title":"Elevator","score":20,"category":"数学问题","description":["The highest building in our city has only one elevator. A request list is made up with N positive numbers. The numbers denote at which floors the elevator will stop, in specified order. It costs 6 seconds to move the elevator up one floor, and 4 seconds to move down one floor. The elevator will","stay for 5 seconds at each stop.For a given request list, you are to compute the total time spent to fulfill the requests on the list. The elevator is on the 0th floor at the beginning and does not have to return to the ground floor when the requests are fulfilled."],"input":"Each input file contains one test case. Each case contains a positive integer N, followed by N positive numbers. All the numbers in the input are less than 100.","output":"For each test case, print the total time on a single line.","samples":[{"input":"3 2 3 1","output":"41","explanation":"","label":""}],"sampleInput":"3 2 3 1","sampleOutput":"41","idea":["电梯从0层开始向上,给出该电梯依次按顺序停的楼层数,并且已知上升需要6秒/层,下降需要4秒/层,停下来的话需要停5秒,问走完所有需要停的楼层后总共花了多少时间~累加计算输出~","now表示现在的层数,a表示将要去的层数,当a > now,电梯上升,需要6 * (a –now)秒,当a \u003c now,电梯下降,需要4 * (now – a)秒,每一次需要停5秒,最后输出累加的结果sum~"],"keyPoints":["先推导等价公式再编码，避免直接按定义做不必要的重复计算。","乘法、累加或组合计数可能超出 int，应按范围选择 long long。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：电梯从0层开始向上,给出该电梯依次按顺序停的楼层数,并且已知上升需要6秒/层,下降需要4秒/层,停下来的话需要停5秒,问走完所有需要停的楼层后总共花了多少时间\nusing namespace std;\nint main() {\n   int a, now = 0, sum = 0;\n   cin >> a;\n   while(cin >> a) {\n      if(a > now)\n         sum = sum + 6 * (a - now);\n\n      else\n         sum = sum + 4 * (now - a);\n      now = a;\n      sum += 5;\n   }\n   cout \u003c\u003c sum;\n   return 0;\n}"},{"id":"1009","title":"Product of Polynomials","score":25,"category":"模拟","description":["This time, you are supposed to find A*B where A and B are two polynomials."],"input":"Each input file contains one test case. Each case occupies 2 lines, and each line contains the information of a polynomial: K N1 aN1 N2 aN2... NK aNK, where K is the number of nonzero terms in the polynomial, Ni and aNi (i=1, 2,..., K) are the exponents and coefficients, respectively. It is given\n\nthat 1 \u003c= K \u003c= 10, 0 \u003c= NK \u003c... \u003c N2 \u003c N1 \u003c=1000.","output":"For each test case you should output the product of A and B in one line, with the same format as the input. Notice that there must be NO extra space at the end of each line. Please be accurate up to 1 decimal place.","samples":[{"input":"2 1 2.4 0 3.2\n2 2 1.5 1 0.5","output":"3 3 3.6 2 6.0 1 1.6","explanation":"","label":""}],"sampleInput":"2 1 2.4 0 3.2\n2 2 1.5 1 0.5","sampleOutput":"3 3 3.6 2 6.0 1 1.6","idea":["给出两个多项式A和B,求A*B的结果~简单模拟~double类型的arr数组保存第一组数据,ans数组保存结果。当输入第二组数据的时候,一边进行运算一边保存结果。最后按照指数递减的顺序输出所有不为0的项~注意:因为相乘后指数可能最大为2000,所以ans数组最大要开到2001"],"keyPoints":["把题目流程拆成清晰状态逐步模拟，每一步只修改相关变量。","重点检查循环起止、下标边界和最后一项的输出格式。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出两个多项式A和B,求A*B的结果\nusing namespace std;\nint main() {\n   int n1, n2, a, cnt = 0;\n   scanf(\"%d\", &n1);\n   double b, arr[1001] = {0.0}, ans[2001] = {0.0};\n   for(int i = 0; i \u003c n1; i++) {\n      scanf(\"%d %lf\", &a, &b);\n      arr[a] = b;\n   }\n\n   scanf(\"%d\", &n2);\n   for(int i = 0; i \u003c n2; i++) {\n      scanf(\"%d %lf\", &a, &b);\n      for(int j = 0; j \u003c 1001; j++)\n             ans[j + a] += arr[j] * b;\n   }\n   for(int i = 2000; i >= 0; i--)\n      if(ans[i] != 0.0) cnt++;\n   printf(\"%d\", cnt);\n\n   for(int i = 2000; i >= 0; i--)\n      if(ans[i] != 0.0)\n         printf(\" %d %.1f\", i, ans[i]);\n   return 0;\n}"},{"id":"1010","title":"Radix","score":25,"category":"二分法","description":["Given a pair of positive integers, for example, 6 and 110, can this equation 6 = 110 be true? The answer is “yes”, if 6 is a decimal number and 110 is a binary number.Now for any pair of positive integers N1 and N2, your task is to find the radix of one number while","that of the other is given."],"input":"Each input file contains one test case. Each case occupies a line which contains 4 positive integers:N1 N2 tag radix Here N1 and N2 each has no more than 10 digits. A digit is less than its radix and is chosen from the set {0-9, a-z} where 0-9 represent the decimal numbers 0-9, and a-z represent the decimal numbers 10-\n\n35. The last number “radix” is the radix of N1 if “tag” is 1, or of N2 if “tag” is 2.","output":"For each test case, print in one line the radix of the other number so that the equation N1 = N2 is true.If the equation is impossible, print “Impossible”. If the solution is not unique, output the smallest possible radix.","samples":[{"input":"6 110 1 10","output":"2","explanation":"","label":"1"},{"input":"1 ab 1 2","output":"Impossible","explanation":"","label":"2"}],"sampleInput":"6 110 1 10","sampleOutput":"2","idea":["convert函数:给定一个数值和一个进制,将它转化为10进制。转化过程中可能产生溢出find_radix函数:找到令两个数值相等的进制数。在查找的过程中,需要使用二分查找算法,如果使用当前进制转化得到数值比另一个大或者小于0,说明这个进制太大~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003ccctype>\n#include \u003calgorithm>\n#include \u003ccmath>\n\n// 解题关键：convert函数:给定一个数值和一个进制,将它转化为10进制\nusing namespace std;\nlong long convert(string n, long long radix) {\n   long long sum = 0;\n   int index = 0, temp = 0;\n   for (auto it = n.rbegin(); it != n.rend(); it++) {\n      temp = isdigit(*it) ? *it - '0' : *it - 'a' + 10;\n\n      sum += temp * pow(radix, index++);\n   }\n   return sum;\n}\nlong long find_radix(string n, long long num) {\n   char it = *max_element(n.begin(), n.end());\n   long long low = (isdigit(it) ? it - '0': it - 'a' + 10) + 1;\n   long long high = max(num, low);\n   while (low \u003c= high) {\n\n      long long mid = (low + high) / 2;\n      long long t = convert(n, mid);\n      if (t \u003c 0 || t > num) high = mid - 1;\n      else if (t == num) return mid;\n      else low = mid + 1;\n   }\n\n   return -1;\n}\nint main() {\n   string n1, n2;\n   long long tag = 0, radix = 0, result_radix;\n\n   cin >> n1 >> n2 >> tag >> radix;\n   result_radix = tag == 1 ? find_radix(n2, convert(n1, radix)) : find_radix(n1, convert(n2, radix));\n   if (result_radix != -1) {\n      printf(\"%lld\", result_radix);\n   } else {\n      printf(\"Impossible\");\n   }\n   return 0;\n}"},{"id":"1011","title":"World Cup Betting","score":20,"category":"查找元素","description":["With the 2010 FIFA World Cup running, football fans the world over were becoming increasingly excited as the best players from the best teams doing battles for the World Cup trophy in South Africa. Similarly, football betting fans were putting their money where their mouths were, by laying","all manner of World Cup bets.Chinese Football Lottery provided a “Triple Winning” game. The rule of winning was simple: first select any three of the games. Then for each selected game, bet on one of the three possible results —namely W for win, T for tie, and L for lose. There was an odd assigned to each result. The winner’s","odd would be the product of the three odds times 65%.For example, 3 games’ odds are given as the following:W T L 1.1 2.5 1.7 1.2 3.0 1.6 4.1 1.2 1.1 To obtain the maximum profit, one must buy W for the 3rd game, T for the 2nd game, and T for the 1st game. If each bet takes 2 yuans, then the maximum profit would be (4.1*3.0*2.5*65%-1)*2 = 37.98","yuans (accurate up to 2 decimal places)."],"input":"Each input file contains one test case. Each case contains the betting information of 3 games. Each game occupies a line with three distinct odds corresponding to W, T and L.","output":"For each test case, print in one line the best bet of each game, and the maximum profit accurate up to 2 decimal places. The characters and the number must be separated by one space.","samples":[{"input":"1.1 2.5 1.7\n1.2 3.0 1.6\n4.1 1.2 1.1","output":"T T W 37.98","explanation":"","label":""}],"sampleInput":"1.1 2.5 1.7\n1.2 3.0 1.6\n4.1 1.2 1.1","sampleOutput":"T T W 37.98","idea":["给出三场比赛以及每场比赛的W、T、L的赔率,选取每一场比赛中赔率最大的三个数a b c,先输出三行各自选择的是W、T、L中的哪一个,然后根据计算公式 (a * b * c * 0.65 – 1) * 2 得出最大收益~以三个数一组的形式读取,读取完一组后输出最大值代表的字母,然后同时ans累乘该最大值,最后根据公式输出结果~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：给出三场比赛以及每场比赛的W、T、L的赔率,选取每一场比赛中赔率最大的三个数a b c,先输出三行各自选择的是W、T、L中的哪一个,然后根据计算公式 (a * b * c * 0.65 – 1) * 2 得出最大收益\nusing namespace std;\nint main() {\n   char c[4] = {\"WTL\"};\n   double ans = 1.0;\n   for(int i = 0; i \u003c 3; i++) {\n      double maxvalue = 0.0;\n      int maxchar = 0;\n\n      for(int j = 0; j \u003c 3; j++) {\n         double temp;\n         scanf(\"%lf\", &temp);\n         if(maxvalue \u003c= temp) {\n             maxvalue = temp;\n             maxchar = j;\n         }\n      }\n      ans *= maxvalue;\n      printf(\"%c \", c[maxchar]);\n\n   }\n   printf(\"%.2f\", (ans * 0.65 - 1) * 2);\n   return 0;\n}"},{"id":"1012","title":"The Best Rank","score":25,"category":"排序","description":["To evaluate the performance of our first year CS majored students, we consider their grades of three courses only: C – C Programming Language, M – Mathematics (Calculus or Linear Algebra), and E –English. At the mean time, we encourage students by emphasizing on their best ranks — that is,","among the four ranks with respect to the three courses and the average grade, we print the best rank for each student.For example, The grades of C, M, E and A – Average of 4 students are given as the following:StudentID C M E A 310101 98 85 88 90 310102 70 95 88 84","310103 82 87 94 88 310104 91 91 91 91 Then the best ranks for all the students are No.1 since the 1st one has done the best in C Programming Language, while the 2nd one in Mathematics, the 3rd one in English, and the last one in average."],"input":"Each input file contains one test case. Each case starts with a line containing 2 numbers N and M(\u003c=2000), which are the total number of students, and the number of students who would check their ranks, respectively. Then N lines follow, each contains a student ID which is a string of 6 digits,\n\nfollowed by the three integer grades (in the range of [0, 100]) of that student in the order of C, M and E. Then there are M lines, each containing a student ID.","output":"For each of the M students, print in one line the best rank for him/her, and the symbol of the corresponding rank, separated by a space.The priorities of the ranking methods are ordered as A > C > M > E. Hence if there are two or more ways for a student to obtain the same best rank, output the one with the highest priority.\n\nIf a student is not on the grading list, simply output “N/A”.","samples":[{"input":"5 6\n310101 98 85 88\n310102 70 95 88\n310103 82 87 94\n310104 91 91 91\n310105 85 90 90\n310101\n310102\n310103\n310104\n310105\n999999","output":"1 C\n1 M\n1 E\n1 A\n3 A\nN/A","explanation":"","label":""}],"sampleInput":"5 6\n310101 98 85 88\n310102 70 95 88\n310103 82 87 94\n310104 91 91 91\n310105 85 90 90\n310101\n310102\n310103\n310104\n310105\n999999","sampleOutput":"1 C\n1 M\n1 E\n1 A\n3 A\nN/A","idea":["现已知n个考生的3门分数,平均分可以按照这三门算出来。然后分别对这四个分数从高到低排序,这样对每个考生来说有4个排名。k个查询,对于每一个学生id,输出当前id学生的最好的排名和它对应的分数,如果名次相同,按照A>C>M>E的顺序输出~如果当前id不存在,输出N/A~1、用结构体存储学生的id、四门成绩、四门排名、最好的排名的对应的科目下标~","2、排名并列应该1、1、3、4、5,而不是1、1、2、3、4,否则会有一个测试点不过3、平均分是四舍五入的,所以需要按照+0.5后取整,保证是四舍五入的(听说不四舍五入也能通过...)4、存储的时候就按照ACME的顺序存储可以简化程序逻辑~5、用exist数组保存当前id是否存在,这个id对应的stu结构体的下标是多少。","用i+1可以保证为0的都是不存在的可以直接输出N/A,其余不为0的保存的值是对应的结构体index + 1的值~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003calgorithm>\n\n// 解题关键：现已知n个考生的3门分数,平均分可以按照这三门算出来\nusing namespace std;\nstruct node {\n   int id, best;\n   int score[4], rank[4];\n}stu[2005];\nint exist[1000000], flag = -1;\nbool cmp1(node a, node b) {return a.score[flag] > b.score[flag];}\nint main() {\n\n   int n, m, id;\n   scanf(\"%d %d\", &n, &m);\n   for(int i = 0; i \u003c n; i++) {\n      scanf(\"%d %d %d %d\", &stu[i].id, &stu[i].score[1], &stu[i].score[2], &stu[i].score[3]);\n\n      stu[i].score[0] = (stu[i].score[1] + stu[i].score[2] + stu[i].score[3]) / 3.0 + 0.5;\n   }\n   for(flag = 0; flag \u003c= 3; flag++) {\n      sort(stu, stu + n, cmp1);\n\n      stu[0].rank[flag] = 1;\n      for(int i = 1; i \u003c n; i++) {\n         stu[i].rank[flag] = i + 1;\n         if(stu[i].score[flag] == stu[i-1].score[flag])\n             stu[i].rank[flag] = stu[i-1].rank[flag];\n      }\n   }\n   for(int i = 0; i \u003c n; i++) {\n      exist[stu[i].id] = i + 1;\n      stu[i].best = 0;\n\n      int minn = stu[i].rank[0];\n      for(int j = 1; j \u003c= 3; j++) {\n         if(stu[i].rank[j] \u003c minn) {\n             minn = stu[i].rank[j];\n             stu[i].best = j;\n         }\n      }\n   }\n   char c[5] = {'A', 'C', 'M', 'E'};\n\n   for(int i = 0; i \u003c m; i++) {\n      scanf(\"%d\", &id);\n      int temp = exist[id];\n      if(temp) {\n         int best = stu[temp-1].best;\n         printf(\"%d %c\\n\", stu[temp-1].rank[best], c[best]);\n      } else {\n         printf(\"N/A\\n\");\n      }\n   }\n\n   return 0;\n}"},{"id":"1013","title":"Battle Over Cities","score":25,"category":"图的遍历,统计连通分量的个数,DFS","description":["It is vitally important to have all the cities connected by highways in a war. If a city is occupied by the enemy, all the highways from/toward that city are closed. We must know immediately if we need to repair any other highways to keep the rest of the cities connected. Given the map of cities which have","all the remaining highways marked, you are supposed to tell the number of highways need to be repaired, quickly.For example, if we have 3 cities and 2 highways connecting city1-city2 and city1-city3. Then if city1 is occupied by the enemy, we must have 1 highway repaired, that is the highway city2-city3."],"input":"Each input file contains one test case. Each case starts with a line containing 3 numbers N (\u003c1000), M and K, which are the total number of cities, the number of remaining highways, and the number of cities to be checked, respectively. Then M lines follow, each describes a highway by 2 integers, which\n\nare the numbers of the cities the highway connects. The cities are numbered from 1 to N. Finally there is a line containing K numbers, which represent the cities we concern.","output":"For each of the K cities, output in a line the number of highways need to be repaired if that city is lost.","samples":[{"input":"3 2 3\n1 2\n1 3\n1 2 3","output":"1\n0\n0","explanation":"","label":""}],"sampleInput":"3 2 3\n1 2\n1 3\n1 2 3","sampleOutput":"1\n0\n0","idea":["给出n个城市之间有相互连接的m条道路,当删除一个城市和其连接的道路的时候,问其他几个剩余的城市至少要添加多少个路线才能让它们重新变为连通图分析:添加的最少的路线,就是他们的连通分量数-1,因为当a个互相分立的连通分量需要变为连通图的时候,只需要添加a-1个路线,就能让他们相连。","所以这道题就是求去除了某个结点之后其他的图所拥有的连通分量数使用邻接矩阵存储,对于每一个被占领的城市,去除这个城市结点,就是把它标记为已经访问过,这样在深度优先遍历的时候,对于所有未访问的结点进行遍历,就能求到所有的连通分量的个数~记得因为 有很多个要判断的数据,每一次输入被占领的城市之前要把visit数组置为false~~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：给出n个城市之间有相互连接的m条道路,当删除一个城市和其连接的道路的时候,问其他几个剩余的城市至少要添加多少个路线才能让它们重新变为连通图分析:添加的最少的路线,就是他们的连通分量数-1,因为当a个互相分立的连通分量需要\n\n#include \u003calgorithm>\nusing namespace std;\nint v[1010][1010];\nbool visited[1010];\nint n;\nvoid dfs(int node) {\n   visited[node] = true;\n   for(int i = 1; i \u003c= n; i++) {\n      if(visited[i] == false && v[node][i] == 1)\n         dfs(i);\n\n   }\n}\n\nint main() {\n   int m, k, a, b;\n   scanf(\"%d%d%d\", &n, &m, &k);\n   for(int i = 0; i \u003c m; i++) {\n      scanf(\"%d%d\", &a, &b);\n\n      v[a][b] = v[b][a] = 1;\n   }\n   for(int i = 0; i \u003c k; i++) {\n      fill(visited, visited + 1010, false);\n      scanf(\"%d\", &a);\n      int cnt = 0;\n      visited[a] = true;\n      for(int j = 1; j \u003c= n; j++) {\n         if(visited[j] == false) {\n             dfs(j);\n\n             cnt++;\n         }\n      }\n      printf(\"%d\\n\", cnt - 1);\n   }\n   return 0;\n}"},{"id":"1014","title":"Waiting in Line","score":30,"category":"queue的应用","description":["Suppose a bank has N windows open for service. There is a yellow line in front of the windows which devides the waiting area into two parts. The rules for the customers to wait in line are:The space inside the yellow line in front of each window is enough to contain a line with M","customers. Hence when all the N lines are full, all the customers after (and including) the (NM+1)st one will have to wait in a line behind the yellow line.Each customer will choose the shortest line to wait in when crossing the yellow line. If there are two or more lines with the same length, the customer will always choose the window with the smallest","number.Customer[i] will take T[i] minutes to have his/her transaction processed.The first N customers are assumed to be served at 8:00am.Now given the processing time of each customer, you are supposed to tell the exact time at which a customer has his/her business done.","For example, suppose that a bank has 2 windows and each window may have 2 custmers waiting inside the yellow line. There are 5 customers waiting with transactions taking 1, 2, 6, 4 and 3 minutes,respectively. At 08:00 in the morning, customer1 is served at window1 while customer2 is served at","window2. Customer3 will wait in front of window1 and customer4 will wait in front of window2.Customer5 will wait behind the yellow line.At 08:01, customer1 is done and customer5 enters the line in front of window1 since that line seems shorter now. Customer2 will leave at 08:02, customer4 at 08:06, customer3 at 08:07, and finally","customer5 at 08:10."],"input":"Each input file contains one test case. Each case starts with a line containing 4 positive integers: N(\u003c=20, number of windows), M (\u003c=10, the maximum capacity of each line inside the yellow line), K(\u003c=1000, number of customers), and Q (\u003c=1000, number of customer queries).\n\nThe next line contains K positive integers, which are the processing time of the K customers.The last line contains Q positive integers, which represent the customers who are asking about the time they can have their transactions done. The customers are numbered from 1 to K.","output":"For each of the Q customers, print in one line the time at which his/her transaction is finished, in the format HH:MM where HH is in [08, 17] and MM is in [00, 59]. Note that since the bank is closed everyday after 17:00, for those customers who cannot be served before 17:00, you must output\n\n“Sorry” instead.","samples":[{"input":"2 2 7 5\n1 2 6 4 3 534 2\n3 4 5 6 7","output":"08:07\n08:06\n08:10\n17:00\nSorry","explanation":"","label":""}],"sampleInput":"2 2 7 5\n1 2 6 4 3 534 2\n3 4 5 6 7","sampleOutput":"08:07\n08:06\n08:10\n17:00\nSorry","idea":["n个窗又,每个窗又可以排队m人。有k位用户需要服务,给出了每位用户需要的minute数,所有客户在8点开始服务,如果有窗又还没排满就入队,否则就在黄线外等候。如果有某一列有一个用户走了服务完毕了,黄线外的人就进来一个。如果同时就选窗又数小的。求q个人的服务结束时间。","如果一个客户在17:00以及以后还没有开始服务(此处不是结束服务是开始17:00)就不再服务输出sorry;如果这个服务已经开始了,无论时间多长都要等他服务完毕。设立结构体,里面包含poptime为队首的人出队(结束)的时间,和endtime为队尾的人结束的时间。","poptime是为了让黄线外的人可以计算出哪一个队列先空出人来(poptime最小的那个先有人服务完毕),endtime是为了入队后加上自己本身的服务所需时间可以计算出自己多久才能被服务完毕~且前一个人的endtime可以得知自己是不是需要被Sorry(如果前一个人服务结束时间超过17:00,自己当前入队的人就是sorry),还有一个queue表示所有当前该窗又的排队队列。","对于前m*n个人,也就是排的下的情况下,所有人依次到窗又前面排队。对于m*n之后的人,当前人选择poptime最短的入队,让队伍的第一个人出列),如果前面一个人导致的endtime超过17点就标记自己的sorry为true。计算时间的时候按照分钟计算,最后再考虑08点开始和转换为小时分钟的形式会比较简便。"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cqueue>\n\n// 解题关键：n个窗又,每个窗又可以排队m人\n\n#include \u003cvector>\nusing namespace std;\nstruct node {\n   int poptime, endtime;\n   queue\u003cint> q;\n};\nint main() {\n   int n, m, k, q, index = 1;\n   scanf(\"%d%d%d%d\", &n, &m, &k, &q);\n   vector\u003cint> time(k + 1), result(k + 1);\n\n   for(int i = 1; i \u003c= k; i++) {\n      scanf(\"%d\", &time[i]);\n   }\n   vector\u003cnode> window(n + 1);\n   vector\u003cbool> sorry(k + 1, false);\n   for(int i = 1; i \u003c= m; i++) {\n      for(int j = 1; j \u003c= n; j++) {\n         if(index \u003c= k) {\n             window[j].q.push(time[index]);\n\n             if(window[j].endtime >= 540)\n                sorry[index] = true;\n             window[j].endtime += time[index];\n             if(i == 1)\n                window[j].poptime = window[j].endtime;\n             result[index] = window[j].endtime;\n             index++;\n         }\n\n      }\n\n   }\n   while(index \u003c= k) {\n      int tempmin = window[1].poptime, tempwindow = 1;\n      for(int i = 2; i \u003c= n; i++) {\n         if(window[i].poptime \u003c tempmin) {\n             tempwindow = i;\n\n             tempmin = window[i].poptime;\n         }\n      }\n      window[tempwindow].q.pop();\n      window[tempwindow].q.push(time[index]);\n\n      window[tempwindow].poptime += window[tempwindow].q.front();\n      if(window[tempwindow].endtime >= 540)\n         sorry[index] = true;\n      window[tempwindow].endtime += time[index];\n      result[index] = window[tempwindow].endtime;\n      index++;\n   }\n   for(int i = 1; i \u003c= q; i++) {\n      int query, minute;\n      scanf(\"%d\", &query);\n\n      minute = result[query];\n      if(sorry[query] == true) {\n         printf(\"Sorry\\n\");\n      } else {\n         printf(\"%02d:%02d\\n\",(minute + 480) / 60, (minute + 480) % 60);\n      }\n   }\n   return 0;\n}"},{"id":"1015","title":"Reversible Primes","score":20,"category":"素数","description":["A reversible prime in any number system is a prime whose “reverse” in that number system is also a prime. For example in the decimal system 73 is a reversible prime because its reverse 37 is also a prime.Now given any two positive integers N (\u003c 10^5) and D (1 \u003c D \u003c= 10), you are supposed to tell if N is a","reversible prime with radix D."],"input":"The input file consists of several test cases. Each case occupies a line which contains two integers N and D. The input is finished by a negative N.","output":"For each test case, print in one line “Yes” if N is a reversible prime with radix D, or “No” if not.","samples":[{"input":"73 10\n23 2\n23 10\n-2","output":"Yes\nYes\nNo","explanation":"","label":""}],"sampleInput":"73 10\n23 2\n23 10\n-2","sampleOutput":"Yes\nYes\nNo","idea":["如果一个数本身是素数,而且在d进制下反转后的数在十进制下也是素数,就输出Yes,否则就输出No分析:判断输入是否为负数,判断n是否为素数,把n转换为d进制再反过来转换为10进制,判断是否为素数"],"keyPoints":["判断素数时要单独处理 0、1，并枚举到平方根即可。","连续区间内多次判素时可根据数据规模选择筛法。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n#include \u003ccmath>\n\n// 解题关键：如果一个数本身是素数,而且在d进制下反转后的数在十进制下也是素数,就输出Yes,否则就输出No分析:判断输入是否为负数,判断n是否为素数,把n转换为d进制再反过来转换为10进制,判断是否为素数\nusing namespace std;\nbool isprime(int n) {\n   if(n \u003c= 1) return false;\n   int sqr = int(sqrt(n * 1.0));\n   for(int i = 2; i \u003c= sqr; i++) {\n      if(n % i == 0)\n         return false;\n   }\n\n   return true;\n}\nint main() {\n   int n, d;\n   while(scanf(\"%d\", &n) != EOF) {\n      if(n \u003c 0) break;\n      scanf(\"%d\", &d);\n      if(isprime(n) == false) {\n         printf(\"No\\n\");\n\n         continue;\n      }\n      int len = 0, arr[100];\n      do{\n         arr[len++] = n % d;\n         n = n / d;\n      }while(n != 0);\n      for(int i = 0; i \u003c len; i++)\n         n = n * d + arr[i];\n      printf(\"%s\", isprime(n) ? \"Yes\\n\" : \"No\\n\");\n\n   }\n   return 0;\n}"},{"id":"1016","title":"Phone Bills","score":25,"category":"排序","description":["A long-distance telephone company charges its customers by the following rules:Making a long-distance call costs a certain amount per minute, depending on the time of day when the call is made. When a customer starts connecting a long-distance call, the time will be recorded,","and so will be the time when the customer hangs up the phone. Every calendar month, a bill is sent to the customer for each minute called (at a rate determined by the time of day). Your job is to prepare the bills for each month, given a set of phone call records."],"input":"Each input file contains one test case. Each case has two parts: the rate structure, and the phone call records.The rate structure consists of a line with 24 non-negative integers denoting the toll (cents/minute)from 00:00 – 01:00, the toll from 01:00 – 02:00, and so on for each hour in the day.\n\nThe next line contains a positive number N (\u003c= 1000), followed by N lines of records. Each phone call record consists of the name of the customer (string of up to 20 characters without space), the time and date (mm:dd:hh:mm), and the word “on-line” or “off-line”.\n\nFor each test case, all dates will be within a single month. Each “on-line” record is paired with the chronologically next record for the same customer provided it is an “off-line” record. Any “on-line”records that are not paired with an “off-line” record are ignored, as are “off-line” records not paired\n\nwith an “on-line” record. It is guaranteed that at least one call is well paired in the input. You may assume that no two records for the same customer have the same time. Times are recorded using a 24-hour clock.","output":"For each test case, you must print a phone bill for each customer.Bills must be printed in alphabetical order of customers’ names. For each customer, first print in a line the name of the customer and the month of the bill in the format shown by the sample. Then for each\n\ntime period of a call, print in one line the beginning and ending time and date (dd:hh:mm), the lasting time (in minute) and the charge of the call. The calls must be listed in chronological order. Finally,print the total charge for the month in the format shown by the sample.","samples":[{"input":"10 10 10 10 10 10 20 20 20 15 15 15 15 15 15 15 20 30 20 15 15 10 10 10\n10\nCYLL 01:01:06:01 on-line\nCYLL 01:28:16:05 off-line\nCYJJ 01:01:07:00 off-line\nCYLL 01:01:08:03 off-line\nCYJJ 01:01:05:59 on-line\naaa 01:01:01:03 on-line\naaa 01:02:00:01 on-line\nCYLL 01:28:15:41 on-line\naaa 01:05:02:24 on-line\naaa 01:04:23:59 off-line","output":"CYJJ 01\n01:05:59 01:07:00 61 $12.10\nTotal amount: $12.10\nCYLL 01\n01:06:01 01:08:03 122 $24.40\n28:15:41 28:16:05 24 $3.85\nTotal amount: $28.25\naaa 01\n02:00:01 04:23:59 4318 $638.80\nTotal amount: $638.80","explanation":"","label":""}],"sampleInput":"10 10 10 10 10 10 20 20 20 15 15 15 15 15 15 15 20 30 20 15 15 10 10 10\n10\nCYLL 01:01:06:01 on-line\nCYLL 01:28:16:05 off-line\nCYJJ 01:01:07:00 off-line\nCYLL 01:01:08:03 off-line\nCYJJ 01:01:05:59 on-line\naaa 01:01:01:03 on-line\naaa 01:02:00:01 on-line\nCYLL 01:28:15:41 on-line\naaa 01:05:02:24 on-line\naaa 01:04:23:59 off-line","sampleOutput":"CYJJ 01\n01:05:59 01:07:00 61 $12.10\nTotal amount: $12.10\nCYLL 01\n01:06:01 01:08:03 122 $24.40\n28:15:41 28:16:05 24 $3.85\nTotal amount: $28.25\naaa 01\n02:00:01 04:23:59 4318 $638.80\nTotal amount: $638.80","idea":["将给出的数据先按照姓名排序,再按照时间的先后顺序排列,这样遍历的时候,前后两个名字相同且前面的状态为on-line后面一个的状态为off-line的就是合格数据~注意:【关于最后一个测试点】计算费用从00:00:00到dd:hh:mm计算可以避免跨天的问题,比如01:12:00到02:02:00"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n#include \u003cvector>\n#include \u003calgorithm>\n\n// 解题关键：将给出的数据先按照姓名排序,再按照时间的先后顺序排列,这样遍历的时候,前后两个名字相同且前面的状态为on-line后面一个的状态为off-line的就是合格数据\n\nusing namespace std;\nstruct node {\n   string name;\n   int status, month, time, day, hour, minute;\n};\nbool cmp(node a, node b) {\n   return a.name != b.name ? a.name \u003c b.name : a.time \u003c b.time;\n}\ndouble billFromZero(node call, int *rate) {\n\n   double total = rate[call.hour] * call.minute + rate[24] * 60 * call.day;\n   for (int i = 0; i \u003c call.hour; i++)\n      total += rate[i] * 60;\n   return total / 100.0;\n}\n\nint main() {\n   int rate[25] = {0}, n;\n   for (int i = 0; i \u003c 24; i++) {\n      scanf(\"%d\", &rate[i]);\n      rate[24] += rate[i];\n   }\n   scanf(\"%d\", &n);\n   vector\u003cnode> data(n);\n   for (int i = 0; i \u003c n; i++) {\n      cin >> data[i].name;\n\n      scanf(\"%d:%d:%d:%d\", &data[i].month, &data[i].day, &data[i].hour, &data[i].minute);\n      string temp;\n      cin >> temp;\n      data[i].status = (temp == \"on-line\") ? 1 : 0;\n      data[i].time = data[i].day * 24 * 60 + data[i].hour * 60 + data[i].minute;\n   }\n   sort(data.begin(), data.end(), cmp);\n\n   map\u003cstring, vector\u003cnode> > custom;\n   for (int i = 1; i \u003c n; i++) {\n      if (data[i].name == data[i - 1].name && data[i - 1].status == 1 && data[i].status == 0) {\n         custom[data[i - 1].name].push_back(data[i - 1]);\n         custom[data[i].name].push_back(data[i]);\n      }\n   }\n   for (auto it : custom) {\n      vector\u003cnode> temp = it.second;\n\n      cout \u003c\u003c it.first;\n      printf(\" %02d\\n\", temp[0].month);\n      double total = 0.0;\n      for (int i = 1; i \u003c temp.size(); i += 2) {\n         double t = billFromZero(temp[i], rate) - billFromZero(temp[i - 1], rate);\n         printf(\"%02d:%02d:%02d %02d:%02d:%02d %d $%.2f\\n\", temp[i - 1].day, temp[i - 1].hour, temp[i - 1].minute, temp[i].day, temp[i].hour, temp[i].minute, temp[i].time - temp[i - 1].time, t);\n\n         total += t;\n      }\n      printf(\"Total amount: $%.2f\\n\", total);\n   }\n   return 0;\n}"},{"id":"1017","title":"Queueing at Bank","score":25,"category":"模拟","description":["Suppose a bank has K windows open for service. There is a yellow line in front of the windows which devides the waiting area into two parts. All the customers have to wait in line behind the yellow line,until it is his/her turn to be served and there is a window available. It is assumed that no window can","be occupied by a single customer for more than 1 hour.Now given the arriving time T and the processing time P of each customer, you are supposed to tell the average waiting time of all the customers."],"input":"Each input file contains one test case. For each case, the first line contains 2 numbers: N (\u003c=10000) –the total number of customers, and K (\u003c=100) – the number of windows. Then N lines follow, each contains 2 times: HH:MM:SS – the arriving time, and P – the processing time in minutes of a\n\ncustomer. Here HH is in the range [00, 23], MM and SS are both in [00, 59]. It is assumed that no two customers arrives at the same time.Notice that the bank opens from 08:00 to 17:00. Anyone arrives early will have to wait in line till 08:00,and anyone comes too late (at or after 17:00:01) will not be served nor counted into the average.","output":"For each test case, print in one line the average waiting time of all the customers, in minutes and accurate up to 1 decimal place.","samples":[{"input":"7 3\n07:55:00 16\n17:00:01 2\n07:59:59 15\n08:01:00 60\n08:00:00 30\n08:00:02 2\n08:03:00 10","output":"8.2","explanation":"","label":""}],"sampleInput":"7 3\n07:55:00 16\n17:00:01 2\n07:59:59 15\n08:01:00 60\n08:00:00 30\n08:00:02 2\n08:03:00 10","sampleOutput":"8.2","idea":["有n个客户,k个窗又。已知每个客户的到达时间和需要的时长,如果有窗又就依次过去,如果没有窗又就在黄线外等候(黄线外只有一个队伍,先来先服务),求客户的平均等待时长。银行开放时间为8点到17点,再8点之前不开门,8点之前来的人都要等待,在17点后来的人不被服务。用一个结构体存储客户的到达时间和办理业务时间~首先把所有hh:mm:ss格式的时间全化成以当天0点为基准的秒数。","注意晚于17:00的客户不算在内~既然客户是排队的,那么排序后对于每个客户都是同样的处理方式~使用一个优先队列维护窗又办理完业务的时间~如果最早结束服务的窗又时间早于客户的到达时间,不需要等待,直接执行 q.push(p[i].come + p[i].time);否则客户的等待时间是q.top() –p[i].come~PS:感谢@琦子块提供的更优解~"],"keyPoints":["把题目流程拆成清晰状态逐步模拟，每一步只修改相关变量。","重点检查循环起止、下标边界和最后一项的输出格式。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cqueue>\n#include \u003calgorithm>\n\n// 解题关键：有n个客户,k个窗又\nusing namespace std;\nconst int maxn = 10005;\n\nstruct person {\n   int come, time;\n} p[maxn];\nint cmp(person p1, person p2) { return p1.come \u003c p2.come; }\nint n, k, cnt, total;\nint main() {\n   scanf(\"%d%d\", &n, &k);\n   for (int i = 1; i \u003c= n; i++) {\n      int hh, ss, mm, tt;\n\n      scanf(\"%d:%d:%d %d\", &hh, &mm, &ss, &tt);\n      int sum = hh * 3600 + mm * 60 + ss;\n      if (sum > 61200) continue;\n      p[++cnt].time = tt * 60;\n      p[cnt].come = sum;\n   }\n   sort(p + 1, p + 1 + cnt, cmp);\n   priority_queue\u003cint, vector\u003cint>, greater\u003cint> > q;\n   for (int i = 1; i \u003c= k; ++i) q.push(28800);\n   for (int i = 1; i \u003c= cnt; ++i) {\n\n      if (q.top() \u003c= p[i].come) {\n         q.push(p[i].come + p[i].time);\n         q.pop();\n      } else {\n         total += q.top() - p[i].come;\n         q.push(q.top() + p[i].time);\n         q.pop();\n      }\n   }\n\n   (!cnt) ? printf(\"0.0\\n\") : printf(\"%.1lf\", ((double)total/60.0)/(double)\ncnt);\n   return 0;\n}"},{"id":"1018","title":"Public Bike Management","score":30,"category":"Dijkstra算法 + DFS","description":["There is a public bike service in Hangzhou City which provides great convenience to the tourists from all over the world. One may rent a bike at any station and return it to any other stations in the city.The Public Bike Management Center (PBMC) keeps monitoring the real-time capacity of all the","stations. A station is said to be in perfect condition if it is exactly half-full. If a station is full or empty,PBMC will collect or send bikes to adjust the condition of that station to perfect. And more, all the stations on the way will be adjusted as well.","When a problem station is reported, PBMC will always choose the shortest path to reach that station.If there are more than one shortest path, the one that requires the least number of bikes sent from PBMC will be chosen.Figure 1 illustrates an example. The stations are represented by vertices and the roads correspond to","the edges. The number on an edge is the time taken to reach one end station from another. The number written inside a vertex S is the current number of bikes stored at S. Given that the maximum capacity of each station is 10. To solve the problem at S3, we have 2 different shortest paths:","1. PBMC -> S1 -> S3. In this case, 4 bikes must be sent from PBMC, because we can collect 1 bike from S1 and then take 5 bikes to S3, so that both stations will be in perfect conditions.2. PBMC -> S2 -> S3. This path requires the same time as path 1, but only 3 bikes sent from PBMC","and hence is the one that will be chosen."],"input":"Each input file contains one test case. For each case, the first line contains 4 numbers: Cmax (\u003c= 100),always an even number, is the maximum capacity of each station; N (\u003c= 500), the total number of stations; Sp, the index of the problem station (the stations are numbered from 1 to N, and PBMC is\n\nrepresented by the vertex 0); and M, the number of roads. The second line contains N non-negative numbers Ci (i=1,...N) where each Ci is the current number of bikes at Si respectively. Then M lines follow, each contains 3 numbers: Si, Sj, and Tij which describe the time Tij taken to move betwen\n\nstations Si and Sj. All the numbers in a line are separated by a space.","output":"For each test case, print your results in one line. First output the number of bikes that PBMC must send. Then after one space, output the path in the format: 0->S1->...->Sp. Finally after another space,output the number of bikes that we must take back to PBMC after the condition of Sp is adjusted to\n\nperfect.Note that if such a path is not unique, output the one that requires minimum number of bikes that we must take back to PBMC. The judge’s data guarantee that such a path is unique.","samples":[{"input":"10 3 3 5\n6 7 0\n0 1 1\n0 2 1\n0 3 3\n1 3 1\n2 3 1","output":"3 0->2->3 0","explanation":"","label":""}],"sampleInput":"10 3 3 5\n6 7 0\n0 1 1\n0 2 1\n0 3 3\n1 3 1\n2 3 1","sampleOutput":"3 0->2->3 0","idea":["每个自行车车站的最大容量为一个偶数cmax,如果一个车站里面自行车的数量恰好为cmax/ 2,那么称处于完美状态。如果一个车站容量是满的或者空的,控制中心(处于结点0处)就会携带或者从路上收集一定数量的自行车前往该车站,一路上会让所有的车站沿途都达到完美。现在给出cmax,车站的数量n,问题车站sp,m条边,还有距离,求最短路径。","如果最短路径有多个,求能带的最少的自行车数目的那条。如果还是有很多条不同的路,那么就找一个从车站带回的自行车数目最少的(带回的时候是不调整的)~Dijkstra + DFS。如果只有Dijkstra是不可以的,因为minNeed和minBack在路径上的传递不满足最优子结构,不是简单的相加的过程,只有在所有路径都确定了之后才能区选择最小的need和最小的back~","Dijkstra求最短路径,dfs求minNeed和minBack和path,dfs的时候模拟一遍需要调整的过程,求出最后得到的need和back,与minNeed和minBack比较然后根据情况更新path,最后输出minNeed path 和minBack,记得path是从最后一个结点一直到第一个结点的,所以要倒着输出~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：每个自行车车站的最大容量为一个偶数cmax,如果一个车站里面自行车的数量恰好为cmax/ 2,那么称处于完美状态\n\n#include \u003calgorithm>\n#include \u003cvector>\nusing namespace std;\nconst int inf = 99999999;\nint cmax, n, sp, m;\nint minNeed = inf, minBack = inf;\nint e[510][510], dis[510], weight[510];\nbool visited[510];\nvector\u003cint> pre[510], path, temppath;\n\nvoid dfs(int v) {\n   temppath.push_back(v);\n   if(v == 0) {\n      int need = 0, back = 0;\n      for(int i = temppath.size() - 1; i >= 0; i--) {\n         int id = temppath[i];\n         if(weight[id] > 0) {\n             back += weight[id];\n         } else {\n             if(back > (0 - weight[id])) {\n\n                back += weight[id];\n             } else {\n                need += ((0 - weight[id]) - back);\n                back = 0;\n             }\n         }\n      }\n      if(need \u003c minNeed) {\n         minNeed = need;\n         minBack = back;\n\n         path = temppath;\n      } else if(need == minNeed && back \u003c minBack) {\n         minBack = back;\n         path = temppath;\n      }\n      temppath.pop_back();\n      return ;\n   }\n   for(int i = 0; i \u003c pre[v].size(); i++)\n\n      dfs(pre[v][i]);\n   temppath.pop_back();\n}\nint main() {\n   fill(e[0], e[0] + 510 * 510, inf);\n   fill(dis, dis + 510, inf);\n   scanf(\"%d%d%d%d\", &cmax, &n, &sp, &m);\n   for(int i = 1; i \u003c= n; i++) {\n      scanf(\"%d\", &weight[i]);\n      weight[i] = weight[i] - cmax / 2;\n\n   }\n   for(int i = 0; i \u003c m; i++) {\n      int a, b;\n      scanf(\"%d%d\", &a, &b);\n      scanf(\"%d\", &e[a][b]);\n\n      e[b][a] = e[a][b];\n   }\n   dis[0] = 0;\n   for(int i = 0; i \u003c= n; i++) {\n      int u = -1, minn = inf;\n      for(int j = 0; j \u003c= n; j++) {\n         if(visited[j] == false && dis[j] \u003c minn) {\n             u = j;\n             minn = dis[j];\n         }\n\n      }\n      if(u == -1) break;\n      visited[u] = true;\n      for(int v = 0; v \u003c= n; v++) {\n         if(visited[v] == false && e[u][v] != inf) {\n             if(dis[v] > dis[u] + e[u][v]) {\n                dis[v] = dis[u] + e[u][v];\n                pre[v].clear();\n                pre[v].push_back(u);\n\n             }else if(dis[v] == dis[u] + e[u][v]) {\n                pre[v].push_back(u);\n             }\n         }\n      }\n   }\n   dfs(sp);\n   printf(\"%d 0\", minNeed);\n   for(int i = path.size() - 2; i >= 0; i--)\n      printf(\"->%d\", path[i]);\n\n   printf(\" %d\", minBack);\n   return 0;\n}"},{"id":"1019","title":"General Palindromic Number","score":20,"category":"回文数","description":["A number that will be the same when it is written forwards or backwards is known as a Palindromic Number. For example, 1234321 is a palindromic number. All single digit numbers are palindromic numbers.Although palindromic numbers are most often considered in the decimal system, the concept of","palindromicity can be applied to the natural numbers in any numeral system. Consider a number N >0 in base b >= 2, where it is written in standard notation with k+1 digits ai as the sum of (aibi) for i from 0 to k. Here, as usual, 0 \u003c= ai \u003c b for all i and ak is non-zero. Then N is palindromic if and only if","ai = ak-i for all i. Zero is written 0 in any base and is also palindromic by definition.Given any non-negative decimal integer N and a base b, you are supposed to tell if N is a palindromic number in base b."],"input":"Each input file contains one test case. Each case consists of two non-negative numbers N and b, where 0 \u003c= N \u003c= 109 is the decimal number and 2 \u003c= b \u003c= 109 is the base. The numbers are separated by a space.","output":"For each test case, first print in one line “Yes” if N is a palindromic number in base b, or “No” if not.Then in the next line, print N as the number in base b in the form “ak ak-1... a0”. Notice that there must be no extra space at the end of output.","samples":[{"input":"27 2","output":"Yes\n1 1 0 1 1","explanation":"","label":"1"},{"input":"121 5","output":"No\n4 4 1","explanation":"","label":"2"}],"sampleInput":"27 2","sampleOutput":"Yes\n1 1 0 1 1","idea":["给出两个整数a和b,问十进制的a在b进制下是否为回文数。是的话输出Yes,不是输出No。并且输出a在b进制下的表示,以空格隔开分析:将a转换为b进制形式,保存在int的数组里面,比较数组左右两端是否对称。注意:如果是0,要输出Yes和0"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ccstdio>\n\n// 解题关键：给出两个整数a和b,问十进制的a在b进制下是否为回文数\nusing namespace std;\nint main() {\n   int a, b;\n   scanf(\"%d %d\", &a, &b);\n   int arr[40], index = 0;\n   while(a != 0) {\n\n      arr[index++] = a % b;\n      a = a / b;\n   }\n   int flag = 0;\n\n   for(int i = 0; i \u003c index / 2; i++) {\n      if(arr[i] != arr[index-i-1]) {\n         printf(\"No\\n\");\n         flag = 1;\n         break;\n\n      }\n   }\n   if(!flag) printf(\"Yes\\n\");\n   for(int i = index - 1; i >= 0; i--) {\n      printf(\"%d\", arr[i]);\n      if(i != 0) printf(\" \");\n   }\n   if(index == 0)\n      printf(\"0\");\n   return 0;\n\n}"},{"id":"1020","title":"Tree Traversals","score":25,"category":"二叉树的遍历,后序中序转层序","description":["Suppose that all the keys in a binary tree are distinct positive integers. Given the postorder and inorder traversal sequences, you are supposed to output the level order traversal sequence of the corresponding binary tree."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (\u003c=30), the total number of nodes in the binary tree. The second line gives the postorder sequence and the third line gives the inorder sequence. All the numbers in
