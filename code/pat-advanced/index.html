 and M, which are the user-defined table size, the number of input numbers, and the number of keys to be found, respectively. All the three numbers are no more than 104. Then N distinct\n\npositive integers are given in the next line. All the numbers in a line are separated by a space and are no more than 105.","output":"For each test case, in case it is impossible to insert some number, print in a line “X cannot be inserted.” where X is the input number. Finally print in a line the average search time for all the M keys, accurate up to 1 decimal place.","samples":[{"input":"4 5 4\n10 6 4 15 11\n11 4 15 2","output":"15 cannot be inserted.\n2.8","explanation":"","label":""}],"sampleInput":"4 5 4\n10 6 4 15 11\n11 4 15 2","sampleOutput":"15 cannot be inserted.\n2.8","idea":["给定一个序列,用平方探测法解决哈希冲突,然后给出m个数字,如果这个数字不能够被插入就输出”X cannot be inserted.”,然后输出这m个数字的平均查找时间分析:先找到大于tsize的最小的素数为真正的tsize,然后建立一个tsize长度的数组。首先用平方探测法插入数字a,每次pos = (a + j * j) % tsize,j是从0~","tsize-1的数字,如果当前位置可以插入就将a赋值给v[pos],如果一次都没有能够插入成功就输出”X cannot be inserted.”。其次计算平均查找时间,每次计 算pos = (a + j * j) % tsize,其中j \u003c= tsize,如果v[pos]处正是a则查找到了,则退出循环,如果v[pos]处不存在数字表示没查找到,那么也要退出循环。","每次查找的时候,退出循环之前的j就是这个数字的查找长度。最后ans除以m得到平均查找时间然后输出~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给定一个序列,用平方探测法解决哈希冲突,然后给出m个数字,如果这个数字不能够被插入就输出”X cannot be inserted.”,然后输出这m个数字的平均查找时间分析:先找到大于tsize的最小的素数为真正的tsi\nusing namespace std;\nbool isprime(int n) {\n\n   if (n \u003c= 1) return false;\n   for (int i = 2; i * i \u003c= n; i++)\n      if (n % i == 0) return false;\n   return true;\n}\nint main() {\n   int tsize, n, m, a;\n   scanf(\"%d %d %d\", &tsize, &n, &m);\n   while(!isprime(tsize)) tsize++;\n\n   vector\u003cint> v(tsize);\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &a);\n      int flag = 0;\n      for (int j = 0; j \u003c tsize; j++) {\n         int pos = (a + j * j) % tsize;\n         if (v[pos] == 0) {\n             v[pos] = a;\n             flag = 1;\n             break;\n\n         }\n      }\n      if (!flag) printf(\"%d cannot be inserted.\\n\", a);\n   }\n   int ans = 0;\n   for (int i = 0; i \u003c m; i++) {\n\n      scanf(\"%d\", &a);\n      for (int j = 0; j \u003c= tsize; j++) {\n         ans++;\n         int pos = (a + j * j) % tsize;\n         if (v[pos] == a || v[pos] == 0) break;\n\n      }\n   }\n   printf(\"%.1lf\\n\", ans * 1.0 / m);\n   return 0;\n}"},{"id":"1146","title":"Topological Order","score":25,"category":"拓扑排序","description":["This is a problem given in the Graduate Entrance Exam in 2018: Which of the following is NOT a topological order obtained from the given directed graph? Now you are supposed to write a program to test each of the options."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers N (\u003c=1,000), the number of vertices in the graph, and M (\u003c= 10,000), the number of directed edges. Then M lines follow, each gives the start and the end vertices of an edge. The vertices are numbered from 1 to\n\nN. After the graph, there is another positive integer K (\u003c= 100). Then K lines of query follow, each gives a permutation of all the vertices. All the numbers in a line are separated by a space.","output":"Print in a line all the indices of queries which correspond to “NOT a topological order”. The indices start from zero. All the numbers are separated by a space, and there must no extra space at the beginning or the end of the line. It is graranteed that there is at least one answer.","samples":[{"input":"6 8\n1 2\n1 3\n5 2\n5 4\n2 3\n2 6\n3 4\n6 4\n5\n1 5 2 3 6 4\n5 1 2 6 3 4\n5 1 2 3 6 4\n5 2 1 6 3 4\n1 2 3 4 5 6","output":"3 4","explanation":"","label":""}],"sampleInput":"6 8\n1 2\n1 3\n5 2\n5 4\n2 3\n2 6\n3 4\n6 4\n5\n1 5 2 3 6 4\n5 1 2 6 3 4\n5 1 2 3 6 4\n5 2 1 6 3 4\n1 2 3 4 5 6","sampleOutput":"3 4","idea":["给一个有向图,判断给定序列是否是拓扑序列~用邻接表v存储这个有向图,并将每个节点的入度保存在in数组中。对每一个要判断是否是拓扑序列的结点遍历,如果当前结点的入度不为0则表示不是拓扑序列,每次选中某个点后要将它所指向的所有结点的入度-1,最后根据是否出现过入度不为0的点决定是否要输出当前的编号i~flag是用来判断之前是否输出过现在是否要输出空格的~","judge是用来判断是否是拓扑序列的~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给一个有向图,判断给定序列是否是拓扑序列\n\nusing namespace std;\nint main() {\n   int n, m, a, b, k, flag = 0, in[1010];\n   vector\u003cint> v[1010];\n   scanf(\"%d %d\", &n, &m);\n   for (int i = 0; i \u003c m; i++) {\n      scanf(\"%d %d\", &a, &b);\n      v[a].push_back(b);\n      in[b]++;\n\n   }\n   scanf(\"%d\", &k);\n   for (int i = 0; i \u003c k; i++) {\n      int judge = 1;\n      vector\u003cint> tin(in, in+n+1);\n      for (int j = 0; j \u003c n; j++) {\n\n         scanf(\"%d\", &a);\n         if (tin[a] != 0) judge = 0;\n         for (int it : v[a]) tin[it]--;\n      }\n      if (judge == 1) continue;\n\n      printf(\"%s%d\", flag == 1 ? \" \": \"\", i);\n      flag = 1;\n   }\n   return 0;\n}"},{"id":"1147","title":"Heaps","score":30,"category":"堆,树的遍历","description":["In computer science, a heap is a specialized tree-based data structure that satisfies the heap property:if P is a parent node of C, then the key (the value) of P is either greater than or equal to (in a max heap) or less than or equal to (in a min heap) the key of C. A common implementation of a heap is the","binary heap, in which the tree is a complete binary tree. (Quoted from Wikipedia at https://en.wikipe dia.org/wiki/Heap_(data_structure))Your job is to tell if a given complete binary tree is a heap."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers: M (\u003c=100), the number of trees to be tested; and N (1 \u003c N \u003c= 1000), the number of keys in each tree,respectively. Then M lines follow, each contains N distinct integer keys (all in the range of int), which\n\ngives the level order traversal sequence of a complete binary tree.","output":"For each given tree, print in a line “Max Heap” if it is a max heap, or “Min Heap” for a min heap, or“Not Heap” if it is not a heap at all. Then in the next line print the trees postorder traversal sequence.All the numbers are separated by a space, and there must no extra space at the beginning or the end\n\nof the line.","samples":[{"input":"3 8\n98 72 86 60 65 12 23 50\n8 38 25 58 52 82 70 60\n10 28 15 12 34 9 8 56","output":"Max Heap\n50 60 65 72 12 23 86 98\nMin Heap\n60 58 52 38 82 70 25 8\nNot Heap\n56 12 34 28 9 8 15 10","explanation":"","label":""}],"sampleInput":"3 8\n98 72 86 60 65 12 23 50\n8 38 25 58 52 82 70 60\n10 28 15 12 34 9 8 56","sampleOutput":"Max Heap\n50 60 65 72 12 23 86 98\nMin Heap\n60 58 52 38 82 70 25 8\nNot Heap\n56 12 34 28 9 8 15 10","idea":["给一个树的层序遍历,判断它是不是堆,是大顶堆还是小顶堆。输出这个树的后序遍历~30分大题,25行代码,一行代码一分......((⊙o⊙)嗯) // 我为什么这么机智可爱又伶俐?从后往前检查所有节点(除了根节点)和它的父节点的关系,判断是否破坏最大堆或者最小堆的性质,如果有不满足的情况将maxn或minn置为0,以此排除最大堆或者最小堆~","然后后序遍历,对于index结点分别遍历孩子index*2和右孩子index*2+1,遍历完左右子树后输出根结点~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给一个树的层序遍历,判断它是不是堆,是大顶堆还是小顶堆\nusing namespace std;\nint a[1005], m, n;\nvoid postOrder(int index) {\n   if (index > n) return;\n   postOrder(index * 2);\n   postOrder(index * 2 + 1);\n   printf(\"%d%s\", a[index], index == 1 ? \"\\n\" : \" \");\n}\nint main() {\n\n   scanf(\"%d %d\", &m, &n);\n   while (m--) {\n      int minn = 1, maxn = 1;\n      for (int i = 1; i \u003c= n; i++) scanf(\"%d\", &a[i]);\n      for (int i = 2; i \u003c= n; i++) {\n         if (a[i] > a[i / 2]) maxn = 0;\n         if (a[i] \u003c a[i / 2]) minn = 0;\n      }\n      if (maxn == 1) printf(\"Max Heap\\n\");\n      else if (minn == 1) printf(\"Min Heap\\n\");\n\n      else printf(\"Not Heap\\n\");\n      postOrder(1);\n   }\n   return 0;\n}"},{"id":"1148","title":"Werewolf – Simple Version","score":20,"category":"水题","description":["Werewolf(狼人杀) is a game in which the players are partitioned into two parties: the werewolves and the human beings. Suppose that in a game,player #1 said: “Player #2 is a werewolf.”;player #2 said: “Player #3 is a human.”;player #3 said: “Player #4 is a werewolf.”;","player #4 said: “Player #5 is a human.”; and player #5 said: “Player #4 is a human.”.Given that there were 2 werewolves among them, at least one but not all the werewolves were lying,and there were exactly 2 liers. Can you point out the werewolves?Now you are asked to solve a harder version of this problem: given that there were N players, with 2","werewolves among them, at least one but not all the werewolves were lying, and there were exactly 2 liers. You are supposed to point out the werewolves."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (5≤N≤100).Then N lines follow and the i-th line gives the statement of the i-th player (1≤i≤N), which is represented by the index of the player with a positive sign for a human and a negative sign for a\n\nwerewolf.","output":"If a solution exists, print in a line in ascending order the indices of the two werewolves. The numbers must be separated by exactly one space with no extra spaces at the beginning or the end of the line. If there are more than one solution, you must output the smallest solution sequence — that is, for two\n\nsequences A=a[1],...,a[M] and B=b[1],...,b[M], if there exists 0≤k[k+1]\u003cb[k+1], then A is said to be smaller than B. In case there is no solution, simply print No Solution.","samples":[{"input":"5\n-2\n+3\n-4\n+5\n+4","output":"1 4","explanation":"","label":"1"},{"input":"6\n+6\n+3\n+1\n-5\n-2\n+4","output":"1 5","explanation":"","label":"2"},{"input":"5\n-2\n-3\n-4\n-5\n-1","output":"No Solution","explanation":"","label":"3"}],"sampleInput":"5\n-2\n+3\n-4\n+5\n+4","sampleOutput":"1 4","idea":["已知 N 名玩家中有 2 人扮演狼人角色,有 2 人说的不是实话,有狼人撒谎但并不是所有狼人都在撒谎。要求你找出扮演狼人角色的是哪几号玩家,如果有解,在一行中按递增顺序输出 2 个狼人的编号;如果解不唯一,则输出最小序列解;若无解则输出 No Solution~每个人说的数字保存在v数组中,i从1~n、j从i+1~","n遍历,分别假设i和j是狼人,a数组表示该人是狼人还是好人,等于1表示是好人,等于-1表示是狼人。k从1~","n分别判断k所说的话是真是假,k说的话和真实情况不同(即v[k] * a[abs(v[k])] \u003c 0)则表示k在说谎,则将k放在lie数组中;遍历完成后判断lie数组,如果说谎人数等于2并且这两个说谎的人一个是好人一个是狼人(即a[lie[0]] + a[lie[1]] ==0)表示满足题意,此时输出i和j并return,否则最后的时候输出No Solution~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003ccmath>\n\n// 解题关键：已知 N 名玩家中有 2 人扮演狼人角色,有 2 人说的不是实话,有狼人撒谎但并不是所有狼人都在撒谎\nusing namespace std;\n\nint main() {\n   int n;\n   cin >> n;\n   vector\u003cint> v(n+1);\n   for (int i = 1; i \u003c= n; i++) cin >> v[i];\n\n   for (int i = 1; i \u003c= n; i++) {\n      for (int j = i + 1; j \u003c= n; j++) {\n         vector\u003cint> lie, a(n + 1, 1);\n         a[i] = a[j] = -1;\n         for (int k = 1; k \u003c= n; k++)\n             if (v[k] * a[abs(v[k])] \u003c 0) lie.push_back(k);\n         if (lie.size() == 2 && a[lie[0]] + a[lie[1]] == 0) {\n             cout \u003c\u003c i \u003c\u003c \" \" \u003c\u003c j;\n             return 0;\n         }\n\n      }\n   }\n   cout \u003c\u003c \"No Solution\";\n   return 0;\n}"},{"id":"1149","title":"Dangerous Goods Packaging","score":25,"category":"STL的应用","description":["When shipping goods with containers, we have to be careful not to pack some incompatible goods into the same container, or we might get ourselves in serious trouble. For example, oxidizing agent(氧化剂) must not be packed with flammable liquid (易燃液体), or it can cause explosion.","Now you are given a long list of incompatible goods, and several lists of goods to be shipped. You are supposed to tell if all the goods in a list can be packed into the same container."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers: N(≤10^4), the number of pairs of incompatible goods, and M (≤100), the number of lists of goods to be shipped.Then two blocks follow. The first block contains N pairs of incompatible goods, each pair occupies a\n\nline; and the second one contains M lists of goods to be shipped, each list occupies a line in the following format:K G[1] G[2]... G[K]where K (≤1,000) is the number of goods and G[i]’s are the IDs of the goods. To make it simple, each good is represented by a 5-digit ID number. All the numbers in a line are separated by spaces.","output":"For each shipping list, print in a line Yes if there are no incompatible goods in the list, or No if not.","samples":[{"input":"6 3\n20001 20002\n20003 20004\n20005 20006\n20003 20001\n20005 20004\n20004 20006\n4 00001 20004 00002 20003\n5 98823 20002 20003 20006 10010\n3 12345 67890 23333","output":"No\nYes\nYes","explanation":"","label":""}],"sampleInput":"6 3\n20001 20002\n20003 20004\n20005 20006\n20003 20001\n20005 20004\n20004 20006\n4 00001 20004 00002 20003\n5 98823 20002 20003 20006 10010\n3 12345 67890 23333","sampleOutput":"No\nYes\nYes","idea":["集装箱运输货物时,我们必须特别小心,不能把不相容的货物装在一只箱子里。比如氧化剂绝对不能跟易燃液体同箱,否则很容易造成爆炸。给定一张不相容物品的清单,需要你检查每一张集装箱货品清单,判断它们是否能装在同一只箱子里。对每箱货物清单,判断是否可以安全运输。如果没有不相容物品,则在一行中输出 Yes,否则输出 No~用map存储每一个货物的所有不兼容货物~","在判断给出的一堆货物是否是相容的时候,判断任一货物的不兼容货物是否在这堆货物中~如果存在不兼容的货物,则这堆货物不能相容~如果遍历完所有的货物,都找不到不兼容的两个货物,则这堆货物就是兼容的~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cmap>\n\n// 解题关键：集装箱运输货物时,我们必须特别小心,不能把不相容的货物装在一只箱子里\nusing namespace std;\nint main() {\n   int n, k, t1, t2;\n   map\u003cint,vector\u003cint>> m;\n   scanf(\"%d%d\", &n, &k);\n\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d%d\", &t1, &t2);\n      m[t1].push_back(t2);\n      m[t2].push_back(t1);\n   }\n   while (k--) {\n      int cnt, flag = 0, a[100000] = {0};\n\n      scanf(\"%d\", &cnt);\n      vector\u003cint> v(cnt);\n      for (int i = 0; i \u003c cnt; i++) {\n         scanf(\"%d\", &v[i]);\n         a[v[i]] = 1;\n\n      }\n      for (int i = 0; i \u003c v.size(); i++)\n         for (int j = 0; j \u003c m[v[i]].size(); j++)\n             if (a[m[v[i]][j]] == 1) flag = 1;\n      printf(\"%s\\n\",flag ? \"No\" :\"Yes\");\n   }\n   return 0;\n}"},{"id":"1150","title":"Travelling Salesman Problem","score":25,"category":"图论","description":["The “travelling salesman problem” asks the following question: “Given a list of cities and the distances between each pair of cities, what is the shortest possible route that visits each city and returns to the origin city?” It is an NP-hard problem in combinatorial optimization, important in","operations research and theoretical computer science. (Quoted from “https://en.wikipedia.org/wiki/Travelling_salesman_problem”.)In this problem, you are supposed to find, from a given list of cycles, the one that is the closest to the solution of a travelling salesman problem."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive integers N(2\u003cN≤200), the number of cities, and M, the number of edges in an undirected graph. Then M lines follow, each describes an edge in the format City1 City2 Dist, where the cities are numbered from 1 to\n\nN and the distance Dist is positive and is no more than 100. The next line gives a positive integer K which is the number of paths, followed by K lines of paths, each in the format:n C1 C2......Cn where n is the number of cities in the list, and Ci‘s are the cities on a path.","output":"For each path, print in a line Path X: TotalDist (Description) where X is the index (starting from 1) of that path, TotalDist its total distance (if this distance does not exist, output NA instead), and Description is one of the following:TS simple cycle if it is a simple cycle that visits every city;\n\nTS cycle if it is a cycle that visits every city, but not a simple cycle;Not a TS cycle if it is NOT a cycle that visits every city.Finally print in a line Shortest Dist(X) = TotalDist where X is the index of the cycle that is the closest to the solution of a travelling salesman problem, and TotalDist is its total distance. It is guaranteed that\n\nsuch a solution is unique.","samples":[{"input":"6 10\n6 2 1\n3 4 1\n1 5 1\n2 5 1\n3 1 8\n4 1 6\n1 6 1\n6 3 1\n1 2 1\n4 5 1\n7\n7 5 1 4 3 6 2 5\n7 6 1 3 4 5 2 6\n6 5 1 4 3 6 2\n9 6 2 1 6 3 4 5 2 6\n4 1 2 5 1\n7 6 1 2 5 4 3 1\n7 6 3 2 5 4 1 6","output":"Path 1: 11 (TS simple cycle)\nPath 2: 13 (TS simple cycle)\nPath 3: 10 (Not a TS cycle)\nPath 4: 8 (TS cycle)\nPath 5: 3 (Not a TS cycle)\nPath 6: 13 (Not a TS cycle)\nPath 7: NA (Not a TS cycle)\nShortest Dist(4) = 8","explanation":"","label":""}],"sampleInput":"6 10\n6 2 1\n3 4 1\n1 5 1\n2 5 1\n3 1 8\n4 1 6\n1 6 1\n6 3 1\n1 2 1\n4 5 1\n7\n7 5 1 4 3 6 2 5\n7 6 1 3 4 5 2 6\n6 5 1 4 3 6 2\n9 6 2 1 6 3 4 5 2 6\n4 1 2 5 1\n7 6 1 2 5 4 3 1\n7 6 3 2 5 4 1 6","sampleOutput":"Path 1: 11 (TS simple cycle)\nPath 2: 13 (TS simple cycle)\nPath 3: 10 (Not a TS cycle)\nPath 4: 8 (TS cycle)\nPath 5: 3 (Not a TS cycle)\nPath 6: 13 (Not a TS cycle)\nPath 7: NA (Not a TS cycle)\nShortest Dist(4) = 8","idea":["给出一条路径,判断这条路径是这个图的旅行商环路、简单旅行商环路还是非旅行商环路~如果给出的路径存在某两个连续的点不可达或者第一个结点和最后一个结点不同或者这个路径没有访问过图中所有的点,那么它就不是一个旅行商环路(flag = 0)~如果满足了旅行商环路的条件,那么再判断这个旅行商环路是否是简单旅行商环路,即是否访问过n+1个结点(源点访问两次)~","最后输出这些旅行商环路中经过的路径最短的路径编号和路径长度~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cset>\n\n// 解题关键：给出一条路径,判断这条路径是这个图的旅行商环路、简单旅行商环路还是非旅行商环路\nusing namespace std;\nint e[300][300], n, m, k, ans = 99999999, ansid;\nvector\u003cint> v;\nvoid check(int index) {\n\n   int sum = 0, cnt, flag = 1;\n   scanf(\"%d\", &cnt);\n   set\u003cint> s;\n   vector\u003cint> v(cnt);\n   for (int i = 0; i \u003c cnt; i++) {\n      scanf(\"%d\", &v[i]);\n      s.insert(v[i]);\n   }\n   for (int i = 0; i \u003c cnt - 1; i++) {\n      if(e[v[i]][v[i+1]] == 0) flag = 0;\n\n      sum += e[v[i]][v[i+1]];\n   }\n   if (flag == 0) {\n      printf(\"Path %d: NA (Not a TS cycle)\\n\", index);\n   } else if(v[0] != v[cnt-1] || s.size() != n) {\n      printf(\"Path %d: %d (Not a TS cycle)\\n\", index, sum);\n   } else if(cnt != n + 1) {\n      printf(\"Path %d: %d (TS cycle)\\n\", index, sum);\n      if (sum \u003c ans) {\n         ans = sum;\n\n         ansid = index;\n      }\n   } else {\n      printf(\"Path %d: %d (TS simple cycle)\\n\", index, sum);\n      if (sum \u003c ans) {\n         ans = sum;\n         ansid = index;\n      }\n   }\n\n}\n\nint main() {\n   scanf(\"%d%d\", &n, &m);\n   for (int i = 0; i \u003c m; i++) {\n      int t1, t2, t;\n      scanf(\"%d%d%d\", &t1, &t2, &t);\n\n      e[t1][t2] = e[t2][t1] = t;\n   }\n   scanf(\"%d\", &k);\n   for (int i = 1; i \u003c= k; i++) check(i);\n   printf(\"Shortest Dist(%d) = %d\\n\", ansid, ans);\n   return 0;\n}"},{"id":"1151","title":"LCA in a Binary Tree","score":30,"category":"树的遍历,LCA算法","description":["The lowest common ancestor (LCA) of two nodes U and V in a tree is the deepest node that has both U and V as descendants.Given any two nodes in a binary tree, you are supposed to find their LCA."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers: M (≤1,000), the number of pairs of nodes to be tested; and N (≤ 10,000), the number of keys in the binary tree, respectively. In each of the following two lines, N distinct integers are given as the inorder and\n\npreorder traversal sequences of the binary tree, respectively. It is guaranteed that the binary tree can be uniquely determined by the input sequences. Then M lines follow, each contains a pair of integer keys U and V. All the keys are in the range of int.","output":"For each given pair of U and V, print in a line LCA of U and V is A. if the LCA is found and A is the key. But if A is one of U and V, print X is an ancestor of Y. where X is A and Y is the other node. If U or V is not found in the binary tree, print in a line ERROR: U is not found. or ERROR: V is not found. or\n\nERROR: U and V are not found..","samples":[{"input":"6 8\n7 2 3 4 6 5 1 8\n5 3 7 2 6 4 8 1\n2 6\n8 1\n7 9\n12 -3\n0 8\n99 99","output":"LCA of 2 and 6 is 3.\n8 is an ancestor of 1.\nERROR: 9 is not found.\nERROR: 12 and -3 are not found.\nERROR: 0 is not found.\nERROR: 99 and 99 are not found.","explanation":"","label":""}],"sampleInput":"6 8\n7 2 3 4 6 5 1 8\n5 3 7 2 6 4 8 1\n2 6\n8 1\n7 9\n12 -3\n0 8\n99 99","sampleOutput":"LCA of 2 and 6 is 3.\n8 is an ancestor of 1.\nERROR: 9 is not found.\nERROR: 12 and -3 are not found.\nERROR: 0 is not found.\nERROR: 99 and 99 are not found.","idea":["给出中序序列和先序序列,再给出两个点,求这两个点的最近公共祖先~不用建树~已知某个树的根结点,若a和b在根结点的左边,则a和b的最近公共祖先在当前子树根结点的左子树寻找,如果a和b在当前子树根结点的两边,在当前子树的根结点就是a和b的最近公共祖先,如果a和b在当前子树根结点的右边,则a和b的最近公共祖先就在当前子树的右子树寻找。","中序加先序可以唯一确定一棵树,在不构建树的情况下,在每一层的递归中,可以得到树的根结点,在此时并入lca算法可以确定两个结点的公共祖先~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cmap>\n\n// 解题关键：给出中序序列和先序序列,再给出两个点,求这两个点的最近公共祖先\nusing namespace std;\nmap\u003cint, int> pos;\nvector\u003cint> in, pre;\nvoid lca(int inl, int inr, int preRoot, int a, int b) {\n   if (inl > inr) return;\n\n   int inRoot = pos[pre[preRoot]], aIn = pos[a], bIn = pos[b];\n   if (aIn \u003c inRoot && bIn \u003c inRoot)\n      lca(inl, inRoot-1, preRoot+1, a, b);\n   else if ((aIn \u003c inRoot && bIn > inRoot) || (aIn > inRoot && bIn \u003c\ninRoot))\n      printf(\"LCA of %d and %d is %d.\\n\", a, b, in[inRoot]);\n   else if (aIn > inRoot && bIn > inRoot)\n      lca(inRoot+1, inr, preRoot+1+(inRoot-inl), a, b);\n   else if (aIn == inRoot)\n\n         printf(\"%d is an ancestor of %d.\\n\", a, b);\n   else if (bIn == inRoot)\n         printf(\"%d is an ancestor of %d.\\n\", b, a);\n}\nint main() {\n   int m, n, a, b;\n   scanf(\"%d %d\", &m, &n);\n   in.resize(n + 1), pre.resize(n + 1);\n\n   for (int i = 1; i \u003c= n; i++) {\n      scanf(\"%d\", &in[i]);\n      pos[in[i]] = i;\n   }\n   for (int i = 1; i \u003c= n; i++) scanf(\"%d\", &pre[i]);\n\n   for (int i = 0; i \u003c m; i++) {\n      scanf(\"%d %d\", &a, &b);\n      if (pos[a] == 0 && pos[b] == 0)\n         printf(\"ERROR: %d and %d are not found.\\n\", a, b);\n      else if (pos[a] == 0 || pos[b] == 0)\n         printf(\"ERROR: %d is not found.\\n\", pos[a] == 0 ? a : b);\n      else\n         lca(1, n, 1, a, b);\n   }\n   return 0;\n\n}"},{"id":"1152","title":"Google Recruitment","score":20,"category":"字符串处理","description":["In July 2004, Google posted on a giant billboard along Highway 101 in Silicon Valley (shown in the picture below) for recruitment. The content is super-simple, a URL consisting of the first 10-digit prime found in consecutive digits of the natural constant e. The person who could find this prime","number could go to the next step in Google’s hiring process by visiting this website.The natural constant e is a well known transcendental number(超越数). The first several digits are:e =2.7182818284590452353602874713526624977572470936999595749669676277240766303535475945713821","78525166427427466391932003059921... where the 10 digits in bold are the answer to Google’s question.Now you are asked to solve a more general problem: find the first K-digit prime in consecutive digits of any given L-digit number."],"input":"Each input file contains one test case. Each case first gives in a line two positive integers: L (≤ 1,000)and K (\u003c 10), which are the numbers of digits of the given number and the prime to be found,respectively. Then the L-digit number N is given in the next line.","output":"For each test case, print in a line the first K-digit prime in consecutive digits of N. If such a number does not exist, output 404 instead. Note: the leading zeroes must also be counted as part of the K digits. For example, to find the 4-digit prime in 200236, 0023 is a solution. However the first digit 2\n\nmust not be treated as a solution 0002 since the leading zeroes are not in the original number.","samples":[{"input":"20 5\n23654987725541023819","output":"49877","explanation":"","label":"1"},{"input":"10 3\n2468024680","output":"404","explanation":"","label":"2"}],"sampleInput":"20 5\n23654987725541023819","sampleOutput":"49877","idea":["给出一个l长度的字符串,求出其中第一个k位的素数分析: 枚举每个k位的子串,转换成整数,判断是否是素数(判断素数的时候要把0和1也考虑进去)~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出一个l长度的字符串,求出其中第一个k位的素数分析: 枚举每个k位的子串,转换成整数,判断是否是素数(判断素数的时候要把0和1也考虑进去)\n\n#include \u003cstring>\nusing namespace std;\nbool isPrime(int n) {\n   if (n == 0 || n == 1) return false;\n   for (int i = 2; i * i \u003c= n; i++)\n      if (n % i == 0) return false;\n\n   return true;\n}\nint main() {\n   int l, k;\n   string s;\n\n   cin >> l >> k >> s;\n   for (int i = 0; i \u003c= l - k; i++) {\n      string t = s.substr(i, k);\n      int num = stoi(t);\n      if (isPrime(num)) {\n         cout \u003c\u003c t;\n         return 0;\n      }\n   }\n   cout \u003c\u003c \"404\\n\";\n\n   return 0;\n}"},{"id":"1153","title":"Decode Registration Card of PAT","score":25,"category":"模拟,排序,map","description":["A registration card number of PAT consists of 4 parts:the 1st letter represents the test level, namely, T for the top level, A for advance and B for basic;the 2nd – 4th digits are the test site number, ranged from 101 to 999;the 5th – 10th digits give the test date, in the form of yymmdd;","finally the 11th – 13th digits are the testee’s number, ranged from 000 to 999.Now given a set of registration card numbers and the scores of the card owners, you are supposed to output the various statistics according to the given queries."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers N (≤10^4)and M (≤100), the numbers of cards and the queries, respectively.Then N lines follow, each gives a card number and the owner’s score (integer in [0,100]), separated by\n\na space.After the info of testees, there are M lines, each gives a query in the format Type Term, where Type being 1 means to output all the testees on a given level, in non-increasing order of their scores.The corresponding Term will be the letter which specifies the level;\n\nType being 2 means to output the total number of testees together with their total scores in a given site. The corresponding Term will then be the site number;Type being 3 means to output the total number of testees of every site for a given test date. The corresponding Term will then be the date, given in the same format as in the registration card.","output":"For each query, first print in a line Case #: input, where # is the index of the query case, starting from 1; and input is a copy of the corresponding input query. Then output as requested:for a type 1 query, the output format is the same as in input, that is, CardNumber Score. If there is a\n\ntie of the scores, output in increasing alphabetical order of their card numbers (uniqueness of the card numbers is guaranteed);for a type 2 query, output in the format Nt Ns where Nt is the total number of testees and Ns is their total score;for a type 3 query, output in the format Site Nt where Site is the site number and Nt is the total\n\nnumber of testees at Site. The output must be in non-increasing order of Nt’s, or in increasing order of site numbers if there is a tie of Nt.If the result of a query is empty, simply print NA.","samples":[{"input":"8 4\nB123180908127 99\nB102180908003 86\nA112180318002 98\nT107150310127 62\nA107180908108 100\nT123180908010 78\nB112160918035 88\nA107180908021 98\n1 A\n2 107\n3 180908\n2 999","output":"Case 1: 1 A\nA107180908108 100\nA107180908021 98\nA112180318002 98\nCase 2: 2 107\n3 260\nCase 3: 3 180908\n107 2\n123 2\n102 1\nCase 4: 2 999\nNA","explanation":"","label":""}],"sampleInput":"8 4\nB123180908127 99\nB102180908003 86\nA112180318002 98\nT107150310127 62\nA107180908108 100\nT123180908010 78\nB112160918035 88\nA107180908021 98\n1 A\n2 107\n3 180908\n2 999","sampleOutput":"Case 1: 1 A\nA107180908108 100\nA107180908021 98\nA112180318002 98\nCase 2: 2 107\n3 260\nCase 3: 3 180908\n107 2\n123 2\n102 1\nCase 4: 2 999\nNA","idea":["给出一组学生的准考证号和成绩,准考证号包含了等级(乙甲顶),考场号,日期,和个人编号信息,并有三种查询方式查询一:给出考试等级,找出该等级的考生,按照成绩降序,准考证升序排序查询二:给出考场号,统计该考场的考生数量和总得分查询三:给出考试日期,查询改日期下所有考场的考试人数,按照人数降序,考场号升序排序分析:先把所有考生的准考证和分数记录下来~","1、按照等级查询,枚举选取匹配的学生,然后排序即可2、按照考场查询,枚举选取匹配的学生,然后计数、求和3、按日期查询每个考场人数,用unordered_map存储,最后排序汇总~注意:1、第三个用map存储会超时,用unordered_map就不会超时啦~2、排序传参建议用引用传参,这样更快,虽然有时候不用引用传参也能通过,但还是尽量用,养成好习惯~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cunordered_map>\n#include \u003calgorithm>\n\n// 解题关键：给出一组学生的准考证号和成绩,准考证号包含了等级(乙甲顶),考场号,日期,和个人编号信息,并有三种查询方式查询一:给出考试等级,找出该等级的考生,按照成绩降序,准考证升序排序查询二:给出考场号,统计该考场的考生数量和总得\n\nusing namespace std;\nstruct node {\n   string t;\n   int value;\n};\nbool cmp(const node &a, const node &b) {\n   return a.value != b.value ? a.value > b.value : a.t \u003c b.t;\n}\nint main() {\n\n   int n, k, num;\n   string s;\n   cin >> n >> k;\n   vector\u003cnode> v(n);\n   for (int i = 0; i \u003c n; i++)\n\n      cin >> v[i].t >> v[i].value;\n   for (int i = 1; i \u003c= k; i++) {\n      cin >> num >> s;\n      printf(\"Case %d: %d %s\\n\", i, num, s.c_str());\n      vector\u003cnode> ans;\n      int cnt = 0, sum = 0;\n      if (num == 1) {\n         for (int j = 0; j \u003c n; j++)\n             if (v[j].t[0] == s[0]) ans.push_back(v[j]);\n      } else if (num == 2) {\n\n         for (int j = 0; j \u003c n; j++) {\n             if (v[j].t.substr(1, 3) == s) {\n                cnt++;\n                sum += v[j].value;\n             }\n         }\n         if (cnt != 0) printf(\"%d %d\\n\", cnt, sum);\n      } else if (num == 3) {\n         unordered_map\u003cstring, int> m;\n\n         for (int j = 0; j \u003c n; j++)\n             if (v[j].t.substr(4, 6) == s) m[v[j].t.substr(1, 3)]++;\n         for (auto it : m) ans.push_back({it.first, it.second});\n      }\n      sort(ans.begin(), ans.end(),cmp);\n      for (int j = 0; j \u003c ans.size(); j++)\n         printf(\"%s %d\\n\", ans[j].t.c_str(), ans[j].value);\n      if (((num == 1 || num == 3) && ans.size() == 0) || (num == 2 && cnt\n== 0)) printf(\"NA\\n\");\n   }\n\n   return 0;\n}"},{"id":"1154","title":"Vertex Coloring","score":25,"category":"set,hash","description":["A proper vertex coloring is a labeling of the graph’s vertices with colors such that no two vertices sharing the same edge have the same color. A coloring using at most k colors is called a (proper) k-coloring.Now you are supposed to tell if a given coloring is a proper k-coloring."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers N and M 4(both no more than 10), being the total numbers of vertices and edges, respectively. Then M lines follow, each describes an edge by giving the indices (from 0 to N−1) of the two ends of the edge.\n\nAfter the graph, a positive integer K (≤ 100) is given, which is the number of colorings you are supposed to check. Then K lines follow, each contains N colors which are represented by non-negative integers in the range of int. The i-th color is the color of the i-th vertex.","output":"For each coloring, print in a line k-coloring if it is a proper k-coloring for some positive k, or No if not.","samples":[{"input":"10 11\n8 7\n6 8\n4 5\n8 4\n8 1\n1 2\n1 4\n9 8\n9 1\n1 0\n2 4\n4\n0 1 0 1 4 1 0 1 3 0\n0 1 0 1 4 1 0 1 0 0\n8 1 0 1 4 1 0 5 3 0\n1 2 3 4 5 6 7 8 8 9","output":"4-coloring\nNo\n6-coloring\nNo","explanation":"","label":""}],"sampleInput":"10 11\n8 7\n6 8\n4 5\n8 4\n8 1\n1 2\n1 4\n9 8\n9 1\n1 0\n2 4\n4\n0 1 0 1 4 1 0 1 3 0\n0 1 0 1 4 1 0 1 0 0\n8 1 0 1 4 1 0 5 3 0\n1 2 3 4 5 6 7 8 8 9","sampleOutput":"4-coloring\nNo\n6-coloring\nNo","idea":["给出一个图(先给出所有边,后给出每个点的颜色),问是否满足:所有的边的两个点的颜色不相同分析:把所有边存起来,把所有点的颜色存起来(存的过程中放入set统计颜色个数),枚举所有边,检查是否每条边的两点个颜色是否相同,若全不相同,则输出颜色个数,否则输出No~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出一个图(先给出所有边,后给出每个点的颜色),问是否满足:所有的边的两个点的颜色不相同分析:把所有边存起来,把所有点的颜色存起来(存的过程中放入set统计颜色个数),枚举所有边,检查是否每条边的两点个颜色是否相同,若全\n\n#include \u003cvector>\n#include \u003cset>\nusing namespace std;\nstruct node {int t1, t2;};\nint main() {\n   int n, m, k;\n   cin >> n >> m;\n   vector\u003cnode> v(m);\n   for (int i = 0; i \u003c m; i++)\n\n      scanf(\"%d %d\", &v[i].t1, &v[i].t2);\n   cin >> k;\n   while (k--) {\n      int a[10009] = {0};\n      bool flag = true;\n      set\u003cint> se;\n      for (int i = 0; i \u003c n; i++) {\n         scanf(\"%d\", &a[i]);\n         se.insert(a[i]);\n      }\n\n      for (int i = 0; i \u003c m; i++) {\n         if (a[v[i].t1] == a[v[i].t2]) {\n             flag = false;\n             break;\n         }\n      }\n      if (flag)\n         printf(\"%d-coloring\\n\", se.size());\n      else\n\n         printf(\"No\\n\");\n   }\n   return 0;\n}"},{"id":"1155","title":"Heap Paths","score":30,"category":"深搜回溯,堆","description":["In computer science, a heap is a specialized tree-based data structure that satisfies the heap property:if P is a parent node of C, then the key (the value) of P is either greater than or equal to (in a max heap) or less than or equal to (in a min heap) the key of C. A common implementation of a heap is the","binary heap, in which the tree is a complete binary tree. (Quoted from Wikipedia at https://en.wikipe dia.org/wiki/Heap_(data_structure))One thing for sure is that all the keys along any path from the root to a leaf in a max/min heap must be in non-increasing/non-decreasing order.","Your job is to check every path in a given complete binary tree, in order to tell if it is a heap or not."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N(1\u003cN≤1,000), the number of keys in the tree. Then the next line contains N distinct integer keys (all in the range of int), which gives the level order traversal sequence of a complete binary tree.","output":"For each given tree, first print all the paths from the root to the leaves. Each path occupies a line, with all the numbers separated by a space, and no extra space at the beginning or the end of the line. The paths must be printed in the following order: for each node in the tree, all the paths in its right subtree\n\nmust be printed before those in its left subtree.Finally print in a line Max Heap if it is a max heap, or Min Heap for a min heap, or Not Heap if it is not a heap at all.","samples":[{"input":"8\n98 72 86 60 65 12 23 50","output":"98 86 23\n98 86 12\n98 72 65\n98 72 60 50\nMax Heap","explanation":"","label":"1"},{"input":"8\n8 38 25 58 52 82 70 60","output":"8 25 70\n8 25 82\n8 38 52\n8 38 58 60\nMin Heap","explanation":"","label":"2"},{"input":"8\n10 28 15 12 34 9 8 56","output":"10 15 8\n10 15 9\n10 28 34\n10 28 12 56\nNot Heap","explanation":"","label":"3"}],"sampleInput":"8\n98 72 86 60 65 12 23 50","sampleOutput":"98 86 23\n98 86 12\n98 72 65\n98 72 60 50\nMax Heap","idea":["给出一颗完全二叉树,打印出从根节点到所有叶节点的路径,打印顺序先右后左,即先序遍历的镜像。然后判断该树是大顶堆、小顶堆或者不是堆~","1.深搜打印出所有路径(从右往左,即先序的镜像),vector保存一路上的节点,通过push和pop回溯,维护路径,index \u003c= n是对只有左叶节点没有右叶节点的点特判2.判断是否为堆:从第二个节点开始遍历,如果比父节点小,就不是小顶堆,如果比父节点大,就不是大顶堆~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给出一颗完全二叉树,打印出从根节点到所有叶节点的路径,打印顺序先右后左,即先序遍历的镜像\n\nusing namespace std;\nvector\u003cint> v;\nint a[1009], n, isMin = 1, isMax = 1;\nvoid dfs(int index) {\n   if (index * 2 > n && index * 2 + 1 > n) {\n      if (index \u003c= n) {\n         for (int i = 0; i \u003c v.size(); i++)\n             printf(\"%d%s\", v[i], i != v.size() - 1 ? \" \" : \"\\n\");\n      }\n   } else {\n\n      v.push_back(a[index * 2 + 1]);\n      dfs(index * 2 + 1);\n\n      v.pop_back();\n      v.push_back(a[index * 2]);\n      dfs(index * 2);\n      v.pop_back();\n   }\n\n}\nint main() {\n   cin >> n;\n   for (int i = 1; i \u003c= n; i++)\n      scanf(\"%d\", &a[i]);\n   v.push_back(a[1]);\n   dfs(1);\n   for (int i = 2; i \u003c= n; i++) {\n      if (a[i/2] > a[i]) isMin = 0;\n      if (a[i/2] \u003c a[i]) isMax = 0;\n\n   }\n   if (isMin == 1)\n      printf(\"Min Heap\");\n   else\n      printf(\"%s\", isMax == 1 ? \"Max Heap\" : \"Not Heap\");\n   return 0;\n}"},{"id":"1156","title":"Sexy Primes","score":20,"category":"素数","description":["Sexy primes are pairs of primes of the form (p, p+6), so-named since “sex” is the Latin word for “six”.(Quoted from http://mathworld.wolfram.com/SexyPrimes.html)Now given an integer, you are supposed to tell if it is a sexy prime."],"input":"Each input file contains one test case. Each case gives a positive integer N (≤10^8).","output":"For each case, print in a line Yes if N is a sexy prime, then print in the next line the other sexy prime paired with N (if the answer is not unique, output the smaller number). Or if N is not a sexy prime,print No instead, then print in the next line the smallest sexy prime which is larger than N.","samples":[{"input":"47","output":"Yes\n41","explanation":"","label":"1"},{"input":"21","output":"No\n23","explanation":"","label":"2"}],"sampleInput":"47","sampleOutput":"Yes\n41","idea":["性感素数是指形如 (p, p+6) 这样的一对素数。给定一个整数,判断其是否为一个性感素数。若N是一个性感素数,则在一行中输出Yes,并在第二行输出与N配对的另一个性感素数(若这样的数不唯一,输出较小的那个)。若N不是性感素数,则在一行中输出No,然后在第二行输出大于N的最小性感素数。is_prime判断是否为素数。","判断p和p-6、p和p+6是否同时为素数,如果是,则为性感素数输出Yes。不是的话就从p+1往后找到第一个满足要求的数ans~"],"keyPoints":["判断素数时要单独处理 0、1，并枚举到平方根即可。","连续区间内多次判素时可根据数据规模选择筛法。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003ccmath>\n\n// 解题关键：性感素数是指形如 (p, p+6) 这样的一对素数\nusing namespace std;\nint p, ans;\nint is_prime(int x) {\n   if (x \u003c 2) return 0;\n   for (int i = 2; i \u003c= sqrt(x); i++)\n      if (x % i == 0) return 0;\n   return 1;\n}\n\nint main() {\n   cin >> p;\n   if (is_prime(p) && is_prime(p - 6)) {\n      cout \u003c\u003c \"Yes\\n\" \u003c\u003c p - 6;\n   } else if (is_prime(p) && is_prime(p + 6)) {\n      cout \u003c\u003c \"Yes\\n\" \u003c\u003c p + 6;\n   } else {\n      for (ans = p + 1; ; ans++) {\n         if (is_prime(ans) && is_prime(ans - 6)) break;\n\n         if (is_prime(ans) && is_prime(ans + 6)) break;\n      }\n      cout \u003c\u003c \"No\\n\" \u003c\u003c ans;\n   }\n   return 0;\n}"},{"id":"1157","title":"Anniversary","score":25,"category":"string字符串处理","description":["Zhejiang University is about to celebrate her 122th anniversary in 2019. To prepare for the celebration,the alumni association (校友会) has gathered the ID’s of all her alumni. Now your job is to write a program to count the number of alumni among all the people who come to the celebration."],"input":"Each input file contains one test case. For each case, the first part is about the information of all the alumni. Given in the first line is a positive integer N (≤10^5). Then N lines follow, each contains an ID number of an alumnus. An ID number is a string of 18 digits or the letter X. It is guaranteed that all\n\nthe ID’s are distinct.The next part gives the information of all the people who come to the celebration. Again given in the first line is a positive integer M (≤10^5). Then M lines follow, each contains an ID number of a guest. It is guaranteed that all the ID’s are distinct.","output":"First print in a line the number of alumni among all the people who come to the celebration. Then in the second line, print the ID of the oldest alumnus — notice that the 7th – 14th digits of the ID gives one’s birth date. If no alumnus comes, output the ID of the oldest guest instead. It is guaranteed that\n\nsuch an alumnus or guest is unique.","samples":[{"input":"5\n372928196906118710\n610481197806202213\n440684198612150417\n13072819571002001X\n150702193604190912\n6\n530125197901260019\n150702193604190912\n220221196701020034\n610481197806202213\n440684198612150417\n370205198709275042","output":"3\n150702193604190912","explanation":"","label":""}],"sampleInput":"5\n372928196906118710\n610481197806202213\n440684198612150417\n13072819571002001X\n150702193604190912\n6\n530125197901260019\n150702193604190912\n220221196701020034\n610481197806202213\n440684198612150417\n370205198709275042","sampleOutput":"3\n150702193604190912","idea":["为了准备校庆,校友会收集了所有校友的身份证号。编写程序,根据来参加校庆的所有人士的身份证号,统计来了多少校友。输入在第一行正整数N,随后N行,每行给出一位校友的身份证号(18位由数字和大写字母X组成的字符串)。题目保证身份证号不重复。随后给出前来参加校庆的所有人士的信息:首先是一个不超过正整数M,随后M行,每行给出一位人士的身份证号。题目保证身份证号不重复。","首先在第一行输出参加校庆的校友的人数。然后在第二行输出最年长的校友的身份证号——注意身份证第7-14位给出的是yyyymmdd格式的生日。如果没有校友来,则在第二行输出最年长的来宾 的身份证号。题目保证这样的校友或来宾必是唯一的。","使用容器set\u003cstring> record存储校友的身份证信息,smallx记录校友中最年长的生日,smalla记录所有人中最年长的生日,ansx记录最年长的校友的身份证号,ansa记录所有人中最年长的人的身份证号,cnt记录有多少校友参加。","将校友身份证存储在set容器record中,使用record.count来判断参加校庆的人是否是校友,使用substr(6, 8)快速提取身份证号中的生日信息,最后根据cnt的值输出~cnt不等于0,则说明有校友参加,输出最年长的校友的身份证号ansx;如果cnt等于0,说明没有校友参加,输出 所有人中最年长的人的身份证号ansa~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cset>\n\n// 解题关键：为了准备校庆,校友会收集了所有校友的身份证号\nusing namespace std;\nint n, m, cnt;\nstring temp, smallx = \"99999999\", smalla = \"99999999\", ansx, ansa;\n\nset\u003cstring> record;\nint main() {\n   cin >> n;\n   for (int i = 0; i \u003c n; i++) {\n      cin >> temp;\n\n      record.insert(temp);\n   }\n   cin >> m;\n   for (int i = 0; i \u003c m; i++) {\n      cin >> temp;\n      if (record.count(temp)) {\n         cnt++;\n         if (smallx > temp.substr(6, 8)) {\n             smallx = temp.substr(6, 8);\n             ansx = temp;\n\n         }\n      }\n      if (smalla > temp.substr(6, 8)) {\n             smalla = temp.substr(6, 8);\n             ansa = temp;\n      }\n   }\n   cout \u003c\u003c cnt \u003c\u003c endl;\n   if (cnt) cout \u003c\u003c ansx;\n\n   else cout \u003c\u003c ansa;\n   return 0;\n}"},{"id":"1158","title":"Telefraud Detection","score":25,"category":"并查集","description":["Telefraud(电信诈骗) remains a common and persistent problem in our society. In some cases,unsuspecting victims lose their entire life savings. To stop this crime, you are supposed to write a program to detect those suspects from a huge amount of phone call records.","A person must be detected as a suspect if he/she makes more than K short phone calls to different people everyday, but no more than 20% of these people would call back. And more, if two suspects are calling each other, we say they might belong to the same gang. A makes a short phone","call to B means that the total duration of the calls from A to B is no more than 5 minutes."],"input":"Each input file contains one test case. For each case, the first line gives 3 positive integers K (≤500, the threshold(阈值) of the amount of short phone calls), N (≤10^3, the number of different phone numbers), and M (≤10^5, the number of phone call records). Then M lines of one day’s records are\n\ngiven, each in the format:caller receiver duration where caller and receiver are numbered from 1 to N, and duration is no more than 1440 minutes in a day.","output":"Print in each line all the detected suspects in a gang, in ascending order of their numbers. The gangs are printed in ascending order of their first members. The numbers in a line must be separated by exactly 1 space, and there must be no extra space at the beginning or the end of the line.\n\nIf no one is detected, output None instead.","samples":[{"input":"5 15 31\n1 4 2\n1 5 2\n1 5 4\n1 7 5\n1 8 3\n1 9 1\n1 6 5\n1 15 2\n1 15 5\n3 2 2\n3 5 15\n3 13 1\n3 12 1\n3 14 1\n3 10 2\n3 11 5\n5 2 1\n5 3 10\n5 1 1\n5 7 2\n5 6 1\n5 13 4\n5 15 1\n11 10 5\n12 14 1\n6 1 1\n6 9 2\n6 10 5\n6 11 2\n6 12 1\n6 13 1","output":"3 5\n6\nNote: In sample 1, although 1 had 9 records, but there were 7 distinct receivers, among\nwhich 5 and 15 both had conversations lasted more than 5 minutes in total. Hence 1 had made 5 short\nphone calls and didn’t exceed the threshold 5, and therefore is not a suspect.","explanation":"","label":"1"},{"input":"5 7 8\n1 2 1\n1 3 1\n1 4 1\n1 5 1\n1 6 1\n1 7 1\n2 1 1\n3 1 1","output":"None","explanation":"","label":"2"}],"sampleInput":"5 15 31\n1 4 2\n1 5 2\n1 5 4\n1 7 5\n1 8 3\n1 9 1\n1 6 5\n1 15 2\n1 15 5\n3 2 2\n3 5 15\n3 13 1\n3 12 1\n3 14 1\n3 10 2\n3 11 5\n5 2 1\n5 3 10\n5 1 1\n5 7 2\n5 6 1\n5 13 4\n5 15 1\n11 10 5\n12 14 1\n6 1 1\n6 9 2\n6 10 5\n6 11 2\n6 12 1\n6 13 1","sampleOutput":"3 5\n6\nNote: In sample 1, although 1 had 9 records, but there were 7 distinct receivers, among\nwhich 5 and 15 both had conversations lasted more than 5 minutes in total. Hence 1 had made 5 short\nphone calls and didn’t exceed the threshold 5, and therefore is not a suspect.","idea":["编写一个程序,从大量的通话记录中检测出电信诈骗嫌疑人。如果一个人每天给不同的人打超过K个短电话,但这些人中回电的比例不超过20%,那他可能是嫌疑人。而且,如果两个嫌疑人互相打电话,我们认为他们可能属于同一个团伙。A给B打短电话是指A到B的通话总时长不超过5分钟。给三个正整数:短电话数量的阈值K,不同电话号码的数量N,通话记录数量M。","接下来M行给出一天的通话记录,格式为呼叫者caller、接收者receiver、时长duration。输出格式:在每一行输出一个团伙中所有检测到的嫌疑人,按数字升序排列。这些帮派按第一个成员的升序排列。一行中的数字必须使用1 个空格分隔,并且行首或行尾不得有多余空格。","p为并查集的父集,sc中存储短通话的人数,rec中存储短通话收到回电的人数,mark用来标记是否输出过,record记录两个人的通话总时长,su中保存嫌疑人的编号。我们先记录下来两人之间的通话总时间,以此来统计短通话以及回电的次数,进而判断出某个人是不是嫌疑人。如果没有嫌疑人,则输出None。","因为要按照帮派输出,所以我们用并查集把互相通过电话的嫌疑人设置到同一个集合内,然后就可以输出答案了~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：编写一个程序,从大量的通话记录中检测出电信诈骗嫌疑人\nusing namespace std;\nint k, n, m, c, r, d, p[1001], sc[1001], rec[1001], mark[1001], record[1001]\n[1001];\nvector\u003cint> su;\nint Find(int a) {\n\n   if (p[a] != a) return p[a] = Find(p[a]);\n   return a;\n}\nvoid add(int a, int b) {\n   int f1 = Find(a), f2 = Find(b);\n   if (f1 \u003c f2) p[f2] = f1;\n   else p[f1] = f2;\n}\nint main() {\n\n   for (int i = 1; i \u003c= 1000; i++) p[i] = i;\n   cin >> k >> n >> m;\n   for (int i = 0; i \u003c m; i++) {\n      cin >> c >> r >> d;\n      record[c][r] += d;\n   }\n\n   for (int i = 1; i \u003c= n; i++) {\n      for (int j = 1; j \u003c= n; j++) {\n         if (record[i][j] && record[i][j] \u003c= 5) {\n             sc[i]++;\n             if (record[j][i]) rec[i]++;\n\n         }\n      }\n      if (sc[i] > k && rec[i] * 5 \u003c= sc[i]) su.push_back(i);\n   }\n   if (su.empty()) {\n      cout \u003c\u003c \"None\";\n      return 0;\n   }\n   for (int i = 0; i \u003c su.size(); i++) {\n      for (int j = i + 1; j \u003c su.size(); j++) {\n\n         if (record[su[i]][su[j]] && record[su[j]][su[i]]) add(su[i], su[j]);\n      }\n   }\n   for (int i = 0; i \u003c su.size(); i++) {\n      if (mark[su[i]]) continue;\n      cout \u003c\u003c su[i];\n      for (int j = i + 1; j \u003c su.size(); j++) {\n         if (Find(su[i]) == Find(su[j])) {\n\n             cout \u003c\u003c ' ' \u003c\u003c su[j];\n             mark[su[j]] = 1;\n         }\n      }\n      cout \u003c\u003c '\\n';\n   }\n   return 0;\n}"},{"id":"1159","title":"Structure of a Binary Tree","score":30,"category":"树的遍历","description":["Suppose that all the keys in a binary tree are distinct positive integers. Given the postorder and inorder traversal sequences, a binary tree can be uniquely determined.Now given a sequence of statements about the structure of the resulting tree, you are supposed to tell","if they are correct or not. A statment is one of the following:A is the root A and B are siblings A is the parent of B A is the left child of B A is the right child of B A and B are on the same level It is a full tree Note:Two nodes are on the same level, means that they have the same depth.","A full binary tree is a tree in which every node other than the leaves has two children."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (≤30), the total number of nodes in the binary tree. The second line gives the postorder sequence and the third line gives the inorder sequence. All the numbers in a line are no more than 103 and are separated by a\n\nspace.Then another positive integer M (≤30) is given, followed by M lines of statements. It is guaranteed that both A and B in the statements are in the tree.","output":"For each statement, print in a line Yes if it is correct, or No if not.","samples":[{"input":"9\n16 7 11 32 28 2 23 8 15\n16 23 7 32 11 2 28 15 8\n7\n15 is the root\n8 and 2 are siblings\n32 is the parent of 11\n23 is the left child of 16\n28 is the right child of 2\n7 and 11 are on the same level\nIt is a full tree","output":"Yes\nNo\nYes\nNo\nYes\nYes\nYes","explanation":"","label":""}],"sampleInput":"9\n16 7 11 32 28 2 23 8 15\n16 23 7 32 11 2 28 15 8\n7\n15 is the root\n8 and 2 are siblings\n32 is the parent of 11\n23 is the left child of 16\n28 is the right child of 2\n7 and 11 are on the same level\nIt is a full tree","sampleOutput":"Yes\nNo\nYes\nNo\nYes\nYes\nYes","idea":["假设二叉树中的所有值都是不同的正整数,给定后序和中序遍历可以唯一确定一棵二叉树。给出一系列关于二叉树结构的语句,判断它们是否正确,语句是以下之一:A是根结点,A和B是兄弟姐妹,A是B的父结点,A是B的左孩子,A是B的右孩子,A和B在同一层,这是一棵full tree。","(两个结点在同一层,意味着这两个结点具有同样深度;full binary tree是指除了叶子结点外,每个结点都有两个孩子)。输入样例:第一行给出正整数N,即二叉树中结点的总数;第二行给出后序遍历序列,第三行给出中序遍历序列。一行中所有数字不超过10的3次方,并且用空格分隔。然后给出一个正整数M,然后是M行语句,保证语句的A和B都在树中。","输出样例:对于每条语句,如果正确,则输出Yes,否则 输出No。","中序存储在In数组中,后序存储在Post数组中,根据中序和后序建树,Tree中存储树上结点的相关信息,下标即表示结点的值,其中lchild存储左孩子下标,rchild存储右孩子下标,parent存储父结点下标,将这些初始化为-1表示不存在,level存储深度,此外,root为根节点的值,Full标记是否是full tree,f判断当前语句是否正确,最后根据f的值输出Yes或No~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include\u003ciostream>\n\n// 解题关键：假设二叉树中的所有值都是不同的正整数,给定后序和中序遍历可以唯一确定一棵二叉树\nusing namespace std;\nstruct node {\n   int lchild, rchild, parent, level;\n   node() {\n      lchild = rchild = parent = -1;\n\n   }\n}Tree[1002];\nint n, m, a, b, root, f, Full;\nint In[32], Post[32];\nstring t;\nint deal(int R, int start, int end, int Pa) {\n   if(start > end) return -1;\n   int i = start;\n   while(i \u003c end && In[i] != Post[R]) i++;\n   Tree[Post[R]].parent = Pa;\n\n   Tree[Post[R]].level = Tree[Pa].level + 1;\n   Tree[Post[R]].lchild = deal(R - 1 - end + i, start, i - 1, Post[R]);\n   Tree[Post[R]].rchild = deal(R - 1, i + 1, end, Post[R]);\n   if (Tree[Post[R]].lchild * Tree[Post[R]].rchild \u003c 0) Full = 1;\n   return Post[R];\n}\nint main() {\n   cin >> n;\n   for (int i = 0; i \u003c n; i++) {\n\n      cin >> Post[i];\n   }\n   for (int i = 0; i \u003c n; i++)\n      cin >> In[i];\n   root = Post[n - 1];\n   deal(n - 1, 0, n - 1, 1001);\n   cin >> m;\n   while (m--) {\n      f = 0;\n      cin >> t;\n\n      if (t == \"It\") {\n         cin >> t >> t >> t >> t;\n         if (Full) cout \u003c\u003c \"No\\n\";\n         else cout \u003c\u003c \"Yes\\n\";\n         continue;\n      }\n      a = stoi(t);\n      cin >> t;\n      if (t == \"is\") {\n\n         cin >> t >> t;\n         if (t == \"root\") {\n             if (a == root) f = 1;\n         } else if (t == \"parent\") {\n             cin >> t >> b;\n\n             if (Tree[b].parent == a) f = 1;\n         } else if (t == \"left\") {\n             cin >> t >> t >> b;\n             if (Tree[b].lchild == a) f = 1;\n         } else {\n             cin >> t >> t >> b;\n             if (Tree[b].rchild == a) f = 1;\n         }\n      } else {\n         cin >> b >> t >> t;\n\n         if (t == \"siblings\") {\n             if (Tree[a].parent == Tree[b].parent) f = 1;\n         } else {\n             cin >> t >> t >> t;\n             if (Tree[a].level == Tree[b].level) f = 1;\n         }\n      }\n      cout \u003c\u003c (f ? \"Yes\\n\" : \"No\\n\");\n   }\n\n   return 0;\n}"},{"id":"1160","title":"Forever","score":20,"category":"结构体,排序,素数","description":["“Forever number” is a positive integer A with K digits, satisfying the following constrains:the sum of all the digits of A is m;the sum of all the digits of A+1 is n; and the greatest common divisor of m and n is a prime number which is greater than 2.Now you are supposed to find these forever numbers."],"input":"Each input file contains one test case. For each test case, the first line contains a positive integer N (≤5). Then N lines follow, each gives a pair of K (3\u003cK\u003c10) and m (1\u003cm\u003c90), of which the meanings are given in the problem description.","output":"For each pair of K and m, first print in a line Case X, where X is the case index (starts from 1). Then print n and A in the following line. The numbers must be separated by a space. If the solution is not unique, output in the ascending order of n. If still not unique, output in the ascending order of A. If\n\nthere is no solution, output No Solution.","samples":[{"input":"2\n6 45\n7 80","output":"Case 1\n10 189999\n10 279999\n10 369999\n10 459999\n10 549999\n10 639999\n10 729999\n10 819999\n10 909999\nCase 2\nNo Solution","explanation":"","label":""}],"sampleInput":"2\n6 45\n7 80","sampleOutput":"Case 1\n10 189999\n10 279999\n10 369999\n10 459999\n10 549999\n10 639999\n10 729999\n10 819999\n10 909999\nCase 2\nNo Solution","idea":["“天长地久数”是指一个K位正整数A,其满足条件为A的各位数字之和为m,A+1的各位数字之和为n,且m与n的最大公约数是一个大于2的素数。本题就请你找出这些天长地久数。输入在第一行给出正整数N(≤5),随后N行,每行给出一对K(3\u003cK\u003c10)和m(1\u003cm\u003c90)。","对每一对输入的K和m,首先在一行中输出Case X,其中X是输出的编号(从1开始);然后一行输出对应的n和A,数字间以空格分隔。如果解不唯一,则每组解占一行,按n的递增序输出;若仍不唯一,则按A的递增序输出。若解不存在,则在一行中输出No Solution。sum记录A的各位数字之和,sum2记录A+1的各位数字之和,I与II分别为数A与A+1。","由打表观察可得,所有天长地久数最后两位为”99′′,那么将末尾的两个’9’隐藏后可直接带入暴力循环判断。将所有可能答案存储后排序输出即可~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003ccmath>\n#include \u003calgorithm>\n#include \u003cnumeric>\n\n// 解题关键：“天长地久数”是指一个K位正整数A,其满足条件为A的各位数字之和为m,A+1的各位数字之和为n,且m与n的最大公约数是一个大于2的素数\n\nusing namespace std;\nstruct node {\n   int n, num;\n   friend bool operator \u003c (node &a, node &b) {\n      if (a.n != b.n) return a.n \u003c b.n;\n      return a.num \u003c b.num;\n   }\n}T;\nint N, K, m, temp, sum, sum2, I, II;\n\nvector\u003cnode> A;\nint is_prime(int x) {\n   if (x \u003c= 2) return 0;\n   for (int i = 2; i \u003c= sqrt(x); i++) {\n      if (x % i == 0) return 0;\n   }\n\n   return 1;\n}\nint main() {\n   cin >> N;\n   for (int i = 1 ; i \u003c= N; i++) {\n\n      A.clear();\n      cout \u003c\u003c \"Case \" \u003c\u003c i \u003c\u003c '\\n';\n      cin >> K >> m;\n      if (K * 9 \u003c m) cout \u003c\u003c \"No Solution\\n\";\n      else {\n         temp = pow(10, K - 2);\n         for (int i = temp / 10; i \u003c temp; i++) {\n             sum = 18, sum2 = 0, I = i, II = i + 1;\n             while (I) {\n                sum += I % 10;\n\n                I /= 10;\n                if (sum > m) break;\n             }\n             while (II) {\n                sum2 += II % 10;\n                II /= 10;\n             }\n             if (sum == m && is_prime(std::gcd(m, sum2))) {\n                T.n = sum2, T.num = i;\n\n                A.push_back(T);\n             }\n         }\n         sort(A.begin(), A.end());\n         if (A.empty()) cout \u003c\u003c \"No Solution\\n\";\n         for (auto &it : A) {\n             cout \u003c\u003c it.n \u003c\u003c ' ' \u003c\u003c it.num \u003c\u003c \"99\\n\";\n         }\n      }\n\n   }\n   return 0;\n}"},{"id":"1161","title":"Merging Linked Lists","score":25,"category":"链表","description":["Given two singly linked lists L1=a1→a2→...→an−1→an and L2=b1→b2→...→bm−1→bm. If n≥2m,you are supposed to reverse and merge the shorter one into the longer one to obtain a list like a1→a2→bm→a3→a4→bm−1.... For example, given one list being 6→7 and the other one 1→2→3→4→5,","you must output 1→2→7→3→4→6→5."],"input":"Each input file contains one test case. For each case, the first line contains the two addresses of the first nodes of L1 and L2, plus a positive N (≤10^5) which is the total number of nodes given. The address of a node is a 5-digit nonnegative integer, and NULL is represented by -1.\n\nThen N lines follow, each describes a node in the format:Address Data Next where Address is the position of the node, Data is a positive integer no more than 105, and Next is the position of the next node. It is guaranteed that no list is empty, and the longer list is at least twice as\n\nlong as the shorter one.","output":"For each case, output in order the resulting linked list. Each node occupies a line, and is printed in the same format as in the input.","samples":[{"input":"00100 01000 7\n02233 2 34891\n00100 6 00001\n34891 3 10086\n01000 1 02233\n00033 5 -1\n10086 4 00033\n00001 7 -1","output":"01000 1 02233\n02233 2 00001\n00001 7 34891\n34891 3 10086\n10086 4 00100\n00100 6 00033\n00033 5 -1","explanation":"","label":""}],"sampleInput":"00100 01000 7\n02233 2 34891\n00100 6 00001\n34891 3 10086\n01000 1 02233\n00033 5 -1\n10086 4 00033\n00001 7 -1","sampleOutput":"01000 1 02233\n02233 2 00001\n00001 7 34891\n34891 3 10086\n10086 4 00100\n00100 6 00033\n00033 5 -1","idea":["给定两个单链表L1 = a1 → a2 →... → an-1 → an,和L2 = b1 → b2 →... → bm-1 → bm,如果n ≥2m,你的任务是将较短的那个链表逆序,然后将之并入比较长的那个链表,得到一个形如a1 →a2 → bm → a3 → a4 → bm-1... 的结果,例如给定两个链表分别为6→7和1→2→3→4→5,你应该输出1→2→7→3→4→6→5。","输入首先在第一行中给出两个链表L1和L2的头结点的地址、以及给定的结点总数N,一个结点的地址是一个5位数的非负整数,空地址 NULL用-1表示。","随后N行,每行按以下格式给 出一个结点的信息:Address Data Next,其中Address是结点的地址,Data是不超过10的5次方的正整数,Next是下一个结点的地址,题目保证没有空链表,并且较长的链表至少是较短链表的两倍长。按顺序输出结果列表,每个结点占一行,格式与输入相同。","用vector\u003cint> L1、L2存储题目中给定的两个链表,vector\u003cint> ans保存合并后的链表。将较长的一个链表存储在L1中,如果原本L1较短,则将L1与L2用swap函数互相置换~在链表合并的过程中,i从0开始,将L1中每个结点添加到ans中,如果当前i是奇数(i & 1不等于0)就把L2的一个结点添加到ans中,直到L2中没有剩余元素~如此反复,就大功告成啦。"],"keyPoints":["先按地址建立结点映射，再沿 next 指针恢复有效链表顺序。","输出地址时通常需要补足 5 位，空地址按题目要求输出。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给定两个单链表L1 = a1 → a2 →... → an-1 → an,和L2 = b1 → b2 →... → bm-1 → bm,如果n ≥2m,你的任务是将较短的那个链表逆序,然后将之并入比较长的那个链表,得到一\nusing namespace std;\nstruct node {\n\n   int data, next;\n\n}A[100000];\nvector\u003cint> L1, L2, ans;\nint sa, sb, n, a, ta, tb, c;\nint main() {\n   cin >> sa >> sb >> n;\n\n   for (int i = 0; i \u003c n; i++) {\n      cin >> a >> A[a].data >> A[a].next;\n   }\n   ta = sa;\n   while (ta != -1) {\n      L1.push_back(ta);\n      ta = A[ta].next;\n   }\n   tb = sb;\n   while (tb != -1) {\n\n      L2.push_back(tb);\n      tb = A[tb].next;\n   }\n   if (L1.size() \u003c L2.size()) swap(L1, L2);\n   for (int i = 0, c = L2.size() - 1; i \u003c L1.size(); i++) {\n      ans.push_back(L1[i]);\n      if (i & 1 && c >= 0) ans.push_back(L2[c--]);\n   }\n   for (int i = 1; i \u003c ans.size(); i++) {\n\n      printf(\"%05d %d %05d\\n\", ans[i-1], A[ans[i-1]].data, ans[i]);\n   }\n   printf(\"%05d %d -1\", ans.back(), A[ans.back()].data);\n   return 0;\n}"},{"id":"1162","title":"Postfix Expression","score":25,"category":"树的遍历","description":["Given a syntax tree (binary), you are supposed to output the corresponding postfix expression, with parentheses reflecting the precedences of the operators."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (≤ 20)which is the total number of nodes in the syntax tree. Then N lines follow, each gives the information of a node (the i-th line corresponds to the i-th node) in the format:\n\ndata left_child right_child where data is a string of no more than 10 characters, left_child and right_child are the indices of this node’s left and right children, respectively. The nodes are indexed from 1 to N. The NULL link is represented by −1. The figures 1 and 2 correspond to the samples 1 and 2, respectively.","output":"For each case, print in a line the postfix expression, with parentheses reflecting the precedences of the operators.There must be no space between any symbols.","samples":[{"input":"8\n* 8 7\na -1 -1\n* 4 1\n+ 2 5\nb -1 -1\nd -1 -1\n– -1 6\nc -1 -1","output":"(((a)(b)+)((c)(-(d))*)*)","explanation":"","label":"1"},{"input":"8\n2.35 -1 -1\n* 6 1\n– -1 4\n% 7 8\n+ 2 3\na -1 -1\nstr -1 -1\n871 -1 -1","output":"(((a)(2.35)*)(-((str)(871)%))+)","explanation":"","label":"2"}],"sampleInput":"8\n* 8 7\na -1 -1\n* 4 1\n+ 2 5\nb -1 -1\nd -1 -1\n– -1 6\nc -1 -1","sampleOutput":"(((a)(b)+)((c)(-(d))*)*)","idea":["给一个语法树,输出相应的后缀表达式,用括号反映运算符的优先级。输出样例:第一行给一个正整数N,表示语法树结点的总数量。然后是N行,每行给出一个结点的信息(第i行对应第i个结点),格式为data left_child right_child,其中data是不超过10个字符的字符串,left_child和right_child分别是该结点的左右子结点的下标。结点的下标从1到N。","NULL用-1表示。输出样例:对于每种情况,在一行中输出后缀表达式,括号反映运算符的优先级。任何符号之间没有多余的空格。lc中存储左孩子下标,rc中存储右孩子下标,mark用来标记一个结点是否是别人的结点,以便判断出谁是树的根结点。","本题比较简单,在找到根结点后,从根结点开始进行搜索,首先输出一个 ‘(‘ 如果当前结点同时存在左右孩子,那么就分别继续搜索左右孩子,接下来输出当前结点的内容,如果只有右子树(语法树不会存在只有左子树没有右子树的情况),那么就在输出当前结点内容后进入右孩子结点继续搜索,最后输出一个 ‘)’ ~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给一个语法树,输出相应的后缀表达式,用括号反映运算符的优先级\nusing namespace std;\nint n, root = 1, lc[32], rc[32], mark[32];\n\nstring Data[32];\nvoid deal(int x) {\n   cout \u003c\u003c '(';\n   if (lc[x] * rc[x] > 1) {\n      deal(lc[x]);\n      deal(rc[x]);\n   }\n   cout \u003c\u003c Data[x];\n   if (lc[x] * rc[x] \u003c 0) deal(rc[x]);\n\n   cout \u003c\u003c ')';\n}\nint main() {\n   cin >> n;\n   for (int i = 1; i \u003c= n; i++) {\n      cin >> Data[i] >> lc[i] >> rc[i];\n      mark[lc[i]] = mark[rc[i]] = 1;\n   }\n   while(mark[root]) root++;\n   deal(root);\n\n   return 0;\n}"},{"id":"1163","title":"Dijkstra Sequence","score":30,"category":"Dijkstra算法,最短路径","description":["Dijkstra’s algorithm is one of the very famous greedy algorithms.It is used for solving the single source shortest path problem which gives the shortest paths from one particular source vertex to all the other vertices of the given graph. It was conceived by computer","scientist Edsger W. Dijkstra in 1956 and published three years later.In this algorithm, a set contains vertices included in shortest path tree is maintained. During each step, we find one vertex which is not yet included and has a minimum distance from the source, and","collect it into the set. Hence step by step an ordered sequence of vertices, let’s call it Dijkstra sequence,is generated by Dijkstra’s algorithm.On the other hand, for a given graph, there could be more than one Dijkstra sequence. For example,both { 5, 1, 3, 4, 2 } and { 5, 3, 1, 2, 4 } are Dijkstra sequences for the graph, where 5 is the source. Your","job is to check whether a given sequence is Dijkstra sequence or not."],"input":"Each input file contains one test case. For each case, the first line contains two positive integers Nv(≤10^3) and Ne (≤10^5), which are the total numbers of vertices and edges, respectively. Hence the vertices are numbered from 1 to Nv.Then Ne lines follow, each describes an edge by giving the indices of the vertices at the two ends,\n\nfollowed by a positive integer weight (≤100) of the edge. It is guaranteed that the given graph is connected.Finally the number of queries, K, is given as a positive integer no larger than 100, followed by K lines of sequences, each contains a permutationof the Nv vertices. It is assumed that the first vertex is the\n\nsource for each sequence.All the inputs in a line are separated by a space.","output":"For each of the K sequences, print in a line Yes if it is a Dijkstra sequence, or No if not.","samples":[{"input":"5 7\n1 2 2\n1 5 1\n2 3 1\n2 4 1\n2 5 2\n3 5 1\n3 4 1\n4\n5 1 3 4 2\n5 3 1 2 4\n2 3 4 5 1\n3 2 1 5 4","output":"Yes\nYes\nYes\nNo","explanation":"","label":""}],"sampleInput":"5 7\n1 2 2\n1 5 1\n2 3 1\n2 4 1\n2 5 2\n3 5 1\n3 4 1\n4\n5 1 3 4 2\n5 3 1 2 4\n2 3 4 5 1\n3 2 1 5 4","sampleOutput":"Yes\nYes\nYes\nNo","idea":["Dijkstra算法用来解决单源最短路径问题,用来寻找从一个特定源顶点到给定图的所有其他顶点的最短路径。在每一步中,我们找到一个尚未包含且与源顶点距离最小的顶点,并将其收集到集合中。通过Dijkstra算法逐步生成的一个有序的序列称之为Dijkstra序列。对于给定的图,可能有多个Dijkstra序列。你的工作是检查给定的序列是否是Dijkstra序列。","输入样例:第一行输入两个正整数Nv和Ne,分别是顶点和边的总数量。顶点的编号是1到Nv,然后是Ne行,每行通过给出两端顶点的编号来描述一条边,外加一个正整数,表示边的权重。保证给定的图是连通的。最后,给出一个正整数K表 示查询的次数,然后是K行序列,每行包含Nv个顶点的排列,假设第一个顶点是每个序列的源点。一行中的所有输入由空格分隔。","输出格式:对于K个序列中的每一个,如果它是Dijkstra序列,则输出一行Yes,否则输出No。V和E表示顶点和边的数量,二维数组Edge中存储两点之间的距离,数组Path为当前需要判断的序列,数组Distance为Dijskra最短路径起点到各个点的最短距离,flag记录当前路径是否为真,book标记确定好最短距离的点。","直接丢到Dijskra算法里,判断每一步能不能由给定的路径完成,最后根据flag的值输出Yes或No~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：Dijkstra算法用来解决单源最短路径问题,用来寻找从一个特定源顶点到给定图的所有其他顶点的最短路径\nusing namespace std;\nint V, E, K, Start, End, a, b, d;\nint Edge[1002][1002], Distance[1002], flag, book[1002];\nvoid deal(int x, int index, vector\u003cint> Path) {\n   for(int k = 1; k \u003c= V; k++) {\n      int Min = 9999999, now = Path[index];\n\n      for(int i = 1; i \u003c= V; i++) {\n         if(Distance[i] != 9999999 && !book[i] && Distance[i] \u003c= Min) {\n             if(Distance[i] \u003c Min) {\n                if(i == now) flag = 1;\n                else flag = 0;\n             } else if(Distance[i] == Min) {\n                if(i == now) flag = 1;\n             }\n             Min = Distance[i];\n\n         }\n      }\n      if(!flag) return;\n      ++index;\n      if(index > V) return;\n      book[now] = 1;\n      for(int i = 1; i \u003c= V; i++)\n         if(!book[i] && Distance[i] > Distance[now] + Edge[now][i] && Edge[now][i] != 0)\n             Distance[i] = Distance[now] + Edge[now][i];\n\n   }\n}\nint main() {\n   cin >> V >> E;\n   for(int i = 0; i \u003c E; i++) {\n      cin >> a >> b >> d;\n      Edge[a][b] = Edge[b][a] = d;\n   }\n   cin >> K;\n\n   for(int i = 0; i \u003c K; i++) {\n      vector\u003cint> Path(V);\n      flag = 1;\n      fill(book, book + 1002, 0);\n      fill(Distance, Distance + 1002, 9999999);\n      for(int j = 0; j \u003c V; j++) cin >> Path[j];\n      Start = Path[0], End = Path[V - 1];\n      Distance[Start] = 0;\n      deal(Start, 0, Path);\n\n      if(flag) cout \u003c\u003c \"Yes\\n\";\n      else cout \u003c\u003c \"No\\n\";\n   }\n   return 0;\n}"},{"id":"1164","title":"Good in C","score":20,"category":"string字符串处理","description":["When your interviewer asks you to write “Hello World” using C, can you do as the following figure shows?"],"input":"Each input file contains one test case. For each case, the first part gives the 26 capital English letters A-Z, each in a 7×5 matrix of C‘s and.‘s. Then a sentence is given in a line, ended by a return. The sentence is formed by several words (no more than 10 continuous capital English letters each), and\n\nthe words are separated by any characters other than capital English letters.It is guaranteed that there is at least one word given.","output":"For each word, print the matrix form of each of its letters in a line, and the letters must be separated by exactly one column of space. There must be no extra space at the beginning or the end of the word.Between two adjacent words, there must be a single empty line to separate them. There must be no\n\nextra line at the beginning or the end of the output.","samples":[{"input":"..C..\n.C.C.\nC...C\nCCCCC\nC...C\nC...C\nC...C\nCCCC.\nC...C\nC...C\nCCCC.\nC...C\nC...C\nCCCC.\n.CCC.\nC...C\nC....\nC....\nC....\nC...C\n.CCC.\nCCCC.\nC...C\nC...C\nC...C\nC...C\nC...C\nCCCC.\nCCCCC\nC....\nC....\nCCCC.\nC....\nC....\nCCCCC\nCCCCC\nC....\nC....\nCCCC.\nC....\nC....\nC....\nCCCC.\nC...C\nC....\nC.CCC\nC...C\nC...C\nCCCC.\nC...C\nC...C\nC...C\nCCCCC\nC...C\nC...C\nC...C\nCCCCC\n..C..\n..C..\n..C..\n..C..\n..C..\nCCCCC\nCCCCC\n....C\n....C\n....C\n....C\nC...C\n.CCC.\nC...C\nC..C.\nC.C..\nCC...\nC.C..\nC..C.\nC...C\nC....\nC....\nC....\nC....\nC....\nC....\nCCCCC\nC...C\nC...C\nCC.CC\nC.C.C\nC...C\nC...C\nC...C\nC...C\nC...C\nCC..C\nC.C.C\nC..CC\nC...C\nC...C\n.CCC.\nC...C\nC...C\nC...C\nC...C\nC...C\n.CCC.\nCCCC.\nC...C\nC...C\nCCCC.\nC....\nC....\nC....\n.
