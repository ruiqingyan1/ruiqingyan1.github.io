be taken care of."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (\u003c=50000),the total number of couples. Then N lines of the couples follow, each gives a couple of ID’s which are 5-digit numbers (i.e. from 00000 to 99999). After the list of couples, there is a positive integer M\n\n(\u003c=10000) followed by M ID’s of the party guests. The numbers are separated by spaces. It is guaranteed that nobody is having bigamous marriage (重婚) or dangling with more than one companion.","output":"First print in a line the total number of lonely guests. Then in the next line, print their ID’s in increasing order. The numbers must be separated by exactly 1 space, and there must be no extra space at the end of the line.","samples":[{"input":"3\n11111 22222\n33333 44444\n55555 66666\n7\n55555 44444 10000 88888 22222 11111 23333","output":"5\n10000 23333 44444 55555 88888","explanation":"","label":""}],"sampleInput":"3\n11111 22222\n33333 44444\n55555 66666\n7\n55555 44444 10000 88888 22222 11111 23333","sampleOutput":"5\n10000 23333 44444 55555 88888","idea":["设立数组couple[i] = j表示i的对象是j。一开始先设置为都是-1。设立数组isExist表示某人的对象是否来到了派对上。接收数据的时候,对于每一对a和b,将couple的a设置为b,b设置为a,表示他俩是一对。","对于每一个需要判断的人,将其存储在guest数组里面,如果它不是单身的(也就是如果它的couple[guest[i]]!= -1)那么就将它对象的isExist设置为1,表示他对象的对象(也就是他自己)来到了派对。这样所有isExist不为1的人,对象是没有来到派对的。","把所有的人遍历后插入一个集合set里面, set的size就是所求的人数,set里面的所有数就是所求的人的递增排列~~~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cset>\n#include \u003cvector>\n\n// 解题关键：设立数组couple[i] = j表示i的对象是j\n\nusing namespace std;\nint main() {\n   int n, a, b, m;\n   scanf(\"%d\", &n);\n   vector\u003cint> couple(100000);\n   for (int i = 0; i \u003c 100000; i++)\n      couple[i] = -1;\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d%d\", &a, &b);\n\n      couple[a] = b;\n      couple[b] = a;\n   }\n   scanf(\"%d\", &m);\n   vector\u003cint> guest(m), isExist(100000);\n   for (int i = 0; i \u003c m; i++) {\n      scanf(\"%d\", &guest[i]);\n      if (couple[guest[i]] != -1)\n         isExist[couple[guest[i]]] = 1;\n   }\n\n   set\u003cint> s;\n   for (int i = 0; i \u003c m; i++)\n      if (!isExist[guest[i]]) s.insert(guest[i]);\n   printf(\"%d\\n\", s.size());\n   for (auto it = s.begin(); it != s.end(); it++) {\n      if (it != s.begin()) printf(\" \");\n      printf(\"%05d\", *it);\n   }\n   return 0;\n}"},{"id":"1122","title":"Hamiltonian Cycle","score":25,"category":"图论","description":["The “Hamilton cycle problem” is to find a simple cycle that contains every vertex in a graph. Such a cycle is called a “Hamiltonian cycle”.In this problem, you are supposed to tell if a given cycle is a Hamiltonian cycle."],"input":"Each input file contains one test case. For each case, the first line contains 2 positive integers N (2\u003c N\u003c= 200), the number of vertices, and M, the number of edges in an undirected graph. Then M lines follow, each describes an edge in the format “Vertex1 Vertex2”, where the vertices are numbered from\n\n1 to N. The next line gives a positive integer K which is the number of queries, followed by K lines of queries, each in the format:n V V... V 1 2 n where n is the number of vertices in the list, and V‘s are the vertices on a path.i","output":"For each query, print in a line “YES” if the path does form a Hamiltonian cycle, or “NO” if not.","samples":[{"input":"6 10\n6 2\n3 4\n1 5\n2 5\n3 1\n4 1\n1 6\n6 3\n1 2\n4 5\n6\n7 5 1 4 3 6 2 5\n6 5 1 4 3 6 2\n9 6 2 1 6 3 4 5 2 6\n4 1 2 5 1\n7 6 1 3 4 5 2 6\n7 6 1 2 5 4 3 1","output":"YES\nNO\nNO\nNO\nYES\nNO","explanation":"","label":""}],"sampleInput":"6 10\n6 2\n3 4\n1 5\n2 5\n3 1\n4 1\n1 6\n6 3\n1 2\n4 5\n6\n7 5 1 4 3 6 2 5\n6 5 1 4 3 6 2\n9 6 2 1 6 3 4 5 2 6\n4 1 2 5 1\n7 6 1 3 4 5 2 6\n7 6 1 2 5 4 3 1","sampleOutput":"YES\nNO\nNO\nNO\nYES\nNO","idea":["给出一个图,判断给定的路径是不是哈密尔顿路径分析:1.设置falg1 判断节点是否多走、少走、或走成环2.设置flag2 判断这条路能不能走通3.当falg1、flag2都为1时是哈密尔顿路径,否则不是"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cset>\n#include \u003cvector>\n\n// 解题关键：给出一个图,判断给定的路径是不是哈密尔顿路径分析:1.设置falg1 判断节点是否多走、少走、或走成环2.设置flag2 判断这条路能不能走通3.当falg1、flag2都为1时是哈密尔顿路径,否则不是\nusing namespace std;\n\nint main() {\n   int n, m, cnt, k, a[210][210] = {0};\n   cin >> n >> m;\n   for(int i = 0; i \u003c m; i++) {\n      int t1, t2;\n      scanf(\"%d%d\", &t1, &t2);\n      a[t1][t2] = a[t2][t1] = 1;\n   }\n   cin >> cnt;\n   while(cnt--) {\n\n      cin >> k;\n      vector\u003cint> v(k);\n      set\u003cint> s;\n      int flag1 = 1, flag2 = 1;\n      for(int i = 0; i \u003c k; i++) {\n         scanf(\"%d\", &v[i]);\n         s.insert(v[i]);\n      }\n      if(s.size() != n || k - 1 != n || v[0] != v[k-1]) flag1 = 0;\n\n      for(int i = 0; i \u003c k - 1; i++)\n         if(a[v[i]][v[i+1]] == 0) flag2 = 0;\n      printf(\"%s\",flag1 && flag2 ? \"YES\\n\" : \"NO\\n\");\n   }\n   return 0;\n}"},{"id":"1123","title":"Is It a Complete AVL Tree","score":30,"category":"AVL树","description":["An AVL tree is a self-balancing binary search tree. In an AVL tree, the heights of the two child subtrees of any node differ by at most one; if at any time they differ by more than one, rebalancing is done to restore this property. Figures 1-4 illustrate the rotation rules.","Now given a sequence of insertions, you are supposed to output the level-order traversal sequence of the resulting AVL tree, and to tell if it is a complete binary tree."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N (\u003c= 20).Then N distinct integer keys are given in the next line. All the numbers in a line are separated by a space.","output":"For each test case, insert the keys one by one into an initially empty AVL tree. Then first print in a line the level-order traversal sequence of the resulting AVL tree. All the numbers in a line must be separated by a space, and there must be no extra space at the end of the line. Then in the next line,\n\nprint “YES” if the tree is complete, or “NO” if not.","samples":[{"input":"5\n88 70 61 63 65","output":"70 63 88 61 65\nYES","explanation":"","label":"1"},{"input":"8\n88 70 61 96 120 90 65 68","output":"88 65 96 61 70 90 120 68\nNO","explanation":"","label":"2"}],"sampleInput":"5\n88 70 61 63 65","sampleOutput":"70 63 88 61 65\nYES","idea":["这道题实际上考察AVL树和层序遍历两个知识点~~判断是不是完全二叉树,就看在出现了一个孩子为空的结点之后是否还会出现孩子结点不为空的结点,如果出现了就不是完全二叉树。","AVL树一共有四种情况,这里我把发现树不平衡的那个结点叫做A结点,A发现树不平衡的情况有四种:新来的结点插入到A的左子树的左子树新来的结点插入到A的左子树的右子树新来的结点插入到A的右子树的左子树新来的结点插入到A的右子树的右子树发现不平衡时就需要处理,第1种情况只要简单的右旋,第4种情况只需左旋一下,第2种情况需要先对A的左子树左旋一下,然后对A右旋,同理第3种情况需要对A的右子树右旋一下,然后对A左旋就可以啦~","~~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cqueue>\n\n// 解题关键：这道题实际上考察AVL树和层序遍历两个知识点\nusing namespace std;\nstruct node {\n   int val;\n   struct node *left, *right;\n};\nnode* leftRotate(node *tree) {\n\n   node *temp = tree->right;\n   tree->right = temp->left;\n   temp->left = tree;\n   return temp;\n}\nnode* rightRotate(node *tree) {\n   node *temp = tree->left;\n   tree->left = temp->right;\n   temp->right = tree;\n\n   return temp;\n}\nnode* leftRightRotate(node *tree) {\n   tree->left = leftRotate(tree->left);\n\n   return rightRotate(tree);\n}\nnode* rightLeftRotate(node *tree) {\n   tree->right = rightRotate(tree->right);\n   return leftRotate(tree);\n\n}\nint getHeight(node *tree) {\n   if (tree == NULL) return 0;\n   int l = getHeight(tree->left);\n   int r = getHeight(tree->right);\n   return max(l, r) + 1;\n}\nnode* insert(node *tree, int val) {\n   if (tree == NULL) {\n      tree = new node();\n\n      tree->val = val;\n   }else if (tree->val > val) {\n      tree->left = insert(tree->left, val);\n      int l = getHeight(tree->left), r = getHeight(tree->right);\n      if (l - r >= 2) {\n         if (val \u003c tree->left->val)\n             tree = rightRotate(tree);\n         else\n             tree = leftRightRotate(tree);\n\n      }\n   } else {\n      tree->right = insert(tree->right, val);\n      int l = getHeight(tree->left), r = getHeight(tree->right);\n      if (r - l >= 2) {\n         if (val > tree->right->val)\n             tree = leftRotate(tree);\n         else\n             tree = rightLeftRotate(tree);\n      }\n\n   }\n   return tree;\n}\nint isComplete = 1, after = 0;\nvector\u003cint> levelOrder(node *tree) {\n   vector\u003cint> v;\n   queue\u003cnode *> queue;\n   queue.push(tree);\n   while (!queue.empty()) {\n\n      node *temp = queue.front();\n      queue.pop();\n      v.push_back(temp->val);\n      if (temp->left != NULL) {\n         if (after) isComplete = 0;\n         queue.push(temp->left);\n\n      } else {\n         after = 1;\n      }\n      if (temp->right != NULL) {\n         if (after) isComplete = 0;\n\n         queue.push(temp->right);\n      } else {\n         after = 1;\n      }\n   }\n   return v;\n}\nint main() {\n   int n, temp;\n   scanf(\"%d\", &n);\n\n   node *tree = NULL;\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &temp);\n      tree = insert(tree, temp);\n   }\n   vector\u003cint> v = levelOrder(tree);\n   for (int i = 0; i \u003c v.size(); i++) {\n      if (i != 0) printf(\" \");\n      printf(\"%d\", v[i]);\n\n   }\n   printf(\"\\n%s\", isComplete ? \"YES\" : \"NO\");\n   return 0;\n}"},{"id":"1124","title":"Raffle for Weibo Followers","score":20,"category":"map映射","description":["John got a full mark on PAT. He was so happy that he decided to hold a raffle(抽奖) for his followers on Weibo — that is, he would select winners from every N followers who forwarded his post, and give away gifts. Now you are supposed to help him generate the list of winners."],"input":"Each input file contains one test case. For each case, the first line gives three positive integers M (\u003c=1000), N and S, being the total number of forwards, the skip number of winners, and the index of the first winner (the indices start from 1). Then M lines follow, each gives the nickname (a nonempty\n\nstring of no more than 20 characters, with no white space or return) of a follower who has forwarded John’s post.Note: it is possible that someone would forward more than once, but no one can win more than once.Hence if the current candidate of a winner has won before, we must skip him/her and consider the\n\nnext one.","output":"For each case, print the list of winners in the same order as in the input, each nickname occupies a line. If there is no winner yet, print “Keep going...” instead.","samples":[{"input":"9 3 2\nImgonnawin!\nPickMe\nPickMeMeMeee\nLookHere\nImgonnawin!\nTryAgainAgain\nTryAgainAgain\nImgonnawin!\nTryAgainAgain","output":"PickMe\nImgonnawin!\nTryAgainAgain","explanation":"","label":"1"},{"input":"2 3 5\nImgonnawin!\nPickMe","output":"Keep going...","explanation":"","label":"2"}],"sampleInput":"9 3 2\nImgonnawin!\nPickMe\nPickMeMeMeee\nLookHere\nImgonnawin!\nTryAgainAgain\nTryAgainAgain\nImgonnawin!\nTryAgainAgain","sampleOutput":"PickMe\nImgonnawin!\nTryAgainAgain","idea":["小明PAT考了满分,高兴之余决定发起微博转发抽奖活动,从转发的网友中按顺序每隔N个人就发出一个红包。请你编写程序帮助他确定中奖名单。注意:可能有人转发多次,但不能中奖多次。所以如果处于当前中奖位置的网友已经中过奖,则跳过他顺次取下一位。按照输入的顺序输出中奖名单,每个昵称占一行。如果没有人中奖,则输出“Keep going...”分析:用mapp存储当前用户有没有已经中奖过~","当输入的时候,判断当前字符串是否已经在mapp中出现过,如果出现过就将s+1。每次判断i是否等于s,如果等于s且当前用户没有中过奖,就将它的名字输出,并且s = s + n~并将mapp[str]标记为1,且flag标记为true表示有过人中奖。最后flag如果依然是false说明要输出Keep going..."],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：小明PAT考了满分,高兴之余决定发起微博转发抽奖活动,从转发的网友中按顺序每隔N个人就发出一个红包\n\n#include \u003cmap>\nusing namespace std;\nint main() {\n   int m, n, s;\n   scanf(\"%d%d%d\", &m, &n, &s);\n   string str;\n   map\u003cstring, int> mapp;\n   bool flag = false;\n   for (int i = 1; i \u003c= m; i++) {\n\n      cin >> str;\n      if (mapp[str] == 1) s = s + 1;\n      if (i == s && mapp[str] == 0) {\n         mapp[str] = 1;\n         cout \u003c\u003c str \u003c\u003c endl;\n         flag = true;\n         s = s + n;\n      }\n   }\n   if (flag == false) cout \u003c\u003c \"Keep going...\";\n\n   return 0;\n}"},{"id":"1125","title":"Chain the Ropes","score":25,"category":"排序,贪心","description":["Given some segments of rope, you are supposed to chain them into one rope. Each time you may only fold two segments into loops and chain them into one piece, as shown by the figure. The resulting chain will be treated as another segment of rope and can be folded again. After each chaining, the","lengths of the original two segments will be halved.Your job is to make the longest possible rope out of N given segments."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (2 \u003c= N \u003c=104). Then N positive integer lengths of the segments are given in the next line, separated by spaces.All the integers are no more than 104.","output":"For each case, print in a line the length of the longest possible rope that can be made by the given segments. The result must be rounded to the nearest integer that is no greater than the maximum length.","samples":[{"input":"8\n10 15 12 3 4 13 1 15","output":"14","explanation":"","label":""}],"sampleInput":"8\n10 15 12 3 4 13 1 15","sampleOutput":"14","idea":["给定一段一段的绳子,你需要把它们串成一条绳。每次串连的时候,是把两段绳子对折,再如下图所示套接在一起。这样得到的绳子又被当成是另一段绳子,可以再次对折去跟另一段绳子串连。每次串连后,原来两段绳子的长度就会减半。给定N段绳子的长度,你需要找出它们能串成的绳子的最大长度~","因为所有长度都要串在一起,每次都等于(旧的绳子长度+新的绳子长度)/2,所以越是早加入绳子长度中的段,越要对折的次数多,所以既然希望绳子长度是最长的,就必须让长的段对折次数尽可能的短。所以将所有段从小到大排序,然后从头到尾从小到大分别将每一段依次加入结绳的绳子中,最后得到的结果才会是最长的结果~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003cvector>\n\n// 解题关键：给定一段一段的绳子,你需要把它们串成一条绳\n\nusing namespace std;\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   vector\u003cint> v(n);\n   for (int i = 0; i \u003c n; i++)\n      scanf(\"%d\", &v[i]);\n   sort(v.begin(), v.end());\n   int result = v[0];\n   for (int i = 1; i \u003c n; i++)\n\n      result = (result + v[i]) / 2;\n   printf(\"%d\", result);\n   return 0;\n}"},{"id":"1126","title":"Eulerian Path","score":25,"category":"连通图","description":["In graph theory, an Eulerian path is a path in a graph which visits every edge exactly once. Similarly,an Eulerian circuit is an Eulerian path which starts and ends on the same vertex. They were first discussed by Leonhard Euler while solving the famous Seven Bridges of Konigsberg problem in 1736.","It has been proven that connected graphs with all vertices of even degree have an Eulerian circuit,and such graphs are called Eulerian. If there are exactly two vertices of odd degree, all Eulerian paths start at one of them and end at the other. A graph that has an Eulerian path but not an Eulerian circuit","is called semi-Eulerian. (Cited from https://en.wikipedia.org/wiki/Eulerian_path)Given an undirected graph, you are supposed to tell if it is Eulerian, semi-Eulerian, or non-Eulerian."],"input":"Each input file contains one test case. Each case starts with a line containing 2 numbers N (\u003c= 500),and M, which are the total number of vertices, and the number of edges, respectively. Then M lines follow, each describes an edge by giving the two ends of the edge (the vertices are numbered from 1\n\nto N).","output":"For each test case, first print in a line the degrees of the vertices in ascending order of their indices.Then in the next line print your conclusion about the graph — either “Eulerian”, “Semi-Eulerian”, or“Non-Eulerian”. Note that all the numbers in the first line must be separated by exactly 1 space, and\n\nthere must be no extra space at the beginning or the end of the line.","samples":[{"input":"7 12\n5 7\n1 2\n1 3\n2 3\n2 4\n3 4\n5 2\n7 6\n6 3\n4 5\n6 4\n5 6","output":"2 4 4 4 4 4 2\nEulerian","explanation":"","label":"1"},{"input":"6 10\n1 2\n1 3\n2 3\n2 4\n3 4\n5 2\n6 3\n4 5\n6 4\n5 6","output":"2 4 4 4 3 3\nSemi-Eulerian","explanation":"","label":"2"},{"input":"5 8\n1 2\n2 5\n5 4\n4 1\n1 3\n3 2\n3 4\n5 3","output":"3 3 4 3 3\nNon-Eulerian","explanation":"","label":"3"}],"sampleInput":"7 12\n5 7\n1 2\n1 3\n2 3\n2 4\n3 4\n5 2\n7 6\n6 3\n4 5\n6 4\n5 6","sampleOutput":"2 4 4 4 4 4 2\nEulerian","idea":["如果一个连通图的所有结点的度都是偶数,那么它就是Eulerian,如果除了两个结点的度是奇数其他都是偶数,那么它就是Semi-Eulerian,否则就是Non-Eulerian~用邻接表存储图,判断每个结点的度【也就是每个结点i的v[i].size()】是多少即可得到最终结果~","注意:图必须是连通图,所以要用一个深搜判断一下连通性,从结点1开始深搜,如果最后发现统计的连通结点个数cnt!= n说明是不是连通图,要输出Non-Eulerian~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：如果一个连通图的所有结点的度都是偶数,那么它就是Eulerian,如果除了两个结点的度是奇数其他都是偶数,那么它就是Semi-Eulerian,否则就是Non-Eulerian\nusing namespace std;\nvector\u003cvector\u003cint> > v;\nvector\u003cbool> visited;\nint cnt = 0;\nvoid dfs(int index) {\n   visited[index] = true;\n\n   cnt++;\n   for (int i = 0; i \u003c v[index].size(); i++)\n      if (visited[v[index][i]] == false)\n         dfs(v[index][i]);\n}\nint main() {\n   int n, m, a, b, even = 0;\n   scanf(\"%d%d\", &n, &m);\n   v.resize(n + 1);\n\n   visited.resize(n + 1);\n   for (int i = 0; i \u003c m; i++) {\n      scanf(\"%d%d\", &a, &b);\n      v[a].push_back(b);\n      v[b].push_back(a);\n   }\n   for (int i = 1; i \u003c= n; i++) {\n      if (i != 1) printf(\" \");\n      printf(\"%d\", v[i].size());\n      if (v[i].size() % 2 == 0) even++;\n\n   }\n   printf(\"\\n\");\n   dfs(1);\n   if (even == n && cnt == n)\n      printf(\"Eulerian\");\n   else if(even == n - 2 && cnt == n)\n      printf(\"Semi-Eulerian\");\n   else\n      printf(\"Non-Eulerian\");\n\n   return 0;\n}"},{"id":"1127","title":"ZigZagging on a Tree","score":30,"category":"中序后序建树,层序遍历","description":["Suppose that all the keys in a binary tree are distinct positive integers. A unique binary tree can be determined by a given pair of postorder and inorder traversal sequences. And it is a simple standard routine to print the numbers in level-order. However, if you think the problem is too simple, then you","are too naive. This time you are supposed to print the numbers in “zigzagging order” — that is,starting from the root, print the numbers level-by-level, alternating between left to right and right to left. For example, for the following tree you must output: 1 11 5 8 17 12 20 15."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (\u003c= 30),the total number of nodes in the binary tree. The second line gives the inorder sequence and the third line gives the postorder sequence. All the numbers in a line are separated by a space.","output":"For each test case, print the zigzagging sequence of the tree in a line. All the numbers in a line must be separated by exactly one space, and there must be no extra space at the end of the line.","samples":[{"input":"8\n12 11 20 17 1 15 8 5\n12 20 17 11 15 8 5 1","output":"1 11 5 8 17 12 20 15","explanation":"","label":""}],"sampleInput":"8\n12 11 20 17 1 15 8 5\n12 20 17 11 15 8 5 1","sampleOutput":"1 11 5 8 17 12 20 15","idea":["给出一个树的中序和后序遍历结果,求它的Z字型层序遍历,也就是偶数层从右往左,奇数层从左往右遍历~分为3步:1.根据中序和后序建树 保存在tree二维数组中,比如:tree[i][0] = val表示post[i]的左孩子是post[val],tree[i][1] = val表示post[i]的右孩子是post[val]~","2.进行广度优先搜索,将树从根结点开始所有结点层序遍历,保存在result二维数组中,比如:result[i]保存第i层所有结点的序列~3.进行z字型输出,根据当前层号的奇偶性分别从左往右、从右往左遍历输出~1. dfs:因为post(后序)是按照左、右、根的顺序遍历的,所以从右往左,最右边的肯定是根结点~","所以postRight是当前子树的根结点的下标,将它的赋值给index,并继续dfs tree[index][0]和tree[index][1]~根据post[postRight]的结点在in里面的下标位置i,可以得到i的左边是左子树,即inLeft 到 i – 1,右边是右子树:i + 1 到 inRight。","而对于post来说,根据左子树的结点个数i – inLeft可以得到[postLeft,postLeft + (i – inLeft) – 1]是post中左子树的范围,[postLeft + (i – inLeft), postRight – 1]是post中右子树的范围~","2.广度优先搜索,采用队列q,q中保存的是node结点,node.index表示当前节点在post中的下标,node.depth表示当前结点在树中的层数~3.当 i % 2 == 0的时候倒序输出,否则正序输出~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给出一个树的中序和后序遍历结果,求它的Z字型层序遍历,也就是偶数层从右往左,奇数层从左往右遍历\n\n#include \u003cvector>\n#include \u003cqueue>\nusing namespace std;\nvector\u003cint> in, post, result[35];\nint n, tree[35][2], root;\nstruct node {\n   int index, depth;\n};\nvoid dfs(int &index, int inLeft, int inRight, int postLeft, int postRight) {\n   if (inLeft > inRight) return;\n\n   index = postRight;\n   int i = 0;\n   while (in[i] != post[postRight]) i++;\n   dfs(tree[index][0], inLeft, i - 1, postLeft, postLeft + (i - inLeft) - 1);\n   dfs(tree[index][1], i + 1, inRight, postLeft + (i - inLeft), postRight - 1);\n}\nvoid bfs() {\n   queue\u003cnode> q;\n\n   q.push(node{root, 0});\n   while (!q.empty()) {\n      node temp = q.front();\n      q.pop();\n      result[temp.depth].push_back(post[temp.index]);\n      if (tree[temp.index][0] != 0)\n         q.push(node{tree[temp.index][0], temp.depth + 1});\n      if (tree[temp.index][1] != 0)\n         q.push(node{tree[temp.index][1], temp.depth + 1});\n\n   }\n\n}\nint main() {\n   cin >> n;\n   in.resize(n + 1), post.resize(n + 1);\n   for (int i = 1; i \u003c= n; i++) cin >> in[i];\n\n   for (int i = 1; i \u003c= n; i++) cin >> post[i];\n   dfs(root, 1, n, 1, n);\n   bfs();\n   printf(\"%d\", result[0][0]);\n   for (int i = 1; i \u003c 35; i++) {\n      if (i % 2 == 1) {\n         for (int j = 0; j \u003c result[i].size(); j++)\n             printf(\" %d\", result[i][j]);\n      } else {\n         for (int j = result[i].size() - 1; j >= 0; j--)\n\n             printf(\" %d\", result[i][j]);\n      }\n   }\n   return 0;\n}"},{"id":"1128","title":"N Queens Puzzle","score":20,"category":"逻辑题","description":["The “eight queens puzzle” is the problem of placing eight chess queens on an 8×8 chessboard so that no two queens threaten each other. Thus, a solution requires that no two queens share the same row,column, or diagonal. The eight queens puzzle is an example of the more general N queens problem of","placing N non-attacking queens on an N×N chessboard. (From Wikipedia – “Eight queens puzzle”.)Here you are NOT asked to solve the puzzles. Instead, you are supposed to judge whether or not a given configuration of the chessboard is a solution. To simplify the representation of a chessboard, let","us assume that no two queens will be placed in the same column. Then a configuration can be represented by a simple integer sequence (Q1, Q2,..., QN), where Qi is the row number of the queen in the i-th column. For example, Figure 1 can be represented by (4, 6, 8, 2, 7, 1, 3, 5) and it is indeed a","solution to the 8 queens puzzle; while Figure 2 can be represented by (4, 6, 7, 2, 8, 1, 9, 5, 3) and is NOT a 9 queens’ solution."],"input":"Each input file contains several test cases. The first line gives an integer K (1 \u003c K \u003c= 200). Then K lines follow, each gives a configuration in the format “N Q1 Q2... QN”, where 4 \u003c= N \u003c= 1000 and it is guaranteed that 1 \u003c= Qi \u003c= N for all i=1,..., N. The numbers are separated by spaces.","output":"For each configuration, if it is a solution to the N queens problem, print “YES” in a line; or “NO” if not.","samples":[{"input":"4\n8 4 6 8 2 7 1 3 5\n9 4 6 7 2 8 1 9 5 3\n6 1 5 2 6 4 3\n5 1 3 5 2 4","output":"YES\nNO\nNO\nYES","explanation":"","label":""}],"sampleInput":"4\n8 4 6 8 2 7 1 3 5\n9 4 6 7 2 8 1 9 5 3\n6 1 5 2 6 4 3\n5 1 3 5 2 4","sampleOutput":"YES\nNO\nNO\nYES","idea":["给出一个皇后图,以这样的方式给出:一个数组包含n个数字,每个数字表示该列的皇后所在的行数~判断给出的皇后图是否满足不会互相攻击(任意两个皇后都要不在同一行或者同一列,且不在斜对角线上~)分析:用v[n]存储一张图给出的数字~对于第j个数字,判断前0~","j-1个数字中是否有在同一行的(v[j]== v[t])和在斜对角线上的(abs(v[j]-v[t]) == abs(j-t))【因为已经告诉肯定不在同一列了,所以不需要判断是否在同一列啦~】如果发现了不满足的情况,就将result由true标记为false~最后根据result是 true还是false输出对应的YES还是NO即可~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003ccmath>\n\n// 解题关键：给出一个皇后图,以这样的方式给出:一个数组包含n个数字,每个数字表示该列的皇后所在的行数\n\nusing namespace std;\nint main() {\n   int k, n;\n   cin >> k;\n   for (int i = 0; i \u003c k; i++) {\n      cin >> n;\n      vector\u003cint> v(n);\n      bool result = true;\n      for (int j = 0; j \u003c n; j++) {\n         cin >> v[j];\n\n         for (int t = 0; t \u003c j; t++) {\n             if (v[j] == v[t] || abs(v[j]-v[t]) == abs(j-t)) {\n                result = false;\n                break;\n             }\n         }\n      }\n      cout \u003c\u003c (result == true ? \"YES\\n\" : \"NO\\n\");\n   }\n\n   return 0;\n}"},{"id":"1129","title":"Recommendation System","score":25,"category":"set的应用,运算符重载","description":["Recommendation system predicts the preference that a user would give to an item. Now you are asked to program a very simple recommendation system that rates the user’s preference by the number of times that an item has been accessed by this user."],"input":"Each input file contains one test case. For each test case, the first line contains two positive integers: N(\u003c= 50000), the total number of queries, and K (\u003c= 10), the maximum number of recommendations the system must show to the user. Then given in the second line are the indices of items that the user is\n\naccessing — for the sake of simplicity, all the items are indexed from 1 to N. All the numbers in a line are separated by a space.","output":"For each case, process the queries one by one. Output the recommendations for each query in a line in the format:query: rec[1] rec[2]... rec[K]where query is the item that the user is accessing, and rec[i] (i = 1,... K) is the i-th item that the system recommends to the user. The first K items that have been accessed most frequently are\n\nsupposed to be recommended in non-increasing order of their frequencies. If there is a tie, the items will be ordered by their indices in increasing order.Note: there is no output for the first item since it is impossible to give any recommendation at the time. It is guaranteed to have the output for at least one query.","samples":[{"input":"12 3\n3 5 7 5 5 3 2 1 8 3 8 12","output":"5: 3\n7: 3 5\n5: 3 5 7\n5: 5 3 7\n3: 5 3 7\n2: 5 3 7\n1: 5 3 2\n8: 5 3 1\n3: 5 3 1\n8: 3 5 1\n12: 3 5 8","explanation":"","label":""}],"sampleInput":"12 3\n3 5 7 5 5 3 2 1 8 3 8 12","sampleOutput":"5: 3\n7: 3 5\n5: 3 5 7\n5: 5 3 7\n3: 5 3 7\n2: 5 3 7\n1: 5 3 2\n8: 5 3 1\n3: 5 3 1\n8: 3 5 1\n12: 3 5 8","idea":["根据用户每次点击的东西的编号,输出他在点当前编号之前应该给这个用户推荐的商品的编号~只推荐k个~也就是输出用户曾经点击过的商品编号的最多的前k个~如果恰好两个商品有相同的点击次数,就输出编号较小的那个~【并不复杂~只是写的比较详细~不怕不怕~","(摸头...】因为每个商品有两个属性:编号value和出现的次数cnt,编号具有唯一性,然后set又会根据大小自动排序,所以我们可以考虑将value和cnt组成一个node属性,把所有商品编号和它对应的次数变成node放入set里面,重载小于号,使\u003c根据set中node的cnt排序,如果cnt相等就按照node的value排序~","这样set里面就是按照出现次数排序好的商品node,每次输出set的前k个node的value值就可以~(要记住,因为是点击前推荐,所以我们在接收完num的值后,应该先输出再插入让set帮忙排序当前num,当前的这个点击编号暂时先不算在输出结果里面的~)首先在struct node里面重载\u003c号,如果当前cnt不等于a.cnt就将cnt大的排在前,否则将value小的排在前面~","每次输入的时候,先不插入,先输出,当i!= 0时候开始输出,因为i==0时候用户才第一次点击,没有可以推荐的~(沮丧脸...) 输出的同时记录输出过的个数tempCnt,当tempCnt \u003c k的时候输出,因为只要前k个~所以就从头到尾依次输出set中的值就可以啦~","book[num]标记num出现的次数,每次寻找set中当前值为num和次数为book[num]的那个值,如果找到了就把他移除,(找到说明这个数已经出现过啦,cnt已经不对啦,先移除掉吧~)然后将book[num]+1,在将node(num, book[num])插入到set中,set会帮忙根据我们自定义的\u003c的规则自动排序哒~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cset>\n\n// 解题关键：根据用户每次点击的东西的编号,输出他在点当前编号之前应该给这个用户推荐的商品的编号\nusing namespace std;\nint book[50001];\nstruct node {\n   int value, cnt;\n   bool operator \u003c (const node &a) const {\n      return (cnt != a.cnt) ? cnt > a.cnt : value \u003c a.value;\n   }\n\n};\nint main() {\n   int n, k, num;\n   scanf(\"%d%d\", &n, &k);\n   set\u003cnode> s;\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &num);\n      if (i != 0) {\n         printf(\"%d:\", num);\n\n         int tempCnt = 0;\n         for(auto it = s.begin(); tempCnt \u003c k && it != s.end(); it++) {\n             printf(\" %d\", it->value);\n             tempCnt++;\n         }\n         printf(\"\\n\");\n      }\n      auto it = s.find(node{num, book[num]});\n      if (it != s.end()) s.erase(it);\n      book[num]++;\n\n      s.insert(node{num, book[num]});\n   }\n   return 0;\n}"},{"id":"1130","title":"Infix Expression","score":25,"category":"dfs深度优先搜索","description":["Given a syntax tree (binary), you are supposed to output the corresponding infix expression, with parentheses reflecting the precedences of the operators."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (\u003c= 20)which is the total number of nodes in the syntax tree. Then N lines follow, each gives the information of a node (the i-th line corresponds to the i-th node) in the format:\n\ndata left_child right_child where data is a string of no more than 10 characters, left_child and right_child are the indices of this node’s left and right children, respectively. The nodes are indexed from 1 to N. The NULL link is represented by -1. The figures 1 and 2 correspond to the samples 1 and 2, respectively.","output":"For each case, print in a line the infix expression, with parentheses reflecting the precedences of the operators. Note that there must be no extra parentheses for the final expression, as is shown by the samples. There must be no space between any symbols.","samples":[{"input":"8\n* 8 7\na -1 -1\n* 4 1\n+ 2 5\nb -1 -1\nd -1 -1\n– -1 6\nc -1 -1","output":"(a+b)*(c*(-d))","explanation":"","label":"1"},{"input":"8\n2.35 -1 -1\n* 6 1\n– -1 4\n% 7 8\n+ 2 3\na -1 -1\nstr -1 -1\n871 -1 -1","output":"(a*2.35)+(-(str%871))","explanation":"","label":"2"}],"sampleInput":"8\n* 8 7\na -1 -1\n* 4 1\n+ 2 5\nb -1 -1\nd -1 -1\n– -1 6\nc -1 -1","sampleOutput":"(a+b)*(c*(-d))","idea":["给一个二叉树,输出中缀表达式,且加上括号表示运算的优先级~首先根据所有孩子结点编号寻找1~n中没有出现过的编号标记为root,即树的根结点~然后进行从root结点开始dfs~","dfs递归拼接 “(” + 左子树 + 根 + 右子树 + “)”递归有四种情况(有效的只有三种):1. 左右子树都空 返回 “(” + 根 + “)”2. 左空右不空 返回 “(” + 根 + 右子树 + “)”3. 左不空右空 这种情况不存在4. 左右都不空 返回 “(” + 左子树 + 根 + 右子树 + “)”最后递归返回的ans,最外层可能会被括号包起来,也可能不被包起来。","要判断一下,如果被包起来, 把最外层括号去掉即可~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给一个二叉树,输出中缀表达式,且加上括号表示运算的优先级\nusing namespace std;\nstruct node {\n   string data;\n   int l, r;\n}a[100];\nstring dfs(int root) {\n\n   if(a[root].l == -1 && a[root].r == -1) return a[root].data;\n\n   if(a[root].l == -1 && a[root].r != -1) return \"(\" + a[root].data + dfs(a[root].r) + \")\";\n   if(a[root].l != -1 && a[root].r != -1) return \"(\" + dfs(a[root].l) + a[root].data + dfs(a[root].r) + \")\";\n}\n\nint main() {\n   int have[100] = {0}, n, root = 1;\n   cin >> n;\n   for(int i = 1; i \u003c= n; i++) {\n      cin >> a[i].data >> a[i].l >> a[i].r;\n      if(a[i].l != -1) have[a[i].l] = 1;\n      if(a[i].r != -1) have[a[i].r] = 1;\n   }\n   while(have[root] == 1) root++;\n   string ans = dfs(root);\n\n   if(ans[0] == '(') ans = ans.substr(1,ans.size()-2);\n   cout \u003c\u003c ans;\n   return 0;\n}"},{"id":"1131","title":"Subway Map","score":30,"category":"dfs深度优先搜索","description":["In the big cities, the subway systems always look so complex to the visitors. To give you some sense,the following figure shows the map of Beijing subway. Now you are supposed to help people with your computer skills! Given the starting position of your user, your task is to find the quickest way to","his/her destination."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N (\u003c=100), the number of subway lines. Then N lines follow, with the i-th (i = 1,..., N) line describes the i-th subway line in the format:M S[1] S[2]... S[M]where M (\u003c= 100) is the number of stops, and S[i]’s (i = 1,... M) are the indices of the stations (the\n\nindices are 4-digit numbers from 0000 to 9999) along the line. It is guaranteed that the stations are given in the correct order — that is, the train travels between S[i] and S[i+1] (i = 1,..., M-1) without any stop.Note: It is possible to have loops, but not self-loop (no train starts from S and stops at S without\n\npassing through another station). Each station interval belongs to a unique subway line. Although the lines may cross each other at some stations (so called “transfer stations”), no station can be the conjunction of more than 5 lines.After the description of the subway, another positive integer K (\u003c= 10) is given. Then K lines follow,\n\neach gives a query from your user: the two indices as the starting station and the destination,respectively.The following figure shows the sample map.Note: It is guaranteed that all the stations are reachable, and all the queries consist of legal station numbers.","output":"For each query, first print in a line the minimum number of stops. Then you are supposed to show the optimal path in a friendly format as the following:Take Line#X1 from S1 to S2.Take Line#X2 from S2 to S3.......where Xi’s are the line numbers and Si’s are the station indices. Note: Besides the starting and ending\n\nstations, only the transfer stations shall be printed.If the quickest path is not unique, output the one with the minimum number of transfers, which is guaranteed to be unique.","samples":[{"input":"4\n7 1001 3212 1003 1204 1005 1306 7797\n9 9988 2333 1204 2006 2005 2004 2003 2302 2001\n13 3011 3812 3013 3001 1306 3003 2333 3066 3212 3008 2302 3010 3011\n4 6666 8432 4011 1306\n3\n3011 3013\n6666 2001\n2004 3001","output":"2\nTake Line#3 from 3011 to 3013.\n10\nTake Line#4 from 6666 to 1306.\nTake Line#3 from 1306 to 2302.\nTake Line#2 from 2302 to 2001.\n6\nTake Line#2 from 2004 to 1204.\nTake Line#1 from 1204 to 1306.\nTake Line#3 from 1306 to 3001.","explanation":"","label":""}],"sampleInput":"4\n7 1001 3212 1003 1204 1005 1306 7797\n9 9988 2333 1204 2006 2005 2004 2003 2302 2001\n13 3011 3812 3013 3001 1306 3003 2333 3066 3212 3008 2302 3010 3011\n4 6666 8432 4011 1306\n3\n3011 3013\n6666 2001\n2004 3001","sampleOutput":"2\nTake Line#3 from 3011 to 3013.\n10\nTake Line#4 from 6666 to 1306.\nTake Line#3 from 1306 to 2302.\nTake Line#2 from 2302 to 2001.\n6\nTake Line#2 from 2004 to 1204.\nTake Line#1 from 1204 to 1306.\nTake Line#3 from 1306 to 3001.","idea":["找出一条路线,使得对任何给定的起点和终点,可以找出中途经停站最少的路线;如果经停站一样多,则取需要换乘线路次数最少的路线~【很简单的,别跑^_^】分析:一遍DFS即可~DFS过程中要维护两个变量:minCnt-中途经停的最少的站; minTransfer-需要换乘的最小次数~","0.可以这样计算出一条线路的换乘次数:在line[10000][10000]的数组中保存每两个相邻站中间的线路是几号线~从头到尾遍历最终保存的路径,preLine为前一小段的线路编号,如果当前的结点和前一个结点组成的这条路的线路编号和preLine不同,说明有一个换乘,就将cnt+1,最后遍历完累加的cnt即是换乘的次数~","update:由于新的PAT系统中会显示原解法有一个测试用例内存超限,考虑到line[10000][10000]存储的方式太暴力了,所以将line换成了unordered_map\u003cint, int> line存储的方式,第一个int用来存储线路,每次将前四位存储第一个线路,后四位存储第二个线路,使用a[i-1]*10000+a[i]的方式存储,第二个int用来保存两个相邻中间的线路是几号线~","1.可以这样计算出一条线路中途停站的次数:在dfs的时候有个变量cnt,表示当前路线是所需乘的第几个站,每次dfs时候将cnt+1表示向下遍历一层~cnt就是当前中途停站的次数~2.可以这样输出结果:和计算线路换乘次数的思路一样,每当preLine和当前Line值不同的时候就输出一句话~","保存preTransfer表示上一个换乘站,最后不要忘记输出preTransfer和最后一个站之间的路即使最后一个站并不是换乘站~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：找出一条路线,使得对任何给定的起点和终点,可以找出中途经停站最少的路线;如果经停站一样多,则取需要换乘线路次数最少的路线\n\n#include \u003cunordered_map>\nusing namespace std;\nvector\u003cvector\u003cint>> v(10000);\nint visited[10000], minCnt, minTransfer, start, end1;\nunordered_map\u003cint, int> line;\n\nvector\u003cint> path, tempPath;\nint transferCnt(vector\u003cint> a) {\n   int cnt = -1, preLine = 0;\n   for (int i = 1; i \u003c a.size(); i++) {\n      if (line[a[i-1]*10000+a[i]] != preLine) cnt++;\n      preLine = line[a[i-1]*10000+a[i]];\n   }\n   return cnt;\n}\nvoid dfs(int node, int cnt) {\n\n   if (node == end1 && (cnt \u003c minCnt || (cnt == minCnt && transferCnt(tempPath) \u003c minTransfer))) {\n      minCnt = cnt;\n      minTransfer = transferCnt(tempPath);\n      path = tempPath;\n   }\n   if (node == end1) return;\n   for (int i = 0; i \u003c v[node].size(); i++) {\n      if (visited[v[node][i]] == 0) {\n\n         visited[v[node][i]] = 1;\n         tempPath.push_back(v[node][i]);\n         dfs(v[node][i], cnt + 1);\n         visited[v[node][i]] = 0;\n         tempPath.pop_back();\n      }\n   }\n}\nint main() {\n   int n, m, k, pre, temp;\n\n   scanf(\"%d\", &n);\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d%d\", &m, &pre);\n      for (int j = 1; j \u003c m; j++) {\n         scanf(\"%d\", &temp);\n         v[pre].push_back(temp);\n         v[temp].push_back(pre);\n         line[pre*10000+temp] = line[temp*10000+pre] = i + 1;\n         pre = temp;\n\n      }\n   }\n   scanf(\"%d\", &k);\n   for (int i = 0; i \u003c k; i++) {\n      scanf(\"%d%d\", &start, &end1);\n      minCnt = 99999, minTransfer = 99999;\n\n      tempPath.clear();\n      tempPath.push_back(start);\n      visited[start] = 1;\n      dfs(start, 0);\n      visited[start] = 0;\n\n      printf(\"%d\\n\", minCnt);\n      int preLine = 0, preTransfer = start;\n      for (int j = 1; j \u003c path.size(); j++) {\n         if (line[path[j-1]*10000+path[j]] != preLine) {\n             if (preLine != 0) printf(\"Take Line#%d from %04d to %04d.\\n\", preLine, preTransfer, path[j-1]);\n             preLine = line[path[j-1]*10000+path[j]];\n             preTransfer = path[j-1];\n         }\n      }\n\n      printf(\"Take Line#%d from %04d to %04d.\\n\", preLine, preTransfer, end1);\n   }\n   return 0;\n}"},{"id":"1132","title":"Cut Integer","score":20,"category":"数学问题","description":["Cutting an integer means to cut a K digits long integer Z into two integers of (K/2) digits long integers A and B. For example, after cutting Z = 167334, we have A = 167 and B = 334. It is interesting to see that Z can be devided by the product of A and B, as 167334 / (167 x 334) = 3. Given an integer","Z, you are supposed to test if it is such an integer."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (\u003c= 20).Then N lines follow, each gives an integer Z (10\u003c=Z\u003c=231). It is guaranteed that the number of digits of Z is an even number.","output":"For each case, print a single line “Yes” if it is such a number, or “No” if not.","samples":[{"input":"3\n167334\n2333\n12345678","output":"Yes\nNo\nNo","explanation":"","label":""}],"sampleInput":"3\n167334\n2333\n12345678","sampleOutput":"Yes\nNo\nNo","idea":["给一个偶数个位的正整数num,把它从中间分成左右两个整数a、b,问num能不能被a和b的乘积整除,能的话输出yes,不能的话输出no分析:要注意a*b如果为0的时候不能取余,否则会浮点错误~","直接用int保存num的值,计算出num的长度len,则令d = pow(10, len / 2)时,num取余d能得到后半部分的整数,num除以d能得到前半部分的整数,计算num % (a*b)是否等于0就可以得知是否可以被整除~"],"keyPoints":["先推导等价公式再编码，避免直接按定义做不必要的重复计算。","乘法、累加或组合计数可能超出 int，应按范围选择 long long。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给一个偶数个位的正整数num,把它从中间分成左右两个整数a、b,问num能不能被a和b的乘积整除,能的话输出yes,不能的话输出no分析:要注意a*b如果为0的时候不能取余,否则会浮点错误\nusing namespace std;\nint main() {\n   int n, num;\n   scanf(\"%d\", &n);\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &num);\n\n      string s = to_string(num);\n      int len = s.length();\n      int a = stoi(s.substr(0, len/2));\n      int b = stoi(s.substr(len/2));\n      if (a * b != 0 && num % (a * b) == 0)\n         printf(\"Yes\\n\");\n      else\n         printf(\"No\\n\");\n   }\n   return 0;\n\n}"},{"id":"1133","title":"Splitting A Linked List","score":25,"category":"链表","description":["Given a singly linked list, you are supposed to rearrange its elements so that all the negative values appear before all of the non-negatives, and all the values in [0, K] appear before all those greater than K. The order of the elements inside each class must not be changed. For example, given the list being","18→7→-4→0→5→-6→10→11→-2 and K being 10, you must output -4→-6→-2→7→0→5→10→18→11."],"input":"Each input file contains one test case. For each case, the first line contains the address of the first node,a positive N (\u003c= 105) which is the total number of nodes, and a positive K (\u003c=1000). The address of a node is a 5-digit nonnegative integer, and NULL is represented by -1.\n\nThen N lines follow, each describes a node in the format:Address Data Next where Address is the position of the node, Data is an integer in [-105, 105], and Next is the position of the next node. It is guaranteed that the list is not empty.","output":"For each case, output in order (from beginning to the end of the list) the resulting linked list. Each node occupies a line, and is printed in the same format as in the input.","samples":[{"input":"00100 9 10\n23333 10 27777\n00000 0 99999\n00100 18 12309\n68237 -6 23333\n33218 -4 00000\n48652 -2 -1\n99999 5 68237\n27777 11 48652\n12309 7 33218","output":"33218 -4 68237\n68237 -6 48652\n48652 -2 12309\n12309 7 00000\n00000 0 99999\n99999 5 23333\n23333 10 00100\n00100 18 27777\n27777 11 -1","explanation":"","label":""}],"sampleInput":"00100 9 10\n23333 10 27777\n00000 0 99999\n00100 18 12309\n68237 -6 23333\n33218 -4 00000\n48652 -2 -1\n99999 5 68237\n27777 11 48652\n12309 7 33218","sampleOutput":"33218 -4 68237\n68237 -6 48652\n48652 -2 12309\n12309 7 00000\n00000 0 99999\n99999 5 23333\n23333 10 00100\n00100 18 27777\n27777 11 -1","idea":["给一个链表和K,遍历链表后将\u003c0的结点先输出,再将0~k区间的结点输出,最后输出>k的结点分析:1.所有节点用结构体{id, data, next}存储2.遍历链表,找出在此链表中的节点,放入容器v中3.把节点分三类{(-无穷,0), [0,k], (k,+无穷) },把他们按段,按先后顺序依次放进容器ans中,最后输出即可~"],"keyPoints":["先按地址建立结点映射，再沿 next 指针恢复有效链表顺序。","输出地址时通常需要补足 5 位，空地址按题目要求输出。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给一个链表和K,遍历链表后将\u003c0的结点先输出,再将0\nusing namespace std;\nstruct node {\n   int id, data, next;\n};\nint main() {\n   int begin, n, k, s, d, e;\n   scanf(\"%d%d%d\", &begin, &n, &k);\n   node a[100010];\n\n   vector\u003cnode> v, ans;\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d%d%d\", &s, &d, &e);\n      a[s] = {s, d, e};\n   }\n   for (; begin != -1; begin = a[begin].next)\n      v.push_back(a[begin]);\n   for (int i = 0; i \u003c v.size(); i++)\n      if (v[i].data \u003c 0) ans.push_back(v[i]);\n\n   for (int i = 0; i \u003c v.size(); i++)\n      if (v[i].data >= 0 && v[i].data \u003c= k) ans.push_back(v[i]);\n   for (int i = 0; i \u003c v.size(); i++)\n      if (v[i].data > k) ans.push_back(v[i]);\n   for (int i = 0; i \u003c ans.size() - 1; i++)\n      printf(\"%05d %d %05d\\n\", ans[i].id, ans[i].data, ans[i + 1].id);\n   printf(\"%05d %d -1\\n\", ans[ans.size() - 1].id, ans[ans.size() - 1].data);\n   return 0;\n}"},{"id":"1134","title":"Vertex Cover","score":25,"category":"hash散列","description":["A vertex cover of a graph is a set of vertices such that each edge of the graph is incident to at least one vertex of the set. Now given a graph with several vertex sets, you are supposed to tell if each of them is a vertex cover or not."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers N and M(both no more than 104), being the total numbers of vertices and the edges, respectively. Then M lines follow, each describes an edge by giving the indices (from 0 to N-1) of the two ends of the edge.\n\nAfter the graph, a positive integer K (\u003c= 100) is given, which is the number of queries. Then K lines of queries follow, each in the format:Nv v[1] v[2]... v[Nv]where Nv is the number of vertices in the set, and v[i]’s are the indices of the vertices.","output":"For each query, print in a line “Yes” if the set is a vertex cover, or “No” if not.","samples":[{"input":"10 11\n8 7\n6 8\n4 5\n8 4\n8 1\n1 2\n1 4\n9 8\n9 1\n1 0\n2 4\n5\n4 0 3 8 4\n6 6 1 7 5 4 9\n3 1 8 4\n2 2 8\n7 9 8 7 6 5 4 2","output":"No\nYes\nYes\nNo\nNo","explanation":"","label":""}],"sampleInput":"10 11\n8 7\n6 8\n4 5\n8 4\n8 1\n1 2\n1 4\n9 8\n9 1\n1 0\n2 4\n5\n4 0 3 8 4\n6 6 1 7 5 4 9\n3 1 8 4\n2 2 8\n7 9 8 7 6 5 4 2","sampleOutput":"No\nYes\nYes\nNo\nNo","idea":["给n个结点m条边,再给k个集合。对这k个集合逐个进行判断。每个集合S里面的数字都是结点编号,求问整个图所有的m条边两端的结点,是否至少一个结点出自集合S中。","如果是,输出Yes否则输出No分析:用vector v[n]保存某结点属于的某条边的编号,比如a b两个结点构成的这条边的编号为0,则v[a].push_back(0),v[b].push_back(0)——表示a属于0号边,b也属于0号边。","对于每一个集合做判断,遍历集合中的每一个元素,将当前元素能够属于的边的编号i对应的hash[i]标记为1,表示这条边是满足 有一个结点出自集合S中的。最后判断hash数组中的每一个值是否都是1,如果有不是1的,说明这条边的两端结点没有一个出自集合S中,则输出No。否则输出Yes~"],"keyPoints":["散列表或计数数组的范围必须覆盖题目中的全部可能取值。","每组测试数据开始前要正确初始化计数与访问标记。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给n个结点m条边,再给k个集合\n\nusing namespace std;\nint main() {\n   int n, m, k, nv, a, b, num;\n   scanf(\"%d%d\", &n, &m);\n   vector\u003cint> v[n];\n   for (int i = 0;i \u003c m; i++) {\n      scanf(\"%d%d\", &a, &b);\n      v[a].push_back(i);\n      v[b].push_back(i);\n   }\n\n   scanf(\"%d\", &k);\n   for (int i = 0; i \u003c k; i++) {\n      scanf(\"%d\", &nv);\n      int flag = 0;\n      vector\u003cint> hash(m, 0);\n      for (int j = 0; j \u003c nv; j++) {\n         scanf(\"%d\", &num);\n         for (int t = 0; t \u003c v[num].size(); t++)\n             hash[v[num][t]] = 1;\n\n      }\n      for (int j = 0; j \u003c m; j++) {\n         if (hash[j] == 0) {\n             printf(\"No\\n\");\n             flag = 1;\n             break;\n         }\n      }\n      if (flag == 0) printf(\"Yes\\n\");\n   }\n\n   return 0;\n}"},{"id":"1135","title":"Is It A Red-Black Tree","score":30,"category":"红黑树","description":["There is a kind of balanced binary search tree named red-black tree in the data structure. It has the following 5 properties:(1) Every node is either red or black.(2) The root is black.(3) Every leaf (NULL) is black.(4) If a node is red, then both its children are black.","(5) For each node, all simple paths from the node to descendant leaves contain the same number of black nodes.For example, the tree in Figure 1 is a red-black tree, while the ones in Figure 2 and 3 are not.For each given binary search tree, you are supposed to tell if it is a legal red-black tree."],"input":"Each input file contains several test cases. The first line gives a positive integer K (\u003c=30) which is the total number of cases. For each case, the first line gives a positive integer N (\u003c=30), the total number of nodes in the binary tree. The second line gives the preorder traversal sequence of the tree. While all\n\nthe keys in a tree are positive integers, we use negative signs to represent red nodes. All the numbers in a line are separated by a space. The sample input cases correspond to the trees shown in Figure 1, 2 and 3.","output":"For each test case, print in a line “Yes” if the given tree is a red-black tree, or “No” if not.","samples":[{"input":"3\n9\n7 -2 1 5 -4 -11 8 14 -15\n9\n11 -2 1 -7 5 -4 8 14 -15\n8\n10 -7 5 -6 8 15 -11 17","output":"Yes\nNo\nNo","explanation":"","label":""}],"sampleInput":"3\n9\n7 -2 1 5 -4 -11 8 14 -15\n9\n11 -2 1 -7 5 -4 8 14 -15\n8\n10 -7 5 -6 8 15 -11 17","sampleOutput":"Yes\nNo\nNo","idea":["给一棵二叉搜索树的前序遍历,判断它是否为红黑树,是输出Yes,否则输出No。","判断以下几点:1.根结点是否为黑色2.如果一个结点是红色,它的孩子节点是否都为黑色3.从任意结点到叶子结点的路径中,黑色结点的个数是否相同所以分为以下几步:0. 根据先序建立一棵树,用链表表示1. 判断根结点(题目所给先序的第一个点即根结点)是否是黑色【arr[0] \u003c 0】2. 根据建立的树,从根结点开始遍历,如果当前结点是红色,判断它的孩子节点是否为黑色,递归返回结果【judge1函数】3. 从根节点开始,递归遍历,检查每个结点的左子树的高度和右子树的高度(这里的高度指黑色结点的个数),比较左右孩子高度是否相等,递归返回结果【judge2函数】 注意:终于知道自己PAT考试的时候错在哪了。","。。维基百科定义:红黑树(英语:Red–black tree)是一种自平衡二叉查找树。AVL树:在计算机科学中,AVL树是最先发明的自平衡二叉查找树。在AVL树中任何节点的两个子树的高度最大差别为1,所以它也被称为高度平衡树。所以说红黑树不是一种AVL树,红黑树相对于AVL树来说,牺牲了部分平衡性以换取插入/删除操作时少量的旋转操作,整体来说性能要优于AVL树。","而我根据先序遍历直接建树后判断了是否AVL平衡,把判断是否平衡的那段代码注释掉就AC了~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003ccmath>\n\n// 解题关键：给一棵二叉搜索树的前序遍历,判断它是否为红黑树,是输出Yes,否则输出No\nusing namespace std;\nvector\u003cint> arr;\nstruct node {\n   int val;\n   struct node *left, *right;\n\n};\n\nnode* build(node *root, int v) {\n   if(root == NULL) {\n      root = new node();\n      root->val = v;\n      root->left = root->right = NULL;\n\n   } else if(abs(v) \u003c= abs(root->val))\n      root->left = build(root->left, v);\n   else\n      root->right = build(root->right, v);\n   return root;\n}\nbool judge1(node *root) {\n   if (root == NULL) return true;\n   if (root->val \u003c 0) {\n      if (root->left != NULL && root->left->val \u003c 0) return false;\n\n      if (root->right != NULL && root->right->val \u003c 0) return false;\n   }\n   return judge1(root->left) && judge1(root->right);\n}\nint getNum(node *root) {\n   if (root == NULL) return 0;\n   int l = getNum(root->left);\n   int r = getNum(root->right);\n   return root->val > 0 ? max(l, r) + 1 : max(l, r);\n\n}\nbool judge2(node *root) {\n   if (root == NULL) return true;\n   int l = getNum(root->left);\n   int r = getNum(root->right);\n   if(l != r) return false;\n   return judge2(root->left) && judge2(root->right);\n}\nint main() {\n   int k, n;\n\n   scanf(\"%d\", &k);\n   for (int i = 0; i \u003c k; i++) {\n      scanf(\"%d\", &n);\n      arr.resize(n);\n      node *root = NULL;\n      for (int j = 0; j \u003c n; j++) {\n         scanf(\"%d\", &arr[j]);\n         root = build(root, arr[j]);\n      }\n\n      if (arr[0] \u003c 0 || judge1(root) == false || judge2(root) == false)\n         printf(\"No\\n\");\n      else\n         printf(\"Yes\\n\");\n   }\n   return 0;\n\n}"},{"id":"1136","title":"A Delayed Palindrome","score":20,"category":"水题","description":["Consider a positive integer N written in standard notation with k+1 digits ai as ak...a1a0 with 0 \u003c= ai\u003c 10 for all i and ak > 0. Then N is palindromic if and only if ai = ak-i for all i. Zero is written 0 and is also palindromic by definition.Non-palindromic numbers can be paired with palindromic ones via a series of operations. First, the","non-palindromic number is reversed and the result is added to the original number. If the result is not a palindromic number, this is repeated until it gives a palindromic number. Such number is called a delayed palindrome. (Quoted from https://en.wikipedia.org/wiki/Palindromic_number)","Given any positive integer, you are supposed to find its paired palindromic number."],"input":"Each input file contains one test case which gives a positive integer no more than 1000 digits.","output":"For each test case, print line by line the process of finding the palindromic number. The format of each line is the following:A + B = C where A is the original number, B is the reversed A, and C is their sum. A starts being the input number, and this process ends until C becomes a palindromic number — in this case we print in the\n\nlast line “C is a palindromic number.”; or if a palindromic number cannot be found in 10 iterations,print “Not found in 10 iterations.” instead.","samples":[{"input":"97152","output":"97152 + 25179 = 122331\n122331 + 133221 = 255552\n255552 is a palindromic number.","explanation":"","label":"1"},{"input":"196","output":"196 + 691 = 887\n887 + 788 = 1675\n1675 + 5761 = 7436\n7436 + 6347 = 13783\n13783 + 38731 = 52514\n52514 + 41525 = 94039\n94039 + 93049 = 187088\n187088 + 880781 = 1067869\n1067869 + 9687601 = 10755470\n10755470 + 07455701 = 18211171\nNot found in 10 iterations.","explanation":"","label":"2"}],"sampleInput":"97152","sampleOutput":"97152 + 25179 = 122331\n122331 + 133221 = 255552\n255552 is a palindromic number.","idea":["1 将字符串倒置与原字符串比较看是否相等可知s是否为回文串2 字符串s和它的倒置t相加,只需从头到尾相加然后再倒置(记得要处理最后一个进位carry,如果有进位要在末尾+’1’)3 倒置可采用algorithm头文件里面的函数reverse(s.begin(), s.end())直接对s进行倒置"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n\n// 解题关键：1 将字符串倒置与原字符串比较看是否相等可知s是否为回文串2 字符串s和它的倒置t相加,只需从头到尾相加然后再倒置(记得要处理最后一个进位carry,如果有进位要在末尾+’1’)3 倒置可采用algorithm头文件里面\nusing namespace std;\n\nstring rev(string s) {\n   reverse(s.begin(), s.end());\n   return s;\n}\nstring add(string s1, string s2) {\n   string s = s1;\n   int carry = 0;\n   for (int i = s1.size() - 1; i >= 0; i--) {\n      s[i] = (s1[i] - '0' + s2[i] - '0' + carry) % 10 + '0';\n      carry = (s1[i] - '0' + s2[i] - '0' + carry) / 10;\n\n   }\n   if (carry > 0) s = \"1\" + s;\n   return s;\n}\nint main() {\n   string s, sum;\n   int n = 10;\n   cin >> s;\n   if (s == rev(s)) {\n      cout \u003c\u003c s \u003c\u003c \" is a palindromic number.\\n\";\n\n      return 0;\n   }\n   while (n--) {\n      sum = add(s, rev(s));\n\n      cout \u003c\u003c s \u003c\u003c \" + \" \u003c\u003c rev(s) \u003c\u003c \" = \" \u003c\u003c sum \u003c\u003c endl;\n      if (sum == rev(sum)) {\n         cout \u003c\u003c sum \u003c\u003c \" is a palindromic number.\\n\";\n         return 0;\n      }\n\n      s = sum;\n   }\n   cout \u003c\u003c \"Not found in 10 iterations.\\n\";\n   return 0;\n}"},{"id":"1137","title":"Final Grading","score":25,"category":"map映射,排序","description":["For a student taking the online course “Data Structures” on China University MOOC (http://www.ic ourse163.org/), to be qualified for a certificate, he/she must first obtain no less than 200 points from the online programming assignments, and then receive a final grade no less than 60 out of 100. The","final grade is calculated by G = (Gmid-termx 40% + Gfinalx 60%) if Gmid-term > Gfinal, or Gfinal will be taken as the final grade G. Here Gmid-term and Gfinal are the student’s scores of the mid-term and the final exams, respectively.The problem is that different exams have different grading sheets. Your job is to write a program to","merge all the grading sheets into one."],"input":"Each input file contains one test case. For each case, the first line gives three positive integers: P, the number of students having done the online programming assignments; M, the number of students on the mid-term list; and N, the number of students on the final exam list. All the numbers are no more\n\nthan 10,000.Then three blocks follow. The first block contains P online programming scores Gp’s; the second one contains M mid-term scores Gmid-term’s; and the last one contains N final exam scores Gfinal’s. Each score occupies a line with the format: StudentID Score, where StudentID is a string of no more than 20\n\nEnglish letters and digits, and Score is a nonnegative integer (the maximum score of the online programming is 900, and that of the mid-term and final exams is 100).","output":"For each case, print the list of students who are qualified for certificates. Each student occupies a line with the format:StudentID Gp Gmid-term Gfinal G If some score does not exist, output “-1” instead. The output must be sorted in descending order of their final grades (G must be rounded up to an integer). If there is a tie, output in ascending order of\n\ntheir StudentID’s. It is guaranteed that the StudentID’s are all distinct, and there is at least one qualified student.","samples":[{"input":"6 6 7\n01234 880\na1903 199\nydjh2 200\nwehu8 300\ndx86w 220\nmissing 400\nydhfu77 99\nwehu8 55\nydjh2 98\ndx86w 88\na1903 86\n01234 39\nydhfu77 88\na1903 66\n01234 58\nwehu8 84\nydjh2 82\nmissing 99\ndx86w 81","output":"missing 400 -1 99 99\nydjh2 200 98 82 88\ndx86w 220 88 81 84\nwehu8 300 55 84 84","explanation":"","label":""}],"sampleInput":"6 6 7\n01234 880\na1903 199\nydjh2 200\nwehu8 300\ndx86w 220\nmissing 400\nydhfu77 99\nwehu8 55\nydjh2 98\ndx86w 88\na1903 86\n01234 39\nydhfu77 88\na1903 66\n01234 58\nwehu8 84\nydjh2 82\nmissing 99\ndx86w 81","sampleOutput":"missing 400 -1 99 99\nydjh2 200 98 82 88\ndx86w 220 88 81 84\nwehu8 300 55 84 84","idea":["1 因为所有人必须要G编程>=200分,所以用v数组保存所有G编程>=200的人,(一开始gm和gf都为-1),用map映射保存名字所对应v中的下标(为了避免与“不存在”混淆,保存下标+1,当为0时表示该学生的姓名在v中不存在)2 G期中中出现的名字,如果对应的map并不存在(==0),说明该学生编程成绩不满足条件,则无须保存该学生信息。","将存在的人的期中考试成绩更新3 G期末中出现的名字,也必须保证在map中存在。先更新G期末和G总为新的成绩,当G期末\u003cG期中时再将G总更新为(G期中x 40% + G期末x 60%) 4 将v数组中所有G总满足条件的放入ans数组中,对ans排序(总分递减,总分相同则姓名递增),最后输出ans中的学生信息"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003cvector>\n#include \u003cmap>\n\n// 解题关键：1 因为所有人必须要G编程>=200分,所以用v数组保存所有G编程>=200的人,(一开始gm和gf都为-1),用map映射保存名字所对应v中的下标(为了避免与“不存在”混淆,保存下标+1,当为0时表示该学生的姓名在v中\nusing namespace std;\nstruct node {\n   string name;\n\n   int gp, gm, gf, g;\n};\nbool cmp(node a, node b) {\n   return a.g != b.g ? a.g > b.g : a.name \u003c b.name;\n}\nmap\u003cstring, int> idx;\nint main() {\n   int p, m, n, score, cnt = 1;\n   cin >> p >> m >> n;\n\n   vector\u003cnode> v, ans;\n   string s;\n   for (int i = 0; i \u003c p; i++) {\n      cin >> s >> score;\n      if (score >= 200) {\n         v.push_back(node{s, score, -1, -1, 0});\n         idx[s] = cnt++;\n      }\n   }\n   for (int i = 0; i \u003c m; i++) {\n\n      cin >> s >> score;\n      if (idx[s] != 0) v[idx[s] - 1].gm = score;\n   }\n   for (int i = 0; i \u003c n; i++) {\n      cin >> s >> score;\n      if (idx[s] != 0) {\n         int temp = idx[s] - 1;\n         v[temp].gf = v[temp].g = score;\n         if (v[temp].gm > v[temp].gf) v[temp].g = int(v[temp].gm * 0.4 +\n\nv[temp].gf * 0.6 + 0.5);\n      }\n   }\n   for (int i = 0; i \u003c v.size(); i++)\n      if (v[i].g >= 60) ans.push_back(v[i]);\n   sort(ans.begin(), ans.end(), cmp);\n\n   for (int i = 0; i \u003c ans.size(); i++)\n      printf(\"%s %d %d %d %d\\n\", ans[i].name.c_str(), ans[i].gp, ans[i].gm, ans[i].gf, ans[i].g);\n   return 0;\n}"},{"id":"1138","title":"Postorder Traversal","score":25,"category":"树的遍历,前序中序转后序","description":["Suppose that all the keys in a binary tree are distinct positive integers. Given the preorder and inorder traversal sequences, you are supposed to output the first number of the postorder traversal sequence of the corresponding binary tree."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (\u003c=50000),the total number of nodes in the binary tree. The second line gives the preorder sequence and the third line gives the inorder sequence. All the numbers in a line are separated by a space.","output":"For each test case, print in one line the first number of the postorder traversal sequence of the corresponding binary tree.","samples":[{"input":"7\n1 2 3 4 5 6 7\n2 3 1 5 4 7 6","output":"3","explanation":"","label":""}],"sampleInput":"7\n1 2 3 4 5 6 7\n2 3 1 5 4 7 6","sampleOutput":"3","idea":["一道简单的前序中序转后序,而且只需要知道后序的第一个值,所以可以定义一个变量flag,当post的第一个值已经输出,则flag为true,递归出又处判断flag,可以提前return ps:经过测试发现没有flag按照正常前序中序转后序也可以AC,但是我在考场上第一次尝试直接转没有提前退出递归的写法并没有能够AC,而是有一部分运行超时,后来增加了flag才AC。","可能pat考试时更为严苛,所以对于准备pat考试的小伙伴,建议如果能够缩小运行时间尽量精益求精"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：一道简单的前序中序转后序,而且只需要知道后序的第一个值,所以可以定义一个变量flag,当post的第一个值已经输出,则flag为true,递归出又处判断flag,可以提前return ps:经过测试发现没有flag按照正\nusing namespace std;\nvector\u003cint> pre, in;\nbool flag = false;\nvoid postOrder(int prel, int inl, int inr) {\n\n   if (inl > inr || flag == true) return;\n   int i = inl;\n   while (in[i] != pre[prel]) i++;\n\n   postOrder(prel+1, inl, i-1);\n   postOrder(prel+i-inl+1, i+1, inr);\n   if (flag == false) {\n      printf(\"%d\", in[i]);\n      flag = true;\n\n   }\n}\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   pre.resize(n);\n   in.resize(n);\n   for (int i = 0; i \u003c n; i++) scanf(\"%d\", &pre[i]);\n   for (int i = 0; i \u003c n; i++) scanf(\"%d\", &in[i]);\n   postOrder(0, 0, n-1);\n\n   return 0;\n}"},{"id":"1139","title":"First Contact","score":30,"category":"水题","description":["Unlike in nowadays, the way that boys and girls expressing their feelings of love was quite subtle in the early years. When a boy A had a crush on a girl B, he would usually not contact her directly in the first place. Instead, he might ask another boy C, one of his close friends, to ask another girl D, who","was a friend of both B and C, to send a message to B — quite a long shot, isn’t it? Girls would do analogously.Here given a network of friendship relations, you are supposed to help a boy or a girl to list all their friends who can possibly help them making the first contact."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers N (1 \u003c N\u003c= 300) and M, being the total number of people and the number of friendship relations, respectively.Then M lines follow, each gives a pair of friends. Here a person is represented by a 4-digit ID. To tell\n\ntheir genders, we use a negative sign to represent girls.After the relations, a positive integer K (\u003c= 100) is given, which is the number of queries. Then K lines of queries follow, each gives a pair of lovers, separated by a space. It is assumed that the first one is\n\nhaving a crush on the second one.","output":"For each query, first print in a line the number of different pairs of friends they can find to help them,then in each line print the IDs of a pair of friends.If the lovers A and B are of opposite genders, you must first print the friend of A who is of the same\n\ngender of A, then the friend of B, who is of the same gender of B. If they are of the same gender, then both friends must be in the same gender as theirs. It is guaranteed that each person has only one gender.The friends must be printed in non-decreasing order of the first IDs, and for the same first ones, in\n\nincreasing order of the seconds ones.","samples":[{"input":"10 18\n-2001 1001\n-2002 -2001\n1004 1001\n-2004 -2001\n-2003 1005\n1005 -2001\n1001 -2003\n1002 1001\n1002 -2004\n-2004 1001\n1003 -2002\n-2003 1003\n1004 -2002\n-2001 -2003\n1001 1003\n1003 -2001\n1002 -2001\n-2002 -2003\n5\n1001 -2001\n-2003 1001\n1005 -2001\n-2002 -2004\n1111 -2003","output":"4\n1002 2004\n1003 2002\n1003 2003\n1004 2002\n4\n2001 1002\n2001 1003\n2002 1003\n2002 1004\n0\n1\n2003 2001\n0","explanation":"","label":""}],"sampleInput":"10 18\n-2001 1001\n-2002 -2001\n1004 1001\n-2004 -2001\n-2003 1005\n1005 -2001\n1001 -2003\n1002 1001\n1002 -2004\n-2004 1001\n1003 -2002\n-2003 1003\n1004 -2002\n-2001 -2003\n1001 1003\n1003 -2001\n1002 -2001\n-2002 -2003\n5\n1001 -2001\n-2003 1001\n1005 -2001\n-2002 -2004\n1111 -2003","sampleOutput":"4\n1002 2004\n1003 2002\n1003 2003\n1004 2002\n4\n2001 1002\n2001 1003\n2002 1003\n2002 1004\n0\n1\n2003 2001\n0","idea":["1.用数组arr标记两个人是否是朋友(邻接矩阵表示),用v标记所有人的同性朋友(邻接表表示)2.对于一对想要在一起的A和B,他们需要先找A的所有同性朋友C,再找B的所有同性朋友D,当C和D两人是朋友的时候则可以输出C和D 3.A在寻找同性朋友时,需要避免找到他想要的伴侣B,所以当当前朋友就是B或者B的同性朋友就是A时舍弃该结果4.输出时候要以4位数的方式输出,所以要%04d 5.如果用int接收一对朋友,-0000和0000对于int来说都是0,将无法得知这个人的性别,也就会影响他找他的同性朋友的那个步骤,所以考虑用字符串接收,因为题目中已经表示会以符号位加四位的方式给出 输入,所以只要判断字符串是否大小相等,如果大小相等说明这两个人是同性6.结果数组因为必须按照第一个人的编号从小到大排序(当第一个相等时按照第二个人编号的从小到大排序),所以要用sort对ans数组排序后再输出结果Update: 新PAT系统中原代码导致了一个测试点内存超限,使用unordered_map\u003cint, bool> arr 替代二维数组可避免内存超限(2018-05-28更新)"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：1.用数组arr标记两个人是否是朋友(邻接矩阵表示),用v标记所有人的同性朋友(邻接表表示)2.对于一对想要在一起的A和B,他们需要先找A的所有同性朋友C,再找B的所有同性朋友D,当C和D两人是朋友的时候则可以输出C和D\n\n#include \u003cstring>\n#include \u003cvector>\n#include \u003calgorithm>\n#include \u003cunordered_map>\nusing namespace std;\n\nunordered_map\u003cint, bool> arr;\nstruct node {\n   int a, b;\n};\nbool cmp(node x, node y) {\n   return x.a != y.a ? x.a \u003c y.a : x.b \u003c y.b;\n}\nint main() {\n   int n, m, k;\n   scanf(\"%d%d\", &n, &m);\n\n   vector\u003cint> v[10000];\n   for (int i = 0; i \u003c m; i++) {\n      string a, b;\n      cin >> a >> b;\n      if (a.length() == b.length()) {\n         v[abs(stoi(a))].push_back(abs(stoi(b)));\n         v[abs(stoi(b))].push_back(abs(stoi(a)));\n      }\n      arr[abs(stoi(a)) * 10000 + abs(stoi(b))] = arr[abs(stoi(b)) * 10000\n\n+ abs(stoi(a))] = true;\n   }\n   scanf(\"%d\", &k);\n   for (int i = 0; i \u003c k; i++) {\n      int c, d;\n      cin >> c >> d;\n      vector\u003cnode> ans;\n      for (int j = 0; j \u003c v[abs(c)].size(); j++) {\n         for (int k = 0; k \u003c v[abs(d)].size(); k++) {\n             if (v[abs(c)][j] == abs(d) || abs(c) == v[abs(d)][k])\n\ncontinue;\n             if (arr[v[abs(c)][j] * 10000 + v[abs(d)][k]] == true)\n                ans.push_back(node{v[abs(c)][j], v[abs(d)][k]});\n         }\n      }\n      sort(ans.begin(), ans.end(), cmp);\n      printf(\"%d\\n\", int(ans.size()));\n      for(int j = 0; j \u003c ans.size(); j++)\n         printf(\"%04d %04d\\n\", ans[j].a, ans[j].b);\n\n   }\n   return 0;\n}"},{"id":"1140","title":"Look-and-say Sequence","score":20,"category":"字符串处理","description":["Look-and-say sequence is a sequence of integers as the following:D, D1, D111, D113, D11231, D112213111,...where D is in [0, 9] except 1. The (n+1)st number is a kind of description of the nth number. For example, the 2nd number means that there is one D in the 1st number, and hence it is D1; the 2nd","number consists of one D (corresponding to D1) and one 1 (corresponding to 11), therefore the 3rd number is D111; or since the 4th number is D113, it consists of one D, two 1’s, and one 3, so the next number must be D11231. This definition works for D = 1 as well. Now you are supposed to calculate","the Nth number in a look-and-say sequence of a given digit D."],"input":"Each input file contains one test case, which gives D (in [0, 9]) and a positive integer N (\u003c=40),separated by a space.","output":"Print in a line the Nth number in a look-and-say sequence of D.","samples":[{"input":"1 8","output":"1123123111","explanation":"","label":""}],"sampleInput":"1 8","sampleOutput":"1123123111","idea":["给两个数字D和n,第一个序列是D,后一个序列描述前一个序列的所有数字以及这个数字出现的次数,比如D出现了1次,那么第二个序列就是D1,对于第二个序列D1,第三个序列这样描述:D出现1次,1出现1次,所以是D111......以此类推,输出第n个序列~","用string s接收所需变幻的数字,每次遍历s,从当前位置i开始,看后面有多少个与s[i]相同,设j处开始不相同,那么临时字符串 t += s[i] + to_string(j – i);然后再将t赋值给s,cnt只要没达到n次就继续加油循环下一次,最后输出s的值~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：给两个数字D和n,第一个序列是D,后一个序列描述前一个序列的所有数字以及这个数字出现的次数,比如D出现了1次,那么第二个序列就是D1,对于第二个序列D1,第三个序列这样描述:D出现1次,1出现1次,所以是D111....\nusing namespace std;\nint main() {\n   string s;\n   int n, j;\n\n   cin >> s >> n;\n   for (int cnt = 1; cnt \u003c n; cnt++) {\n      string t;\n      for (int i = 0; i \u003c s.length(); i = j) {\n         for (j = i; j \u003c s.length() && s[j] == s[i]; j++);\n         t += s[i] + to_string(j - i);\n\n      }\n      s = t;\n   }\n   cout \u003c\u003c s;\n   return 0;\n\n}"},{"id":"1141","title":"PAT Ranking of Institutions","score":25,"category":"排序,map STL","description":["After each PAT, the PAT Center will announce the ranking of institutions based on their students’performances. Now you are asked to generate the ranklist."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (\u003c=105),which is the number of testees. Then N lines follow, each gives the information of a testee in the following format:ID Score School where “ID” is a string of 6 characters with the first one representing the test level: “B” stands for the\n\nbasic level, “A” the advanced level and “T” the top level; “Score” is an integer in [0, 100]; and“School” is the institution code which is a string of no more than 6 English letters (case insensitive).Note: it is guaranteed that “ID” is unique for each testee.","output":"For each case, first print in a line the total number of institutions. Then output the ranklist of institutions in nondecreasing order of their ranks in the following format:Rank School TWS Ns where “Rank” is the rank (start from 1) of the institution; “School” is the institution code (all in lower\n\ncase); “TWS” is the total weighted score which is defined to be the integer part of “ScoreB/1.5 +ScoreA + ScoreT*1.5”, where “ScoreX” is the total score of the testees belong to this institution on level X; and “Ns” is the total number of testees who belong to this institution.\n\nThe institutions are ranked according to their TWS. If there is a tie, the institutions are supposed to have the same rank, and they shall be printed in ascending order of Ns. If there is still a tie, they shall be printed in alphabetical order of their codes.","samples":[{"input":"10\nA57908 85 Au\nB57908 54 LanX\nA37487 60 au\nT28374 67 CMU\nT32486 24 hypu\nA66734 92 cmu\nB76378 71 AU\nA47780 45 lanx\nA72809 100 pku\nA03274 45 hypu","output":"5\n1 cmu 192 2\n1 au 192 3\n3 pku 100 1\n4 hypu 81 2\n4 lanx 81 2","explanation":"","label":""}],"sampleInput":"10\nA57908 85 Au\nB57908 54 LanX\nA37487 60 au\nT28374 67 CMU\nT32486 24 hypu\nA66734 92 cmu\nB76378 71 AU\nA47780 45 lanx\nA72809 100 pku\nA03274 45 hypu","sampleOutput":"5\n1 cmu 192 2\n1 au 192 3\n3 pku 100 1\n4 hypu 81 2\n4 lanx 81 2","idea":["给出每个学生的id、分数、学校,学校名称不区分大小写,输出学校排名、学校名称、总加权成绩、学校参赛人数。学校名称输出时候以小写方式输出。两个map,一个cnt用来存储某学校名称对应的参赛人数,另一个sum计算某学校名称对应的总加权成绩。","每次学校名称string school都要转化为全小写,将map中所有学校都保存在vector ans中,类型为node,node中包括学校姓名、加权总分、参赛人数。对ans数组排序,根据题目要求写好cmp函数,最后按要求输出。对于排名的处理:设立pres表示前一个学校的加权总分,如果pres和当前学校的加权总分不同,说明rank等于数组下标+1,否则rank不变~","注意:总加权分数取整数部分是要对最后的总和取整数部分,不能每次都直接用int存储,不然会有一个3分测试点不通过~PS:之前直接使用map,导致在新的PAT系统中提交后最后一个测试点超时,改成了unordered_map即可AC~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003ccctype>\n#include \u003cvector>\n#include \u003cunordered_map>\n\n// 解题关键：给出每个学生的id、分数、学校,学校名称不区分大小写,输出学校排名、学校名称、总加权成绩、学校参赛人数\nusing namespace std;\n\nstruct node {\n   string school;\n   int tws, ns;\n};\n\nbool cmp(node a, node b) {\n   if (a.tws != b.tws)\n      return a.tws > b.tws;\n   else if (a.ns != b.ns)\n      return a.ns \u003c b.ns;\n\n   else\n      return a.school \u003c b.school;\n}\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   unordered_map\u003cstring, int> cnt;\n   unordered_map\u003cstring, double> sum;\n   for (int i = 0; i \u003c n; i++) {\n      string id, school;\n\n      cin >> id;\n      double score;\n      scanf(\"%lf\", &score);\n      cin >> school;\n      for (int j = 0; j \u003c school.length(); j++)\n         school[j] = tolower(school[j]);\n      if (id[0] == 'B')\n         score = score / 1.5;\n      else if (id[0] == 'T')\n\n         score = score * 1.5;\n      sum[school] += score;\n      cnt[school]++;\n   }\n   vector\u003cnode> ans;\n   for (auto it = cnt.begin(); it != cnt.end(); it++)\n      ans.push_back(node{it->first, (int)sum[it->first], cnt[it->first]});\n   sort(ans.begin(), ans.end(), cmp);\n   int rank = 0, pres = -1;\n   printf(\"%d\\n\", (int)ans.size());\n\n   for (int i = 0; i \u003c ans.size(); i++) {\n      if (pres != ans[i].tws) rank = i + 1;\n      pres = ans[i].tws;\n      printf(\"%d \", rank);\n      cout \u003c\u003c ans[i].school;\n      printf(\" %d %d\\n\", ans[i].tws, ans[i].ns);\n   }\n   return 0;\n}"},{"id":"1142","title":"Maximal Clique","score":25,"category":"图论,无向完全图","description":["A clique is a subset of vertices of an undirected graph such that every two distinct vertices in the clique are adjacent. A maximal clique is a clique that cannot be extended by including one more adjacent vertex. (Quoted from https://en.wikipedia.org/wiki/Clique_(graph_theory))","Now it is your job to judge if a given subset of vertices can form a maximal clique."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers Nv (\u003c=200), the number of vertices in the graph, and Ne, the number of undirected edges. Then Ne lines follow, each gives a pair of vertices of an edge. The vertices are numbered from 1 to Nv.\n\nAfter the graph, there is another positive integer M (\u003c= 100). Then M lines of query follow, each first gives a positive number K (\u003c= Nv), then followed by a sequence of K distinct vertices. All the numbers in a line are separated by a space.","output":"For each of the M queries, print in a line “Yes” if the given subset of vertices can form a maximal clique; or if it is a clique but not a maximal clique, print “Not Maximal”; or if it is not a clique at all,print “Not a Clique”.","samples":[{"input":"8 10\n5 6\n7 8\n6 4\n3 6\n4 5\n2 3\n8 2\n2 7\n5 3\n3 4\n6\n4 5 4 3 6\n3 2 8 7\n2 2 3\n1 1\n3 4 3 6\n3 3 2 1","output":"Yes\nYes\nYes\nYes\nNot Maximal\nNot a Clique","explanation":"","label":""}],"sampleInput":"8 10\n5 6\n7 8\n6 4\n3 6\n4 5\n2 3\n8 2\n2 7\n5 3\n3 4\n6\n4 5 4 3 6\n3 2 8 7\n2 2 3\n1 1\n3 4 3 6\n3 3 2 1","sampleOutput":"Yes\nYes\nYes\nYes\nNot Maximal\nNot a Clique","idea":["clique是一个点集,在一个无向图中,这个点集中任意两个不同的点之间都是相连的。maximal clique是一个clique,这个clique不可以再加入任何一个新的结点构成新的clique。点编号从1~nv,给出ne条边,以一对结点编号的方式给出。然后给出m条询问,每个询问是一个点集合,问这个点集合是否是maximal clique、是否是clique~","先判断是否是clique,即判断是否任意两边都相连;之后判断是否是maximal,即遍历所有不在集合中的剩余的点,看是否存在一个点满足和集合中所有的结点相连,最后如果都满足,那就输出Yes表示是Maximal clique~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：clique是一个点集,在一个无向图中,这个点集中任意两个不同的点之间都是相连的\nusing namespace std;\nint e[210][210];\nint main() {\n   int nv, ne, m, ta, tb, k;\n   scanf(\"%d %d\", &nv, &ne);\n\n   for (int i = 0; i \u003c ne; i++) {\n      scanf(\"%d %d\", &ta, &tb);\n      e[ta][tb] = e[tb][ta] = 1;\n   }\n   scanf(\"%d\", &m);\n   for (int i = 0; i \u003c m; i++) {\n      scanf(\"%d\", &k);\n      vector\u003cint> v(k);\n      int hash[210] = {0}, isclique = 1, isMaximal = 1;\n      for (int j = 0; j \u003c k; j++) {\n\n         scanf(\"%d\", &v[j]);\n         hash[v[j]] = 1;\n      }\n      for (int j = 0; j \u003c k; j++) {\n\n         if (isclique == 0) break;\n         for (int l = j + 1; l \u003c k; l++) {\n             if (e[v[j]][v[l]] == 0) {\n                isclique = 0;\n                printf(\"Not a Clique\\n\");\n\n                break;\n             }\n         }\n      }\n      if (isclique == 0) continue;\n      for (int j = 1; j \u003c= nv; j++) {\n         if (hash[j] == 0) {\n             for (int l = 0; l \u003c k; l++) {\n                if (e[v[l]][j] == 0) break;\n                if (l == k - 1) isMaximal = 0;\n\n             }\n         }\n         if (isMaximal == 0) {\n             printf(\"Not Maximal\\n\");\n             break;\n         }\n      }\n      if (isMaximal == 1) printf(\"Yes\\n\");\n   }\n\n   return 0;\n}"},{"id":"1143","title":"Lowest Common Ancestor","score":30,"category":"水题","description":["The lowest common ancestor (LCA) of two nodes U and V in a tree is the deepest node that has both U and V as descendants.A binary search tree (BST) is recursively defined as a binary tree which has the following properties:The left subtree of a node contains only nodes with keys less than the node’s key.","The right subtree of a node contains only nodes with keys greater than or equal to the node’s key.Both the left and right subtrees must also be binary search trees.Given any two nodes in a BST, you are supposed to find their LCA."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers: M (\u003c=1000), the number of pairs of nodes to be tested; and N (\u003c= 10000), the number of keys in the BST,respectively. In the second line, N distinct integers are given as the preorder traversal sequence of the\n\nBST. Then M lines follow, each contains a pair of integer keys U and V. All the keys are in the range of int.","output":"For each given pair of U and V, print in a line “LCA of U and V is A.” if the LCA is found and A is the key. But if A is one of U and V, print “X is an ancestor of Y.” where X is A and Y is the other node. If U or V is not found in the BST, print in a line “ERROR: U is not found.” or “ERROR: V is not found.” or\n\n“ERROR: U and V are not found.”.","samples":[{"input":"6 8\n6 3 1 2 5 4 8 7\n2 5\n8 7\n1 9\n12 -3\n0 8\n99 99","output":"LCA of 2 and 5 is 3.\n8 is an ancestor of 7.\nERROR: 9 is not found.\nERROR: 12 and -3 are not found.\nERROR: 0 is not found.\nERROR: 99 and 99 are not found.","explanation":"","label":""}],"sampleInput":"6 8\n6 3 1 2 5 4 8 7\n2 5\n8 7\n1 9\n12 -3\n0 8\n99 99","sampleOutput":"LCA of 2 and 5 is 3.\n8 is an ancestor of 7.\nERROR: 9 is not found.\nERROR: 12 and -3 are not found.\nERROR: 0 is not found.\nERROR: 99 and 99 are not found.","idea":["给出一棵二叉搜索树的前序遍历,问结点u和v的共同最低祖先是谁~map\u003cint, bool> mp用来标记树中所有出现过的结点,遍历一遍pre数组,将当前结点标记为a,如果u和v分别在a的左、右,或者u、v其中一个就是当前a,即(a >= u && a \u003c= v) || (a >= v && a \u003c=u),说明找到了这个共同最低祖先a,退出当前循环~最后根据要求输出结果即可~","PS:30分的题目30行代码解决,1行1分,惊不惊喜?意不意外?(真的是水题啊...)"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cmap>\n\n// 解题关键：给出一棵二叉搜索树的前序遍历,问结点u和v的共同最低祖先是谁\nusing namespace std;\nmap\u003cint, bool> mp;\nint main() {\n\n   int m, n, u, v, a;\n   scanf(\"%d %d\", &m, &n);\n   vector\u003cint> pre(n);\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d\", &pre[i]);\n\n      mp[pre[i]] = true;\n   }\n   for (int i = 0; i \u003c m; i++) {\n      scanf(\"%d %d\", &u, &v);\n      for(int j = 0; j \u003c n; j++) {\n         a = pre[j];\n         if ((a >= u && a \u003c= v) || (a >= v && a \u003c= u)) break;\n      }\n      if (mp[u] == false && mp[v] == false)\n         printf(\"ERROR: %d and %d are not found.\\n\", u, v);\n\n      else if (mp[u] == false || mp[v] == false)\n         printf(\"ERROR: %d is not found.\\n\", mp[u] == false ? u : v);\n      else if (a == u || a == v)\n         printf(\"%d is an ancestor of %d.\\n\", a, a == u ? v : u);\n      else\n         printf(\"LCA of %d and %d is %d.\\n\", u, v, a);\n   }\n   return 0;\n}"},{"id":"1144","title":"The Missing Number","score":20,"category":"STL,map","description":["Given N integers, you are supposed to find the smallest positive integer that is NOT in the given list."],"input":"Each input file contains one test case. For each case, the first line gives a positive integer N (\u003c= 105).Then N integers are given in the next line, separated by spaces. All the numbers are in the range of int.","output":"Print in a line the smallest positive integer that is missing from the input list.","samples":[{"input":"10\n5 -25 9 6 1 3 4 2 5 17","output":"7","explanation":"","label":""}],"sampleInput":"10\n5 -25 9 6 1 3 4 2 5 17","sampleOutput":"7","idea":["给n个数字,找到不在这个数字列表里面的最小的正整数分析:将每个数字出现的次数存储在map里面,num从1开始,如果m[num] == 0说明不存在,则输出这个num~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n\n// 解题关键：给n个数字,找到不在这个数字列表里面的最小的正整数分析:将每个数字出现的次数存储在map里面,num从1开始,如果m[num] == 0说明不存在,则输出这个num\nusing namespace std;\nint main() {\n   int n, a, num = 0;\n   cin >> n;\n   map\u003cint, int> m;\n   for (int i = 0; i \u003c n; i++) {\n      cin >> a;\n\n      m[a]++;\n   }\n   while(++num)\n      if (m[num] == 0) break;\n   cout \u003c\u003c num;\n   return 0;\n}"},{"id":"1145","title":"Hashing – Average Search Time","score":25,"category":"哈希映射,哈希表,平方探测 法","description":["The task of this problem is simple: insert a sequence of distinct positive integers into a hash table first.Then try to find another sequence of integer keys from the table and output the average search time(the number of comparisons made to find whether or not the key is in the table). The hash function is","defined to be “H(key) = key % TSize” where TSize is the maximum size of the hash table. Quadratic probing (with positive increments only) is used to solve the collisions.Note that the table size is better to be prime. If the maximum size given by the user is not prime, you","must re-define the table size to be the smallest prime number which is larger than the size given by the user."],"input":"Each input file contains one test case. For each case, the first line contains two positive numbers:MSize, N,
