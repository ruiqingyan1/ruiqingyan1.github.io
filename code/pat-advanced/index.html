\u003c 7; l++)\n             for (int m = 0; m \u003c 5; m++)\n                out[l][m + (k - i) * 6] = a[s[k] - 'A'][l][m];\n\n      if (flag) cout \u003c\u003c '\\n';\n      for (int k = 0; k \u003c 7; k++) {\n         flag = 1;\n         for (int l = 0; l \u003c 6 * (j - i) - 1; l++) cout \u003c\u003c out[k][l];\n         cout \u003c\u003c '\\n';\n      }\n      i = j;\n   }\n   return 0;\n}"},{"id":"1165","title":"Block Reversing","score":25,"category":"链表","description":["Given a singly linked list L. Let us consider every K nodes as a block (if there are less than K nodes at the end of the list, the rest of the nodes are still considered as a block). Your job is to reverse all the blocks in L. For example, given L as 1→2→3→4→5→6→7→8 and K as 3, your output must be","7→8→4→5→6→1→2→3."],"input":"Each input file contains one test case. For each case, the first line contains the address of the first node,a positive N (≤10^5) which is the total number of nodes, and a positive K (≤N) which is the size of a block. The address of a node is a 5-digit nonnegative integer, and NULL is represented by −1.\n\nThen N lines follow, each describes a node in the format:Address Data Next where Address is the position of the node, Data is an integer, and Next is the position of the next node.","output":"For each case, output the resulting ordered linked list. Each node occupies a line, and is printed in the same format as in the input.","samples":[{"input":"00100 8 3\n71120 7 88666\n00000 4 99999\n00100 1 12309\n68237 6 71120\n33218 3 00000\n99999 5 68237\n88666 8 -1\n12309 2 33218","output":"71120 7 88666\n88666 8 00000\n00000 4 99999\n99999 5 68237\n68237 6 00100\n00100 1 12309\n12309 2 33218\n33218 3 -1","explanation":"","label":""}],"sampleInput":"00100 8 3\n71120 7 88666\n00000 4 99999\n00100 1 12309\n68237 6 71120\n33218 3 00000\n99999 5 68237\n88666 8 -1\n12309 2 33218","sampleOutput":"71120 7 88666\n88666 8 00000\n00000 4 99999\n99999 5 68237\n68237 6 00100\n00100 1 12309\n12309 2 33218\n33218 3 -1","idea":["给定一个单链表L,将每K个结点看成一个区块(链表最后若不足K个结点,也看成一个区块),请编写程序将L中所有区块的链表反转。例如:给定L为1→2→3→4→5→6→7→8,K为3,则输出应该为7→8→4→5→6→1→2→3。每个输入包含1个测试用例。每个测试用例第1行给出第1个结点的地址、结点总个数正整数N(≤10的五次方)、以及正整数K(≤N),即区块的大小。","结点的地址是5位非负整数,NULL 地址用−1表示。接下来有N行,每行格式为:Address Data Next,其中Address是结点地址,Data是该结点保存的整数数据,Next是下一个结点的地址。对于每个测试用例,顺序输出反转 后的链表,其上每个结点占一行,格式与输入相同。L为输入链表,ans为答案链表,二维数组E为区块链表。","先将链表数据记录在结构体A中,遍历A将链表正确顺序记录在链表L中,然后需要重新定义链表长度n(因为有输入中有无效的假结点信息)。遍历链表L,将每K个结点所分隔成的区块保存在二维数组E中,再从后往前将区块链表E中的值添加到答案链表ans中,最后根据格式输出ans链表就好啦~"],"keyPoints":["先按地址建立结点映射，再沿 next 指针恢复有效链表顺序。","输出地址时通常需要补足 5 位，空地址按题目要求输出。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：给定一个单链表L,将每K个结点看成一个区块(链表最后若不足K个结点,也看成一个区块),请编写程序将L中所有区块的链表反转\nusing namespace std;\n\nstruct node {\n   int data, next;\n}A[100001];\nvector\u003cint> L, ans, E[100001];\nint s, n , a, t, k, mark, cnt, c;\nint main() {\n   cin >> s >> n >> k;\n   for (int i = 0; i \u003c n; i++) {\n      cin >> a;\n\n      cin >> A[a].data >> A[a].next;\n   }\n   t = s;\n   while (t != -1) {\n      L.push_back(t);\n      t = A[t].next;\n   }\n   n = L.size();\n   for (int i = 0; i \u003c n; i++) {\n      E[c].push_back(L[i]);\n\n      cnt++;\n      if (cnt == k && i != n - 1) {\n         cnt = 0;\n         c++;\n      }\n   }\n   for (int i = c; i >= 0; i--)\n      for (auto it : E[i])\n         ans.push_back(it);\n   for (int i = 1; i \u003c n; i++)\n\n      printf(\"%05d %d %05d\\n\", ans[i - 1], A[ans[i - 1]].data, ans[i]);\n   printf(\"%05d %d -1\", ans.back(), A[ans.back()].data);\n   return 0;\n}"},{"id":"1166","title":"Summit","score":25,"category":"集合set,STL","description":["A summit (峰会) is a meeting of heads of state or government. Arranging the rest areas for the summit is not a simple job. The ideal arrangement of one area is to invite those heads so that everyone is a direct friend of everyone.Now given a set of tentative arrangements, your job is to tell the organizers whether or not each area","is all set."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers N (≤ 200),the number of heads in the summit, and M, the number of friendship relations. Then M lines follow,each gives a pair of indices of the heads who are friends to each other. The heads are indexed from 1\n\nto N.Then there is another positive integer K (≤ 100), and K lines of tentative arrangement of rest areas follow, each first gives a positive number L (≤ N), then followed by a sequence of L distinct indices of the heads. All the numbers in a line are separated by a space.","output":"For each of the K areas, print in a line your advice in the following format:if in this area everyone is a direct friend of everyone, and no friend is missing (that is, no one else is a direct friend of everyone in this area), print Area X is OK..if in this area everyone is a direct friend of everyone, yet there are some other heads who may also\n\nbe invited without breaking the ideal arrangement, print Area X may invite more people, such as H. where H is the smallest index of the head who may be invited.if in this area the arrangement is not an ideal one, then print Area X needs help. so the host can provide some special service to help the heads get to know each other.\n\nHere X is the index of an area, starting from 1 to K.","samples":[{"input":"8 10\n5 6\n7 8\n6 4\n3 6\n4 5\n2 3\n8 2\n2 7\n5 3\n3 4\n6\n4 5 4 3 6\n3 2 8 7\n2 2 3\n1 1\n2 4 6\n3 3 2 1","output":"Area 1 is OK.\nArea 2 is OK.\nArea 3 is OK.\nArea 4 is OK.\nArea 5 may invite more people, such as 3.\nArea 6 needs help.","explanation":"","label":""}],"sampleInput":"8 10\n5 6\n7 8\n6 4\n3 6\n4 5\n2 3\n8 2\n2 7\n5 3\n3 4\n6\n4 5 4 3 6\n3 2 8 7\n2 2 3\n1 1\n2 4 6\n3 3 2 1","sampleOutput":"Area 1 is OK.\nArea 2 is OK.\nArea 3 is OK.\nArea 4 is OK.\nArea 5 may invite more people, such as 3.\nArea 6 needs help.","idea":["为峰会安排休息区,一个理想的安排是邀请这些领导人,每个人互相之间都是直接朋友。给定一套暂定的安排,判断每个区域是否都已准备就绪。输入格式:第一行给一个正整数N,表示峰会的首领数量,以及一个正整数M,表示友谊关系的数量。接下来是M行,每行给出一对互为朋友的领导人的编号。领导人的编号从1到N。","然后给出另一个正整数K,接下来是K行暂定的休息区,每行给出一个正整数L,然后是一系列L个不同的领导人编号。一行中所有数字都用空格分隔。","输出格式:对于K个休息区的每一个,请按以下格式将您的建议输出在一行中:如果在这个休息区每个人都互相是直接朋友, 并且没有朋友漏掉(即没有其他人是这个休息区每个人的直接朋友),就输出Area X is OK.如果在这个休息区每个人都是每个人的直接朋友,但在不破坏理想安排的情况下,可能还会邀请一些其他领导人,就输出Area X may invite more people, such as H. H是可以被邀请的领导人的最小编号。","如果该休息区的安排不理想,则输出Area X needs help. 这样主持人可以提供一些特别的服务帮助领导人们互相了解。二维数组A作为邻接矩阵存储两个人是否是好朋友,如果是u和v好朋友就将数组A[u][v] = A[v][u] = 1;集合temp存储待检查的序列号。先检查所有的人是不是互相都为好朋友,如果不是的话,直接输出needs help。","然后,检查剩下的所有人中,是否有人是他们所有人的好朋友、但是没有被邀请的,如果没有,就输出is OK. 否则输出may invite more people, such as f. 其中f为可以被邀请的领导人的最小编号~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cset>\n\n// 解题关键：为峰会安排休息区,一个理想的安排是邀请这些领导人,每个人互相之间都是直接朋友\nusing namespace std;\nint n, m, k, l, u, v, s, e, f, f2, A[201][201];\n\nint main() {\n   cin >> n >> m;\n   for (int i = 0; i \u003c m; i++) {\n      cin >> u >> v;\n      A[u][v] = A[v][u] = 1;\n   }\n   cin >> k;\n   for (int i = 1; i \u003c= k; i++) {\n      f = 0;\n\n      set\u003cint> temp;\n      cin >> l;\n      for (int j = 0; j \u003c l; j++) {\n         cin >> e;\n         for (auto it : temp)\n             if (!A[e][it]) f = 1;\n\n         temp.insert(e);\n      }\n      cout \u003c\u003c \"Area \" \u003c\u003c i;\n      if (f) {\n         cout \u003c\u003c \" needs help.\\n\";\n\n      } else {\n         for (int i = 1; i \u003c= n; i++) {\n             f2 = 1;\n             if (temp.count(i)) continue;\n             for (auto it : temp) {\n                if (!A[i][it]) {\n                   f2 = 0;\n                   break;\n                }\n             }\n\n             if (f2) {\n                f = i;\n                break;\n             }\n         }\n         if (!f)\n             cout \u003c\u003c \" is OK.\\n\";\n         else\n             cout \u003c\u003c \" may invite more people, such as \" \u003c\u003c f \u003c\u003c \".\\n\";\n\n      }\n   }\n   return 0;\n}"},{"id":"1167","title":"Cartesian Tree","score":30,"category":"树的遍历,map映射,STL","description":["A Cartesian tree is a binary tree constructed from a sequence of distinct numbers. The tree is heap-ordered, and an inorder traversal returns the original sequence. For example, given the sequence { 8,15, 3, 4, 1, 5, 12, 10, 18, 6 }, the min-heap Cartesian tree is shown by the figure.","Your job is to output the level-order traversal sequence of the min-heap Cartesian tree."],"input":"Each input file contains one test case. Each case starts from giving a positive integer N (≤30), and then N distinct numbers in the next line, separated by a space. All the numbers are in the range of int.","output":"For each test case, print in a line the level-order traversal sequence of the min-heap Cartesian tree. All the numbers in a line must be separated by exactly one space, and there must be no extra space at the beginning or the end of the line.","samples":[{"input":"10\n8 15 3 4 1 5 12 10 18 6","output":"1 3 5 8 4 6 15 10 12 18","explanation":"","label":""}],"sampleInput":"10\n8 15 3 4 1 5 12 10 18 6","sampleOutput":"1 3 5 8 4 6 15 10 12 18","idea":["笛卡尔树,是由一系列不同数字构成的二叉树。树是堆排序的,中序遍历返回原始序列。例如,给定序列{8, 15, 3, 4, 1, 5, 12, 10, 18, 6},小顶堆笛卡尔树如图所示。你的工作是输出小顶堆笛卡尔树的层序遍历序列。输入格式:给一个正整数N,接下来一行给出N个不同的数字,用空格分隔。所有数字都在int范围内。输出格式:在一行中输出小顶堆笛卡尔树的层序遍历。","一行中的所有数字必须用一个空格隔开,并且行首和行尾不得有多余的空格。中序遍历保存在In数组中,层序遍历结果保存在映射map\u003cint, int> ans中。本题需要将小顶堆的中序遍历转化为层次遍历。我们知道,在小顶堆中,数值最小的那个元素为根结点,对于其任何子树也一样。所以我们只要在中序遍历中找到最小的那个数作为当前的根结点,左边的所有数都归左子树,右边所有数都归右子树。","将根结点的序号设为1,左孩子的序号为它的两倍,右孩子的序号为它的两倍+1,最后根据序号顺序输出ans即为层序遍历的顺序。哇呜。"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n\n// 解题关键：笛卡尔树,是由一系列不同数字构成的二叉树\nusing namespace std;\nint n, In[32];\n\nmap\u003cint, int> ans;\nvoid deal(int index, int L, int R) {\n   if (L > R) return;\n   int pos = L;\n   for (int i = L + 1; i \u003c= R; i++)\n      if (In[i] \u003c In[pos]) pos = i;\n   ans[index] = In[pos];\n   deal(index \u003c\u003c 1, L, pos - 1);\n   deal(index \u003c\u003c 1 | 1, pos + 1, R);\n}\n\nint main() {\n   cin >> n;\n   for (int i = 0; i \u003c n; i++) cin >> In[i];\n   deal(1, 0, n - 1);\n   for (auto it : ans) {\n      if (it.first != 1) cout \u003c\u003c ' ';\n      cout \u003c\u003c it.second;\n   }\n\n   return 0;\n}"},{"id":"1168","title":"Prime Day","score":20,"category":"素数,字符串处理","description":["The above picture is from Sina Weibo, showing May 23rd, 2019 as a very cool “Prime Day”. That is,not only that the corresponding number of the date 20190523 is a prime, but all its sub-strings ended at the last digit 3 are prime numbers.Now your job is to tell if a given date is a Prime Day."],"input":"Each input file contains one test case. For each case, a date between January 1st, 0001 and December 31st, 9999 is given, in the format yyyymmdd.","output":"For each given date, output in the decreasing order of the length of the substrings, each occupies a line. In each line, print the string first, followed by a space, then Yes if it is a prime number, or No if not. If this date is a Prime Day, print in the last line All Prime!.","samples":[{"input":"20190523","output":"20190523 Yes\n0190523 Yes\n190523 Yes\n90523 Yes\n0523 Yes\n523 Yes\n23 Yes\n3 Yes\nAll Prime!","explanation":"","label":"1"},{"input":"20191231","output":"20191231 Yes\n0191231 Yes\n191231 Yes\n91231 No\n1231 Yes\n231 No\n31 Yes\n1 No","explanation":"","label":"2"}],"sampleInput":"20190523","sampleOutput":"20190523 Yes\n0190523 Yes\n190523 Yes\n90523 Yes\n0523 Yes\n523 Yes\n23 Yes\n3 Yes\nAll Prime!","idea":["2019年5月23日是个“全素日”,即不仅20190523本身是个素数,它的任何以末尾数字3结尾的子串都是素数。本题就请你写个程序判断一个给定日期是否是“全素日”。输入按照yyyymmdd的格式给出一个日期。题目保证日期在0001年1月1日到9999年12月31日之间。","从原始日期开始,按照子串长度递减的顺序,每行首先输出一个子串和一个空格,然后输出Yes,如果该子串对应的数字是一个素数,否则输出No。如果这个日期是一个全素日,则在最后一行输出All Prime!。使用num储存合数的个数,如果最后num为0,则表示要输出”All Prime!”。使用string s存储输入的数字。","可以使用while循环,每次查询当前数值是不是素数,然后使用erase()函数删除第一个数字,如此循环到s长度为0。可以直接使用函数stoi(),将string转化成int类型。每次我们判断当前的数是不是素数,并直接输出。"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003ccmath>\n\n// 解题关键：2019年5月23日是个“全素日”,即不仅20190523本身是个素数,它的任何以末尾数字3结尾的子串都是素数\nusing namespace std;\nint num;\nstring s;\nint is_prime(int x) {\n   if (x \u003c 2) return 0;\n   for (int i = 2; i \u003c= sqrt(x); i++)\n      if (x % i == 0) return 0;\n   return 1;\n\n}\nint main(){\n   cin >> s;\n   num = s.size();\n   while (s.size()) {\n      cout \u003c\u003c s \u003c\u003c ' ' \u003c\u003c (is_prime(stoi(s)) ? \"Yes\" : \"No\") \u003c\u003c '\\n';\n      if (is_prime(stoi(s))) --num;\n      s.erase(s.begin());\n   }\n\n   if (num == 0) cout \u003c\u003c \"All Prime!\";\n   return 0;\n}"},{"id":"1169","title":"The Judger","score":25,"category":"逻辑题","description":["A game of numbers has the following rules: at the beginning, two distinct positive integers are given by the judge. Then each player in turn must give a number to the judge. The number must be the difference of two numbers that are previously given, and must not be duplicated to any of the existed","numbers. The game will run for several rounds. The one who gives a duplicate number or even a wrong number will be kicked out.Your job is to write a judger program to judge the players’ numbers and to determine the final winners."],"input":"Each input file contains one test case. For each case, the first line gives two distinct positive integers to begin with. Both numbers are in [1,105].In the second line, two numbers are given: N (2≤N≤10), the number of players, and M (2≤M≤10^3), the number of rounds.\n\nThen N lines follow, each contains M positive integers. The i-th line corresponds to the i-th player(i=1,...,N). The game is to start from the 1st player giving his/her 1st number, followed by everybody else giving their 1st numbers in the 1st round; then everyone give their 2nd numbers in the 2nd\n\nround, and so on so forth.","output":"If the i-th player is kicked out in the k-th round, print in a line Round #k: i is out.. The rest of the numbers given by the one who is out of the game will be ignored. If more than one player is out in the same round, print them in increasing order of their indices. When the game is over, print in the\n\nlast line Winner(s): W1 W2... Wn, where W1... Wn are the indices of the winners in increasing order.All the numbers in a line must be separated by exactly one space, and there must be no extra space at the beginning or the end of the line. If there is no winner, print No winner. instead.","samples":[{"input":"101 42\n4 5\n59 34 67 9 7\n17 9 8 50 7\n25 92 43 26 37\n76 51 1 41 40","output":"Round #4: 1 is out.\nRound #5: 3 is out.\nWinner(s): 2 4","explanation":"","label":"1"},{"input":"42 101\n4 5\n59 34 67 9 7\n17 9 18 50 49\n25 92 58 1 39\n102 32 2 6 41","output":"Round #1: 4 is out.\nRound #3: 2 is out.\nRound #4: 1 is out.\nRound #5: 3 is out.\nNo winner.","explanation":"","label":"2"}],"sampleInput":"101 42\n4 5\n59 34 67 9 7\n17 9 8 50 7\n25 92 43 26 37\n76 51 1 41 40","sampleOutput":"Round #4: 1 is out.\nRound #5: 3 is out.\nWinner(s): 2 4","idea":["有一种数字游戏的规则如下:首先由裁判给定两个不同的正整数,然后参加游戏的几个人轮流给出正整数。要求给出的数字必须是前面已经出现的某两个正整数之差,且不能等于之前的任何一个数。游戏一直持续若干轮,中间有写重复或写错的人就出局。本题要求你实现这个游戏的裁判机,自动判断每位游戏者给出的数字是否合法,以及最后的赢家。","使用二维数组A存储每一轮每一个玩家出的数,使用flag2标记是否有人获胜,mark数组中标记某个数是否出现过,out[i]表示第i个人已经出局,used数组中存储已经出现过的数。题目要求是给出的数字必须是前面已经出现的某两个正整数之差,可以转换为现在这个人出的数字,加上已经出过的某个数,看是不是等于另一个已经出过的数字。对于每一轮我们遍历所有人,如果这个人已经出局,则跳过。","如果这个数加所有出现过数字,不等于另外一个已经出现过的数字,或者这个数已经出现过了,那么这个人淘汰,否则mark记录一下这个数字已经被使用过,并且添加到已经使用过的数组used中。最 后遍历输出赢家,如果没有赢家就输出”No winner.”。"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：有一种数字游戏的规则如下:首先由裁判给定两个不同的正整数,然后参加游戏的几个人轮流给出正整数\n\n#include \u003cvector>\nusing namespace std;\nint N, M, flag2, A[11][1001], mark[200005], out[11];\nvector\u003cint> used(2);\nint main(){\n   cin >> used[0] >> used[1];\n   mark[used[0]] = mark[used[1]] = 1;\n   cin >> N >> M;\n   for (int i = 1; i \u003c= N; i++)\n   for (int j = 1; j \u003c= M; j++) cin >> A[i][j];\n\n   for (int i = 1; i \u003c= M; i++)\n      for (int j = 1; j \u003c= N; j++) {\n         if (out[j]) continue;\n         int flag = 0;\n         if (mark[A[j][i]]) flag = -1;\n         for (auto it : used) {\n             if (mark[it + A[j][i]] == 1) {\n                mark[A[j][i]] = 1;\n                flag++;\n\n                used.push_back(A[j][i]);\n                break;\n             }\n         }\n         if (flag \u003c= 0) {\n             out[j] = 1;\n             cout \u003c\u003c \"Round #\" \u003c\u003c i \u003c\u003c \": \" \u003c\u003c j \u003c\u003c \" is out.\\n\";\n         }\n      }\n   for (int i = 1; i \u003c= N; i++) {\n\n      if (!out[i]) {\n         if(!flag2) {\n             cout \u003c\u003c \"Winner(s):\";\n             flag2 = 1;\n         }\n         cout \u003c\u003c \" \" \u003c\u003c i;\n      }\n   }\n   if (!flag2) cout \u003c\u003c \"No winner.\";\n   return 0;\n\n}"},{"id":"1170","title":"Safari Park","score":25,"category":"map映射","description":["A safari park(野生动物园)has K species of animals, and is divided into N regions. The managers hope to spread the animals to all the regions, but not the same animals in the two neighboring regions. Of course, they also realize that this is an NP complete problem, you are not expected to","solve it. Instead, they have designed several distribution plans. Your job is to write a program to help them tell if a plan is feasible."],"input":"Each input file contains one test case. For each case, the first line gives 3 integers: N (0\u003cN≤500), the number of regions; R (≥0), the number of neighboring relations, and K (0\u003cK≤N), the number of species of animals. The regions and the species are both indexed from 1 to N.\n\nThen R lines follow, each gives the indices of a pair of neighboring regions, separated by a space.Finally there is a positive M (≤20) followed by M lines of distribution plans. Each plan gives N indices of species in a line (the i-th index is the animal in the i-th rigion), separated by spaces. It is guaranteed\n\nthat any pair of neighboring regions must be different, and there is no duplicated neighboring relations.","output":"For each plan, print in a line Yes if no animals in the two neighboring regions are the same,or No otherwise. However, if the number of species given in a plan is not K, you must print Error: Too many species. or Error: Too few species. according to the case.","samples":[{"input":"6 8 3\n2 1\n1 3\n4 6\n2 5\n2 4\n5 4\n5 6\n3 6\n5\n1 2 3 3 1 2\n1 2 3 4 5 6\n4 5 6 6 4 5\n2 3 4 2 3 4\n2 2 2 2 2 2","output":"Yes\nError: Too many species.\nYes\nNo\nError: Too few species.","explanation":"","label":""}],"sampleInput":"6 8 3\n2 1\n1 3\n4 6\n2 5\n2 4\n5 4\n5 6\n3 6\n5\n1 2 3 3 1 2\n1 2 3 4 5 6\n4 5 6 6 4 5\n2 3 4 2 3 4\n2 2 2 2 2 2","sampleOutput":"Yes\nError: Too many species.\nYes\nNo\nError: Too few species.","idea":["野生动物园有K种动物,分为N个区域。管理人员希望将动物传播到所有区域,但同一种动物不在两个相邻区域。当然,他们也意识到这是一个NP完全问题,不指望你去解决它。相反,他们设计了几个分配方案。你的工作是写一个程序,帮助他们判断一个计划是否可行。flag标记当前方案是否可行,邻接矩阵E存储连接的区域。使用map\u003cint,vector\u003cint>> A保存对应种类的动物生活在哪个区域。","判断A的大小就可以知道有多少种类的动物,和K做比较就可以知道动物数量有没有太多或者太少。遍历所有同种动物,通过邻接矩阵看它们生存的区域之间有没有相邻的。"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n#include \u003cvector>\n\n// 解题关键：野生动物园有K种动物,分为N个区域\nusing namespace std;\nint N, R, K, M, flag, E[505][505];\n\nint main() {\n   cin >> N >> R >> K;\n   for (int i = 1, u, v; i \u003c= R; i++) {\n      cin >> u >> v;\n      E[u][v] = E[v][u] = 1;\n   }\n   for (cin >> M; M; M--) {\n      map\u003cint, vector\u003cint>> A;\n      for (int i = 1, a; i \u003c= N; i++) {\n\n         cin >> a;\n         A[a].push_back(i);\n      }\n      if(A.size() > K) cout \u003c\u003c \"Error: Too many species.\\n\";\n      else if (A.size() \u003c K) cout \u003c\u003c \"Error: Too few species.\\n\";\n      else {\n         flag = 1;\n         for (auto it : A) {\n             for (int i = 0; i \u003c it.second.size(); i++) {\n                for (int j = i + 1; j \u003c it.second.size(); j++) {\n\n                   if(E[it.second[i]][it.second[j]]) {\n                      flag = 0;\n                      break;\n                   }\n                }\n             }\n         }\n         if (flag) cout \u003c\u003c \"Yes\\n\";\n         else cout \u003c\u003c \"No\\n\";\n\n      }\n\n   }\n   return 0;\n}"},{"id":"1171","title":"Replacement Selection","score":30,"category":"优先队列,BFS","description":["When the input is much too large to fit into memory, we have to do external sorting instead of internal sorting. One of the key steps in external sorting is to generate sets of sorted records (also called runs) with limited internal memory. The simplest method is to read as many records as","possible into the memory, and sort them internally, then write the resulting run back to some tape.The size of each run is the same as the capacity of the internal memory.Replacement Selection sorting algorithm was described in 1965 by Donald Knuth. Notice that as soon","as the first record is written to an output tape, the memory it used becomes available for another record. Assume that we are sorting in ascending order, if the next record is not smaller than the record we have just output, then it can be included in the run.","For example, suppose that we have a set of input { 81, 94, 11, 96, 12, 99, 35 }, and our memory can sort 3 records only. By the simplest method we will obtain three runs: { 11, 81, 94 }, { 12, 96, 99 } and { 35 }.According to the replacement selection algorithm, we would read and sort the first 3 records { 81, 94,","11 } and output 11 as the smallest one. Then one space is available so 96 is read in and will join the first run since it is larger than 11. Now we have { 81, 94, 96 }. After 81 is out, 12 comes in but it must belong to the next run since it is smaller than 81. Hence we have { 94, 96, 12 } where 12 will stay since","it belongs to the next run. When 94 is out and 99 is in, since 99 is larger than 94, it must belong to the first run. Eventually we will obtain two runs: the first one contains { 11, 81, 94, 96, 99 } and the second one contains { 12, 35 }.Your job is to implement this replacement selection algorithm."],"input":"Each input file contains several test cases. The first line gives two positive integers N (≤10^5)and M (\u003cN/2), which are the total number of records to be sorted, and the capacity of the internal memory. Then N numbers are given in the next line, all in the range of int. All the numbers in a line\n\nare separated by a space.","output":"For each test case, print in each line a run (in ascending order) generated by the replacement selection algorithm. All the numbers in a line must be separated by exactly 1 space, and there must be no extra space at the beginning or the end of the line.","samples":[{"input":"13 3\n81 94 11 96 12 99 17 35 28 58 41 75 15","output":"11 81 94 96 99\n12 17 28 35 41 58 75\n15","explanation":"","label":""}],"sampleInput":"13 3\n81 94 11 96 12 99 17 35 28 58 41 75 15","sampleOutput":"11 81 94 96 99\n12 17 28 35 41 58 75\n15","idea":["当输入数据远远超过内存容量,我们不得不进行外部排序而不是内部排序。外部排序的关键步骤之一是生成一组有限内存的已排序记录(也称为运行集)。最简单的方法是将尽可能多的记录读入内存,对其进行内部排序,然后将生成的运行集写回到某个磁带。每个运行的大小与内部内存的容量相同。替代选择排序算法由Donald Knuth于1965年描述。","请注意,一旦第一条记录写入输出磁带,它所使用的内存就会为另一条记录释放出来。假设我们按升序排序,如果下一条记录不比刚刚输出的记录小,那么它可以包含在运行集中。例如,假设我们有一个输入集合{81,94,11,96,12,99,35},而我们的内 存只能排序3条记录。按照最简单的方法,我们将获得三个运行集:{11,81,94},{12,96,99}和{35}。","根据替代选择算法,我们将读取和排序前3条记录{81,94,11} 并输出11作为最小值。然后会有一个空间可用,所以读入96,它会加入第一个运行集,因为它大于11。现在我们有{81,94,96}。81出去后,12进来,但它必须属于下一个运行集,因为它小于81。因此,我们有{94,96,12},其中12将留在下一个运行集。","当94出去,99进来,因为99大于94,它必须属于第一个运行集。最终我们将获得两个运行集:第一个包含 {11,81,94,96,99},第二个包含{12,35}。您的任务是实现这个替代选择排序算法。A存储输入的数据,创建两个小数先出来的优先队列Q1和Q2,分别表示这一轮正在排序的数列,和下一轮进行排序的数列。","index表示当前正在处理的数据的下标,now表示从优先队列里取出来的当前处理的序列段里最小的数。先把M个以内的数据存到Q1里,每次从Q1里取出一个最小的数,并将它输出。看一下下一个要读入的数据(如果有的话)和现在这个最小的数之间的关系。大于等于now,存在Q1里小于现在的now,就把它存到Q2里。","如果Q1中的数据全部处理完毕了,就把Q2中的内容交换到Q1里,这样Q1就是下一个要处理的序列段,Q2变成空,可以装新数据。"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cqueue>\n\n// 解题关键：当输入数据远远超过内存容量,我们不得不进行外部排序而不是内部排序\n\nusing namespace std;\nint N, M, A[100005], position, now;\npriority_queue\u003cint, vector\u003cint>, greater\u003cint>> Q1, Q2;\nint main(){\n   cin >> N >> M;\n   for (int i = 1; i \u003c= N; i++) {\n      cin >> A[i];\n      if (i \u003c= M) Q1.push(A[i]);\n   }\n\n   position = M + 1;\n   while (Q1.size()) {\n      now = Q1.top();\n      cout \u003c\u003c now;\n      Q1.pop();\n      if(position \u003c= N) {\n         if (A[position] \u003c now) Q2.push(A[position]);\n         else Q1.push(A[position]);\n         ++position;\n      }\n\n      if (Q1.size()) cout \u003c\u003c ' ';\n      else {\n         swap(Q1, Q2);\n         cout \u003c\u003c '\\n';\n      }\n   }\n   return 0;\n}"},{"id":"1172","title":"Panda and PP Milk","score":20,"category":"逻辑题","description":["PP milk (盆盆奶)is Pandas’ favorite. They would line up to enjoy it as show in the picture. On the other hand, they could drink in peace only if they believe that the amount of PP milk is fairly distributed, that is, fatter panda can have more milk, and the ones with equal weight may have the","same amount. Since they are lined up, each panda can only compare with its neighbor(s), and if it thinks this is unfair, the panda would fight with its neighbor.Given that the minimum amount of milk a panda must drink is 200 ml. It is only when another bowl of milk is at least 100 ml more than its own that a panda can sense the difference.","Now given the weights of a line of pandas, your job is to help the breeder(饲养员)to decide the minimum total amount of milk that he/she must prepare, provided that the pandas are lined up in the given order."],"input":"Each input file contains one test case. For each case, first a positive integer n (≤10^4) is given as the number of pandas. Then in the next line, n positive integers are given as the weights (in kg) of the pandas, each no more than 200. the numbers are separated by spaces.","output":"For each test case, print in a line the minimum total amount of milk that the breeder must prepare, to make sure that all the pandas can drink in peace.","samples":[{"input":"10\n180 160 100 150 145 142 138 138 138 140","output":"3000\nHint:\nThe distribution of milk is the following:\n400 300 200 500 400 300 200 200 200 300","explanation":"","label":""}],"sampleInput":"10\n180 160 100 150 145 142 138 138 138 140","sampleOutput":"3000\nHint:\nThe distribution of milk is the following:\n400 300 200 500 400 300 200 200 200 300","idea":["大熊猫,俗称“胖达”,会排队吃盆盆奶。它们能和谐吃奶的前提,是它们认为盆盆奶的分配是“公平”的,即:更胖的胖达能吃到更多的奶,等胖的胖达得吃到一样多的奶。另一方面,因为它们是排好队的,所以每只胖达只能看到身边胖达的奶有多少,如果觉得不公平就会抢旁边小伙伴的奶吃。","已知一只胖达每次最少要吃 200 毫升的奶,当另一份盆盆奶多出至少 100 毫升的时候,它们才能感觉到是“更多”了,否则没感觉。现在给定一排胖达的体重,请你帮饲养员计算一下,在保持给定队形的前提下,至少应该准备多少毫升的盆盆奶。","使用数组A记录每个熊猫的体重,L[i]表示第i个数的右边有几个连续下降的数(过程中可以有相等的数字,但是只记录不重复的数字的数量),R[i]则表示第i个数左边有几个连续下降的数(也是可以相等但是不记录)。从左到右遍历每一个i,然后看一下它右边有多少个连续下降的数。从右到左同理,看一下i的左边有多少个连续下降的数。","对于每一只熊猫,取L[i]和R[i]中较大的那个数*100+200,就是这只熊猫应该喝的牛奶的毫升数。最后计算他们的总和就可以啦。"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：大熊猫,俗称“胖达”,会排队吃盆盆奶\n\nusing namespace std;\nint n, ans, A[10005], L[10005], R[10005];\nint main(){\n   cin >> n;\n   for (int i = 1; i \u003c= n; i++) cin >> A[i];\n\n   for (int i = 1; i \u003c n; i++) {\n      int j = i;\n      while(j + 1 \u003c= n && A[j] >= A[j + 1]) {\n         if (A[j] > A[j + 1]) ++L[i];\n         ++j;\n      }\n   }\n   for (int i = n; i > 1; i--) {\n      int j = i;\n      while(j - 1 >= 1 && A[j] >= A[j - 1]) {\n\n         if (A[j] > A[j - 1]) ++R[i];\n         --j;\n      }\n   }\n   for (int i = 1; i \u003c= n; i++) ans += max(L[i], R[i]) * 100 + 200;\n   cout \u003c\u003c ans;\n   return 0;\n}"},{"id":"1173","title":"How Many Ways to Buy a Piece of Land","score":25,"category":"前缀和","description":["The land is for sale in CyberCity, and is divided into several pieces. Here it is assumed that each piece of land has exactly two neighboring pieces, except the first and the last that have only one. One can buy several contiguous(连续的) pieces at a time. Now given the list of prices of the land pieces,","your job is to tell a customer in how many different ways that he/she can buy with a certain amount of money."],"input":"Each input file contains one test case. Each case first gives in a line two positive integers: N (≤10^4),the number of pieces of the land (hence the land pieces are numbered from 1 to N in order),and M (≤10^9), the amount of money that your customer has.Then in the next line, N positive integers are given, where the i-th one is the price of the i-th piece of\n\nthe land.It is guaranteed that the total price of the land is no more than 10^9.","output":"For each test case, print the number of different ways that your customer can buy. Notice that the pieces must be contiguous.","samples":[{"input":"5 85\n38 42 15 24 9","output":"11\nHint:\nThe 11 different ways are:\n38\n42\n15\n24\n9\n38 42\n42 15\n42 15 24\n15 24\n15 24 9\n24 9","explanation":"","label":""}],"sampleInput":"5 85\n38 42 15 24 9","sampleOutput":"11\nHint:\nThe 11 different ways are:\n38\n42\n15\n24\n9\n38 42\n42 15\n42 15 24\n15 24\n15 24 9\n24 9","idea":["数码城市有土地出售。待售的土地被划分成若干块,每一块标有一个价格。这里假设每块土地只有两块相邻的土地,除了开头和结尾的两块是只有一块邻居的。每位客户可以购买多块连续相邻的土地。现给定这一系列土地的标价,请你编写程序,根据客户手头的现金量,告诉客户有多少种不同的购买方案。使用pre数组保存土地价格前缀和,pre[i]表示从第一个土地到第i个土地的总价。","在计算从第j个房子到第i个土地的总价的时候,只需要计算pre[i]-pre[j-1]即可。两个for循环,枚举所有i与j的值,然后计算出可以购买的方案数量即可。喵喵喵~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：数码城市有土地出售\nusing namespace std;\nint N, M, ans, a, pre[10005];\nint main(){\n\n   cin >> N >> M;\n   for (int i = 1; i \u003c= N; i++) {\n      cin >> a;\n      pre[i] = pre[i - 1] + a;\n   }\n   for (int i = 1; i \u003c= N; i++) {\n      for (int j = i; j \u003c= N; j++) {\n         if (pre[j] - pre[i - 1] \u003c= M) ++ans;\n         else break;\n      }\n\n   }\n   cout \u003c\u003c ans;\n   return 0;\n}"},{"id":"1174","title":"Left-View of Binary Tree","score":25,"category":"树的遍历","description":["The left-view of a binary tree is a list of nodes obtained by looking at the tree from left hand side and from top down. For example, given a tree shown by the figure, its left-view is { 1, 2, 3, 4, 5 }Given the inorder and preorder traversal sequences of a binary tree, you are supposed to output its","left-view."],"input":"Each input file contains one test case. For each case, the first line contains a positive integer N (≤20),which is the total number of nodes in the tree. Then given in the following 2 lines are the inorder and preorder traversal sequences of the tree, respectively. All the keys in the tree are distinct positive\n\nintegers in the range of int.","output":"For each case, print in a line the left-view of the tree. All the numbers in a line are separated by exactly 1 space, and there must be no extra space at the beginning or the end of the line.","samples":[{"input":"8\n2 3 1 5 4 7 8 6\n1 2 3 6 7 4 5 8","output":"1 2 3 4 5","explanation":"","label":""}],"sampleInput":"8\n2 3 1 5 4 7 8 6\n1 2 3 6 7 4 5 8","sampleOutput":"1 2 3 4 5","idea":["二叉树的左视图是通过从左侧向右上方查看树而获得的结点列表。例如,给定如图所示的树,其左视图为{1,2,3,4,5}。给定二叉树的中序遍历和前序遍历序列,输出其左视图。","pre与in数组分别存储前序和中序遍历的结果,t存储某一层最左边的结点值,ins、ine分别表示当前操作在中序遍历数组中的起始位置与终止位置,prerootindex表示当前的子树根结点在前缀序列中的位置,level表示现在处于第几层,pos表示当前子树根结点在中序遍历数组中的位置。用前序和中序遍历的序列可以唯一确定一棵树。","由于是从左到右的顺序遍历树的,所以每次判断当前层的t数组中没有元素(值为0)的时候,就表示这一层最左边的结点是现在这一个。"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：二叉树的左视图是通过从左侧向右上方查看树而获得的结点列表\n\nusing namespace std;\nint N, pre[30], in[30], t[30];\nvoid deal(int ins, int ine, int prerootindex, int level) {\n   if (ins > ine) return;\n   if (t[level] == 0) {\n      t[level] = pre[prerootindex];\n   }\n   int pos = ins;\n   while(in[pos] != pre[prerootindex]) ++pos;\n\n   deal(ins, pos - 1, prerootindex + 1, level + 1);\n   deal(pos + 1, ine, prerootindex + 1 + pos - ins, level + 1);\n}\nint main(){\n   cin >> N;\n   for (int i = 1; i \u003c= N; i++) cin >> in[i];\n   for (int i = 1; i \u003c= N; i++) cin >> pre[i];\n   deal(1, N, 1, 1);\n   for (int i = 1; t[i]; i++) {\n      if (i != 1) cout \u003c\u003c ' ';\n\n      cout \u003c\u003c t[i];\n   }\n   return 0;\n}"},{"id":"1175","title":"Professional Ability Test","score":30,"category":"Dijkstra算法,最短路径","description":["Professional Ability Test (PAT) consists of several series of subject tests. Each test is divided into several levels. Level A is a prerequisite (前置要求) of Level B if one must pass Level A with a score no less than S in order to be qualified to take Level B. At the mean time, one who passes Level A with a","score no less than S will receive a voucher(代金券)of D yuans (Chinese dollar) for taking Level B.At the moment, this PAT is only in design and hence people would make up different plans. A plan is NOT consistent if there exists some test T so that T is a prerequisite of itself. Your job is to test each","plan and tell if it is a consistent one, and at the mean time, find the easiest way (with minimum total S) to obtain the certificate of any subject test. If the easiest way is not unique, find the one that one can win the maximum total value of vouchers."],"input":"Each input file contains one test case. For each case, the first line gives two positive integers N (≤1000)and M, being the total numbers of tests and prerequisite relations, respectively. Then M lines follow,each describes a prerequisite relation in the following format:\n\nT1 T2 S D where T1 and T2 are the indices (from 0 to N−1) of the two distinct tests; S is the minimum score (in the range (0, 100]) required to pass T1 in order to be qualified to take T2; and D is the value of the voucher (in the range (0, 500]) one can receive if one passes T1 with a score no less than S and plan to\n\ntake T2. It is guaranteed that at most one pair of S and D are defined for a prerequisite relation.Then another positive integer K (≤N) is given, followed by K queries of tests. All the numbers in a line are separated by spaces.","output":"Print in the first line Okay. if the whole plan is consistent, or Impossible. if not.If the plan is consistent, for each query of test T, print in a line the easiest way to obtain the certificate of this test, in the format:T0->T1->...->T However, if T is the first level of some subject test (with no prerequisite), print You may take test T\n\ndirectly. instead.If the plan is impossible, for each query of test T, check if one can take it directly or not. If the answer is yes, print in a line You may take test T directly.; or print Error. instead.","samples":[{"input":"8 15\n0 1 50 50\n1 2 20 20\n3 4 90 90\n3 7 90 80\n4 5 20 20\n7 5 10 10\n5 6 10 10\n0 4 80 60\n3 1 50 45\n1 4 30 20\n1 5 50 20\n2 4 10 10\n7 2 10 30\n2 5 30 20\n2 6 40 60\n8\n0 1 2 3 4 5 6 7","output":"Okay.\nYou may take test 0 directly.\n0->1\n0->1->2\nYou may take test 3 directly.\n0->1->2->4\n0->1->2->4->5\n0->1->2->6\n3->7","explanation":"","label":"1"},{"input":"4 5\n0 1 1 10\n1 2 2 10\n3 0 4 10\n3 2 5 10\n2 0 3 10\n2\n3 1","output":"Impossible.\nYou may take test 3 directly.\nError.","explanation":"","label":"2"}],"sampleInput":"8 15\n0 1 50 50\n1 2 20 20\n3 4 90 90\n3 7 90 80\n4 5 20 20\n7 5 10 10\n5 6 10 10\n0 4 80 60\n3 1 50 45\n1 4 30 20\n1 5 50 20\n2 4 10 10\n7 2 10 30\n2 5 30 20\n2 6 40 60\n8\n0 1 2 3 4 5 6 7","sampleOutput":"Okay.\nYou may take test 0 directly.\n0->1\n0->1->2\nYou may take test 3 directly.\n0->1->2->4\n0->1->2->4->5\n0->1->2->6\n3->7","idea":["PAT由一系列学科测试组成。每个测试被划分为几个级别。如果要资格参加 Level B,那么必须以不低于 S 的分数通过 Level A,Level A 就成为 Level B 的前置要求。同时,以不低于 S 的分数通过 Level A 的人将获得一张代金券,用于参加 Level B。目前,这个PAT仅处于设计阶段,因此人们可以制定不同的计划。","如果存在某个测试 T,使得 T 是其自身的前提条件,那么该计划就不一致。您的任务是测试每个计划,并判断它是否一致,并同时找出获得任何学科测试证书的最简单方法(具有最小 总分S)。如果最简单的方法不唯一,找出一个可以获得最大代金券总额的方法。node结构用来存储最短路中的结点信息,其中重载了小于号(\u003c)的运算规则,让优先队列能以题目要求的顺序排列。","bian是用来存储边信息的结构体。E是存储边信息的邻接表,Dis中存储最短路的距离,存的是从源点到第i个点所要考的最少分数和可以获得的最多的代金券。f用来标记是否有环,为1时表示有环,对应题目中说明的,某个课程是自己的前置课程。in和in2都用来存储每个结点的入度,Last数组存储最短路中每个结点的前一个结点是什么。首先,我们可以用构造拓扑排序的方法判断一下图中是否存在环。","可以使用bfs,将当前入度为0的结点存在队列里,取出后将其所有能到达的结点的入度减1,最后看一下能让入度为0的结点有多少,每次把他们存在S中,最后看S的大小和N之间的关系,如果全部都能拿到,则说明无环。先建立一个初始点,这里用1002当初始点,然后把入度为0的结点和这个初始点连接上。","这样只要使用1002当作起点,然后用Dijkstra计算最短的路径,和对应的每个结点上一步的结点是什么。"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cqueue>\n\n// 解题关键：PAT由一系列学科测试组成\nusing namespace std;\nstruct node {\n   int v, score, voucher;\n   bool operator \u003c (const node &x) const {\n      if(score != x.score) return score > x.score;\n\n      else return voucher \u003c x.voucher;\n   }\n};\nstruct bian {\n\n   int next, S, D;\n};\nvector\u003cbian> E[1005];\nvector\u003cpair\u003cint,int>> Dis(1005, {2e9, -1});\nint N, M, T1, T2, S, D, f, T, in[1005], in2[1005], Last[1005];\n\nqueue\u003cint> DAG;\nint huan() {\n   vector\u003cint> S;\n   while(DAG.size()) {\n      int now = DAG.front();\n      DAG.pop();\n      S.push_back(now);\n      for(auto it : E[now]) {\n         in2[it.next]--;\n         if(!in2[it.next]) DAG.push(it.next);\n\n      }\n   }\n   return S.size() == N;\n}\nvoid dijkstra() {\n   vector\u003cint> vis(1005);\n   priority_queue\u003cnode> Q;\n   Q.push({1002, 0, 0});\n   Dis[1002].first = Dis[1002].second = 0;\n\n   while(Q.size()) {\n      node now = Q.top();\n      Q.pop();\n      if(vis[now.v]) continue;\n      vis[now.v] = 1;\n      Dis[now.v].first = now.score;\n      Dis[now.v].second = now.voucher;\n      for (auto it : E[now.v]) {\n         if(vis[it.next]) continue;\n         if((Dis[it.next].first > Dis[now.v].first + it.S) ||\n\n((Dis[it.next].first == Dis[now.v].first + it.S) && (Dis[it.next].second \u003c\nDis[now.v].second + it.D))) {\n             Dis[it.next].first = Dis[now.v].first + it.S;\n             Dis[it.next].second = Dis[now.v].second + it.D;\n             Last[it.next] = now.v;\n             Q.push({it.next, Dis[it.next].first, Dis[it.next].second});\n         }\n      }\n   }\n\n   return;\n}\n\nint main() {\n   cin >> N >> M;\n   for (int i = 0; i \u003c M; i++) {\n\n      cin >> T1 >> T2 >> S >> D;\n      E[T1].push_back({T2, S, D});\n      in[T2]++, in2[T2]++;\n   }\n   for (int i = 0; i \u003c N; i++) {\n\n      if (in[i] == 0) {\n         E[1002].push_back({i, 0, 0});\n         DAG.push(i);\n      }\n   }\n   f = huan();\n   dijkstra();\n   cin >> T;\n   if(f) cout \u003c\u003c \"Okay.\\n\";\n   else cout \u003c\u003c \"Impossible.\\n\";\n\n   for (int i = 1, q; i \u003c= T; i++) {\n      cin >> q;\n      if(!in[q]) cout \u003c\u003c \"You may take test \" \u003c\u003c q \u003c\u003c \" directly.\\n\";\n      else if(!f) cout \u003c\u003c \"Error.\\n\";\n      else {\n         vector\u003cint> path;\n         int now = q;\n         while(q != 1002) {\n             path.push_back(q);\n\n             q = Last[q];\n         }\n         for (int j = path.size() - 1; j >= 0; j--) {\n             cout \u003c\u003c path[j];\n             if(j) cout \u003c\u003c \"->\";\n         }\n         cout \u003c\u003c '\\n';\n      }\n   }\n   return 0;\n\n}"}],"total":179,"config":{"pageTitle":"PAT (Advanced Level) Practice","workbenchTitle":"进阶题库工作台","sourceLabel":"PAT 甲级题库","documentSuffix":"PAT 甲级题库","storagePrefix":"ruiqy.pat-advanced","answerPrefix":"ruiqy-pat-advanced-answer-"}}
  var problems = library.problems
  var config = library.config
  var COMPLETED_KEY = config.storagePrefix + '.completed.v1'
  var PAT_THEME_KEY = 'ruiqy.daily.doki-theme.v1'
  var PAT_STICKER_POSITION_KEY = config.storagePrefix + '.sticker-position.v1'
  var PAT_THEMES = {
    'emilia-light': { tone: 'light', sticker: '/daily/doki/emilia_light.png' },
    'beatrice': { tone: 'light', sticker: '/daily/doki/beatrice.png' },
    'echidna': { tone: 'dark', sticker: '/daily/doki/echidna_dark.png' },
    'inori-light': { tone: 'light', sticker: '/daily/doki/inori_light.png' },
    'nao-light': { tone: 'light', sticker: '/daily/doki/nao_light.png' }
  }
  var completedProblems = loadCompletedProblems()
  var currentIndex = Math.max(0, problems.findIndex(function (problem) {
    return problem.id === window.location.hash.slice(1)
  }))
  var editor = document.querySelector('[data-pat-editor]')
  var lineNumbers = document.querySelector('[data-line-numbers]')
  var problemList = document.querySelector('[data-problem-list]')
  var copyButton = document.querySelector('[data-copy-code]')
  var previousButton = document.querySelector('[data-previous-problem]')
  var nextButton = document.querySelector('[data-next-problem]')
  var completeButton = document.querySelector('[data-toggle-complete]')
  var completedCount = document.querySelector('[data-completed-count]')
  var patThemePicker = document.querySelector('[data-pat-theme-picker]')
  var patThemeToggle = document.querySelector('[data-pat-theme-toggle]')
  var patThemeMenu = document.querySelector('[data-pat-theme-menu]')
  var patTools = document.querySelector('[data-pat-tools]')
  var patSticker = document.querySelector('[data-pat-sticker]')

  function escapeHtml (value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
  }

  function storageKey (problem) {
    return config.answerPrefix + problem.id
  }

  function storedPatTheme () {
    try {
      var saved = window.localStorage.getItem(PAT_THEME_KEY)
      return PAT_THEMES[saved] ? saved : 'emilia-light'
    } catch (error) {
      return 'emilia-light'
    }
  }

  function applyPatTheme (themeId, persist) {
    var id = PAT_THEMES[themeId] ? themeId : 'emilia-light'
    var theme = PAT_THEMES[id]
    document.documentElement.setAttribute('data-pat-theme', id)
    document.body.setAttribute('data-pat-theme', id)
    document.body.setAttribute('data-pat-tone', theme.tone)
    if (patSticker) patSticker.src = theme.sticker
    document.querySelectorAll('[data-pat-theme-option]').forEach(function (button) {
      var active = button.getAttribute('data-pat-theme-option') === id
      button.classList.toggle('is-active', active)
      button.setAttribute('aria-checked', active ? 'true' : 'false')
    })
    if (persist) {
      try { window.localStorage.setItem(PAT_THEME_KEY, id) } catch (error) {}
    }
  }

  function setPatThemeMenu (open) {
    if (!patThemeMenu || !patThemeToggle) return
    patThemeMenu.hidden = !open
    patThemeToggle.classList.toggle('is-open', open)
    patThemeToggle.setAttribute('aria-expanded', open ? 'true' : 'false')
  }

  function makeStickerDraggable (element, handle, storageName) {
    if (!element || !handle) return
    var dragging = false
    var startX = 0
    var startY = 0
    var originLeft = 0
    var originTop = 0

    function clampPosition (left, top) {
      var rect = element.getBoundingClientRect()
      return {
        left: Math.min(Math.max(8, left), Math.max(8, window.innerWidth - rect.width - 8)),
        top: Math.min(Math.max(8, top), Math.max(8, window.innerHeight - rect.height - 8))
      }
    }

    function place (left, top) {
      var position = clampPosition(left, top)
      element.style.left = position.left + 'px'
      element.style.top = position.top + 'px'
      element.style.right = 'auto'
      element.style.bottom = 'auto'
      return position
    }

    function restorePosition () {
      try {
        var saved = JSON.parse(window.localStorage.getItem(storageName) || 'null')
        if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.top)) place(saved.left, saved.top)
      } catch (error) {}
    }

    handle.addEventListener('pointerdown', function (event) {
      if (event.button !== 0) return
      var rect = element.getBoundingClientRect()
      dragging = true
      startX = event.clientX
      startY = event.clientY
      originLeft = rect.left
      originTop = rect.top
      element.classList.add('is-dragging')
      handle.setPointerCapture(event.pointerId)
      event.preventDefault()
    })

    handle.addEventListener('pointermove', function (event) {
      if (!dragging) return
      place(originLeft + event.clientX - startX, originTop + event.clientY - startY)
    })

    function finishDrag (event) {
      if (!dragging) return
      dragging = false
      element.classList.remove('is-dragging')
      if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId)
      var rect = element.getBoundingClientRect()
      var position = place(rect.left, rect.top)
      try { window.localStorage.setItem(storageName, JSON.stringify(position)) } catch (error) {}
    }

    handle.addEventListener('pointerup', finishDrag)
    handle.addEventListener('pointercancel', finishDrag)
    window.addEventListener('resize', function () {
      var rect = element.getBoundingClientRect()
      if (element.style.left) place(rect.left, rect.top)
    })
    restorePosition()
  }

  function loadCompletedProblems () {
    try {
      var saved = JSON.parse(window.localStorage.getItem(COMPLETED_KEY) || '[]')
      return Array.isArray(saved) ? saved : []
    } catch (error) {
      return []
    }
  }

  function saveCompletedProblems () {
    try {
      window.localStorage.setItem(COMPLETED_KEY, JSON.stringify(completedProblems))
    } catch (error) {
      // Completion tracking remains available for this visit.
    }
  }

  function isProblemComplete (problemId) {
    return completedProblems.indexOf(problemId) !== -1
  }

  function getSavedCode (problem) {
    try {
      return window.localStorage.getItem(storageKey(problem)) || problem.code
    } catch (error) {
      return problem.code
    }
  }

  function saveCode () {
    var problem = problems[currentIndex]
    try {
      window.localStorage.setItem(storageKey(problem), editor.value)
    } catch (error) {
      // Local persistence is optional; the editor remains usable without it.
    }
  }

  function updateLineNumbers () {
    var count = editor.value.split('\n').length
    var lines = []
    for (var i = 1; i <= count; i += 1) lines.push(i)
    lineNumbers.textContent = lines.join('\n')
    lineNumbers.scrollTop = editor.scrollTop
  }

  function renderProblemList () {
    problemList.innerHTML = ''
    for (var offset = 0; offset < library.total; offset += 1) {
      var problemId = String(1001 + offset)
      var index = problems.findIndex(function (problem) { return problem.id === problemId })
      var problem = index >= 0 ? problems[index] : null
      var button = document.createElement('button')
      button.type = 'button'
      button.className = 'pat-number-button'
      button.setAttribute('data-problem-id', problemId)
      button.textContent = problemId
      if (problem) {
        button.classList.add('is-ready')
        button.title = problemId + ' ' + problem.title
        button.addEventListener('click', (function (problemIndex) {
          return function () { selectProblem(problemIndex) }
        })(index))
      } else {
        button.disabled = true
        button.title = problemId + ' 待整理'
      }
      problemList.appendChild(button)
    }
    syncCompletionState()
  }

  function syncCompletionState () {
    var currentProblem = problems[currentIndex]
    Array.prototype.forEach.call(problemList.querySelectorAll('.pat-number-button'), function (button) {
      var problemId = button.getAttribute('data-problem-id')
      var complete = isProblemComplete(problemId)
      button.classList.toggle('is-complete', complete)
      button.textContent = complete ? '✓' : problemId
      button.setAttribute('aria-label', complete ? problemId + ' 已完成' : problemId)
      button.classList.toggle('is-active', problemId === currentProblem.id)
    })
    completedCount.textContent = String(completedProblems.length)
    var currentComplete = isProblemComplete(currentProblem.id)
    completeButton.classList.toggle('is-complete', currentComplete)
    completeButton.setAttribute('aria-pressed', currentComplete ? 'true' : 'false')
    completeButton.title = currentComplete ? '取消完成标记' : '标记本题完成'
    var activeButton = problemList.querySelector('.pat-number-button.is-active')
    if (activeButton) activeButton.scrollIntoView({ block: 'nearest', inline: 'nearest' })
  }

  function renderStatement (problem) {
    document.querySelector('[data-current-id]').textContent = problem.id
    document.querySelector('[data-current-title]').textContent = problem.id + ' ' + problem.title
    document.querySelector('[data-statement-title]').textContent = problem.id + ' ' + problem.title
    document.querySelector('[data-score]').textContent = '分数 ' + problem.score
    document.querySelector('[data-category]').textContent = problem.category
    document.querySelector('[data-description]').innerHTML = problem.description.map(function (paragraph) {
      return '<p>' + escapeHtml(paragraph) + '</p>'
    }).join('')
    document.querySelector('[data-input]').textContent = problem.input
    document.querySelector('[data-output]').textContent = problem.output
    var samples = problem.samples && problem.samples.length
      ? problem.samples
      : [{ input: problem.sampleInput, output: problem.sampleOutput, explanation: '' }]
    document.querySelector('[data-samples]').innerHTML = samples.map(function (sample, index) {
      var suffix = samples.length > 1 ? ' ' + (sample.label || index + 1) : ''
      var explanation = sample.explanation
        ? '<div class="pat-sample-explanation"><strong>样例说明</strong>\n' + escapeHtml(sample.explanation) + '</div>'
        : ''
      return '<h3>输入样例' + escapeHtml(suffix) + '</h3>' +
        '<div class="pat-sample"><header><span>in</span><span>样例输入</span></header><pre>' + escapeHtml(sample.input) + '</pre></div>' +
        '<h3>输出样例' + escapeHtml(suffix) + '</h3>' +
        '<div class="pat-sample"><header><span>out</span><span>期望输出</span></header><pre>' + escapeHtml(sample.output) + '</pre></div>' +
        explanation
    }).join('')
  }

  function renderAnswer (problem) {
    var ideaTones = ['is-main', 'is-core', 'is-explain']
    document.querySelector('[data-idea]').innerHTML = problem.idea.map(function (item, index) {
      return '<li class="pat-idea-item ' + ideaTones[index % ideaTones.length] + '">' + escapeHtml(item) + '</li>'
    }).join('')
    document.querySelector('[data-key-points]').innerHTML = problem.keyPoints.map(function (item) {
      return '<li>' + escapeHtml(item) + '</li>'
    }).join('')
    document.querySelector('[data-test-input]').textContent = problem.sampleInput
    document.querySelector('[data-test-output]').textContent = problem.sampleOutput
    editor.value = getSavedCode(problem)
    updateLineNumbers()
  }

  function selectProblem (index) {
    if (index < 0 || index >= problems.length) return
    currentIndex = index
    var problem = problems[currentIndex]
    previousButton.disabled = currentIndex === 0
    nextButton.disabled = currentIndex === problems.length - 1
    renderStatement(problem)
    renderAnswer(problem)
    window.history.replaceState(null, '', '#' + problem.id)
    document.title = problem.id + ' ' + problem.title + ' · ' + config.documentSuffix
    syncCompletionState()
    document.querySelector('.pat-problem-panel').scrollTop = 0
    document.querySelector('.pat-answer-panel').scrollTop = 0
  }

  editor.addEventListener('input', function () {
    updateLineNumbers()
    saveCode()
  })
  editor.addEventListener('scroll', function () { lineNumbers.scrollTop = editor.scrollTop })
  editor.addEventListener('keydown', function (event) {
    if (event.key !== 'Tab') return
    event.preventDefault()
    var start = editor.selectionStart
    var end = editor.selectionEnd
    editor.value = editor.value.slice(0, start) + '  ' + editor.value.slice(end)
    editor.selectionStart = editor.selectionEnd = start + 2
    updateLineNumbers()
    saveCode()
  })

  copyButton.addEventListener('click', function () {
    var copied = function () {
      copyButton.textContent = '已复制'
      copyButton.classList.add('is-copied')
      window.setTimeout(function () {
        copyButton.textContent = '复制代码'
        copyButton.classList.remove('is-copied')
      }, 1400)
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(editor.value).then(copied)
      return
    }
    editor.select()
    document.execCommand('copy')
    copied()
  })

  previousButton.addEventListener('click', function () { selectProblem(currentIndex - 1) })
  nextButton.addEventListener('click', function () { selectProblem(currentIndex + 1) })
  completeButton.addEventListener('click', function () {
    var problemId = problems[currentIndex].id
    var completedIndex = completedProblems.indexOf(problemId)
    if (completedIndex === -1) completedProblems.push(problemId)
    else completedProblems.splice(completedIndex, 1)
    saveCompletedProblems()
    syncCompletionState()
  })
  window.addEventListener('hashchange', function () {
    var index = problems.findIndex(function (problem) { return problem.id === window.location.hash.slice(1) })
    if (index >= 0 && index !== currentIndex) selectProblem(index)
  })

  patThemeToggle.addEventListener('click', function (event) {
    event.stopPropagation()
    setPatThemeMenu(patThemeMenu.hidden)
  })
  document.querySelectorAll('[data-pat-theme-option]').forEach(function (button) {
    button.addEventListener('click', function () {
      applyPatTheme(button.getAttribute('data-pat-theme-option'), true)
      setPatThemeMenu(false)
    })
  })
  document.addEventListener('click', function (event) {
    if (patThemePicker && !patThemePicker.contains(event.target)) setPatThemeMenu(false)
  })
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') setPatThemeMenu(false)
  })
  window.addEventListener('storage', function (event) {
    if (event.key === PAT_THEME_KEY) applyPatTheme(event.newValue, false)
  })

  applyPatTheme(storedPatTheme(), false)
  makeStickerDraggable(patTools, patSticker, PAT_STICKER_POSITION_KEY)
  renderProblemList()
  selectProblem(currentIndex)
})()
</script>
