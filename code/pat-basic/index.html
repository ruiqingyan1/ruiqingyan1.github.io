.C\nC...C\nC...C\nC...C\nC...C\n.CCC.\nCCCC.\nC...C\nC...C\nCCCC.\nC....\nC....\nC....\n.CCC.\nC...C\nC...C\nC...C\nC.C.C\nC..CC\n.CCC.\nCCCC.\nC...C\nCCCC.\nCC...\nC.C..\nC..C.\nC...C\n.CCC.\nC...C\nC....\n.CCC.\n....C\nC...C\n.CCC.\nCCCCC\n..C..\n..C..\n..C..\n..C..\n..C..\n..C..\nC...C\nC...C\nC...C\nC...C\nC...C\nC...C\n.CCC.\nC...C\nC...C\nC...C\nC...C\nC...C\n.C.C.\n..C..\nC...C\nC...C\nC...C\nC.C.C\nCC.CC\nC...C\nC...C\nC...C\nC...C\n.C.C.\n..C..\n.C.C.\nC...C\nC...C\nC...C\nC...C\n.C.C.\n..C..\n..C..\n..C..\n..C..\nCCCCC\n....C\n...C.\n..C..\n.C...\nC....\nCCCCC\nHELLO~WORLD!","sampleOutput":"C...C CCCCC C.... C.... .CCC.\nC...C C.... C.... C.... C...C\nC...C C.... C.... C.... C...C\nCCCCC CCCC. C.... C.... C...C\nC...C C.... C.... C.... C...C\nC...C C.... C.... C.... C...C\nC...C CCCCC CCCCC CCCCC .CCC.\nC...C .CCC. CCCC. C.... CCCC.\nC...C C...C C...C C.... C...C\nC...C C...C CCCC. C.... C...C\nC.C.C C...C CC... C.... C...C\nCC.CC C...C C.C.. C.... C...C\nC...C C...C C..C. C.... C...C\nC...C .CCC. C...C CCCCC CCCC.","idea":["三维数组a中储存26个字母对应的图形矩阵,out中储存每行要输出的图形矩阵,同时初始化out所有元素为空格。字符串中可能存在乱七八糟的字符,所以用getline做句子的输入。句子的单词间以任何非大写字母分隔,用while循环遍历找到下标j为非大写字母所在下标,i为当前单词首下标,然后根据单词中每一个字母,将输出图形记录到out中,最后输出out数组~","flag用来标记之前是否输出过一个单词,如果输出过,flag=1,则当再次需要输出单词之前需要先输出一个’\\n’~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：三维数组a中储存26个字母对应的图形矩阵,out中储存每行要输出的图形矩阵,同时初始化out所有元素为空格\nusing namespace std;\nchar a[26][7][5], out[7][100];\nstring s;\nint main() {\n   for (int i = 0; i \u003c 7; i++)\n\n      for (int j = 0; j \u003c 100; j++)\n         out[i][j] = ' ';\n   for (int i = 0; i \u003c 26; i++)\n      for (int j = 0; j \u003c 7; j++)\n         for (int k = 0; k \u003c 5; k++)\n             cin >> a[i][j][k];\n   getchar();\n   getline(cin, s);\n   for (int i = 0, j, flag = 0; i \u003c s.size(); i++) {\n      j = i;\n\n      while (j \u003c s.size() && s[j] >= 'A' && s[j] \u003c= 'Z') j++;\n      if (i == j) continue;\n      for (int k = i; k \u003c j; k++)\n         for (int l = 0; l \u003c 7; l++)\n             for (int m = 0; m \u003c 5; m++)\n                out[l][m + (k - i) * 6] = a[s[k] - 'A'][l][m];\n      if (flag) cout \u003c\u003c '\\n';\n      for (int k = 0; k \u003c 7; k++) {\n         flag = 1;\n\n         for (int l = 0; l \u003c 6 * (j - i) - 1; l++) cout \u003c\u003c out[k][l];\n         cout \u003c\u003c '\\n';\n      }\n      i = j;\n   }\n   return 0;\n}"},{"id":"1110","title":"区块反转","score":25,"category":"链表","description":["给定一个单链表 L,我们将每 K 个结点看成一个区块(链表最后若不足 K 个结点,也看成一个区块),请编写程序将 L 中所有区块的链接反转。例如:给定 L 为 1→2→3→4→5→6→7→8,K 为 3,则输出应该为 7→8→4→5→6→1→2→3。"],"input":"每个输入包含 1 个测试用例。每个测试用例第 1 行给出第 1 个结点的地址、结点总个数正整数 N (≤10^5)、以及正整数 K (≤N),即区块的大小。结点的地址是 5 位非负整数,NULL 地址用 −1 表示。\n\n接下来有 N 行,每行格式为:Address Data Next其中 Address 是结点地址,Data 是该结点保存的整数数据,Next 是下一结点的地址。","output":"对每个测试用例,顺序输出反转后的链表,其上每个结点占一行,格式与输入相同。","samples":[{"input":"00100 8 3\n71120 7 88666\n00000 4 99999\n00100 1 12309\n68237 6 71120\n33218 3 00000\n99999 5 68237\n88666 8 -1\n12309 2 33218","output":"71120 7 88666\n88666 8 00000\n00000 4 99999\n99999 5 68237\n68237 6 00100\n00100 1 12309\n12309 2 33218\n33218 3 -1","explanation":"","label":""}],"sampleInput":"00100 8 3\n71120 7 88666\n00000 4 99999\n00100 1 12309\n68237 6 71120\n33218 3 00000\n99999 5 68237\n88666 8 -1\n12309 2 33218","sampleOutput":"71120 7 88666\n88666 8 00000\n00000 4 99999\n99999 5 68237\n68237 6 00100\n00100 1 12309\n12309 2 33218\n33218 3 -1","idea":["L为输入链表,ans为答案链表,二维数组E为区块链表。先将链表数据记录在结构体A中,遍历A将链表正确顺序记录在链表L中,然后需要重新定义链表长度n(因为有输入中有无效的假结点信息)。遍历链表L,将每K个结点所分隔成的区块保存在二维数组E中,再从后往前将区块链表E中的值添加到答案链表ans中,最后根据格式输出ans链表就好啦~"],"keyPoints":["先按地址建立结点映射，再沿 next 指针恢复有效链表顺序。","输出地址时通常需要补足 5 位，空地址按题目要求输出。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：L为输入链表,ans为答案链表,二维数组E为区块链表\nusing namespace std;\n\nstruct node {\n   int data, next;\n}A[100001];\nvector\u003cint> L, ans, E[100001];\nint s, n , a, t, k, mark, cnt, c;\n\nint main() {\n   cin >> s >> n >> k;\n   for (int i = 0; i \u003c n; i++) {\n      cin >> a;\n      cin >> A[a].data >> A[a].next;\n   }\n   t = s;\n   while (t != -1) {\n      L.push_back(t);\n      t = A[t].next;\n\n   }\n   n = L.size();\n   for (int i = 0; i \u003c n; i++) {\n      E[c].push_back(L[i]);\n      cnt++;\n      if (cnt == k && i != n - 1) {\n         cnt = 0;\n         c++;\n      }\n\n   }\n   for (int i = c; i >= 0; i--)\n      for (auto it : E[i])\n         ans.push_back(it);\n   for (int i = 1; i \u003c n; i++)\n      printf(\"%05d %d %05d\\n\", ans[i - 1], A[ans[i - 1]].data, ans[i]);\n   printf(\"%05d %d -1\", ans.back(), A[ans.back()].data);\n   return 0;\n}"},{"id":"1111","title":"对称日","score":15,"category":"字符串处理","description":["央视新闻发了一条微博,指出 2020 年有个罕见的“对称日”,即 2020 年 2 月 2 日,按照 年年年年月月日日 格式组成的字符串 20200202 是完全对称的。","给定任意一个日期,本题就请你写程序判断一下,这是不是一个对称日?"],"input":"输入首先在第一行给出正整数 N(1\u003cN≤10)。随后 N 行,每行给出一个日期,却是按英文习惯的格式:Month Day, Year。其中 Month 是月份的缩写,对应如下:一月:Jan二月:Feb三月:Mar四月:Apr五月:May六月:Jun七月:Jul八月:Aug九月:Sep十月:Oct十一月:Nov十二月:Dec Day 是月份中的日期,为 [1, 31] 区间内的整数;Year 是年份,为 [1, 9999] 区间内的整数。","output":"对每一个给定的日期,在一行中先输出 Y 如果这是一个对称日,否则输出 N;随后空一格,输出日期对应的 年年年年月月日日 格式组成的字符串。","samples":[{"input":"5\nFeb 2, 2020\nMar 7, 2020\nOct 10, 101\nNov 21, 1211\nDec 29, 1229","output":"Y 20200202\nN 20200307\nY 01011010\nY 12111121\nN 12291229","explanation":"","label":""}],"sampleInput":"5\nFeb 2, 2020\nMar 7, 2020\nOct 10, 101\nNov 21, 1211\nDec 29, 1229","sampleOutput":"Y 20200202\nN 20200307\nY 01011010\nY 12111121\nN 12291229","idea":["使用字符串M、D、Y分别保存题目输入的月、日、年,日后面会有一个多余的逗号,这里用erase把它擦掉。如果位数不足,则在前面补’0’。使用final保存最后的年份。使用symmetry为”Y”表示是对成日,为”N”表示不是对称日。使用map\u003cstring,sintrg> A将月份由英文缩写映射成数字。","最后再通过判断前半部分的每个数字和后半部分对应的数字是不是一样的,得出它是不是一个对称数,就可以啦~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n\n// 解题关键：使用字符串M、D、Y分别保存题目输入的月、日、年,日后面会有一个多余的逗号,这里用erase把它擦掉\nusing namespace std;\nint t;\nstring M, D, Y, final, symmetry;\nmap\u003cstring,string> A = {{\"Jan\", \"01\"}, {\"Feb\", \"02\"}, {\"Mar\", \"03\"}, {\"Apr\", \"04\"}, {\"May\", \"05\"}, {\"Jun\", \"06\"}, {\"Jul\", \"07\"}, {\"Aug\", \"08\"}, {\"Sep\", \"09\"}, {\"Oct\", \"10\"}, {\"Nov\", \"11\"}, {\"Dec\",\"12\"}};\nint main(){\n\n   for (cin >> t; t; t--) {\n      cin >> M >> D >> Y;\n      D.erase(D.end() - 1);\n      M = A[M];\n      if(D.size() == 1) D = \"0\" + D;\n\n      while(Y.size() \u003c 4) Y = \"0\" + Y;\n      final = Y + M + D;\n      symmetry = \"Y\";\n      for (int i = 0; i \u003c 4; i++) {\n         if(final[i] != final[8 - i - 1]) {\n             symmetry = \"N\";\n             break;\n         }\n      }\n      cout \u003c\u003c symmetry \u003c\u003c ' ' \u003c\u003c final \u003c\u003c '\\n';\n\n   }\n   return 0;\n}"},{"id":"1112","title":"超标区间","score":20,"category":"模拟题","description":["上图是用某科学研究中采集的数据绘制成的折线图,其中红色横线表示正常数据的阈值(在此图中阈值是 25)。你的任务就是把超出阈值的非正常数据所在的区间找出来。例如上图中横轴 [3, 5] 区间中的 3个数据点超标,横轴上点 9 (可以表示为区间 [9, 9])对应的数据点也超标。"],"input":"输入第一行给出两个正整数 N(≤10^4)和 T(≤100),分别是数据点的数量和阈值。第二行给出 N 个数据点的纵坐标,均为不超过 1000 的正整数,对应的横坐标为整数 0 到 N−1。","output":"按从左到右的顺序输出超标数据的区间,每个区间占一行,格式为 [A, B],其中 A 和 B 为区间的左右端点。如果没有数据超标,则在一行中输出所有数据的最大值。","samples":[{"input":"11 25\n21 15 25 28 35 27 20 24 18 32 23","output":"[3, 5]\n[9, 9]","explanation":"","label":"1"},{"input":"11 40\n21 15 25 28 35 27 20 24 18 32 23","output":"35","explanation":"","label":"2"}],"sampleInput":"11 25\n21 15 25 28 35 27 20 24 18 32 23","sampleOutput":"[3, 5]\n[9, 9]","idea":["使用maxn保存最大的数,数组A存储输入的数据。通过遍历找出超出部分的范围。如果当前这个数字小于等于T,就可以跳过这次的循环。大于T的话,就找一下当前超出部分的区间。使用end记录区间的右端点,使用while语句,当下一个数(下标为end+1)还在范围内并且下一个数也大于T的时候,就让end+1。然后按格式输出当前超出的区间[i,end]。","使用maxn是否大于T来判断是否有数据超标。"],"keyPoints":["把题目流程拆成清晰状态逐步模拟，每一步只修改相关变量。","重点检查循环起止、下标边界和最后一项的输出格式。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：使用maxn保存最大的数,数组A存储输入的数据\nusing namespace std;\nint N, T, maxn, A[10005];\nint main(){\n\n   cin >> N >> T;\n   for (int i = 0; i \u003c N; i++) cin >> A[i];\n   for (int i = 0; i \u003c N; i++) {\n      maxn = max(maxn, A[i]);\n      if (A[i] \u003c= T) continue;\n      int end = i;\n      while(end + 1 \u003c N && A[end + 1] > T) ++end;\n      cout \u003c\u003c \"[\" \u003c\u003c i \u003c\u003c \", \" \u003c\u003c end \u003c\u003c \"]\\n\";\n      i = end;\n   }\n\n   if (maxn \u003c= T) cout \u003c\u003c maxn;\n   return 0;\n}"},{"id":"1113","title":"钱串子的加法","score":20,"category":"进制转换","description":["人类习惯用 10 进制,可能因为大多数人类有 10 根手指头,可以用于计数。这个世界上有一种叫“钱串子”(学名“蚰蜒”)的生物,有 30 只细长的手/脚,在它们的世界里,数字应该是 30 进制的。本题就请你实现钱串子世界里的加法运算。"],"input":"输入在一行中给出两个钱串子世界里的非负整数,其间以空格分隔。\n\n所谓“钱串子世界里的整数”是一个 30 进制的数字,其数字 0 到 9 跟人类世界的整数一致,数字 10 到29 用小写英文字母 a 到 t 顺次表示。\n\n输入给出的两个整数都不超过 10^5 位。","output":"在一行中输出两个整数的和。注意结果数字不得有前导零。","samples":[{"input":"2g50ttaq 0st9hk381","output":"11feik2ir","explanation":"","label":""}],"sampleInput":"2g50ttaq 0st9hk381","sampleOutput":"11feik2ir","idea":["将两个钱串子货币分别存储在string类型的a和b中,最后的答案存储在ans中。使用num_a、num_b分别储存a、b某一位对应十进制下的数。now为相加过程中的和,jin表示当前的进位。index作为最后输出答案时的下标。首先让a和b数位相等,这里可以让a更短(或相等),如果a的长度大于b的长度,就交换他们。同时,在a前面补上他们长度相差数的’0’,让位数对齐,方便计算。","string c(n,’0′)表示创建一个长度为c,全部是’0’字符的字符串c。从右向左让a、b中对应的每一位相加,注意每一次还要加上进位。我们需要先将字符转换成对应的十进制数,如果当前的字符在’1’到’9’之间,那么直接将 当前字符减’0’就可以得到我们要的数字,否则,要将当前字符减去’a’再加上10。","使用模运算(%30)得到当前位数上应该存什么数字now,使用除法运算(/30)可以得到我们的进位jin。再把now转换成三十进制的字符,保存在ans的对应位置。结束遍历后,如果还有进位,则在ans的左边在加一个’1’。接下来去除前导0,使用while循环,找到第一个ans内的值不等于0的下标。","可以让index的值小于ans的长度-1,可以保证如果全是0的数相加,至少会保留一个零。最后从index到最后就是我们的答案啦。"],"keyPoints":["进制转换时特别处理结果为 0 的情况，并留意高位与低位的输出顺序。","多进制混合运算应逐位处理进位，不要直接套用十进制规则。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：将两个钱串子货币分别存储在string类型的a和b中,最后的答案存储在ans中\nusing namespace std;\nstring a, b, ans;\nint num_a, num_b, now, jin, position;\nint main(){\n   cin >> a >> b;\n   if(a.size() > b.size()) swap(a, b);\n   string c(b.size() - a.size(), '0');\n\n   a = c + a;\n   ans.resize(a.size());\n   for (int i = b.size() - 1; i >= 0; i--) {\n      if (a[i] >= '0' && a[i] \u003c= '9') num_a = a[i] - '0';\n      else num_a = a[i] - 'a' + 10;\n      if (b[i] >= '0' && b[i] \u003c= '9') num_b = b[i] - '0';\n      else num_b = b[i] - 'a' + 10;\n      now = (num_a + num_b + jin) % 30;\n      jin = (num_a + num_b + jin) / 30;\n\n      if(now \u003c 10) ans[i] = (char)(now + '0');\n      else ans[i] = (char)(now - 10 + 'a');\n   }\n   if (jin) ans = \"1\" + ans;\n   while(position \u003c ans.size() - 1 && ans[position] == '0') ++position;\n   while(position \u003c ans.size()) cout \u003c\u003c ans[position++];\n\n   return 0;\n}"},{"id":"1114","title":"全素日","score":20,"category":"素数,字符串处理","description":["以上图片来自新浪微博,展示了一个非常酷的“全素日”:2019年5月23日。即不仅20190523本身是个素数,它的任何以末尾数字3结尾的子串都是素数。","本题就请你写个程序判断一个给定日期是否是“全素日”。"],"input":"输入按照 yyyymmdd 的格式给出一个日期。题目保证日期在0001年1月1日到9999年12月31日之间。","output":"从原始日期开始,按照子串长度递减的顺序,每行首先输出一个子串和一个空格,然后输出 Yes,如果该子串对应的数字是一个素数,否则输出 No。如果这个日期是一个全素日,则在最后一行输出 All Prime!。","samples":[{"input":"20190523","output":"20190523 Yes\n0190523 Yes\n190523 Yes\n90523 Yes\n0523 Yes\n523 Yes\n23 Yes\n3 Yes\nAll Prime!","explanation":"","label":"1"},{"input":"20191231","output":"20191231 Yes\n0191231 Yes\n191231 Yes\n91231 No\n1231 Yes\n231 No\n31 Yes\n1 No","explanation":"","label":"2"}],"sampleInput":"20190523","sampleOutput":"20190523 Yes\n0190523 Yes\n190523 Yes\n90523 Yes\n0523 Yes\n523 Yes\n23 Yes\n3 Yes\nAll Prime!","idea":["使用num储存合数的个数,如果最后num为0,则表示要输出”All Prime!”。使用string s存储输入的数字。可以使用while循环,每次查询当前数值是不是素数,然后使用erase()函数删除第一个数字,如此循环到s长度为0。可以直接使用函数stoi(),将string转化成int类型。每次我们判断当前的数是不是素数,并直接输出。"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：使用num储存合数的个数,如果最后num为0,则表示要输出”All Prime!”\n\n#include \u003ccmath>\nusing namespace std;\nint num;\nstring s;\nint is_prime(int x) {\n   if (x \u003c 2) return 0;\n   for (int i = 2; i \u003c= sqrt(x); i++)\n      if (x % i == 0) return 0;\n   return 1;\n\n}\nint main(){\n   cin >> s;\n   num = s.size();\n   while (s.size()) {\n      cout \u003c\u003c s \u003c\u003c ' ' \u003c\u003c (is_prime(stoi(s)) ? \"Yes\" : \"No\") \u003c\u003c '\\n';\n      if (is_prime(stoi(s))) --num;\n      s.erase(s.begin());\n   }\n   if (num == 0) cout \u003c\u003c \"All Prime!\";\n\n   return 0;\n}"},{"id":"1115","title":"裁判机","score":25,"category":"逻辑题","description":["有一种数字游戏的规则如下:首先由裁判给定两个不同的正整数,然后参加游戏的几个人轮流给出正整数。要求给出的数字必须是前面已经出现的某两个正整数之差,且不能等于之前的任何一个数。游戏一直持续若干轮,中间有写重复或写错的人就出局。","本题要求你实现这个游戏的裁判机,自动判断每位游戏者给出的数字是否合法,以及最后的赢家。"],"input":"输入在第一行中给出 2 个初始的正整数,保证都在 [1,10^5] 范围内且不相同。\n\n第二行依次给出参加比赛的人数 N(2≤N≤10)和每个人都要经历的轮次数 M(2≤M≤10^3)。\n\n以下 N 行,每行给出 M 个正整数。第 i 行对应第 i 个人给出的数字(i=1,...,N)。游戏顺序是从第 1个人给出第 1 个数字开始,每人顺次在第 1 轮给出自己的第 1 个数字;然后每人顺次在第 2 轮给出自己的第 2 个数字,以此类推。","output":"如果在第 k 轮,第 i 个人出局,就在一行中输出 Round #k: i is out.。出局人后面给出的数字不算;同一轮出局的人按编号增序输出。直到最后一轮结束,在一行中输出 Winner(s): W1 W2... Wn,其中 W1... Wn 是最后的赢家编号,按增序输出。数字间以 1 个空格分隔,行末不得有多余空格。如果没有赢家,则输出 No winner.。","samples":[{"input":"101 42\n4 5\n59 34 67 9 7\n17 9 8 50 7\n25 92 43 26 37\n76 51 1 41 40","output":"Round #4: 1 is out.\nRound #5: 3 is out.\nWinner(s): 2 4","explanation":"","label":"1"},{"input":"42 101\n4 5\n59 34 67 9 7\n17 9 18 50 49\n25 92 58 1 39\n102 32 2 6 41","output":"Round #1: 4 is out.\nRound #3: 2 is out.\nRound #4: 1 is out.\nRound #5: 3 is out.\nNo winner.","explanation":"","label":"2"}],"sampleInput":"101 42\n4 5\n59 34 67 9 7\n17 9 8 50 7\n25 92 43 26 37\n76 51 1 41 40","sampleOutput":"Round #4: 1 is out.\nRound #5: 3 is out.\nWinner(s): 2 4","idea":["使用二维数组A存储每一轮每一个玩家出的数,使用flag2标记是否有人获胜,mark数组中标记某个数是否出现过,out[i]表示第i个人已经出局,used数组中存储已经出现过的数。题目要求是给出的数字必须是前面已经出现的某两个正整数之差,可以转换为现在这个人出的数字,加上已经出过的某个数,看是不是等于另一个已经出过的数字。对于每一轮我们遍历所有人,如果这个人已经出局,则跳过。","如果这个数加所有出现过数字,不等于另外一个已经出现过的数字,或者这个数已经出现过了,那么这个人淘汰,否则mark记录一下这个数字已经被使用过,并且添加到已经使用过的数组used中。最 后遍历输出赢家,如果没有赢家就输出”No winner.”。"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：使用二维数组A存储每一轮每一个玩家出的数,使用flag2标记是否有人获胜,mark数组中标记某个数是否出现过,out[i]表示第i个人已经出局,used数组中存储已经出现过的数\nusing namespace std;\nint N, M, flag2, A[11][1001], mark[200005], out[11];\nvector\u003cint> used(2);\nint main(){\n   cin >> used[0] >> used[1];\n   mark[used[0]] = mark[used[1]] = 1;\n   cin >> N >> M;\n\n   for (int i = 1; i \u003c= N; i++)\n   for (int j = 1; j \u003c= M; j++) cin >> A[i][j];\n   for (int i = 1; i \u003c= M; i++)\n      for (int j = 1; j \u003c= N; j++) {\n\n         if (out[j]) continue;\n         int flag = 0;\n         if (mark[A[j][i]]) flag = -1;\n         for (auto it : used) {\n             if (mark[it + A[j][i]] == 1) {\n\n                mark[A[j][i]] = 1;\n                flag++;\n                used.push_back(A[j][i]);\n                break;\n             }\n         }\n         if (flag \u003c= 0) {\n             out[j] = 1;\n             cout \u003c\u003c \"Round #\" \u003c\u003c i \u003c\u003c \": \" \u003c\u003c j \u003c\u003c \" is out.\\n\";\n         }\n\n      }\n   for (int i = 1; i \u003c= N; i++) {\n      if (!out[i]) {\n         if(!flag2) {\n             cout \u003c\u003c \"Winner(s):\";\n             flag2 = 1;\n         }\n         cout \u003c\u003c \" \" \u003c\u003c i;\n      }\n\n   }\n   if (!flag2) cout \u003c\u003c \"No winner.\";\n   return 0;\n}"},{"id":"1116","title":"多二了一点","score":15,"category":"字符串处理","description":["若一个正整数有 2n 个数位,后 n 个数位组成的数恰好比前 n 个数位组成的数多 2,则称这个数字“多二了一点”。如 24、6668、233235 等都是多二了一点的数字。","给定任一正整数,请你判断它有没有多二了那么一点。"],"input":"输入在第一行中给出一个正整数 N(≤10^1000)。","output":"在一行中根据情况输出下列之一:如果输入的整数没有偶数个数位,输出 Error: X digit(s),其中 X 是 N 的位数;如果是偶数位的数字,并且是多二了一点,输出 Yes: X - Y = 2,其中 X 是后一半数位组成的数,Y 是前一半数位组成的数。注意:为了让题目简单,输入保证此时 Y 的个位数不大于 7。\n\n如果是偶数位的数字,但并不是多二了一点,输出 No: X - Y!= 2,其中 X 是后一半数位组成的数,Y 是前一半数位组成的数。","samples":[{"input":"233235","output":"Yes: 235 – 233 = 2","explanation":"","label":"1"},{"input":"5678912345","output":"No: 12345 – 56789 != 2","explanation":"","label":"2"},{"input":"2331235","output":"Error: 7 digit(s)","explanation":"","label":"3"}],"sampleInput":"233235","sampleOutput":"Yes: 235 – 233 = 2","idea":["使用string类型存储数字,使用Left和Right分别存储这个数的前n个数的和、后n个数的和。由于是计算差值,所以不需要让字符数字减去’0’。如果数的长度为奇数,就直接输出相对应的Error语句。否则按对应条件输出即可。s.substr(a)表示从s的第a位开始截取到最后,s.substr(a,b)表示从s的第a位开始截取长度位b的字符串。"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：使用string类型存储数字,使用Left和Right分别存储这个数的前n个数的和、后n个数的和\nusing namespace std;\nstring s;\nint Left, Right;\nint main(){\n   cin >> s;\n   if (s.size() & 1) cout \u003c\u003c \"Error: \" \u003c\u003c s.size() \u003c\u003c \" digit(s)\";\n   else {\n\n      for (int i = 0; i \u003c s.size(); i++) {\n         if (i \u003c s.size() / 2) Left += s[i];\n         else Right += s[i];\n      }\n      if (Left + 2 == Right) cout \u003c\u003c \"Yes: \" \u003c\u003c s.substr(s.size() / 2 ) \u003c\u003c \" - \" \u003c\u003c s.substr(0, s.size() / 2) \u003c\u003c \" = 2\";\n      else cout \u003c\u003c \"No: \" \u003c\u003c s.substr(s.size() / 2) \u003c\u003c \" - \" \u003c\u003c s.substr(0, s.size() / 2) \u003c\u003c \" != 2\";\n   }\n   return 0;\n\n}"},{"id":"1117","title":"数字之王","score":20,"category":"逻辑题","description":["给定两个正整数 N1\u003cN2。把从 N1 到 N2 的每个数的各位数的立方相乘,再将结果的各位数求和,得到一批新的数字,再对这批新的数字重复上述操作,直到所有数字都是 1 位数为止。这时哪个数字最多,哪个就是“数字之王”。","例如 N1=1 和 N2=10 时,第一轮操作后得到 { 1, 8, 9, 10, 8, 9, 10, 8, 18, 0 };第二轮操作后得到 { 1, 8, 18,0, 8, 18, 0, 8, 8, 0 };第三轮操作后得到 { 1, 8, 8, 0, 8, 8, 0, 8, 8, 0 }。所以数字之王就是 8。","本题就请你对任意给定的 N1\u003cN2 求出对应的数字之王。"],"input":"输入在第一行中给出两个正整数 0\u003cN1\u003cN2≤10^3,其间以空格分隔。","output":"首先在一行中输出数字之王的出现次数,随后第二行输出数字之王。例如对输入 1 10 就应该在两行中先后输出 6 和 8。如果有并列的数字之王,则按递增序输出。数字间以 1 个空格分隔,行首尾不得有多余空格。","samples":[{"input":"10 14","output":"2\n0 8","explanation":"","label":""}],"sampleInput":"10 14","sampleOutput":"2\n0 8","idea":["使用f变量控制是否继续重复执行题目中的操作,1表示继续执行,0表示停止。B中存储数字0-9出现的次数,maxn存储数字之王出现的次数。首先将N1到N2的值存储在数组A中,如果N2超过9,表示有数字不是个位数。循环过程中按照题意模拟。然后把所有的个位数输出现了几次,记录在数组B中。把出现次数最多的所有的数存储在数组ans中,最后按顺序输出它们。"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：使用f变量控制是否继续重复执行题目中的操作,1表示继续执行,0表示停止\nusing namespace std;\nint N1, N2, f, A[1005], B[10], maxn;\nvector\u003cint> ans;\n\nsigned main(){\n   cin >> N1 >> N2;\n   for (int i = N1; i \u003c= N2; i++) A[i] = i;\n   if (N2 > 9) f = 1;\n   while (f) {\n      f = 0;\n      for (int i = N1; i \u003c= N2; i++) {\n         if (!A[i]) continue;\n         int t1 = 1, t2 = A[i];\n         while(t2) {\n\n             t1 *= (t2 % 10) * (t2 % 10) * (t2 % 10);\n             t2 /= 10;\n         }\n         while(t1) {\n             t2 += t1 % 10;\n             t1 /= 10;\n         }\n         if (t2 > 9) f = 1;\n         A[i] = t2;\n\n      }\n\n   }\n   for (int i = N1; i \u003c= N2; i++) {\n       B[A[i]]++;\n       maxn = max(maxn, B[A[i]]);\n   }\n\n   for (int i = 0 ; i \u003c 10; i++)\n      if (B[i] == maxn) ans.push_back(i);\n   cout \u003c\u003c maxn \u003c\u003c '\\n';\n   for (int i = 0; i \u003c ans.size(); i++) {\n      if (i) cout \u003c\u003c ' ';\n      cout \u003c\u003c ans[i];\n   }\n   return 0;\n}"},{"id":"1118","title":"如需挪车请致电","score":20,"category":"逻辑题","description":["上图转自新浪微博。车主用一系列简单计算给出了自己的电话号码,即:2/2=1、3+2=5、√9=3、√9=3、0%=0、叁=3、5−2=3、9/3=3、1×3=3、2^3=8、8/2=4,最后得到的电话号码就是 153 3033 3384。","本题就请你写个程序自动完成电话号码的转换,以帮助那些不会计算的人。"],"input":"输入用 11 行依次给出 11 位数字的计算公式,每个公式占一行。这里仅考虑以下几种运算:加(+)、减(-)、乘(*)、除(/)、取余(%,注意这不是上图中的百分比)、开平方根号(sqrt)、指数(^)和文字(即 0 到 9 的全小写汉语拼音,如 ling 表示 0)。运算符与运算数之间无空格,运算数保证是不超过 1000 的非负整数。题目保证每个计算至多只有 1 个运算符,结果都是 1 位整数。","output":"在一行中给出电话号码,数字间不要空格。","samples":[{"input":"2/2\n3+2\nsqrt9\nsqrt9\n6%2\nsan\n5-2\n9/3\n15330333384","output":"15330333384","explanation":"","label":""}],"sampleInput":"2/2\n3+2\nsqrt9\nsqrt9\n6%2\nsan\n5-2\n9/3\n15330333384","sampleOutput":"15330333384","idea":["s存储初始字符串,c存储操作符(如果有的话)。A存储数字拼音转换成int型数字的映射。题目说”题目保证每个计算至多只有1个运算符”,那么可能没有运算符,可能只有纯数字运算数,如果s的长度为1,则直接输出。否则看一下是不是求根运算,即前几位是”sqrt”。都不是的话,就要把数字分成三个部分,数字部分a和b、运算符c。然后根据具体是什么运算符,进行相对应的计算。"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n#include \u003ccmath>\n#include \u003cstring>\n\n// 解题关键：s存储初始字符串,c存储操作符(如果有的话)\nusing namespace std;\nstring s, c;\n\nmap\u003cstring,int> A = {{\"ling\", 0}, {\"yi\", 1}, {\"er\", 2}, {\"san\", 3}, {\"si\", 4}, {\"wu\", 5}, {\"liu\", 6}, {\"qi\", 7}, {\"ba\", 8}, {\"jiu\", 9}};\nint main() {\n   for (int I = 0; I \u003c 11; I++) {\n      cin >> s;\n      if (s.size() == 1) cout \u003c\u003c s;\n      else if (s[0] == 's' && s[1] == 'q') cout \u003c\u003c sqrt(stoi(s.substr(4)));\n      else if (A.count(s)) cout \u003c\u003c A[s];\n      else {\n\n         int a = 0, b = 0, i = 0;\n         while(i \u003c s.size() && isdigit(s[i])) a = a * 10 + s[i++] - '0';\n         c = s[i++];\n         while(i \u003c s.size()) b = b * 10 + s[i++] - '0';\n         if (c == \"+\") cout \u003c\u003c a + b;\n         else if (c == \"-\") cout \u003c\u003c a - b;\n         else if (c == \"*\") cout \u003c\u003c a * b;\n         else if (c == \"/\") cout \u003c\u003c a / b;\n         else if (c == \"%\") cout \u003c\u003c a % b;\n\n         else cout \u003c\u003c pow(a, b);\n      }\n   }\n   return 0;\n}"},{"id":"1119","title":"胖达与盆盆奶","score":20,"category":"逻辑题","description":["大熊猫,俗称“胖达”,会排队吃盆盆奶。它们能和谐吃奶的前提,是它们认为盆盆奶的分配是“公平”的,即:更胖的胖达能吃到更多的奶,等胖的胖达得吃到一样多的奶。另一方面,因为它们是排好队的,所以每只胖达只能看到身边胖达的奶有多少,如果觉得不公平就会抢旁边小伙伴的奶吃。","已知一只胖达每次最少要吃 200 毫升的奶,当另一份盆盆奶多出至少 100 毫升的时候,它们才能感觉到是“更多”了,否则没感觉。","现在给定一排胖达的体重,请你帮饲养员计算一下,在保持给定队形的前提下,至少应该准备多少毫升的盆盆奶?"],"input":"输入首先在第一行给出正整数 n(≤10^4),为胖达的个数。随后一行给出 n 个正整数,表示 n 只胖达的体重(公斤)。每个数值是不超过 200 的正整数,数字间以空格分隔。","output":"在一行中输出至少应该准备多少毫升的盆盆奶。","samples":[{"input":"10\n180 160 100 150 145 142 138 138 138 140","output":"3000","explanation":"盆盆奶的分配量顺序为:\n400 300 200 500 400 300 200 200 200 300","label":""}],"sampleInput":"10\n180 160 100 150 145 142 138 138 138 140","sampleOutput":"3000","idea":["使用数组A记录每个熊猫的体重,L[i]表示第i个数的右边有几个连续下降的数(过程中可以有相等的数字,但是只记录不重复的数字的数量),R[i]则表示第i个数左边有几个连续下降的数(也是可以相等但是不记录)。从左到右遍历每一个i,然后看一下它右边有多少个连续下降的数。从右到左同理,看一下i的左边有多少个连续下降的数。","对于每一只熊猫,取L[i]和R[i]中较大的那个数*100+200,就是这只熊猫应该喝的牛奶的毫升数。最后计算他们的总和就可以啦。"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：使用数组A记录每个熊猫的体重,L[i]表示第i个数的右边有几个连续下降的数(过程中可以有相等的数字,但是只记录不重复的数字的数量),R[i]则表示第i个数左边有几个连续下降的数(也是可以相等但是不记录)\nusing namespace std;\nint n, ans, A[10005], L[10005], R[10005];\nint main(){\n   cin >> n;\n\n   for (int i = 1; i \u003c= n; i++) cin >> A[i];\n   for (int i = 1; i \u003c n; i++) {\n      int j = i;\n      while(j + 1 \u003c= n && A[j] >= A[j + 1]) {\n         if (A[j] > A[j + 1]) ++L[i];\n         ++j;\n      }\n   }\n   for (int i = n; i > 1; i--) {\n      int j = i;\n\n      while(j - 1 >= 1 && A[j] >= A[j - 1]) {\n         if (A[j] > A[j - 1]) ++R[i];\n         --j;\n      }\n   }\n   for (int i = 1; i \u003c= n; i++) ans += max(L[i], R[i]) * 100 + 200;\n   cout \u003c\u003c ans;\n   return 0;\n}"},{"id":"1120","title":"买地攻略","score":25,"category":"前缀和","description":["数码城市有土地出售。待售的土地被划分成若干块,每一块标有一个价格。这里假设每块土地只有两块相邻的土地,除了开头和结尾的两块是只有一块邻居的。每位客户可以购买多块连续相邻的土地。","现给定这一系列土地的标价,请你编写程序,根据客户手头的现金量,告诉客户有多少种不同的购买方案。"],"input":"输入首先在第一行给出两个正整数:N(≤10^4)为土地分割的块数(于是这些块从 1 到 N 顺次编号);M(≤10^9)为客户手中的现金量。\n\n随后一行给出 N 个正整数,其中第 i 个数字就是第 i 块土地的标价。\n\n题目保证所有土地的总价不超过 10^9。","output":"在一行中输出客户有多少种不同的购买方案。请注意客户只能购买连续相邻的土地。","samples":[{"input":"5 85\n38 42 15 24 9","output":"11","explanation":"这 11 种不同的方案为:\n38\n42\n15\n24\n9\n38 42\n42 15\n42 15 24\n15 24\n15 24 9\n24 9","label":""}],"sampleInput":"5 85\n38 42 15 24 9","sampleOutput":"11","idea":["使用pre数组保存土地价格前缀和,pre[i]表示从第一个土地到第i个土地的总价。在计算从第j个房子到第i个土地的总价的时候,只需要计算pre[i]-pre[j-1]即可。两个for循环,枚举所有i与j的值,然后计算出可以购买的方案数量即可。喵喵喵~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：使用pre数组保存土地价格前缀和,pre[i]表示从第一个土地到第i个土地的总价\nusing namespace std;\nint N, M, ans, a, pre[10005];\nint main(){\n   cin >> N >> M;\n\n   for (int i = 1; i \u003c= N; i++) {\n      cin >> a;\n      pre[i] = pre[i - 1] + a;\n   }\n   for (int i = 1; i \u003c= N; i++) {\n\n      for (int j = i; j \u003c= N; j++) {\n         if (pre[j] - pre[i - 1] \u003c= M) ++ans;\n         else break;\n      }\n   }\n   cout \u003c\u003c ans;\n   return 0;\n}"}],"total":125,"config":{"pageTitle":"PAT (Basic Level) Practice（中文）","workbenchTitle":"基础题库工作台","sourceLabel":"PAT 乙级题库","documentSuffix":"PAT 基础题库","storagePrefix":"ruiqy.pat-basic","answerPrefix":"ruiqy-pat-basic-answer-"}}
  var problems = library.problems
  var config = library.config
  var COMPLETED_KEY = config.storagePrefix + '.completed.v1'
  var PAT_THEME_KEY = 'ruiqy.daily.doki-theme.v1'

  var PAT_THEMES = {
    'emilia-light': { tone: 'light', sticker: '/daily/doki/emilia_light.png' },
    'beatrice': { tone: 'light', sticker: '/daily/doki/beatrice.png' },
    'echidna': { tone: 'dark', sticker: '/daily/doki/echidna_dark.png' },
    'inori-light': { tone: 'light', sticker: '/daily/doki/inori_light.png' },
    'nao-light': { tone: 'light', sticker: '/daily/doki/nao_light.png' }
  }
  var completedProblems = loadCompletedProblems()
  var currentIndex = Math.max(0, problems.findIndex(function (problem) {
    return problem.id === window.location.hash.slice(1)
  }))
  var editor = document.querySelector('[data-pat-editor]')
  var lineNumbers = document.querySelector('[data-line-numbers]')
  var problemList = document.querySelector('[data-problem-list]')
  var copyButton = document.querySelector('[data-copy-code]')
  var previousButton = document.querySelector('[data-previous-problem]')
  var nextButton = document.querySelector('[data-next-problem]')
  var completeButton = document.querySelector('[data-toggle-complete]')
  var completedCount = document.querySelector('[data-completed-count]')
  var patThemePicker = document.querySelector('[data-pat-theme-picker]')
  var patThemeToggle = document.querySelector('[data-pat-theme-toggle]')
  var patThemeMenu = document.querySelector('[data-pat-theme-menu]')
  var patTools = document.querySelector('[data-pat-tools]')
  var patSticker = document.querySelector('[data-pat-sticker]')

  function escapeHtml (value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
  }

  function storageKey (problem) {
    return config.answerPrefix + problem.id
  }

  function storedPatTheme () {
    try {
      var saved = window.localStorage.getItem(PAT_THEME_KEY)
      return PAT_THEMES[saved] ? saved : 'emilia-light'
    } catch (error) {
      return 'emilia-light'
    }
  }

  function applyPatTheme (themeId, persist) {
    var id = PAT_THEMES[themeId] ? themeId : 'emilia-light'
    var theme = PAT_THEMES[id]
    document.documentElement.setAttribute('data-pat-theme', id)
    document.body.setAttribute('data-pat-theme', id)
    document.body.setAttribute('data-pat-tone', theme.tone)
    if (patSticker) patSticker.src = theme.sticker
    document.querySelectorAll('[data-pat-theme-option]').forEach(function (button) {
      var active = button.getAttribute('data-pat-theme-option') === id
      button.classList.toggle('is-active', active)
      button.setAttribute('aria-checked', active ? 'true' : 'false')
    })
    if (persist) {
      try { window.localStorage.setItem(PAT_THEME_KEY, id) } catch (error) {}
    }
  }

  function setPatThemeMenu (open) {
    if (!patThemeMenu || !patThemeToggle) return
    patThemeMenu.hidden = !open
    patThemeToggle.classList.toggle('is-open', open)
    patThemeToggle.setAttribute('aria-expanded', open ? 'true' : 'false')
  }

  function makeStickerDraggable (element, handle, storageName) {
    if (!element || !handle) return
    var dragging = false
    var startX = 0
    var startY = 0
    var originLeft = 0
    var originTop = 0

    function clampPosition (left, top) {
      var rect = element.getBoundingClientRect()
      return {
        left: Math.min(Math.max(8, left), Math.max(8, window.innerWidth - rect.width - 8)),
        top: Math.min(Math.max(8, top), Math.max(8, window.innerHeight - rect.height - 8))
      }
    }

    function place (left, top) {
      var position = clampPosition(left, top)
      element.style.left = position.left + 'px'
      element.style.top = position.top + 'px'
      element.style.right = 'auto'
      element.style.bottom = 'auto'
      return position
    }

    function restorePosition () {
      try {
        var saved = JSON.parse(window.localStorage.getItem(storageName) || 'null')
        if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.top)) place(saved.left, saved.top)
      } catch (error) {}
    }

    handle.addEventListener('pointerdown', function (event) {
      if (event.button !== 0) return
      var rect = element.getBoundingClientRect()
      dragging = true
      startX = event.clientX
      startY = event.clientY
      originLeft = rect.left
      originTop = rect.top
      element.classList.add('is-dragging')
      handle.setPointerCapture(event.pointerId)
      event.preventDefault()
    })

    handle.addEventListener('pointermove', function (event) {
      if (!dragging) return
      place(originLeft + event.clientX - startX, originTop + event.clientY - startY)
    })

    function finishDrag (event) {
      if (!dragging) return
      dragging = false
      element.classList.remove('is-dragging')
      if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId)
      var rect = element.getBoundingClientRect()
      var position = place(rect.left, rect.top)
      try { window.localStorage.setItem(storageName, JSON.stringify(position)) } catch (error) {}
    }

    handle.addEventListener('pointerup', finishDrag)
    handle.addEventListener('pointercancel', finishDrag)
    window.addEventListener('resize', function () {
      var rect = element.getBoundingClientRect()
      if (element.style.left) place(rect.left, rect.top)
    })
    restorePosition()
  }

  function loadCompletedProblems () {
    try {
      var saved = JSON.parse(window.localStorage.getItem(COMPLETED_KEY) || '[]')
      return Array.isArray(saved) ? saved : []
    } catch (error) {
      return []
    }
  }

  function saveCompletedProblems () {
    try {
      window.localStorage.setItem(COMPLETED_KEY, JSON.stringify(completedProblems))
    } catch (error) {
      // Completion tracking remains available for this visit.
    }
  }

  function isProblemComplete (problemId) {
    return completedProblems.indexOf(problemId) !== -1

  function getSavedCode (problem) {
    try {
      return window.localStorage.getItem(storageKey(problem)) || problem.code
    } catch (error) {
      return problem.code
    }
  }

  function saveCode () {
    var problem = problems[currentIndex]
    try {
      window.localStorage.setItem(storageKey(problem), editor.value)
    } catch (error) {
      // Local persistence is optional; the editor remains usable without it.
    }
  }

  function updateLineNumbers () {
    var count = editor.value.split('\n').length
    var lines = []
    for (var i = 1; i <= count; i += 1) lines.push(i)
    lineNumbers.textContent = lines.join('\n')
    lineNumbers.scrollTop = editor.scrollTop
  }

  function renderProblemList () {
    problemList.innerHTML = ''
    for (var offset = 0; offset < library.total; offset += 1) {
      var problemId = String(1001 + offset)
      var index = problems.findIndex(function (problem) { return problem.id === problemId })
      var problem = index >= 0 ? problems[index] : null
      var button = document.createElement('button')
      button.type = 'button'
      button.className = 'pat-number-button'
      button.setAttribute('data-problem-id', problemId)
      button.textContent = problemId
      if (problem) {
        button.classList.add('is-ready')
        button.title = problemId + ' ' + problem.title
        button.addEventListener('click', (function (problemIndex) {
          return function () { selectProblem(problemIndex) }
        })(index))
      } else {
        button.disabled = true
        button.title = problemId + ' 待整理'
      }
      problemList.appendChild(button)
    }
    syncCompletionState()
  }

  function syncCompletionState () {
    var currentProblem = problems[currentIndex]
    Array.prototype.forEach.call(problemList.querySelectorAll('.pat-number-button'), function (button) {
      var problemId = button.getAttribute('data-problem-id')
      var complete = isProblemComplete(problemId)
      button.classList.toggle('is-complete', complete)
      button.textContent = complete ? '✓' : problemId
      button.setAttribute('aria-label', complete ? problemId + ' 已完成' : problemId)
      button.classList.toggle('is-active', problemId === currentProblem.id)
    })
    completedCount.textContent = String(completedProblems.length)
    var currentComplete = isProblemComplete(currentProblem.id)
    completeButton.classList.toggle('is-complete', currentComplete)
    completeButton.setAttribute('aria-pressed', currentComplete ? 'true' : 'false')
    completeButton.title = currentComplete ? '取消完成标记' : '标记本题完成'
    var activeButton = problemList.querySelector('.pat-number-button.is-active')
    if (activeButton) activeButton.scrollIntoView({ block: 'nearest', inline: 'nearest' })
  }

  function renderStatement (problem) {
    document.querySelector('[data-current-id]').textContent = problem.id
    document.querySelector('[data-current-title]').textContent = problem.id + ' ' + problem.title
    document.querySelector('[data-statement-title]').textContent = problem.id + ' ' + problem.title
    document.querySelector('[data-score]').textContent = '分数 ' + problem.score
    document.querySelector('[data-category]').textContent = problem.category
    document.querySelector('[data-description]').innerHTML = problem.description.map(function (paragraph) {
      return '<p>' + escapeHtml(paragraph) + '</p>'
    }).join('')
    document.querySelector('[data-input]').textContent = problem.input
    document.querySelector('[data-output]').textContent = problem.output
    var samples = problem.samples && problem.samples.length
      ? problem.samples
      : [{ input: problem.sampleInput, output: problem.sampleOutput, explanation: '' }]
    document.querySelector('[data-samples]').innerHTML = samples.map(function (sample, index) {
      var suffix = samples.length > 1 ? ' ' + (sample.label || index + 1) : ''
      var explanation = sample.explanation
        ? '<div class="pat-sample-explanation"><strong>样例说明</strong>\n' + escapeHtml(sample.explanation) + '</div>'
        : ''
      return '<h3>输入样例' + escapeHtml(suffix) + '</h3>' +
        '<div class="pat-sample"><header><span>in</span><span>样例输入</span></header><pre>' + escapeHtml(sample.input) + '</pre></div>' +
        '<h3>输出样例' + escapeHtml(suffix) + '</h3>' +
        '<div class="pat-sample"><header><span>out</span><span>期望输出</span></header><pre>' + escapeHtml(sample.output) + '</pre></div>' +
        explanation
    }).join('')
  }

  function renderAnswer (problem) {
    var ideaTones = ['is-main', 'is-core', 'is-explain']
    document.querySelector('[data-idea]').innerHTML = problem.idea.map(function (item, index) {
      return '<li class="pat-idea-item ' + ideaTones[index % ideaTones.length] + '">' + escapeHtml(item) + '</li>'
    }).join('')
    document.querySelector('[data-key-points]').innerHTML = problem.keyPoints.map(function (item) {
      return '<li>' + escapeHtml(item) + '</li>'
    }).join('')
    document.querySelector('[data-test-input]').textContent = problem.sampleInput
    document.querySelector('[data-test-output]').textContent = problem.sampleOutput
    editor.value = getSavedCode(problem)
    updateLineNumbers()
  }

  function selectProblem (index) {
    if (index < 0 || index >= problems.length) return
    currentIndex = index
    var problem = problems[currentIndex]
    previousButton.disabled = currentIndex === 0
    nextButton.disabled = currentIndex === problems.length - 1
    renderStatement(problem)
    renderAnswer(problem)
    window.history.replaceState(null, '', '#' + problem.id)
    document.title = problem.id + ' ' + problem.title + ' · ' + config.documentSuffix
    syncCompletionState()
    document.querySelector('.pat-problem-panel').scrollTop = 0
    document.querySelector('.pat-answer-panel').scrollTop = 0
  }

  editor.addEventListener('input', function () {
    updateLineNumbers()
    saveCode()
  })
  editor.addEventListener('scroll', function () { lineNumbers.scrollTop = editor.scrollTop })
  editor.addEventListener('keydown', function (event) {
    if (event.key !== 'Tab') return
    event.preventDefault()
    var start = editor.selectionStart
    var end = editor.selectionEnd
    editor.value = editor.value.slice(0, start) + '  ' + editor.value.slice(end)
    editor.selectionStart = editor.selectionEnd = start + 2
    updateLineNumbers()
    saveCode()
  })

  copyButton.addEventListener('click', function () {
    var copied = function () {
      copyButton.textContent = '已复制'
      copyButton.classList.add('is-copied')
      window.setTimeout(function () {
        copyButton.textContent = '复制代码'
        copyButton.classList.remove('is-copied')
      }, 1400)
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(editor.value).then(copied)
      return
    }
    editor.select()
    document.execCommand('copy')
    copied()
  })

  previousButton.addEventListener('click', function () { selectProblem(currentIndex - 1) })
  nextButton.addEventListener('click', function () { selectProblem(currentIndex + 1) })
  completeButton.addEventListener('click', function () {
    var problemId = problems[currentIndex].id
    var completedIndex = completedProblems.indexOf(problemId)
    if (completedIndex === -1) completedProblems.push(problemId)
    else completedProblems.splice(completedIndex, 1)
    saveCompletedProblems()
    syncCompletionState()
  })
  window.addEventListener('hashchange', function () {
    var index = problems.findIndex(function (problem) { return problem.id === window.location.hash.slice(1) })
    if (index >= 0 && index !== currentIndex) selectProblem(index)
  })

  patThemeToggle.addEventListener('click', function (event) {
    event.stopPropagation()
    setPatThemeMenu(patThemeMenu.hidden)
  })
  document.querySelectorAll('[data-pat-theme-option]').forEach(function (button) {
    button.addEventListener('click', function () {
      applyPatTheme(button.getAttribute('data-pat-theme-option'), true)
      setPatThemeMenu(false)
    })
  })
  document.addEventListener('click', function (event) {
    if (patThemePicker && !patThemePicker.contains(event.target)) setPatThemeMenu(false)
  })
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') setPatThemeMenu(false)
  })
  window.addEventListener('storage', function (event) {
    if (event.key === PAT_THEME_KEY) applyPatTheme(event.newValue, false)
  })

  applyPatTheme(storedPatTheme(), false)
  makeStickerDraggable(patTools, patSticker, PAT_STICKER_POSITION_KEY)
  renderProblemList()
  selectProblem(currentIndex)
})()
</script>

</body>
