cnt = 1;\n   if (t == 'D') {\n\n      for (int i = 0; i \u003c s.length(); i++) {\n         if (s[i] >= '0' && s[i] \u003c= '9') {\n             num += s[i];\n         } else {\n             if (num.length() > 0) cnt = stoi(num);\n             while(cnt--) cout \u003c\u003c s[i];\n             cnt = 1;\n             num = \"\";\n         }\n\n      }\n   } else if (s.length() != 0) {\n      char pre = s[0];\n      for (int i = 1; i \u003c s.length(); i++) {\n         if (s[i] == pre) {\n             cnt++;\n         } else {\n             if (cnt >= 2) cout \u003c\u003c cnt;\n             cout \u003c\u003c pre;\n             cnt = 1;\n\n             pre = s[i];\n         }\n      }\n      if (cnt >= 2) cout \u003c\u003c cnt;\n      cout \u003c\u003c pre;\n   }\n\n   return 0;\n}"},{"id":"1079","title":"延迟的回文数","score":20,"category":"逻辑题","description":["给定一个 k+1 位的正整数 N,写成 ak...a1a0 的形式,其中对所有 i 有 0 \u003c= ai \u003c 10 且 ak > 0。N 被称为一个回文数,当且仅当对所有 i 有 ai = ak-i。零也被定义为一个回文数。","非回文数也可以通过一系列操作变出回文数。首先将该数字逆转,再将逆转数与该数相加,如果和还不是一个回文数,就重复这个逆转再相加的操作,直到一个回文数出现。如果一个非回文数可以变出回文数,就称这个数为延迟的回文数。(定义翻译自 https://en.wikipedia.org/wiki/Palindromic_numbe r)给定任意一个正整数,本题要求你找到其变出的那个回文数。"],"input":"输入在一行中给出一个不超过1000位的正整数。","output":"对给定的整数,一行一行输出其变出回文数的过程。每行格式如下A + B = C其中A是原始的数字,B是A的逆转数,C是它们的和。A从输入的整数开始。重复操作直到C在10步以内变成回文数,这时在一行中输出“C is a palindromic number.”;或者如果10步都没能得到回文数,最后就在一行中输出“Not found in 10 iterations.”。","samples":[{"input":"97152","output":"97152 + 25179 = 122331\n122331 + 133221 = 255552\n255552 is a palindromic number.","explanation":"","label":"1"},{"input":"196","output":"196 + 691 = 887\n887 + 788 = 1675\n1675 + 5761 = 7436\n7436 + 6347 = 13783\n13783 + 38731 = 52514\n52514 + 41525 = 94039\n94039 + 93049 = 187088\n187088 + 880781 = 1067869\n1067869 + 9687601 = 10755470\n10755470 + 07455701 = 18211171\nNot found in 10 iterations.","explanation":"","label":"2"}],"sampleInput":"97152","sampleOutput":"97152 + 25179 = 122331\n122331 + 133221 = 255552\n255552 is a palindromic number.","idea":["1、将字符串倒置与原字符串比较看是否相等可知s是否为回文串2、字符串s和它的倒置t相加,只需从头到尾相加然后再倒置(记得要处理最后一个进位carry,如果有进位要在末尾+’1’)3、倒置可采用algorithm头文件里面的函数reverse(s.begin(), s.end())直接对s进行倒置"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n\n// 解题关键：1、将字符串倒置与原字符串比较看是否相等可知s是否为回文串2、字符串s和它的倒置t相加,只需从头到尾相加然后再倒置(记得要处理最后一个进位carry,如果有进位要在末尾+’1’)3、倒置可采用algorithm头文件里面\nusing namespace std;\n\nstring rev(string s) {\n   reverse(s.begin(), s.end());\n   return s;\n}\nstring add(string s1, string s2) {\n   string s = s1;\n   int carry = 0;\n   for (int i = s1.size() - 1; i >= 0; i--) {\n      s[i] = (s1[i] - '0' + s2[i] - '0' + carry) % 10 + '0';\n      carry = (s1[i] - '0' + s2[i] - '0' + carry) / 10;\n\n   }\n   if (carry > 0) s = \"1\" + s;\n   return s;\n}\nint main() {\n   string s, sum;\n   int n = 10;\n   cin >> s;\n   if (s == rev(s)) {\n\n      cout \u003c\u003c s \u003c\u003c \" is a palindromic number.\\n\";\n      return 0;\n   }\n   while (n--) {\n      sum = add(s, rev(s));\n      cout \u003c\u003c s \u003c\u003c \" + \" \u003c\u003c rev(s) \u003c\u003c \" = \" \u003c\u003c sum \u003c\u003c endl;\n\n      if (sum == rev(sum)) {\n         cout \u003c\u003c sum \u003c\u003c \" is a palindromic number.\\n\";\n         return 0;\n      }\n      s = sum;\n\n   }\n   cout \u003c\u003c \"Not found in 10 iterations.\\n\";\n   return 0;\n}"},{"id":"1080","title":"MOOC期终成绩","score":25,"category":"map映射,排序","description":["对于在中国大学MOOC(http://www.icourse163.org/)学习“数据结构”课程的学生,想要获得一张合格证书,必须首先获得不少于200分的在线编程作业分,然后总评获得不少于60分(满分100)。总评成绩的计算公式为 G = (G期中x 40% + G期末x 60%),如果 G期中 > G期末;否则总评 G 就是 G期末。","这里 G期中 和 G期末 分别为学生的期中和期末成绩。","现在的问题是,每次考试都产生一张独立的成绩单。本题就请你编写程序,把不同的成绩单合为一张。"],"input":"输入在第一行给出3个整数,分别是 P(做了在线编程作业的学生数)、M(参加了期中考试的学生数)、N(参加了期末考试的学生数)。每个数都不超过10000。\n\n接下来有三块输入。第一块包含 P 个在线编程成绩 G编程;第二块包含 M 个期中考试成绩 G期中;第三块包含 N 个期末考试成绩 G期末。每个成绩占一行,格式为:学生学号 分数。其中学生学号为不超过20个字符的英文字母和数字;分数是非负整数(编程总分最高为900分,期中和期末的最高分为100分)。","output":"打印出获得合格证书的学生名单。每个学生占一行,格式为:学生学号 G编程 G期中 G期末 G如果有的成绩不存在(例如某人没参加期中考试),则在相应的位置输出“-1”。输出顺序为按照总评分数(四舍五入精确到整数)递减。若有并列,则按学号递增。题目保证学号没有重复,且至少存在1个合格的学生。","samples":[{"input":"6 6 7\n01234 880\na1903 199\nydjh2 200\nwehu8 300\ndx86w 220\nmissing 400\nydhfu77 99\nwehu8 55\nydjh2 98\ndx86w 88\na1903 86\n01234 39\nydhfu77 88\na1903 66\n01234 58\nwehu8 84\nydjh2 82\nmissing 99\ndx86w 81","output":"missing 400 -1 99 99\nydjh2 200 98 82 88\ndx86w 220 88 81 84\nwehu8 300 55 84 84","explanation":"","label":""}],"sampleInput":"6 6 7\n01234 880\na1903 199\nydjh2 200\nwehu8 300\ndx86w 220\nmissing 400\nydhfu77 99\nwehu8 55\nydjh2 98\ndx86w 88\na1903 86\n01234 39\nydhfu77 88\na1903 66\n01234 58\nwehu8 84\nydjh2 82\nmissing 99\ndx86w 81","sampleOutput":"missing 400 -1 99 99\nydjh2 200 98 82 88\ndx86w 220 88 81 84\nwehu8 300 55 84 84","idea":["1、因为所有人必须要G编程>=200分,所以用v数组保存所有G编程>=200的人,(一开始gm和gf都为-1),用map映射保存名字所对应v中的下标(为了避免与“不存在”混淆,保存下标+1,当为0时表示该学生的姓名在v中不存在)2、G期中中出现的名字,如果对应的map并不存在(==0),说明该学生编程成绩不满足条件,则无须保存该学生信息。","将存在的人的期中考试成绩更新3、G期末中出现的名字,也必须保证在map中存在,先更新G期末和G总为新的成绩,当G期末\u003cG期中时再将G总更新为(G期中x 40% + G期末x 60%) 4、将v数组中所有G总满足条件的放入ans数组中,对ans排序(总分递减,总分相同则姓名递增),最后输出ans中的学生信息~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：1、因为所有人必须要G编程>=200分,所以用v数组保存所有G编程>=200的人,(一开始gm和gf都为-1),用map映射保存名字所对应v中的下标(为了避免与“不存在”混淆,保存下标+1,当为0时表示该学生的姓名在v中\n\n#include \u003calgorithm>\n#include \u003cvector>\n\n#include \u003cmap>\nusing namespace std;\nstruct node {\n   string name;\n   int gp, gm, gf, g;\n\n};\nbool cmp(node a, node b) {\n   return a.g != b.g ? a.g > b.g : a.name \u003c b.name;\n}\nmap\u003cstring, int> idx;\nint main() {\n   int p, m, n, score, cnt = 1;\n   cin >> p >> m >> n;\n   vector\u003cnode> v, ans;\n   string s;\n\n   for (int i = 0; i \u003c p; i++) {\n      cin >> s >> score;\n      if (score >= 200) {\n         v.push_back(node{s, score, -1, -1, 0});\n         idx[s] = cnt++;\n      }\n   }\n   for (int i = 0; i \u003c m; i++) {\n      cin >> s >> score;\n\n      if (idx[s] != 0) v[idx[s] - 1].gm = score;\n   }\n   for (int i = 0; i \u003c n; i++) {\n      cin >> s >> score;\n      if (idx[s] != 0) {\n         int temp = idx[s] - 1;\n         v[temp].gf = v[temp].g = score;\n         if (v[temp].gm > v[temp].gf) v[temp].g = int(v[temp].gm * 0.4 + v[temp].gf * 0.6 + 0.5);\n      }\n\n   }\n   for (int i = 0; i \u003c v.size(); i++)\n      if (v[i].g >= 60) ans.push_back(v[i]);\n   sort(ans.begin(), ans.end(), cmp);\n   for (int i = 0; i \u003c ans.size(); i++)\n      printf(\"%s %d %d %d %d\\n\", ans[i].name.c_str(), ans[i].gp, ans[i].gm, ans[i].gf, ans[i].g);\n   return 0;\n}"},{"id":"1081","title":"检查密码","score":15,"category":"string字符串","description":["本题要求你帮助某网站的用户注册模块写一个密码合法性检查的小功能。该网站要求用户设置的密码必须由不少于6个字符组成,并且只能有英文字母、数字和小数点”.”,还必须既有字母也有数字。"],"input":"输入第一行给出一个正整数 N(\u003c=100),随后 N 行,每行给出一个用户设置的密码,为不超过80个字符的非空字符串,以回车结束。","output":"对每个用户的密码,在一行中输出系统反馈信息,分以下5种:如果密码合法,输出“Your password is wan mei.”;如果密码太短,不论合法与否,都输出“Your password is tai duan le.”;如果密码长度合法,但存在不合法字符,则输出“Your password is tai luan le.”;如果密码长度合法,但只有字母没有数字,则输出“Your password needs shu zi.”;如果密码长度合法,但只有数字没有字母,则输出“Your password needs zi mu.”。","samples":[{"input":"5\n123s\nzheshi.wodepw\n1234.5678\nWanMei23333\npass*word.6","output":"Your password is tai duan le.\nYour password needs shu zi.\nYour password needs zi mu.\nYour password is wan mei.\nYour password is tai luan le.","explanation":"","label":""}],"sampleInput":"5\n123s\nzheshi.wodepw\n1234.5678\nWanMei23333\npass*word.6","sampleOutput":"Your password is tai duan le.\nYour password needs shu zi.\nYour password needs zi mu.\nYour password is wan mei.\nYour password is tai luan le.","idea":["非空字符串,每个字符串以回车结束,但是字符串里面可能会有空格,所以不能直接用cin,要用getline接收一行字符。在接收完n后要getchar()读取一下换行符才能用getline,否则换行符会被读进getline中~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003ccctype>\n\n// 解题关键：非空字符串,每个字符串以回车结束,但是字符串里面可能会有空格,所以不能直接用cin,要用getline接收一行字符\nusing namespace std;\nint main() {\n   int n;\n\n   cin >> n; getchar();\n   for (int i = 0; i \u003c n; i++) {\n      string s;\n      getline(cin, s);\n      if (s.length() >= 6) {\n         int invalid = 0, hasAlpha = 0, hasNum = 0;\n         for (int j = 0; j \u003c s.length(); j++) {\n             if (s[j] != '.' && !isalnum(s[j])) invalid = 1;\n             else if (isalpha(s[j])) hasAlpha = 1;\n             else if (isdigit(s[j])) hasNum = 1;\n\n         }\n         if (invalid == 1) cout \u003c\u003c \"Your password is tai luan le.\\n\";\n         else if (hasNum == 0) cout \u003c\u003c \"Your password needs shu zi.\\n\";\n         else if (hasAlpha == 0) cout \u003c\u003c \"Your password needs zi mu.\\n\";\n         else cout \u003c\u003c \"Your password is wan mei.\\n\";\n      } else\n         cout \u003c\u003c \"Your password is tai duan le.\\n\";\n   }\n   return 0;\n\n}"},{"id":"1082","title":"射击比赛","score":20,"category":"逻辑题","description":["本题目给出的射击比赛的规则非常简单,谁打的弹洞距离靶心最近,谁就是冠军;谁差得最远,谁就是菜鸟。本题给出一系列弹洞的平面坐标(x,y),请你编写程序找出冠军和菜鸟。我们假设靶心在原点(0,0)。"],"input":"输入在第一行中给出一个正整数 N(\u003c= 10 000)。随后 N 行,每行按下列格式给出:ID x y其中 ID 是运动员的编号(由4位数字组成);x 和 y 是其打出的弹洞的平面坐标(x,y),均为整数,且 0\u003c= |x|, |y| \u003c= 100。题目保证每个运动员的编号不重复,且每人只打 1 枪。","output":"输出冠军和菜鸟的编号,中间空 1 格。题目保证他们是唯一的。","samples":[{"input":"3\n0001 5 7\n1020 -1 3\n0233 0 -1","output":"0233 0001","explanation":"","label":""}],"sampleInput":"3\n0001 5 7\n1020 -1 3\n0233 0 -1","sampleOutput":"0233 0001","idea":["1、注意n=1的情况,即冠军和菜鸟都是同一个人的情况(第二个测试点)2.、注意距离越大的越菜~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：1、注意n=1的情况,即冠军和菜鸟都是同一个人的情况(第二个测试点)2.、注意距离越大的越菜\nusing namespace std;\nint main() {\n\n   int n, id, x, y, maxid, maxdis = -1, minid, mindis = 99999;\n   cin >> n;\n   for (int i = 0; i \u003c n; i++) {\n      cin >> id >> x >> y;\n      int dis = x * x + y * y;\n      if (dis > maxdis) maxid = id;\n      if (dis \u003c mindis) minid = id;\n      maxdis = max(maxdis, dis);\n      mindis = min(mindis, dis);\n   }\n\n   printf(\"%04d %04d\", minid, maxid);\n   return 0;\n}"},{"id":"1083","title":"是否存在相等的差","score":20,"category":"hash映射,map STL","description":["给定 N 张卡片,正面分别写上 1、2、......、N,然后全部翻面,洗牌,在背面分别写上 1、2、......、N。将每张牌的正反两面数字相减(大减小),得到 N 个非负差值,其中是否存在相等的差?"],"input":"输入第一行给出一个正整数 N(2 \u003c= N \u003c= 10000),随后一行给出 1 到 N 的一个洗牌后的排列,第 i个数表示正面写了 i 的那张卡片背面的数字。","output":"按照“差值 重复次数”的格式从大到小输出重复的差值及其重复的次数,每行输出一个结果。","samples":[{"input":"8\n3 5 8 6 2 1 4 7","output":"5 2\n3 3\n2 2","explanation":"","label":""}],"sampleInput":"8\n3 5 8 6 2 1 4 7","sampleOutput":"5 2\n3 3\n2 2","idea":["所有差值出现的次数保存在a数组中,从后往前输出所有出现的次数>=2的值~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：所有差值出现的次数保存在a数组中,从后往前输出所有出现的次数>=2的值\nusing namespace std;\n\nint main() {\n   int n, t, a[10000] = {0};\n   cin >> n;\n   for (int i = 1; i \u003c= n; i++) {\n      cin >> t;\n      a[abs(t-i)]++;\n   }\n   for (int i = 9999; i >= 0; i--)\n      if (a[i] >= 2) cout \u003c\u003c i \u003c\u003c \" \" \u003c\u003c a[i] \u003c\u003c endl;\n   return 0;\n\n}"},{"id":"1084","title":"外观数列","score":20,"category":"String字符串处理","description":["外观数列是指具有以下特点的整数序列:d, d1, d111, d113, d11231, d112213111,...它从不等于 1 的数字 d 开始,序列的第 n+1 项是对第 n 项的描述。比如第 2 项表示第 1 项有 1 个 d,所以就是 d1;第 2 项是 1 个 d(对应 d1)和 1 个 1(对应 11),所以第 3 项就是 d111。又比如第 4 项是 d113,其描述就是 1 个 d,2 个 1,1 个 3,所以下一项就是 d11231。当然这个定义对 d = 1 也成立。本题要求你推算任意给定数字 d 的外观数列的第 N 项。"],"input":"输入第一行给出[0,9]范围内的一个整数 d、以及一个正整数 N(\u003c=40),用空格分隔。","output":"在一行中给出数字 d 的外观数列的第 N 项。","samples":[{"input":"1 8","output":"1123123111","explanation":"","label":""}],"sampleInput":"1 8","sampleOutput":"1123123111","idea":["用string s接收所需变幻的数字,每次遍历s,从当前位置i开始,看后面有多少个与s[i]相同,设j处开始不相同,那么临时字符串 t += s[i] + to_string(j – i);然后再将t赋值给s,cnt只要没达到n次就继续加油循环下一次,最后输出s的值~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：用string s接收所需变幻的数字,每次遍历s,从当前位置i开始,看后面有多少个与s[i]相同,设j处开始不相同,那么临时字符串 t += s[i] + to_string(j – i);然后再将t赋值给s,cnt只要\nusing namespace std;\nint main() {\n   string s;\n   int n, j;\n   cin >> s >> n;\n   for (int cnt = 1; cnt \u003c n; cnt++) {\n      string t;\n\n      for (int i = 0; i \u003c s.length(); i = j) {\n         for (j = i; j \u003c s.length() && s[j] == s[i]; j++);\n         t += s[i] + to_string(j - i);\n      }\n      s = t;\n   }\n   cout \u003c\u003c s;\n   return 0;\n}"},{"id":"1085","title":"PAT单位排行","score":25,"category":"排序,map STL","description":["每次 PAT 考试结束后,考试中心都会发布一个考生单位排行榜。本题就请你实现这个功能。"],"input":"输入第一行给出一个正整数N(\u003c=105),即考生人数。随后N行,每行按下列格式给出一个考生的信息:准考证号 得分 学校其中“准考证号”是由6个字符组成的字符串,其首字母表示考试的级别:“B”代表乙级,“A”代表甲级,“T”代表顶级;“得分”是 [0,100] 区间内的整数;“学校”是由不超过6个英文字母组成的单位码(大小写无关)。注意:题目保证每个考生的准考证号是不同的。","output":"首先在一行中输出单位个数。随后按以下格式非降序输出单位的排行榜:排名 学校 加权总分 考生人数其中“排名”是该单位的排名(从1开始);“学校”是全部按小写字母输出的单位码;“加权总分”定义为“乙级总分/1.5 + 甲级总分 + 顶级总分*1.5”的整数部分;“考生人数”是该属于单位的考生的总人数。\n\n学校首先按加权总分排行。如有并列,则应对应相同的排名,并按考生人数升序输出。如果仍然并列,则按单位码的字典序输出。","samples":[{"input":"10\nA57908 85 Au\nB57908 54 LanX\nA37487 60 au\nT28374 67 CMU\nT32486 24 hypu\nA66734 92 cmu\nB76378 71 AU\nA47780 45 lanx\nA72809 100 pku\nA03274 45 hypu","output":"5\n1 cmu 192 2\n1 au 192 3\n3 pku 100 1\n4 hypu 81 2\n4 lanx 81 2","explanation":"","label":""}],"sampleInput":"10\nA57908 85 Au\nB57908 54 LanX\nA37487 60 au\nT28374 67 CMU\nT32486 24 hypu\nA66734 92 cmu\nB76378 71 AU\nA47780 45 lanx\nA72809 100 pku\nA03274 45 hypu","sampleOutput":"5\n1 cmu 192 2\n1 au 192 3\n3 pku 100 1\n4 hypu 81 2\n4 lanx 81 2","idea":["两个map,一个cnt用来存储某学校名称对应的参赛人数,另一个sum计算某学校名称对应的总加权成绩。每次学校名称string school都要转化为全小写,将map中所有学校都保存在vector ans中,类型为node,node中包括学校姓名、加权总分、参赛人数。对ans数组排序,根据题目要求写好cmp函数,最后按要求输出。","对于排名的处理:设立pres表示前一个学校的加权总分,如果pres和当前学校的加权总分不同,说明rank等于数组下标+1,否则rank不变~注意:总加权分数取整数部分是要对最后的总和取整数部分,不能每次都直接用int存储,不然会有一个3分测试点不通过~PS: 更新后的pat系统会导致之前使用map的代码最后一个测试点超时,更改为unordered_map即可AC~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n#include \u003ccctype>\n#include \u003cvector>\n\n// 解题关键：两个map,一个cnt用来存储某学校名称对应的参赛人数,另一个sum计算某学校名称对应的总加权成绩\n\n#include \u003cunordered_map>\nusing namespace std;\nstruct node {\n   string school;\n   int tws, ns;\n\n};\nbool cmp(node a, node b) {\n   if (a.tws != b.tws)\n      return a.tws > b.tws;\n   else if (a.ns != b.ns)\n      return a.ns \u003c b.ns;\n   else\n      return a.school \u003c b.school;\n}\nint main() {\n\n   int n;\n   scanf(\"%d\", &n);\n   unordered_map\u003cstring, int> cnt;\n   unordered_map\u003cstring, double> sum;\n   for (int i = 0; i \u003c n; i++) {\n      string id, school;\n      cin >> id;\n      double score;\n      scanf(\"%lf\", &score);\n\n      cin >> school;\n      for (int j = 0; j \u003c school.length(); j++)\n         school[j] = tolower(school[j]);\n      if (id[0] == 'B')\n         score = score / 1.5;\n      else if (id[0] == 'T')\n         score = score * 1.5;\n      sum[school] += score;\n      cnt[school]++;\n   }\n\n   vector\u003cnode> ans;\n   for (auto it = cnt.begin(); it != cnt.end(); it++)\n      ans.push_back(node{it->first, (int)sum[it->first], cnt[it->first]});\n   sort(ans.begin(), ans.end(), cmp);\n   int rank = 0, pres = -1;\n   printf(\"%d\\n\", (int)ans.size());\n   for (int i = 0; i \u003c ans.size(); i++) {\n      if (pres != ans[i].tws) rank = i + 1;\n      pres = ans[i].tws;\n\n      printf(\"%d \", rank);\n      cout \u003c\u003c ans[i].school;\n      printf(\" %d %d\\n\", ans[i].tws, ans[i].ns);\n   }\n   return 0;\n}"},{"id":"1086","title":"就不告诉你","score":15,"category":"字符串处理","description":["做作业的时候,邻座的小盆友问你:“五乘以七等于多少?”你应该不失礼貌地围笑着告诉他:“五十三。”本题就要求你,对任何一对给定的正整数,倒着输出它们的乘积。"],"input":"输入在第一行给出两个不超过 1000 的正整数 A 和 B,其间以空格分隔。","output":"在一行中倒着输出 A 和 B 的乘积。","samples":[{"input":"5 7","output":"53","explanation":"","label":""}],"sampleInput":"5 7","sampleOutput":"53","idea":["a 和 b的乘积转换成字符串,再将字符串反转,最后将反转过的字符串转换成数字~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstring>\n#include \u003calgorithm>\n\n// 解题关键：a 和 b的乘积转换成字符串,再将字符串反转,最后将反转过的字符串转换成数字\nusing namespace std;\nint main() {\n   int a, b;\n   scanf(\"%d %d\", &a, &b);\n   string s = to_string(a * b);\n\n   reverse(s.begin(), s.end());\n   printf(\"%d\", stoi(s));\n   return 0;\n}"},{"id":"1087","title":"有多少不同的值","score":20,"category":"逻辑题","description":["当自然数 n 依次取 1、2、3、......、N 时,算式 ⌊n/2⌋+⌊n/3⌋+⌊n/5⌋ 有多少个不同的值?(注:⌊x⌋为取整函数,表示不超过 x 的最大自然数,即 x 的整数部分。)"],"input":"输入给出一个正整数 N(2≤N≤10^4)。","output":"在一行中输出题面中算式取到的不同值的个数。","samples":[{"input":"2017","output":"1480","explanation":"","label":""}],"sampleInput":"2017","sampleOutput":"1480","idea":["把i/2 + i/3 + i/n的值插入到set中,输出set的size就是算式中不同值的个数~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cset>\n\n// 解题关键：把i/2 + i/3 + i/n的值插入到set中,输出set的size就是算式中不同值的个数\n\nusing namespace std;\nint main() {\n   int n;\n   scanf(\"%d\", &n);\n   set\u003cint> s;\n   for (int i = 1; i \u003c= n; i++)\n      s.insert(i / 2 + i / 3 + i / 5);\n   printf(\"%d\", s.size());\n   return 0;\n\n}"},{"id":"1088","title":"三人行","score":20,"category":"逻辑题","description":["子曰:“三人行,必有我师焉。择其善者而从之,其不善者而改之。”本题给定甲、乙、丙三个人的能力值关系为:甲的能力值确定是 2 位正整数;把甲的能力值的 2 个数字调换位置就是乙的能力值;甲乙两人能力差是丙的能力值的 X 倍;乙的能力值是丙的 Y 倍。请你指出谁比你强应“从之”,谁比你弱应“改之”。"],"input":"输入在一行中给出三个数,依次为:M(你自己的能力值)、X 和 Y。三个数字均为不超过 1000 的正整数。","output":"在一行中首先输出甲的能力值,随后依次输出甲、乙、丙三人与你的关系:如果其比你强,输出Cong;平等则输出 Ping;比你弱则输出 Gai。其间以 1 个空格分隔,行首尾不得有多余空格。\n\n注意:如果解不唯一,则以甲的最大解为准进行判断;如果解不存在,则输出 No Solution。","samples":[{"input":"48 3 7","output":"48 Ping Cong Gai","explanation":"","label":"1"},{"input":"48 11 6","output":"No Solution","explanation":"","label":"2"}],"sampleInput":"48 3 7","sampleOutput":"48 Ping Cong Gai","idea":["丙不一定是int值,可能是4.5这样的数字~所以要用double存储丙~i、j、k分别代表甲乙丙~i从99遍历到10找到符合题意的那个数字即可~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003ccmath>\n\n// 解题关键：丙不一定是int值,可能是4.5这样的数字\nusing namespace std;\nint m, x, y;\nvoid print(double t) {\n   if (m == t) printf(\" Ping\");\n   else if (m \u003c t) printf(\" Cong\");\n   else printf(\" Gai\");\n}\nint main() {\n\n   scanf(\"%d %d %d\", &m, &x, &y);\n   for (int i = 99; i >= 10; i--) {\n      int j = i % 10 * 10 + i / 10;\n      double k = abs(j - i) * 1.0 / x;\n      if (j == k * y) {\n         cout \u003c\u003c i;\n         print(i); print(j); print(k);\n         return 0;\n      }\n\n   }\n   cout \u003c\u003c \"No Solution\";\n   return 0;\n}"},{"id":"1089","title":"狼人杀-简单版","score":20,"category":"逻辑题","description":["以下文字摘自《灵机一动·好玩的数学》:“狼人杀”游戏分为狼人、好人两大阵营。在一局“狼人杀”游戏中,1 号玩家说:“2 号是狼人”,2 号玩家说:“3 号是好人”,3 号玩家说:“4 号是狼人”,4 号玩家说:“5 号是好人”,5 号玩家说:“4 号是好人”。已知这 5 名玩家中有 2 人扮演狼人角色,有 2 人说的不是实话,有狼人撒谎但并不是所有狼人都在撒谎。扮演狼人角色的是哪两号玩家?本题是这个问题的升级版:已知 N 名玩家中有 2 人扮演狼人角色,有 2 人说的不是实话,有狼人撒谎但并不是所有狼人都在撒谎。要求你找出扮演狼人角色的是哪几号玩家?"],"input":"输入在第一行中给出一个正整数 N(5≤N≤100)。随后 N 行,第 i 行给出第 i 号玩家说的话(1≤i≤N),即一个玩家编号,用正号表示好人,负号表示狼人。","output":"如果有解,在一行中按递增顺序输出 2 个狼人的编号,其间以空格分隔,行首尾不得有多余空格。如果解不唯一,则输出最小序列解 —— 即对于两个序列 A=a[1],...,a[M] 和 B=b[1],...,b[M],若存在0≤k[k+1]\u003cb[k+1],则称序列 A 小于序列 B。若无解则输出 No Solution。","samples":[{"input":"5\n-2\n+3\n-4\n+5\n+4","output":"1 4","explanation":"","label":"1"},{"input":"6\n+6\n+3\n+1\n-5\n-2\n+4","output":"1 5","explanation":"","label":"2"},{"input":"5\n-2\n-3\n-4\n-5\n-1","output":"No Solution","explanation":"","label":"3"}],"sampleInput":"5\n-2\n+3\n-4\n+5\n+4","sampleOutput":"1 4","idea":["每个人说的数字保存在v数组中,i从1~n、j从i+1~n遍历,分别假设i和j是狼人,a数组表示该人是狼人还是好人,等于1表示是好人,等于-1表示是狼人。k从1~","n分别判断k所说的话是真是假,k说的话和真实情况不同(即v[k] * a[abs(v[k])] \u003c 0)则表示k在说谎,则将k放在lie数组中;遍历完成后判断lie数组,如果说谎人数等于2并且这两个说谎的人一个是好人一个是狼人(即a[lie[0]] + a[lie[1]] ==0)表示满足题意,此时输出i和j并return,否则最后的时候输出No Solution~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003ccmath>\n\n// 解题关键：每个人说的数字保存在v数组中,i从1\nusing namespace std;\n\nint main() {\n   int n;\n   cin >> n;\n   vector\u003cint> v(n+1);\n   for (int i = 1; i \u003c= n; i++) cin >> v[i];\n   for (int i = 1; i \u003c= n; i++) {\n      for (int j = i + 1; j \u003c= n; j++) {\n         vector\u003cint> lie, a(n + 1, 1);\n         a[i] = a[j] = -1;\n         for (int k = 1; k \u003c= n; k++)\n\n             if (v[k] * a[abs(v[k])] \u003c 0) lie.push_back(k);\n         if (lie.size() == 2 && a[lie[0]] + a[lie[1]] == 0) {\n             cout \u003c\u003c i \u003c\u003c \" \" \u003c\u003c j;\n             return 0;\n         }\n      }\n   }\n   cout \u003c\u003c \"No Solution\";\n   return 0;\n}"},{"id":"1090","title":"危险品装箱","score":25,"category":"STL-map的应用","description":["集装箱运输货物时,我们必须特别小心,不能把不相容的货物装在一只箱子里。比如氧化剂绝对不能跟易燃液体同箱,否则很容易造成爆炸。","本题给定一张不相容物品的清单,需要你检查每一张集装箱货品清单,判断它们是否能装在同一只箱子里。"],"input":"输入第一行给出两个正整数:N (≤10^4) 是成对的不相容物品的对数;M (≤100) 是集装箱货品清单的单数。\n\n随后数据分两大块给出。第一块有 N 行,每行给出一对不相容的物品。第二块有 M 行,每行给出一箱货物的清单,格式如下:K G[1] G[2]... G[K]其中 K (≤1000) 是物品件数,G[i] 是物品的编号。简单起见,每件物品用一个 5 位数的编号代表。两个数字之间用空格分隔。","output":"对每箱货物清单,判断是否可以安全运输。如果没有不相容物品,则在一行中输出 Yes,否则输出No。","samples":[{"input":"6 3\n20001 20002\n20003 20004\n20005 20006\n20003 20001\n20005 20004\n20004 20006\n4 00001 20004 00002 20003\n5 98823 20002 20003 20006 10010\n3 12345 67890 23333","output":"No\nYes\nYes","explanation":"","label":""}],"sampleInput":"6 3\n20001 20002\n20003 20004\n20005 20006\n20003 20001\n20005 20004\n20004 20006\n4 00001 20004 00002 20003\n5 98823 20002 20003 20006 10010\n3 12345 67890 23333","sampleOutput":"No\nYes\nYes","idea":["用map存储每一个货物的所有不兼容货物~在判断给出的一堆货物是否是相容的时候,判断任一货物的不兼容货物是否在这堆货物中~如果存在不兼容的货物,则这堆货物不能相容~如果遍历完所有的货物,都找不到不兼容的两个货物,则这堆货物就是兼容的~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：用map存储每一个货物的所有不兼容货物\n\n#include \u003cvector>\n#include \u003cmap>\nusing namespace std;\nint main() {\n   int n, k, t1, t2;\n   map\u003cint,vector\u003cint>> m;\n   scanf(\"%d%d\", &n, &k);\n   for (int i = 0; i \u003c n; i++) {\n      scanf(\"%d%d\", &t1, &t2);\n      m[t1].push_back(t2);\n\n      m[t2].push_back(t1);\n   }\n   while (k--) {\n      int cnt, flag = 0, a[100000] = {0};\n      scanf(\"%d\", &cnt);\n\n      vector\u003cint> v(cnt);\n      for (int i = 0; i \u003c cnt; i++) {\n         scanf(\"%d\", &v[i]);\n         a[v[i]] = 1;\n      }\n      for (int i = 0; i \u003c v.size(); i++)\n         for (int j = 0; j \u003c m[v[i]].size(); j++)\n             if (a[m[v[i]][j]] == 1) flag = 1;\n      printf(\"%s\\n\",flag ? \"No\" :\"Yes\");\n   }\n\n   return 0;\n}"},{"id":"1091","title":"N-自守数","score":15,"category":"逻辑题","description":["如果某个数 K 的平方乘以 N 以后,结果的末尾几位数等于 K,那么就称这个数为“N-自守数”。例如3×922 = 25392,而 25392 的末尾两位正好是 92,所以 92 是一个 3-自守数。","本题就请你编写程序判断一个给定的数字是否关于某个 N 是 N-自守数。"],"input":"输入在第一行中给出正整数 M(≤20),随后一行给出 M 个待检测的、不超过 1000 的正整数。","output":"对每个需要检测的数字,如果它是 N-自守数就在一行中输出最小的 N 和 NK2 的值,以一个空格隔开;否则输出 No。注意题目保证 N\u003c10。","samples":[{"input":"3\n92 5 233","output":"3 25392\n1 25\nNo","explanation":"","label":""}],"sampleInput":"3\n92 5 233","sampleOutput":"3 25392\n1 25\nNo","idea":["从1-9枚举,判断是否存在N。通过to_string把乘积转成字符串,再通过substr取末尾子串比较即可~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstring>\n\n// 解题关键：从1-9枚举,判断是否存在N\nusing namespace std;\nint main() {\n   int m;\n\n   cin >> m;\n   while (m--) {\n      int k, flag = 0;\n      cin >> k;\n      for (int n = 1; n \u003c 10; n++) {\n         int mul = n * k * k;\n         string smul = to_string(mul), sk = to_string(k);\n         string smulend = smul.substr(smul.length() - sk.length());\n         if (smulend == sk) {\n             printf(\"%d %d\\n\", n, mul);\n\n             flag = 1;\n             break;\n         }\n      }\n      if (flag == 0) printf(\"No\\n\");\n   }\n   return 0;\n}"},{"id":"1092","title":"最好吃的月饼","score":20,"category":"二维数组","description":["月饼是久负盛名的中国传统糕点之一,自唐朝以来,已经发展出几百品种。","若想评比出一种“最好吃”的月饼,那势必在吃货界引发一场腥风血雨...... 在这里我们用数字说话,给出全国各地各种月饼的销量,要求你从中找出销量冠军,认定为最好吃的月饼。"],"input":"输入首先给出两个正整数 N(≤1000)和 M(≤100),分别为月饼的种类数(于是默认月饼种类从 1 到N 编号)和参与统计的城市数量。\n\n接下来 M 行,每行给出 N 个非负整数(均不超过 1 百万),其中第 i 个整数为第 i 种月饼的销量(块)。数字间以空格分隔。","output":"在第一行中输出最大销量,第二行输出销量最大的月饼的种类编号。如果冠军不唯一,则按编号递增顺序输出并列冠军。数字间以 1 个空格分隔,行首尾不得有多余空格。","samples":[{"input":"5 3\n1001 992 0 233 6\n8 0 2018 0 2008\n36 18 0 1024 4","output":"2018\n3 5","explanation":"","label":""}],"sampleInput":"5 3\n1001 992 0 233 6\n8 0 2018 0 2008\n36 18 0 1024 4","sampleOutput":"2018\n3 5","idea":["用sum数组统计每种月饼的总销量,并且求出最大销量。然后遍历每种月饼的销量,等于最大值的就保存输出~"],"keyPoints":["先根据题目约束确定数据结构与变量范围。","样例通过后还要检查最小输入、最大输入和特殊分支。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：用sum数组统计每种月饼的总销量,并且求出最大销量\nusing namespace std;\nint sum[1005];\nint main() {\n   int m, n, temp, maxn = 0;\n   vector\u003cint> ans;\n   cin >> m >> n;\n   for (int i = 1; i \u003c= n; i++) {\n\n      for (int j = 1; j \u003c= m; j++) {\n         cin >> temp;\n         sum[j] += temp;\n         maxn = max(maxn, sum[j]);\n      }\n   }\n   cout \u003c\u003c maxn \u003c\u003c endl;\n   for (int i = 1; i \u003c= m; i++)\n      if (sum[i] == maxn) ans.push_back(i);\n   for (int i = 0; i \u003c ans.size(); i++) {\n\n      if (i != 0) cout \u003c\u003c \" \";\n\n      cout \u003c\u003c ans[i];\n   }\n   return 0;\n}"},{"id":"1093","title":"字符串A+B","score":20,"category":"字符串处理","description":["给定两个字符串 A 和 B,本题要求你输出 A+B,即两个字符串的并集。要求先输出 A,再输出 B,但重复的字符必须被剔除。"],"input":"输入在两行中分别给出 A 和 B,均为长度不超过 10^6 的、由可见 ASCII 字符 (即码32~126)和空格组成的、由回车标识结束的非空字符串。","output":"在一行中输出题面要求的 A 和 B 的和。","samples":[{"input":"This is a sample test\nto show you_How it works","output":"This ampletowyu_Hrk","explanation":"","label":""}],"sampleInput":"This is a sample test\nto show you_How it works","sampleOutput":"This ampletowyu_Hrk","idea":["求出两个字符串的并集,按照原有顺序输出。意思是按顺序输出,第一次出现的所有字符。用数组hash标记一下是否是第一次输出即可(字符本身是一个ASCII码值,可当作整数用)"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：求出两个字符串的并集,按照原有顺序输出\nusing namespace std;\nint main() {\n   string s1, s2, s;\n   int hash[200] = {0};\n   getline(cin, s1);\n   getline(cin, s2);\n\n   s = s1 + s2;\n   for (int i = 0; i \u003c s.size(); i++) {\n      if (hash[s[i]] == 0) cout \u003c\u003c s[i];\n      hash[s[i]] = 1;\n   }\n   return 0;\n}"},{"id":"1094","title":"谷歌的招聘","score":20,"category":"字符串处理","description":["2004 年 7 月,谷歌在硅谷的 101 号公路边竖立了一块巨大的广告牌(如下图)用于招聘。内容超级简单,就是一个以.com 结尾的网址,而前面的网址是一个 10 位素数,这个素数是自然常数 e 中最早出现的 10 位连续数字。能找出这个素数的人,就可以通过访问谷歌的这个网站进入招聘流程的下一步。","自然常数 e 是一个著名的超越数,前面若干位写出来是这样的:e =2.7182818284590452353602874713526624977572470936999595749669676277240766303535475945713821 78525166427427466391932003059921... 其中粗体标出的 10 位数就是答案。","本题要求你编程解决一个更通用的问题:从任一给定的长度为 L 的数字中,找出最早出现的 K 位连续数字所组成的素数。"],"input":"输入在第一行给出 2 个正整数,分别是 L(不超过 1000 的正整数,为数字长度)和 K(小于 10 的正整数)。接下来一行给出一个长度为 L 的正整数 N。","output":"在一行中输出 N 中最早出现的 K 位连续数字所组成的素数。如果这样的素数不存在,则输出 404。注意,原始数字中的前导零也计算在位数之内。例如在 200236 中找 4 位素数,0023 算是解;但第一位 2不能被当成 0002 输出,因为在原始数字中不存在这个 2 的前导零。","samples":[{"input":"20 5\n23654987725541023819","output":"49877","explanation":"","label":"1"},{"input":"10 3\n2468024680","output":"404","explanation":"","label":"2"}],"sampleInput":"20 5\n23654987725541023819","sampleOutput":"49877","idea":["给出一个l长度的字符串,求出其中第一个k位的素数分析: 枚举每个k位的子串,转换成整数,判断是否是素数(判断素数的时候要把0和1也考虑进去)~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstring>\n\n// 解题关键：给出一个l长度的字符串,求出其中第一个k位的素数分析: 枚举每个k位的子串,转换成整数,判断是否是素数(判断素数的时候要把0和1也考虑进去)\nusing namespace std;\n\nbool isPrime(int n) {\n   if (n == 0 || n == 1) return false;\n   for (int i = 2; i * i \u003c= n; i++)\n      if (n % i == 0) return false;\n   return true;\n}\nint main() {\n   int l, k;\n   string s;\n   cin >> l >> k >> s;\n\n   for (int i = 0; i \u003c= l - k; i++) {\n      string t = s.substr(i, k);\n      int num = stoi(t);\n      if (isPrime(num)) {\n         cout \u003c\u003c t;\n         return 0;\n      }\n   }\n   cout \u003c\u003c \"404\\n\";\n\n   return 0;\n}"},{"id":"1095","title":"解码PAT准考证","score":25,"category":"模拟,排序,map","description":["PAT 准考证号由 4 部分组成:第 1 位是级别,即 T 代表顶级;A 代表甲级;B 代表乙级;第 2~4 位是考场编号,范围从 101 到 999;第 5~10 位是考试日期,格式为年、月、日顺次各占 2 位;最后 11~13 位是考生编号,范围从 000 到 999。","现给定一系列考生的准考证号和他们的成绩,请你按照要求输出各种统计信息。"],"input":"输入首先在一行中给出两个正整数 N(≤10^4)和 M(≤100),分别为考生人数和统计要求的个数。\n\n接下来 N 行,每行给出一个考生的准考证号和其分数(在区间 [0,100] 内的整数),其间以空格分隔。\n\n考生信息之后,再给出 M 行,每行给出一个统计要求,格式为:类型 指令,其中类型 为 1 表示要求按分数非升序输出某个指定级别的考生的成绩,对应的 指令 则给出代表指定级别的字母;类型 为 2 表示要求将某指定考场的考生人数和总分统计输出,对应的 指令 则给出指定考场的编号;类型 为 3 表示要求将某指定日期的考生人数分考场统计输出,对应的 指令 则给出指定日期,格式与准考证上日期相同。","output":"对每项统计要求,首先在一行中输出 Case #: 要求,其中 # 是该项要求的编号,从 1 开始;要求 即复制输入给出的要求。随后输出相应的统计结果:类型 为 1 的指令,输出格式与输入的考生信息格式相同,即 准考证号 成绩。对于分数并列的考生,按其准考证号的字典序递增输出(题目保证无重复准考证号);类型 为 2 的指令,按 人数 总分 的格式输出;类型 为 3 的指令,输出按人数非递增顺序,格式为 考场编号 总人数。若人数并列则按考场编号递增顺序输出。\n\n如果查询结果为空,则输出 NA。","samples":[{"input":"8 4\nB123180908127 99\nB102180908003 86\nA112180318002 98\nT107150310127 62\nA107180908108 100\nT123180908010 78\nB112160918035 88\nA107180908021 98\n1 A\n2 107\n3 180908\n2 999","output":"Case 1: 1 A\nA107180908108 100\nA107180908021 98\nA112180318002 98\nCase 2: 2 107\n3 260\nCase 3: 3 180908\n107 2\n123 2\n102 1\nCase 4: 2 999\nNA","explanation":"","label":""}],"sampleInput":"8 4\nB123180908127 99\nB102180908003 86\nA112180318002 98\nT107150310127 62\nA107180908108 100\nT123180908010 78\nB112160918035 88\nA107180908021 98\n1 A\n2 107\n3 180908\n2 999","sampleOutput":"Case 1: 1 A\nA107180908108 100\nA107180908021 98\nA112180318002 98\nCase 2: 2 107\n3 260\nCase 3: 3 180908\n107 2\n123 2\n102 1\nCase 4: 2 999\nNA","idea":["给出一组学生的准考证号和成绩,准考证号包含了等级(乙甲顶),考场号,日期,和个人编号信息,并有三种查询方式查询一:给出考试等级,找出该等级的考生,按照成绩降序,准考证升序排序查询二:给出考场号,统计该考场的考生数量和总得分查询三:给出考试日期,查询改日期下所有考场的考试人数,按照人数降序,考场号升序排序分析:先把所有考生的准考证和分数记录下来~","1、按照等级查询,枚举选取匹配的学生,然后排序即可2、按照考场查询,枚举选取匹配的学生,然后计数、求和3、按日期查询每个考场人数,用unordered_map存储,最后排序汇总~注意:1、第三个用map存储会超时,用unordered_map就不会超时啦~2、排序传参建议用引用传参,这样更快,虽然有时候不用引用传参也能通过,但还是尽量用,养成好习惯~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cunordered_map>\n\n// 解题关键：给出一组学生的准考证号和成绩,准考证号包含了等级(乙甲顶),考场号,日期,和个人编号信息,并有三种查询方式查询一:给出考试等级,找出该等级的考生,按照成绩降序,准考证升序排序查询二:给出考场号,统计该考场的考生数量和总得\n\n#include \u003calgorithm>\nusing namespace std;\nstruct node {\n   string t;\n   int value;\n\n};\nbool cmp(const node &a, const node &b) {\n   return a.value != b.value ? a.value > b.value : a.t \u003c b.t;\n}\nint main() {\n   int n, k, num;\n   string s;\n   cin >> n >> k;\n   vector\u003cnode> v(n);\n   for (int i = 0; i \u003c n; i++)\n\n      cin >> v[i].t >> v[i].value;\n   for (int i = 1; i \u003c= k; i++) {\n      cin >> num >> s;\n      printf(\"Case %d: %d %s\\n\", i, num, s.c_str());\n      vector\u003cnode> ans;\n      int cnt = 0, sum = 0;\n      if (num == 1) {\n         for (int j = 0; j \u003c n; j++)\n             if (v[j].t[0] == s[0]) ans.push_back(v[j]);\n\n      } else if (num == 2) {\n         for (int j = 0; j \u003c n; j++) {\n             if (v[j].t.substr(1, 3) == s) {\n                cnt++;\n                sum += v[j].value;\n             }\n         }\n         if (cnt != 0) printf(\"%d %d\\n\", cnt, sum);\n      } else if (num == 3) {\n         unordered_map\u003cstring, int> m;\n\n         for (int j = 0; j \u003c n; j++)\n             if (v[j].t.substr(4, 6) == s) m[v[j].t.substr(1, 3)]++;\n         for (auto it : m) ans.push_back({it.first, it.second});\n      }\n      sort(ans.begin(), ans.end(),cmp);\n      for (int j = 0; j \u003c ans.size(); j++)\n         printf(\"%s %d\\n\", ans[j].t.c_str(), ans[j].value);\n      if (((num == 1 || num == 3) && ans.size() == 0) || (num == 2 && cnt\n== 0)) printf(\"NA\\n\");\n\n   }\n   return 0;\n}"},{"id":"1096","title":"大美数","score":15,"category":"逻辑题","description":["若正整数 N 可以整除它的 4 个不同正因数之和,则称这样的正整数为“大美数”。本题就要求你判断任一给定的正整数是否是“大美数”。"],"input":"4输入在第一行中给出正整数 K(≤10),随后一行给出 K 个待检测的、不超过 10 的正整数。","output":"对每个需要检测的数字,如果它是大美数就在一行中输出 Yes,否则输出 No。","samples":[{"input":"3\n18 29 40","output":"Yes\nNo\nYes","explanation":"","label":""}],"sampleInput":"3\n18 29 40","sampleOutput":"Yes\nNo\nYes","idea":["检验每一个输入的数字num,for循环遍历,寻找四个不同的正因数a、b、c、d(假设abcd由小到大),判断四个正因数之和a+b+c+d是否能被num整除(用flag的值表示),flag==1时就直接break退出寻找因数的循环,最后根据flag的值输出Yes或No~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：检验每一个输入的数字num,for循环遍历,寻找四个不同的正因数a、b、c、d(假设abcd由小到大),判断四个正因数之和a+b+c+d是否能被num整除(用flag的值表示),flag==1时就直接break退出寻找因\nusing namespace std;\nint k, num, flag;\nint main() {\n   cin >> k;\n   for (int i = 0; i \u003c k; i++) {\n      cin >> num;\n      flag = 0;\n      for (int a = 1; a \u003c num; a++) {\n\n         if (flag == 1) break;\n         if (num % a != 0) continue;\n         for (int b = a + 1; b \u003c num; b++) {\n             if (flag == 1) break;\n             if (num % b != 0) continue;\n             for (int c = b + 1; c \u003c num; c++) {\n                if (flag == 1) break;\n                if (num % c != 0) continue;\n                for (int d = c + 1; d \u003c= num; d++) {\n                   if (num % d != 0) continue;\n\n                   if ((a + b + c + d) % num == 0) {\n                      flag = 1;\n                      break;\n                   }\n                }\n             }\n\n         }\n      }\n      cout \u003c\u003c (flag ? \"Yes\\n\" : \"No\\n\");\n   }\n   return 0;\n\n}"},{"id":"1097","title":"矩阵行平移","score":20,"category":"逻辑题","description":["给定一个 n×n 的整数矩阵。对任一给定的正整数 k\u003cn,我们将矩阵的奇数行的元素整体向右依次平移1、......、k、1、......、k、...... 个位置,平移空出的位置用整数 x 补。你需要计算出结果矩阵的每一列元素的和。"],"input":"输入第一行给出 3 个正整数:n(\u003c100)、k(\u003cn)、x(\u003c100),分别如题面所述。\n\n接下来 n 行,每行给出 n 个不超过 100 的正整数,为矩阵元素的值。数字间以空格分隔。","output":"在一行中输出平移后第 1 到 n 列元素的和。数字间以 1 个空格分隔,行首尾不得有多余空格。","samples":[{"input":"7 2 99\n11 87 23 67 20 75 89\n37 94 27 91 63 50 11\n44 38 50 26 40 26 24\n73 85 63 28 62 18 68\n15 83 27 97 88 25 43\n23 78 98 20 30 81 99\n77 36 48 59 25 34 22","output":"529 481 479 263 417 342 343","explanation":"","label":""}],"sampleInput":"7 2 99\n11 87 23 67 20 75 89\n37 94 27 91 63 50 11\n44 38 50 26 40 26 24\n73 85 63 28 62 18 68\n15 83 27 97 88 25 43\n23 78 98 20 30 81 99\n77 36 48 59 25 34 22","sampleOutput":"529 481 479 263 417 342 343","idea":["二维数组A存储矩阵,数组Sum存储每列元素的和,cnt表示当前行需要右移多少次。首先将输入元素存储到数组A中,因为偶数行元素始终不变,我们可以将偶数行的每列元素之和先累加后保存在Sum数组中(i&1的解释:是判断i为奇偶数的一种更快方法,因为奇数的二进制最低位为1,偶数为0,那么和1按位与,奇数结果为1,偶数结果为0)。接下来for循环处理每一个奇数行,i从0开始每步+2。","cnt为当前行向右平移的步数,初始值为1。从0到cnt-1列,已经平移后变成了x的值,所以Sum累加x的值;从cnt列到n-1列,Sum[j]累加数组A第i行第j-cnt列的数字A[i][j-cnt](相当于平移)。每次cnt值为cnt%k+1,这样可实现cnt从1、2、...、k、1、2、...、k的循环。最后输出Sum数组的每一个值,就是每一列元素的和~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：二维数组A存储矩阵,数组Sum存储每列元素的和,cnt表示当前行需要右移多少次\nusing namespace std;\nint n, k, x, cnt = 1, Sum[100], A[100][100];\n\nint main() {\n   cin >> n >> k >> x;\n   for (int i = 0; i \u003c n; i++) {\n\n      for (int j = 0; j \u003c n; j++) {\n         cin >> A[i][j];\n         if (i & 1) Sum[j] += A[i][j];\n      }\n   }\n\n   for (int i = 0; i \u003c n; i += 2) {\n      for (int j = 0; j \u003c cnt; j++) Sum[j] += x;\n      for (int j = cnt; j \u003c n; j++) Sum[j] += A[i][j-cnt];\n      cnt = cnt % k + 1;\n   }\n   for (int i = 0; i \u003c n; i++) {\n      if (i) cout \u003c\u003c ' ';\n      cout \u003c\u003c Sum[i];\n   }\n   return 0;\n\n}"},{"id":"1098","title":"岩洞施工","score":20,"category":"逻辑题","description":["要将一条直径至少为 1 个单位的长管道水平送入地形复杂的岩洞中,究竟是否可能?下面的两幅图分别给出了岩洞的剖面图,深蓝色的折线勾勒出岩洞顶部和底部的轮廓。图 1 是有可能的,绿色部分显示直径为 1 的管道可以送入。图 2 就不可能,除非把顶部或底部的突出部分削掉 1 个单位的高度。","本题就请你编写程序,判断给定的岩洞中是否可以施工。"],"input":"输入在第一行给出一个不超过 100 的正整数 N,即横向采样的点数。随后两行数据,从左到右顺次给出采样点的纵坐标:第 1 行是岩洞顶部的采样点,第 2 行是岩洞底部的采样点。这里假设坐标原点在左下角,每个纵坐标为不超过 1000 的非负整数。同行数字间以空格分隔。\n\n题目保证输入数据是合理的,即岩洞底部的轮廓线不会与顶部轮廓线交叉。","output":"如果可以直接施工,则在一行中输出 Yes 和可以送入的管道的最大直径;如果不行,则输出 No 和至少需要削掉的高度。答案和数字间以 1 个空格分隔。","samples":[{"input":"11\n7 6 5 5 6 5 4 5 5 4 4\n3 2 2 2 2 3 3 2 1 2 3","output":"Yes 1","explanation":"","label":"1"},{"input":"11\n7 6 5 5 6 5 4 5 5 4 4\n3 2 2 2 3 4 3 2 1 2 3","output":"No 1","explanation":"","label":"2"}],"sampleInput":"11\n7 6 5 5 6 5 4 5 5 4 4\n3 2 2 2 2 3 3 2 1 2 3","sampleOutput":"Yes 1","idea":["找到上壁的最低点minA、下壁的最高点maxB,如果minA\u003c=minB,则输出No,需要削掉的高度为maxB-minA+1;否则输出Yes,管道的最大直径为minA-maxB~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003calgorithm>\n\n// 解题关键：找到上壁的最低点minA、下壁的最高点maxB,如果minA\u003c=minB,则输出No,需要削掉的高度为maxB-minA+1;否则输出Yes,管道的最大直径为minA-maxB\nusing namespace std;\nint n, a, b, minA = 2000, maxB;\nint main() {\n   cin >> n;\n\n   for (int i = 0; i \u003c n; i++) {\n      cin >> a;\n      minA = min(a, minA);\n   }\n   for (int i = 0; i \u003c n; i++) {\n      cin >> b;\n      maxB = max(b, maxB);\n   }\n   if (minA \u003c= maxB)\n\n      cout \u003c\u003c \"No \" \u003c\u003c maxB - minA + 1;\n   else\n      cout \u003c\u003c \"Yes \" \u003c\u003c minA - maxB;\n   return 0;\n}"},{"id":"1099","title":"性感素数","score":20,"category":"素数","description":["“性感素数”是指形如 (p, p+6) 这样的一对素数。之所以叫这个名字,是因为拉丁语管“六”叫“sex”(即英语的“性感”)。(原文摘自 http://mathworld.wolfram.com/SexyPrimes.html)现给定一个整数,请你判断其是否为一个性感素数。"],"input":"8输入在一行中给出一个正整数 N (≤10)。","output":"若 N 是一个性感素数,则在一行中输出 Yes,并在第二行输出与 N 配对的另一个性感素数(若这样的数不唯一,输出较小的那个)。若 N 不是性感素数,则在一行中输出 No,然后在第二行输出大于 N 的最小性感素数。","samples":[{"input":"47","output":"Yes\n41","explanation":"","label":"1"},{"input":"21","output":"No\n23","explanation":"","label":"2"}],"sampleInput":"47","sampleOutput":"Yes\n41","idea":["is_prime判断是否为素数。判断p和p-6、p和p+6是否同时为素数,如果是,则为性感素数输出Yes。不是的话就从p+1往后找到第一个满足要求的数ans~"],"keyPoints":["判断素数时要单独处理 0、1，并枚举到平方根即可。","连续区间内多次判素时可根据数据规模选择筛法。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003ccmath>\n\n// 解题关键：is_prime判断是否为素数\nusing namespace std;\nint p, ans;\nint is_prime(int x) {\n   if (x \u003c 2) return 0;\n   for (int i = 2; i \u003c= sqrt(x); i++)\n\n      if (x % i == 0) return 0;\n   return 1;\n}\nint main() {\n   cin >> p;\n   if (is_prime(p) && is_prime(p - 6)) {\n      cout \u003c\u003c \"Yes\\n\" \u003c\u003c p - 6;\n   } else if (is_prime(p) && is_prime(p + 6)) {\n      cout \u003c\u003c \"Yes\\n\" \u003c\u003c p + 6;\n   } else {\n\n      for (ans = p + 1; ; ans++) {\n\n         if (is_prime(ans) && is_prime(ans - 6)) break;\n         if (is_prime(ans) && is_prime(ans + 6)) break;\n      }\n      cout \u003c\u003c \"No\\n\" \u003c\u003c ans;\n   }\n\n   return 0;\n}"},{"id":"1100","title":"校庆","score":25,"category":"string字符串处理","description":["2019 年浙江大学将要庆祝成立 122 周年。为了准备校庆,校友会收集了所有校友的身份证号。现在需要请你编写程序,根据来参加校庆的所有人士的身份证号,统计来了多少校友。"],"input":"输入在第一行给出不超过 10^5 的正整数 N,随后 N 行,每行给出一位校友的身份证号(18 位由数字和大写字母X组成的字符串)。题目保证身份证号不重复。\n\n随后给出前来参加校庆的所有人士的信息:首先是一个不超过 10^5 的正整数 M,随后 M 行,每行给出一位人士的身份证号。题目保证身份证号不重复。","output":"首先在第一行输出参加校庆的校友的人数。然后在第二行输出最年长的校友的身份证号 —— 注意身份证第 7-14 位给出的是 yyyymmdd 格式的生日。如果没有校友来,则在第二行输出最年长的来宾的身份证号。题目保证这样的校友或来宾必是唯一的。","samples":[{"input":"5\n372928196906118710\n610481197806202213\n440684198612150417\n13072819571002001X\n150702193604190912\n6\n530125197901260019\n150702193604190912\n220221196701020034\n610481197806202213\n440684198612150417\n370205198709275042","output":"3\n150702193604190912","explanation":"","label":""}],"sampleInput":"5\n372928196906118710\n610481197806202213\n440684198612150417\n13072819571002001X\n150702193604190912\n6\n530125197901260019\n150702193604190912\n220221196701020034\n610481197806202213\n440684198612150417\n370205198709275042","sampleOutput":"3\n150702193604190912","idea":["使用容器set\u003cstring> record存储校友的身份证信息,smallx记录校友中最年长的生日,smalla记录所有人中最年长的生日,ansx记录最年长的校友的身份证号,ansa记录所有人中最年长的人的身份证号,cnt记录有多少校友参加。","将校友身份证存储在set容器record中,使用record.count来判断参加校庆的人是否是校友,使用substr(6, 8)快速提取身份证号中的生日信息,最后根据cnt的值输出~cnt不等于0,则说明有校友参加,输出最年长的校友的身份证号ansx;如果cnt等于0,说明没有校友参加,输出所有人中最年长的人的身份证号ansa~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cset>\n\n// 解题关键：使用容器set\u003cstring> record存储校友的身份证信息,smallx记录校友中最年长的生日,smalla记录所有人中最年长的生日,ansx记录最年长的校友的身份证号,ansa记录所有人中最年长的人的身份证号,c\nusing namespace std;\nint n, m, cnt;\nstring temp, smallx = \"99999999\", smalla = \"99999999\", ansx, ansa;\nset\u003cstring> record;\nint main() {\n   cin >> n;\n   for (int i = 0; i \u003c n; i++) {\n\n      cin >> temp;\n      record.insert(temp);\n   }\n   cin >> m;\n   for (int i = 0; i \u003c m; i++) {\n      cin >> temp;\n      if (record.count(temp)) {\n         cnt++;\n         if (smallx > temp.substr(6, 8)) {\n             smallx = temp.substr(6, 8);\n\n             ansx = temp;\n         }\n      }\n      if (smalla > temp.substr(6, 8)) {\n         smalla = temp.substr(6, 8);\n         ansa = temp;\n      }\n   }\n   cout \u003c\u003c cnt \u003c\u003c endl;\n\n   if (cnt) cout \u003c\u003c ansx;\n   else cout \u003c\u003c ansa;\n   return 0;\n}"},{"id":"1101","title":"B是A的多少倍","score":15,"category":"string字符串处理,stod","description":["设一个数 A 的最低 D 位形成的数是 ad。如果把 ad 截下来移到 A 的最高位前面,就形成了一个新的数 B。B 是 A 的多少倍?例如将 12345 的最低 2 位 45 截下来放到 123 的前面,就得到 45123,它约是12345 的 3.66 倍。"],"input":"9输入在一行中给出一个正整数 A(≤10)和要截取的位数 D。题目保证 D 不超过 A 的总位数。","output":"计算 B 是 A 的多少倍,输出小数点后 2 位。","samples":[{"input":"12345 2","output":"3.66","explanation":"","label":"1"},{"input":"12345 5","output":"1.00","explanation":"","label":"2"}],"sampleInput":"12345 2","sampleOutput":"3.66","idea":["数字A和B分别存储在字符串string a和b中,a的最低d位形成的数所构成的字符串是a.substr(a.size()-d),a的前半部分是a.substr(0, a.size()-d),将这两部分拼接形成新的字符串b,用stod将字符串b和a转换为double类型的数字,输出stod(b)/stod(a)的结果,保留小数点后两位~"],"keyPoints":["注意整行读取与单词读取的区别，空格也可能是有效数据。","涉及字符下标时先确认长度与边界，避免越界访问。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cstring>\n\n// 解题关键：数字A和B分别存储在字符串string a和b中,a的最低d位形成的数所构成的字符串是a.substr(a.size()-d),a的前半部分是a.substr(0, a.size()-d),将这两部分拼接形成新的字符串b\nusing namespace std;\n\nstring a, b;\nint d;\nint main() {\n   cin >> a >> d;\n   b = a.substr(a.size() - d) + a.substr(0, a.size() - d);\n   double ans = stod(b) / stod(a);\n   printf(\"%.2f\", ans);\n   return 0;\n}"},{"id":"1102","title":"教超冠军卷","score":20,"category":"逻辑题","description":["“教育超市”是拼题 A 系统的一个衍生产品,发布了各种试卷和练习供用户选购。在试卷列表中,系统不仅列出了每份试卷的单价,还显示了当前的购买人次。本题就请你根据这些信息找出教育超市所有试卷中的销量(即购买人次)冠军和销售额冠军。"],"input":"4输入首先在第一行中给出一个正整数 N(≤10),随后 N 行,每行给出一份卷子的独特 ID (由小写字母和数字组成的、长度不超过8位的字符串)、单价(为不超过 100 的正整数)和购买人次(为不超6过 10 的非负整数)。","output":"在第一行中输出销量冠军的 ID 及其销量,第二行中输出销售额冠军的 ID 及其销售额。同行输出间以一个空格分隔。题目保证冠军是唯一的,不存在并列。","samples":[{"input":"4\nzju007 39 10\npku2019 9 332\npat2018 95 79\nqdu106 19 38","output":"pku2019 332\npat2018 7505","explanation":"","label":""}],"sampleInput":"4\nzju007 39 10\npku2019 9 332\npat2018 95 79\nqdu106 19 38","sampleOutput":"pku2019 332\npat2018 7505","idea":["maxN记录最多销量,ansN记录销量冠军的ID;销售额等于单价*购买人次,maxS记录最大销售额,ansS记录销售额冠军的ID"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：maxN记录最多销量,ansN记录销量冠军的ID;销售额等于单价*购买人次,maxS记录最大销售额,ansS记录销售额冠军的ID\nusing namespace std;\nint n, a, b, maxN = -1, maxS = -1;\nstring name, ansN, ansS;\nint main() {\n   cin >> n;\n   for (int i = 0; i \u003c n; i++) {\n\n      cin >> name >> a >> b;\n      if (b > maxN) {\n         maxN = b;\n         ansN = name;\n      }\n      if (a * b > maxS) {\n         maxS = a * b;\n         ansS = name;\n      }\n\n   }\n   cout \u003c\u003c ansN \u003c\u003c ' ' \u003c\u003c maxN \u003c\u003c '\\n' \u003c\u003c ansS \u003c\u003c ' ' \u003c\u003c maxS;\n   return 0;\n}"},{"id":"1103","title":"缘分数","score":20,"category":"逻辑题,map","description":["所谓缘分数是指这样一对正整数 a 和 b,其中 a 和它的小弟 a−1 的立方差正好是另一个整数 c 的平方,而 c 正好是 b 和它的小弟 b−1 的平方和。例如 83−73=169=132,而 13=32+22,于是 8 和 3 就是一对缘分数。","给定 a 所在的区间 [m,n],是否存在缘分数?"],"input":"输入给出区间的两个端点 0\u003cm\u003cn≤25000,其间以空格分隔。","output":"按照 a 从小到大的顺序,每行输出一对缘分数,数字间以空格分隔。如果无解,则输出 No Solution。","samples":[{"input":"8 200","output":"8 3\n105 10","explanation":"","label":"1"},{"input":"9 100","output":"No Solution","explanation":"","label":"2"}],"sampleInput":"8 200","sampleOutput":"8 3\n105 10","idea":["遍历m到n区间中的每一个数a,先判断a和它的小弟a-1的立方差d是不是一个平方数,sqrt(d) *sqrt(d) == d则说明其是一个平方数,然后从1开始枚举这个数是不是另外两个数b和b-1的平方和,如果b和b-1的平方和等于a和a-1的立方差的平方根,则输出a和b,并将flag置为1,如果最后flag都为0,则输出No Solution~","这里用映射map\u003clong long, long long> record记录了每一个数b和b-1的平方和的结果,后续如果有碰到之前计算过的平方和,就直接调用map中的结果,不用再次计算~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cmap>\n#include \u003ccmath>\n\n// 解题关键：遍历m到n区间中的每一个数a,先判断a和它的小弟a-1的立方差d是不是一个平方数,sqrt(d) *sqrt(d) == d则说明其是一个平方数,然后从1开始枚举这个数是不是另外两个数b和b-1的平方和,如果b和b-1的\nusing namespace std;\nlong long m, n, a, b, d, c, flag, temp;\nmap\u003clong long, long long> record;\nint main() {\n   cin >> m >> n;\n   for (a = m; a \u003c= n; a++) {\n      d = a * a * a - (a-1) * (a-1) * (a-1), c = sqrt(d);\n\n      if (c * c != d) continue;\n      for (long long b = 1; b \u003c c; b++) {\n         if (record.count(b)) temp = record[b];\n         else {\n             temp = b * b + (b - 1) * (b - 1);\n             record[b] = temp;\n         }\n         if (temp == c) {\n             cout \u003c\u003c a \u003c\u003c ' ' \u003c\u003c b \u003c\u003c '\\n';\n             flag = 1;\n\n             break;\n         }\n      }\n   }\n   if (!flag) cout \u003c\u003c \"No Solution\";\n   return 0;\n}"},{"id":"1104","title":"天长地久","score":20,"category":"结构体,排序,素数","description":["“天长地久数”是指一个 K 位正整数 A,其满足条件为:A 的各位数字之和为 m,A+1 的各位数字之和为 n,且 m 与 n 的最大公约数是一个大于 2 的素数。本题就请你找出这些天长地久数。"],"input":"输入在第一行给出正整数 N(≤5),随后 N 行,每行给出一对 K(3\u003cK\u003c10)和 m(1\u003cm\u003c90),其含义如题面所述。","output":"对每一对输入的 K 和 m,首先在一行中输出 Case X,其中 X 是输出的编号(从 1 开始);然后一行输出对应的 n 和 A,数字间以空格分隔。如果解不唯一,则每组解占一行,按 n 的递增序输出;若仍不唯一,则按 A 的递增序输出。若解不存在,则在一行中输出 No Solution。","samples":[{"input":"2\n6 45\n7 80","output":"Case 1\n10 189999\n10 279999\n10 369999\n10 459999\n10 549999\n10 639999\n10 729999\n10 819999\n10 909999\nCase 2\nNo Solution","explanation":"","label":""}],"sampleInput":"2\n6 45\n7 80","sampleOutput":"Case 1\n10 189999\n10 279999\n10 369999\n10 459999\n10 549999\n10 639999\n10 729999\n10 819999\n10 909999\nCase 2\nNo Solution","idea":["sum记录A的各位数字之和,sum2记录A+1的各位数字之和,I与II分别为数A与A+1。由打表观察可得,所有天长地久数最后两位为”99′′,那么将末尾的两个’9’隐藏后可直接带入暴力循环判断。将所有可能答案存储后排序输出即可~"],"keyPoints":["比较函数必须满足严格弱序，分数相同时继续按题目规定的次关键字排序。","排序前先把参与比较的字段统一计算并保存，避免比较过程中重复计算。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003ccmath>\n#include \u003calgorithm>\n#include \u003cnumeric>\n\n// 解题关键：sum记录A的各位数字之和,sum2记录A+1的各位数字之和,I与II分别为数A与A+1\nusing namespace std;\nstruct node {\n   int n, num;\n   friend bool operator \u003c (const node &a, const node &b) {\n      if (a.n != b.n) return a.n \u003c b.n;\n\n      return a.num \u003c b.num;\n   }\n}T;\nint N, K, m, temp, sum, sum2, I, II;\nvector\u003cnode> A;\nint is_prime(int x) {\n   if (x \u003c= 2) return 0;\n   for (int i = 2; i \u003c= sqrt(x); i++) {\n      if (x % i == 0) return 0;\n\n   }\n   return 1;\n}\n\nint main() {\n   cin >> N;\n   for (int i = 1 ; i \u003c= N; i++) {\n      A.clear();\n      cout \u003c\u003c \"Case \" \u003c\u003c i \u003c\u003c '\\n';\n\n      cin >> K >> m;\n      if (K * 9 \u003c m) cout \u003c\u003c \"No Solution\\n\";\n      else {\n         temp = pow(10, K - 2);\n         for (int i = temp / 10; i \u003c temp; i++) {\n             sum = 18, sum2 = 0, I = i, II = i + 1;\n             while (I) {\n                sum += I % 10;\n                I /= 10;\n                if (sum > m) break;\n\n             }\n             while (II) {\n                sum2 += II % 10;\n                II /= 10;\n             }\n             if (sum == m && is_prime(std::gcd(m, sum2))) {\n                T.n = sum2, T.num = i;\n                A.push_back(T);\n             }\n\n         }\n         sort(A.begin(), A.end());\n         if (A.empty()) cout \u003c\u003c \"No Solution\\n\";\n         for (auto &it : A) {\n             cout \u003c\u003c it.n \u003c\u003c ' ' \u003c\u003c it.num \u003c\u003c \"99\\n\";\n         }\n      }\n   }\n   return 0;\n}"},{"id":"1105","title":"链表合并","score":25,"category":"链表","description":["给定两个单链表 L1=a1→a2→...→an−1→an 和 L2=b1→b2→...→bm−1→bm。如果 n≥2m,你的任务是将比较短的那个链表逆序,然后将之并入比较长的那个链表,得到一个形如 a1→a2→bm→a3→a4→bm−1... 的结果。例如给定两个链表分别为 6→7 和 1→2→3→4→5,你应该输出1→2→7→3→4→6→5。"],"input":"输入首先在第一行中给出两个链表 L1 和 L2 的头结点的地址,以及正整数N (≤10^5),即给定的结点总数。一个结点的地址是一个 5 位数的非负整数,空地址 NULL 用 -1 表示。\n\n随后 N 行,每行按以下格式给出一个结点的信息:Address Data Next其中 Address 是结点的地址,Data 是不超过 10^5 的正整数,Next 是下一个结点的地址。题目保证没有空链表,并且较长的链表至少是较短链表的两倍长。","output":"按顺序输出结果链表,每个结点占一行,格式与输入相同。","samples":[{"input":"00100 01000 7\n02233 2 34891\n00100 6 00001\n34891 3 10086\n01000 1 02233\n00033 5 -1\n10086 4 00033\n00001 7 -1","output":"01000 1 02233\n02233 2 00001\n00001 7 34891\n34891 3 10086\n10086 4 00100\n00100 6 00033\n00033 5 -1","explanation":"","label":""}],"sampleInput":"00100 01000 7\n02233 2 34891\n00100 6 00001\n34891 3 10086\n01000 1 02233\n00033 5 -1\n10086 4 00033\n00001 7 -1","sampleOutput":"01000 1 02233\n02233 2 00001\n00001 7 34891\n34891 3 10086\n10086 4 00100\n00100 6 00033\n00033 5 -1","idea":["用vector\u003cint> L1、L2存储题目中给定的两个链表,vector\u003cint> ans保存合并后的链表。将较长的一个链表存储在L1中,如果原本L1较短,则将L1与L2用swap函数互相置换~在链表合并的过程中,i从0开始,将L1中每个结点添加到ans中,如果当前i是奇数(i & 1不等于0)就把L2的一个结点添加到ans中,直到L2中没有剩余元素~如此反复,就大功告成啦。"],"keyPoints":["先按地址建立结点映射，再沿 next 指针恢复有效链表顺序。","输出地址时通常需要补足 5 位，空地址按题目要求输出。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n#include \u003cvector>\n\n// 解题关键：用vector\u003cint> L1、L2存储题目中给定的两个链表,vector\u003cint> ans保存合并后的链表\nusing namespace std;\nstruct node {\n   int data, next;\n}A[100000];\nvector\u003cint> L1, L2, ans;\nint sa, sb, n, a, ta, tb, c;\nint main() {\n\n   cin >> sa >> sb >> n;\n   for (int i = 0; i \u003c n; i++) {\n      cin >> a >> A[a].data >> A[a].next;\n   }\n   ta = sa;\n   while (ta != -1) {\n      L1.push_back(ta);\n      ta = A[ta].next;\n   }\n   tb = sb;\n\n   while (tb != -1) {\n      L2.push_back(tb);\n      tb = A[tb].next;\n   }\n   if (L1.size() \u003c L2.size()) swap(L1, L2);\n\n   for (int i = 0, c = L2.size() - 1; i \u003c L1.size(); i++) {\n      ans.push_back(L1[i]);\n      if (i & 1 && c >= 0) ans.push_back(L2[c--]);\n   }\n   for (int i = 1; i \u003c ans.size(); i++) {\n      printf(\"%05d %d %05d\\n\", ans[i-1], A[ans[i-1]].data, ans[i]);\n   }\n   printf(\"%05d %d -1\", ans.back(), A[ans.back()].data);\n   return 0;\n}"},{"id":"1106","title":"2019数列","score":15,"category":"逻辑题","description":["把 2019 各个数位上的数字 2、0、1、9 作为一个数列的前 4 项,用它们去构造一个无穷数列,其中第 n(>4)项是它前 4 项之和的个位数字。例如第 5 项为 2, 因为 2+0+1+9=12,个位数是 2。","本题就请你编写程序,列出这个序列的前 n 项。"],"input":"输入给出正整数 n(≤1000)。","output":"在一行中输出数列的前 n 项,数字间不要有空格。","samples":[{"input":"10","output":"2019224758","explanation":"","label":""}],"sampleInput":"10","sampleOutput":"2019224758","idea":["数组a[4]中始终保留前4项数字,如果n小于4,就输出前n项;如果n大于等于4,就先输出前四项,然后不断累加a[4]所有元素的值,并对10取余得到个位数字,输出后将a[4]替换为新的前4项方便下一次累加取余~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：数组a[4]中始终保留前4项数字,如果n小于4,就输出前n项;如果n大于等于4,就先输出前四项,然后不断累加a[4]所有元素的值,并对10取余得到个位数字,输出后将a[4]替换为新的前4项方便下一次累加取余\n\nusing namespace std;\nint n, sum, a[4] = {2, 0, 1, 9};\nint main() {\n   cin >> n;\n   for (int i = 0; i \u003c min(4, n); i++) cout \u003c\u003c a[i];\n   for (int i = 4; i \u003c n; i++) {\n      sum = (a[0] + a[1] + a[2] + a[3]) % 10;\n      cout \u003c\u003c sum;\n      a[0] = a[1], a[1] = a[2], a[2] = a[3], a[3] = sum;\n\n   }\n   return 0;\n}"},{"id":"1107","title":"老鼠爱大米","score":20,"category":"逻辑题","description":["翁恺老师曾经设计过一款 Java 挑战游戏,叫“老鼠爱大米”(或许因为他的外号叫“胖胖鼠”)。每个玩家用 Java 代码控制一只鼠,目标是抢吃尽可能多的大米让自己变成胖胖鼠,最胖的那只就是冠军。","因为游戏时间不能太长,我们把玩家分成 N 组,每组 M 只老鼠同场竞技,然后从 N 个分组冠军中直接选出最胖的冠军胖胖鼠。现在就请你写个程序来得到冠军的体重。"],"input":"输入在第一行中给出 2 个正整数:N(≤100)为组数,M(≤10)为每组玩家个数。随后 N 行,每行给4出一组玩家控制的 M 只老鼠最后的体重,均为不超过 10 的非负整数。数字间以空格分隔。","output":"首先在第一行顺次输出各组冠军的体重,数字间以 1 个空格分隔,行首尾不得有多余空格。随后在第二行输出冠军胖胖鼠的体重。","samples":[{"input":"3 5\n62 53 88 72 81\n12 31 9 0 2\n91 42 39 6 48","output":"88 31 91\n91","explanation":"","label":""}],"sampleInput":"3 5\n62 53 88 72 81\n12 31 9 0 2\n91 42 39 6 48","sampleOutput":"88 31 91\n91","idea":["d记录小组最胖老鼠,D记录总胖冠军鼠。直接取最大值就可以了~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：d记录小组最胖老鼠,D记录总胖冠军鼠\nusing namespace std;\n\nint n, m, t, d, D;\nint main() {\n   cin >> n >> m;\n   for (int i = 0; i \u003c n; i++) {\n      d = 0;\n\n      for (int j = 0; j \u003c m; j++) {\n         cin >> t;\n         d = max(d, t);\n      }\n      cout \u003c\u003c d \u003c\u003c ((i == n - 1) ? '\\n' : ' ');\n\n      D = max(D, d);\n   }\n   cout \u003c\u003c D;\n   return 0;\n}"},{"id":"1108","title":"String复读机","score":20,"category":"逻辑题","description":["4给定一个长度不超过 10 的、仅由英文字母构成的字符串。请将字符重新调整顺序,按 StringString.... (注意区分大小写)这样的顺序输出,并忽略其它字符。当然,六种字符的个数不一定是一样多的,若某种字符已经输出完,则余下的字符仍按 String 的顺序打印,直到所有字符都被输出。例如 gnirtSSs 要调整成 StringS 输出,其中 s 是多余字符被忽略。"],"input":"4输入在一行中给出一个长度不超过 10 的、仅由英文字母构成的非空字符串。","output":"在一行中按题目要求输出排序后的字符串。题目保证输出非空。","samples":[{"input":"sTRidlinSayBingStrropriiSHSiRiagIgtSSr","output":"StringStringSrigSriSiSii","explanation":"","label":""}],"sampleInput":"sTRidlinSayBingStrropriiSHSiRiagIgtSSr","sampleOutput":"StringStringSrigSriSiSii","idea":["字母的ASCII不会超过128,将输入的字符串in中所有字母出现的次数存储在数组a[128]中,然后重复遍历”String”字母,如果a数组中还有剩余某个对应字符就输出,并将该字符的剩余次数-1,flag =1表示这轮循环还有输出,直到不再有输出(flag == 0)为止~"],"keyPoints":["先把文字条件翻译成可判定的布尔表达式，再逐项排除非法情况。","无解、多解和边界输入通常需要单独分支处理。","输出必须与题目格式完全一致，尤其注意空格、换行、精度和前导零。"],"code":"#include \u003ciostream>\n\n// 解题关键：字母的ASCII不会超过128,将输入的字符串in中所有字母出现的次数存储在数组a[128]中,然后重复遍历”String”字母,如果a数组中还有剩余某个对应字符就输出,并将该字符的剩余次数-1,flag =1表示这轮循\nusing namespace std;\n\nstring s = \"String\", in;\nint a[200], flag = 1;\nint main() {\n   cin >> in;\n   for (auto it : in) a[it]++;\n   while (flag) {\n      flag = 0;\n      for (int i = 0; i \u003c 6; i++) {\n         if (a[s[i]]) {\n\n             cout \u003c\u003c s[i];\n             a[s[i]]--;\n             flag = 1;\n         }\n\n      }\n   }\n   return 0;\n}"},{"id":"1109","title":"擅长C","score":20,"category":"string字符串处理","description":["当你被面试官要求用 C 写一个“Hello World”时,有本事像下图显示的那样写一个出来吗?"],"input":"输入首先给出 26 个英文大写字母 A-Z,每个字母用一个 7×5 的、由 C 和. 组成的矩阵构成。最后在一行中给出一个句子,以回车结束。句子是由若干个单词(每个包含不超过 10 个连续的大写英文字母)组成的,单词间以任何非大写英文字母分隔。\n\n题目保证至少给出一个单词。","output":"对每个单词,将其每个字母用矩阵形式在一行中输出,字母间有一列空格分隔。单词的首尾不得有多余空格。\n\n相邻的两个单词间必须有一空行分隔。输出的首尾不得有多余空行。","samples":[{"input":"..C..\n.C.C.\nC...C\nCCCCC\nC...C\nC...C\nC...C\nCCCC.\nC...C\nC...C\nCCCC.\nC...C\nC...C\nCCCC.\n.CCC.\nC...C\nC....\nC....\nC....\nC...C\n.CCC.\nCCCC.\nC...C\nC...C\nC...C\nC...C\nC...C\nCCCC.\nCCCCC\nC....\nC....\nCCCC.\nC....\nC....\nCCCCC\nCCCCC\nC....\nC....\nCCCC.\nC....\nC....\nC....\nCCCC.\nC...C\nC....\nC.CCC\nC...C\nC...C\nCCCC.\nC...C\nC...C\nC...C\nCCCCC\nC...C\nC...C\nC...C\nCCCCC\n..C..\n..C..\n..C..\n..C..\n..C..\nCCCCC\nCCCCC\n....C\n....C\n....C\n....
