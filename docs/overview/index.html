    .overview-notes a:hover { color:var(--doki-accent); text-decoration:underline; }
    .overview-empty { margin:0; padding:8px 10px; color:var(--doki-muted); background:var(--doki-accent-soft); font-size:13px; }
    #rightside { display:none; }
