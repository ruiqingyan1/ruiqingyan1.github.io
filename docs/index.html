      })
    })
  })

  const homeArticle = {
    title: '知识库首页',
    path: payload.homePath,
    sectionLabel: '知识库',
    topicLabel: '全部内容',
    source: '汇总',
    updated: ''
  }
  articles.set(normalizePath(payload.homePath), homeArticle)

  const shell = document.querySelector('.doc-shell')
  const tree = document.querySelector('[data-doc-tree]')
  const homeButton = document.querySelector('[data-doc-home]')
  const search = document.querySelector('[data-doc-search]')
  const siteSearch = document.querySelector('[data-doc-site-search]')
  const title = document.querySelector('[data-doc-title]')
  const meta = document.querySelector('[data-doc-meta]')
  const toolbar = document.querySelector('.doc-toolbar')
  const controls = document.querySelector('[data-doc-controls]')
  const settingsToggle = document.querySelector('[data-doc-settings-toggle]')
  const articleFrame = document.querySelector('[data-doc-article-frame]')
  const THEME_KEY = 'ruiqy.daily.doki-theme.v1'
  let currentPath = ''
  let asideWasHiddenBeforeFocus = false

  function normalizePath(path) {
    if (!path) return '/'
    let next = String(path)
    if (next.startsWith(location.origin)) next = next.slice(location.origin.length)
    next = next.split('#')[0].split('?')[0]
    if (!next.startsWith('/')) next = '/' + next
    next = next.replace(/index\.html$/, '')
    next = next.replace(/\.html$/, '/')
    if (!next.endsWith('/')) next += '/'
    return next
  }

  function articleFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ''))
    if (!raw || normalizePath(raw) === '/overview/') return homeArticle
    return articles.get(normalizePath(raw))
  }

  function hashPathFor(path) {
    return normalizePath(path) === normalizePath(payload.homePath) ? '/overview/' : normalizePath(path)
  }

  function getFrameDocument() {
    try {
      return articleFrame.contentDocument || null
    } catch (error) {
      return null
    }
  }

  function getFramePath() {
    try {
      return normalizePath(articleFrame.contentWindow.location.pathname)
    } catch (error) {
      return '/'
    }
  }

  function getFrameUrl() {
    try {
      return new URL(articleFrame.contentWindow.location.href)
    } catch (error) {
      return null
    }
  }

  function leaveKnowledgeBase(url) {
    if (!url) return
    const destination = url.origin === location.origin
      ? url.pathname + url.search + url.hash
      : url.href
    window.location.assign(destination)
  }

  function bindEmbeddedNavigation(frameDoc) {
    if (!frameDoc || frameDoc.__studyDocsNavigationBound) return
    frameDoc.__studyDocsNavigationBound = true

    frameDoc.addEventListener('click', event => {
      const link = event.target.closest && event.target.closest('a[href]')
      if (!link || event.defaultPrevented || event.button !== 0) return
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return
      if (link.hasAttribute('download') || link.target === '_blank') return

      const href = link.getAttribute('href')
      if (!href || href.startsWith('#') || /^(javascript:|mailto:|tel:)/i.test(href)) return

      let targetUrl
      try {
        targetUrl = new URL(link.href, location.origin)
      } catch (error) {
        return
      }

      if (targetUrl.origin !== location.origin) return
      if (articles.has(normalizePath(targetUrl.pathname))) return

      event.preventDefault()
      leaveKnowledgeBase(targetUrl)
    }, true)
  }

  function applyThemeToFrame(frameDoc) {
    if (!frameDoc || !frameDoc.documentElement) return
    let theme = document.documentElement.getAttribute('data-doki-theme')
    if (!theme) {
      try {
        theme = localStorage.getItem(THEME_KEY)
      } catch (error) {}
    }
    theme = theme || 'emilia-light'
    frameDoc.documentElement.setAttribute('data-doki-theme', theme)
    if (frameDoc.body) frameDoc.body.setAttribute('data-doki-theme', theme)
  }

  function setActive(path) {
    const normalized = normalizePath(path)
    let activeButton = null

    homeButton.classList.toggle('is-active', normalized === normalizePath(payload.homePath))
    homeButton.setAttribute('aria-current', normalized === normalizePath(payload.homePath) ? 'page' : 'false')

    document.querySelectorAll('.doc-link').forEach(button => {
      const active = normalizePath(button.dataset.path) === normalized
      button.classList.toggle('is-active', active)
      button.setAttribute('aria-current', active ? 'true' : 'false')
      if (active) activeButton = button
    })

    if (!activeButton) return

    const activeTopic = activeButton.closest('.doc-topic')
    const activeSection = activeButton.closest('.doc-section')
    if (activeTopic) activeTopic.open = true
    if (activeSection) activeSection.open = true

    window.requestAnimationFrame(() => {
      window.requestAnimationFrame(() => {
        const itemRect = activeButton.getBoundingClientRect()
        const treeRect = tree.getBoundingClientRect()
        const above = itemRect.top < treeRect.top
        const below = itemRect.bottom > treeRect.bottom

        if (!above && !below) return

        const targetTop = tree.scrollTop + itemRect.top - treeRect.top - (treeRect.height / 2) + (itemRect.height / 2)
        const maxTop = Math.max(tree.scrollHeight - tree.clientHeight, 0)
        tree.scrollTop = Math.max(0, Math.min(targetTop, maxTop))
      })
    })
  }

  function renderChrome(article) {
    title.textContent = article.title
    meta.textContent = article.sectionLabel + ' · ' + article.topicLabel + ' · ' + article.source + (article.updated ? ' · ' + article.updated : '')
    document.title = article.title + ' - ' + payload.title
  }

  function buttonFor(action) {
    return controls.querySelector('[data-doc-action="' + action + '"]')
  }

  function labelFor(action) {
    return controls.querySelector('[data-doc-label="' + action + '"]')
  }

  function syncControlState() {
    const frameDoc = getFrameDocument()
    const isFocus = shell.classList.contains('is-focus')
    const translateButton = frameDoc && frameDoc.getElementById('translateLink')
    const currentEncoding = translateButton && translateButton.textContent.trim()

    labelFor('fullscreen').textContent = document.fullscreenElement ? '退出全屏' : '全屏'
    labelFor('translate').textContent = currentEncoding || '繁'
    labelFor('focus').textContent = isFocus ? '退出宽屏' : '宽屏'
    buttonFor('focus').classList.toggle('is-active', isFocus)
    buttonFor('focus').setAttribute('aria-pressed', isFocus ? 'true' : 'false')
  }

  function prepareEmbeddedPage() {
    const frameDoc = getFrameDocument()
    if (!frameDoc) return

    let embeddedStyle = frameDoc.getElementById('studyDocsEmbedStyle')
    if (!embeddedStyle) {
      embeddedStyle = frameDoc.createElement('style')
      embeddedStyle.id = 'studyDocsEmbedStyle'
      embeddedStyle.textContent = [
        'html.study-docs-embed, html.study-docs-embed body { background: var(--doki-bg) !important; color: var(--doki-text) !important; }',
        'html.study-docs-embed #web_bg { background: var(--doki-bg) !important; background-image: none !important; }',
        'html.study-docs-embed #page-header.post-bg { height: 158px !important; border-radius: 0 !important; background: var(--doki-card-strong) !important; background-image: none !important; box-shadow: inset 0 -1px 0 var(--doki-line) !important; }',
        'html.study-docs-embed #page-header #nav { display: none !important; }',
        'html.study-docs-embed #page-header #post-info, html.study-docs-embed #page-header #post-info * { color: var(--doki-text) !important; text-shadow: none !important; }',
        'html.study-docs-embed #page-header #post-info { top: 72px !important; bottom: auto !important; padding-right: 28px !important; padding-left: 288px !important; text-align: left !important; transform: none !important; }',
        'html.study-docs-embed #page-header #post-info .post-title { font-size: 24px !important; line-height: 1.25 !important; }',
        'html.study-docs-embed.knowledge-overview #page-header { display: none !important; }',
        'html.study-docs-embed.knowledge-overview #page-header #post-info { display: none !important; }',
        'html.study-docs-embed #content-inner.layout { width: calc(100% - 288px) !important; max-width: none !important; margin: 24px 18px 36px 270px !important; }',
        'html.study-docs-embed.knowledge-overview #content-inner.layout { margin-top: 78px !important; }',
        'html.study-docs-embed #post, html.study-docs-embed #page { border: 1px solid var(--doki-line) !important; background: var(--doki-card) !important; box-shadow: var(--doki-shadow) !important; }',
        'html.study-docs-embed .doki-global-tools { display: none !important; }',
        'html.study-docs-embed.study-docs-focus #page-header #post-info { padding-left: 7% !important; }',
        'html.study-docs-embed.study-docs-focus #content-inner.layout { width: calc(100% - 40px) !important; max-width: 1200px !important; margin: 24px auto 36px !important; }',
        '@media (max-width: 900px) { html.study-docs-embed #page-header.post-bg { height: 150px !important; } html.study-docs-embed #page-header #post-info { top: 70px !important; padding-right: 18px !important; padding-left: 18px !important; } html.study-docs-embed #page-header #post-info .post-title { font-size: 21px !important; } html.study-docs-embed #content-inner.layout { width: calc(100% - 24px) !important; margin: 16px 12px 28px !important; } html.study-docs-embed.knowledge-overview #content-inner.layout { margin-top: 72px !important; } }'
      ].join('\n')
      frameDoc.head.appendChild(embeddedStyle)
    }

    applyThemeToFrame(frameDoc)
    frameDoc.documentElement.classList.add('study-docs-embed')
    frameDoc.documentElement.classList.toggle('study-docs-focus', shell.classList.contains('is-focus'))

    const originalControls = frameDoc.getElementById('rightside')
    if (originalControls) originalControls.style.display = 'none'

    const chatWidget = frameDoc.getElementById('chatra')
    if (chatWidget) chatWidget.style.setProperty('display', 'none', 'important')

    if (shell.classList.contains('is-focus')) {
      frameDoc.documentElement.classList.add('hide-aside')
    }

    bindEmbeddedNavigation(frameDoc)
    syncControlState()
  }

  function clickFrameControl(id) {
    const frameDoc = getFrameDocument()
    const control = frameDoc && frameDoc.getElementById(id)
    if (!control) return false
    control.click()
    window.setTimeout(syncControlState, 120)
    return true
  }

  function setFocusMode(enable) {
    const frameDoc = getFrameDocument()

    if (enable && frameDoc) {
      asideWasHiddenBeforeFocus = frameDoc.documentElement.classList.contains('hide-aside')
    }

    shell.classList.toggle('is-focus', enable)

    if (frameDoc) {
      frameDoc.documentElement.classList.toggle('study-docs-focus', enable)
      if (enable) frameDoc.documentElement.classList.add('hide-aside')
      else if (!asideWasHiddenBeforeFocus) frameDoc.documentElement.classList.remove('hide-aside')
    }

    syncControlState()
  }

  function handleFrameLoad() {
    const embeddedPath = getFramePath()
    const embeddedArticle = articles.get(embeddedPath)

    if (!embeddedArticle) {
      const embeddedUrl = getFrameUrl()
      if (embeddedUrl && embeddedUrl.origin === location.origin) leaveKnowledgeBase(embeddedUrl)
      return
    }

    currentPath = embeddedPath
    renderChrome(embeddedArticle)
    setActive(embeddedPath)

    if (normalizePath(location.hash.replace(/^#/, '')) !== normalizePath(hashPathFor(embeddedPath))) {
      history.replaceState(null, '', '#' + hashPathFor(embeddedPath))
    }

    prepareEmbeddedPage()
  }

  function loadArticle(article, options = {}) {
    if (!article) return
    const path = normalizePath(article.path)
    const shouldPush = options.push !== false

    currentPath = path
    renderChrome(article)
    setActive(path)

    if (shouldPush && normalizePath(location.hash.replace(/^#/, '')) !== normalizePath(hashPathFor(path))) {
      history.pushState(null, '', '#' + hashPathFor(path))
    }

    if (getFramePath() === path) {
      prepareEmbeddedPage()
      return
    }

    articleFrame.src = path
  }

  function handleSearch() {
    const query = search.value.trim().toLowerCase()
    document.querySelectorAll('.doc-section').forEach(section => {
      let visibleTopics = 0

      section.querySelectorAll('.doc-topic').forEach(topic => {
        const topicMatched = !query || topic.dataset.topicSearch.includes(query)
        let visibleItems = 0

        topic.querySelectorAll('.doc-item').forEach(item => {
          const matched = topicMatched || !query || item.dataset.search.includes(query)
          item.classList.toggle('doc-hidden', !matched)
          if (matched) visibleItems += 1
        })

        const visible = topicMatched || visibleItems > 0
        topic.classList.toggle('doc-hidden', !visible)
        if (query && visible) topic.open = true
        if (visible) visibleTopics += 1
      })

      section.classList.toggle('doc-hidden', visibleTopics === 0)
      if (query && visibleTopics > 0) section.open = true
    })
  }

  tree.addEventListener('click', event => {
    if (event.target.closest('[data-doc-home]')) {
      loadArticle(homeArticle)
      return
    }
    const button = event.target.closest('.doc-link')
    if (!button) return
    loadArticle(articles.get(normalizePath(button.dataset.path)))
  })

  document.querySelectorAll('[data-doc-home-link]').forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault()
      loadArticle(homeArticle)
    })
  })

  controls.addEventListener('click', async event => {
    const button = event.target.closest('[data-doc-action]')
    if (!button) return

    const action = button.dataset.docAction

    if (action === 'fullscreen') {
      try {
        if (document.fullscreenElement) await document.exitFullscreen()
        else await document.documentElement.requestFullscreen()
      } catch (error) {}
      syncControlState()
      return
    }

    if (action === 'translate') {
      clickFrameControl('translateLink')
      return
    }

    if (action === 'focus') {
      setFocusMode(!shell.classList.contains('is-focus'))
    }
  })

  settingsToggle.addEventListener('click', () => {
    const open = !toolbar.classList.contains('is-open')
    toolbar.classList.toggle('is-open', open)
    settingsToggle.setAttribute('aria-expanded', open ? 'true' : 'false')
    settingsToggle.setAttribute('aria-label', open ? '收起阅读设置' : '展开阅读设置')
  })

  document.addEventListener('click', event => {
    if (!toolbar.classList.contains('is-open') || toolbar.contains(event.target)) return
    toolbar.classList.remove('is-open')
    settingsToggle.setAttribute('aria-expanded', 'false')
    settingsToggle.setAttribute('aria-label', '展开阅读设置')
  })

  articleFrame.addEventListener('load', handleFrameLoad)
  search.addEventListener('input', handleSearch)
  if (siteSearch) {
    siteSearch.addEventListener('click', () => {
      search.focus()
      search.select()
    })
  }
  document.addEventListener('fullscreenchange', syncControlState)
  window.addEventListener('popstate', () => {
    loadArticle(articleFromHash() || homeArticle, { push: false })
  })

  new MutationObserver(() => {
    applyThemeToFrame(getFrameDocument())
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-doki-theme'] })

  loadArticle(articleFromHash() || homeArticle, { push: false })
})()
</script>
  <script src="/js/shared-blog-header@1.0.0.js?v=1.1.1"></script>
  <script src="/js/doki-global-theme@1.0.0.js?v=1.2.0"></script>
